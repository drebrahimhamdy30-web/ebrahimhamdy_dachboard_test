<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>معاملات الفيزا - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .visa-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
    .visa-header-left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .visa-header-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .lookup-bar { display:flex; align-items:center; gap:6px; background:var(--surface-3); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:6px 10px; }
    .lookup-bar input { border:none; background:transparent; outline:none; font-family:var(--font); font-size:0.85rem; width:130px; color:var(--text-primary); }
    .lookup-bar input::placeholder { color:var(--text-muted); }
    .lookup-btn { background:var(--accent); color:var(--primary); border:none; border-radius:var(--radius-sm); padding:5px 12px; font-family:var(--font); font-size:0.8rem; font-weight:700; cursor:pointer; white-space:nowrap; transition:background 0.15s; }
    .lookup-btn:hover { background:var(--accent-dark); color:#fff; }
    .lookup-btn:disabled { background:var(--surface-3); color:var(--text-muted); cursor:not-allowed; }
    .tabs-bar { display:flex; gap:6px; flex-wrap:wrap; }
    .tab-btn { padding:7px 16px; border-radius:20px; border:1px solid var(--border); background:var(--surface-3); color:var(--text-secondary); font-size:0.82rem; cursor:pointer; transition:all 0.2s; font-family:var(--font); }
    .tab-btn.active { background:var(--accent); color:var(--primary); border-color:var(--accent); font-weight:700; }
    .machine-summary { display:flex; flex-wrap:nowrap; gap:8px; flex:1; }
    .machine-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:8px 14px; position:relative; overflow:hidden; flex:1; }
    .machine-card::before { content:''; position:absolute; top:0; right:0; width:3px; height:100%; background:var(--accent); }
    .machine-card .mc-name { font-size:0.68rem; font-weight:700; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .machine-card .mc-total { font-size:0.92rem; font-weight:900; color:#dc2626; line-height:1.2; }
    .machine-card .mc-bill  { font-size:0.78rem; font-weight:700; color:var(--accent-dark); }
    .machine-card .mc-count { font-size:0.62rem; color:var(--text-muted); }
    .editable-cell { cursor:pointer; padding:4px 6px; border-radius:4px; transition:background 0.15s; min-width:60px; display:inline-block; }
    .editable-cell:hover { background:var(--surface-3); }
    .cell-input { background:var(--surface-3); border:1.5px solid var(--accent); border-radius:4px; color:var(--text-primary); font-family:var(--font); font-size:0.82rem; padding:3px 6px; width:100%; outline:none; }
    .cell-select { background:var(--surface-3); border:1.5px solid var(--accent); border-radius:4px; color:var(--text-primary); font-family:var(--font); font-size:0.82rem; padding:3px 4px; outline:none; }
    .status-pending { background:#fef9c3; color:#a16207; }
    .status-posted  { background:#dcfce7; color:#15803d; }
    .search-wrap { position:relative; min-width:200px; flex:1; max-width:280px; }
    .search-wrap i { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem; pointer-events:none; }
    .search-wrap input { padding-right:34px; }
    .lookup-msg { font-size:0.75rem; padding:3px 8px; border-radius:20px; font-weight:600; display:none; }
    .lookup-msg.ok      { background:#dcfce7; color:#15803d; display:inline-block; }
    .lookup-msg.err     { background:#fee2e2; color:#b91c1c; display:inline-block; }
    .lookup-msg.loading { background:#e0f2fe; color:#0369a1; display:inline-block; }
    .ref-badge { display:inline-block; background:#ede9fe; color:#6d28d9; border-radius:20px; padding:1px 8px; font-size:0.65rem; font-weight:700; }
    .split-badge { display:inline-block; background:#ffedd5; color:#c2410c; border-radius:20px; padding:1px 6px; font-size:0.62rem; font-weight:700; }
    .total-bar { display:flex; gap:16px; flex-wrap:wrap; padding:10px 0; font-size:0.88rem; font-weight:700; }
    .pm-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:99999; align-items:center; justify-content:center; }
    .pm-modal { background:#1e293b; border:2px solid #334155; border-radius:16px; padding:22px; width:92%; max-width:540px; direction:rtl; font-family:var(--font); box-shadow:0 20px 60px rgba(0,0,0,0.6); max-height:88vh; overflow-y:auto; }
    .pm-modal h3 { color:#f1f5f9; font-size:1rem; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
    .pm-trx-row { display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface-3); border:1.5px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:all 0.15s; }
    .pm-trx-row:hover { border-color:var(--accent); background:#0f172a; }
    .pm-trx-info { font-size:0.82rem; color:var(--text-primary); line-height:1.7; }
    .pm-trx-amount { font-size:1rem; font-weight:900; color:var(--warning); white-space:nowrap; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">

      <div class="visa-header">
        <div class="visa-header-left">
          <div class="page-title" style="margin:0;">
            <i class="fas fa-credit-card"></i> معاملات الفيزا
            <span class="highlight" id="display-branch">...</span>
          </div>
        </div>
        <div class="visa-header-right">
          <div class="lookup-bar">
            <i class="fas fa-barcode" style="color:var(--text-muted);font-size:0.85rem;"></i>
            <input type="text" id="lookup-input" placeholder="رقم الفاتورة..."
              inputmode="numeric" onkeydown="if(event.key==='Enter') lookupAndAdd()">
            <span id="lookup-msg" class="lookup-msg"></span>
            <button class="lookup-btn" id="lookup-btn" onclick="lookupAndAdd()">
              <i class="fas fa-plus"></i> إضافة
            </button>
          </div>
          <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="form-input" placeholder="بحث... (±3%)" oninput="applyFilter()">
          </div>
          <button class="btn btn-primary" onclick="loadAll()"><i class="fas fa-sync-alt"></i></button>
        </div>
      </div>

      <div class="tabs-bar" style="margin-bottom:10px;">
        <button class="tab-btn active" onclick="switchTab('pending', this)">⏳ لم يُرحَّل</button>
        <button class="tab-btn" onclick="switchTab('posted', this)">✅ مرحَّل</button>
        <button class="tab-btn" onclick="switchTab('all', this)">📋 الكل</button>
        <button class="tab-btn" style="border-color:#f59e0b;color:#b45309;" onclick="switchTab('extra', this)">⚠️ زيادات</button>
        <button class="tab-btn" style="border-color:#dc2626;color:#dc2626;" onclick="switchTab('return', this)">↩️ مرتجعات</button>
      </div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <div class="machine-summary" id="machine-summary-wrap"></div>
        <div id="bulk-post-wrap"></div>
      </div>

      <div style="background:var(--surface-3);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:0.72rem;font-weight:700;color:var(--text-muted);white-space:nowrap;"><i class="fas fa-filter" style="color:var(--accent);"></i> فلاتر:</span>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;">
            <span id="machine-filter-label" style="font-size:0.75rem;font-weight:700;color:var(--text-secondary);white-space:nowrap;"><i class="fas fa-credit-card"></i> ماكينة:</span>
            <select id="machineFilter" class="form-select" style="width:auto;font-size:0.78rem;" onchange="applyFilter()">
              <option value="all">كل الماكينات</option>
            </select>
            <label id="no-machine-label" style="display:flex;align-items:center;gap:4px;font-size:0.75rem;font-weight:700;color:var(--danger);cursor:pointer;background:#fee2e2;border-radius:20px;padding:3px 8px;">
              <input type="checkbox" id="noMachineFilter" onchange="applyFilter()" style="width:13px;height:13px;accent-color:var(--danger);">
              بدون ماكينة
            </label>
            <span id="extra-filter-label" style="display:none;font-size:0.75rem;font-weight:700;color:var(--text-secondary);">الحالة:</span>
            <select id="extraStatusFilter" class="form-select" style="width:auto;font-size:0.78rem;display:none;" onchange="applyFilter()">
              <option value="all">الكل</option>
              <option value="no_machine">بدون ماكينة</option>
              <option value="pending">لم يُرحَّل</option>
              <option value="posted">مرحَّل</option>
            </select>
            <div style="display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 8px;">
              <i class="fas fa-hashtag" style="font-size:0.68rem;color:var(--text-muted);"></i>
              <input type="text" id="refFilter" class="form-input" style="width:90px;border:none;background:transparent;padding:0;font-size:0.78rem;" placeholder="رقم الترحيلة" oninput="applyFilter()">
            </div>
            <div style="display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 8px;">
              <i class="fas fa-calendar" style="font-size:0.68rem;color:var(--text-muted);"></i>
              <input type="date" id="saveDateFilter" class="form-input" style="width:130px;border:none;background:transparent;padding:0;font-size:0.78rem;" onchange="applyFilter()">
            </div>
            <button style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:0.72rem;color:var(--text-muted);cursor:pointer;" onclick="clearFilters()">
              <i class="fas fa-times"></i> مسح
            </button>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>رقم الفاتورة</th>
              <th>التاريخ</th>
              <th>كود العميل</th>
              <th>اسم العميل</th>
              <th>إجمالي الفاتورة</th>
              <th>صافي الفيزا</th>
              <th>تقسيم</th>
              <th>الماكينة</th>
              <th>الموظف</th>
              <th>تاريخ الحفظ</th>
              <th>رقم الترحيلة</th>
              <th>الحالة</th>
              <th>ترحيل</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="13">⏳ جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="total-bar" id="total-bar"></div>

    </div>
  </div>

  <!-- Modal باي موب -->
  <div class="pm-modal-overlay" id="pm-modal-overlay">
    <div class="pm-modal">
      <h3><i class="fas fa-link"></i> اختر معاملة باي موب المطابقة</h3>
      <div id="pm-modal-info" style="font-size:0.82rem;color:var(--text-muted);margin-bottom:12px;"></div>
      <div id="pm-modal-list"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px;">
        <button class="btn" style="background:#334155;color:#94a3b8;border:none;" onclick="closePmModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="nav.js" defer></script>
  <script>
    const BRANCH_MAP = {
      'المعمورة':    'الصيدلية',
      'سان ستيفانو': 'ابراهيم حمدي 2',
      'سيدى بشر':   'ابراهيم حمدي 3',
    };
    const LOOKUP_TYPE = {
      'المعمورة':    'bill_lookup_mamora',
      'سان ستيفانو': 'bill_lookup_san',
      'سيدى بشر':   'bill_lookup_bishr',
    };

    let activeUser   = null;
    let userBranch   = '';
    let allData      = [];
    let machinesList = [];
    let machineObjs  = [];
    let currentTab   = 'pending';

    checkAuth().then(async user => {
      activeUser = user;
      if (user) {
        userBranch = (localStorage.getItem('userBranch') || '').trim();
        document.getElementById('display-branch').textContent = userBranch;
        await populateMachineDropdowns();
        await loadAll();
      }
    });

    function branchMachines() { return machinesList; }

    function terminalOf(machineName) {
      const m = machineObjs.find(x => String(x.machine_name||'').trim() === String(machineName||'').trim());
      const t = m ? String(m.terminal_id||'').trim() : '';
      return t && t !== 'null' ? t : '';
    }
    function isPaymobMachine(machineName) { return !!terminalOf(machineName); }

    async function populateMachineDropdowns() {
      try {
        const resp   = await fetchMachines();
        const mapped = BRANCH_MAP[userBranch] || userBranch;
        machineObjs  = (Array.isArray(resp)?resp:[]).filter(m => String(m.store_name||'').trim() === mapped);
        machinesList = machineObjs.map(m => m.machine_name);
      } catch(e) { machineObjs=[]; machinesList=[]; }
      const mf = document.getElementById('machineFilter');
      mf.innerHTML = '<option value="all">كل الماكينات</option>';
      machinesList.forEach(m => {
        const o = document.createElement('option');
        o.value = m; o.textContent = m; mf.appendChild(o);
      });
    }

    async function loadAll() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="13">⏳ جاري جلب البيانات...</td></tr>';
      try {
        const resp   = await fetchVisaTransactions();
        const mapped = BRANCH_MAP[userBranch] || userBranch;
        allData = (Array.isArray(resp)?resp:[]).filter(item => String(item.store_name||'').trim() === mapped);
        applyFilter();
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;color:var(--danger);padding:30px;">❌ فشل الاتصال</td></tr>';
      }
    }

    function getNextRef() {
      return allData.reduce((max,item) => Math.max(max, parseInt(item.bill_notes)||0), 0) + 1;
    }

    async function postAndReturn(data) {
      try {
        const r = await fetch('https://agent.ebrahimhamdy.com/webhook/taskmanagement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        if(!r.ok) return null;
        const res = await r.json();
        return Array.isArray(res) ? res[0] : res;
      } catch(e){ return null; }
    }

    function setLookupMsg(text, type) {
      const el = document.getElementById('lookup-msg');
      el.textContent = text; el.className = 'lookup-msg ' + type;
    }

    async function lookupAndAdd() {
      const billNo = document.getElementById('lookup-input').value.trim();
      if (!billNo) { alert('أدخل رقم الفاتورة'); return; }
      const lookupType = LOOKUP_TYPE[userBranch];
      if (!lookupType) { alert('الفرع غير محدد'); return; }

      const btn = document.getElementById('lookup-btn');

      const exists = allData.find(i => String(i.bill_no) === String(billNo));
      if (exists) {
        const hasMachine = exists.machine_name && exists.machine_name !== 'null' && exists.machine_name !== '';
        if (!hasMachine) {
          setLookupMsg('لازم تختار ماكينة للفاتورة الأصلية أولاً', 'err');
          btn.disabled=false; btn.innerHTML='<i class="fas fa-plus"></i> إضافة';
          setTimeout(()=>{ const el=document.getElementById('lookup-msg'); if(el){el.textContent='';el.className='lookup-msg';} },4000);
          return;
        }
        if (confirm(`الفاتورة ${billNo} موجودة بالفعل.\nهل تريد إنشاء مرتجع بقيمة ${parseFloat(exists.total_bill_net||0).toFixed(2)} جنيه؟`)) {
          const returnBillNo = '0' + billNo;
          const alreadyReturn = allData.find(i => String(i.bill_no) === String(returnBillNo));
          if (alreadyReturn) {
            setLookupMsg('المرتجع موجود بالفعل', 'err');
            btn.disabled=false; btn.innerHTML='<i class="fas fa-plus"></i> إضافة';
            setTimeout(()=>{ const el=document.getElementById('lookup-msg'); if(el){el.textContent='';el.className='lookup-msg';} },4000);
            return;
          }
          const success = await updateData({
            type: 'visa_insert', store_name: BRANCH_MAP[userBranch]||userBranch,
            bill_no:       returnBillNo,
            bill_date:     exists.bill_date     || null,
            cust_code:     exists.cust_code     || null,
            cust_name_ar:  exists.cust_name_ar  || null,
            total_bill:    parseFloat(exists.total_bill||0),
            total_bill_net:parseFloat(exists.total_bill_net||0),
            machine_name:  exists.machine_name,
            employee_name: exists.employee_name || null,
            bill_save_date:null,
            bill_notes:    null,
            bill_status:   'مرتجع',
            split_amount:  exists.split_amount  || null
          });
          if (success) { setLookupMsg('✅ تم إنشاء المرتجع', 'ok'); document.getElementById('lookup-input').value=''; await loadAll(); }
          else setLookupMsg('فشل إنشاء المرتجع', 'err');
        } else {
          setLookupMsg('موجودة بالفعل ✋', 'err');
        }
        btn.disabled=false; btn.innerHTML='<i class="fas fa-plus"></i> إضافة';
        setTimeout(()=>{ const el=document.getElementById('lookup-msg'); if(el){el.textContent='';el.className='lookup-msg';} },4000);
        return;
      }

      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      setLookupMsg('جاري البحث...', 'loading');

      try {
        const bill = await postAndReturn({ type: lookupType, bill_no: billNo });
        if (!bill || !bill.bill_no) { setLookupMsg('مش موجودة في السيستم','err'); btn.disabled=false; btn.innerHTML='<i class="fas fa-plus"></i> إضافة'; return; }
        if (bill.bill_type && bill.bill_type !== 'فيزا') { setLookupMsg('الفاتورة مش فيزا','err'); btn.disabled=false; btn.innerHTML='<i class="fas fa-plus"></i> إضافة'; return; }
        const success = await updateData({
          type:'visa_insert', store_name:BRANCH_MAP[userBranch]||userBranch,
          bill_no:bill.bill_no, bill_date:bill.bill_date||null,
          cust_code:bill.cust_code||null, cust_name_ar:bill.cust_name_ar||null,
          total_bill:bill.total_bill||0, total_bill_net:bill.total_bill_net||0,
          machine_name:null, employee_name:bill.employee_name||null,
          bill_save_date:null, bill_notes:null, bill_status:'لم يُرحَّل', split_amount:null
        });
        if (success) { setLookupMsg('✅ تمت الإضافة','ok'); document.getElementById('lookup-input').value=''; await loadAll(); }
        else { setLookupMsg('فشل الحفظ','err'); }
      } catch(e) { setLookupMsg('خطأ في الاتصال','err'); }

      btn.disabled=false; btn.innerHTML='<i class="fas fa-plus"></i> إضافة';
      setTimeout(()=>{ const el=document.getElementById('lookup-msg'); if(el){el.textContent='';el.className='lookup-msg';} },4000);
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const isExtra=(tab==='extra');
      const isReturn=(tab==='return');
      document.getElementById('machineFilter').style.display        = (isExtra||isReturn)?'none':'';
      document.getElementById('machine-filter-label').style.display = (isExtra||isReturn)?'none':'';
      document.getElementById('no-machine-label').style.display     = (isExtra||isReturn)?'none':'flex';
      document.getElementById('extraStatusFilter').style.display    = isExtra?'':'none';
      document.getElementById('extra-filter-label').style.display   = isExtra?'':'none';
      applyFilter();
    }

    function matchSearch(item, search) {
      const num = parseFloat(search);
      if (!isNaN(num) && num > 0) {
        const low=num*0.97, high=num*1.03;
        const split=parseFloat(item.split_amount)||0;
        const net=parseFloat(item.total_bill_net)||0;
        if ([item.total_bill, net, net-split, split].some(v=>{const x=parseFloat(v);return !isNaN(x)&&x>=low&&x<=high;})) return true;
      }
      return [item.bill_no,item.cust_code,item.cust_name_ar,item.machine_name,item.employee_name,item.store_name,item.bill_notes,item.bill_status,item.bill_date]
        .some(v=>String(v||'').toLowerCase().includes(search));
    }

    function applyFilter() {
      const search=document.getElementById('searchInput').value.trim().toLowerCase();
      const machine=document.getElementById('machineFilter').value;
      const extraStatus=document.getElementById('extraStatusFilter').value;
      const noMachine=document.getElementById('noMachineFilter').checked;
      const refFilter=document.getElementById('refFilter').value.trim();
      const saveDateF=document.getElementById('saveDateFilter').value;

      const filtered = allData.filter(item => {
        const isPosted=(item.bill_status==='مرحَّل'||item.bill_status==='posted'||item.bill_status==='مرتجع-مرحَّل');
        const isExtra=(item.bill_status==='زيادة');
        const isReturn=(item.bill_status==='مرتجع'||item.bill_status==='مرتجع-مرحَّل');
        const hasMachine=item.machine_name&&item.machine_name!=='null'&&item.machine_name!=='';
        if(currentTab==='return') { if(!isReturn) return false; return !search||matchSearch(item,search); }
        if(currentTab==='extra') {
          if(!isExtra) return false;
          if(extraStatus==='no_machine'&&hasMachine) return false;
          if(extraStatus==='pending'&&(isPosted||hasMachine)) return false;
          if(extraStatus==='posted'&&!isPosted) return false;
          return !search||matchSearch(item,search);
        }
        if(isExtra) return false;
        // المرتجعات تظهر مع المعاملات العادية في pending وposted
        if(currentTab==='pending'&&isPosted) return false;
        if(currentTab==='posted'&&!isPosted) return false;
        if(noMachine&&hasMachine) return false;
        if(!noMachine&&machine!=='all'&&String(item.machine_name||'').trim()!==machine) return false;
        if(refFilter&&String(item.bill_notes||'')!==refFilter) return false;
        if(saveDateF&&item.bill_save_date&&!item.bill_save_date.startsWith(saveDateF)) return false;
        return !search||matchSearch(item,search);
      });

      renderMachineSummary(filtered);
      renderTable(filtered);
    }

    function renderMachineSummary(items) {
      const wrap=document.getElementById('machine-summary-wrap');
      const bulkWrap=document.getElementById('bulk-post-wrap');
      if(currentTab!=='pending'){wrap.innerHTML='';bulkWrap.innerHTML='';return;}
      const machines=branchMachines();
      if(!machines.length){wrap.innerHTML='';bulkWrap.innerHTML='';return;}

      const totals={};
      machines.forEach(m=>{totals[m]={sum:0,bill:0,count:0};});

      items.forEach(item=>{
        if(item.bill_status==='مرتجع'||item.bill_status==='مرتجع-مرحَّل') return;
        const m=String(item.machine_name||'').trim();
        if(totals[m]!==undefined){
          totals[m].sum  += (parseFloat(item.total_bill_net)||0) + (parseFloat(item.split_amount)||0);
          totals[m].bill += parseFloat(item.total_bill)||0;
          totals[m].count++;
        }
      });

      const saveDateF=document.getElementById('saveDateFilter').value;
      const refFilter=document.getElementById('refFilter').value.trim();
      allData.filter(x=>{
        if(x.bill_status!=='مرتجع'&&x.bill_status!=='مرتجع-مرحَّل') return false;
        if(saveDateF&&x.bill_save_date&&!x.bill_save_date.startsWith(saveDateF)) return false;
        if(refFilter&&String(x.bill_notes||'')!==refFilter) return false;
        return true;
      }).forEach(item=>{
        const m=String(item.machine_name||'').trim();
        if(totals[m]!==undefined){
          totals[m].sum  -= (parseFloat(item.total_bill_net)||0)+(parseFloat(item.split_amount)||0);
          totals[m].bill -= parseFloat(item.total_bill)||0;
        }
      });

      // ألوان لكل ماكينة
      const colors = ['#6366f1','#0ea5e9','#10b981','#f59e0b','#ec4899','#8b5cf6'];

      wrap.innerHTML=machines.map((m,i)=>{
        const color = colors[i % colors.length];
        const sum   = totals[m].sum;
        const isNeg = sum < 0;
        return `
        <div style="
          background:var(--surface);
          border:1.5px solid var(--border);
          border-top:3px solid ${color};
          border-radius:10px;
          padding:10px 14px;
          flex:1;
          min-width:110px;
          position:relative;
          overflow:hidden;
        ">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;">
            <span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;flex-shrink:0;"></span>
            <span style="font-size:0.68rem;font-weight:800;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m}</span>
          </div>
          <div style="font-size:1rem;font-weight:900;color:${isNeg?'#ef4444':color};line-height:1.1;">
            ${sum.toFixed(2)}
            <span style="font-size:0.55rem;font-weight:600;color:var(--text-muted);"> ج</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
            <span style="font-size:0.62rem;color:var(--text-muted);">${totals[m].count} معاملة</span>
            <span style="font-size:0.6rem;color:var(--text-muted);">${totals[m].bill.toFixed(0)} إجمالي</span>
          </div>
        </div>`;
      }).join('');

      const canPost=items.filter(i=>i.machine_name&&i.machine_name!=='null'&&i.machine_name!==''&&i.bill_status!=='مرحَّل'&&i.bill_status!=='posted'&&i.bill_status!=='زيادة'&&i.bill_status!=='مرتجع-مرحَّل').length;
      bulkWrap.innerHTML=canPost>0
        ?`<button class="btn btn-success" onclick="markAllPosted()" id="bulk-post-btn"
            style="white-space:nowrap;padding:10px 16px;font-size:0.82rem;border-radius:10px;box-shadow:0 2px 8px rgba(16,185,129,0.3);">
            <i class="fas fa-check-double"></i> ترحيل الكل
            <span style="background:rgba(255,255,255,0.25);border-radius:20px;padding:1px 8px;margin-right:4px;font-size:0.78rem;">${canPost}</span>
          </button>`:'';
    }

    async function markAllPosted() {
      const toPost=getFiltered().filter(item=>{
        const isPosted=(item.bill_status==='مرحَّل'||item.bill_status==='posted'||item.bill_status==='مرتجع-مرحَّل');
        const isExtra=(item.bill_status==='زيادة');
        const isReturn=(item.bill_status==='مرتجع'||item.bill_status==='مرتجع-مرحَّل');
        const hasMachine=item.machine_name&&item.machine_name!=='null'&&item.machine_name!=='';
        return !isPosted&&!isExtra&&!isReturn&&hasMachine;
      });
      if(!toPost.length){alert('لا توجد معاملات قابلة للترحيل');return;}
      if(!confirm(`ترحيل ${toPost.length} معاملة؟`))return;
      const btn=document.getElementById('bulk-post-btn');
      btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
      const now=new Date().toISOString(), ref=String(getNextRef());
      const results=await Promise.all(toPost.map(item=>updateData({type:'visa_update',id:item.id,bill_status:item.bill_status==='مرتجع'?'مرتجع-مرحَّل':'مرحَّل',bill_save_date:now,machine_name:item.machine_name??null,total_bill_net:item.total_bill_net??null,split_amount:item.split_amount??null,bill_notes:ref})));
      toPost.forEach((item,i)=>{if(results[i]){const l=allData.find(x=>String(x.id)===String(item.id));if(l){l.bill_status=l.bill_status==='مرتجع'?'مرتجع-مرحَّل':'مرحَّل';l.bill_save_date=now;l.bill_notes=ref;}}});
      const ok=results.filter(r=>r).length;
      if(ok<toPost.length)alert(`✅ تم ترحيل ${ok} من ${toPost.length}`);
      applyFilter();
    }

    function renderTable(items) {
      const tbody=document.getElementById('table-body');
      if(!items.length){tbody.innerHTML='<tr><td colspan="13" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج</td></tr>';document.getElementById('total-bar').innerHTML='';return;}
      items.sort((a,b)=>new Date(b.bill_date||0)-new Date(a.bill_date||0));
      let grandTotal=0,grandBill=0;
      tbody.innerHTML=items.map(item=>{
        const net=parseFloat(item.total_bill_net)||0;
        const split=parseFloat(item.split_amount)||0;
        const splitAbs=Math.abs(split);
        const isReturn=(item.bill_status==='مرتجع'||item.bill_status==='مرتجع-مرحَّل');
        grandTotal += isReturn ? -(net + split) : net;
        grandBill  += isReturn ? -(parseFloat(item.total_bill||0)) : parseFloat(item.total_bill||0);
        const isPosted=(item.bill_status==='مرحَّل'||item.bill_status==='posted'||item.bill_status==='مرتجع-مرحَّل');
        const isExtra=(item.bill_status==='زيادة');
        const hasMachine=item.machine_name&&item.machine_name!=='null'&&item.machine_name!=='';
        const _d=item.bill_date?new Date(item.bill_date):null;
        const datePart=_d?_d.toLocaleDateString('ar-EG'):'---';
        const timePart=_d?_d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',hour12:true}):'';
        const _sd=item.bill_save_date?new Date(item.bill_save_date):null;
        const saveDate=_sd?_sd.toLocaleDateString('ar-EG')+'<br><span style="font-size:0.7rem;color:var(--text-muted);">'+_sd.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',hour12:true})+'</span>':'---';
        const refNo=item.bill_notes?`<span class="ref-badge">#${item.bill_notes}</span>`:'---';

        // خلية التقسيم — لما تكتب رقم يطرحه من total_bill_net
        const splitCell=`<span class="editable-cell" onclick="editSplit('${item.id}',this,'${splitAbs||0}')">
          ${splitAbs>0?`<span class="split-badge">${splitAbs.toFixed(2)}</span>`:`<span style="color:var(--text-muted);font-size:0.72rem;">—</span>`}
        </span>`;

        return `<tr id="row-${item.id}">
          <td><code style="font-size:0.82rem;color:var(--text-secondary);">${item.bill_no||'---'}</code></td>
          <td style="font-size:0.75rem;white-space:nowrap;">${datePart}<br><span style="color:var(--text-muted);font-size:0.7rem;">${timePart}</span></td>
          <td><code style="font-size:0.78rem;color:var(--text-secondary);">${item.cust_code||'---'}</code></td>
          <td style="font-weight:600;font-size:0.85rem;">${item.cust_name_ar||'---'}</td>
          <td><b>${parseFloat(item.total_bill||0).toFixed(2)}</b></td>
          <td><span class="editable-cell" onclick="editNet('${item.id}',this,'${net}')">
            <b style="color:var(--warning);">${net.toFixed(2)}</b>
            ${split>0?`<br><span style="font-size:0.65rem;color:var(--text-muted);">(+${split.toFixed(2)})</span>`:''}
          </span></td>
          <td style="text-align:center;">${splitCell}</td>
          <td><span class="editable-cell" onclick="editMachine('${item.id}',this,'${(item.machine_name||'').replace(/'/g,"&#39;")}')">
            ${hasMachine?`<span class="badge badge-blue" style="font-size:0.72rem;">${item.machine_name}</span>`:`<span style="color:var(--danger);font-size:0.75rem;">⚠️ بدون ماكينة</span>`}
          </span></td>
          <td style="font-size:0.82rem;">${item.employee_name||'---'}</td>
          <td style="font-size:0.78rem;white-space:nowrap;">${saveDate}</td>
          <td style="text-align:center;">${refNo}</td>
          <td>${isReturn?'<span class="badge" style="background:#fee2e2;color:#dc2626;">↩️ مرتجع</span>':isExtra?'<span class="badge" style="background:#ffedd5;color:#c2410c;">⚠️ زيادة</span>':isPosted?'<span class="badge status-posted">✅ مرحَّل</span>':'<span class="badge status-pending">⏳ لم يُرحَّل</span>'}</td>
          <td>${isReturn?'<span style="font-size:0.72rem;color:var(--text-muted);">—</span>':isExtra?(!isPosted?`<button class="btn btn-sm" style="background:#f59e0b;color:#fff;" onclick="markPosted('${item.id}',this)"><i class="fas fa-check"></i> ترحيل</button>`:'<i class="fas fa-check-double" style="color:var(--success);"></i>'):!isPosted&&hasMachine?`<button class="btn btn-success btn-sm" onclick="markPosted('${item.id}',this)"><i class="fas fa-check"></i> ترحيل</button>`:!isPosted&&!hasMachine?`<span style="font-size:0.72rem;color:var(--text-muted);">اختر ماكينة أولاً</span>`:`<i class="fas fa-check-double" style="color:var(--success);"></i>`}</td>
        </tr>`;

      document.getElementById('total-bar').innerHTML=
        `<span>إجمالي صافي الفيزا: <b style="color:var(--warning);">${grandTotal.toFixed(2)}</b> جنيه</span>`+
        `<span>إجمالي الفواتير: <b style="color:var(--accent-dark);">${grandBill.toFixed(2)}</b> جنيه</span>`+

    // ===== تعديل التقسيم — بيحفظ split_amount فقط بدون تغيير total_bill_net =====
    function editSplit(id, el, currentSplit) {
      const input=document.createElement('input');
      input.type='number'; input.value=currentSplit||'';
      input.className='cell-input'; input.style.width='80px'; input.step='0.01'; input.min='0';
      input.placeholder='0';
      el.replaceWith(input); input.focus(); input.select();

      const save=async()=>{
        const splitVal=parseFloat(input.value)||0;
        const item=allData.find(x=>String(x.id)===String(id));
        const net=Math.abs(parseFloat(item?.total_bill_net)||0);

        if(splitVal>=net&&splitVal>0){
          alert(`⚠️ قيمة التقسيم (${splitVal}) لازم تكون أقل من الصافي (${net})`);
          input.focus(); return;
        }

        const span=document.createElement('span');
        span.className='editable-cell';
        span.innerHTML=splitVal>0
          ?`<span class="split-badge">${splitVal.toFixed(2)}</span>`
          :`<span style="color:var(--text-muted);font-size:0.72rem;">—</span>`;
        span.onclick=()=>editSplit(id,span,splitVal);
        input.replaceWith(span);

        if(item){
          item.split_amount=splitVal||null;
          // نحفظ split_amount فقط — total_bill_net مش بيتغير
          await updateData({
            type:'visa_update', id,
            total_bill_net: item.total_bill_net??null,
            split_amount:   splitVal||null,
            machine_name:   item.machine_name??null,
            bill_status:    item.bill_status??null,
            bill_save_date: item.bill_save_date??null
          });
        }
        renderMachineSummary(getFiltered());
        updateGrandTotal();
      };
      input.addEventListener('blur',save);
      input.addEventListener('keydown',e=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){input.value=currentSplit;input.blur();}});
    }

    function editNet(id, el, current) {
      const input=document.createElement('input');
      input.type='number'; input.value=current;
      input.className='cell-input'; input.style.width='90px'; input.step='0.01';
      el.replaceWith(input); input.focus(); input.select();
      const save=async()=>{
        const newVal=parseFloat(input.value)||0;
        const span=document.createElement('span');
        span.className='editable-cell';
        span.innerHTML=`<b style="color:var(--warning);">${newVal.toFixed(2)}</b>`;
        span.onclick=()=>editNet(id,span,newVal);
        input.replaceWith(span);
        if(String(newVal)!==String(parseFloat(current))){
          const item=allData.find(x=>String(x.id)===String(id));
          if(item){
            item.total_bill_net=newVal;
            await updateData({type:'visa_update',id,total_bill_net:newVal,split_amount:item.split_amount??null,machine_name:item.machine_name??null,bill_status:item.bill_status??null,bill_save_date:item.bill_save_date??null});
          }
          renderMachineSummary(getFiltered());updateGrandTotal();
        }
      };
      input.addEventListener('blur',save);
      input.addEventListener('keydown',e=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){input.value=current;input.blur();}});
    }

    function editMachine(id, el, current) {
      const select=document.createElement('select');
      select.className='cell-select';
      const empty=document.createElement('option');empty.value='';empty.textContent='— اختر —';
      select.appendChild(empty);
      branchMachines().forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;if(m===current)o.selected=true;select.appendChild(o);});
      el.replaceWith(select);select.focus();
      let handled=false;
      const restoreSpan=(machineName)=>{
        const span=document.createElement('span');
        span.className='editable-cell';
        span.innerHTML=machineName?`<span class="badge badge-blue" style="font-size:0.72rem;">${machineName}</span>`:`<span style="color:var(--danger);font-size:0.75rem;">⚠️ بدون ماكينة</span>`;
        span.onclick=()=>editMachine(id,span,machineName);
        if(select.parentNode)select.replaceWith(span);
      };
      const save=async()=>{
        if(handled)return; handled=true;
        const newVal=select.value;
        const item=allData.find(x=>String(x.id)===String(id));
        if(newVal===current){restoreSpan(current);return;}
        if(newVal&&isPaymobMachine(newVal)){
          const ok=await verifyPaymobBeforeSet(id,newVal,item);
          if(!ok){restoreSpan(current);return;}
          restoreSpan(newVal);return;
        }
        restoreSpan(newVal);
        if(item){item.machine_name=newVal;await updateData({type:'visa_update',id,machine_name:newVal,total_bill_net:item.total_bill_net??null,split_amount:item.split_amount??null,bill_status:item.bill_status??null,bill_save_date:item.bill_save_date??null});}
        renderMachineSummary(getFiltered());
      };
      select.addEventListener('blur',save);
      select.addEventListener('change',save);
    }

    // ===== المطابقة مع باي موب — بيبحث عن معاملتين (netMain و split) =====
    async function verifyPaymobBeforeSet(id, machineName, item) {
      const net   = parseFloat(item?.total_bill_net) || 0;
      const split = parseFloat(item?.split_amount)   || 0;
      // بنبحث عن معاملة بقيمة net (الصافي الكلي) ومعاملة بقيمة split (لو موجود)
      // مش الفرق بينهم

      if (net <= 0) {
        alert('⚠️ صافي الفيزا = 0 — أدخل القيمة الصحيحة قبل الربط بباي موب');
        return false;
      }

      const terminal = terminalOf(machineName);
      const pmAll    = await fetchPaymob();
      const pmList   = Array.isArray(pmAll) ? pmAll : [];

      // بحث عن معاملة بقيمة net
      const matchesNet = pmList.filter(p => {
        const pTerminal = String(p.terminal_id||'').trim();
        const pAmount   = parseFloat(p.amount);
        const noBill    = !String(p.bill_no||'').trim() || String(p.bill_no||'').trim()==='null';
        return pTerminal===terminal && pAmount===net && noBill;
      });

      // بحث عن معاملة بقيمة split (لو فيه تقسيم)
      let matchesSplit = [];
      if (split > 0) {
        matchesSplit = pmList.filter(p => {
          const pTerminal = String(p.terminal_id||'').trim();
          const pAmount   = parseFloat(p.amount);
          const noBill    = !String(p.bill_no||'').trim() || String(p.bill_no||'').trim()==='null';
          return pTerminal===terminal && pAmount===split && noBill;
        });
      }

      if (matchesNet.length === 0) {
        alert(`❌ لا توجد معاملة باي موب بقيمة ${net.toFixed(2)} على ماكينة "${machineName}" غير مربوطة.`);
        return false;
      }

      if (split > 0 && matchesSplit.length === 0) {
        alert(`❌ لا توجد معاملة باي موب بقيمة التقسيم ${split.toFixed(2)} على ماكينة "${machineName}" غير مربوطة.`);
        return false;
      }

      let pmTrxNet;
      if (matchesNet.length === 1) {
        pmTrxNet = matchesNet[0];
      } else {
        pmTrxNet = await choosePaymobMatch(id, machineName, item, matchesNet, `اختر معاملة الصافي (${net.toFixed(2)})`);
        if (!pmTrxNet) return false;
      }

      // اختيار معاملة التقسيم لو موجود
      let pmTrxSplit = null;
      if (split > 0) {
        if (matchesSplit.length === 1) {
          pmTrxSplit = matchesSplit[0];
        } else {
          pmTrxSplit = await choosePaymobMatch(id, machineName, item, matchesSplit, `اختر معاملة التقسيم (${split.toFixed(2)})`);
          if (!pmTrxSplit) return false;
        }
      }

      return await linkPaymob(id, machineName, item, pmTrxNet, pmTrxSplit);
    }

    async function linkPaymob(id, machineName, item, pmTrxNet, pmTrxSplit) {
      // حفظ الماكينة
      const okVisa = await updateData({
        type:'visa_update',id,machine_name:machineName,
        total_bill_net:item?.total_bill_net??null,
        split_amount:  item?.split_amount??null,
        bill_status:   item?.bill_status??null,
        bill_save_date:item?.bill_save_date??null
      });
      if (!okVisa) { alert('❌ فشل حفظ الماكينة'); return false; }
      if (item) item.machine_name = machineName;

      const billNo = item?.bill_no || '';
      // كتابة رقم الفاتورة على معاملة الصافي
      const okNet = await paymobUpdate({ id: pmTrxNet.id, bill_no: billNo });
      if (!okNet) alert('⚠️ تم حفظ الماكينة، لكن فشل ربط معاملة الصافي في باي موب.');

      // كتابة رقم الفاتورة على معاملة التقسيم لو موجودة
      if (pmTrxSplit) {
        const okSplit = await paymobUpdate({ id: pmTrxSplit.id, bill_no: billNo });
        if (!okSplit) alert('⚠️ تم ربط معاملة الصافي، لكن فشل ربط معاملة التقسيم في باي موب.');
      }

      renderMachineSummary(getFiltered());
      return true;
    }

    // شاشة اختيار معاملة — بترجع الـ object المختار مش boolean
    let pmChooseResolve = null;
    function choosePaymobMatch(id, machineName, item, matches, title) {
      return new Promise(resolve => {
        pmChooseResolve = resolve;
        const overlay = document.getElementById('pm-modal-overlay');
        const listEl  = document.getElementById('pm-modal-list');
        const infoEl  = document.getElementById('pm-modal-info');
        infoEl.innerHTML = `${title||'اختر معاملة باي موب'} — فاتورة <b>${item?.bill_no||''}</b><br>فيه ${matches.length} معاملة بنفس القيمة:`;
        listEl.innerHTML='';
        matches.forEach(p=>{
          const _t=p.transaction_time?new Date(p.transaction_time):null;
          const tStr=_t?_t.toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'---';
          const row=document.createElement('div');
          row.className='pm-trx-row';
          row.innerHTML=`<div class="pm-trx-info">🕐 ${tStr}<br><span style="color:var(--text-muted);font-size:0.75rem;">order: ${p.order_id||'---'}</span></div><div class="pm-trx-amount">${parseFloat(p.amount||0).toFixed(2)}</div>`;
          row.onclick=()=>{
            overlay.style.display='none';
            const resolveFn=pmChooseResolve; pmChooseResolve=null;
            if(resolveFn) resolveFn(p);  // بترجع الـ object
          };
          listEl.appendChild(row);
        });
        overlay.style.display='flex';
      });
    }

    function closePmModal() {
      document.getElementById('pm-modal-overlay').style.display='none';
      if(pmChooseResolve){pmChooseResolve(null);pmChooseResolve=null;}
    }
    document.getElementById('pm-modal-overlay').addEventListener('click',function(e){if(e.target===this)closePmModal();});

    function getFiltered() {
      const search=document.getElementById('searchInput').value.trim().toLowerCase();
      const machine=document.getElementById('machineFilter').value;
      const extraStatus=document.getElementById('extraStatusFilter').value;
      const noMachine=document.getElementById('noMachineFilter').checked;
      const refFilter=document.getElementById('refFilter').value.trim();
      const saveDateF=document.getElementById('saveDateFilter').value;
      return allData.filter(item=>{
        const isPosted=(item.bill_status==='مرحَّل'||item.bill_status==='posted'||item.bill_status==='مرتجع-مرحَّل');
        const isExtra=(item.bill_status==='زيادة');
        const isReturn=(item.bill_status==='مرتجع'||item.bill_status==='مرتجع-مرحَّل');
        const hasMachine=item.machine_name&&item.machine_name!=='null'&&item.machine_name!=='';
        if(currentTab==='return'){if(!isReturn)return false;return !search||matchSearch(item,search);}
        if(currentTab==='extra'){if(!isExtra)return false;if(extraStatus==='no_machine'&&hasMachine)return false;if(extraStatus==='pending'&&(isPosted||hasMachine))return false;if(extraStatus==='posted'&&!isPosted)return false;return !search||matchSearch(item,search);}
        if(isExtra)return false;
        if(currentTab==='pending'&&isPosted)return false;
        if(currentTab==='posted'&&!isPosted)return false;
        if(noMachine&&hasMachine)return false;
        if(!noMachine&&machine!=='all'&&String(item.machine_name||'').trim()!==machine)return false;
        if(refFilter&&String(item.bill_notes||'')!==refFilter)return false;
        if(saveDateF&&item.bill_save_date&&!item.bill_save_date.startsWith(saveDateF))return false;
        return !search||matchSearch(item,search);
      });
    }

    function updateGrandTotal() {
      const items=getFiltered();
      const total=items.reduce((s,i)=>s+(parseFloat(i.total_bill_net)||0),0);
      const bill=items.reduce((s,i)=>s+(parseFloat(i.total_bill)||0),0);
      document.getElementById('total-bar').innerHTML=
        `<span>إجمالي صافي الفيزا: <b style="color:var(--warning);">${total.toFixed(2)}</b> جنيه</span>`+
        `<span>إجمالي الفواتير: <b style="color:var(--accent-dark);">${bill.toFixed(2)}</b> جنيه</span>`+
        `<span style="color:var(--text-muted);">عدد المعاملات: <b>${items.length}</b></span>`;
    }

    async function markPosted(id, btn) {
      if(!confirm('تأكيد ترحيل هذه العملية؟'))return;
      btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
      const now=new Date().toISOString(), ref=String(getNextRef());
      const item=allData.find(x=>String(x.id)===String(id));
      const newStatus = item?.bill_status==='مرتجع' ? 'مرتجع-مرحَّل' : 'مرحَّل';
      const success=await updateData({type:'visa_update',id,bill_status:newStatus,bill_save_date:now,machine_name:item?.machine_name??null,total_bill_net:item?.total_bill_net??null,split_amount:item?.split_amount??null,bill_notes:ref});
      if(success){if(item){item.bill_status=newStatus;item.bill_save_date=now;item.bill_notes=ref;}applyFilter();}
      else{alert('❌ فشل التحديث');btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> ترحيل';}
    }

    function clearFilters() {
      document.getElementById('searchInput').value='';
      document.getElementById('machineFilter').value='all';
      document.getElementById('noMachineFilter').checked=false;
      document.getElementById('refFilter').value='';
      document.getElementById('saveDateFilter').value='';
      applyFilter();
    }
  </script>
</body>
