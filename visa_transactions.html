<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>معاملات الفيزا - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .tabs-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .tab-btn {
      padding:8px 20px; border-radius:20px; border:1px solid var(--border);
      background:var(--surface-3); color:var(--text-secondary);
      font-size:0.88rem; cursor:pointer; transition:all 0.2s; font-family:var(--font);
    }
    .tab-btn.active { background:var(--accent); color:var(--primary); border-color:var(--accent); font-weight:700; }

    /* ===== Machine summary - compact single row ===== */
    .machine-summary {
      display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;
    }
    .machine-card {
      background:var(--surface); border:1.5px solid var(--border);
      border-radius:var(--radius-md); padding:10px 14px;
      position:relative; overflow:hidden;
      flex:1; min-width:130px; max-width:190px;
    }
    .machine-card::before {
      content:''; position:absolute; top:0; right:0;
      width:3px; height:100%; background:var(--accent);
      border-radius:0 var(--radius-md) var(--radius-md) 0;
    }
    .machine-card .mc-name { font-size:0.7rem; font-weight:700; color:var(--text-secondary); margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .machine-card .mc-total { font-size:1rem; font-weight:900; color:var(--accent-dark); line-height:1; }
    .machine-card .mc-count { font-size:0.65rem; color:var(--text-muted); margin-top:3px; }

    .editable-cell {
      cursor:pointer; padding:4px 6px; border-radius:4px;
      transition:background 0.15s; min-width:60px; display:inline-block;
    }
    .editable-cell:hover { background:var(--surface-3); }
    .cell-input {
      background:var(--surface-3); border:1.5px solid var(--accent);
      border-radius:4px; color:var(--text-primary); font-family:var(--font);
      font-size:0.82rem; padding:3px 6px; width:100%; outline:none;
    }
    .cell-select {
      background:var(--surface-3); border:1.5px solid var(--accent);
      border-radius:4px; color:var(--text-primary); font-family:var(--font);
      font-size:0.82rem; padding:3px 4px; outline:none;
    }

    .status-pending { background:#fef9c3; color:#a16207; }
    .status-posted  { background:#dcfce7; color:#15803d; }

    .modal-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.75); z-index:99999;
      align-items:center; justify-content:center;
    }
    .modal-box {
      background:#1e293b; border:2px solid #334155; border-radius:16px;
      padding:24px; width:90%; max-width:520px; direction:rtl;
      font-family:var(--font); box-shadow:0 20px 60px rgba(0,0,0,0.6);
      max-height:90vh; overflow-y:auto;
    }
    .modal-label { display:block; font-size:0.78rem; font-weight:700; color:#94a3b8; margin-bottom:5px; }
    .modal-field { margin-bottom:14px; }
    .modal-input {
      width:100%; padding:10px 12px; border:1.5px solid #334155; border-radius:8px;
      background:#0f172a; color:#f1f5f9; font-family:var(--font); font-size:0.9rem; outline:none;
    }
    .modal-input:focus { border-color:#38bdf8; }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:480px){ .grid-2 { grid-template-columns:1fr; } }

    .search-wrap { position:relative; min-width:220px; flex:1; max-width:320px; }
    .search-wrap i { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem; pointer-events:none; }
    .search-wrap input { padding-right:34px; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">

      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-credit-card"></i> معاملات الفيزا
          <span class="highlight" id="display-branch">...</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="form-input" placeholder="بحث... (المبالغ بهامش ±3%)" oninput="applyFilter()">
          </div>
          <button class="btn btn-primary" onclick="openAddModal()">
            <i class="fas fa-plus"></i> عملية جديدة
          </button>
          <button class="btn btn-primary" onclick="loadAll()">
            <i class="fas fa-sync-alt"></i> تحديث
          </button>
        </div>
      </div>

      <div class="tabs-bar">
        <button class="tab-btn active" onclick="switchTab('pending', this)">⏳ لم يُرحَّل</button>
        <button class="tab-btn" onclick="switchTab('posted', this)">✅ مرحَّل</button>
        <button class="tab-btn" onclick="switchTab('all', this)">📋 الكل</button>
        <button class="tab-btn" style="border-color:#f59e0b;color:#b45309;" onclick="switchTab('extra', this)">⚠️ زيادات المحافظ</button>
      </div>

      <!-- Machine summary + bulk post button -->
      <div id="machine-summary-wrap"></div>

      <div class="filter-bar" style="margin-bottom:12px;">
        <span class="filter-label"><i class="fas fa-credit-card"></i> الماكينة:</span>
        <select id="machineFilter" class="form-select" style="width:auto;" onchange="applyFilter()">
          <option value="all">كل الماكينات</option>
        </select>
        <span class="filter-label" id="extra-filter-label" style="display:none;margin-right:12px;">الحالة:</span>
        <select id="extraStatusFilter" class="form-select" style="width:auto;display:none;" onchange="applyFilter()">
          <option value="all">الكل</option>
          <option value="no_machine">غير مضاف (بدون ماكينة)</option>
          <option value="pending">لم يُرحَّل</option>
          <option value="posted">مرحَّل</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>رقم الفاتورة</th>
              <th>التاريخ</th>
              <th>كود العميل</th>
              <th>اسم العميل</th>
              <th>إجمالي الفاتورة</th>
              <th>صافي الفيزا</th>
              <th>الماكينة</th>
              <th>الموظف</th>
              <th>تاريخ الحفظ</th>
              <th>ملاحظات</th>
              <th>الحالة</th>
              <th>ترحيل</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="12">⏳ جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>

      <div style="display:flex;gap:16px;flex-wrap:wrap;padding:10px 0;">
        <div id="grand-total-bar" style="font-weight:700;color:var(--warning);font-size:0.9rem;"></div>
        <div id="grand-bill-bar"  style="font-weight:700;color:var(--accent-dark);font-size:0.9rem;"></div>
      </div>

    </div>
  </div>

  <!-- Add Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <span style="font-size:1rem;font-weight:700;color:#f1f5f9;">
          <i class="fas fa-credit-card"></i> إضافة عملية فيزا جديدة
        </span>
        <button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.2rem;">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="grid-2">
        <div class="modal-field">
          <label class="modal-label">رقم الفاتورة <span style="color:#ef4444;">*</span></label>
          <input type="text" id="m-bill-no" class="modal-input" placeholder="رقم الفاتورة">
        </div>
        <div class="modal-field">
          <label class="modal-label">تاريخ الفاتورة</label>
          <input type="date" id="m-bill-date" class="modal-input">
        </div>
      </div>

      <div class="modal-field">
        <label class="modal-label">الماكينة <span style="color:#ef4444;">*</span></label>
        <select id="m-machine" class="modal-input">
          <option value="">— اختر الماكينة —</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="modal-field">
          <label class="modal-label">كود العميل</label>
          <input type="text" id="m-cust-code" class="modal-input" placeholder="كود العميل"
            inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>
        <div class="modal-field">
          <label class="modal-label">اسم العميل</label>
          <input type="text" id="m-cust-name" class="modal-input" placeholder="اسم العميل">
        </div>
      </div>

      <div class="grid-2">
        <div class="modal-field">
          <label class="modal-label">إجمالي الفاتورة</label>
          <input type="number" id="m-total" class="modal-input" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="modal-field">
          <label class="modal-label">صافي الفيزا</label>
          <input type="number" id="m-net" class="modal-input" placeholder="0.00" min="0" step="0.01">
        </div>
      </div>

      <div class="grid-2">
        <div class="modal-field">
          <label class="modal-label">اسم الموظف</label>
          <input type="text" id="m-employee" class="modal-input" placeholder="اسم الموظف">
        </div>
        <div class="modal-field">
          <label class="modal-label">تاريخ الحفظ</label>
          <input type="date" id="m-save-date" class="modal-input">
        </div>
      </div>

      <div class="modal-field">
        <label class="modal-label">ملاحظات</label>
        <textarea id="m-notes" class="modal-input" rows="2" style="resize:vertical;" placeholder="أي ملاحظات..."></textarea>
      </div>

      <div class="modal-field">
        <label class="modal-label">نوع المعاملة</label>
        <select id="m-bill-kind" class="modal-input">
          <option value="normal">معاملة عادية</option>
          <option value="extra">زيادة من المحافظ ⚠️</option>
        </select>
      </div>
      <div class="modal-actions">
        <button onclick="closeModal()" class="btn" style="background:#334155;color:#94a3b8;border:none;">إلغاء</button>
        <button onclick="saveNew()" class="btn btn-primary" id="save-new-btn">
          <i class="fas fa-save"></i> حفظ
        </button>
      </div>
    </div>
  </div>

<script src="api.js"></script>
<script src="nav.js" defer></script>
  <script>
    const BRANCH_MAP = {
      'المعمورة':    'الصيدلية',
      'سان ستيفانو': 'ابراهيم حمدي 2',
      'سيدى بشر':   'ابراهيم حمدي 3',
    };

    let activeUser   = null;
    let userBranch   = '';
    let allData      = [];
    let machinesList = [];
    let currentTab   = 'pending';

    checkAuth().then(async user => {
      activeUser = user;
      if (user) {
        userBranch = (localStorage.getItem('userBranch') || '').trim();
        document.getElementById('display-branch').textContent = userBranch;
        await populateMachineDropdowns();
        await loadAll();
      }
    });

    function branchMachines() { return machinesList; }

    async function populateMachineDropdowns() {
      try {
        const resp   = await fetchMachines();
        const mapped = BRANCH_MAP[userBranch] || userBranch;
        machinesList = (Array.isArray(resp) ? resp : [])
          .filter(m => String(m.store_name || '').trim() === mapped)
          .map(m => m.machine_name);
      } catch(e) { machinesList = []; }

      const mf = document.getElementById('machineFilter');
      mf.innerHTML = '<option value="all">كل الماكينات</option>';
      machinesList.forEach(m => {
        const o = document.createElement('option');
        o.value = m; o.textContent = m; mf.appendChild(o);
      });

      const mm = document.getElementById('m-machine');
      mm.innerHTML = '<option value="">— اختر الماكينة —</option>';
      machinesList.forEach(m => {
        const o = document.createElement('option');
        o.value = m; o.textContent = m; mm.appendChild(o);
      });
    }

    async function loadAll() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="12">⏳ جاري جلب البيانات...</td></tr>';
      try {
        const resp   = await fetchVisaTransactions();
        const mapped = BRANCH_MAP[userBranch] || userBranch;
        allData = (Array.isArray(resp) ? resp : []).filter(
          item => String(item.store_name || '').trim() === mapped
        );
        applyFilter();
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:var(--danger);padding:30px;">❌ فشل الاتصال</td></tr>';
      }
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // show/hide extra filters
      const isExtra = (tab === 'extra');
      document.getElementById('machineFilter').style.display      = isExtra ? 'none' : '';
      document.getElementById('extraStatusFilter').style.display  = isExtra ? '' : 'none';
      document.getElementById('extra-filter-label').style.display = isExtra ? '' : 'none';
      document.querySelector('.filter-label').style.display       = isExtra ? 'none' : '';
      applyFilter();
    }

    function matchSearch(item, search) {
      const num = parseFloat(search);
      if (!isNaN(num) && num > 0) {
        const low  = num * 0.97;
        const high = num * 1.03;
        const amountMatch = [item.total_bill, item.total_bill_net].some(v => {
          const val = parseFloat(v);
          return !isNaN(val) && val >= low && val <= high;
        });
        if (amountMatch) return true;
      }
      const textFields = [
        item.bill_no, item.cust_code, item.cust_name_ar,
        item.machine_name, item.employee_name, item.store_name,
        item.bill_notes, item.bill_status, item.bill_date
      ];
      return textFields.some(v => String(v || '').toLowerCase().includes(search));
    }

    function applyFilter() {
      const search      = document.getElementById('searchInput').value.trim().toLowerCase();
      const machine     = document.getElementById('machineFilter').value;
      const extraStatus = document.getElementById('extraStatusFilter').value;

      const filtered = allData.filter(item => {
        const isPosted  = (item.bill_status === 'مرحَّل' || item.bill_status === 'posted');
        const isExtra   = (item.bill_status === 'زيادة');
        const hasMachine = item.machine_name && item.machine_name !== 'null' && item.machine_name !== '';

        // extra tab — show only زيادة items
        if (currentTab === 'extra') {
          if (!isExtra) return false;
          if (extraStatus === 'no_machine' && hasMachine)  return false;
          if (extraStatus === 'pending'    && (isPosted || hasMachine)) return false;
          if (extraStatus === 'posted'     && !isPosted)   return false;
          if (search) return matchSearch(item, search);
          return true;
        }

        // normal tabs — exclude زيادة items
        if (isExtra) return false;
        if (currentTab === 'pending' && isPosted)  return false;
        if (currentTab === 'posted'  && !isPosted) return false;
        if (machine !== 'all' && String(item.machine_name || '').trim() !== machine) return false;
        if (search) return matchSearch(item, search);
        return true;
      });

      renderMachineSummary(filtered);
      renderTable(filtered);
    }

    function renderMachineSummary(items) {
      const wrap = document.getElementById('machine-summary-wrap');
      if (currentTab !== 'pending') { wrap.innerHTML = ''; return; }

      const machines = branchMachines();
      if (!machines.length) { wrap.innerHTML = ''; return; }

      const totals = {};
      machines.forEach(m => { totals[m] = { sum: 0, bill: 0, count: 0, ids: [] }; });

      items.forEach(item => {
        const m = String(item.machine_name || '').trim();
        const v = parseFloat(item.total_bill_net) || 0;
        const b = parseFloat(item.total_bill)     || 0;
        if (totals[m] !== undefined) {
          totals[m].sum += v;
          totals[m].bill += b;
          totals[m].count++;
          totals[m].ids.push(item.id);
        }
      });

      // حساب اللي ممكن يتترحل (عنده ماكينة)
      const canPostCount = items.filter(i =>
        i.machine_name && i.machine_name !== 'null' && i.machine_name !== '' &&
        i.bill_status !== 'مرحَّل' && i.bill_status !== 'posted' && i.bill_status !== 'زيادة'
      ).length;

      wrap.innerHTML =
        '<div class="machine-summary">' +
        machines.map(m => `
          <div class="machine-card">
            <div class="mc-name"><i class="fas fa-credit-card" style="margin-left:4px;color:var(--accent);font-size:0.65rem;"></i>${m}</div>
            <div class="mc-total">${totals[m].sum.toFixed(2)} <span style="font-size:0.6rem;font-weight:500;color:var(--text-muted);">صافي</span></div>
            <div style="font-size:0.78rem;font-weight:700;color:var(--accent-dark);margin-top:2px;">${totals[m].bill.toFixed(2)} <span style="font-size:0.6rem;font-weight:500;color:var(--text-muted);">إجمالي</span></div>
            <div class="mc-count">${totals[m].count} معاملة غير مرحَّلة</div>
          </div>`).join('') +
        '</div>' +
        (canPostCount > 0 ? `
          <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
            <button class="btn btn-success" onclick="markAllPosted()" id="bulk-post-btn">
              <i class="fas fa-check-double"></i> ترحيل الكل (${canPostCount} معاملة بماكينة)
            </button>
          </div>` : '');
    }

    // ===== ترحيل الكل =====
    async function markAllPosted() {
      const toPost = allData.filter(item => {
        const isPosted   = (item.bill_status === 'مرحَّل' || item.bill_status === 'posted');
        const isExtra    = (item.bill_status === 'زيادة');
        const hasMachine = item.machine_name && item.machine_name !== 'null' && item.machine_name !== '';
        return !isPosted && !isExtra && hasMachine;
      });

      if (toPost.length === 0) { alert('لا توجد معاملات قابلة للترحيل'); return; }
      if (!confirm(`هل تريد ترحيل ${toPost.length} معاملة (اللي عندها ماكينة فقط)؟`)) return;

      const btn     = document.getElementById('bulk-post-btn');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الترحيل...';

      const now     = new Date().toISOString();
      const results = await Promise.all(
        toPost.map(item => updateData({
          type:           'visa_update',
          id:             item.id,
          bill_status:    'مرحَّل',
          bill_save_date: now
        }))
      );

      const successCount = results.filter(r => r === true).length;

      // تحديث allData محلياً
      toPost.forEach((item, i) => {
        if (results[i]) {
          const local = allData.find(x => String(x.id) === String(item.id));
          if (local) { local.bill_status = 'مرحَّل'; local.bill_save_date = now; }
        }
      });

      if (successCount === toPost.length) {
        applyFilter();
      } else {
        alert(`✅ تم ترحيل ${successCount} من ${toPost.length} — بعض العمليات فشلت`);
        await loadAll();
      }
    }

    function renderTable(items) {
      const tbody   = document.getElementById('table-body');
      const totalEl = document.getElementById('grand-total-bar');

      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج</td></tr>';
        totalEl.textContent = '';
        return;
      }

      items.sort((a, b) => new Date(b.bill_date || 0) - new Date(a.bill_date || 0));

      let grandTotal = 0;
      let grandBill   = 0;
      tbody.innerHTML = items.map(item => {
        const net         = parseFloat(item.total_bill_net) || 0;
        grandTotal       += net;
        grandBill        += parseFloat(item.total_bill || 0);
        const isPosted    = (item.bill_status === 'مرحَّل' || item.bill_status === 'posted');
        const isExtra    = (item.bill_status === 'زيادة');
        const _d          = item.bill_date ? new Date(item.bill_date) : null;
        const datePart    = _d ? _d.toLocaleDateString('ar-EG') : '---';
        const timePart    = _d ? _d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true}) : '';
        const saveDateStr = item.bill_save_date
          ? new Date(item.bill_save_date).toLocaleDateString('ar-EG') : '---';
        const hasMachine  = item.machine_name && item.machine_name !== 'null' && item.machine_name !== '';

        return `
          <tr id="row-${item.id}">
            <td><code style="font-size:0.82rem;color:var(--text-secondary);">${item.bill_no || '---'}</code></td>
            <td style="font-size:0.75rem;line-height:1.4;white-space:nowrap;">
              ${datePart}<br>
              <span style="color:var(--text-muted);font-size:0.7rem;">${timePart}</span>
            </td>
            <td><code style="font-size:0.78rem;color:var(--text-secondary);">${item.cust_code || '---'}</code></td>
            <td style="font-weight:600;font-size:0.85rem;">${item.cust_name_ar || '---'}</td>
            <td><b>${parseFloat(item.total_bill || 0).toFixed(2)}</b></td>
            <td>
              <span class="editable-cell" onclick="editNet('${item.id}', this, '${item.total_bill_net || 0}')">
                <b style="color:var(--warning);">${net.toFixed(2)}</b>
              </span>
            </td>
            <td>
              <span class="editable-cell" onclick="editMachine('${item.id}', this, '${(item.machine_name||'').replace(/'/g,"&#39;")}')">
                ${hasMachine
                  ? `<span class="badge badge-blue" style="font-size:0.72rem;">${item.machine_name}</span>`
                  : `<span style="color:var(--danger);font-size:0.75rem;">⚠️ بدون ماكينة</span>`}
              </span>
            </td>
            <td style="font-size:0.82rem;">${item.employee_name || '---'}</td>
            <td style="font-size:0.78rem;">${saveDateStr}</td>
            <td style="font-size:0.78rem;color:var(--text-secondary);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${item.bill_notes || ''}">
              ${item.bill_notes || '---'}
            </td>
            <td>
              ${isExtra
                ? '<span class="badge" style="background:#ffedd5;color:#c2410c;">⚠️ زيادة</span>'
                : isPosted
                  ? '<span class="badge status-posted">✅ مرحَّل</span>'
                  : '<span class="badge status-pending">⏳ لم يُرحَّل</span>'}
            </td>
            <td>
              ${isExtra
                ? (!isPosted
                    ? `<button class="btn btn-sm" style="background:#f59e0b;color:#fff;" onclick="markPosted('${item.id}', this)">
                         <i class="fas fa-check"></i> ترحيل
                       </button>`
                    : '<i class="fas fa-check-double" style="color:var(--success);"></i>')
                : !isPosted && hasMachine
                  ? `<button class="btn btn-success btn-sm" onclick="markPosted('${item.id}', this)">
                       <i class="fas fa-check"></i> ترحيل
                     </button>`
                  : !isPosted && !hasMachine
                    ? `<span style="font-size:0.72rem;color:var(--text-muted);">اختر ماكينة أولاً</span>`
                    : `<i class="fas fa-check-double" style="color:var(--success);"></i>`}
            </td>
          </tr>`;
      }).join('');

      totalEl.innerHTML = `إجمالي صافي الفيزا: <span style="color:var(--warning);">${grandTotal.toFixed(2)}</span> جنيه`;
      document.getElementById('grand-bill-bar').innerHTML = `إجمالي الفواتير: <span style="color:var(--accent-dark);">${grandBill.toFixed(2)}</span> جنيه`;
    }

    function editNet(id, el, current) {
      const input = document.createElement('input');
      input.type = 'number'; input.value = current;
      input.className = 'cell-input'; input.style.width = '90px'; input.step = '0.01';
      el.replaceWith(input);
      input.focus(); input.select();

      const save = async () => {
        const newVal = parseFloat(input.value) || 0;
        const span   = document.createElement('span');
        span.className = 'editable-cell';
        span.innerHTML = `<b style="color:var(--warning);">${newVal.toFixed(2)}</b>`;
        span.onclick = () => editNet(id, span, newVal);
        input.replaceWith(span);
        if (String(newVal) !== String(parseFloat(current))) {
          const item = allData.find(x => String(x.id) === String(id));
          if (item) {
            item.total_bill_net = newVal;
            await updateData({
              type:           'visa_update',
              id,
              total_bill_net: newVal,
              machine_name:   item.machine_name   ?? null,
              bill_status:    item.bill_status    ?? null,
              bill_save_date: item.bill_save_date ?? null,
            });
          }
          renderMachineSummary(getFiltered());
          updateGrandTotal();
        }
      };
      input.addEventListener('blur', save);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') { input.value = current; input.blur(); }
      });
    }

    function editMachine(id, el, current) {
      const machines = branchMachines();
      const select   = document.createElement('select');
      select.className = 'cell-select';
      const emptyOpt = document.createElement('option');
      emptyOpt.value = ''; emptyOpt.textContent = '— اختر —';
      select.appendChild(emptyOpt);
      machines.forEach(m => {
        const o = document.createElement('option');
        o.value = m; o.textContent = m;
        if (m === current) o.selected = true;
        select.appendChild(o);
      });
      el.replaceWith(select);
      select.focus();

      const save = async () => {
        const newVal = select.value;
        const span   = document.createElement('span');
        span.className = 'editable-cell';
        span.innerHTML = newVal
          ? `<span class="badge badge-blue" style="font-size:0.72rem;">${newVal}</span>`
          : `<span style="color:var(--danger);font-size:0.75rem;">⚠️ بدون ماكينة</span>`;
        span.onclick = () => editMachine(id, span, newVal);
        select.replaceWith(span);
        if (newVal !== current) {
          const item = allData.find(x => String(x.id) === String(id));
          if (item) {
            item.machine_name = newVal;
            await updateData({
              type:           'visa_update',
              id,
              machine_name:   newVal,
              total_bill_net: item.total_bill_net ?? null,
              bill_status:    item.bill_status    ?? null,
              bill_save_date: item.bill_save_date ?? null,
            });
          }
          renderMachineSummary(getFiltered());
        }
      };
      select.addEventListener('blur', save);
      select.addEventListener('change', save);
    }

    function getFiltered() {
      const search      = document.getElementById('searchInput').value.trim().toLowerCase();
      const machine     = document.getElementById('machineFilter').value;
      const extraStatus = document.getElementById('extraStatusFilter').value;
      return allData.filter(item => {
        const isPosted   = (item.bill_status === 'مرحَّل' || item.bill_status === 'posted');
        const isExtra    = (item.bill_status === 'زيادة');
        const hasMachine = item.machine_name && item.machine_name !== 'null' && item.machine_name !== '';
        if (currentTab === 'extra') {
          if (!isExtra) return false;
          if (extraStatus === 'no_machine' && hasMachine)  return false;
          if (extraStatus === 'pending'    && (isPosted || hasMachine)) return false;
          if (extraStatus === 'posted'     && !isPosted)   return false;
          if (search) return matchSearch(item, search);
          return true;
        }
        if (isExtra) return false;
        if (currentTab === 'pending' && isPosted)  return false;
        if (currentTab === 'posted'  && !isPosted) return false;
        if (machine !== 'all' && String(item.machine_name || '').trim() !== machine) return false;
        if (search) return matchSearch(item, search);
        return true;
      });
    }

    function updateGrandTotal() {
      const items = getFiltered();
      const total = items.reduce((s, i) => s + (parseFloat(i.total_bill_net) || 0), 0);
      const bill  = items.reduce((s, i) => s + (parseFloat(i.total_bill)     || 0), 0);
      document.getElementById('grand-total-bar').innerHTML =
        `إجمالي صافي الفيزا: <span style="color:var(--warning);">${total.toFixed(2)}</span> جنيه`;
      document.getElementById('grand-bill-bar').innerHTML =
        `إجمالي الفواتير: <span style="color:var(--accent-dark);">${bill.toFixed(2)}</span> جنيه`;
    }

    async function markPosted(id, btn) {
      if (!confirm('تأكيد ترحيل هذه العملية؟')) return;
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const now     = new Date().toISOString();
      const success = await updateData({
        type:           'visa_update',
        id,
        bill_status:    'مرحَّل',
        bill_save_date: now
      });

      if (success) {
        const item = allData.find(x => String(x.id) === String(id));
        if (item) { item.bill_status = 'مرحَّل'; item.bill_save_date = now; }
        applyFilter();
      } else {
        alert('❌ فشل التحديث');
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-check"></i> ترحيل';
      }
    }

    function openAddModal() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('m-bill-date').value  = today;
      document.getElementById('m-save-date').value  = today;
      document.getElementById('m-bill-no').value    = '';
      document.getElementById('m-cust-code').value  = '';
      document.getElementById('m-cust-name').value  = '';
      document.getElementById('m-total').value      = '';
      document.getElementById('m-net').value        = '';
      document.getElementById('m-employee').value   = '';
      document.getElementById('m-notes').value      = '';
      document.getElementById('m-machine').value    = '';
      document.getElementById('m-bill-kind').value = 'normal';
      document.getElementById('add-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('add-modal').style.display = 'none';
    }

    async function saveNew() {
      const billNo  = document.getElementById('m-bill-no').value.trim();
      const machine = document.getElementById('m-machine').value;
      if (!billNo)  { alert('برجاء إدخال رقم الفاتورة'); return; }
      if (!machine) { alert('برجاء اختيار الماكينة');    return; }

      const btn     = document.getElementById('save-new-btn');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      const success = await updateData({
        type:           'visa_insert',
        store_name:     BRANCH_MAP[userBranch] || userBranch,
        bill_no:        billNo,
        bill_date:      document.getElementById('m-bill-date').value  || null,
        cust_code:      document.getElementById('m-cust-code').value.trim()  || null,
        cust_name_ar:   document.getElementById('m-cust-name').value.trim()  || null,
        total_bill:     parseFloat(document.getElementById('m-total').value) || 0,
        total_bill_net: parseFloat(document.getElementById('m-net').value)   || 0,
        machine_name:   machine,
        employee_name:  document.getElementById('m-employee').value.trim()   || null,
        bill_save_date: document.getElementById('m-save-date').value         || null,
        bill_notes:     document.getElementById('m-notes').value.trim()      || null,
        bill_status:    document.getElementById('m-bill-kind').value === 'extra' ? 'زيادة' : 'لم يُرحَّل'
      });

      if (success) { closeModal(); await loadAll(); }
      else alert('❌ فشل الحفظ');

      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
    }

    document.getElementById('add-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
