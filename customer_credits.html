<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مديونيات العملاء</title>
<link rel="stylesheet" href="tokens.css?v=20260906">
<script>try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=20261011b">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js?v=20260904c"></script>
<script src="session.js?v=20261030b"></script>
<script src="branches.js?v=20260904d"></script>
<style>
body{padding:1.25rem;overflow-y:auto;height:100vh;background:var(--bg)}
.hdr{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem}
.hdr h1{margin:0;font-size:1.15rem;font-weight:800}
.hdr .sub{font-size:.75rem;color:var(--text-muted);font-weight:600}
.bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.7rem .9rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.bar label{font-size:.72rem;color:var(--text-muted);font-weight:700}
.inp{height:38px;padding:0 .8rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.82rem;font-weight:600;color:var(--text);background:var(--surface);outline:none}
.inp:focus{border-color:var(--primary)}
#q{flex:1;min-width:190px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:.7rem;margin-bottom:.9rem}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.7rem .9rem;box-shadow:var(--shadow)}
.kpi .l{font-size:.72rem;color:var(--text-muted);font-weight:700}
.kpi .v{font-size:1.3rem;font-weight:800;color:var(--primary);line-height:1.5}
.kpi .s{font-size:.7rem;color:var(--text-muted);font-weight:600}
.kpi.red .v{color:var(--danger)}
.age{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.9rem}
.agec{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.45rem .75rem;font-size:.76rem;font-weight:700}
.agec b{display:block;font-size:.95rem;color:var(--primary)}
.agec.w{border-color:#fdba74}.agec.w b{color:#c2410c}
.agec.d{border-color:#fca5a5}.agec.d b{color:#b91c1c}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:860px}
th,td{padding:.5rem .7rem;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th{background:var(--bg);font-weight:700;color:var(--text-muted);font-size:.71rem;position:sticky;top:0;z-index:1}
tbody tr:hover{background:var(--bg)}
.nm{font-weight:700;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.mut{color:var(--text-muted);font-size:.72rem}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.open{color:var(--danger)}
.done{color:#15803d;font-weight:700}
.tel{direction:ltr;display:inline-block;font-weight:700}
.tel a{color:var(--primary);text-decoration:none}
.ag{font-size:.7rem;font-weight:800;border-radius:20px;padding:.1rem .5rem;white-space:nowrap}
.ag1{background:#f1f5f9;color:#475569}.ag2{background:#fef9c3;color:#854d0e}
.ag3{background:#ffedd5;color:#c2410c}.ag4{background:#fee2e2;color:#b91c1c}
.pager{display:flex;gap:.3rem;justify-content:center;align-items:center;flex-wrap:wrap;padding:.7rem}
.pager button{min-width:32px;height:32px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-family:'Cairo';font-weight:700;font-size:.78rem;cursor:pointer;color:var(--text)}
.pager button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .info{font-size:.74rem;color:var(--text-muted);font-weight:700;margin-inline-start:.5rem}
.empty{padding:2rem;text-align:center;color:var(--text-muted);font-weight:700}
.err{padding:1rem;color:var(--danger);font-weight:700}
.note{font-size:.72rem;color:var(--text-muted);font-weight:600;margin-top:.7rem;line-height:1.8}
</style>
</head>
<body>

<div class="hdr">
  <h1>💰 مديونيات العملاء</h1>
  <span class="sub">قيمة «له ادويه بقيمة» التي لم يتسلّمها العميل بعد</span>
</div>

<div class="bar">
  <label>الفرع</label>
  <select id="br" class="inp" style="display:none"><option value="">كل الفروع</option></select>
  <label>الحالة</label>
  <select id="st" class="inp">
    <option value="open" selected>غير مسوّاة</option>
    <option value="settled">مسوّاة</option>
    <option value="all">الكل</option>
  </select>
  <label>من</label><input type="date" id="f" class="inp">
  <label>إلى</label><input type="date" id="t" class="inp">
  <input type="search" id="q" class="inp" placeholder="بحث بالاسم أو الكود أو الموبايل أو رقم الفاتورة">
</div>

<div class="kpis" id="kpis"></div>
<div class="age" id="age"></div>

<div class="tw">
  <table>
    <thead><tr>
      <th>التاريخ</th><th>الفرع</th><th>رقم الفاتورة</th><th>كود العميل</th>
      <th>اسم العميل</th><th>الموبايل</th><th class="num">القيمة</th>
      <th class="num">تسلّم</th><th class="num">المتبقي</th><th>العمر</th><th>الصيدلي</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">لا توجد بيانات.</div>
  <div class="pager" id="pg"></div>
</div>

<div class="note" id="src"></div>

<script>
const SB = PHALIX_CONFIG.supabaseUrl;
let SEES_ALL = false, PAGE = 1; const SIZE = 50; let TIMER = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(id){ return document.getElementById(id); }
function money(n){ return (Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function num(n){ return (+n||0).toLocaleString('en-US'); }
function fmtDate(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleDateString('ar-EG-u-nu-latn',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Africa/Cairo'}); }
  catch(e){ return '—'; }
}
/* كل الدوال بترجّع jsonb (كائن واحد) — مفيش قص عند 1000 */
async function rpc(fn, body){
  const r = await fetch(SB+'/rest/v1/rpc/'+fn, { method:'POST', headers: await Session.headers(), body: JSON.stringify(body||{}) });
  let d=null; try{ d = await r.json(); }catch(e){}
  if(!r.ok){ const e = new Error((d && (d.message||d.error||d.hint)) || ('خطأ '+r.status)); e.status=r.status; throw e; }
  return d;
}

/* شرايح العمر — المفتاح رقم عشان الترتيب يفضل ثابت مهما اتغيّر النص */
const AGE_LABEL = { '1':'حتى 30 يوم', '2':'31 – 60 يوم', '3':'61 – 90 يوم', '4':'91 يوم – سنة', '5':'أكثر من سنة' };
const AGE_CLASS = { '1':'', '2':'', '3':'w', '4':'w', '5':'d' };
function ageTag(d){
  const n = +d||0;
  const k = n<=30?'1' : n<=60?'2' : n<=90?'3' : n<=365?'4' : '5';
  return '<span class="ag ag'+(k==='1'?1:k==='2'?2:k<='4'?3:4)+'">'+num(n)+' يوم</span>';
}

function params(){
  return {
    p_branch: SEES_ALL ? (el('br').value || null) : null,
    p_status: el('st').value,
    p_search: el('q').value.trim() || null,
    p_from:   el('f').value || null,
    p_to:     el('t').value || null,
    p_limit:  SIZE,
    p_offset: (PAGE-1)*SIZE
  };
}

async function load(){
  el('tb').innerHTML = '<tr><td colspan="11" class="empty">⏳ جاري التحميل…</td></tr>';
  let d;
  try { d = await rpc('get_customer_credits', params()); }
  catch(e){
    el('tb').innerHTML=''; el('pg').innerHTML=''; el('kpis').innerHTML=''; el('age').innerHTML='';
    el('empty').style.display=''; el('empty').innerHTML='<span class="err">'+esc(e.message)+'</span>';
    return;
  }
  render(d);
}

function render(d){
  const rows = d.rows || [];
  /* الإجماليات من الدالة — محسوبة على كل البيانات المفلترة مش على
     الصفحة المعروضة، وإلا الرقم بيتغيّر لما تقلب الصفحات. */
  const ag = d.aging || [];
  const agv = k => { const x = (ag.find(a => a.k === k) || {}); return { v: +x.value || 0, n: +x.bills || 0 }; };
  const EG = ' <span style="font-size:.8rem">ج</span>';

  /* الكارتين التانيين بيتغيّروا حسب الفلتر: تحت «غير مسوّاة» يبقى
     المدفوع صفر دايمًا (الفلتر نفسه شايل المسوّى)، فعرضه كرقم
     بيوحي إن محدش استلم حاجة — والصح إن ده أثر الفلتر مش الواقع. */
  const open = el('st').value === 'open';
  el('kpis').innerHTML =
    kpi('المتبقي علينا', money(d.sum_open)+EG, num(d.total)+' سطر', true) +
    kpi('عدد العملاء', num(d.customers), 'لهم رصيد في الفلتر الحالي') +
    (open
      ? kpi('أقدم من سنة', money(agv('5').v)+EG, num(agv('5').n)+' سطر · الأصعب تحصيلًا', true) +
        kpi('خلال 30 يوم', money(agv('1').v)+EG, num(agv('1').n)+' سطر · حديثة')
      : kpi('إجمالي ما سُجّل', money(d.sum_value)+EG, 'قيمة الكود كلها') +
        kpi('تسلّمه العملاء', money(d.sum_paid)+EG, 'اتسوّى فعليًا'));

  el('age').innerHTML = ag.length
    ? ag.map(a => '<div class="agec '+(AGE_CLASS[a.k]||'')+'"><b>'+money(a.value)+' ج</b>'+esc(AGE_LABEL[a.k]||a.k)+' · '+num(a.bills)+' سطر</div>').join('')
    : '';

  el('empty').style.display = rows.length ? 'none' : '';
  el('empty').textContent = 'لا توجد بيانات بهذا الفلتر.';
  el('tb').innerHTML = rows.map(r => {
    const tel = String(r.cust_mobile||'').trim();
    const hasTel = tel && tel !== '0' && tel.length >= 7;
    return '<tr>'
      + '<td class="mut">'+fmtDate(r.bill_date)+'</td>'
      + '<td>'+esc(r.store_name || r.branch || '—')+'</td>'
      + '<td class="num">'+esc(r.bill_no)+'</td>'
      + '<td class="mut">'+esc(r.cust_code || '—')+'</td>'
      + '<td><span class="nm" title="'+esc(r.cust_name||'')+'">'+esc(r.cust_name || '—')+'</span></td>'
      + '<td>'+(hasTel ? '<span class="tel"><a href="tel:'+esc(tel)+'">'+esc(tel)+'</a></span>' : '<span class="mut">—</span>')+'</td>'
      + '<td class="num">'+money(r.value)+'</td>'
      + '<td class="num mut">'+(+r.returned_value > 0 ? money(r.returned_value) : '—')+'</td>'
      + '<td class="num '+(+r.remaining > 0.5 ? 'open' : 'done')+'">'+(+r.remaining > 0.5 ? money(r.remaining) : '✓ مسوّاة')+'</td>'
      + '<td>'+(+r.remaining > 0.5 ? ageTag(r.age_days) : '<span class="mut">—</span>')+'</td>'
      + '<td class="mut">'+esc(r.employee_name || '—')+'</td>'
      + '</tr>';
  }).join('');

  pager(d.total || 0);
}

function kpi(l, v, s, red){
  return '<div class="kpi'+(red?' red':'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+(s||'')+'</div></div>';
}

function pager(total){
  const pages = Math.max(1, Math.ceil(total/SIZE));
  if (PAGE > pages) PAGE = pages;
  if (pages <= 1){ el('pg').innerHTML = total ? '<span class="info">'+num(total)+' سطر</span>' : ''; return; }
  const b = (p,t,on) => '<button class="'+(on?'on':'')+'" onclick="go('+p+')" '+(p<1||p>pages?'disabled':'')+'>'+t+'</button>';
  let h = b(1,'«') + b(PAGE-1,'‹');
  const win = new Set([1,pages,PAGE-1,PAGE,PAGE+1].filter(x=>x>=1&&x<=pages));
  let last = 0;
  [...win].sort((a,c)=>a-c).forEach(p=>{ if(p-last>1) h+='<span class="info">…</span>'; h+=b(p,p,p===PAGE); last=p; });
  h += b(PAGE+1,'›') + b(pages,'»') + '<span class="info">صفحة '+PAGE+' من '+pages+' · '+num(total)+' سطر</span>';
  el('pg').innerHTML = h;
}
function go(p){ PAGE = p; load(); window.scrollTo({top:0,behavior:'smooth'}); }

/* أي تغيير في الفلتر يرجّع لأول صفحة — وإلا تفضل على صفحة مش موجودة */
function reload(){ PAGE = 1; load(); }

(async function init(){
  try { const u = await Session.require({ page:'customer_credits' }); if(!u) return; } catch(e){}
  try { SEES_ALL = await Session.seesAllBranches('customer_credits'); }
  catch(e){ SEES_ALL = Session.isAdmin(); }
  if (Session.isAdmin() || Session.role() === 'manager') SEES_ALL = true;

  if (SEES_ALL){
    try{
      await Branches.ready();
      el('br').innerHTML = '<option value="">كل الفروع</option>' +
        Branches.all().map(b => '<option value="'+esc(b.sync_key||b.code)+'">'+esc(b.name)+'</option>').join('');
      el('br').style.display = '';
    }catch(e){}
  }

  el('br').onchange = el('st').onchange = el('f').onchange = el('t').onchange = reload;
  /* بحث نصي بـdebounce عشان ما نحمّلش السيرفر على كل حرف */
  el('q').oninput = () => { clearTimeout(TIMER); TIMER = setTimeout(reload, 300); };

  el('src').innerHTML =
    'المصدر: سطور الصنف «له ادويه بقيمة» في eplus، والمبلغ الذي تسلّمه العميل مسجّل على سطر البيع نفسه. '
    + 'البيانات تُحدَّث بمزامنة <code>sync_customer_credits</code>، والتواريخ بتوقيت القاهرة.';

  load();
})();
</script>
</body>
</html>
