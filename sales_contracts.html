<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>فواتير التعاقد - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-file-invoice"></i> فواتير التعاقد
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <div id="stats-bar" style="display:flex;gap:8px;align-items:center;font-size:0.82rem;"></div>
          <div class="field-icon-wrap" style="min-width:220px;">
            <i class="fas fa-search field-icon"></i>
            <input type="text" id="searchInput" class="form-input"
              placeholder="بحث بالاسم أو الكود أو الفاتورة..."
              oninput="currentPage=1; applyFilter()"
              style="padding-right:34px;">
          </div>
          <select id="stateFilter" class="form-select" style="width:auto;" onchange="currentPage=1; applyFilter()">
            <option value="default">قيد المتابعة</option>
            <option value="all">الكل</option>
            <option value="فاتورة">فاتورة ✅</option>
            <option value="مقابل مرتجع">مقابل مرتجع 🔄</option>
            <option value="لنا فاتورة">لنا فاتورة 📄</option>
            <option value="ملغاة">ملغاة ❌</option>
            <option value="مدموجة">🔗 مدموجة</option>
          </select>
          <button class="btn btn-primary" onclick="openAddModal()">
            <i class="fas fa-plus"></i> إضافة فاتورة
          </button>
          <button class="btn btn-primary" onclick="loadData()">
            <i class="fas fa-sync-alt"></i> تحديث
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>رقم الفاتورة</th>
              <th>التاريخ</th>
              <th>كود العميل</th>
              <th>اسم العميل</th>
              <th>القيمة</th>
              <th>الموظف</th>
              <th>الفرع</th>
              <th>نوع الفاتورة</th>
              <th>طريقة الدفع</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="11">⏳ جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="pager" style="margin-top:14px"></div>
    </div>
  </div>

  <!-- Modal الإضافة/التعديل -->
  <div id="edit-modal" style="
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,0.75);z-index:99999;
    align-items:center;justify-content:center;">
    <div style="
      background:#1e293b;border:2px solid #334155;border-radius:16px;
      padding:24px;width:90%;max-width:520px;direction:rtl;
      font-family:var(--font);box-shadow:0 20px 60px rgba(0,0,0,0.6);
      max-height:90vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <span id="modal-title" style="font-size:1rem;font-weight:700;color:#f1f5f9;">
          <i class="fas fa-edit"></i> تعديل فاتورة
        </span>
        <button onclick="closeModal()"
          style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.2rem;">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <input type="hidden" id="modal-id">
      <input type="hidden" id="modal-mode">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">
            رقم الفاتورة
            <span id="bill-no-note" style="color:#64748b;font-weight:400;font-size:0.72rem;"></span>
          </label>
          <input type="text" id="modal-bill-no" class="form-input">
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">التاريخ</label>
          <input type="date" id="modal-bill-date" class="form-input">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">كود العميل</label>
          <input type="text" id="modal-cust-code" class="form-input"
            inputmode="numeric"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">اسم العميل</label>
          <input type="text" id="modal-cust-name" class="form-input">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">القيمة</label>
          <input type="number" id="modal-total" class="form-input" min="0" step="0.01">
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">اسم الموظف</label>
          <input type="text" id="modal-employee" class="form-input">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">نوع الفاتورة</label>
          <select id="modal-bill-type" class="form-select">
            <option value="">— اختر —</option>
            <option value="عاملين">👷 عاملين</option>
            <option value="معاشات">👴 معاشات</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">طريقة الدفع</label>
          <select id="modal-payment-type" class="form-select">
            <option value="">— اختر —</option>
            <option value="3/4">3/4</option>
            <option value="مساهمة كاملة">مساهمة كاملة</option>
            <option value="مساهمة 50%">مساهمة 50%</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:8px;">الحالة</label>
        <select id="modal-state" class="form-select">
          <option value="">⏳ قيد الانتظار</option>
          <option value="فاتورة">✅ فاتورة</option>
          <option value="مقابل مرتجع">🔄 مقابل مرتجع</option>
          <option value="لنا فاتورة">📄 لنا فاتورة</option>
          <option value="ملغاة">❌ ملغاة</option>
        </select>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeModal()" class="btn"
          style="background:#334155;color:#94a3b8;border:none;">إلغاء</button>
        <button onclick="saveModal()" class="btn btn-primary" id="modal-save-btn">
          <i class="fas fa-save"></i> حفظ
        </button>
      </div>
    </div>
  </div>

  <!-- Modal الدمج -->
  <div id="merge-modal" style="
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,0.75);z-index:99999;
    align-items:center;justify-content:center;">
    <div style="
      background:#1e293b;border:2px solid #334155;border-radius:16px;
      padding:24px;width:90%;max-width:480px;direction:rtl;
      font-family:var(--font);box-shadow:0 20px 60px rgba(0,0,0,0.6);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <span style="font-size:1rem;font-weight:700;color:#f1f5f9;">
          <i class="fas fa-compress-arrows-alt"></i> دمج فاتورتين
        </span>
        <button onclick="closeMergeModal()"
          style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.2rem;">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <input type="hidden" id="merge-a-id">

      <div style="background:var(--surface-3);border-radius:8px;padding:12px;margin-bottom:16px;">
        <div style="font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:6px;">
          الفاتورة الأساسية (ستُضاف إليها القيمة)
        </div>
        <div id="merge-a-info" style="font-size:0.85rem;color:var(--text-primary);line-height:1.8;"></div>
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:8px;">
          الفاتورة المراد دمجها (نفس كود العميل)
        </label>
        <select id="merge-b-select" class="form-select" onchange="onMergeBSelect()">
          <option value="">— اختر فاتورة —</option>
        </select>
        <div id="merge-b-info" style="margin-top:8px;font-size:0.82rem;color:var(--text-muted);"></div>
      </div>

      <div id="merge-summary" style="display:none;background:#0f172a;border-radius:8px;padding:12px;margin-bottom:16px;font-size:0.85rem;">
        <div style="color:#94a3b8;margin-bottom:6px;font-weight:700;">ملخص الدمج:</div>
        <div id="merge-summary-text" style="color:var(--text-primary);line-height:1.8;"></div>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeMergeModal()" class="btn"
          style="background:#334155;color:#94a3b8;border:none;">إلغاء</button>
        <button onclick="executeMerge()" class="btn btn-primary" id="merge-save-btn">
          <i class="fas fa-compress-arrows-alt"></i> تأكيد الدمج
        </button>
      </div>
    </div>
  </div>

<script src="api.js?v=tt20260824b"></script>
  <script>
    let activeUser = null;
    let userBranch = '';
    let allData    = [];

    // ===== مصدر البيانات: جدول contract_invoices في Supabase (بدل n8n) =====
    const SB_URL_CI = 'https://rxtjoqulmgkkcohmgzgi.supabase.co';
    const SB_KEY_CI = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dGpvcXVsbWdra2NvaG1nemdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDQ2OTUsImV4cCI6MjA5NDI4MDY5NX0.QVoJPtlRlRIz9tdhmdTZxHtKxrwAxJq0Je4QHkFKxj0';
    const CI_URL = SB_URL_CI + '/rest/v1/contract_invoices';
    const CI_H   = { apikey: SB_KEY_CI, Authorization: 'Bearer ' + SB_KEY_CI, 'Content-Type': 'application/json' };
    const CI_HW  = { ...CI_H, Prefer: 'return=minimal' };
    // تقسيم صفحات العرض (30/صفحة)
    let currentPage = 1; const PAGE_SIZE = 30; let filteredData = [];
    function ciReviewer(){ return (activeUser && (activeUser.full_name || activeUser.username)) || localStorage.getItem('fullName') || 'مراجع'; }
    function ciNum(v){ v=(v==null?'':(''+v)).trim(); return v===''?null:(isNaN(+v)?null:+v); }

    // كتابة المراجعة على contract_invoices — بديل updateData بتاع n8n (نفس الاستدعاءات في الشاشة)
    async function updateData(p){
      try{
        const stamp = new Date().toISOString(), by = ciReviewer();
        if(p.type === 'contract_merge'){
          const r1 = await fetch(CI_URL+'?id=eq.'+encodeURIComponent(p.bill_a_id), {method:'PATCH', headers:CI_HW, body:JSON.stringify({total_bill:ciNum(p.new_total), reviewed_at:stamp, reviewed_by:by})});
          const r2 = await fetch(CI_URL+'?id=eq.'+encodeURIComponent(p.bill_b_id), {method:'PATCH', headers:CI_HW, body:JSON.stringify({bill_state:'مدموجة', merged_into:(p.bill_a_no||null), reviewed_at:stamp, reviewed_by:by})});
          return r1.ok && r2.ok;
        }
        if(p.type === 'contract_new'){
          const row = {bill_no:p.bill_no||null, bill_date:p.bill_date||null, cust_code:p.cust_code||null, cust_name_ar:p.cust_name_ar||null, total_bill:ciNum(p.total_bill), employee_name:p.employee_name||null, bill_type:p.bill_type||null, payment_type:p.payment_type||null, bill_state:p.bill_state||null, branch:p.branch||null, serial_no:p.serial_no||null, reviewed_at:stamp, reviewed_by:by};
          const r = await fetch(CI_URL, {method:'POST', headers:CI_HW, body:JSON.stringify(row)});
          return r.ok;
        }
        // contract_update — تحديث حقول المراجعة على الصف بالـid
        const patch = {reviewed_at:stamp, reviewed_by:by};
        ['bill_state','bill_type','payment_type','serial_no','cust_name_ar','claim_id','claim_date','merged_into','cust_code','employee_name'].forEach(k=>{ if(k in p) patch[k] = (p[k]===''?null:p[k]); });
        if('total_bill' in p) patch.total_bill = ciNum(p.total_bill);   // القيمة رقمية — كانت مش بتتحفظ
        const r = await fetch(CI_URL+'?id=eq.'+encodeURIComponent(p.id), {method:'PATCH', headers:CI_HW, body:JSON.stringify(patch)});
        return r.ok;
      }catch(e){ return false; }
    }

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (localStorage.getItem('userBranch') || '').trim();
        loadData();
      }
    });

    async function loadData() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="11">⏳ جاري جلب البيانات...</td></tr>';
      try {
        // pagination: سقف Supabase 1000 صف/طلب — بنجيب على صفحات لحد ما يخلص
        let all = [], from = 0; const PAGE = 1000;
        while (true) {
          const r = await fetch(CI_URL + `?select=*&order=bill_date.desc.nullslast&limit=${PAGE}&offset=${from}`, { headers: CI_H });
          if (!r.ok) break;
          const chunk = await r.json();
          all = all.concat(chunk);
          if (!Array.isArray(chunk) || chunk.length < PAGE) break;
          from += PAGE;
        }
        allData = all;
        currentPage = 1;
        applyFilter();
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--danger);padding:30px;">❌ فشل الاتصال</td></tr>';
      }
    }

    function applyFilter() {
      const stateVal  = document.getElementById('stateFilter').value;
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = allData.filter(item => {
        const state     = (item.bill_state && item.bill_state !== 'null') ? item.bill_state.trim() : '';
        const noType    = !item.bill_type    || item.bill_type    === 'null' || item.bill_type    === '';
        const noPayment = !item.payment_type || item.payment_type === 'null' || item.payment_type === '';

        let stateMatch = true;
        if (stateVal === 'default') {
          if (state === '') {
            stateMatch = true;
          } else if (state === 'فاتورة') {
            stateMatch = noType || noPayment;
          } else {
            stateMatch = false;
          }
        } else if (stateVal === 'all') {
          stateMatch = true;
        } else {
          stateMatch = (state === stateVal);
        }

        const searchMatch = !searchVal || [
          item.bill_no, item.cust_code, item.cust_name_ar,
          item.employee_name, item.branch, item.bill_type, item.payment_type
        ].some(val => String(val || '').toLowerCase().includes(searchVal));

        return stateMatch && searchMatch;
      });

      filteredData = filtered;
      renderTable(filteredData);
    }

    function calcAmount(total, paymentType) {
      const t = parseFloat(total) || 0;
      if (!paymentType || paymentType === '3/4') return (t * 0.75).toFixed(2);
      if (paymentType === 'مساهمة كاملة')        return t.toFixed(2);
      if (paymentType === 'مساهمة 50%')           return (t * 0.5).toFixed(2);
      return (t * 0.75).toFixed(2);
    }

function getNextSerial(billType) {
  const sameType = allData.filter(i =>
    String(i.bill_type || '').trim() === billType &&
    i.serial_no && i.serial_no !== 'null' && i.serial_no !== '0' &&
    (!i.claim_id || i.claim_id === 'null' || i.claim_id === '' || i.claim_id === '0')
  );
  const maxSerial = Math.max(0, ...sameType.map(i => parseInt(i.serial_no) || 0));
  return maxSerial + 1;
}

    function renderTable(items) {
      const total   = allData.length;
      const pending = allData.filter(i => {
        const s = (i.bill_state && i.bill_state !== 'null') ? i.bill_state.trim() : '';
        return s === '';
      }).length;

      document.getElementById('stats-bar').innerHTML = `
        <span style="background:var(--surface-3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-weight:700;color:var(--text-secondary);">
          📄 الكل: ${total}
        </span>
        <span style="background:#fef9c3;border-radius:20px;padding:4px 12px;font-weight:700;color:#854d0e;">
          ⏳ انتظار: ${pending}
        </span>
      `;

      const tbody = document.getElementById('table-body');
      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج</td></tr>';
        renderPager(0, 0, 0);
        return;
      }

      items.sort((a, b) => new Date(b.bill_date || 0) - new Date(a.bill_date || 0));

      const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      tbody.innerHTML = pageItems.map(item => {
        const dateObj = item.bill_date ? new Date(item.bill_date) : null;
        const dateStr = dateObj
          ? dateObj.toLocaleDateString('ar-EG', {year:'numeric', month:'numeric', day:'numeric'})
          : '---';
        const timeStr = dateObj
          ? dateObj.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true})
          : '';
        const state      = (item.bill_state && item.bill_state !== 'null') ? item.bill_state.trim() : '';
        const claimBadge = (item.claim_id && item.claim_id !== 'null' && item.claim_id !== '' && item.claim_id !== '0')
          ? `<span style="font-size:0.7rem;background:#dbeafe;color:#1d4ed8;padding:2px 8px;border-radius:20px;">📋 مطالبة</span>`
          : '';
        const serialBadge = (item.serial_no && item.serial_no !== 'null' && item.serial_no !== '0')
          ? `<span style="font-size:0.7rem;background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:20px;">م ${item.serial_no}</span>`
          : '';

        return `
          <tr>
            <td>
              <code style="font-size:0.82rem;color:var(--text-secondary);">${item.bill_no || '---'}</code>
              ${claimBadge}${serialBadge}
            </td>
            <td style="font-size:0.75rem;line-height:1.4;">
              ${dateStr}<br>
              <span style="color:var(--text-muted);font-size:0.7rem;">${timeStr}</span>
            </td>
            <td><code style="font-size:0.82rem;color:var(--text-secondary);">${(item.cust_code && item.cust_code !== 'null') ? item.cust_code : '---'}</code></td>
            <td style="font-weight:600;font-size:0.85rem;">${item.cust_name_ar || '---'}</td>
            <td><b style="color:#8b5cf6;">${item.total_bill || '0'}</b></td>
            <td style="font-size:0.82rem;">${(item.employee_name && item.employee_name !== 'null') ? item.employee_name : '---'}</td>
            <td><span class="branch-tag">${item.branch || '---'}</span></td>
            <td>
              <select class="table-select" onchange="quickUpdateBillType('${item.id}', this.value)">
                <option value=""        ${!item.bill_type || item.bill_type === 'null' ? 'selected' : ''}>— اختر —</option>
                <option value="عاملين" ${(item.bill_type || '') === 'عاملين' ? 'selected' : ''}>👷 عاملين</option>
                <option value="معاشات" ${(item.bill_type || '') === 'معاشات' ? 'selected' : ''}>👴 معاشات</option>
              </select>
            </td>
            <td>
              <select class="table-select" onchange="quickUpdatePaymentType('${item.id}', this.value)">
                <option value=""               ${!item.payment_type || item.payment_type === 'null' ? 'selected' : ''}>— اختر —</option>
                <option value="3/4"            ${(item.payment_type || '') === '3/4'           ? 'selected' : ''}>3/4</option>
                <option value="مساهمة كاملة"  ${(item.payment_type || '') === 'مساهمة كاملة' ? 'selected' : ''}>مساهمة كاملة</option>
                <option value="مساهمة 50%"    ${(item.payment_type || '') === 'مساهمة 50%'   ? 'selected' : ''}>مساهمة 50%</option>
              </select>
            </td>
            <td>
              <select class="table-select" onchange="quickUpdateState('${item.id}', this.value)">
                <option value=""               ${state === ''               ? 'selected' : ''}>⏳ قيد الانتظار</option>
                <option value="فاتورة"         ${state === 'فاتورة'         ? 'selected' : ''}>✅ فاتورة</option>
                <option value="مقابل مرتجع"   ${state === 'مقابل مرتجع'   ? 'selected' : ''}>🔄 مقابل مرتجع</option>
                <option value="لنا فاتورة"    ${state === 'لنا فاتورة'    ? 'selected' : ''}>📄 لنا فاتورة</option>
                <option value="ملغاة"          ${state === 'ملغاة'          ? 'selected' : ''}>❌ ملغاة</option>
                <option value="مدموجة"         ${state === 'مدموجة'         ? 'selected' : ''}>🔗 مدموجة</option>
              </select>
            </td>
            <td>
              <div style="display:flex;gap:4px;">
                <button class="btn btn-sm btn-icon"
                  onclick="openEditModal('${item.id}')"
                  style="background:var(--accent);color:#fff;padding:5px 8px;"
                  title="تعديل">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-icon"
                  onclick="openMergeModal('${item.id}')"
                  style="background:#8b5cf6;color:#fff;padding:5px 8px;"
                  title="دمج مع فاتورة أخرى">
                  <i class="fas fa-compress-arrows-alt"></i>
                </button>
              </div>
            </td>
          </tr>`;
      }).join('');
      renderPager(currentPage, totalPages, items.length);
    }

    // شريط التنقّل بين الصفحات
    function renderPager(page, totalPages, totalItems) {
      const el = document.getElementById('pager');
      if (!el) return;
      if (!totalItems) { el.innerHTML = ''; return; }
      const b = (label, to, disabled, active) =>
        `<button ${disabled ? 'disabled' : ''} onclick="gotoPage(${to})" style="min-width:34px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:${active ? 'var(--accent)' : 'var(--surface)'};color:${active ? '#fff' : 'var(--text-primary)'};font-weight:700;cursor:${disabled ? 'not-allowed' : 'pointer'};opacity:${disabled ? .45 : 1};font-family:var(--font)">${label}</button>`;
      let nums = '';
      for (let p = Math.max(1, page - 2); p <= Math.min(totalPages, page + 2); p++) nums += b(p, p, false, p === page);
      el.innerHTML = `<div style="display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap">
        ${b('«', 1, page <= 1)} ${b('‹', page - 1, page <= 1)}
        ${nums}
        ${b('›', page + 1, page >= totalPages)} ${b('»', totalPages, page >= totalPages)}
        <span style="margin-inline-start:8px;color:var(--text-muted);font-size:0.8rem">صفحة ${page} من ${totalPages} · ${totalItems} فاتورة</span>
      </div>`;
    }
    function gotoPage(p) { currentPage = p; renderTable(filteredData); window.scrollTo({top:0,behavior:'smooth'}); }

    // ===== Quick Updates =====
    async function quickUpdateState(id, newState) {
      const item = allData.find(x => x.id == id);
      if (!item) return;

      if (newState === 'فاتورة') {
        const hasBillType    = item.bill_type    && item.bill_type    !== 'null' && item.bill_type    !== '';
        const hasPaymentType = item.payment_type && item.payment_type !== 'null' && item.payment_type !== '';
        if (!hasBillType || !hasPaymentType) {
          alert('⚠️ برجاء اختيار نوع الفاتورة وطريقة الدفع أولاً');
          applyFilter();
          return;
        }
      }

      const currentState = (item.bill_state && item.bill_state !== 'null') ? item.bill_state.trim() : '';
      if (currentState === 'لنا فاتورة') {
        const pass = prompt('هذا الإجراء يحتاج صلاحية — أدخل كلمة المرور:');
        if (pass !== '902170') {
          alert('كلمة المرور غير صحيحة ❌');
          applyFilter();
          return;
        }
      }

      let serialNo = item.serial_no || null;
      if (newState === 'فاتورة' && (!serialNo || serialNo === 'null' || serialNo === '0')) {
        serialNo = getNextSerial(String(item.bill_type || '').trim());
      }
      if (newState !== 'فاتورة') {
        serialNo = null;
      }

      const success = await updateData({
        type:          "contract_update",
        id,
        bill_no:       item.bill_no       || null,
        bill_date:     item.bill_date     || null,
        cust_code:     item.cust_code     || null,
        cust_name_ar:  item.cust_name_ar  || null,
        total_bill:    item.total_bill    || null,
        employee_name: item.employee_name || null,
        bill_state:    newState,
        bill_type:     item.bill_type     || null,
        payment_type:  item.payment_type  || null,
        branch:        item.branch        || null,
        serial_no:     serialNo,
      });

      if (success) {
        item.bill_state = newState;
        item.serial_no  = serialNo;
        applyFilter();
      } else {
        alert("❌ فشل التحديث");
        applyFilter();
      }
    }

    async function quickUpdateBillType(id, newVal) {
      const item = allData.find(x => x.id == id);
      if (!item) return;
      const success = await updateData({
        type:          "contract_update",
        id,
        bill_no:       item.bill_no       || null,
        bill_date:     item.bill_date     || null,
        cust_code:     item.cust_code     || null,
        cust_name_ar:  item.cust_name_ar  || null,
        total_bill:    item.total_bill    || null,
        employee_name: item.employee_name || null,
        bill_state:    item.bill_state    || null,
        bill_type:     newVal             || null,
        payment_type:  item.payment_type  || null,
        branch:        item.branch        || null,
        serial_no:     item.serial_no     || null,
      });
      if (success) { item.bill_type = newVal; }
      else { alert("❌ فشل التحديث"); applyFilter(); }
    }

    async function quickUpdatePaymentType(id, newVal) {
      const item = allData.find(x => x.id == id);
      if (!item) return;
      const success = await updateData({
        type:          "contract_update",
        id,
        bill_no:       item.bill_no       || null,
        bill_date:     item.bill_date     || null,
        cust_code:     item.cust_code     || null,
        cust_name_ar:  item.cust_name_ar  || null,
        total_bill:    item.total_bill    || null,
        employee_name: item.employee_name || null,
        bill_state:    item.bill_state    || null,
        bill_type:     item.bill_type     || null,
        payment_type:  newVal             || null,
        branch:        item.branch        || null,
        serial_no:     item.serial_no     || null,
      });
      if (success) { item.payment_type = newVal; }
      else { alert("❌ فشل التحديث"); applyFilter(); }
    }

    // ===== Modal الإضافة/التعديل =====
    function openAddModal() {
      document.getElementById('modal-id').value           = '';
      document.getElementById('modal-mode').value         = 'add';
      document.getElementById('modal-title').innerHTML    = '<i class="fas fa-plus"></i> إضافة فاتورة جديدة';
      document.getElementById('modal-bill-no').value      = '';
      document.getElementById('modal-bill-no').readOnly   = false;
      document.getElementById('bill-no-note').textContent = '';
      document.getElementById('modal-bill-date').value    = new Date().toISOString().split('T')[0];
      document.getElementById('modal-cust-code').value    = '';
      document.getElementById('modal-cust-name').value    = '';
      document.getElementById('modal-total').value        = '';
      document.getElementById('modal-employee').value     = '';
      document.getElementById('modal-bill-type').value    = '';
      document.getElementById('modal-payment-type').value = '';
      document.getElementById('modal-state').value        = '';
      document.getElementById('modal-save-btn').innerHTML = '<i class="fas fa-save"></i> حفظ';
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function openEditModal(id) {
      const item = allData.find(x => x.id == id);
      if (!item) return;

      document.getElementById('modal-id').value           = id;
      document.getElementById('modal-mode').value         = 'edit';
      document.getElementById('modal-title').innerHTML    = '<i class="fas fa-edit"></i> تعديل فاتورة';
      document.getElementById('modal-bill-no').value      = item.bill_no || '';
      document.getElementById('modal-bill-no').readOnly   = true;
      document.getElementById('bill-no-note').textContent = '(لا يمكن تعديله)';
      document.getElementById('modal-cust-code').value    = item.cust_code     || '';
      document.getElementById('modal-cust-name').value    = item.cust_name_ar  || '';
      document.getElementById('modal-total').value        = item.total_bill    || '';
      document.getElementById('modal-employee').value     = item.employee_name || '';
      document.getElementById('modal-bill-type').value    = (item.bill_type    && item.bill_type    !== 'null') ? item.bill_type    : '';
      document.getElementById('modal-payment-type').value = (item.payment_type && item.payment_type !== 'null') ? item.payment_type : '';

      if (item.bill_date) {
        document.getElementById('modal-bill-date').value = item.bill_date.split('T')[0];
      } else {
        document.getElementById('modal-bill-date').value = '';
      }

      const stateVal = (item.bill_state && item.bill_state !== 'null') ? item.bill_state.trim() : '';
      document.getElementById('modal-state').value = stateVal;

      document.getElementById('modal-save-btn').innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    async function saveModal() {
      const btn  = document.getElementById('modal-save-btn');
      const mode = document.getElementById('modal-mode').value;
      const id   = document.getElementById('modal-id').value;

      const billNo      = document.getElementById('modal-bill-no').value.trim();
      const billDate    = document.getElementById('modal-bill-date').value;
      const custCode    = document.getElementById('modal-cust-code').value.trim();
      const custName    = document.getElementById('modal-cust-name').value.trim();
      const total       = document.getElementById('modal-total').value.trim();
      const employee    = document.getElementById('modal-employee').value.trim();
      const billType    = document.getElementById('modal-bill-type').value;
      const paymentType = document.getElementById('modal-payment-type').value;
      const state       = document.getElementById('modal-state').value;

      if (mode === 'add' && !billNo)  { alert("برجاء إدخال رقم الفاتورة");      return; }
      if (!custCode && !custName)      { alert("برجاء إدخال كود أو اسم العميل"); return; }

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      const success = await updateData({
        type:          mode === 'add' ? "contract_new" : "contract_update",
        id:            id || undefined,
        bill_no:       billNo,
        bill_date:     billDate      || null,
        cust_code:     custCode      || null,
        cust_name_ar:  custName      || null,
        total_bill:    total         || null,
        employee_name: employee      || null,
        bill_type:     billType      || null,
        payment_type:  paymentType   || null,
        bill_state:    state,
        branch:        userBranch,
        createdAt:     new Date().toISOString()
      });

      if (success) { closeModal(); loadData(); }
      else { alert("❌ فشل الحفظ"); }

      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
    }

    // ===== Modal الدمج =====
    function openMergeModal(id) {
      const itemA = allData.find(x => x.id == id);
      if (!itemA) return;

      const custCode   = String(itemA.cust_code || '').trim();
      const candidates = allData.filter(x => {
        const xCode = String(x.cust_code || '').trim();
        return (
          String(x.id) !== String(id) &&
          xCode === custCode &&
          x.bill_state !== 'مدموجة' &&
          (!x.claim_id || x.claim_id === 'null' || x.claim_id === '' || x.claim_id === '0')
        );
      });

      document.getElementById('merge-a-id').value = id;
      document.getElementById('merge-a-info').innerHTML = `
        <b>رقم الفاتورة:</b> ${itemA.bill_no || '---'}<br>
        <b>العميل:</b> ${itemA.cust_name_ar || '---'} (${itemA.cust_code || '---'})<br>
        <b>القيمة:</b> <span style="color:var(--warning);">${itemA.total_bill || 0}</span> جنيه
      `;

      const select = document.getElementById('merge-b-select');
      select.innerHTML = '<option value="">— اختر فاتورة —</option>';
      candidates.forEach(x => {
        const opt = document.createElement('option');
        opt.value       = x.id;
        opt.textContent = `${x.bill_no} — ${x.total_bill || 0} جنيه`;
        select.appendChild(opt);
      });

      document.getElementById('merge-b-info').textContent    = '';
      document.getElementById('merge-summary').style.display = 'none';
      document.getElementById('merge-modal').style.display   = 'flex';
    }

    function onMergeBSelect() {
      const aId   = document.getElementById('merge-a-id').value;
      const bId   = document.getElementById('merge-b-select').value;
      const itemA = allData.find(x => String(x.id) === String(aId));
      const itemB = allData.find(x => String(x.id) === String(bId));

      if (!itemB) {
        document.getElementById('merge-b-info').textContent    = '';
        document.getElementById('merge-summary').style.display = 'none';
        return;
      }

      const totalA   = parseFloat(itemA?.total_bill || 0);
      const totalB   = parseFloat(itemB.total_bill  || 0);
      const newTotal = totalA + totalB;

      document.getElementById('merge-b-info').innerHTML = `
        <span style="color:var(--text-secondary);">
          العميل: ${itemB.cust_name_ar || '---'} — القيمة: ${totalB} جنيه
        </span>`;

      document.getElementById('merge-summary').style.display = '';
      document.getElementById('merge-summary-text').innerHTML = `
        ✅ فاتورة <b>${itemA?.bill_no}</b> ستصبح قيمتها: <b style="color:var(--warning);">${newTotal} جنيه</b><br>
        🔒 فاتورة <b>${itemB.bill_no}</b> ستُخفى ولن تُضاف في المطالبات
      `;
    }

    function closeMergeModal() {
      document.getElementById('merge-modal').style.display = 'none';
    }

    async function executeMerge() {
      const aId   = document.getElementById('merge-a-id').value;
      const bId   = document.getElementById('merge-b-select').value;

      if (!bId) { alert('برجاء اختيار الفاتورة المراد دمجها'); return; }

      const itemA = allData.find(x => String(x.id) === String(aId));
      const itemB = allData.find(x => String(x.id) === String(bId));

      if (!itemA || !itemB) return;
      if (!confirm(`تأكيد دمج فاتورة ${itemB.bill_no} في فاتورة ${itemA.bill_no}؟`)) return;

      const btn = document.getElementById('merge-save-btn');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدمج...';

      const totalA   = parseFloat(itemA.total_bill || 0);
      const totalB   = parseFloat(itemB.total_bill || 0);
      const newTotal = totalA + totalB;

      const success = await updateData({
        type:      "contract_merge",
        bill_a_id: aId,
        bill_a_no: itemA.bill_no,
        bill_b_id: bId,
        new_total: newTotal
      });

      if (success) { closeMergeModal(); await loadData(); }
      else { alert('❌ فشل الدمج'); }

      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-compress-arrows-alt"></i> تأكيد الدمج';
    }

    document.getElementById('edit-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.getElementById('merge-modal').addEventListener('click', function(e) {
      if (e.target === this) closeMergeModal();
    });
  </script>
</body>
