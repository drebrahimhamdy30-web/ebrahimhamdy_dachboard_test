<script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض */
try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{padding:1rem;overflow-y:auto;height:100vh;background:var(--bg)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.topbar .lbl{font-size:.78rem;font-weight:700;color:var(--text-muted);white-space:nowrap}
.sel,.inp{height:38px;padding:0 .7rem;border:1.5px solid var(--border);border-radius:9px;font-family:'Cairo',sans-serif;font-size:.82rem;font-weight:600;color:var(--text);outline:none;background:var(--surface)}
.sel:focus,.inp:focus{border-color:var(--primary)}
.btn-go{background:var(--primary);color:#fff;border:none;border-radius:9px;padding:0 1rem;height:38px;font-family:'Cairo',sans-serif;font-weight:800;font-size:.82rem;cursor:pointer}
.btn-end{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:9px;padding:0 .9rem;height:38px;font-family:'Cairo',sans-serif;font-weight:700;font-size:.78rem;cursor:pointer}
.shift-on{display:flex;align-items:center;gap:.5rem;background:#ecfdf5;border:1px solid #bbf7d0;color:#15803d;border-radius:9px;padding:.35rem .8rem;font-size:.8rem;font-weight:700}
.tabs{display:flex;gap:.4rem;margin-bottom:.9rem;flex-wrap:wrap}
.tab{padding:.45rem .95rem;border-radius:20px;font-size:.8rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);font-family:'Cairo',sans-serif}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab .cnt{font-weight:800;margin-right:.2rem}
.searchwrap{margin-bottom:.8rem}
.searchwrap input{width:100%;max-width:420px;height:40px;padding:0 .9rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.85rem;outline:none;background:var(--surface);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:.9rem}
.rc{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.rc.reviewed{border-color:#bbf7d0}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;padding:.7rem .9rem;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.rc-cust{font-size:1.05rem;font-weight:800;line-height:1.3}
.rc-cust small{font-size:.72rem;font-weight:600;color:#94a3b8;display:block;margin-top:.1rem}
.rc-amt{text-align:left;white-space:nowrap}
.rc-amt b{font-size:1.05rem;font-weight:800;color:#67e8f9}
.rc-amt span{font-size:.68rem;color:#cbd5e1;display:block}
.rc-body{padding:.75rem .9rem;display:flex;flex-direction:column;gap:.55rem}
.rc-row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.82rem}
.rc-addr{font-size:.85rem;font-weight:600;color:var(--text);background:var(--bg);border-radius:8px;padding:.4rem .6rem}
.lk{display:inline-flex;align-items:center;gap:.25rem;border-radius:8px;padding:.32rem .6rem;font-weight:700;font-size:.76rem;text-decoration:none;border:1px solid}
.lk-call{color:#15803d;background:#dcfce7;border-color:#bbf7d0}
.lk-wa{color:#fff;background:#25D366;border-color:#25D366}
.lk-items{color:#fff;background:#0A3D62;border-color:#0A3D62;cursor:pointer}
.grp{border:1px dashed var(--border);border-radius:10px;padding:.5rem .6rem}
.grp-h{font-size:.72rem;font-weight:800;margin-bottom:.45rem;display:flex;align-items:center;gap:.3rem}
.grp-driver .grp-h{color:#0e7490}
.grp-pharm .grp-h{color:#b45309}
.qbtns{display:flex;flex-wrap:wrap;gap:.35rem}
.qb{border:1.5px solid var(--border);background:var(--surface);border-radius:8px;padding:.35rem .6rem;font-family:'Cairo',sans-serif;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--text);white-space:nowrap;transition:all .12s}
.qb:hover{border-color:var(--primary)}
.qb.on{background:#dcfce7;color:#15803d;border-color:#bbf7d0}
.chips{display:flex;flex-direction:column;gap:.3rem;margin-top:.1rem}
.chip{display:flex;align-items:center;justify-content:space-between;gap:.5rem;border-radius:8px;padding:.3rem .55rem;font-size:.76rem;font-weight:700}
.chip-driver{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}
.chip-pharm{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.chip x,.chip .x{cursor:pointer;font-weight:900;opacity:.6;flex-shrink:0}
.chip .x:hover{opacity:1}
.rc-foot{display:flex;gap:.5rem;padding:.65rem .9rem;border-top:1px solid var(--border);margin-top:auto}
.btn-done{flex:1;background:#16a34a;color:#fff;border:none;border-radius:10px;padding:.55rem;font-family:'Cairo',sans-serif;font-weight:800;font-size:.85rem;cursor:pointer}
.btn-fdone{flex:1;background:#2563eb;color:#fff;border:none;border-radius:10px;padding:.55rem;font-family:'Cairo',sans-serif;font-weight:800;font-size:.85rem;cursor:pointer}
.rev-badge{font-size:.7rem;font-weight:700;color:#15803d;background:#dcfce7;border:1px solid #bbf7d0;border-radius:8px;padding:.3rem .6rem;text-align:center;flex:1}
.pager{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:1rem 0 .3rem;flex-wrap:wrap}
.pager button{border:1.5px solid var(--border);background:var(--surface);border-radius:8px;padding:.35rem .7rem;font-family:'Cairo',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--text)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .pg{font-size:.8rem;font-weight:700;color:var(--text-muted)}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text-muted);font-size:.9rem}
.needshift{text-align:center;padding:2rem 1rem;color:var(--text-muted);font-size:.9rem;background:var(--surface);border:1px dashed var(--border);border-radius:12px}
.fu-src{font-size:.72rem;color:var(--text-muted);margin-top:.2rem}
</style>
</head>
<body>

<div class="topbar">
  <span class="lbl">الفرع:</span>
  <select class="sel" id="branchSel" onchange="onBranchChange()"><option value="">اختر الفرع...</option></select>
  <span id="shiftArea" style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap"></span>
</div>

<div id="main" style="display:none">
  <div class="tabs">
    <button class="tab active" id="tab-pending" onclick="setTab('pending')">🔍 للمراجعة <span class="cnt" id="c-pending">0</span></button>
    <button class="tab" id="tab-done" onclick="setTab('done')">✅ تمت المراجعة <span class="cnt" id="c-done">0</span></button>
    <button class="tab" id="tab-followup" onclick="setTab('followup')">💙 متابعات العملاء <span class="cnt" id="c-followup">0</span></button>
  </div>
  <div class="searchwrap"><input type="text" id="search" placeholder="🔍 بحث بالاسم أو الكود أو التليفون" oninput="onSearch()"></div>
  <div class="grid" id="cards"></div>
  <div class="pager" id="pager"></div>
</div>

<div id="noShift" class="needshift" style="display:none">
  اكتب اسمك فوق واضغط «ابدأ شيفت المراجعة» — هيظهر لك أي طلب فاتورته تتطبع من دلوقتى.
</div>

<!-- Modal: الأصناف -->
<div class="modal-overlay" id="itemsModal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title" id="itemsTitle">🧾 الأصناف</span><button class="modal-close" onclick="closeModal('itemsModal')">✕</button></div>
    <div class="modal-body" id="itemsBody"></div>
  </div>
</div>

<!-- Modal: ملاحظة -->
<div class="modal-overlay" id="noteModal">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title" id="noteTitle">ملاحظة</span><button class="modal-close" onclick="closeModal('noteModal')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="nt-oid"><input type="hidden" id="nt-tag">
      <div class="form-group" style="margin-bottom:0"><label id="nt-label">النص</label>
        <textarea class="form-control" id="nt-text" rows="3" placeholder="اكتب الملاحظة..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('noteModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveNote()">حفظ</button>
    </div>
  </div>
</div>

<!-- Modal: قفل متابعة -->
<div class="modal-overlay" id="fuModal">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">قفل المتابعة</span><button class="modal-close" onclick="closeModal('fuModal')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="fu-id">
      <div class="form-group" style="margin-bottom:0"><label>ملاحظة الاطمئنان (اختياري)</label>
        <textarea class="form-control" id="fu-note" rows="2" placeholder="مثلاً: اتكلمت معاه والحمد لله كويس"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('fuModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="doFollowupDone()">✓ تم الاطمئنان</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="lo"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js?v=20260903"></script>
<script src="../../session.js?v=20261030b"></script>
<script src="../../branches.js?v=20260904"></script>
<script src="../../pages.js?v=20260905"></script>
<script src="../../brand.js?v=20261017n"></script>
<script src="../supabase-config.js?v=20260901"></script>
<script src="../permissions.js"></script>
<script>
const SALES_ITEMS_WEBHOOK='https://agent.ebrahimhamdy.com/webhook/sales_item';
const SHIFT_KEY='phalix_review_shift';
const PER_PAGE=40;
const SL={pending:'جاهز',assigned:'على رحلة',picked:'استلم',delivered:'تم التوصيل',completed:'مكتمل',postponed:'مؤجل',cancelled:'ملغي',failed:'متعذر'};
const PL={cash:'كاش',visa:'فيزا',transfer:'تحويل',deferred:'آجل',paid:'خالص'};

// تعريف أزرار الإجراء (مقسومة جزئين)
const DRIVER_TAGS=[
  {key:'visa',           label:'💳 يحتاج فيزا', toggle:true},
  {key:'transfer',       label:'🏦 هيحوّل',     toggle:true},
  {key:'urgent',         label:'🚨 عاجل',       toggle:true},
  {key:'address_changed',label:'📍 العنوان متغيّر', toggle:false, prompt:'العنوان الجديد (اختياري):'},
  {key:'driver_note',    label:'💼 ملاحظة للطيار', toggle:false, prompt:'الملاحظة اللى هتوصل للطيار:'}
];
const PHARM_TAGS=[
  {key:'followup',       label:'💙 يحتاج متابعة', toggle:false, prompt:'سبب المتابعة (مثلاً: عميل مريض — اطمئنان):'},
  {key:'pharmacy_note',  label:'📝 ملاحظة داخلية', toggle:false, prompt:'ملاحظة داخلية للصيدلية (مش هتظهر للطيار):'}
];
// وصف التاج على الشيب
function chipText(t){
  const n=t.note?(': '+t.note):'';
  switch(t.tag){
    case 'visa': return '💳 يحتاج فيزا';
    case 'transfer': return '🏦 هيحوّل (تحويل)';
    case 'urgent': return '🚨 عاجل';
    case 'address_changed': return '📍 العنوان متغيّر'+n;
    case 'driver_note': return '💼 '+(t.note||'ملاحظة للطيار');
    case 'followup': return '💙 متابعة'+n;
    case 'pharmacy_note': return '📝 '+(t.note||'ملاحظة داخلية');
    default: return t.tag+n;
  }
}

let currentUser=getCurrentUser();
if(!currentUser) window.location.href='../auth.html';
let branches=[], curBranchId=null, shift=null;
let activeTab='pending', page=1, rows=[], tagsByOrder={}, searchQ='', fuRows=[];
let _refreshTimer=null, _itemsCache={};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('0'))d='2'+d;else if(!d.startsWith('2')&&d.length===10)d='2'+d;return d;}
function load(s){document.getElementById('lo').classList.toggle('show',s);}
function toast(msg){let t=document.getElementById('_t');if(!t){t=document.createElement('div');t.id='_t';t.style.cssText='position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:.6rem 1.25rem;border-radius:10px;font-size:.82rem;font-weight:700;z-index:9999;display:none;box-shadow:0 8px 30px rgba(0,0,0,.2)';document.body.appendChild(t);}t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
function actorName(){return (shift&&shift.reviewer_name)||currentUser?.full_name||'مراجع';}

async function init(){
  if(!currentUser)return;
  load(true);
  try{
    const isAdmin=currentUser.role==='admin';
    const {data:br}=await db.from('branches').select('id,name').order('name');
    branches=br||[];
    const sel=document.getElementById('branchSel');
    if(!isAdmin && currentUser.branch_id){
      const mine=branches.filter(b=>b.id===currentUser.branch_id);
      sel.innerHTML=mine.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
      sel.value=currentUser.branch_id; sel.disabled=true; curBranchId=currentUser.branch_id;
    }else{
      sel.innerHTML='<option value="">اختر الفرع...</option>'+branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
    }
    restoreShift();
    if(curBranchId) renderShiftArea();
    if(shift){ document.getElementById('main').style.display='block'; document.getElementById('noShift').style.display='none'; await loadData(); }
    else { document.getElementById('main').style.display='none'; document.getElementById('noShift').style.display=curBranchId?'block':'none'; }
  }catch(e){console.error(e);}
  load(false);
  if(_refreshTimer)clearInterval(_refreshTimer);
  _refreshTimer=setInterval(()=>{ if(shift && activeTab!=='done') loadData(true); },30000);
}

function onBranchChange(){
  curBranchId=document.getElementById('branchSel').value||null;
  // لو فيه شيفت لفرع تاني، نقفله من العرض (الشيفت مربوط بفرعه)
  restoreShift();
  renderShiftArea();
  if(shift){ document.getElementById('main').style.display='block'; document.getElementById('noShift').style.display='none'; loadData(); }
  else { document.getElementById('main').style.display='none'; document.getElementById('noShift').style.display=curBranchId?'block':'none'; }
}

// ===== الشيفت =====
function restoreShift(){
  shift=null;
  try{ const s=JSON.parse(localStorage.getItem(SHIFT_KEY)||'null');
    if(s && String(s.branch_id)===String(curBranchId)) shift=s;
  }catch(e){}
}
function renderShiftArea(){
  const area=document.getElementById('shiftArea');
  if(!curBranchId){ area.innerHTML=''; return; }
  if(shift){
    const t=new Date(shift.started_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    area.innerHTML=`<span class="shift-on">🟢 شيفت: ${esc(shift.reviewer_name)} — من ${t}</span><button class="btn-end" onclick="endShift()">إنهاء الشيفت</button>`;
  }else{
    area.innerHTML=`<span class="lbl">المراجع:</span><input class="inp" id="revName" placeholder="اكتب اسمك" style="width:150px"><button class="btn-go" onclick="startShift()">ابدأ شيفت المراجعة</button>`;
  }
}
async function startShift(){
  if(!curBranchId){ toast('اختر فرعًا أولاً'); return; }
  const name=(document.getElementById('revName').value||'').trim();
  if(!name){ toast('اكتب اسمك الأول'); return; }
  load(true);
  try{
    const {data,error}=await db.from('review_shifts').insert({reviewer_name:name,branch_id:Number(curBranchId),started_by:currentUser?.full_name||name}).select();
    if(error) throw error;
    shift={id:data[0].id, reviewer_name:name, branch_id:curBranchId, started_at:data[0].started_at};
    localStorage.setItem(SHIFT_KEY,JSON.stringify(shift));
    renderShiftArea();
    document.getElementById('main').style.display='block'; document.getElementById('noShift').style.display='none';
    await loadData();
  }catch(e){ console.error(e); toast('تعذّر بدء الشيفت'); }
  load(false);
}
async function endShift(){
  if(!shift){ return; }
  if(!confirm('إنهاء شيفت المراجعة؟')) return;
  try{ await db.from('review_shifts').update({ended_at:new Date().toISOString()}).eq('id',shift.id); }catch(e){}
  localStorage.removeItem(SHIFT_KEY); shift=null;
  renderShiftArea();
  document.getElementById('main').style.display='none';
  document.getElementById('noShift').style.display='block';
}

// ===== تحميل البيانات =====
async function loadData(silent){
  if(!shift){ return; }
  if(!silent) load(true);
  try{
    if(activeTab==='followup'){ await loadFollowups(); }
    else { await loadFeed(); }
  }catch(e){ console.error(e); }
  if(!silent) load(false);
}

async function loadFeed(){
  // طلبات الفرع من بداية الشيفت — الأقدم فوق. شيفت واحد لفرع واحد فأقل بكتير من السقف.
  let q=db.from('orders')
    .select('id,customer_name,cust_code,customer_phone,customer_address,cust_region,branch_id,status,total_bill_net,extra_collection,payment_method,bill_no,bill_type,created_at,notes,staff_notes,pharmacist_reviewed_at,pharmacist_reviewed_by')
    .eq('branch_id',Number(curBranchId))
    .gte('created_at',shift.started_at)
    .order('created_at',{ascending: activeTab==='pending'})
    .limit(1000); // data-ok: طلبات شيفت واحد لفرع واحد — أقل بكتير من سقف الألف
  if(activeTab==='pending') q=q.is('pharmacist_reviewed_at',null);
  else q=q.not('pharmacist_reviewed_at','is',null);
  const {data}=await q;
  rows=data||[];
  await loadTags(rows.map(r=>r.id));
  // عدّادات (على كل بيانات الشيفت مش الصفحة)
  updateCounts();
  page=1; render();
}

async function loadTags(ids){
  tagsByOrder={};
  if(!ids.length) return;
  const {data}=await db.from('order_review_tags').select('*').in('order_id',ids).is('done_at',null).order('created_at').limit(3000); // data-ok: تاجات طلبات الشيفت
  (data||[]).forEach(t=>{ (tagsByOrder[t.order_id]=tagsByOrder[t.order_id]||[]).push(t); });
}

async function updateCounts(){
  try{
    const base=db.from('orders').select('id',{count:'exact',head:true}).eq('branch_id',Number(curBranchId)).gte('created_at',shift.started_at);
    const [pend,done,fu]=await Promise.all([
      db.from('orders').select('id',{count:'exact',head:true}).eq('branch_id',Number(curBranchId)).gte('created_at',shift.started_at).is('pharmacist_reviewed_at',null),
      db.from('orders').select('id',{count:'exact',head:true}).eq('branch_id',Number(curBranchId)).gte('created_at',shift.started_at).not('pharmacist_reviewed_at','is',null),
      db.from('order_review_tags').select('id',{count:'exact',head:true}).eq('tag','followup').is('done_at',null)
    ]);
    document.getElementById('c-pending').textContent=pend.count||0;
    document.getElementById('c-done').textContent=done.count||0;
    document.getElementById('c-followup').textContent=fu.count||0;
  }catch(e){}
}

async function loadFollowups(){
  // متابعات الاطمئنان المعلّقة (كل الفروع — لأنها متابعة عميل)
  const {data}=await db.from('order_review_tags').select('*').eq('tag','followup').is('done_at',null).order('created_at',{ascending:true}).limit(1000); // data-ok: متابعات معلّقة
  const tgs=data||[];
  // نجيب بيانات الطلبات المرتبطة
  const ids=[...new Set(tgs.map(t=>t.order_id))];
  let omap={};
  if(ids.length){
    const {data:ods}=await db.from('orders').select('id,customer_name,cust_code,customer_phone,customer_address').in('id',ids).limit(1000); // data-ok: طلبات المتابعات المعلّقة
    (ods||[]).forEach(o=>omap[o.id]=o);
  }
  fuRows=tgs.map(t=>({...t, order:omap[t.order_id]||{}}));
  updateCounts();
  page=1; render();
}

// ===== البحث والتقسيم =====
function onSearch(){ searchQ=(document.getElementById('search').value||'').trim().toLowerCase(); page=1; render(); }
function filtered(){
  if(activeTab==='followup'){
    if(!searchQ) return fuRows;
    return fuRows.filter(r=>{const o=r.order||{};return (o.customer_name||'').toLowerCase().includes(searchQ)||String(o.cust_code||'').includes(searchQ)||String(o.customer_phone||'').includes(searchQ)||(r.note||'').toLowerCase().includes(searchQ);});
  }
  if(!searchQ) return rows;
  return rows.filter(o=>(o.customer_name||'').toLowerCase().includes(searchQ)||String(o.cust_code||'').includes(searchQ)||String(o.customer_phone||'').includes(searchQ));
}

function render(){
  const list=filtered();
  const total=list.length, pages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(page>pages)page=pages;
  const slice=list.slice((page-1)*PER_PAGE, page*PER_PAGE);
  const cont=document.getElementById('cards');
  if(!total){ cont.innerHTML=`<div class="empty">${activeTab==='followup'?'مفيش متابعات معلّقة':activeTab==='done'?'لسه مفيش طلبات اتراجعت':'مفيش طلبات جديدة للمراجعة — أي فاتورة تتطبع هتظهر هنا'}</div>`; document.getElementById('pager').innerHTML=''; return; }
  cont.innerHTML=slice.map(activeTab==='followup'?fuCardHtml:orderCardHtml).join('');
  renderPager(total,pages);
  try{document.querySelector('.grid').scrollIntoView({block:'start'});}catch(e){}
}

function renderPager(total,pages){
  const p=document.getElementById('pager');
  if(pages<=1){ p.innerHTML=`<span class="pg">${total} ${activeTab==='followup'?'متابعة':'طلب'}</span>`; return; }
  p.innerHTML=`<button onclick="goPage(1)" ${page===1?'disabled':''}>«</button>
    <button onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>
    <span class="pg">صفحة ${page} من ${pages} · ${total}</span>
    <button onclick="goPage(${page+1})" ${page===pages?'disabled':''}>›</button>
    <button onclick="goPage(${pages})" ${page===pages?'disabled':''}>»</button>`;
}
function goPage(n){ page=n; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function setTab(t){
  activeTab=t; page=1;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  loadData();
}

// ===== كارت الطلب =====
function orderCardHtml(o){
  const amt=Number(o.total_bill_net||0)+Number(o.extra_collection||0);
  const wa=waNum(o.customer_phone);
  const tags=tagsByOrder[o.id]||[];
  const drvTags=tags.filter(t=>t.audience==='driver');
  const phTags=tags.filter(t=>t.audience==='pharmacy');
  const isOn=(k)=>tags.some(t=>t.tag===k);
  const qbtn=(t)=>`<button class="qb ${t.toggle&&isOn(t.key)?'on':''}" onclick="onTag('${o.id}','${t.key}',${t.toggle?!isOn(t.key):true},${t.prompt?`'${esc(t.prompt).replace(/'/g,"\\'")}'`:'null'})">${t.label}${t.toggle&&isOn(t.key)?' ✓':''}</button>`;
  const chip=(t)=>`<div class="chip ${t.audience==='driver'?'chip-driver':'chip-pharm'}"><span>${esc(chipText(t))}</span><span class="x" onclick="removeTag('${o.id}','${t.tag}',${t.id})">✕</span></div>`;
  return `<div class="rc ${o.pharmacist_reviewed_at?'reviewed':''}">
    <div class="rc-top">
      <div><div class="rc-cust">👤 ${esc(o.customer_name||'—')}</div><small>كود ${esc(o.cust_code||'—')} · ${esc(SL[o.status]||o.status||'')}</small></div>
      <div class="rc-amt"><b>${amt.toLocaleString('ar-EG')} ج</b><span>${esc(PL[o.payment_method]||o.payment_method||'كاش')}</span></div>
    </div>
    <div class="rc-body">
      <div class="rc-row">
        <span style="font-weight:700;direction:ltr">${esc(o.customer_phone||'—')}</span>
        ${o.customer_phone?`<a class="lk lk-call" href="tel:${esc(o.customer_phone)}">📞 اتصال</a>`:''}
        ${wa?`<a class="lk lk-wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">🟢 واتساب</a>`:''}
        <span class="lk lk-items" onclick="openItems('${esc(String(o.bill_no||''))}','${esc(String(o.branch_id||''))}','${o.id}','${esc(String(o.cust_code||''))}')">🧾 الأصناف</span>
      </div>
      <div class="rc-addr">📍 ${esc(o.customer_address||'—')}${o.cust_region?' · '+esc(o.cust_region):''}</div>

      <div class="grp grp-driver">
        <div class="grp-h">🚗 ملاحظات تظهر للطيار</div>
        <div class="qbtns">${DRIVER_TAGS.map(qbtn).join('')}</div>
        ${drvTags.length?`<div class="chips">${drvTags.map(chip).join('')}</div>`:''}
      </div>
      <div class="grp grp-pharm">
        <div class="grp-h">💊 ملاحظات داخلية للصيدلية (لا تظهر للطيار)</div>
        <div class="qbtns">${PHARM_TAGS.map(qbtn).join('')}</div>
        ${phTags.length?`<div class="chips">${phTags.map(chip).join('')}</div>`:''}
      </div>
    </div>
    <div class="rc-foot">
      ${o.pharmacist_reviewed_at
        ?`<span class="rev-badge">✅ راجعها ${esc(o.pharmacist_reviewed_by||'—')}</span>`
        :`<button class="btn-done" onclick="markDone('${o.id}')">✅ تمت المراجعة</button>`}
    </div>
  </div>`;
}

function fuCardHtml(r){
  const o=r.order||{};
  const wa=waNum(o.customer_phone);
  const t=new Date(r.created_at).toLocaleString('ar-EG',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  return `<div class="rc">
    <div class="rc-top">
      <div><div class="rc-cust">💙 ${esc(o.customer_name||'—')}</div><small>كود ${esc(o.cust_code||'—')}</small></div>
    </div>
    <div class="rc-body">
      <div class="rc-row">
        <span style="font-weight:700;direction:ltr">${esc(o.customer_phone||'—')}</span>
        ${o.customer_phone?`<a class="lk lk-call" href="tel:${esc(o.customer_phone)}">📞 اتصال</a>`:''}
        ${wa?`<a class="lk lk-wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">🟢 واتساب</a>`:''}
      </div>
      ${r.note?`<div class="rc-addr">📝 ${esc(r.note)}</div>`:''}
      <div class="fu-src">طلبها: ${esc(r.created_by||'—')} · ${t}</div>
    </div>
    <div class="rc-foot">
      <button class="btn-fdone" onclick="openFollowupDone(${r.id})">✓ تم الاطمئنان</button>
    </div>
  </div>`;
}

// ===== الإجراءات =====
async function onTag(oid,tag,on,promptMsg){
  if(promptMsg){ openNote(oid,tag,promptMsg); return; }
  await applyTag(oid,tag,on,null);
}
async function applyTag(oid,tag,on,note){
  load(true);
  try{
    const {data,error}=await db.rpc('review_tag_set',{p_order_id:oid,p_tag:tag,p_on:on,p_note:note,p_user:actorName()});
    if(error) throw error;
    if(data && data.success===false) throw new Error(data.error||'فشل');
    await refreshOrderRow(oid);
    toast('تم');
  }catch(e){ console.error(e); toast('تعذّر الحفظ'); }
  load(false);
}
function removeTag(oid,tag,tagId){ applyTag(oid,tag,false,null); }

function openNote(oid,tag,label){
  document.getElementById('nt-oid').value=oid;
  document.getElementById('nt-tag').value=tag;
  document.getElementById('nt-label').textContent=label||'النص';
  document.getElementById('nt-text').value='';
  document.getElementById('noteTitle').textContent='إضافة ملاحظة';
  document.getElementById('noteModal').classList.add('open');
  setTimeout(()=>document.getElementById('nt-text').focus(),100);
}
async function saveNote(){
  const oid=document.getElementById('nt-oid').value;
  const tag=document.getElementById('nt-tag').value;
  const txt=(document.getElementById('nt-text').value||'').trim();
  // address_changed ممكن من غير نص (مجرد علامة)؛ الباقي محتاج نص
  if(!txt && tag!=='address_changed'){ toast('اكتب النص'); return; }
  closeModal('noteModal');
  await applyTag(oid,tag,true,txt||null);
}

async function markDone(oid){
  load(true);
  try{
    const {data,error}=await db.rpc('review_mark_done',{p_order_id:oid,p_user:actorName()});
    if(error) throw error;
    if(data && data.success===false) throw new Error(data.error||'فشل');
    // شيل الطلب من قائمة «للمراجعة» فورًا
    rows=rows.filter(r=>r.id!==oid);
    updateCounts(); render();
    toast('✅ تمت المراجعة');
  }catch(e){ console.error(e); toast('تعذّر الحفظ'); }
  load(false);
}

function openFollowupDone(id){
  document.getElementById('fu-id').value=id;
  document.getElementById('fu-note').value='';
  document.getElementById('fuModal').classList.add('open');
}
async function doFollowupDone(){
  const id=document.getElementById('fu-id').value;
  const note=(document.getElementById('fu-note').value||'').trim();
  closeModal('fuModal'); load(true);
  try{
    const {data,error}=await db.rpc('review_followup_done',{p_tag_id:Number(id),p_note:note||null,p_user:actorName()});
    if(error) throw error;
    if(data && data.success===false) throw new Error(data.error||'فشل');
    fuRows=fuRows.filter(r=>String(r.id)!==String(id));
    updateCounts(); render();
    toast('✓ تم الاطمئنان');
  }catch(e){ console.error(e); toast('تعذّر الحفظ'); }
  load(false);
}

// حدّث صف طلب واحد (تاجاته + حقوله) بعد أي إجراء من غير إعادة تحميل الكل
async function refreshOrderRow(oid){
  try{
    const {data:od}=await db.from('orders').select('id,payment_method,notes,staff_notes').eq('id',oid).limit(1);
    if(od&&od[0]){ const i=rows.findIndex(r=>r.id===oid); if(i>=0) Object.assign(rows[i],od[0]); }
    const {data:tg}=await db.from('order_review_tags').select('*').eq('order_id',oid).is('done_at',null).order('created_at');
    tagsByOrder[oid]=tg||[];
    render();
  }catch(e){}
}

// ===== الأصناف =====
async function openItems(billNo,branchId,oid,cc){
  const body=document.getElementById('itemsBody');
  document.getElementById('itemsTitle').innerHTML='🧾 أصناف الفاتورة '+(billNo?('#'+esc(billNo)):'')+(cc?` · كود ${esc(cc)}`:'');
  document.getElementById('itemsModal').classList.add('open');
  if(_itemsCache[oid]){ body.innerHTML=renderItems(_itemsCache[oid]); return; }
  if(!billNo||billNo==='null'){ body.innerHTML='<div style="color:#b91c1c;text-align:center;padding:1rem">لا يوجد رقم فاتورة لهذا الطلب</div>'; return; }
  body.innerHTML='<div style="color:#64748b;text-align:center;padding:1rem">⏳ جاري جلب الأصناف...</div>';
  try{
    const r=await fetch(SALES_ITEMS_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({branch_id:branchId||'',bill_no:String(billNo)})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    const root=Array.isArray(data)?(data[0]||{}):(data||{});
    const bills=(root&&root.Data)||[];
    const bill=bills.find(b=>String(b.bill_no)===String(billNo))||bills[0]||{};
    const items=((bill&&bill.Items)||[]).map(it=>({name:(it.itm_name_ar||it.itm_name_en||'').toString().trim(),qty:it.itm_qty,unit:it.unit_name||'',price:it.unit_price}));
    _itemsCache[oid]=items;
    body.innerHTML=renderItems(items);
  }catch(e){ body.innerHTML='<div style="color:#b91c1c;text-align:center;padding:1rem">❌ تعذّر جلب الأصناف<br><span style="font-size:.78rem">'+esc(e&&e.message||e)+'</span></div>'; }
}
function renderItems(items){
  if(!items||!items.length) return '<div style="color:#64748b;text-align:center;padding:1rem">لا توجد أصناف</div>';
  return `<table style="width:100%;border-collapse:collapse;font-size:.82rem">
    <thead><tr style="background:var(--bg)"><th style="text-align:right;padding:.4rem">الصنف</th><th style="padding:.4rem">كمية</th><th style="padding:.4rem">سعر</th></tr></thead>
    <tbody>${items.map(it=>`<tr style="border-bottom:1px solid var(--border)"><td style="padding:.4rem;font-weight:600">${esc(it.name)}</td><td style="padding:.4rem;text-align:center;font-weight:700">${esc(it.qty)}${it.unit?' '+esc(it.unit):''}</td><td style="padding:.4rem;text-align:center">${it.price!=null?esc(it.price):'—'}</td></tr>`).join('')}</tbody>
  </table>`;
}

init();
</script>
