<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرحلات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body { padding: 1.25rem; overflow-y: auto; height: 100vh; background: var(--bg); }

.top-actions { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: .625rem; }

.trips-list { display: flex; flex-direction: column; gap: .75rem; }

.trip-card {
  background: white;
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow .15s;
}
.trip-card:hover { box-shadow: var(--shadow-md); }

.trip-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .875rem 1.125rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.trip-header-right { display: flex; align-items: center; gap: .75rem; }
.trip-no { font-weight: 700; font-size: .875rem; color: var(--primary); }
.trip-driver-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem; color: white; flex-shrink: 0; }
.trip-driver-name { font-size: .82rem; font-weight: 600; }
.trip-driver-count { font-size: .7rem; color: var(--text-muted); }
.trip-header-left { display: flex; align-items: center; gap: .625rem; }
.trip-total { font-size: .875rem; font-weight: 700; color: var(--text); }
.trip-expand-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: .75rem; transition: transform .2s; padding: .2rem; }
.trip-expand-btn.expanded { transform: rotate(180deg); }

.trip-body { padding: .875rem 1.125rem; display: none; }
.trip-body.open { display: block; }

.trip-order-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .5rem 0;
  border-bottom: 1px solid var(--gray-light);
  font-size: .78rem;
  gap: .5rem;
}
.trip-order-row:last-child { border-bottom: none; }
.tor-no { font-weight: 700; color: var(--primary); flex-shrink: 0; min-width: 80px; }
.tor-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.tor-region { font-size: .65rem; font-weight: 600; background: var(--blue-light); color: #0e7490; padding: .1rem .4rem; border-radius: 6px; flex-shrink: 0; }
.tor-amount { font-weight: 700; flex-shrink: 0; }
.tor-status { flex-shrink: 0; }

.trip-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .625rem 1.125rem;
  border-top: 1px solid var(--border);
  background: var(--gray-light);
}
.trip-summary { display: flex; gap: 1rem; font-size: .75rem; }
.trip-summary-item { display: flex; flex-direction: column; gap: .1rem; }
.trip-summary-label { color: var(--text-muted); font-size: .65rem; }
.trip-summary-value { font-weight: 700; color: var(--text); }

/* New trip form */
.new-trip-card {
  background: white;
  border: 2px dashed var(--primary);
  border-radius: 12px;
  padding: 1.25rem;
  margin-bottom: 1.25rem;
}
.new-trip-title { font-weight: 700; font-size: .875rem; color: var(--primary); margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }

.order-select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .5rem; margin-top: .75rem; max-height: 250px; overflow-y: auto; }
.order-checkbox-item {
  display: flex;
  align-items: flex-start;
  gap: .5rem;
  padding: .5rem .65rem;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
  font-size: .75rem;
}
.order-checkbox-item:hover { border-color: var(--primary); background: var(--primary-light); }
.order-checkbox-item.selected { border-color: var(--primary); background: var(--primary-light); }
.order-checkbox-item input { margin-top: 2px; accent-color: var(--primary); }
.oci-info { flex: 1; min-width: 0; }
.oci-no { font-weight: 700; color: var(--primary); }
.oci-name { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oci-amount { font-weight: 700; color: var(--text); margin-top: .15rem; }

.stats-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
</style>
</head>
<body>

<div class="top-actions">
  <div>
    <div style="font-size:.875rem;font-weight:700;margin-bottom:.25rem">إدارة الرحلات</div>
    <div style="font-size:.75rem;color:var(--text-muted)">إنشاء وتتبع رحلات التوصيل</div>
  </div>
  <button class="btn btn-primary" onclick="toggleNewTripForm()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    رحلة جديدة
  </button>
</div>

<!-- Stats -->
<div class="stats-summary" id="tripStats"></div>

<!-- New Trip Form -->
<div class="new-trip-card" id="newTripForm" style="display:none">
  <div class="new-trip-title">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg>
    إنشاء رحلة جديدة
  </div>
  <div class="form-grid-2">
    <div class="form-group">
      <label>الطيار</label>
      <select class="form-control" id="tripDriverSelect">
        <option value="">اختر الطيار...</option>
      </select>
    </div>
    <div class="form-group">
      <label>ملاحظات</label>
      <input type="text" class="form-control" id="tripNotes" placeholder="ملاحظات الرحلة...">
    </div>
  </div>
  <div class="form-group">
    <label>الطلبات المتاحة (اختر الطلبات للرحلة)</label>
    <div class="order-select-grid" id="orderSelectGrid">
      <div style="font-size:.8rem;color:var(--text-muted);grid-column:1/-1">جاري التحميل...</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.875rem">
    <span id="selectedCount" style="font-size:.78rem;color:var(--text-muted)">لم يتم اختيار طلبات</span>
    <div style="display:flex;gap:.5rem">
      <button class="btn btn-outline" onclick="cancelNewTrip()">إلغاء</button>
      <button class="btn btn-green" onclick="createTrip()">إنشاء الرحلة</button>
    </div>
  </div>
</div>

<!-- Trips List -->
<div id="tripsContainer">
  <div class="empty-state"><div class="icon">⏳</div><p>جاري تحميل الرحلات...</p></div>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../permissions.js"></script>
<script>
const DRIVER_COLORS = ['#1a56db','#7c3aed','#16a34a','#ea580c','#0891b2','#ca8a04','#dc2626','#0d9488','#b45309','#1e40af'];
const STATUS_LABELS = { pending:'جاهز', picked:'في الطريق', delivered:'تم التسليم', completed:'مكتمل', cancelled:'ملغي', postponed:'مؤجل' };
const BADGE_CLASS = { pending:'badge-pending', picked:'badge-picked', delivered:'badge-delivered', completed:'badge-completed', cancelled:'badge-cancelled', postponed:'badge-postponed' };

let allTrips = [], allOrders = [], allDrivers = [], selectedOrders = new Set();

async function init() {
  const user = getCurrentUser(); if (!user) return;
  showLoading(true);
  try {
    const [tripsRes, ordersRes, driversRes] = await Promise.all([
      db.from('trips').select('*, users(full_name)').order('created_at', { ascending: false }),
      db.from('orders').select('*').eq('status', 'pending').order('created_at', { ascending: false }),
      db.from('users').select('id, full_name').eq('role', 'driver').eq('is_active', true)
    ]);
    allTrips = tripsRes.data || [];
    allOrders = ordersRes.data || [];
    allDrivers = driversRes.data || [];

    renderStats();
    renderDriverSelect();
    renderTrips();
  } catch(e) { console.error(e); }
  showLoading(false);
}

function renderStats() {
  const active = allTrips.filter(t => t.status === 'active').length;
  const completed = allTrips.filter(t => t.status === 'completed').length;
  const pending = allOrders.length;
  document.getElementById('tripStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--blue-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg></div>
      <div class="stat-label">رحلات نشطة</div>
      <div class="stat-value">${active}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--green-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="stat-label">رحلات مكتملة</div>
      <div class="stat-value">${completed}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--yellow-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ca8a04" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="stat-label">طلبات بانتظار</div>
      <div class="stat-value">${pending}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--purple-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
      <div class="stat-label">طيارين نشطون</div>
      <div class="stat-value">${allDrivers.length}</div>
    </div>`;
}

function renderDriverSelect() {
  const sel = document.getElementById('tripDriverSelect');
  sel.innerHTML = '<option value="">اختر الطيار...</option>' +
    allDrivers.map(d => `<option value="${d.id}">${d.full_name}</option>`).join('');
}

function renderOrderSelect() {
  selectedOrders.clear();
  const grid = document.getElementById('orderSelectGrid');
  if (!allOrders.length) {
    grid.innerHTML = '<div style="font-size:.8rem;color:var(--text-muted);grid-column:1/-1;text-align:center;padding:1rem">لا توجد طلبات متاحة للتوصيل</div>';
    return;
  }
  grid.innerHTML = allOrders.map(o => `
    <label class="order-checkbox-item" id="oci-${o.id}">
      <input type="checkbox" value="${o.id}" onchange="toggleOrderSelect('${o.id}', this)">
      <div class="oci-info">
        <div class="oci-no">${o.bill_no||o.id.slice(0,8)}</div>
        <div class="oci-name">${o.customer_name||o.cust_name||'—'}</div>
        <div style="font-size:.65rem;color:#0e7490">${o.cust_region||''}</div>
        <div class="oci-amount">${(o.total_bill_net||0).toLocaleString()} ج</div>
      </div>
    </label>`).join('');
}

function toggleOrderSelect(id, checkbox) {
  if (checkbox.checked) selectedOrders.add(id);
  else selectedOrders.delete(id);
  document.getElementById(`oci-${id}`).classList.toggle('selected', checkbox.checked);
  const count = selectedOrders.size;
  document.getElementById('selectedCount').textContent = count ? `${count} طلب محدد` : 'لم يتم اختيار طلبات';
}

function renderTrips() {
  const container = document.getElementById('tripsContainer');
  if (!allTrips.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🚗</div><p>لا توجد رحلات بعد</p></div>';
    return;
  }
  container.innerHTML = allTrips.map((trip, i) => {
    const driverColor = DRIVER_COLORS[i % DRIVER_COLORS.length];
    const driverName = trip.users?.full_name || trip.driver_name || 'غير محدد';
    const ordersCount = trip.orders_count || 0;
    const totalAmount = Number(trip.total_amount || 0).toLocaleString('ar-EG');
    const statusLabel = trip.status === 'active' ? 'نشطة' : trip.status === 'completed' ? 'مكتملة' : trip.status;
    const statusColor = trip.status === 'active' ? 'badge-picked' : 'badge-completed';
    const startTime = trip.created_at ? new Date(trip.created_at).toLocaleTimeString('ar-EG', {hour:'2-digit',minute:'2-digit'}) : '—';

    return `
      <div class="trip-card">
        <div class="trip-header" onclick="toggleTrip('trip-body-${trip.id}', this.querySelector('.trip-expand-btn'))">
          <div class="trip-header-right">
            <div class="trip-driver-avatar" style="background:${driverColor}">${driverName.charAt(0)}</div>
            <div>
              <div class="trip-driver-name">${driverName}</div>
              <div class="trip-driver-count">${ordersCount} طلب · ${startTime}</div>
            </div>
            <span class="badge ${statusColor}">${statusLabel}</span>
          </div>
          <div class="trip-header-left">
            <span class="trip-total">${totalAmount} ج</span>
            <button class="trip-expand-btn">▼</button>
          </div>
        </div>
        <div class="trip-body" id="trip-body-${trip.id}">
          <div id="trip-orders-${trip.id}">
            <div style="font-size:.78rem;color:var(--text-muted);text-align:center;padding:1rem">
              <button class="btn btn-outline btn-sm" onclick="loadTripOrders('${trip.id}')">تحميل الطلبات</button>
            </div>
          </div>
        </div>
        <div class="trip-footer">
          <div class="trip-summary">
            <div class="trip-summary-item"><span class="trip-summary-label">المجموع</span><span class="trip-summary-value">${totalAmount} ج</span></div>
            <div class="trip-summary-item"><span class="trip-summary-label">الطلبات</span><span class="trip-summary-value">${ordersCount}</span></div>
          </div>
          ${trip.status === 'active' ? `<button class="btn btn-outline btn-sm" onclick="completeTrip('${trip.id}')">إنهاء الرحلة</button>` : ''}
        </div>
      </div>`;
  }).join('');
}

async function loadTripOrders(tripId) {
  const { data } = await db.from('trip_orders').select('*, orders(*)').eq('trip_id', tripId);
  const orders = (data || []).map(to => to.orders).filter(Boolean);
  const container = document.getElementById(`trip-orders-${tripId}`);
  if (!orders.length) { container.innerHTML = '<div style="font-size:.78rem;color:var(--text-muted);padding:.5rem">لا توجد طلبات في هذه الرحلة</div>'; return; }
  container.innerHTML = orders.map(o => `
    <div class="trip-order-row">
      <span class="tor-no">${o.bill_no||o.id?.slice(0,8)}</span>
      <span class="tor-name">${o.customer_name||o.cust_name||'—'}</span>
      <span class="tor-region">${o.cust_region||'—'}</span>
      <span class="tor-amount">${(o.total_bill_net||0).toLocaleString()} ج</span>
      <span class="tor-status"><span class="badge ${BADGE_CLASS[o.status]||''}">${STATUS_LABELS[o.status]||o.status}</span></span>
    </div>`).join('');
}

function toggleTrip(bodyId, btn) {
  const body = document.getElementById(bodyId);
  body.classList.toggle('open');
  btn.classList.toggle('expanded', body.classList.contains('open'));
}

function toggleNewTripForm() {
  const form = document.getElementById('newTripForm');
  const visible = form.style.display !== 'none';
  form.style.display = visible ? 'none' : 'block';
  if (!visible) renderOrderSelect();
}

function cancelNewTrip() {
  document.getElementById('newTripForm').style.display = 'none';
  selectedOrders.clear();
}

async function createTrip() {
  const driverId = document.getElementById('tripDriverSelect').value;
  const notes = document.getElementById('tripNotes').value;
  if (!driverId) { alert('اختر الطيار أولاً'); return; }
  if (selectedOrders.size === 0) { alert('اختر طلباً واحداً على الأقل'); return; }

  showLoading(true);
  try {
    const driver = allDrivers.find(d => d.id === driverId);
    const selectedOrdersList = allOrders.filter(o => selectedOrders.has(o.id));
    const totalAmount = selectedOrdersList.reduce((s, o) => s + Number(o.total_bill_net || 0), 0);

    const { data: trip, error: tripError } = await db.from('trips').insert({
      driver_id: driverId,
      driver_name: driver?.full_name,
      status: 'active',
      orders_count: selectedOrders.size,
      total_amount: totalAmount,
      notes,
      created_at: new Date().toISOString()
    }).select().single();

    if (tripError) throw tripError;

    // Insert trip_orders
    await db.from('trip_orders').insert([...selectedOrders].map(orderId => ({
      trip_id: trip.id,
      order_id: orderId
    })));

    // Update orders status to picked
    await db.from('orders').update({
      status: 'picked',
      driver_id: driverId,
      deliveryman: driver?.full_name,
      updated_at: new Date().toISOString()
    }).in('id', [...selectedOrders]);

    cancelNewTrip();
    await init();
  } catch(e) {
    alert('حدث خطأ أثناء إنشاء الرحلة: ' + e.message);
    console.error(e);
  }
  showLoading(false);
}

async function completeTrip(tripId) {
  if (!confirm('هل تريد إنهاء هذه الرحلة؟')) return;
  showLoading(true);
  try {
    const { data: tripOrders } = await db.from('trip_orders').select('order_id').eq('trip_id', tripId);
    const orderIds = (tripOrders || []).map(to => to.order_id);

    await db.from('trips').update({ status: 'completed', updated_at: new Date().toISOString() }).eq('id', tripId);
    if (orderIds.length) {
      await db.from('orders').update({ status: 'completed', updated_at: new Date().toISOString() }).in('id', orderIds);
    }
    await init();
  } catch(e) { alert('حدث خطأ: ' + e.message); }
  showLoading(false);
}

function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }

init();
</script>
</body>
</html>
