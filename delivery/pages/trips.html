<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل الرحلات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body{padding:0;overflow:hidden;height:100vh;background:var(--bg);display:flex;flex-direction:column}

/* TOOLBAR */
.trips-toolbar{background:white;border-bottom:1px solid var(--border);padding:.625rem 1.25rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;flex-shrink:0}
.filter-chip{padding:.28rem .65rem;border-radius:20px;font-size:.72rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--text-muted);font-family:'Cairo',sans-serif;transition:all .12s;white-space:nowrap}
.filter-chip.active{background:var(--primary);color:white;border-color:var(--primary)}
.filter-chip.fc-green.active{background:var(--green);border-color:var(--green)}
.filter-chip.fc-blue.active{background:#0891b2;border-color:#0891b2}
.filter-chip.fc-gray.active{background:#6b7280;border-color:#6b7280}
.search-box{height:32px;padding:0 .75rem 0 2rem;border:1.5px solid var(--border);border-radius:20px;font-family:'Cairo',sans-serif;font-size:.78rem;outline:none;width:180px}
.search-box:focus{border-color:var(--primary)}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;right:.6rem;color:var(--text-muted);pointer-events:none}
.date-input{height:32px;padding:0 .5rem;border:1.5px solid var(--border);border-radius:8px;font-family:'Cairo',sans-serif;font-size:.72rem;outline:none;color:var(--text)}
.date-input:focus{border-color:var(--primary)}
.cnt-badge{font-size:.65rem;font-weight:700;padding:.08rem .35rem;border-radius:8px;background:rgba(0,0,0,.08);margin-right:.2rem}

/* STATS */
.stats-row{background:white;border-bottom:1px solid var(--border);padding:.4rem 1.25rem;display:flex;gap:1rem;flex-shrink:0;overflow-x:auto}
.stat-item{display:flex;align-items:center;gap:.35rem;font-size:.72rem;white-space:nowrap}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat-val{font-weight:800;font-size:.85rem}

/* TABLE */
.table-wrap{flex:1;overflow:auto}
.trips-table{width:100%;border-collapse:collapse;font-size:.75rem}
.trips-table thead{position:sticky;top:0;z-index:10;background:white}
.trips-table th{padding:.5rem .75rem;text-align:right;font-weight:700;color:var(--text-muted);border-bottom:2px solid var(--border);white-space:nowrap;font-size:.68rem;cursor:pointer;user-select:none}
.trips-table th:hover{color:var(--primary)}
.trips-table td{padding:.45rem .75rem;border-bottom:1px solid var(--border);vertical-align:middle}
.trips-table tr:hover td{background:#f8fafc}
.trips-table tr.row-completed td{background:#f0fdf4}
.trips-table tr.row-active td{background:#eff6ff}

/* ORDER ROWS inside trip */
.orders-expand-row td{padding:0!important;background:#f8fafc}
.orders-inner-table{width:100%;border-collapse:collapse;font-size:.72rem}
.orders-inner-table td{padding:.35rem .875rem;border-bottom:1px solid #e5e7eb}
.orders-inner-table tr:last-child td{border-bottom:none}
.orders-inner-table tr:hover td{background:#f1f5f9}

/* BADGES */
.status-badge{font-size:.62rem;font-weight:700;padding:.15rem .45rem;border-radius:20px;white-space:nowrap}
.sb-active{background:#dbeafe;color:#1e40af}
.sb-completed{background:var(--green-light);color:#15803d}
.sb-pending{background:var(--green-light);color:#15803d}
.sb-assigned{background:#fff7ed;color:#c2410c}
.sb-picked{background:var(--blue-light);color:#0e7490}
.sb-delivered{background:var(--yellow-light);color:#a16207}
.sb-postponed{background:var(--purple-light);color:#6d28d9}
.sb-cancelled{background:var(--red-light);color:#b91c1c}
.pay-badge{font-size:.62rem;font-weight:700;padding:.1rem .4rem;border-radius:6px}
.pay-cash{background:#fef3c7;color:#92400e}
.pay-visa{background:#dbeafe;color:#1e40af}
.pay-transfer{background:var(--green-light);color:#15803d}
.pay-deferred{background:#fff7ed;color:#c2410c}
.region-badge{font-size:.62rem;font-weight:600;background:var(--blue-light);color:#0e7490;padding:.1rem .35rem;border-radius:6px}
.amount-cell{font-weight:700;direction:ltr;text-align:right}
.expand-btn{background:none;border:none;cursor:pointer;font-size:.8rem;color:var(--text-muted);padding:.2rem .4rem;border-radius:5px;transition:all .12s;font-family:'Cairo',sans-serif}
.expand-btn:hover{background:var(--bg);color:var(--primary)}
.trip-no-link{font-weight:700;color:var(--primary);cursor:pointer}
.trip-no-link:hover{text-decoration:underline}

/* PAGINATION */
.pagination{background:white;border-top:1px solid var(--border);padding:.5rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-info{font-size:.72rem;color:var(--text-muted)}
.page-btns{display:flex;gap:.35rem}
.page-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:white;cursor:pointer;font-family:'Cairo',sans-serif;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .12s}
.page-btn:hover{border-color:var(--primary);color:var(--primary)}
.page-btn.active{background:var(--primary);color:white;border-color:var(--primary)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="trips-toolbar">
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-box" id="searchInput" placeholder="بحث باسم طيار أو رقم..." oninput="applyFilters()" style="padding-right:2rem">
  </div>

  <select class="date-input" id="statusSelect" onchange="setStatus(this.value)" style="width:140px" title="حالة الرحلة">
    <option value="" id="opt-all">كل الرحلات</option>
    <option value="active" id="opt-active">جارية</option>
    <option value="completed" id="opt-completed">مكتملة</option>
  </select>

  <input type="date" class="date-input" id="dateFrom" onchange="applyFilters()" title="من تاريخ">
  <input type="date" class="date-input" id="dateTo" onchange="applyFilters()" title="إلى تاريخ">

  <select class="date-input" id="branchFilter" onchange="applyFilters()" style="width:120px;display:none">
    <option value="">كل الفروع</option>
  </select>

  <select class="date-input" id="perfFilter" onchange="applyFilters()" style="width:110px" title="تقييم الرحلة">
    <option value="">كل الأداء</option>
    <option value="ممتاز">ممتاز</option>
    <option value="جيد">جيد</option>
    <option value="متأخر">متأخر</option>
  </select>

  <button class="btn btn-outline btn-sm" onclick="loadAll()" style="margin-right:auto">↻ تحديث</button>
  <span id="resultCount" style="font-size:.72rem;color:var(--text-muted);white-space:nowrap"></span>
</div>

<!-- STATS -->
<div class="stats-row" id="statsRow"></div>

<!-- TABLE -->
<div class="table-wrap">
  <table class="trips-table" id="tripsTable">
    <thead>
      <tr>
        <th style="width:32px"></th>
        <th onclick="sortBy('id')">رقم الرحلة</th>
        <th onclick="sortBy('created_at')">وقت الإنشاء ↕</th>
        <th onclick="sortBy('driver_name')">الطيار</th>
        <th onclick="sortBy('orders_count')">عدد الطلبات</th>
        <th onclick="sortBy('total_amount')">إجمالي</th>

        <th onclick="sortBy('status')">الحالة</th>
        <th>مدة الرحلة</th>
        <th onclick="sortBy('updated_at')">وقت الانتهاء</th>
        <th>الأداء / المسافة</th>
      </tr>
    </thead>
    <tbody id="tripsBody">
      <tr><td colspan="10" style="text-align:center;padding:2rem;color:var(--text-muted)">جاري التحميل...</td></tr>
    </tbody>
  </table>
</div>

<!-- PAGINATION -->
<div class="pagination">
  <span class="page-info" id="pageInfo"></span>
  <div class="page-btns" id="pageBtns"></div>
</div>

<div class="loading-overlay" id="lo"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=20260831b"></script>
<script src="../permissions.js"></script>
<script>
const STATUS_LABELS={pending:'جاهز',assigned:'على رحلة',picked:'استلم',delivered:'وصّل',completed:'مكتمل',postponed:'مؤجل',cancelled:'ملغي'};
const PAY_LABELS={cash:'كاش',visa:'فيزا',transfer:'تحويل',deferred:'آجل'};
const COLORS=['#1a56db','#7c3aed','#16a34a','#ea580c','#0891b2','#ca8a04','#dc2626'];

let pageRows=[], tripOrdersCache={}, tripPerf={}, totalCount=0, _perfIds=null;
let currentPage=1, pageSize=40, sortCol='created_at', sortDir=-1, statusFilter='';
let currentUser=null, expandedRows=new Set();

async function init(){
  currentUser=getCurrentUser();if(!currentUser)return;
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('dateFrom').value=today;
  document.getElementById('dateTo').value=today;
  if(currentUser?.role==='admin'){
    const {data:br}=await db.from('branches').select('id,name').order('name');
    const sel=document.getElementById('branchFilter');
    sel.style.display='block';
    sel.innerHTML='<option value="">كل الفروع</option>'+(br||[]).map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
    if(currentUser?.branch_id) sel.value=currentUser.branch_id;
  }
  await loadAll();
  setInterval(loadAll,120000);
}

// يبني استعلام الرحلات مع كل الفلاتر على السيرفر (فرع/حالة/تاريخ/بحث/أداء)
function buildTripsQuery(sel,opts){
  let q=db.from('trips').select(sel,opts||{});
  const branchVal=document.getElementById('branchFilter')?.value;
  if(branchVal) q=q.eq('branch_id',branchVal);
  else if(currentUser?.role!=='admin'&&currentUser?.branch_id) q=q.eq('branch_id',currentUser.branch_id);
  if(statusFilter) q=q.eq('status',statusFilter);
  const dFrom=document.getElementById('dateFrom').value;
  const dTo=document.getElementById('dateTo').value;
  if(dFrom) q=q.gte('created_at',dFrom);
  if(dTo) q=q.lte('created_at',dTo+'T23:59:59');
  const search=(document.getElementById('searchInput').value||'').trim().replace(/[,()%]/g,' ').trim();
  if(search) q=q.or(`driver_name.ilike.%${search}%,trip_number.ilike.%${search}%`);
  if(_perfIds) q=q.in('id',_perfIds);
  return q;
}

// يحمّل صفحة واحدة فقط (40 رحلة) من السيرفر + التقييمات الخاصة بها فقط
async function loadAll(){
  showLoad(true);
  try{
    // فلتر الأداء: هات معرّفات الرحلات بالتقييم المطلوب من الـ view (مقيّدة بنفس الفترة/الفرع)
    const perfF=document.getElementById('perfFilter').value;
    _perfIds=null;
    if(perfF){
      const branchVal=document.getElementById('branchFilter')?.value;
      const dFrom=document.getElementById('dateFrom').value, dTo=document.getElementById('dateTo').value;
      let pq=db.from('v_trip_perf').select('trip_id').eq('rating',perfF);
      if(branchVal) pq=pq.eq('branch_id',branchVal);
      else if(currentUser?.role!=='admin'&&currentUser?.branch_id) pq=pq.eq('branch_id',currentUser.branch_id);
      if(dFrom) pq=pq.gte('created_at',dFrom);
      if(dTo) pq=pq.lte('created_at',dTo+'T23:59:59');
      const {data:pv}=await pq;
      _perfIds=(pv||[]).map(x=>x.trip_id);
      if(!_perfIds.length){pageRows=[];totalCount=0;tripPerf={};document.getElementById('resultCount').textContent='0 رحلة';renderTable();renderPagination();await updateStats();showLoad(false);return;}
    }
    // العدد الكلي للفلتر الحالي (بدون تحميل الصفوف)
    const {count}=await buildTripsQuery('id',{count:'exact',head:true});
    totalCount=count||0;
    const maxPage=Math.max(1,Math.ceil(totalCount/pageSize));
    if(currentPage>maxPage) currentPage=maxPage;
    // الصفحة الحالية فقط (40 صف)
    const from=(currentPage-1)*pageSize;
    const {data}=await buildTripsQuery('*').order(sortCol,{ascending:sortDir>0}).range(from,from+pageSize-1);
    pageRows=data||[];
    // تقييمات الـ40 المعروضين فقط
    tripPerf={};
    const ids=pageRows.map(t=>t.id);
    if(ids.length){
      const {data:pf}=await db.from('v_trip_perf').select('*').in('trip_id',ids);
      (pf||[]).forEach(p=>{tripPerf[p.trip_id]=p;});
    }
    document.getElementById('resultCount').textContent=`${totalCount} رحلة`;
    await updateStats();
    renderTable();
    renderPagination();
    const tw=document.querySelector('.table-wrap'); if(tw) tw.scrollTop=0;
  }catch(e){console.error(e);}
  showLoad(false);
}

function fmDate(dt){if(!dt)return '—';return new Date(dt).toLocaleString('ar-EG',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function fmDur(from,to){
  if(!from||!to)return '—';
  const m=Math.floor((new Date(to)-new Date(from))/60000);
  if(m<0)return '—';
  if(m<60)return m+'د';
  return Math.floor(m/60)+'س'+(m%60?m%60+'د':'');
}

function _branchScoped(q){
  const bv=document.getElementById('branchFilter')?.value;
  if(bv) return q.eq('branch_id',bv);
  if(currentUser?.role!=='admin'&&currentUser?.branch_id) return q.eq('branch_id',currentUser.branch_id);
  return q;
}
function _periodCount(){
  let q=_branchScoped(db.from('trips').select('id',{count:'exact',head:true}));
  const dFrom=document.getElementById('dateFrom').value, dTo=document.getElementById('dateTo').value;
  if(dFrom) q=q.gte('created_at',dFrom);
  if(dTo) q=q.lte('created_at',dTo+'T23:59:59');
  return q;
}
// إحصائيات عبر count سريع (بدون تحميل الصفوف)
async function updateStats(){
  const setOpt=(id,label,n)=>{const e=document.getElementById(id);if(e)e.textContent=`${label} (${n})`;};
  const todayStr=new Date().toISOString().split('T')[0];
  try{
    const [allR,actR,compR,todayR]=await Promise.all([
      _periodCount(),
      _periodCount().eq('status','active'),
      _periodCount().eq('status','completed'),
      _branchScoped(db.from('trips').select('id',{count:'exact',head:true})).eq('status','completed').gte('created_at',todayStr)
    ]);
    setOpt('opt-all','كل الرحلات',allR.count||0);
    setOpt('opt-active','جارية',actR.count||0);
    setOpt('opt-completed','مكتملة',compR.count||0);
    // متوسط مدة الرحلات المكتملة في الصفحة المعروضة
    const done=pageRows.filter(t=>t.status==='completed'&&t.updated_at&&t.created_at);
    const avg=done.length?Math.round(done.reduce((s,t)=>s+(new Date(t.updated_at)-new Date(t.created_at))/60000,0)/done.length)+'د':'—';
    document.getElementById('statsRow').innerHTML=`
      <div class="stat-item"><div class="stat-dot" style="background:#0891b2"></div><span class="stat-val" style="color:#0891b2">${actR.count||0}</span><span>رحلة جارية</span></div>
      <div class="stat-item"><div class="stat-dot" style="background:#16a34a"></div><span class="stat-val" style="color:#16a34a">${todayR.count||0}</span><span>مكتملة اليوم</span></div>
      <div class="stat-item"><div class="stat-dot" style="background:#7c3aed"></div><span class="stat-val" style="color:#7c3aed">${avg}</span><span>متوسط مدة (الصفحة)</span></div>
      <div class="stat-item" style="margin-right:auto"><span style="font-size:.7rem;color:var(--text-muted)">إجمالي الرحلات: <strong>${totalCount}</strong></span></div>`;
  }catch(e){console.error(e);}
}

function setStatus(s){
  statusFilter=s;
  currentPage=1;
  loadAll();
}

function sortBy(col){
  if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=-1;}
  currentPage=1;
  loadAll();
}

// أي تغيير في الفلاتر (بحث/تاريخ/أداء) → رجوع للصفحة 1 وإعادة تحميل من السيرفر (مع تهدئة للبحث)
let _searchTimer=null;
function applyFilters(){
  currentPage=1;
  clearTimeout(_searchTimer);
  _searchTimer=setTimeout(loadAll,300);
}

function renderTable(){
  const page=pageRows;  // الصفحة محمّلة من السيرفر بالفعل (40 صف)
  const body=document.getElementById('tripsBody');
  if(!page.length){body.innerHTML='<tr><td colspan="10" style="text-align:center;padding:2.5rem;color:var(--text-muted)">📭 لا توجد رحلات</td></tr>';return;}

  let html='';
  page.forEach((t,i)=>{
    const isExpanded=expandedRows.has(t.id);
    const rowClass=t.status==='completed'?'row-completed':t.status==='active'?'row-active':'';
    const ini=(t.driver_name||'?').split(' ').slice(0,2).map(w=>w[0]).join('');
    const c=COLORS[i%COLORS.length];
    const dur=fmDur(t.created_at,t.status==='completed'?t.updated_at:new Date());

    html+=`<tr class="${rowClass}">
      <td><button class="expand-btn" onclick="toggleExpand('${t.id}',this)">${isExpanded?'▲':'▼'}</button></td>
      <td><span class="trip-no-link" onclick="toggleExpand('${t.id}',this.closest('tr').querySelector('.expand-btn'))">${t.id?.slice(0,8)}</span></td>
      <td style="font-size:.7rem;white-space:nowrap">${fmDate(t.created_at)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:.4rem">
          <div style="width:26px;height:26px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:white;flex-shrink:0">${ini}</div>
          <span style="font-weight:600">${t.driver_name||'—'}</span>
        </div>
      </td>
      <td style="text-align:center;font-weight:700">${t.orders_count||0}</td>
      <td class="amount-cell">${Number(t.total_amount||0).toLocaleString()}</td>

      <td><span class="status-badge sb-${t.status}">${t.status==='active'?'جارية':'مكتملة'}</span></td>
      <td style="font-size:.7rem;font-variant-numeric:tabular-nums">${dur}</td>
      <td style="font-size:.7rem;white-space:nowrap">${t.status==='completed'?fmDate(t.updated_at):'—'}</td>
      <td style="font-size:.68rem;white-space:nowrap">${(()=>{const p=tripPerf[t.id];if(!p)return '—';const rc=p.rating==='ممتاز'?'#16a34a':p.rating==='متأخر'?'#dc2626':'#ca8a04';const km=p.total_distance?(Number(p.total_distance)/1000).toFixed(1)+' كم':'';return `${p.rating?`<span style="color:${rc};font-weight:700">${p.rating}</span>`:''}${km?` · ${km}`:''}`;})()}</td>
    </tr>`;

    // Expanded orders row
    if(isExpanded){
      html+=`<tr class="orders-expand-row" id="expand-${t.id}">
        <td colspan="10">
          <div id="inner-${t.id}" style="padding:.5rem 1rem">
            <div style="text-align:center;padding:.75rem;color:var(--text-muted);font-size:.75rem">جاري تحميل الطلبات...</div>
          </div>
        </td>
      </tr>`;
    }
  });

  body.innerHTML=html;

  // Load orders for expanded rows
  page.forEach(t=>{
    if(expandedRows.has(t.id)) renderTripOrders(t.id);
  });
}

async function toggleExpand(tripId, btn){
  if(expandedRows.has(tripId)){
    expandedRows.delete(tripId);
    btn.textContent='▼';
  } else {
    expandedRows.add(tripId);
    btn.textContent='▲';
  }
  renderTable();
}

async function renderTripOrders(tripId){
  const container=document.getElementById(`inner-${tripId}`);
  if(!container)return;

  // من الكاش أو جيب من الـ DB
  if(!tripOrdersCache[tripId]){
    const {data:toData}=await db.from('trip_orders').select('order_id').eq('trip_id',tripId);
    const ids=(toData||[]).map(x=>x.order_id);
    if(ids.length){
      const {data:orders}=await db.from('orders').select('*').in('id',ids);
      tripOrdersCache[tripId]=orders||[];
    } else {
      tripOrdersCache[tripId]=[];
    }
  }

  const orders=tripOrdersCache[tripId];
  if(!orders.length){container.innerHTML='<div style="font-size:.75rem;color:var(--text-muted);padding:.5rem">لا توجد طلبات في هذه الرحلة</div>';return;}



  // تقييم الرحلة ككل: مجموع الفعلي مقابل مجموع المتوقع + العودة + إجمالي المسافة
  const trip=pageRows.find(t=>t.id===tripId)||{};
  const rExp=Number(trip.return_expected_minutes)||0;
  const rAct=Number(trip.return_actual_minutes)||0;
  const perfOrders=orders.filter(o=>o.perf_rating&&o.expected_minutes!=null&&o.actual_minutes!=null);
  let tripRatingHtml='';
  if(perfOrders.length){
    const sa=perfOrders.reduce((s,o)=>s+Number(o.actual_minutes),0)+rAct;
    const se=perfOrders.reduce((s,o)=>s+Number(o.expected_minutes),0)+rExp;
    const ratio=se>0?sa/se:1;
    const trate=ratio<=0.90?'ممتاز':ratio>=1.10?'متأخر':'جيد';
    const tc=trate==='ممتاز'?'#16a34a':trate==='متأخر'?'#dc2626':'#ca8a04';
    tripRatingHtml=`<span style="font-size:.7rem;font-weight:700;color:${tc};background:${tc}14;border-radius:6px;padding:.15rem .5rem">تقييم الرحلة: ${trate} · فعلي ${sa.toFixed(0)} / متوقع ${se.toFixed(0)} د</span>`;
  }
  // بادج مرحلة العودة للصيدلية
  let returnHtml='';
  if(trip.return_rating){
    const rc=trip.return_rating==='ممتاز'?'#16a34a':trip.return_rating==='متأخر'?'#dc2626':'#ca8a04';
    returnHtml=`<span style="font-size:.7rem;font-weight:700;color:${rc};background:${rc}14;border-radius:6px;padding:.15rem .5rem">العودة: ${trip.return_rating} · فعلي ${rAct.toFixed(0)} / متوقع ${rExp.toFixed(0)} د</span>`;
  }
  const sumDist=orders.reduce((s,o)=>s+(Number(o.distance_meters)||0),0)+(Number(trip.return_distance_meters)||0);
  const kmHtml=sumDist>0?`<span style="font-size:.7rem;font-weight:700;color:#0e7490;background:#0e749014;border-radius:6px;padding:.15rem .5rem">المسافة: ${(sumDist/1000).toFixed(1)} كم</span>`:'';

  container.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:.4rem;flex-wrap:wrap;margin-bottom:.4rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)">
      <span style="font-size:.72rem;font-weight:700;color:var(--text-muted)">${orders.length} طلب في الرحلة</span>
      <span style="display:flex;gap:.4rem;flex-wrap:wrap">${kmHtml}${returnHtml}${tripRatingHtml}</span>
    </div>
    <table class="orders-inner-table">
      <thead style="background:#f1f5f9">
        <tr>
          <td style="font-weight:700;color:var(--text-muted)">رقم الفاتورة</td>
          <td style="font-weight:700;color:var(--text-muted)">العميل</td>
          <td style="font-weight:700;color:var(--text-muted)">المنطقة</td>
          <td style="font-weight:700;color:var(--text-muted)">المبلغ</td>
          <td style="font-weight:700;color:var(--text-muted)">الدفع</td>
          <td style="font-weight:700;color:var(--text-muted)">الحالة</td>
          <td style="font-weight:700;color:var(--text-muted)">وقت التوصيل</td>
          <td style="font-weight:700;color:var(--text-muted)">المدة</td>
          <td style="font-weight:700;color:var(--text-muted)">الأداء</td>
        </tr>
      </thead>
      <tbody>
        ${orders.map(o=>{
          const pm=o.payment_method;
          const pmL=pm?PAY_LABELS[pm]:(o.bill_type||'—');
          const dur=fmDur(o.picked_at,o.delivered_at);
          const pc=o.perf_rating==='ممتاز'?'#16a34a':o.perf_rating==='متأخر'?'#dc2626':'#ca8a04';
          const perfCell=o.perf_rating
            ? `<span style="color:${pc};font-weight:700">${o.perf_rating}</span> <span style="font-size:.62rem;color:var(--text-muted)">${o.actual_minutes}/${o.expected_minutes}د</span>`
            : '—';
          return `<tr>
            <td style="font-weight:700;color:var(--primary)">${o.bill_no||o.id?.slice(0,8)}</td>
            <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.customer_name||o.cust_name||'—'}</td>
            <td>${o.cust_region?`<span class="region-badge">${o.cust_region}</span>`:'—'}</td>
            <td class="amount-cell">${Number(o.total_bill_net||0).toLocaleString()}</td>
            <td><span class="pay-badge pay-${pm||'cash'}">${pmL}</span></td>
            <td><span class="status-badge sb-${o.status}">${STATUS_LABELS[o.status]||o.status}</span></td>
            <td style="font-size:.68rem;white-space:nowrap">${fmDate(o.delivered_at)}</td>
            <td style="font-size:.68rem">${dur}</td>
            <td style="font-size:.68rem;white-space:nowrap">${perfCell}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div style="margin-top:.5rem">
      <button type="button" id="tripMapBtn-${tripId}" onclick="showTripMap('${tripId}')" style="font-size:.7rem;font-weight:700;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;border-radius:8px;padding:.4rem .8rem;cursor:pointer">🗺️ عرض مواقع التسليم على الخريطة</button>
      <div id="tripMap-${tripId}" style="display:none;height:300px;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:.4rem"></div>
    </div>`;
  // الخريطة تترسم عند الضغط فقط (مش أوتوماتيك) — توفير للنت والأداء
  window._tripMapData = window._tripMapData || {};
  window._tripMapData[tripId] = { orders: orders, branchId: trip.branch_id };
}

// عرض/إخفاء خريطة الرحلة عند الضغط (ترسم مرة واحدة)
function showTripMap(tripId){
  const el=document.getElementById('tripMap-'+tripId);
  const btn=document.getElementById('tripMapBtn-'+tripId);
  if(!el) return;
  if(el.style.display!=='none'){
    el.style.display='none';
    if(btn) btn.textContent='🗺️ عرض مواقع التسليم على الخريطة';
    return;
  }
  el.style.display='block';
  if(btn) btn.textContent='🙈 إخفاء الخريطة';
  if(el.dataset.drawn){
    if(el._leafletMap) setTimeout(()=>el._leafletMap.invalidateSize(),120);
    return;
  }
  const d=(window._tripMapData||{})[tripId];
  if(d){ initTripMap(tripId, d.orders, d.branchId); el.dataset.drawn='1'; }
}

let _pharmCache={};
// فكّ ترميز Google encoded polyline → مصفوفة [lat,lng]
function _decodePoly(str){
  let index=0,lat=0,lng=0;const coords=[];
  while(index<str.length){
    let b,shift=0,result=0;
    do{b=str.charCodeAt(index++)-63;result|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);
    lat+=(result&1)?~(result>>1):(result>>1);
    shift=0;result=0;
    do{b=str.charCodeAt(index++)-63;result|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);
    lng+=(result&1)?~(result>>1):(result>>1);
    coords.push([lat/1e5,lng/1e5]);
  }
  return coords;
}
function _numIcon(n,color){
  return L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],
    html:`<div style="background:${color};color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)">${n}</div>`});
}
async function initTripMap(tripId, orders, branchId){
  const el=document.getElementById('tripMap-'+tripId);
  if(!el || !window.L) return;
  const pts=(orders||[]).filter(o=>o.delivery_lat&&o.delivery_lng)
    .sort((a,b)=>new Date(a.delivered_at||a.picked_at||0)-new Date(b.delivered_at||b.picked_at||0));
  if(!pts.length){
    el.style.height='auto';
    el.innerHTML='<div style="padding:1rem;text-align:center;color:var(--text-muted);font-size:.72rem">لا توجد إحداثيات تسليم مسجّلة (الطيار على نسخة قديمة أو الـGPS كان مقفول)</div>';
    return;
  }
  let ph=null;
  if(branchId){
    if(_pharmCache[branchId]===undefined){
      const {data}=await db.from('dispatch_settings').select('pharmacy_lat,pharmacy_lng').eq('branch_id',branchId).maybeSingle();
      _pharmCache[branchId]=data||null;
    }
    ph=_pharmCache[branchId];
  }
  const map=L.map(el,{scrollWheelZoom:true});
  el._leafletMap=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const bounds=[];
  if(ph&&ph.pharmacy_lat){
    L.marker([+ph.pharmacy_lat,+ph.pharmacy_lng],{icon:L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],html:'<div style="font-size:20px;line-height:1">🏥</div>'})})
      .addTo(map).bindPopup('الصيدلية (نقطة الانطلاق)');
    bounds.push([+ph.pharmacy_lat,+ph.pharmacy_lng]);
  }
  pts.forEach((o,i)=>{
    const c=o.perf_rating==='ممتاز'?'#16a34a':o.perf_rating==='متأخر'?'#dc2626':o.perf_rating==='جيد'?'#ca8a04':'#2563eb';
    const km=((Number(o.distance_meters)||0)/1000).toFixed(2);
    L.marker([+o.delivery_lat,+o.delivery_lng],{icon:_numIcon(i+1,c)}).addTo(map)
      .bindPopup(`<b>${o.bill_no||''}</b> · ${o.customer_name||o.cust_name||'—'}<br>${o.cust_region||''} · مسافة ${km} كم<br>الأداء: ${o.perf_rating||'—'}`);
    bounds.push([+o.delivery_lat,+o.delivery_lng]);
  });
  // خط المسار: لكل مرحلة، ارسم المسار الحقيقي (اللي حسب عليه Google الزمن) لو متوفّر، وإلا خط مستقيم متقطّع
  let prevPt=(ph&&ph.pharmacy_lat)?[+ph.pharmacy_lat,+ph.pharmacy_lng]:null;
  pts.forEach(o=>{
    const cur=[+o.delivery_lat,+o.delivery_lng];
    let drewReal=false;
    if(o.route_polyline){
      try{
        const path=_decodePoly(o.route_polyline);
        if(path.length>1){
          L.polyline(path,{color:'#2563eb',weight:4,opacity:.85}).addTo(map);
          path.forEach(p=>bounds.push(p));
          drewReal=true;
        }
      }catch(e){}
    }
    if(!drewReal && prevPt){
      L.polyline([prevPt,cur],{color:'#2563eb',weight:3,opacity:.6,dashArray:'6,8'}).addTo(map);
    }
    prevPt=cur;
  });
  // (خط العودة اتشال من العرض عشان ماكانش بيلخبط — بنعرض مسار التوصيل بس)
  // مفتاح الألوان
  const lg=L.control({position:'bottomleft'});
  lg.onAdd=function(){
    const d=L.DomUtil.create('div');
    d.style.cssText='background:#fff;padding:4px 8px;border-radius:6px;font-size:11px;line-height:1.7;box-shadow:0 1px 5px rgba(0,0,0,.35)';
    d.innerHTML='<span style="color:#2563eb;font-weight:900">▬</span> مسار التوصيل';
    return d;
  };
  lg.addTo(map);
  if(bounds.length) map.fitBounds(bounds,{padding:[30,30],maxZoom:16});
  setTimeout(()=>map.invalidateSize(),150);
}

function renderPagination(){
  const total=Math.max(1,Math.ceil(totalCount/pageSize));
  document.getElementById('pageInfo').textContent=`صفحة ${currentPage} من ${total} · ${totalCount} رحلة`;
  const btns=document.getElementById('pageBtns');
  if(total<=1){btns.innerHTML='';return;}
  let html=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  for(let i=Math.max(1,currentPage-2);i<=Math.min(total,currentPage+2);i++)
    html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  html+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
  btns.innerHTML=html;
}

function goPage(p){
  const total=Math.max(1,Math.ceil(totalCount/pageSize));
  if(p<1||p>total)return;
  currentPage=p;
  loadAll();  // يجيب صفحة السيرفر الجديدة (40 صف)
}

function showLoad(s){document.getElementById('lo').classList.toggle('show',s);}

init();
</script>
