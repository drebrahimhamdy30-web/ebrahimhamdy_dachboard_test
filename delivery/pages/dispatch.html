<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة التوزيع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-dark:#1344b0;--primary-light:#e8f0fe;
  --green:#16a34a;--green-light:#dcfce7;
  --yellow:#ca8a04;--yellow-light:#fef9c3;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#0891b2;--blue-light:#ecfeff;
  --orange:#ea580c;--orange-light:#fff7ed;
  --text:#111827;--text-muted:#6b7280;--text-light:#9ca3af;
  --border:#e5e7eb;--bg:#f0f4f8;--white:#fff;
  --header-h:52px;--drivers-h:96px;--trips-h:26vh;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* HEADER */
.dispatch-header{height:var(--header-h);background:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0;gap:1rem}
.dh-title{color:white;font-size:.9rem;font-weight:800;display:flex;align-items:center;gap:.5rem}
.dh-title span{color:#60a5fa}
.dh-stats{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.dh-stat{display:flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap}
.dhs-pending{background:rgba(22,163,74,.2);color:#4ade80}
.dhs-picked{background:rgba(8,145,178,.2);color:#67e8f9}
.dhs-late{background:rgba(220,38,38,.2);color:#fca5a5}
.dhs-drivers{background:rgba(124,58,237,.2);color:#c4b5fd}
.refresh-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dh-right{display:flex;align-items:center;gap:.5rem}
/* ATTENDANCE NOTIFICATION */
.att-notif{position:relative}
.att-notif-btn{background:rgba(251,191,36,.2);border:1px solid rgba(251,191,36,.4);color:#fbbf24;padding:.3rem .65rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.7rem;cursor:pointer;display:flex;align-items:center;gap:.3rem;font-weight:700}
.att-notif-badge{background:#ef4444;color:white;border-radius:10px;padding:.05rem .35rem;font-size:.6rem;font-weight:800}
.att-popup{position:absolute;top:calc(100% + 8px);left:0;width:280px;background:#1e293b;border-radius:12px;border:1px solid #334155;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:100;display:none;max-height:320px;overflow-y:auto}
.att-popup.open{display:block}
.att-popup-item{padding:.625rem .875rem;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.att-popup-item:last-child{border-bottom:none}
.att-item-name{color:#e2e8f0;font-size:.75rem;font-weight:600}
.att-item-type{font-size:.65rem;font-weight:700;padding:.1rem .35rem;border-radius:5px}
.att-type-online{background:rgba(74,222,128,.2);color:#4ade80}
.att-type-break{background:rgba(251,191,36,.2);color:#fbbf24}
.att-type-offline{background:rgba(248,113,113,.2);color:#f87171}
.att-item-btns{display:flex;gap:.25rem}
.att-approve{background:#16a34a;color:white;border:none;border-radius:5px;padding:.2rem .4rem;font-size:.65rem;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700}
.att-reject{background:rgba(220,38,38,.3);color:#f87171;border:1px solid rgba(220,38,38,.3);border-radius:5px;padding:.2rem .4rem;font-size:.65rem;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700}
/* DRIVER POPUP */
.driver-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;background:#1e293b;border-radius:16px;border:1px solid #334155;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:200;display:none;padding:1.25rem}
.driver-popup.open{display:block}
.dp-close{position:absolute;top:.75rem;left:.75rem;background:rgba(255,255,255,.1);border:none;color:#94a3b8;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.dp-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:white;margin:0 auto .625rem}
.dp-name{color:#e2e8f0;font-weight:700;font-size:.9rem;text-align:center}
.dp-phone{color:#94a3b8;font-size:.75rem;text-align:center;margin-bottom:.875rem;direction:ltr}
.dp-status{font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:8px;display:inline-block;margin:.25rem auto .875rem;display:block;text-align:center;width:fit-content;margin:0 auto .875rem}
.dp-section{color:#64748b;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
.dp-row{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid #334155;font-size:.75rem}
.dp-row:last-child{border-bottom:none}
.dp-lbl{color:#94a3b8}
.dp-val{color:#e2e8f0;font-weight:600}
.dh-time{font-size:.7rem;color:#94a3b8}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#94a3b8;padding:.3rem .65rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.7rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:.3rem}
.icon-btn:hover{background:rgba(255,255,255,.15);color:white}

/* SECTION LABELS */
.section-label{display:flex;align-items:center;justify-content:space-between;padding:.3rem 1rem;flex-shrink:0}
.sl-dark{background:#1e293b;border-bottom:1px solid #334155}
.sl-light{background:#f8fafc;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.sl-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:.4rem}
.sl-dark .sl-title{color:#94a3b8}
.sl-light .sl-title{color:#475569}
.sl-badge{font-size:.62rem;font-weight:700;padding:.15rem .5rem;border-radius:10px}

/* DRIVERS */
.drivers-section{height:var(--drivers-h);background:#1e293b;flex-shrink:0;overflow:hidden}
.drivers-scroll{height:100%;display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 1rem;align-items:center}
.drivers-scroll::-webkit-scrollbar{height:3px}
.drivers-scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.driver-chip{display:flex;flex-direction:column;align-items:center;gap:.25rem;flex-shrink:0;width:72px;cursor:pointer;padding:.35rem .25rem;border-radius:10px;border:2px solid transparent;transition:all .15s}
.driver-chip:hover{background:rgba(255,255,255,.06)}
.driver-chip.selected{border-color:#60a5fa;background:rgba(96,165,250,.1)}
.driver-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:white;border:2.5px solid transparent;position:relative}
.driver-chip.sf .driver-avatar{border-color:#4ade80}
.driver-chip.sb .driver-avatar{border-color:#60a5fa}
.driver-chip.sr .driver-avatar{border-color:#f87171}
.driver-chip.sd .driver-avatar{border-color:#fbbf24}
.d-badge{position:absolute;top:-4px;left:-4px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:white;font-size:.55rem;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #1e293b}
.dc-name{font-size:.6rem;color:#cbd5e1;font-weight:600;text-align:center;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-st{font-size:.57rem;font-weight:700;padding:.08rem .32rem;border-radius:6px}
.st-f{background:rgba(74,222,128,.15);color:#4ade80}
.st-b{background:rgba(96,165,250,.15);color:#60a5fa}
.st-r{background:rgba(248,113,113,.15);color:#f87171}

/* TRIPS */
.trips-section{height:var(--trips-h);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;border-bottom:2px solid #334155}
.trips-scroll{flex:1;display:flex;gap:.625rem;overflow-x:auto;padding:.625rem 1rem;align-items:flex-start}
.trips-scroll::-webkit-scrollbar{height:4px}
.trips-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
.trip-card{width:225px;flex-shrink:0;background:white;border-radius:12px;border:1.5px solid var(--border);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .15s;display:flex;flex-direction:column}
.trip-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);transform:translateY(-1px)}
.trip-card.hl{border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,86,219,.2)}
.tc-hd{padding:.55rem .75rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--border)}
.tc-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;color:white;flex-shrink:0}
.tc-inf{flex:1;min-width:0}
.tc-nm{font-size:.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-mt{font-size:.62rem;color:var(--text-muted)}
.tc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tc-orders{padding:.4rem .5rem;display:flex;flex-direction:column;gap:.25rem;max-height:120px;overflow-y:auto;flex:1}
.tc-orders::-webkit-scrollbar{width:3px}
.tc-orders::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tc-row{display:flex;align-items:center;gap:.35rem;padding:.28rem .4rem;border-radius:7px;background:var(--bg);font-size:.67rem;cursor:pointer;transition:background .1s}
.tc-row:hover{background:var(--primary-light)}
.tc-row.late{background:var(--red-light)}
.tc-rno{font-weight:700;color:var(--primary);flex-shrink:0;min-width:48px}
.tc-rnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-rdt{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tc-rmt{font-size:.58rem;color:var(--text-muted);flex-shrink:0}
.tc-ft{padding:.4rem .75rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fafafa}
.tc-tot{font-size:.72rem;font-weight:700}
.tc-btn{font-size:.6rem;font-weight:700;padding:.2rem .5rem;border-radius:6px;cursor:pointer;border:1px solid;font-family:'Cairo',sans-serif;transition:all .15s;background:var(--green-light);color:#15803d;border-color:#bbf7d0}

/* ORDERS SECTION */
.orders-section{flex:1;display:flex;flex-direction:column;overflow:hidden}
.orders-toolbar{padding:.4rem 1rem;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.4rem;flex-shrink:0;flex-wrap:wrap}
.search-wrap{position:relative}
.search-icon{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.toolbar-search{height:30px;padding:0 .75rem 0 2rem;border:1.5px solid var(--border);border-radius:20px;font-family:'Cairo',sans-serif;font-size:.75rem;outline:none;background:var(--bg);width:165px}
.toolbar-search:focus{border-color:var(--primary)}
.ftab{padding:.25rem .6rem;border-radius:20px;font-size:.7rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--text-muted);font-family:'Cairo',sans-serif;transition:all .12s}
.ftab.active{background:var(--primary);color:white;border-color:var(--primary)}
.sel-info{font-size:.72rem;font-weight:600;color:var(--primary);display:none;margin-right:auto}
.sel-info.show{display:block}
.batch-btn{padding:.3rem .875rem;background:var(--primary);color:white;border:none;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.75rem;font-weight:700;cursor:pointer;display:none;align-items:center;gap:.35rem}
.batch-btn.show{display:flex}
.batch-btn:hover{background:var(--primary-dark)}

/* ORDERS GRID */
.orders-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:.5rem;padding:.625rem 1rem;overflow-y:auto;align-content:start}
.orders-grid::-webkit-scrollbar{width:5px}
.orders-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}

/* ORDER CARD */
.order-card{background:white;border-radius:10px;border:1.5px solid var(--border);padding:.55rem .65rem;cursor:pointer;transition:all .15s;position:relative}
.order-card:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(26,86,219,.08)}
.order-card.sel{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 2px rgba(26,86,219,.2)}
.order-card.late{border-right:3px solid var(--red)}
.order-card.sp{border-right:3px solid var(--purple)}
.order-card.sk{border-right:3px solid var(--blue)}
@keyframes urg{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.3)}50%{box-shadow:0 0 0 5px rgba(220,38,38,0)}}
.order-card.urgent{animation:urg 1.5s ease-in-out infinite}
.oc-check{position:absolute;top:.4rem;left:.4rem;width:16px;height:16px;border-radius:4px;border:2px solid var(--border);background:white;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:white;transition:all .12s}
.order-card.sel .oc-check{background:var(--primary);border-color:var(--primary)}

/* TIMERS */
.oc-timers{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:.3rem;margin-top:.1rem}
.oc-t{display:flex;align-items:center;gap:.18rem;font-size:.62rem;font-weight:700;padding:.1rem .38rem;border-radius:6px;white-space:nowrap}
.oc-t .ti{font-size:.53rem;opacity:.7;font-weight:500}
.t1{background:#f0f9ff;color:#0369a1}
.t2{background:var(--yellow-light);color:#a16207}
.t3{background:var(--purple-light);color:#6d28d9}
.t4{background:var(--green-light);color:#15803d}
.t-late{background:var(--red-light);color:#b91c1c}

.oc-customer{font-size:.76rem;font-weight:700;margin-bottom:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-address{font-size:.63rem;color:var(--text-muted);margin-bottom:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-region{font-size:.62rem;font-weight:700;background:var(--blue-light);color:#0e7490;padding:.1rem .4rem;border-radius:6px;display:inline-block;margin-bottom:.3rem}
.oc-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:.3rem;border-top:1px solid var(--bg);margin-bottom:.3rem}
.oc-amount{font-size:.72rem;font-weight:800}
.oc-pay{font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:6px}
.p-cash{background:#fef3c7;color:#92400e}
.p-visa{background:#dbeafe;color:#1e40af}
.p-transfer{background:var(--green-light);color:#15803d}
.p-deferred{background:var(--orange-light);color:#c2410c}
.oc-st{font-size:.6rem;font-weight:700;padding:.1rem .35rem;border-radius:6px}
.s-pending{background:var(--green-light);color:#15803d}
.s-assigned{background:var(--orange-light);color:#c2410c}
.s-picked{background:var(--blue-light);color:#0e7490}
.s-postponed{background:var(--purple-light);color:#6d28d9}

/* ACTION BUTTONS */
.oc-actions{display:flex;gap:.22rem;flex-wrap:wrap}
.ab{padding:.18rem .4rem;border-radius:6px;font-size:.6rem;font-weight:700;cursor:pointer;border:1px solid;transition:all .12s;font-family:'Cairo',sans-serif;white-space:nowrap}
.ab-assign  {background:var(--green-light);color:#15803d;border-color:#bbf7d0}
.ab-postpone{background:var(--purple-light);color:#6d28d9;border-color:#ddd6fe}
.ab-urgent  {background:var(--red-light);color:#b91c1c;border-color:#fecaca}
.ab-deliver {background:var(--yellow-light);color:#a16207;border-color:#fde68a}
.ab-cancel  {background:var(--bg);color:#374151;border-color:#d1d5db}
.ab-edit    {background:var(--blue-light);color:#0e7490;border-color:#a5f3fc}
.ab-log     {background:var(--bg);color:var(--text-muted);border-color:#e5e7eb}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-sm{max-width:390px}
.modal-header{padding:.875rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:1}
.modal-title{font-weight:700;font-size:.875rem}
.modal-close{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-muted);padding:.2rem}
.modal-body{padding:1.25rem}
.modal-footer{padding:.875rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:.5rem;justify-content:flex-end;position:sticky;bottom:0;background:white}
.form-group{margin-bottom:.875rem}
.form-group label{display:block;font-size:.78rem;font-weight:600;margin-bottom:.35rem}
.form-control{width:100%;height:38px;padding:0 .75rem;border:1.5px solid var(--border);border-radius:8px;font-family:'Cairo',sans-serif;font-size:.82rem;outline:none;background:white}
.form-control:focus{border-color:var(--primary)}
textarea.form-control{height:72px;padding:.5rem .75rem;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .9rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:white;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:var(--bg)}
.btn-green{background:var(--green);color:white}
.btn-red{background:var(--red);color:white}
.btn-yellow{background:var(--yellow);color:white}

/* Payment */
.pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.pay-opt{padding:.5rem .3rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.72rem;font-weight:600;cursor:pointer;border:2px solid var(--border);background:white;text-align:center;transition:all .15s}
.pay-opt:hover{border-color:var(--primary)}
.po-cash{border-color:#92400e!important;background:#fef3c7!important;color:#92400e!important}
.po-visa{border-color:#1e40af!important;background:#dbeafe!important;color:#1e40af!important}
.po-transfer{border-color:#15803d!important;background:var(--green-light)!important;color:#15803d!important}
.po-deferred{border-color:#c2410c!important;background:var(--orange-light)!important;color:#c2410c!important}

/* LOG */
.log-list{display:flex;flex-direction:column}
.log-item{display:flex;gap:.625rem;align-items:flex-start}
.log-dot-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:16px}
.log-dot{width:12px;height:12px;border-radius:50%;margin-top:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.5rem}
.log-line{width:2px;background:var(--border);flex:1;min-height:12px;margin:2px 0}
.log-content{flex:1;padding-bottom:.625rem}
.log-ev{font-size:.75rem;font-weight:700}
.log-dt{font-size:.68rem;color:var(--text-muted);margin-top:.1rem}
.log-tm{font-size:.62rem;color:var(--text-light);margin-top:.1rem}

/* Detail rows */
.d-row{display:flex;justify-content:space-between;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid #f3f4f6;font-size:.78rem;gap:1rem}
.d-row:last-child{border-bottom:none}
.d-lbl{color:var(--text-muted);font-weight:500;flex-shrink:0}
.d-val{font-weight:600;color:var(--text);text-align:left;word-break:break-word}

/* Sel list */
.sel-list{max-height:130px;overflow-y:auto;margin-bottom:.75rem}
.sel-item{display:flex;align-items:center;justify-content:space-between;padding:.3rem .5rem;border-radius:6px;background:var(--bg);margin-bottom:.2rem;font-size:.75rem}

/* Loading & Toast */
.loading-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:300;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:.6rem 1.25rem;border-radius:10px;font-size:.8rem;font-weight:600;z-index:400;display:none;align-items:center;gap:.5rem;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.show{display:flex;animation:sup .25s ease}
@keyframes sup{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.empty-msg{grid-column:1/-1;text-align:center;padding:2.5rem 1rem;color:var(--text-muted);font-size:.82rem}
</style>
</head>
<body>

<header class="dispatch-header">

const SL={pending:'جاهز',assigned:'على رحلة',picked:'استلم',delivered:'تم التوصيل',completed:'مكتمل',postponed:'مؤجل',cancelled:'ملغي'};

let allOrders=[],allDrivers=[],activeTrips=[],tripOrdersMap={};

setInterval(()=>{document.getElementById('clockTime').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);

// Timers helpers
function fm(mins){if(mins<0)mins=0;return mins<60?`${mins}د`:`${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}`}
function dm(from,to=new Date()){return Math.floor((new Date(to)-new Date(from))/60000)}
function getBillDate(o){if(!o.bill_date)return new Date(o.created_at);return new Date(new Date(o.bill_date).getTime()-2*60*60*1000);}
function isLate(o){
  if(['completed','cancelled','delivered'].includes(o.status))return false;
  const base=getBillDate(o);
  if(o.status==='pending')   return dm(base)>(dispatchSettings?.late_threshold_minutes||30);
  if(o.status==='assigned')  return dm(o.assigned_at||base)>(dispatchSettings?.max_assigned_minutes||10);
  if(o.status==='picked')    return dm(o.picked_at||base)>(dispatchSettings?.max_picked_minutes||30);
  return false;
}
function isStageAlert(o){
  // تحذير مرحلة محددة
  const base=getBillDate(o);
  if(o.status==='pending')   return dm(base)>(dispatchSettings?.max_pending_minutes||10);
  if(o.status==='assigned')  return dm(o.assigned_at||base)>(dispatchSettings?.max_assigned_minutes||10);
  if(o.status==='picked')    return dm(o.picked_at||base)>(dispatchSettings?.max_picked_minutes||30);
  return false;
}

function buildTimers(o){
  const base=getBillDate(o);
  const late=isLate(o);
  const alert=isStageAlert(o);
  let html='';

  // إنشاء منذ — وقت من إنشاء الطلب لحد دلوقتي
  const t1=dm(base);
  const t1cls=late?'t-late':alert?'t2':'t1';
  html+=`<span class="oc-t ${t1cls}" title="إنشاء منذ"><span class="ti">إنشاء منذ</span> ${fm(t1)}</span>`;

  // تعيين منذ — وقت من التعيين لحد دلوقتي (لو assigned وما استلمش)
  if(o.assigned_at && !o.picked_at){
    const p=dm(o.assigned_at);
    const pAlert=p>(dispatchSettings?.max_assigned_minutes||10);
    html+=`<span class="oc-t ${pAlert?'t-late':'t3'}" title="تعيين منذ"><span class="ti">تعيين منذ</span> ${fm(p)}</span>`;
  }

  // استلم منذ — وقت من الاستلام لحد دلوقتي (لو picked وما وصلش)
  if(o.picked_at && !o.delivered_at){
    const d=dm(o.picked_at);
    const dAlert=d>(dispatchSettings?.max_picked_minutes||30);
    html+=`<span class="oc-t ${dAlert?'t-late':'t3'}" title="استلم منذ"><span class="ti">استلم منذ</span> ${fm(d)}</span>`;
  }

  // وصّل منذ — وقت من التوصيل لحد دلوقتي
  if(o.delivered_at){
    const a=dm(o.delivered_at);
    html+=`<span class="oc-t t4" title="وصّل منذ"><span class="ti">وصّل منذ</span> ${fm(a)}</span>`;
  }

  return html;
}

// ===== LOAD =====
let dispatchSettings = null;

async function loadAll(){
  showLoading(true);
  try{
    const [oR,dR,tR,rrR]=await Promise.all([
      db.from('orders').select('*').order('created_at',{ascending:false}),
      db.from('drivers').select('*,branches(name)').eq('is_active',true).eq('is_online',true).order('full_name'),
      db.from('trips').select('*').eq('status','active').order('created_at',{ascending:false}),
      db.from('trip_orders').select('*')
    ]);
    allOrders=oR.data||[];allDrivers=dR.data||[];activeTrips=tR.data||[];
    // Load dispatch settings
    if(currentUser?.branch_id){
      const dsRes=await db.from('dispatch_settings').select('*').eq('branch_id',currentUser.branch_id);
      dispatchSettings=dsRes.data?.[0]||null;
    }
    tripOrdersMap={};
    (rrR.data||[]).forEach(r=>{if(!tripOrdersMap[r.trip_id])tripOrdersMap[r.trip_id]=[];tripOrdersMap[r.trip_id].push(r.order_id);});
    await loadAttendanceData();
    renderHeader();renderDrivers();renderTrips();renderOrders();
  }catch(e){console.error(e);showToast('خطأ في التحميل');}

}
setInterval(()=>{renderOrders();renderTrips();},60000);
setInterval(loadAll,30000);

// ===== HEADER =====
function renderHeader(){
  const u=allOrders.filter(o=>!o.driver_id&&['pending','postponed'].includes(o.status)).length;
  const p=allOrders.filter(o=>['assigned','picked'].includes(o.status)).length;
  const l=allOrders.filter(o=>isLate(o)).length;
  document.getElementById('headerStats').innerHTML=`
    <span class="dh-stat dhs-pending">📦 ${u} غير موزع</span>

    ${l>0?`<span class="dh-stat dhs-late">⚠️ ${l} متأخر`:''}
    <span class="dh-stat dhs-drivers">👤 ${allDrivers.length} طيار</span>`;
}

// ===== DRIVERS =====
let attendanceToday=[];

async function loadAttendanceData(){
  try{
    const today=new Date().toISOString().split('T')[0];
    const {data}=await db.from('driver_attendance').select('*').eq('date',today).order('created_at',{ascending:false});
    attendanceToday=data||[];
    renderAttNotif();
  }catch(e){}
}

function getDriverAttStatus(driverId){
  const recs=attendanceToday.filter(r=>r.driver_id===driverId).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!recs.length)return 'offline';
  return recs[0].status;
}

function getDriverWorkMins(driverId){
  const recs=attendanceToday.filter(r=>r.driver_id===driverId&&r.status==='online'&&r.approved_at);
  let mins=0;
  for(const r of recs){
    const end=r.ended_at?new Date(r.ended_at):new Date();
    mins+=Math.floor((end-new Date(r.approved_at))/60000);
  }
  return mins;
}

function fmWorkTime(mins){if(mins<60)return `${mins}د`;return `${Math.floor(mins/60)}س${mins%60}د`;}

function renderAttNotif(){
  const pending=attendanceToday.filter(r=>r.status.endsWith('_request'));
  // Update header button
  const btn=document.getElementById('attNotifBtn');
  if(btn){
    if(pending.length>0){btn.style.display='flex';document.getElementById('attNotifCount').textContent=pending.length;}
    else btn.style.display='none';
  }
  // Update right bar in drivers section
  const bar=document.getElementById('attRequestsBar');
  if(!bar)return;
  if(!pending.length){bar.style.display='none';return;}
  bar.style.display='flex';
  const typeLabels={'online_request':'حضور','offline_request':'انصراف','break_request':'استراحة'};
  const typeColors={'online_request':'#4ade80','offline_request':'#f87171','break_request':'#fbbf24'};
  bar.innerHTML='<div style="font-size:.55rem;color:#64748b;white-space:nowrap;writing-mode:vertical-rl;text-orientation:mixed;padding:.2rem 0">طلبات</div>'+
  pending.map(r=>{
    const driver=allDrivers.find(d=>d.id===r.driver_id)||{full_name:'؟'};
    const ini=(driver.full_name||'؟').split(' ').slice(0,2).map(w=>w[0]).join('');
    const color=typeColors[r.status]||'#94a3b8';
    const label=typeLabels[r.status]||'';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:.2rem;cursor:pointer;flex-shrink:0" onclick="showAttRequest('${r.id}','${r.status}','${r.driver_id}','${driver.full_name}')">
      <div style="width:40px;height:40px;border-radius:50%;background:#334155;border:2.5px solid ${color};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;color:white;position:relative">
        ${ini}
        <div style="position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:.45rem;color:#0f172a;font-weight:800">!</div>
      </div>
      <div style="font-size:.52rem;color:${color};font-weight:700">${label}</div>
    </div>`;
  }).join('');
}

function showAttRequest(id, status, driverId, driverName){
  const typeLabels={'online_request':'طلب حضور','offline_request':'طلب انصراف','break_request':'طلب استراحة'};
  if(confirm(`${driverName}\n${typeLabels[status]||status}\n\nموافقة؟`)){
    approveAtt(id,status,driverId);
  } else if(confirm('رفض الطلب؟')){
    rejectAtt(id,driverId);
  }
}

function renderAttPopupContent(pending){

  const typeClass={'online_request':'att-type-online','offline_request':'att-type-offline','break_request':'att-type-break'};
  document.getElementById('attPopup').innerHTML=pending.map(r=>{
    const driver=allDrivers.find(d=>d.id===r.driver_id)||{full_name:'—'};
    return `<div class="att-popup-item">
      <div>
        <div class="att-item-name">${driver.full_name}</div>
        <span class="att-item-type ${typeClass[r.status]||''}">${typeLabels[r.status]||r.status}</span>
      </div>
      <div class="att-item-btns">
        <button class="att-approve" onclick="approveAtt('${r.id}','${r.status}','${r.driver_id}')">✓</button>

      </div>

async function approveAtt(id,status,driverId){
  const now=new Date().toISOString();
  const today=new Date().toISOString().split('T')[0];
  const targetStatus=status.replace('_request','');
  await db.from('driver_attendance').update({status:targetStatus,approved_at:now}).eq('id',id);
  if(targetStatus==='offline'||targetStatus==='break'){
    const prevOnline=attendanceToday.find(r=>r.driver_id===driverId&&r.status==='online'&&!r.ended_at);
    if(prevOnline)await db.from('driver_attendance').update({ended_at:now}).eq('id',prevOnline.id);
  }
  showToast('✓ تمت الموافقة');
  await loadAttendanceData();
  await loadAll();
}

async function rejectAtt(id,driverId){
  // رجّع الطيار لحالته السابقة
  const driverRecs=attendanceToday.filter(r=>r.driver_id===driverId&&!r.status.endsWith('_request')).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const prevStatus=driverRecs[0]?.status||'offline';
  // احذف الطلب
  await db.from('driver_attendance').delete().eq('id',id);
  showToast('تم الرفض — رجع للحالة السابقة');
  await loadAttendanceData();
  await loadAll();
}

function renderDrivers(){
  const el=document.getElementById('driversScroll');
  // فقط الطيارين الحاضرين (online أو break)
  const presentDrivers=allDrivers.filter(d=>{
    const s=getDriverAttStatus(d.id);
    return s==='online'||s==='break'||s==='online_request';
  });
  // لو مفيش attendance data → اعرض كل الأونلاين زي الأول
  const displayDrivers=attendanceToday.length>0?presentDrivers:allDrivers.filter(d=>d.is_online);
  document.getElementById('driversLabel').textContent=`${displayDrivers.length} طيار`;
  if(!displayDrivers.length){el.innerHTML='<div style="color:#64748b;font-size:.75rem;padding:.5rem">لا يوجد طيارين حاضرين</div>';return;}

  const pickedMap={};allOrders.filter(o=>o.status==='picked'&&o.driver_id).forEach(o=>pickedMap[o.driver_id]=(pickedMap[o.driver_id]||0)+1);
  const assignedMap={};allOrders.filter(o=>o.status==='assigned'&&o.driver_id).forEach(o=>assignedMap[o.driver_id]=(assignedMap[o.driver_id]||0)+1);

  el.innerHTML=displayDrivers.map((d,i)=>{
    const c=DC[i%DC.length];
    const attStatus=getDriverAttStatus(d.id);
    const onTrip=(pickedMap[d.id]||0)+(assignedMap[d.id]||0);
    const workMins=getDriverWorkMins(d.id);

    // تحديد اللون والحالة
    let sc,st,sl;
    if(attStatus==='break'){
      sc='sr';st='st-r';sl='استراحة';
    } else if(onTrip>0){
      sc='sb';st='st-b';sl=`${onTrip} طلب`;
    } else {
      sc='sf';st='st-f';sl='متاح';
    }

    const ini=(d.full_name||'?').split(' ').slice(0,2).map(w=>w[0]).join('');
    const workLabel=workMins>0?fmWorkTime(workMins):'';

    return `<div class="driver-chip ${sc} ${filterDriver===d.id?'selected':''}" onclick="openDriverPopup('${d.id}')">
      <div class="driver-avatar" style="background:${c}">${ini}</div>
      <div class="dc-name">${(d.full_name||'').split(' ').slice(0,2).join(' ')}</div>
      <div class="dc-st ${st}">${sl}</div>
      ${workLabel?`<div style="font-size:.52rem;color:#94a3b8">${workLabel}</div>`:''}
    </div>`;
  }).join('');
}

async function openDriverPopup(driverId){
  const d=allDrivers.find(x=>x.id===driverId);if(!d)return;
  const i=allDrivers.indexOf(d);
  const c=DC[i%DC.length];
  const attStatus=getDriverAttStatus(driverId);
  const workMins=getDriverWorkMins(driverId);
  const ini=(d.full_name||'?').split(' ').slice(0,2).map(w=>w[0]).join('');

  document.getElementById('dp-avatar').textContent=ini;
  document.getElementById('dp-avatar').style.background=c;
  document.getElementById('dp-name').textContent=d.full_name||'—';
  document.getElementById('dp-phone').textContent=d.phone||'لا يوجد رقم';

  const statusMap={online:'🟢 حاضر',break:'🔴 في استراحة',offline:'⚫ غير حاضر',online_request:'⏳ طلب حضور',offline_request:'⏳ طلب انصراف',break_request:'⏳ طلب استراحة'};
  const statusColors={online:'rgba(74,222,128,.2)',break:'rgba(248,113,113,.2)',offline:'rgba(148,163,184,.2)'};
  const statusEl=document.getElementById('dp-status');
  statusEl.textContent=(statusMap[attStatus]||attStatus)+(workMins>0?` · ${fmWorkTime(workMins)}`:'');
  statusEl.style.background=statusColors[attStatus]||'rgba(148,163,184,.2)';
  statusEl.style.color=attStatus==='online'?'#4ade80':attStatus==='break'?'#f87171':'#94a3b8';

  // جيب الرحلات اليوم وملخصها
  const today=new Date().toISOString().split('T')[0];
  const {data:trips}=await db.from('trips').select('id,route_id,status,orders_count,created_at').eq('driver_id',driverId).gte('created_at',today+'T00:00:00');
  const tripsEl=document.getElementById('dp-trips');
  if(!trips?.length){
    tripsEl.innerHTML='<div style="color:#64748b;font-size:.75rem;text-align:center;padding:.5rem">لا توجد رحلات اليوم</div>';
  } else {
    const routeIds=[...new Set(trips.map(t=>t.route_id).filter(Boolean))];
    let routeNames={};
    if(routeIds.length){
      const {data:routes}=await db.from('routes').select('id,name').in('id',routeIds);
      (routes||[]).forEach(r=>routeNames[r.id]=r.name);
    }
    const summary={};
    trips.forEach(t=>{
      const rname=routeNames[t.route_id]||'بدون خط';
      if(!summary[rname])summary[rname]={count:0,orders:0};
      summary[rname].count++;
      summary[rname].orders+=t.orders_count||0;
    });
    tripsEl.innerHTML=Object.entries(summary).map(([route,data])=>`
      <div class="dp-row">
        <span class="dp-lbl">${route}</span>
        <span class="dp-val">${data.count} رحلة · ${data.orders} طلب</span>
      </div>`).join('');
  }

  document.getElementById('driverPopup').classList.add('open');
}

function setFilter(f,el){currentFilter=f;document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderOrders();}

function renderOrders(){
  const search=document.getElementById('orderSearch').value.toLowerCase();
  let orders=[...allOrders];
  if(currentFilter==='pending') orders=orders.filter(o=>o.status==='pending');
  else if(currentFilter==='postponed') orders=orders.filter(o=>o.status==='postponed');
  else if(currentFilter==='picked') orders=orders.filter(o=>o.status==='picked');
  else if(currentFilter==='late') orders=orders.filter(o=>isLate(o));
  else orders=orders.filter(o=>(o.status==='pending'&&!o.driver_id)||o.status==='postponed');

  if(search) orders=orders.filter(o=>
    (o.bill_no||'').toLowerCase().includes(search)||
    (o.customer_name||o.cust_name||'').toLowerCase().includes(search)||
    (o.cust_region||'').toLowerCase().includes(search)||
    (o.customer_address||o.cust_address||'').toLowerCase().includes(search)
  );

  const all=allOrders.filter(o=>
    (o.status==='pending'&&!o.driver_id)||
    o.status==='postponed'||
    ['assigned','picked'].includes(o.status)
  );
  document.getElementById('f-all').textContent=all.length;
  document.getElementById('f-pending').textContent=allOrders.filter(o=>o.status==='pending'&&!o.driver_id).length;
  document.getElementById('f-postponed').textContent=allOrders.filter(o=>o.status==='postponed').length;
  document.getElementById('f-picked').textContent=allOrders.filter(o=>['assigned','picked'].includes(o.status)).length;
  document.getElementById('f-late').textContent=allOrders.filter(o=>isLate(o)).length;

  orders.sort((a,b)=>{
    const ap=isLate(a)?0:{pending:1,postponed:2,assigned:3,picked:4}[a.status]||9;
    const bp=isLate(b)?0:{pending:1,postponed:2,assigned:3,picked:4}[b.status]||9;
    if(ap!==bp)return ap-bp;
    return new Date(a.bill_date||a.created_at)-new Date(b.bill_date||b.created_at);
  });

  const grid=document.getElementById('ordersGrid');
  if(!orders.length){grid.innerHTML='<div class="empty-msg">📭 لا توجد طلبات</div>';return;}

  grid.innerHTML=orders.map(o=>{
    const late=isLate(o);
    const sel=selectedOrders.has(o.id);
    const cn=o.customer_name||o.cust_name||'—';
    const pm=o.payment_method||(o.bill_type?.includes('فيزا')?'visa':'cash');
    const pmL=PL[pm]||o.bill_type||'كاش';
    const pmC=`p-${pm==='visa'?'visa':pm==='transfer'?'transfer':pm==='deferred'?'deferred':'cash'}`;
    const stC=`s-${o.status}`;

    let actions='';
    if(o.status==='pending'&&!o.driver_id){
      actions+=`<button class="ab ab-assign" onclick="quickAssign('${o.id}',event)">تعيين</button>`;
      actions+=`<button class="ab ab-postpone" onclick="openPostpone('${o.id}',event)">تأجيل</button>`;
      actions+=`<button class="ab ab-urgent" onclick="markUrgent('${o.id}',event)">عاجل</button>`;
      actions+=`<button class="ab ab-cancel" onclick="openCancel('${o.id}',event)">إلغاء</button>`;
    }
    if(o.status==='postponed'){
      actions+=`<button class="ab ab-assign" onclick="quickAssign('${o.id}',event)">تعيين</button>`;
      actions+=`<button class="ab ab-urgent" onclick="markUrgent('${o.id}',event)">عاجل</button>`;
      actions+=`<button class="ab ab-cancel" onclick="openCancel('${o.id}',event)">إلغاء</button>`;
    }
    if(o.status==='assigned'){
      actions+=`<button class="ab ab-deliver" onclick="markPicked('${o.id}',event)">استلام الطلب</button>`;
      actions+=`<button class="ab ab-urgent" onclick="markUrgent('${o.id}',event)">عاجل</button>`;
      actions+=`<button class="ab ab-cancel" onclick="openCancel('${o.id}',event)">إلغاء</button>`;
    }
    if(o.status==='picked'){
      actions+=`<button class="ab ab-deliver" onclick="openDeliver('${o.id}',event)">وصّل</button>`;
      actions+=`<button class="ab ab-urgent" onclick="markUrgent('${o.id}',event)">عاجل</button>`;
      actions+=`<button class="ab ab-postpone" onclick="openPostpone('${o.id}',event)">تأجيل</button>`;
      actions+=`<button class="ab ab-cancel" onclick="openCancel('${o.id}',event)">إلغاء</button>`;
    }
    actions+=`<button class="ab ab-edit" onclick="openEdit('${o.id}',event)">تعديل</button>`;
    actions+=`<button class="ab ab-log" onclick="openLog('${o.id}',event)">سجل</button>`;

    return `<div class="order-card ${late?'late':''} ${o.status==='postponed'?'sp':''} ${['assigned','picked'].includes(o.status)?'sk':''} ${sel?'sel':''} ${(o.notes||'').includes('🚨')?'urgent':''}" id="oc-${o.id}" onclick="toggleSel('${o.id}',event)">
      <div class="oc-check">${sel?'✓':''}</div>
      <div class="oc-timers">${buildTimers(o)}</div>
      <div class="oc-customer">${cn}</div>
      <div class="oc-address">📍 ${o.customer_address||o.cust_address||'—'}</div>
      ${o.cust_region?`<span class="oc-region">${o.cust_region}</span>`:''}
      <div class="oc-bottom">
        <span class="oc-amount">${Number(o.total_bill_net||0).toLocaleString()} ج</span>
        <span class="oc-pay ${pmC}">${pmL}</span>
        <span class="oc-st ${stC}">${SL[o.status]||o.status}</span>
      </div>
      ${o.deliveryman?`<div style="font-size:.62rem;color:var(--text-muted);margin-bottom:.28rem">🚗 ${o.deliveryman}</div>`:''}
      ${o.staff_notes?`<div style="font-size:.62rem;background:var(--blue-light);color:#0e7490;padding:.12rem .4rem;border-radius:5px;margin-bottom:.28rem">💼 ${o.staff_notes}</div>`:''}
      <div class="oc-actions" onclick="event.stopPropagation()">${actions}</div>
    </div>`;
  }).join('');
}

async function confirmAssign(){
  const driverId=document.getElementById('assignDrv').value;
  if(!driverId){showToast('اختر الطيار');return;}
  const driver=allDrivers.find(d=>d.id===driverId);
  const orderIds=[...selectedOrders];
  showLoading(true);
  try{
    const now=new Date().toISOString();
    // لو إعادة تعيين → شيل من الرحلة القديمة
    if(window._reassignTripId){
      for(const id of orderIds){
        await db.from('trip_orders').delete().eq('trip_id',window._reassignTripId).eq('order_id',id);
      }
      const {data:to}=await db.from('trip_orders').select('id').eq('trip_id',window._reassignTripId);
      await db.from('trips').update({orders_count:(to||[]).length,updated_at:now}).eq('id',window._reassignTripId);
      window._reassignTripId=null;
    }
    await db.from('orders').update({
      driver_id:driverId,
      deliveryman:driver?.full_name,
      status:'assigned',
      assigned_at:now,
      updated_at:now
    }).in('id',orderIds);
    const tOrds=orderIds.map(id=>allOrders.find(o=>o.id===id)).filter(Boolean);
    const newTotal=tOrds.reduce((s,o)=>s+Number(o.total_bill_net||0),0);

    // شوف لو الطيار عنده رحلة active
    const {data:existingTrips}=await db.from('trips').select('*').eq('driver_id',driverId).eq('status','active');
    const existingTrip=existingTrips&&existingTrips.length>0?existingTrips[0]:null;

    let tripId=null;
    if(existingTrip){
      // أضف على الرحلة الموجودة
      tripId=existingTrip.id;
      const {data:curTO}=await db.from('trip_orders').select('id').eq('trip_id',tripId);
      const curCount=(curTO||[]).length;
      await db.from('trips').update({
        orders_count:curCount+orderIds.length,
        total_amount:Number(existingTrip.total_amount||0)+newTotal,
        updated_at:now
      }).eq('id',tripId);
      await db.from('trip_orders').insert(orderIds.map(id=>({trip_id:tripId,order_id:id})));
      await addTripLog(tripId,'order_added',{driver:driver?.full_name,orders:orderIds.length});
    }else{
      // أنشئ رحلة جديدة
      const {data:trip}=await db.from('trips').insert({

        driver_name:driver?.full_name,
        status:'active',
        orders_count:orderIds.length,
        total_amount:newTotal,
        created_at:now
      }).select().single();
      if(trip){

}

  }).eq('id', orderId);

// Horizontal Timeline Builder
function buildHorizTimeline(stages){
  if(!stages.length) return '';
  const fdt=dt=>{if(!dt)return '—';return new Date(dt).toLocaleString('ar-EG',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});};
  return `<div style="margin-bottom:1.25rem">
    <div style="font-size:.68rem;font-weight:700;color:var(--text-muted);margin-bottom:.75rem;letter-spacing:.05em">📍 خريطة الطلب</div>
    <div style="overflow-x:auto;padding-bottom:.5rem">
      <div style="display:flex;align-items:flex-start;min-width:max-content;gap:0">
        ${stages.map((s,i)=>`
          <div style="display:flex;align-items:flex-start;gap:0">
            <!-- النقطة -->
            <div style="display:flex;flex-direction:column;align-items:center;gap:.3rem">
              <div style="width:32px;height:32px;border-radius:50%;background:${s.color};border:3px solid white;box-shadow:0 0 0 2px ${s.color};display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0">${s.icon}</div>
              <div style="text-align:center;width:80px">
                <div style="font-size:.65rem;font-weight:700;color:var(--text)">${s.label}</div>
                <div style="font-size:.58rem;color:var(--text-muted)">${fdt(s.time)}</div>
              </div>
            </div>
            <!-- الخط والوقت بين النقطتين -->
            ${i<stages.length-1?`
            <div style="display:flex;flex-direction:column;align-items:center;margin-top:14px;width:70px;flex-shrink:0">
              <div style="width:100%;height:2px;background:linear-gradient(to left,${stages[i+1].color},${s.color});position:relative">
                <div style="position:absolute;top:-2px;right:-4px;width:8px;height:8px;border-radius:50%;background:${stages[i+1].color}"></div>
              </div>
              ${s.diff?`<div style="font-size:.55rem;font-weight:700;color:#64748b;margin-top:.2rem;background:#f1f5f9;padding:.1rem .3rem;border-radius:4px;white-space:nowrap">${s.diff}</div>`:'<div style="height:.8rem"></div>'}
            </div>`:''
            }
          </div>`).join('')}
      </div>
    </div>
  </div>`;
}

    <div class="d-row"><span class="d-lbl">الحالة</span><span class="d-val">${SL[o.status]||o.status}</span></div>
    <div class="d-row"><span class="d-lbl">الطيار</span><span class="d-val">${o.deliveryman||'—'}</span></div>
    ${o.staff_notes?`<div class="d-row"><span class="d-lbl">ملاحظة الموظف</span><span class="d-val">${o.staff_notes}</span></div>`:''}
    ${o.driver_notes?`<div class="d-row"><span class="d-lbl">ملاحظة الطيار</span><span class="d-val">${o.driver_notes}</span></div>`:''}`;

  // Actions based on status
  let footerBtns=`<button class="btn btn-outline" onclick="closeModal('detailModal')">إغلاق</button>`;
  footerBtns+=`<button class="btn btn-outline" onclick="closeModal('detailModal');openLog('${orderId}',null)">📋 سجل</button>`;

  if(o.status==='assigned'){
    footerBtns+=`<button class="btn btn-primary" onclick="closeModal('detailModal');openReassign('${orderId}','${tripId}')">🔄 إعادة تعيين</button>`;
    footerBtns+=`<button class="btn btn-outline" onclick="closeModal('detailModal');removeFromTrip('${orderId}','${tripId}',{stopPropagation:()=>{}})">↩ إزالة من الرحلة</button>`;
    footerBtns+=`<button class="btn btn-red" onclick="closeModal('detailModal');openCancel('${orderId}',null)">إلغاء</button>`;
  }
  if(o.status==='picked'){
    footerBtns+=`<button class="btn btn-yellow" onclick="closeModal('detailModal');openDeliver('${orderId}',null)">✅ وصّل</button>`;
    footerBtns+=`<button class="btn btn-primary" onclick="closeModal('detailModal');openReassign('${orderId}','${tripId}')">🔄 إعادة تعيين</button>`;
    footerBtns+=`<button class="btn btn-outline" onclick="closeModal('detailModal');openPostpone('${orderId}',null)">⏰ تأجيل</button>`;
    footerBtns+=`<button class="btn btn-red" onclick="closeModal('detailModal');openCancelByCustomer('${orderId}')">العميل ألغى</button>`;
  }

  document.getElementById('detailFooter').innerHTML=footerBtns;
  document.getElementById('detailModal').classList.add('open');
}

// Reassign to another driver
function openReassign(orderId, tripId){
  selectedOrders.clear();
  selectedOrders.add(orderId);
  updSel();
  // Remove from current trip first, then assign
  document.getElementById('assignDrv').innerHTML=allDrivers.map(d=>`<option value="${d.id}">${d.full_name}</option>`).join('');
  const o=allOrders.find(x=>x.id===orderId);
  document.getElementById('assignList').innerHTML=`<div class="sel-item">
    <span style="font-weight:700;color:var(--primary)">${o?.bill_no||orderId.slice(0,8)}</span>
    <span style="color:var(--text-muted);flex:1;margin:0 .4rem">${o?.customer_name||o?.cust_name||'—'}</span>
    <span style="font-size:.65rem;color:var(--orange)">إعادة تعيين من ${o?.deliveryman||'—'}</span>
  </div>`;
  // Store current trip for removal
  window._reassignTripId = tripId;
  document.getElementById('assignModal').classList.add('open');
}

// Cancel by customer
async function openCancelByCustomer(orderId){
  showLoading(true);
  const now=new Date().toISOString();
  // Find trip
  const tripEntry=Object.entries(tripOrdersMap).find(([,ids])=>ids.includes(orderId));
  if(tripEntry){
    const tripId=tripEntry[0];
    await db.from('trip_orders').delete().eq('trip_id',tripId).eq('order_id',orderId);
    const {data:to}=await db.from('trip_orders').select('id').eq('trip_id',tripId);
    await db.from('trips').update({orders_count:(to||[]).length,updated_at:now}).eq('id',tripId);
  }
  await db.from('orders').update({
    status:'cancelled',cancelled_reason:'العميل ألغى الطلب',
    driver_id:null,deliveryman:null,updated_at:now
  }).eq('id',orderId);
  await addOrderLog(orderId,'order_cancelled',{reason:'العميل ألغى الطلب'});
  showToast('تم الإلغاء');await loadAll();showLoading(false);
}

// Trip complete
async function completeTrip(tripId){
  if(!confirm('إنهاء الرحلة؟'))return;
  showLoading(true);
  const oIds=tripOrdersMap[tripId]||[];
  const nowC=new Date().toISOString();
  await db.from('trips').update({status:'completed',updated_at:nowC}).eq('id',tripId);
  if(oIds.length)await db.from('orders').update({status:'completed',completed_at:nowC,updated_at:nowC}).in('id',oIds);
  await addTripLog(tripId,'trip_completed',{orders:oIds.length});
  for(const id of oIds)await addOrderLog(id,'order_completed',{trip_id:tripId});
  showToast('✓ تم إنهاء الرحلة');await loadAll();showLoading(false);
}

// Utils
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
function showLoading(show){document.getElementById('loadingOverlay').classList.toggle('show',show);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

loadAll();

// ===== AUTO DISPATCH ENGINE =====
let dispatchEngine = null;
async function initDispatchEngine() {
  if (!currentUser?.branch_id) return;
  dispatchEngine = new DispatchEngine(db, currentUser.branch_id);
  dispatchEngine.onLog = (msg) => {
    if (msg.includes('✅') || msg.includes('❌') || msg.includes('⚠️')) showToast(msg);
    console.log('[AutoDispatch]', msg);
  };
  await dispatchEngine.start();
}
setTimeout(initDispatchEngine, 2000);
</script>
