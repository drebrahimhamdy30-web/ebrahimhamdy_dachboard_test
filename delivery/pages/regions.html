<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المناطق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body { padding: 1.25rem; overflow-y: auto; height: 100vh; background: var(--bg); }

.regions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }

.region-card {
  background: white;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow .15s, border-color .15s;
}
.region-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
.region-card.inactive { opacity: .6; }

.region-card-header {
  padding: .875rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.region-name { font-weight: 700; font-size: .9rem; color: var(--text); }
.region-status { width: 8px; height: 8px; border-radius: 50%; }
.status-active { background: var(--green); }
.status-inactive { background: #9ca3af; }

.region-card-body { padding: .875rem 1rem; display: flex; flex-direction: column; gap: .5rem; }

.region-types { display: flex; gap: .3rem; flex-wrap: wrap; }
.type-tag {
  font-size: .62rem;
  font-weight: 600;
  padding: .15rem .5rem;
  border-radius: 20px;
}
.type-inside  { background: var(--green-light); color: #15803d; }
.type-outside { background: var(--yellow-light); color: #a16207; }
.type-permit  { background: var(--purple-light); color: #6d28d9; }
.type-hard    { background: var(--red-light); color: #b91c1c; }

.region-info-row { display: flex; align-items: center; justify-content: space-between; font-size: .75rem; }
.region-info-label { color: var(--text-muted); }
.region-info-value { font-weight: 600; color: var(--text); }

.schedule-badge {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  font-size: .68rem;
  font-weight: 600;
  padding: .2rem .6rem;
  border-radius: 8px;
  background: var(--blue-light);
  color: #0e7490;
}

.region-card-footer {
  padding: .625rem 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: .4rem;
  justify-content: flex-end;
}

/* Checkbox group */
.checkbox-group { display: flex; flex-direction: column; gap: .4rem; }
.checkbox-item { display: flex; align-items: center; gap: .5rem; font-size: .82rem; cursor: pointer; }
.checkbox-item input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }

/* Time row */
.time-row { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }

/* Search & filter bar */
.filter-chip {
  padding: .3rem .75rem;
  border-radius: 20px;
  font-size: .72rem;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: white;
  color: var(--text-muted);
  transition: all .15s;
  font-family: 'Cairo', sans-serif;
}
.filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

.empty-card { grid-column: 1/-1; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="flex-between" style="margin-bottom:1rem;flex-wrap:wrap;gap:.625rem">
  <div>
    <div style="font-size:.9rem;font-weight:700">إدارة المناطق</div>
    <div style="font-size:.75rem;color:var(--text-muted)" id="regionsCount">جاري التحميل...</div>
  </div>
  <button class="btn btn-primary" onclick="openModal()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    إضافة منطقة
  </button>
</div>

<!-- Filters -->
<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center">
  <input type="text" class="search-input" id="searchInput" placeholder="🔍 بحث عن منطقة..." oninput="renderRegions()" style="width:200px">
  <button class="filter-chip active" onclick="setFilter('all',this)">الكل</button>
  <button class="filter-chip" onclick="setFilter('inside',this)">داخل الزون</button>
  <button class="filter-chip" onclick="setFilter('outside',this)">خارج الزون</button>
  <button class="filter-chip" onclick="setFilter('permit',this)">يحتاج ترخيص</button>
  <button class="filter-chip" onclick="setFilter('hard',this)">صعب الوصول</button>
  <button class="filter-chip" onclick="setFilter('scheduled',this)">مجدول</button>
  <button class="filter-chip" onclick="setFilter('inactive',this)">غير نشط</button>
</div>

<!-- Stats -->
<div class="stats-grid" style="margin-bottom:1.25rem" id="statsRow"></div>

<!-- Grid -->
<div class="regions-grid" id="regionsGrid">
  <div class="empty-card empty-state"><div class="icon">⏳</div><p>جاري التحميل...</p></div>
</div>

<!-- Modal: Add/Edit Region -->
<div class="modal-overlay" id="regionModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">إضافة منطقة جديدة</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="r-id">

      <div class="form-group">
        <label>اسم المنطقة *</label>
        <input type="text" class="form-control" id="r-name" placeholder="مثال: سيدي بشر، الجلاء...">
      </div>

      <div class="form-group">
        <label>نوع المنطقة (يمكن اختيار أكثر من نوع)</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" id="t-inside" value="inside">
            <span>🟢 داخل الزون</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="t-outside" value="outside">
            <span>🟡 خارج الزون</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="t-permit" value="permit">
            <span>🟣 تحتاج ترخيص</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="t-hard" value="hard">
            <span>🔴 صعب الوصول</span>
          </label>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label>وقت الوصول المتوقع (دقيقة)</label>
          <input type="number" class="form-control" id="r-minutes" placeholder="30" min="5" max="240">
        </div>
        <div class="form-group">
          <label>الحد الأدنى للطلب (ج.م)</label>
          <input type="number" class="form-control" id="r-minorder" placeholder="0" min="0">
        </div>
      </div>

      <div class="form-group">
        <label>خدمة التوصيل (ج.م)</label>
        <input type="number" class="form-control" id="r-fee" placeholder="0" min="0">
      </div>

      <div class="form-group">
        <label class="checkbox-item" style="margin-bottom:.5rem">
          <input type="checkbox" id="r-scheduled" onchange="toggleSchedule()">
          <span style="font-weight:600">توصيل مجدول (في أوقات محددة فقط)</span>
        </label>
        <div id="scheduleFields" style="display:none;margin-top:.5rem">
          <div class="time-row">
            <div class="form-group" style="margin-bottom:0">
              <label>من</label>
              <input type="time" class="form-control" id="r-from">
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label>إلى</label>
              <input type="time" class="form-control" id="r-to">
            </div>
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0">
        <label class="checkbox-item">
          <input type="checkbox" id="r-active" checked>
          <span style="font-weight:600">منطقة نشطة</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveRegion()">حفظ</button>
    </div>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title">حذف المنطقة</span>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:.875rem">هل تريد حذف منطقة <strong id="deleteRegionName"></strong>؟</p>
      <p style="font-size:.75rem;color:var(--red);margin-top:.5rem">سيتم حذفها من كل خطوط السير المرتبطة بها.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDeleteModal()">إلغاء</button>
      <button class="btn btn-red" onclick="confirmDelete()">حذف</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../permissions.js"></script>
<script>
const TYPE_LABELS = { inside:'داخل الزون', outside:'خارج الزون', permit:'يحتاج ترخيص', hard:'صعب الوصول' };
const TYPE_CLASS  = { inside:'type-inside', outside:'type-outside', permit:'type-permit', hard:'type-hard' };

let allRegions = [];
let currentFilter = 'all';
let deleteTargetId = null;

async function init() {
  const user = getCurrentUser(); if (!user) return;
  showLoading(true);
  const { data } = await db.from('regions').select('*').order('name');
  allRegions = data || [];
  renderStats();
  renderRegions();
  showLoading(false);
}

function renderStats() {
  const total = allRegions.length;
  const active = allRegions.filter(r => r.is_active).length;
  const scheduled = allRegions.filter(r => r.is_scheduled).length;
  const hard = allRegions.filter(r => (r.types||[]).includes('hard')).length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--blue-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg></div>
      <div class="stat-label">إجمالي المناطق</div>
      <div class="stat-value">${total}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--green-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="stat-label">نشطة</div>
      <div class="stat-value">${active}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--blue-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <div class="stat-label">مجدولة</div>
      <div class="stat-value">${scheduled}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--red-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div>
      <div class="stat-label">صعب الوصول</div>
      <div class="stat-value">${hard}</div>
    </div>`;
  document.getElementById('regionsCount').textContent = `${total} منطقة`;
}

function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderRegions();
}

function renderRegions() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let regions = allRegions.filter(r => {
    if (search && !(r.name||'').toLowerCase().includes(search)) return false;
    if (currentFilter === 'all') return true;
    if (currentFilter === 'inactive') return !r.is_active;
    if (currentFilter === 'scheduled') return r.is_scheduled;
    return (r.types||[]).includes(currentFilter);
  });

  const grid = document.getElementById('regionsGrid');
  if (!regions.length) {
    grid.innerHTML = '<div class="empty-card empty-state"><div class="icon">📍</div><p>لا توجد مناطق</p></div>';
    return;
  }

  grid.innerHTML = regions.map(r => {
    const types = r.types || [];
    const typeTags = types.map(t => `<span class="type-tag ${TYPE_CLASS[t]||''}">${TYPE_LABELS[t]||t}</span>`).join('');
    const scheduleInfo = r.is_scheduled && r.schedule_from && r.schedule_to
      ? `<span class="schedule-badge">🕐 ${r.schedule_from.slice(0,5)} — ${r.schedule_to.slice(0,5)}</span>` : '';

    return `
      <div class="region-card ${r.is_active?'':'inactive'}">
        <div class="region-card-header">
          <span class="region-name">${r.name}</span>
          <div class="region-status ${r.is_active?'status-active':'status-inactive'}"></div>
        </div>
        <div class="region-card-body">
          ${types.length ? `<div class="region-types">${typeTags}</div>` : '<span style="font-size:.72rem;color:var(--text-muted)">لا يوجد تصنيف</span>'}
          <div class="region-info-row">
            <span class="region-info-label">⏱ وقت الوصول</span>
            <span class="region-info-value">${r.expected_minutes || '—'} دقيقة</span>
          </div>
          <div class="region-info-row">
            <span class="region-info-label">🚚 خدمة التوصيل</span>
            <span class="region-info-value">${r.delivery_fee ? r.delivery_fee.toLocaleString('ar-EG') + ' ج' : 'مجاني'}</span>
          </div>
          <div class="region-info-row">
            <span class="region-info-label">📦 الحد الأدنى</span>
            <span class="region-info-value">${r.min_order_amount ? r.min_order_amount.toLocaleString('ar-EG') + ' ج' : '—'}</span>
          </div>
          ${scheduleInfo ? `<div>${scheduleInfo}</div>` : ''}
        </div>
        <div class="region-card-footer">
          <button class="btn btn-outline btn-sm" onclick="toggleActive('${r.id}',${r.is_active})">${r.is_active?'تعطيل':'تفعيل'}</button>
          <button class="btn btn-outline btn-sm" onclick="openEdit('${r.id}')">تعديل</button>
          <button class="btn btn-sm" style="background:var(--red-light);color:#b91c1c" onclick="openDelete('${r.id}','${r.name}')">حذف</button>
        </div>
      </div>`;
  }).join('');
}

function openModal(id) {
  document.getElementById('modalTitle').textContent = 'إضافة منطقة جديدة';
  document.getElementById('r-id').value = '';
  document.getElementById('r-name').value = '';
  document.getElementById('r-minutes').value = 30;
  document.getElementById('r-fee').value = 0;
  document.getElementById('r-minorder').value = 0;
  document.getElementById('r-scheduled').checked = false;
  document.getElementById('r-active').checked = true;
  document.getElementById('r-from').value = '';
  document.getElementById('r-to').value = '';
  document.getElementById('scheduleFields').style.display = 'none';
  ['t-inside','t-outside','t-permit','t-hard'].forEach(id => document.getElementById(id).checked = false);
  document.getElementById('regionModal').classList.add('open');
}

function openEdit(id) {
  const r = allRegions.find(x => x.id === id); if (!r) return;
  document.getElementById('modalTitle').textContent = 'تعديل المنطقة';
  document.getElementById('r-id').value = r.id;
  document.getElementById('r-name').value = r.name || '';
  document.getElementById('r-minutes').value = r.expected_minutes || 30;
  document.getElementById('r-fee').value = r.delivery_fee || 0;
  document.getElementById('r-minorder').value = r.min_order_amount || 0;
  document.getElementById('r-scheduled').checked = r.is_scheduled || false;
  document.getElementById('r-active').checked = r.is_active !== false;
  document.getElementById('r-from').value = r.schedule_from?.slice(0,5) || '';
  document.getElementById('r-to').value = r.schedule_to?.slice(0,5) || '';
  document.getElementById('scheduleFields').style.display = r.is_scheduled ? 'block' : 'none';
  const types = r.types || [];
  document.getElementById('t-inside').checked = types.includes('inside');
  document.getElementById('t-outside').checked = types.includes('outside');
  document.getElementById('t-permit').checked = types.includes('permit');
  document.getElementById('t-hard').checked = types.includes('hard');
  document.getElementById('regionModal').classList.add('open');
}

function toggleSchedule() {
  document.getElementById('scheduleFields').style.display =
    document.getElementById('r-scheduled').checked ? 'block' : 'none';
}

async function saveRegion() {
  const name = document.getElementById('r-name').value.trim();
  if (!name) { alert('اسم المنطقة مطلوب'); return; }

  const types = ['inside','outside','permit','hard']
    .filter(t => document.getElementById(`t-${t}`).checked);

  const payload = {
    name,
    types,
    expected_minutes: parseInt(document.getElementById('r-minutes').value) || 30,
    delivery_fee: parseFloat(document.getElementById('r-fee').value) || 0,
    min_order_amount: parseFloat(document.getElementById('r-minorder').value) || 0,
    is_scheduled: document.getElementById('r-scheduled').checked,
    schedule_from: document.getElementById('r-scheduled').checked ? document.getElementById('r-from').value || null : null,
    schedule_to: document.getElementById('r-scheduled').checked ? document.getElementById('r-to').value || null : null,
    is_active: document.getElementById('r-active').checked,
  };

  showLoading(true);
  const id = document.getElementById('r-id').value;
  if (id) {
    await db.from('regions').update(payload).eq('id', id);
  } else {
    await db.from('regions').insert(payload);
  }
  closeModal();
  await init();
}

async function toggleActive(id, current) {
  showLoading(true);
  await db.from('regions').update({ is_active: !current }).eq('id', id);
  await init();
}

function openDelete(id, name) {
  deleteTargetId = id;
  document.getElementById('deleteRegionName').textContent = name;
  document.getElementById('deleteModal').classList.add('open');
}

async function confirmDelete() {
  showLoading(true);
  await db.from('route_regions').delete().eq('region_id', deleteTargetId);
  await db.from('regions').delete().eq('id', deleteTargetId);
  closeDeleteModal();
  await init();
}

function closeModal() { document.getElementById('regionModal').classList.remove('open'); }
function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }

init();
</script>
</body>
</html>
