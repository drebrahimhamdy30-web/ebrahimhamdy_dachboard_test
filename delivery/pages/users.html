<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المستخدمون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body { padding: 1.25rem; overflow-y: auto; height: 100vh; background: var(--bg); }
.users-table-wrap { overflow-x: auto; }
.users-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.users-table th { padding: .6rem 1rem; text-align: right; font-weight: 600; color: var(--text-muted); background: var(--gray-light); border-bottom: 1px solid var(--border); font-size: .7rem; white-space: nowrap; }
.users-table td { padding: .65rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.users-table tr:last-child td { border-bottom: none; }
.users-table tr:hover td { background: #fafafa; }
.user-name-cell { display: flex; align-items: center; gap: .625rem; }
.user-mini-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .7rem; color: white; flex-shrink: 0; }
.action-cell { display: flex; gap: .4rem; align-items: center; }
.role-badge { display:inline-block; padding:.15rem .55rem; border-radius:20px; font-size:.68rem; font-weight:700; color:white; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .55rem; }
.stat-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: .6rem .75rem; text-align: center; }
.stat-label { font-size: .72rem; color: var(--text-muted); font-weight: 600; margin-bottom: .15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value { font-size: 1.3rem; font-weight: 800; color: var(--text); line-height: 1.1; }
</style>
</head>
<body>

<div class="stats-grid" id="userStats" style="margin-bottom:1.25rem"></div>

<div class="filters-bar" style="margin-bottom:1rem">
  <input type="text" class="search-input" id="userSearch" placeholder="🔍 بحث..." oninput="renderUsers()">
  <select class="filter-input" id="roleFilter" onchange="renderUsers()">
    <option value="">كل الأدوار</option>
    <option value="admin">Admin</option>
    <option value="manager">مدير فرع</option>
    <option value="employee">موظف فرع</option>
    <option value="inventory">مسؤول جرد</option>
    <option value="accountant">محاسب</option>
    <option value="reviewer">مراجع</option>
    <option value="supervisor">مشرف توصيل</option>
    <option value="cashier">كاشير توصيل</option>
    <option value="pharmacist">مشتريات</option>
    <option value="driver">طيار</option>
  </select>
  <select class="filter-input" id="activeFilter" onchange="renderUsers()">
    <option value="">الكل</option>
    <option value="1">نشط</option>
    <option value="0">معطل</option>
  </select>
  <button class="btn btn-primary btn-sm" onclick="openUserModal()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    إضافة مستخدم
  </button>
</div>

<div class="card">
  <div class="users-table-wrap">
    <table class="users-table">
      <thead>
        <tr>
          <th>المستخدم</th><th>اسم المستخدم</th><th>الدور</th>
          <th>الحالة</th><th>الفرع</th><th>الإجراءات</th>
        </tr>
      </thead>
      <tbody id="usersBody">
        <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted)">جاري التحميل...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="userModalTitle">إضافة مستخدم</span>
      <button class="modal-close" onclick="closeModal('userModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="u-id">
      <div class="form-grid-2">
        <div class="form-group"><label>الاسم الكامل *</label><input type="text" class="form-control" id="u-name"></div>
        <div class="form-group"><label>اسم المستخدم *</label><input type="text" class="form-control" id="u-username" dir="ltr"></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label>كلمة المرور <span id="pwd-hint" style="font-weight:400;color:var(--text-muted)">*</span></label><input type="text" class="form-control" id="u-password" dir="ltr" placeholder="اتركها فاضية لو مش عايز تغيّرها"></div>
        <div class="form-group"><label>رقم الهاتف</label><input type="text" class="form-control" id="u-phone"></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label>الإيميل <span style="font-weight:400;color:var(--text-muted)">(لاستعادة كلمة السر)</span></label><input type="email" class="form-control" id="u-email" dir="ltr" placeholder="example@gmail.com"></div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>الدور *</label>
          <select class="form-control" id="u-role" onchange="toggleBranchField()">
            <option value="admin">Admin</option>
            <option value="manager">مدير فرع</option>
            <option value="employee">موظف فرع</option>
            <option value="inventory">مسؤول جرد</option>
            <option value="accountant">محاسب</option>
            <option value="reviewer">مراجع</option>
            <option value="supervisor">مشرف توصيل</option>
            <option value="cashier">كاشير توصيل</option>
            <option value="pharmacist">مشتريات</option>
            <option value="driver">طيار</option>
          </select>
        </div>
        <div class="form-group">
          <label>الحالة</label>
          <select class="form-control" id="u-active"><option value="1">نشط</option><option value="0">معطل</option></select>
        </div>
      </div>
      <div class="form-group" id="branchFieldWrap">
        <label>الفرع *</label>
        <select data-branches class="form-control" id="u-branch">
          <option value="">— اختر الفرع —</option>
          <option value="عام" data-after>عام (كل النظام)</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('userModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveUser()">حفظ</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">تأكيد الحذف</span><button class="modal-close" onclick="closeModal('deleteModal')">✕</button></div>
    <div class="modal-body">
      <p style="font-size:.875rem;color:var(--text)">هل أنت متأكد من حذف المستخدم <strong id="deleteUserName"></strong>؟</p>
      <p style="font-size:.78rem;color:var(--red);margin-top:.5rem">هذا الإجراء لا يمكن التراجع عنه.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('deleteModal')">إلغاء</button>
      <button class="btn btn-red" onclick="confirmDelete()">حذف</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js?v=20260903"></script>
<script src="../../session.js?v=20260903"></script>
<script src="../../branches.js?v=20260904"></script>
<script src="../../brand.js?v=20260904"></script>
<script src="../supabase-config.js?v=20260901"></script>
<script src="../permissions.js"></script>
<script>
const ROLE_LABELS = {
  admin:'Admin', manager:'مدير فرع', employee:'موظف فرع', inventory:'مسؤول جرد',
  accountant:'محاسب', reviewer:'مراجع', supervisor:'مشرف توصيل', cashier:'كاشير توصيل',
  pharmacist:'مشتريات', driver:'طيار'
};
const ROLE_COLORS = {
  admin:'#7c3aed', manager:'#1a56db', employee:'#0891b2', inventory:'#ca8a04',
  accountant:'#dc2626', reviewer:'#db2777', supervisor:'#16a34a', cashier:'#ea580c',
  pharmacist:'#0d9488', driver:'#334155'
};
let allUsers = [];
let deleteTargetId = null;
let IS_MANAGER = false;   // مدير فرع: صلاحيات محدودة (فرعه فقط، بدون أدمن/مدير)
let MY_BRANCH  = '';

async function init() {
  const user = getCurrentUser();
  if (!user) return;
  if (user.role !== 'admin' && user.role !== 'manager') {
    document.body.innerHTML = '<div class="empty-state" style="padding:4rem"><div class="icon">🔒</div><p>ليس لديك صلاحية لعرض هذه الصفحة</p></div>';
    return;
  }
  IS_MANAGER = (user.role === 'manager');
  MY_BRANCH  = (Session.branch()).trim();
  if (IS_MANAGER) applyManagerRestrictions();
  showLoading(true);
  const { data, error } = await db.rpc('get_all_branch_users');
  if (error) { console.error(error); showLoading(false); return; }
  allUsers = data || [];
  renderStats();
  renderUsers();
  showLoading(false);
}

// قيود مدير الفرع في الواجهة (الحماية الحقيقية سيرفرية كمان في الـRPC):
// يشيل خياري أدمن/مدير من قائمة الأدوار، ويقفل الفرع على فرعه.
function applyManagerRestrictions() {
  const roleSel = document.getElementById('u-role');
  ['admin','manager'].forEach(r => {
    const opt = roleSel.querySelector('option[value="'+r+'"]');
    if (opt) opt.remove();
  });
  const brSel = document.getElementById('u-branch');
  Array.from(brSel.options).forEach(o => { if (o.value && o.value !== MY_BRANCH) o.remove(); });
  brSel.value = MY_BRANCH;
  brSel.disabled = true;
}

function toggleBranchField() {
  const role = document.getElementById('u-role').value;
  document.getElementById('branchFieldWrap').style.display = role === 'admin' ? 'none' : 'block';
}

function renderStats() {
  const byRole = {};
  // نطبّع الدور (lowercase) عشان admin/Admin ما يتكرروش
  allUsers.forEach(u => { const k = String(u.role||'').trim().toLowerCase(); byRole[k] = (byRole[k]||0)+1; });
  const active = allUsers.filter(u => u.is_active).length;
  document.getElementById('userStats').innerHTML = `
    <div class="stat-card"><div class="stat-label">إجمالي المستخدمين</div><div class="stat-value">${allUsers.length}</div></div>
    <div class="stat-card"><div class="stat-label">نشطون</div><div class="stat-value">${active}</div></div>
    ${Object.entries(byRole).sort((a,b)=>b[1]-a[1]).map(([role,count]) => `
      <div class="stat-card"><div class="stat-label">${ROLE_LABELS[role]||role}</div><div class="stat-value">${count}</div></div>`).join('')}`;
}

function renderUsers() {
  const search = document.getElementById('userSearch').value.toLowerCase();
  const roleF = document.getElementById('roleFilter').value;
  const activeF = document.getElementById('activeFilter').value;

  const users = allUsers.filter(u => {
    if (search && !(u.full_name||'').toLowerCase().includes(search) && !(u.username||'').toLowerCase().includes(search)) return false;
    if (roleF && u.role !== roleF) return false;
    if (activeF === '1' && !u.is_active) return false;
    if (activeF === '0' && u.is_active) return false;
    return true;
  });

  const tbody = document.getElementById('usersBody');
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted)">لا يوجد مستخدمون</td></tr>'; return; }

  // تجميع حسب الفرع بترتيب ثابت، وداخل كل فرع بالدور ثم الاسم
  const branchName = u => (u.role === 'admin' ? 'كل الفروع' : (u.branch || '—'));
  // ترتيب العرض: الفروع من جدول branches، وبعدين المجالات العامة
  const BR_ORDER = Branches.names().concat(['عام','كل الفروع']);
  const bi = b => { const i = BR_ORDER.indexOf(b); return i < 0 ? 90 : i; };
  users.sort((a,b) =>
    (bi(branchName(a)) - bi(branchName(b))) ||
    String(a.role).localeCompare(String(b.role)) ||
    String(a.full_name||'').localeCompare(String(b.full_name||''),'ar'));

  let html = '', lastBranch = null;
  users.forEach(u => {
    const br = branchName(u);
    if (br !== lastBranch) {
      const cnt = users.filter(x => branchName(x) === br).length;
      html += `<tr><td colspan="6" style="background:#f1f5f9;color:#334155;font-weight:700;font-size:.8rem;padding:.45rem .75rem;border-top:1px solid #e2e8f0;">
        <i class="fas fa-store" style="font-size:.72rem;color:#64748b;"></i> ${br}
        <span style="color:#94a3b8;font-weight:400;font-size:.72rem;">· ${cnt}</span></td></tr>`;
      lastBranch = br;
    }
    const color = ROLE_COLORS[u.role] || '#6b7280';
    const initials = (u.full_name||u.username||'?').split(' ').slice(0,2).map(w=>w[0]).join('');
    html += `<tr>
      <td><div class="user-name-cell"><div class="user-mini-avatar" style="background:${color}">${initials}</div><span style="font-weight:600">${u.full_name||'—'}</span></div></td>
      <td style="font-family:monospace;font-size:.75rem;color:var(--text-muted)">${u.username||'—'}</td>
      <td><span class="role-badge" style="background:${color}">${ROLE_LABELS[u.role]||u.role}</span></td>
      <td><span class="badge ${u.is_active?'badge-active':'badge-inactive'}">${u.is_active?'نشط':'معطل'}</span></td>
      <td style="font-size:.72rem;color:var(--text-muted)">${branchName(u)}</td>
      <td>
        <div class="action-cell">
          <button class="btn btn-outline btn-sm" onclick="openEditModal(${u.id})">تعديل</button>
          <button class="btn btn-sm ${u.is_active?'btn-outline':'btn-green'}" onclick="toggleActive(${u.id},${u.is_active})">${u.is_active?'تعطيل':'تفعيل'}</button>
          ${IS_MANAGER ? '' : `<button class="btn btn-sm" style="background:var(--red-light);color:#b91c1c" onclick="openDelete(${u.id},'${(u.full_name||'').replace(/'/g,"")}')">حذف</button>`}
        </div>
      </td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

function openUserModal() {
  document.getElementById('userModalTitle').textContent = 'إضافة مستخدم';
  ['u-id','u-name','u-username','u-password','u-phone','u-email'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('u-role').value = 'employee';
  document.getElementById('u-active').value = '1';
  document.getElementById('u-branch').value = IS_MANAGER ? MY_BRANCH : '';
  document.getElementById('pwd-hint').textContent = '*';
  toggleBranchField();
  document.getElementById('userModal').classList.add('open');
}

function openEditModal(id) {
  const u = allUsers.find(x => x.id === id); if (!u) return;
  document.getElementById('userModalTitle').textContent = 'تعديل مستخدم';
  document.getElementById('u-id').value = u.id;
  document.getElementById('u-name').value = u.full_name||'';
  document.getElementById('u-username').value = u.username||'';
  document.getElementById('u-password').value = '';
  document.getElementById('pwd-hint').textContent = '(اتركها فاضية لو مش عايز تغيّرها)';
  document.getElementById('u-phone').value = u.mobile||'';
  document.getElementById('u-email').value = u.email||'';
  document.getElementById('u-role').value = u.role||'employee';
  document.getElementById('u-active').value = u.is_active ? '1' : '0';
  document.getElementById('u-branch').value = u.branch || '';
  toggleBranchField();
  document.getElementById('userModal').classList.add('open');
}

async function saveUser() {
  const id = document.getElementById('u-id').value;
  const name = document.getElementById('u-name').value.trim();
  const username = document.getElementById('u-username').value.trim();
  const password = document.getElementById('u-password').value.trim();
  const role = document.getElementById('u-role').value;
  const branch = document.getElementById('u-branch').value;
  const phone = document.getElementById('u-phone').value.trim() || null;
  const email = document.getElementById('u-email').value.trim() || null;
  const isActive = document.getElementById('u-active').value === '1';

  if (!name || !username) { alert('الاسم واسم المستخدم مطلوبان'); return; }
  if (!id && !password) { alert('كلمة المرور مطلوبة للمستخدم الجديد'); return; }
  if (role !== 'admin' && !branch) { alert('الفرع مطلوب'); return; }

  showLoading(true);
  const { data, error } = await db.rpc('admin_upsert_branch_user', {
    p_id: id ? parseInt(id) : null,
    p_username: username,
    p_full_name: name,
    p_password: password || null,
    p_mobile: phone,
    p_role: role,
    p_branch: role === 'admin' ? 'كل الفروع' : branch,
    p_is_active: isActive,
    p_email: email
  });
  showLoading(false);

  if (error || (data && data.success === false)) {
    alert('حدث خطأ: ' + (error?.message || data?.error));
    return;
  }
  closeModal('userModal');
  await init();
}

async function toggleActive(id, current) {
  showLoading(true);
  await db.rpc('admin_toggle_branch_user', { p_id: id, p_is_active: !current });
  await init();
}

function openDelete(id, name) {
  deleteTargetId = id;
  document.getElementById('deleteUserName').textContent = name;
  document.getElementById('deleteModal').classList.add('open');
}

async function confirmDelete() {
  if (!deleteTargetId) return;
  showLoading(true);
  await db.rpc('admin_delete_branch_user', { p_id: deleteTargetId });
  deleteTargetId = null;
  closeModal('deleteModal');
  await init();
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }

init();
</script>
</body>
</html>
