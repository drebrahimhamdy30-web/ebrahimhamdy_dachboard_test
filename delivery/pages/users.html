<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المستخدمون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body { padding: 1.25rem; overflow-y: auto; height: 100vh; background: var(--bg); }

.users-table-wrap { overflow-x: auto; }
.users-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.users-table th { padding: .6rem 1rem; text-align: right; font-weight: 600; color: var(--text-muted); background: var(--gray-light); border-bottom: 1px solid var(--border); font-size: .7rem; white-space: nowrap; }
.users-table td { padding: .65rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.users-table tr:last-child td { border-bottom: none; }
.users-table tr:hover td { background: #fafafa; }

.user-name-cell { display: flex; align-items: center; gap: .625rem; }
.user-mini-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .7rem; color: white; flex-shrink: 0; }

.action-cell { display: flex; gap: .4rem; align-items: center; }
</style>
</head>
<body>

<!-- Stats -->
<div class="stats-grid" id="userStats" style="margin-bottom:1.25rem"></div>

<!-- Actions Bar -->
<div class="filters-bar" style="margin-bottom:1rem">
  <input type="text" class="search-input" id="userSearch" placeholder="🔍 بحث..." oninput="renderUsers()">
  <select class="filter-input" id="roleFilter" onchange="renderUsers()">
    <option value="">كل الأدوار</option>
    <option value="admin">Admin</option>
    <option value="supervisor">مشرف</option>
    <option value="cashier">كاشير</option>
    <option value="pharmacist">صيدلي</option>
    <option value="driver">طيار</option>
  </select>
  <select class="filter-input" id="activeFilter" onchange="renderUsers()">
    <option value="">الكل</option>
    <option value="1">نشط</option>
    <option value="0">معطل</option>
  </select>
  <button class="btn btn-primary btn-sm" onclick="openUserModal()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    إضافة مستخدم
  </button>
</div>

<!-- Table -->
<div class="card">
  <div class="users-table-wrap">
    <table class="users-table">
      <thead>
        <tr>
          <th>المستخدم</th>
          <th>اسم المستخدم</th>
          <th>الدور</th>
          <th>الحالة</th>
          <th>الفرع</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody id="usersBody">
        <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted)">جاري التحميل...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal: Add/Edit User -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="userModalTitle">إضافة مستخدم</span>
      <button class="modal-close" onclick="closeModal('userModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="u-id">
      <div class="form-grid-2">
        <div class="form-group">
          <label>الاسم الكامل *</label>
          <input type="text" class="form-control" id="u-name" placeholder="الاسم الكامل">
        </div>
        <div class="form-group">
          <label>اسم المستخدم *</label>
          <input type="text" class="form-control" id="u-username" placeholder="username" dir="ltr">
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>كلمة المرور *</label>
          <input type="text" class="form-control" id="u-password" placeholder="كلمة المرور" dir="ltr">
        </div>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="text" class="form-control" id="u-phone" placeholder="01xxxxxxxxx">
        </div>
      </div>
<div class="form-grid-2">
        <div class="form-group">
          <label>الدور *</label>
          <select class="form-control" id="u-role" onchange="toggleBranchField()">
            <option value="driver">طيار</option>
            <option value="cashier">كاشير</option>
            <option value="pharmacist">صيدلي</option>
            <option value="supervisor">مشرف</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label>الحالة</label>
          <select class="form-control" id="u-active">
            <option value="1">نشط</option>
            <option value="0">معطل</option>
          </select>
        </div>
      </div>
      <div class="form-group" id="branchFieldWrap">
        <label>الفرع *</label>
        <select class="form-control" id="u-branch">
          <option value="">— اختر الفرع —</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('userModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveUser()">حفظ</button>
    </div>
  </div>
</div>

<!-- Modal: Confirm Delete -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title">تأكيد الحذف</span>
      <button class="modal-close" onclick="closeModal('deleteModal')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:.875rem;color:var(--text)">هل أنت متأكد من حذف المستخدم <strong id="deleteUserName"></strong>؟</p>
      <p style="font-size:.78rem;color:var(--red);margin-top:.5rem">هذا الإجراء لا يمكن التراجع عنه.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('deleteModal')">إلغاء</button>
      <button class="btn btn-red" onclick="confirmDelete()">حذف</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../permissions.js"></script>
<script>
const ROLE_LABELS = { admin:'Admin', supervisor:'مشرف', cashier:'كاشير', pharmacist:'صيدلي', driver:'طيار' };
const ROLE_COLORS = ['#1a56db','#7c3aed','#16a34a','#ea580c','#0891b2','#ca8a04','#dc2626','#0d9488'];
let allUsers = [];
let allBranches = [];
let deleteTargetId = null;

async function init() {
  const user = getCurrentUser();
  if (!user) return;
  if (!['admin'].includes(user.role)) {
    document.body.innerHTML = '<div class="empty-state" style="padding:4rem"><div class="icon">🔒</div><p>ليس لديك صلاحية لعرض هذه الصفحة</p></div>';
    return;
  }
  showLoading(true);
  // حمّل الفروع
  const { data: branches } = await db.from('branches').select('id,name').order('name');
  allBranches = branches || [];
  const branchSel = document.getElementById('u-branch');
  branchSel.innerHTML = '<option value="">— اختر الفرع —</option>' +
    allBranches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

  const { data } = await db.from('users').select('*').order('role').order('full_name');
  allUsers = data || [];
  renderStats();
  renderUsers();
  showLoading(false);
}

// أخفي خانة الفرع لو الدور أدمن (الأدمن = كل الفروع)
function toggleBranchField() {
  const role = document.getElementById('u-role').value;
  document.getElementById('branchFieldWrap').style.display = role === 'admin' ? 'none' : 'block';
}

function renderStats() {
  const byRole = {};
  allUsers.forEach(u => byRole[u.role] = (byRole[u.role]||0)+1);
  const active = allUsers.filter(u => u.is_active).length;

  document.getElementById('userStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--blue-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
      <div class="stat-label">إجمالي المستخدمين</div>
      <div class="stat-value">${allUsers.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--green-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="stat-label">نشطون</div>
      <div class="stat-value">${active}</div>
    </div>
    ${Object.entries(byRole).map(([role, count]) => `
      <div class="stat-card">
        <div class="stat-label">${ROLE_LABELS[role]||role}</div>
        <div class="stat-value">${count}</div>
      </div>`).join('')}`;
}

function renderUsers() {
  const search = document.getElementById('userSearch').value.toLowerCase();
  const roleF = document.getElementById('roleFilter').value;
  const activeF = document.getElementById('activeFilter').value;

  const users = allUsers.filter(u => {
    if (search && !(u.full_name||'').toLowerCase().includes(search) && !(u.username||'').toLowerCase().includes(search)) return false;
    if (roleF && u.role !== roleF) return false;
    if (activeF === '1' && !u.is_active) return false;
    if (activeF === '0' && u.is_active) return false;
    return true;
  });

  const tbody = document.getElementById('usersBody');
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted)">لا يوجد مستخدمون</td></tr>';
    return;
  }

  tbody.innerHTML = users.map((u, i) => {
    const color = ROLE_COLORS[i % ROLE_COLORS.length];
    const initials = (u.full_name||'?').split(' ').slice(0,2).map(w=>w[0]).join('');
    return `<tr>
      <td>
        <div class="user-name-cell">
          <div class="user-mini-avatar" style="background:${color}">${initials}</div>
          <span style="font-weight:600">${u.full_name||'—'}</span>
        </div>
      </td>
      <td style="font-family:monospace;font-size:.75rem;color:var(--text-muted)">${u.username||'—'}</td>
      <td><span class="badge badge-${u.role}">${ROLE_LABELS[u.role]||u.role}</span></td>
      <td><span class="badge ${u.is_active?'badge-active':'badge-inactive'}">${u.is_active?'نشط':'معطل'}</span></td>
      <td style="font-size:.72rem;color:var(--text-muted)">${u.role==='admin'?'كل الفروع':(allBranches.find(b=>b.id===u.branch_id)?.name||'—')}</td>
      <td>
        <div class="action-cell">
          <button class="btn btn-outline btn-sm" onclick="openEditModal('${u.id}')">تعديل</button>
          <button class="btn btn-sm ${u.is_active?'btn-outline':'btn-green'}" onclick="toggleActive('${u.id}',${u.is_active})">${u.is_active?'تعطيل':'تفعيل'}</button>
          <button class="btn btn-sm" style="background:var(--red-light);color:#b91c1c" onclick="openDelete('${u.id}','${u.full_name}')">حذف</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function openUserModal() {
  document.getElementById('userModalTitle').textContent = 'إضافة مستخدم';
  ['u-id','u-name','u-username','u-password','u-phone'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('u-role').value = 'driver';
  document.getElementById('u-active').value = '1';
  document.getElementById('u-branch').value = '';
  toggleBranchField();
  document.getElementById('userModal').classList.add('open');
}

function openEditModal(id) {
  const u = allUsers.find(x => x.id === id); if (!u) return;
  document.getElementById('userModalTitle').textContent = 'تعديل مستخدم';
  document.getElementById('u-id').value = u.id;
  document.getElementById('u-name').value = u.full_name||'';
  document.getElementById('u-username').value = u.username||'';
  document.getElementById('u-password').value = u.password_hash||'';
  document.getElementById('u-phone').value = u.phone||'';
  document.getElementById('u-role').value = u.role||'driver';
  document.getElementById('u-active').value = u.is_active ? '1' : '0';
  document.getElementById('u-branch').value = u.branch_id || '';
  toggleBranchField();
  document.getElementById('userModal').classList.add('open');
}

async function saveUser() {
  const id = document.getElementById('u-id').value;
  const name = document.getElementById('u-name').value.trim();
  const username = document.getElementById('u-username').value.trim();
  const password = document.getElementById('u-password').value.trim();
  const role = document.getElementById('u-role').value;
  const branch = document.getElementById('u-branch').value;
  if (!name || !username) { alert('الاسم واسم المستخدم مطلوبان'); return; }
  if (!id && !password) { alert('كلمة المرور مطلوبة للمستخدم الجديد'); return; }
  // الفرع إجباري لكل الأدوار ماعدا الأدمن
  if (role !== 'admin' && !branch) { alert('الفرع مطلوب'); return; }

  showLoading(true);
  try {
    const payload = {
      full_name: name, username, role,
      is_active: document.getElementById('u-active').value === '1',
      phone: document.getElementById('u-phone').value.trim() || null,
      branch_id: role === 'admin' ? null : branch
    };
    if (password) payload.password_hash = password;

    let error;
    if (id) {
      ({ error } = await db.from('users').update(payload).eq('id', id));
    } else {
      ({ error } = await db.from('users').insert({ ...payload, password_hash: password }));
    }

    if (error) {
      showLoading(false);
      alert('حدث خطأ: ' + error.message);
      return;
    }

    closeModal('userModal');
    await init();
  } catch(e) {
    showLoading(false);
    alert('حدث خطأ: ' + e.message);
  }
}

async function toggleActive(id, current) {
  showLoading(true);
  await db.from('users').update({ is_active: !current }).eq('id', id);
  await init();
}

function openDelete(id, name) {
  deleteTargetId = id;
  document.getElementById('deleteUserName').textContent = name;
  document.getElementById('deleteModal').classList.add('open');
}

async function confirmDelete() {
  if (!deleteTargetId) return;
  showLoading(true);
  await db.from('users').delete().eq('id', deleteTargetId);
  deleteTargetId = null;
  closeModal('deleteModal');
  await init();
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }

init();
</script>
</body>
</html>
