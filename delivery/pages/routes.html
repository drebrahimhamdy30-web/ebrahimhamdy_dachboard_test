<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطوط السير</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body{padding:1.25rem;overflow-y:auto;height:100vh;background:var(--bg)}
.branch-bar{display:flex;align-items:center;gap:.75rem;background:white;border:1px solid var(--border);border-radius:12px;padding:.875rem 1.25rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
.branch-select{flex:1;height:40px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;font-weight:600;outline:none;background:white;cursor:pointer}
.branch-select:focus{border-color:var(--primary)}
.routes-layout{display:grid;grid-template-columns:300px 1fr;gap:1rem}
@media(max-width:800px){.routes-layout{grid-template-columns:1fr}}
.route-list{display:flex;flex-direction:column;gap:.5rem}
.route-item{background:white;border-radius:10px;border:1.5px solid var(--border);padding:.75rem 1rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.route-item:hover{border-color:var(--primary)}
.route-item.selected{border-color:var(--primary);background:var(--primary-light)}
.route-item-name{font-weight:700;font-size:.85rem}
.route-item-meta{font-size:.7rem;color:var(--text-muted);margin-top:.15rem}
.route-item-count{background:var(--primary);color:white;font-size:.65rem;font-weight:700;padding:.2rem .5rem;border-radius:20px;flex-shrink:0}
.route-regions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem;margin-top:.75rem}
.route-region-card{background:white;border-radius:10px;border:1.5px solid var(--border);padding:.625rem .875rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.78rem}
.route-region-name{font-weight:600;flex:1}
.remove-region-btn{width:20px;height:20px;border-radius:50%;background:var(--red-light);color:var(--red);border:none;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.remove-region-btn:hover{background:var(--red);color:white}
.available-regions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.4rem;max-height:220px;overflow-y:auto;padding:.25rem}
.available-region-item{display:flex;align-items:center;gap:.4rem;padding:.4rem .625rem;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.72rem;transition:all .15s}
.available-region-item:hover{border-color:var(--primary);background:var(--primary-light)}
.available-region-item.already-added{opacity:.4;pointer-events:none;background:var(--gray-light)}
.empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1rem;color:var(--text-muted);gap:.75rem}
.type-inside{background:var(--green-light);color:#15803d}
.type-outside{background:var(--yellow-light);color:#a16207}
.type-permit{background:var(--purple-light);color:#6d28d9}
.type-hard{background:var(--red-light);color:#b91c1c}
</style>
</head>
<body>

<!-- Branch selector -->
<div class="branch-bar">
  <span style="font-size:.8rem;font-weight:700;color:var(--text-muted);white-space:nowrap">الفرع:</span>
  <select class="branch-select" id="branchSelect" onchange="onBranchChange()">
    <option value="">اختر الفرع...</option>
  </select>
  <button class="btn btn-primary btn-sm" id="addRouteBtn" onclick="openAddRouteModal()" style="display:none;white-space:nowrap">+ خط سير جديد</button>
</div>

<div id="mainContent" style="display:none">
  <div class="routes-layout">
    <div>
      <div style="font-size:.78rem;font-weight:600;color:var(--text-muted);margin-bottom:.5rem" id="routesCount">خطوط السير</div>
      <div class="route-list" id="routeList"></div>
    </div>
    <div class="card" id="detailPanel">
      <div class="empty-detail"><div style="font-size:2.5rem">🗺️</div><p>اختر خط سير لعرض تفاصيله</p></div>
    </div>
  </div>
</div>

<!-- Modal: Add/Edit Route -->
<div class="modal-overlay" id="routeModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title" id="routeModalTitle">خط سير جديد</span>
      <button class="modal-close" onclick="closeModal('routeModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="rt-id">
      <div class="form-group">
        <label>اسم خط السير *</label>
        <input type="text" class="form-control" id="rt-name" placeholder="مثال: خط سيدي بشر...">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="checkbox-item"><input type="checkbox" id="rt-active" checked><span style="font-weight:600">خط نشط</span></label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('routeModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveRoute()">حفظ</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../config.js?v=20260903"></script>
<script src="../supabase-config.js?v=20260901"></script>
<script src="../permissions.js"></script>
<script>
const TYPE_LABELS={inside:'داخل الزون',outside:'خارج الزون',permit:'ترخيص',hard:'صعب الوصول'};
const TYPE_CLASS={inside:'type-inside',outside:'type-outside',permit:'type-permit',hard:'type-hard'};

let allRoutes=[], branchRegions=[], allBranches=[], routeRegionsMap={};
let selectedRouteId=null, curBranchId=null;

async function init(){
  const user=getCurrentUser();if(!user)return;
  showLoading(true);
  const isAdmin=user.role==='admin';
  const userBranch=user.branch_id;

  const {data:br}=await db.from('branches').select('id,name').order('name');
  allBranches=br||[];
  const sel=document.getElementById('branchSelect');

  if(!isAdmin && userBranch){
    // مش أدمن → فرعه بس، مقفول
    const myBranch=allBranches.filter(b=>b.id===userBranch);
    sel.innerHTML=myBranch.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
    sel.value=userBranch;
    sel.disabled=true;
    await onBranchChange();
  } else {
    // أدمن → كل الفروع
    sel.innerHTML='<option value="">اختر الفرع...</option>'+allBranches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
    if(userBranch){sel.value=userBranch;await onBranchChange();}
  }
  showLoading(false);
}

async function onBranchChange(){
  curBranchId=document.getElementById('branchSelect').value;
  if(!curBranchId){document.getElementById('mainContent').style.display='none';document.getElementById('addRouteBtn').style.display='none';return;}
  showLoading(true);
  // جيب خطوط السير للفرع
  const {data:routes}=await db.from('routes').select('*').eq('branch_id',curBranchId).order('name');
  allRoutes=routes||[];
  // جيب مناطق الفرع
  const {data:regions}=await db.from('regions').select('*').eq('branch_id',curBranchId).eq('is_active',true).order('name');
  branchRegions=regions||[];
  // جيب route_regions
  if(allRoutes.length){
    const routeIds=allRoutes.map(r=>r.id);
    const {data:rr}=await db.from('route_regions').select('*').in('route_id',routeIds);
    routeRegionsMap={};
    (rr||[]).forEach(r=>{if(!routeRegionsMap[r.route_id])routeRegionsMap[r.route_id]=[];routeRegionsMap[r.route_id].push(r.region_id);});
  }
  renderRouteList();
  document.getElementById('mainContent').style.display='block';
  document.getElementById('addRouteBtn').style.display='flex';
  document.getElementById('routesCount').textContent=`${allRoutes.length} خط سير`;
  if(selectedRouteId) showRouteDetail(selectedRouteId);
  showLoading(false);
}

function renderRouteList(){
  const list=document.getElementById('routeList');
  if(!allRoutes.length){list.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text-muted);font-size:.8rem">لا توجد خطوط سير<br><button class="btn btn-primary btn-sm" style="margin-top:.75rem" onclick="openAddRouteModal()">+ إضافة</button></div>';return;}
  list.innerHTML=allRoutes.map(r=>{
    const count=(routeRegionsMap[r.id]||[]).length;
    return `<div class="route-item ${selectedRouteId===r.id?'selected':''}" onclick="selectRoute('${r.id}')">
      <div><div class="route-item-name">${r.name}</div><div class="route-item-meta">${r.is_active?'نشط':'معطل'} · ${count} منطقة</div></div>
      <span class="route-item-count">${count}</span>
    </div>`;
  }).join('');
}

function selectRoute(id){
  selectedRouteId=id;
  renderRouteList();
  showRouteDetail(id);
}

function showRouteDetail(routeId){
  const route=allRoutes.find(r=>r.id===routeId);if(!route)return;
  const regionIds=routeRegionsMap[routeId]||[];
  const routeRegionsList=regionIds.map(rid=>branchRegions.find(r=>r.id===rid)).filter(Boolean);

  document.getElementById('detailPanel').innerHTML=`
    <div class="card-header">
      <div>
        <div class="card-title">${route.name}</div>
        <span class="badge ${route.is_active?'badge-active':'badge-inactive'}" style="margin-top:.25rem;display:inline-block">${route.is_active?'نشط':'معطل'}</span>
      </div>
      <div style="display:flex;gap:.4rem">
        <button class="btn btn-outline btn-sm" onclick="openEditRoute('${route.id}')">تعديل</button>
        <button class="btn btn-red btn-sm" onclick="deleteRoute('${route.id}')">حذف</button>
      </div>
    </div>
    <div class="card-body">
      <div style="font-size:.78rem;font-weight:700;margin-bottom:.5rem">المناطق في هذا الخط (${routeRegionsList.length})</div>
      ${routeRegionsList.length?`
        <div class="route-regions-grid">
          ${routeRegionsList.map(r=>{
            const types=(r.types||[]).map(t=>`<span style="font-size:.58rem;font-weight:700;padding:.1rem .35rem;border-radius:10px" class="${TYPE_CLASS[t]||''}">${TYPE_LABELS[t]||t}</span>`).join('');
            return `<div class="route-region-card">
              <div><div class="route-region-name">${r.name}</div><div style="display:flex;gap:.2rem;flex-wrap:wrap;margin-top:.2rem">${types}</div></div>
              <button class="remove-region-btn" onclick="removeRegion('${routeId}','${r.id}')">✕</button>
            </div>`;
          }).join('')}
        </div>`:'<div style="font-size:.8rem;color:var(--text-muted);padding:.75rem 0">لا توجد مناطق في هذا الخط</div>'}

      <div style="margin-top:1.25rem">
        <div style="font-size:.78rem;font-weight:700;margin-bottom:.5rem">إضافة مناطق من الفرع</div>
        ${branchRegions.length?`
          <input type="text" class="search-input" placeholder="🔍 بحث..." oninput="filterAvailable(this.value,'${routeId}')" style="margin-bottom:.5rem;width:100%">
          <div class="available-regions-grid" id="availGrid-${routeId}">
            ${branchRegions.map(r=>`
              <div class="available-region-item ${regionIds.includes(r.id)?'already-added':''}" onclick="addRegion('${routeId}','${r.id}',this)" id="avail-${routeId}-${r.id}">
                + ${r.name}
                ${(r.types||[]).length?`<span class="${TYPE_CLASS[(r.types||[])[0]]||''}" style="font-size:.55rem;padding:.1rem .3rem;border-radius:6px;font-weight:700">${TYPE_LABELS[(r.types||[])[0]]||''}</span>`:''}
              </div>`).join('')}
          </div>`:'<div style="font-size:.78rem;color:var(--text-muted)">لا توجد مناطق مسجلة لهذا الفرع — أضف مناطق من شاشة المناطق أولاً</div>'}
      </div>
    </div>`;
}

function filterAvailable(search,routeId){
  document.querySelectorAll(`#availGrid-${routeId} .available-region-item`).forEach(item=>{
    item.style.display=item.textContent.trim().toLowerCase().includes(search.toLowerCase())?'':'none';
  });
}

async function addRegion(routeId,regionId,el){
  if(el.classList.contains('already-added'))return;
  showLoading(true);
  await db.from('route_regions').insert({route_id:routeId,region_id:regionId});
  if(!routeRegionsMap[routeId])routeRegionsMap[routeId]=[];
  routeRegionsMap[routeId].push(regionId);
  await onBranchChange();
  selectRoute(routeId);
}

async function removeRegion(routeId,regionId){
  showLoading(true);
  await db.from('route_regions').delete().eq('route_id',routeId).eq('region_id',regionId);
  routeRegionsMap[routeId]=(routeRegionsMap[routeId]||[]).filter(id=>id!==regionId);
  await onBranchChange();
  selectRoute(routeId);
}

function openAddRouteModal(){
  document.getElementById('routeModalTitle').textContent='خط سير جديد';
  document.getElementById('rt-id').value='';
  document.getElementById('rt-name').value='';
  document.getElementById('rt-active').checked=true;
  document.getElementById('routeModal').classList.add('open');
}

function openEditRoute(id){
  const r=allRoutes.find(x=>x.id===id);if(!r)return;
  document.getElementById('routeModalTitle').textContent='تعديل خط السير';
  document.getElementById('rt-id').value=r.id;
  document.getElementById('rt-name').value=r.name||'';
  document.getElementById('rt-active').checked=r.is_active!==false;
  document.getElementById('routeModal').classList.add('open');
}

async function saveRoute(){
  const name=document.getElementById('rt-name').value.trim();
  if(!name){alert('اسم خط السير مطلوب');return;}
  if(!curBranchId){alert('اختر الفرع أولاً');return;}
  const payload={name,branch_id:curBranchId,is_active:document.getElementById('rt-active').checked};
  showLoading(true);
  const id=document.getElementById('rt-id').value;
  if(id){await db.from('routes').update(payload).eq('id',id);}
  else{const {data}=await db.from('routes').insert(payload).select().single();if(data)selectedRouteId=data.id;}
  closeModal('routeModal');
  await onBranchChange();
}

async function deleteRoute(id){
  if(!confirm('حذف خط السير؟'))return;
  showLoading(true);
  await db.from('route_regions').delete().eq('route_id',id);
  await db.from('routes').delete().eq('id',id);
  if(selectedRouteId===id){selectedRouteId=null;document.getElementById('detailPanel').innerHTML='<div class="empty-detail"><div style="font-size:2.5rem">🗺️</div><p>اختر خط سير</p></div>';}
  await onBranchChange();
}

function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
function showLoading(show){document.getElementById('loadingOverlay').classList.toggle('show',show);}

init();
</script>
</body>
</html>
