<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خطوط السير</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body { padding: 1.25rem; overflow-y: auto; height: 100vh; background: var(--bg); }

.routes-layout { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; }
@media(max-width:800px) { .routes-layout { grid-template-columns: 1fr; } }

/* Routes list */
.route-list { display: flex; flex-direction: column; gap: .5rem; }
.route-item {
  background: white;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  padding: .75rem 1rem;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.route-item:hover { border-color: var(--primary); }
.route-item.selected { border-color: var(--primary); background: var(--primary-light); }
.route-item-info { flex: 1; min-width: 0; }
.route-item-name { font-weight: 700; font-size: .85rem; color: var(--text); }
.route-item-meta { font-size: .7rem; color: var(--text-muted); margin-top: .15rem; }
.route-item-count {
  background: var(--primary);
  color: white;
  font-size: .65rem;
  font-weight: 700;
  padding: .2rem .5rem;
  border-radius: 20px;
  flex-shrink: 0;
  margin-right: .5rem;
}

/* Detail panel */
.detail-panel { }
.detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.detail-title { font-size: .9rem; font-weight: 700; color: var(--text); }

/* Regions in route */
.route-regions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .5rem; margin-top: .75rem; }
.route-region-card {
  background: white;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  padding: .625rem .875rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  font-size: .78rem;
}
.route-region-name { font-weight: 600; flex: 1; }
.remove-region-btn {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--red-light);
  color: var(--red);
  border: none;
  cursor: pointer;
  font-size: .75rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all .15s;
}
.remove-region-btn:hover { background: var(--red); color: white; }

/* Add regions section */
.add-regions-section { margin-top: 1rem; }
.available-regions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .4rem; max-height: 200px; overflow-y: auto; padding: .25rem; }
.available-region-item {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: .4rem .625rem;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: .72rem;
  transition: all .15s;
}
.available-region-item:hover { border-color: var(--primary); background: var(--primary-light); }
.available-region-item.already-added { opacity: .4; pointer-events: none; background: var(--gray-light); }

/* Empty detail */
.empty-detail { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1rem; color: var(--text-muted); gap: .75rem; }
.empty-detail .icon { font-size: 2.5rem; }

.branch-badge {
  font-size: .68rem;
  font-weight: 600;
  padding: .15rem .5rem;
  border-radius: 8px;
  background: var(--blue-light);
  color: #0e7490;
}
</style>
</head>
<body>

<div class="flex-between" style="margin-bottom:1.25rem;flex-wrap:wrap;gap:.625rem">
  <div>
    <div style="font-size:.9rem;font-weight:700">خطوط السير</div>
    <div style="font-size:.75rem;color:var(--text-muted)" id="routesCount">جاري التحميل...</div>
  </div>
  <button class="btn btn-primary" onclick="openAddRouteModal()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    خط سير جديد
  </button>
</div>

<div class="routes-layout">
  <!-- Left: Routes list -->
  <div>
    <div style="font-size:.78rem;font-weight:600;color:var(--text-muted);margin-bottom:.5rem">خطوط السير</div>
    <div class="route-list" id="routeList">
      <div class="empty-state"><div class="icon">⏳</div><p>جاري التحميل...</p></div>
    </div>
  </div>

  <!-- Right: Detail -->
  <div class="card" id="detailPanel">
    <div class="empty-detail">
      <div class="icon">🗺️</div>
      <p>اختر خط سير لعرض تفاصيله</p>
    </div>
  </div>
</div>

<!-- Modal: Add/Edit Route -->
<div class="modal-overlay" id="routeModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title" id="routeModalTitle">خط سير جديد</span>
      <button class="modal-close" onclick="closeRouteModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="rt-id">
      <div class="form-group">
        <label>اسم خط السير *</label>
        <input type="text" class="form-control" id="rt-name" placeholder="مثال: خط سيدي بشر، خط المنتزه...">
      </div>
      <div class="form-group">
        <label>الفرع</label>
        <select class="form-control" id="rt-branch">
          <option value="">اختر الفرع...</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="checkbox-item">
          <input type="checkbox" id="rt-active" checked>
          <span style="font-weight:600">خط نشط</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeRouteModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveRoute()">حفظ</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../permissions.js"></script>
<script>
const TYPE_LABELS = { inside:'داخل الزون', outside:'خارج الزون', permit:'ترخيص', hard:'صعب الوصول' };
const TYPE_CLASS  = { inside:'type-inside', outside:'type-outside', permit:'type-permit', hard:'type-hard' };

let allRoutes = [], allRegions = [], allBranches = [], routeRegionsMap = {};
let selectedRouteId = null;

async function init() {
  const user = getCurrentUser(); if (!user) return;
  showLoading(true);
  try {
    const [routesRes, regionsRes, branchesRes] = await Promise.all([
      db.from('routes').select('*, branches(name)').order('name'),
      db.from('regions').select('*').eq('is_active', true).order('name'),
      db.from('branches').select('*').order('name')
    ]);
    allRoutes = routesRes.data || [];
    allRegions = regionsRes.data || [];
    allBranches = branchesRes.data || [];

    // Load route_regions
    const { data: rr } = await db.from('route_regions').select('*');
    routeRegionsMap = {};
    (rr || []).forEach(r => {
      if (!routeRegionsMap[r.route_id]) routeRegionsMap[r.route_id] = [];
      routeRegionsMap[r.route_id].push(r.region_id);
    });

    renderBranchSelect();
    renderRouteList();
    if (selectedRouteId) showRouteDetail(selectedRouteId);
    document.getElementById('routesCount').textContent = `${allRoutes.length} خط سير`;
  } catch(e) { console.error(e); }
  showLoading(false);
}

function renderBranchSelect() {
  const sel = document.getElementById('rt-branch');
  sel.innerHTML = '<option value="">اختر الفرع...</option>' +
    allBranches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
}

function renderRouteList() {
  const list = document.getElementById('routeList');
  if (!allRoutes.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🗺️</div><p>لا توجد خطوط سير</p></div>';
    return;
  }
  list.innerHTML = allRoutes.map(r => {
    const count = (routeRegionsMap[r.id] || []).length;
    const branchName = r.branches?.name || '—';
    return `
      <div class="route-item ${selectedRouteId===r.id?'selected':''}" onclick="selectRoute('${r.id}')">
        <div class="route-item-info">
          <div class="route-item-name">${r.name}</div>
          <div class="route-item-meta">${branchName} · ${r.is_active?'نشط':'معطل'}</div>
        </div>
        <span class="route-item-count">${count}</span>
      </div>`;
  }).join('');
}

function selectRoute(id) {
  selectedRouteId = id;
  renderRouteList();
  showRouteDetail(id);
}

function showRouteDetail(routeId) {
  const route = allRoutes.find(r => r.id === routeId);
  if (!route) return;
  const regionIds = routeRegionsMap[routeId] || [];
  const routeRegions = regionIds.map(rid => allRegions.find(r => r.id === rid)).filter(Boolean);
  const availableRegions = allRegions;
  const branchName = route.branches?.name || '—';

  document.getElementById('detailPanel').innerHTML = `
    <div class="card-header">
      <div>
        <div class="card-title">${route.name}</div>
        <div style="display:flex;gap:.4rem;margin-top:.3rem;flex-wrap:wrap">
          <span class="branch-badge">🏢 ${branchName}</span>
          <span class="badge ${route.is_active?'badge-active':'badge-inactive'}">${route.is_active?'نشط':'معطل'}</span>
        </div>
      </div>
      <div style="display:flex;gap:.4rem">
        <button class="btn btn-outline btn-sm" onclick="openEditRoute('${route.id}')">تعديل</button>
        <button class="btn btn-red btn-sm" onclick="deleteRoute('${route.id}')">حذف</button>
      </div>
    </div>
    <div class="card-body">
      <div style="font-size:.78rem;font-weight:700;margin-bottom:.5rem">
        المناطق في هذا الخط
        <span style="font-size:.7rem;font-weight:400;color:var(--text-muted);margin-right:.3rem">(${routeRegions.length} منطقة)</span>
      </div>

      ${routeRegions.length ? `
        <div class="route-regions-grid">
          ${routeRegions.map(r => {
            const types = (r.types||[]).map(t => `<span style="font-size:.6rem;font-weight:600;padding:.1rem .35rem;border-radius:10px" class="type-tag ${TYPE_CLASS[t]||''}">${TYPE_LABELS[t]||t}</span>`).join('');
            return `<div class="route-region-card">
              <div>
                <div class="route-region-name">${r.name}</div>
                <div style="display:flex;gap:.2rem;flex-wrap:wrap;margin-top:.2rem">${types}</div>
              </div>
              <button class="remove-region-btn" onclick="removeRegion('${routeId}','${r.id}')" title="إزالة">✕</button>
            </div>`;
          }).join('')}
        </div>` : `<div style="font-size:.8rem;color:var(--text-muted);padding:.75rem 0">لا توجد مناطق في هذا الخط بعد</div>`
      }

      <div class="add-regions-section">
        <div style="font-size:.78rem;font-weight:700;margin-bottom:.5rem;margin-top:1rem">إضافة مناطق</div>
        <input type="text" class="search-input" placeholder="🔍 بحث في المناطق..." oninput="filterAvailable(this.value,'${routeId}')" id="availSearch" style="margin-bottom:.5rem;width:100%">
        <div class="available-regions-grid" id="availGrid-${routeId}">
          ${availableRegions.map(r => `
            <div class="available-region-item ${regionIds.includes(r.id)?'already-added':''}" onclick="addRegion('${routeId}','${r.id}',this)" id="avail-${routeId}-${r.id}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              ${r.name}
            </div>`).join('')}
        </div>
      </div>
    </div>`;
}

function filterAvailable(search, routeId) {
  const grid = document.getElementById(`availGrid-${routeId}`);
  if (!grid) return;
  grid.querySelectorAll('.available-region-item').forEach(item => {
    const name = item.textContent.trim().toLowerCase();
    item.style.display = name.includes(search.toLowerCase()) ? '' : 'none';
  });
}

async function addRegion(routeId, regionId, el) {
  if (el.classList.contains('already-added')) return;
  showLoading(true);
  await db.from('route_regions').insert({ route_id: routeId, region_id: regionId });
  if (!routeRegionsMap[routeId]) routeRegionsMap[routeId] = [];
  routeRegionsMap[routeId].push(regionId);
  await init();
}

async function removeRegion(routeId, regionId) {
  showLoading(true);
  await db.from('route_regions').delete().eq('route_id', routeId).eq('region_id', regionId);
  if (routeRegionsMap[routeId]) {
    routeRegionsMap[routeId] = routeRegionsMap[routeId].filter(id => id !== regionId);
  }
  await init();
}

function openAddRouteModal() {
  document.getElementById('routeModalTitle').textContent = 'خط سير جديد';
  document.getElementById('rt-id').value = '';
  document.getElementById('rt-name').value = '';
  document.getElementById('rt-branch').value = '';
  document.getElementById('rt-active').checked = true;
  document.getElementById('routeModal').classList.add('open');
}

function openEditRoute(id) {
  const r = allRoutes.find(x => x.id === id); if (!r) return;
  document.getElementById('routeModalTitle').textContent = 'تعديل خط السير';
  document.getElementById('rt-id').value = r.id;
  document.getElementById('rt-name').value = r.name || '';
  document.getElementById('rt-branch').value = r.branch_id || '';
  document.getElementById('rt-active').checked = r.is_active !== false;
  document.getElementById('routeModal').classList.add('open');
}

async function saveRoute() {
  const name = document.getElementById('rt-name').value.trim();
  if (!name) { alert('اسم خط السير مطلوب'); return; }
  const payload = {
    name,
    branch_id: document.getElementById('rt-branch').value || null,
    is_active: document.getElementById('rt-active').checked,
  };
  showLoading(true);
  const id = document.getElementById('rt-id').value;
  if (id) {
    await db.from('routes').update(payload).eq('id', id);
  } else {
    const { data } = await db.from('routes').insert(payload).select().single();
    if (data) selectedRouteId = data.id;
  }
  closeRouteModal();
  await init();
}

async function deleteRoute(id) {
  if (!confirm('هل تريد حذف خط السير؟ سيتم حذف كل المناطق المرتبطة به.')) return;
  showLoading(true);
  await db.from('route_regions').delete().eq('route_id', id);
  await db.from('routes').delete().eq('id', id);
  if (selectedRouteId === id) {
    selectedRouteId = null;
    document.getElementById('detailPanel').innerHTML = '<div class="empty-detail"><div class="icon">🗺️</div><p>اختر خط سير لعرض تفاصيله</p></div>';
  }
  await init();
}

function closeRouteModal() { document.getElementById('routeModal').classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }

init();
</script>
</body>
</html>
