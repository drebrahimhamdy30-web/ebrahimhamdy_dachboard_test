<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الطيارين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body { padding: 1.25rem; overflow-y: auto; height: 100vh; background: var(--bg); }

/* Grid */
.drivers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .875rem; }

/* Driver Card */
.driver-card {
  background: white;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: all .15s;
  position: relative;
}
.driver-card:hover { box-shadow: var(--shadow-md); }
.driver-card.online  { border-top: 3px solid var(--green); }
.driver-card.offline { border-top: 3px solid #9ca3af; }
.driver-card.inactive { opacity: .55; }

/* Online indicator */
.online-dot {
  position: absolute;
  top: .875rem;
  left: .875rem;
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid white;
}
.dot-online  { background: var(--green); animation: onlinePulse 2s infinite; }
.dot-offline { background: #9ca3af; }
@keyframes onlinePulse { 0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.4)} 50%{box-shadow:0 0 0 5px rgba(22,163,74,0)} }

.dc-body { padding: 1.125rem 1rem; display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.dc-avatar {
  width: 58px; height: 58px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.25rem; color: white;
}
.dc-name { font-weight: 700; font-size: .9rem; color: var(--text); text-align: center; }
.dc-phone { font-size: .72rem; color: var(--text-muted); direction: ltr; }

.dc-badges { display: flex; gap: .3rem; flex-wrap: wrap; justify-content: center; }
.dc-badge {
  font-size: .62rem; font-weight: 700;
  padding: .15rem .5rem;
  border-radius: 20px;
}
.badge-online  { background: var(--green-light); color: #15803d; }
.badge-offline { background: var(--gray-light); color: #6b7280; }
.badge-active  { background: var(--blue-light); color: #0e7490; }
.badge-inactive{ background: var(--red-light); color: #b91c1c; }

.dc-info { width: 100%; display: flex; flex-direction: column; gap: .3rem; margin-top: .25rem; }
.dc-info-row { display: flex; align-items: center; justify-content: space-between; font-size: .72rem; padding: .25rem 0; border-bottom: 1px solid var(--gray-light); }
.dc-info-row:last-child { border-bottom: none; }
.dc-info-label { color: var(--text-muted); }
.dc-info-value { font-weight: 600; color: var(--text); }

.dc-footer {
  padding: .625rem 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: .4rem;
  justify-content: center;
  flex-wrap: wrap;
  background: #fafafa;
}
.dc-btn {
  padding: .3rem .75rem;
  border-radius: 8px;
  font-family: 'Cairo', sans-serif;
  font-size: .7rem;
  font-weight: 700;
  cursor: pointer;
  border: 1.5px solid;
  transition: all .15s;
}
.dcb-online   { background: var(--green-light);  color: #15803d; border-color: #bbf7d0; }
.dcb-online:hover { background: #bbf7d0; }
.dcb-offline  { background: var(--gray-light);   color: #374151; border-color: #d1d5db; }
.dcb-offline:hover { background: #e5e7eb; }
.dcb-edit     { background: var(--blue-light);   color: #0e7490; border-color: #a5f3fc; }
.dcb-edit:hover { background: #a5f3fc; }
.dcb-deactivate { background: var(--red-light);  color: #b91c1c; border-color: #fecaca; }
.dcb-activate   { background: var(--green-light); color: #15803d; border-color: #bbf7d0; }

/* Toggle switch */
.toggle-wrap { display: flex; align-items: center; gap: .5rem; font-size: .75rem; font-weight: 600; }
.toggle { position: relative; width: 40px; height: 22px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: #d1d5db;
  border-radius: 22px;
  cursor: pointer;
  transition: .2s;
}
.toggle-slider:before {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  left: 3px; bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: .2s;
}
input:checked + .toggle-slider { background: var(--green); }
input:checked + .toggle-slider:before { transform: translateX(18px); }

/* Filters */
.filter-chip {
  padding: .3rem .75rem;
  border-radius: 20px;
  font-size: .72rem;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: white;
  color: var(--text-muted);
  font-family: 'Cairo', sans-serif;
  transition: all .15s;
}
.filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

/* Stats bar */
.stats-bar { display: flex; gap: .75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.stat-pill {
  display: flex; align-items: center; gap: .4rem;
  padding: .5rem 1rem;
  background: white;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: .78rem;
  box-shadow: var(--shadow);
}
.stat-pill-val { font-weight: 800; font-size: 1.1rem; }
.stat-pill-lbl { color: var(--text-muted); }
</style>
</head>
<body>

<!-- Top bar -->
<div class="flex-between" style="margin-bottom:1rem;flex-wrap:wrap;gap:.625rem">
  <div>
    <div style="font-size:.9rem;font-weight:700">إدارة الطيارين</div>
    <div style="font-size:.75rem;color:var(--text-muted)" id="driversCount">جاري التحميل...</div>
  </div>
  <button class="btn btn-primary" onclick="openAddModal()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    إضافة طيار
  </button>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar"></div>

<!-- Filters & Search -->
<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem">
  <input type="text" class="search-input" id="searchInput" placeholder="🔍 بحث..." oninput="renderDrivers()" style="width:200px">
  <button class="filter-chip active" onclick="setFilter('all',this)">الكل</button>
  <button class="filter-chip" onclick="setFilter('online',this)">🟢 أونلاين</button>
  <button class="filter-chip" onclick="setFilter('offline',this)">⚫ أوفلاين</button>
  <button class="filter-chip" onclick="setFilter('inactive',this)">معطل</button>
</div>

<!-- Grid -->
<div class="drivers-grid" id="driversGrid">
  <div class="empty-state" style="grid-column:1/-1"><div class="icon">⏳</div><p>جاري التحميل...</p></div>
</div>

<!-- Modal: Add/Edit Driver -->
<div class="modal-overlay" id="driverModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">إضافة طيار جديد</span>
      <button class="modal-close" onclick="closeModal('driverModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="d-id">

      <div style="font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.625rem;padding-bottom:.25rem;border-bottom:1px solid var(--border)">البيانات الشخصية</div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>الاسم الكامل *</label>
          <input type="text" class="form-control" id="d-name" placeholder="الاسم الكامل">
        </div>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="text" class="form-control" id="d-phone" placeholder="01xxxxxxxxx" dir="ltr">
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>الرقم القومي</label>
          <input type="text" class="form-control" id="d-national" placeholder="14 رقم" dir="ltr">
        </div>
        <div class="form-group">
          <label>الفرع</label>
          <select class="form-control" id="d-branch">
            <option value="">اختر الفرع...</option>
          </select>
        </div>
      </div>

      <div style="font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:.75rem 0 .625rem;padding-bottom:.25rem;border-bottom:1px solid var(--border)">بيانات المركبة</div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>نوع المركبة</label>
          <select class="form-control" id="d-vtype">
            <option value="">اختر...</option>
            <option value="دراجة نارية">دراجة نارية</option>
            <option value="سيارة">سيارة</option>
            <option value="توك توك">توك توك</option>
            <option value="دراجة هوائية">دراجة هوائية</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>
        <div class="form-group">
          <label>رقم اللوحة</label>
          <input type="text" class="form-control" id="d-vplate" placeholder="أ ب ج 1234" dir="ltr">
        </div>
      </div>

      <div style="font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:.75rem 0 .625rem;padding-bottom:.25rem;border-bottom:1px solid var(--border)">بيانات الحساب (للدخول)</div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>اسم المستخدم *</label>
          <input type="text" class="form-control" id="d-username" placeholder="username" dir="ltr">
        </div>
        <div class="form-group">
          <label>كلمة المرور *</label>
          <input type="text" class="form-control" id="d-password" placeholder="كلمة المرور" dir="ltr">
        </div>
      </div>

      <div style="font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:.75rem 0 .625rem;padding-bottom:.25rem;border-bottom:1px solid var(--border)">الحالة</div>
      <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
        <label class="checkbox-item" style="font-size:.82rem">
          <input type="checkbox" id="d-active" checked style="accent-color:var(--primary);width:15px;height:15px">
          <span style="font-weight:600">طيار نشط</span>
        </label>
        <label class="checkbox-item" style="font-size:.82rem">
          <input type="checkbox" id="d-online" style="accent-color:var(--green);width:15px;height:15px">
          <span style="font-weight:600">أونلاين الآن</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('driverModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveDriver()">حفظ</button>
    </div>
  </div>
</div>

<!-- Modal: Confirm Delete/Deactivate -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title" id="confirmTitle">تأكيد</span>
      <button class="modal-close" onclick="closeModal('confirmModal')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:.875rem" id="confirmText"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('confirmModal')">إلغاء</button>
      <button class="btn btn-red" id="confirmActionBtn">تأكيد</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../permissions.js"></script>
<script>
const COLORS = ['#1a56db','#7c3aed','#16a34a','#ea580c','#0891b2','#ca8a04','#dc2626','#0d9488','#b45309','#1e40af','#065f46','#92400e'];

let allDrivers = [], allBranches = [];
let currentFilter = 'all';

async function init() {
  const user = getCurrentUser(); if (!user) return;
  showLoading(true);
  try {
    const [driversRes, branchesRes] = await Promise.all([
      db.from('drivers').select('*, branches(name)').order('full_name'),
      db.from('branches').select('*').order('name')
    ]);
    allDrivers  = driversRes.data  || [];
    allBranches = branchesRes.data || [];
    renderBranchSelect();
    renderStats();
    renderDrivers();
  } catch(e) { console.error(e); }
  showLoading(false);
}

function renderBranchSelect() {
  const sel = document.getElementById('d-branch');
  sel.innerHTML = '<option value="">اختر الفرع...</option>' +
    allBranches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
}

function renderStats() {
  const total   = allDrivers.length;
  const online  = allDrivers.filter(d => d.is_online && d.is_active).length;
  const offline = allDrivers.filter(d => !d.is_online && d.is_active).length;
  const inactive= allDrivers.filter(d => !d.is_active).length;
  document.getElementById('driversCount').textContent = `${total} طيار`;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill"><span class="stat-pill-val" style="color:var(--text)">${total}</span><span class="stat-pill-lbl">إجمالي</span></div>
    <div class="stat-pill"><span class="stat-pill-val" style="color:var(--green)">${online}</span><span class="stat-pill-lbl">🟢 أونلاين</span></div>
    <div class="stat-pill"><span class="stat-pill-val" style="color:#6b7280">${offline}</span><span class="stat-pill-lbl">⚫ أوفلاين</span></div>
    <div class="stat-pill"><span class="stat-pill-val" style="color:var(--red)">${inactive}</span><span class="stat-pill-lbl">معطل</span></div>`;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderDrivers();
}

function renderDrivers() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let drivers = allDrivers.filter(d => {
    if (search && !(d.full_name||'').toLowerCase().includes(search) &&
        !(d.phone||'').includes(search) && !(d.vehicle_plate||'').toLowerCase().includes(search)) return false;
    if (currentFilter === 'online')   return d.is_online && d.is_active;
    if (currentFilter === 'offline')  return !d.is_online && d.is_active;
    if (currentFilter === 'inactive') return !d.is_active;
    return true;
  });

  const grid = document.getElementById('driversGrid');
  if (!drivers.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">👤</div><p>لا يوجد طيارين</p></div>';
    return;
  }

  grid.innerHTML = drivers.map((d, i) => {
    const color = COLORS[i % COLORS.length];
    const initials = (d.full_name||'?').split(' ').slice(0,2).map(w=>w[0]).join('');
    const isOnline = d.is_online && d.is_active;
    const branchName = d.branches?.name || '—';

    return `
      <div class="driver-card ${isOnline?'online':'offline'} ${!d.is_active?'inactive':''}">
        <div class="online-dot ${isOnline?'dot-online':'dot-offline'}"></div>
        <div class="dc-body">
          <div class="dc-avatar" style="background:${color}">${initials}</div>
          <div class="dc-name">${d.full_name}</div>
          ${d.phone?`<div class="dc-phone">${d.phone}</div>`:''}
          <div class="dc-badges">
            <span class="dc-badge ${isOnline?'badge-online':'badge-offline'}">${isOnline?'🟢 أونلاين':'⚫ أوفلاين'}</span>
            <span class="dc-badge ${d.is_active?'badge-active':'badge-inactive'}">${d.is_active?'نشط':'معطل'}</span>
          </div>
          <div class="dc-info">
            <div class="dc-info-row">
              <span class="dc-info-label">الفرع</span>
              <span class="dc-info-value">${branchName}</span>
            </div>
            ${d.vehicle_type?`<div class="dc-info-row">
              <span class="dc-info-label">المركبة</span>
              <span class="dc-info-value">${d.vehicle_type}${d.vehicle_plate?' · '+d.vehicle_plate:''}</span>
            </div>`:''}
            ${d.last_seen?`<div class="dc-info-row">
              <span class="dc-info-label">آخر ظهور</span>
              <span class="dc-info-value">${new Date(d.last_seen).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span>
            </div>`:''}
          </div>
        </div>
        <div class="dc-footer">
          ${d.is_active ? `
            <button class="dc-btn ${isOnline?'dcb-offline':'dcb-online'}" onclick="toggleOnline('${d.id}',${d.is_online})">
              ${isOnline?'⚫ أوفلاين':'🟢 أونلاين'}
            </button>` : ''}
          <button class="dc-btn dcb-edit" onclick="openEdit('${d.id}')">تعديل</button>
          <button class="dc-btn ${d.is_active?'dcb-deactivate':'dcb-activate'}" onclick="confirmToggleActive('${d.id}',${d.is_active},'${d.full_name}')">
            ${d.is_active?'تعطيل':'تفعيل'}
          </button>
        </div>
      </div>`;
  }).join('');
}

// ===== ADD/EDIT =====
function openAddModal() {
  document.getElementById('modalTitle').textContent = 'إضافة طيار جديد';
  document.getElementById('d-id').value = '';
  ['d-name','d-phone','d-national','d-username','d-password','d-vplate'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('d-branch').value = '';
  document.getElementById('d-vtype').value = '';
  document.getElementById('d-active').checked = true;
  document.getElementById('d-online').checked = false;
  // Show password field for new driver
  document.getElementById('d-password').closest('.form-group').style.display = '';
  document.getElementById('d-username').closest('.form-group').style.display = '';
  document.getElementById('driverModal').classList.add('open');
}

function openEdit(id) {
  const d = allDrivers.find(x => x.id === id); if (!d) return;
  document.getElementById('modalTitle').textContent = 'تعديل بيانات الطيار';
  document.getElementById('d-id').value = d.id;
  document.getElementById('d-name').value = d.full_name || '';
  document.getElementById('d-phone').value = d.phone || '';
  document.getElementById('d-national').value = d.national_id || '';
  document.getElementById('d-branch').value = d.branch_id || '';
  document.getElementById('d-vtype').value = d.vehicle_type || '';
  document.getElementById('d-vplate').value = d.vehicle_plate || '';
  document.getElementById('d-active').checked = d.is_active !== false;
  document.getElementById('d-online').checked = d.is_online || false;
  // Hide user/pass for edit (separate flow)
  document.getElementById('d-username').value = '';
  document.getElementById('d-password').value = '';
  document.getElementById('driverModal').classList.add('open');
}

async function saveDriver() {
  const name     = document.getElementById('d-name').value.trim();
  const username = document.getElementById('d-username').value.trim();
  const password = document.getElementById('d-password').value.trim();
  const id       = document.getElementById('d-id').value;

  if (!name) { alert('الاسم مطلوب'); return; }
  if (!id && (!username || !password)) { alert('اسم المستخدم وكلمة المرور مطلوبان للطيار الجديد'); return; }

  showLoading(true);
  try {
    const driverPayload = {
      full_name:     name,
      phone:         document.getElementById('d-phone').value.trim() || null,
      national_id:   document.getElementById('d-national').value.trim() || null,
      branch_id:     document.getElementById('d-branch').value || null,
      vehicle_type:  document.getElementById('d-vtype').value || null,
      vehicle_plate: document.getElementById('d-vplate').value.trim() || null,
      is_active:     document.getElementById('d-active').checked,
      is_online:     document.getElementById('d-online').checked,
    };

    if (id) {
      // Edit existing
      await db.from('drivers').update(driverPayload).eq('id', id);
    } else {
      // New driver — create user account first
      const { data: newUser, error: userError } = await db.from('users').insert({
        full_name:     name,
        username:      username,
        password_hash: password,
        role:          'driver',
        is_active:     true,
        branch_id:     document.getElementById('d-branch').value || null,
      }).select().single();

      if (userError) throw new Error('خطأ في إنشاء الحساب: ' + userError.message);

      driverPayload.user_id = newUser.id;
      await db.from('drivers').insert(driverPayload);
    }

    closeModal('driverModal');
    await init();
    showToast(id ? '✓ تم تحديث بيانات الطيار' : '✓ تم إضافة الطيار وإنشاء حسابه');
  } catch(e) {
    alert('حدث خطأ: ' + e.message);
    console.error(e);
  }
  showLoading(false);
}

// ===== ONLINE TOGGLE =====
async function toggleOnline(id, currentState) {
  showLoading(true);
  await db.from('drivers').update({
    is_online: !currentState,
    last_seen: !currentState ? null : new Date().toISOString()
  }).eq('id', id);
  await init();
  showToast(!currentState ? '🟢 الطيار أونلاين' : '⚫ الطيار أوفلاين');
}

// ===== ACTIVATE/DEACTIVATE =====
function confirmToggleActive(id, isActive, name) {
  document.getElementById('confirmTitle').textContent = isActive ? 'تعطيل الطيار' : 'تفعيل الطيار';
  document.getElementById('confirmText').innerHTML = isActive
    ? `هل تريد تعطيل الطيار <strong>${name}</strong>؟ لن يظهر في قوائم التعيين.`
    : `هل تريد تفعيل الطيار <strong>${name}</strong>؟`;
  document.getElementById('confirmActionBtn').textContent = isActive ? 'تعطيل' : 'تفعيل';
  document.getElementById('confirmActionBtn').onclick = () => toggleActive(id, isActive);
  document.getElementById('confirmModal').classList.add('open');
}

async function toggleActive(id, isActive) {
  showLoading(true);
  await db.from('drivers').update({
    is_active: !isActive,
    is_online: isActive ? false : undefined // لو بتعطل خليه أوفلاين
  }).eq('id', id);
  // Update user account too
  const driver = allDrivers.find(d => d.id === id);
  if (driver?.user_id) {
    await db.from('users').update({ is_active: !isActive }).eq('id', driver.user_id);
  }
  closeModal('confirmModal');
  await init();
  showToast(isActive ? 'تم تعطيل الطيار' : '✓ تم تفعيل الطيار');
}

// ===== UTILS =====
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }
function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:.6rem 1.25rem;border-radius:10px;font-size:.8rem;font-weight:600;z-index:400;display:none;box-shadow:0 8px 30px rgba(0,0,0,.2)'; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

init();
</script>
</body>
</html>
