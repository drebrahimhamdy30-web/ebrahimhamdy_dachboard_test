<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطيارين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body { padding: 1.25rem; overflow-y: auto; height: 100vh; background: var(--bg); }

.drivers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }

.driver-full-card {
  background: white;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 1.25rem;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .625rem;
  text-align: center;
  position: relative;
  transition: box-shadow .15s;
}
.driver-full-card:hover { box-shadow: var(--shadow-md); }

.driver-status-dot {
  position: absolute;
  top: .875rem;
  left: .875rem;
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid white;
}
.dot-active { background: var(--green); }
.dot-busy { background: var(--purple); }
.dot-offline { background: #9ca3af; }

.driver-big-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.4rem; color: white;
  position: relative;
}
.driver-orders-badge {
  position: absolute; top: -4px; left: -4px;
  width: 22px; height: 22px;
  border-radius: 50%; background: var(--primary); color: white;
  font-size: .6rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid white;
}

.driver-full-name { font-weight: 700; font-size: .875rem; color: var(--text); }
.driver-status-text { font-size: .72rem; font-weight: 600; }
.driver-stats-row { display: flex; gap: 1.25rem; margin-top: .25rem; }
.driver-stat { display: flex; flex-direction: column; align-items: center; }
.driver-stat-val { font-weight: 700; font-size: .9rem; color: var(--text); }
.driver-stat-lbl { font-size: .65rem; color: var(--text-muted); }

.driver-actions { display: flex; gap: .5rem; margin-top: .5rem; }

/* Performance table */
.perf-section { margin-bottom: 1.5rem; }
.perf-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
.perf-table th { padding: .6rem .875rem; text-align: right; font-weight: 600; color: var(--text-muted); background: var(--gray-light); border-bottom: 1px solid var(--border); font-size: .7rem; white-space: nowrap; }
.perf-table td { padding: .65rem .875rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.perf-table tr:last-child td { border-bottom: none; }

.perf-bar-wrap { display: flex; align-items: center; gap: .5rem; }
.perf-bar { height: 8px; background: var(--gray-light); border-radius: 10px; flex: 1; overflow: hidden; }
.perf-bar-fill { height: 100%; border-radius: 10px; background: var(--primary); }
.perf-pct { font-size: .7rem; font-weight: 700; color: var(--text-muted); min-width: 32px; }
</style>
</head>
<body>

<!-- Stats -->
<div class="stats-grid" style="margin-bottom:1.25rem" id="driversStats"></div>

<!-- Filter/Search -->
<div class="filters-bar" style="margin-bottom:1.25rem">
  <input type="text" class="search-input" id="driverSearch" placeholder="🔍 بحث عن طيار..." oninput="renderDrivers()">
  <select class="filter-input" id="statusFilter" onchange="renderDrivers()">
    <option value="">كل الحالات</option>
    <option value="active">متاح</option>
    <option value="busy">في رحلة</option>
    <option value="offline">غير متاح</option>
  </select>
  <button class="btn btn-primary btn-sm" onclick="openAddDriverModal()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    إضافة طيار
  </button>
</div>

<!-- Drivers Grid -->
<div class="drivers-grid" id="driversGrid">
  <div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-muted)">جاري التحميل...</div>
</div>

<!-- Performance Section -->
<div class="perf-section card">
  <div class="card-header"><span class="card-title">أداء الطيارين اليوم</span></div>
  <div class="table-wrap">
    <table class="perf-table">
      <thead>
        <tr>
          <th>الطيار</th>
          <th>طلبات نشطة</th>
          <th>تم التوصيل</th>
          <th>الإيرادات</th>
          <th>معدل الإنجاز</th>
        </tr>
      </thead>
      <tbody id="perfTable"></tbody>
    </table>
  </div>
</div>

<!-- Modal: Add Driver -->
<div class="modal-overlay" id="addDriverModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title">إضافة طيار جديد</span>
      <button class="modal-close" onclick="closeModal('addDriverModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" class="form-control" id="d-name" placeholder="اسم الطيار">
      </div>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" class="form-control" id="d-username" placeholder="username">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="text" class="form-control" id="d-password" placeholder="كلمة المرور">
      </div>
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="text" class="form-control" id="d-phone" placeholder="01xxxxxxxxx">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('addDriverModal')">إلغاء</button>
      <button class="btn btn-green" onclick="saveDriver()">إضافة</button>
    </div>
  </div>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../permissions.js"></script>
<script>
const DRIVER_COLORS = ['#1a56db','#7c3aed','#16a34a','#ea580c','#0891b2','#ca8a04','#dc2626','#0d9488','#b45309','#1e40af','#065f46','#92400e'];
let allDrivers = [], allOrders = [];

async function init() {
  const user = getCurrentUser(); if (!user) return;
  showLoading(true);
  try {
    const [driversRes, ordersRes] = await Promise.all([
      db.from('users').select('*').eq('role', 'driver').order('full_name'),
      db.from('orders').select('id, status, driver_id, total_bill_net, created_at')
    ]);
    allDrivers = driversRes.data || [];
    allOrders = ordersRes.data || [];
    renderStats();
    renderDrivers();
    renderPerformance();
  } catch(e) { console.error(e); }
  showLoading(false);
}

function getDriverStatus(driverId) {
  const active = allOrders.filter(o => o.driver_id === driverId && o.status === 'picked').length;
  if (active > 0) return 'busy';
  return 'active';
}

function renderStats() {
  const active = allDrivers.filter(d => d.is_active && getDriverStatus(d.id) === 'active').length;
  const busy = allDrivers.filter(d => d.is_active && getDriverStatus(d.id) === 'busy').length;
  const total = allDrivers.length;
  document.getElementById('driversStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--blue-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
      <div class="stat-label">إجمالي الطيارين</div>
      <div class="stat-value">${total}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--green-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="stat-label">متاحون</div>
      <div class="stat-value">${active}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:var(--purple-light)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg></div>
      <div class="stat-label">في رحلة</div>
      <div class="stat-value">${busy}</div>
    </div>`;
}

function renderDrivers() {
  const search = document.getElementById('driverSearch').value.toLowerCase();
  const statusF = document.getElementById('statusFilter').value;

  let drivers = allDrivers.filter(d => {
    if (search && !(d.full_name||'').toLowerCase().includes(search)) return false;
    if (statusF) {
      const s = getDriverStatus(d.id);
      if (statusF === 'active' && s !== 'active') return false;
      if (statusF === 'busy' && s !== 'busy') return false;
      if (statusF === 'offline' && d.is_active) return false;
    }
    return true;
  });

  const grid = document.getElementById('driversGrid');
  if (!drivers.length) {
    grid.innerHTML = '<div style="grid-column:1/-1" class="empty-state"><div class="icon">👤</div><p>لا يوجد طيارين</p></div>';
    return;
  }

  grid.innerHTML = drivers.map((d, i) => {
    const color = DRIVER_COLORS[i % DRIVER_COLORS.length];
    const status = d.is_active ? getDriverStatus(d.id) : 'offline';
    const dotClass = status === 'active' ? 'dot-active' : status === 'busy' ? 'dot-busy' : 'dot-offline';
    const statusText = status === 'active' ? 'متاح' : status === 'busy' ? 'في رحلة' : 'غير متاح';
    const statusColor = status === 'active' ? '#16a34a' : status === 'busy' ? '#7c3aed' : '#9ca3af';
    const activeOrders = allOrders.filter(o => o.driver_id === d.id && o.status === 'picked').length;
    const deliveredOrders = allOrders.filter(o => o.driver_id === d.id && ['delivered','completed'].includes(o.status)).length;
    const totalRevenue = allOrders.filter(o => o.driver_id === d.id && ['delivered','completed'].includes(o.status))
      .reduce((s, o) => s + Number(o.total_bill_net || 0), 0);

    return `
      <div class="driver-full-card">
        <div class="driver-status-dot ${dotClass}"></div>
        <div class="driver-big-avatar" style="background:${color}">
          ${(d.full_name||'?').charAt(0)}
          ${activeOrders > 0 ? `<div class="driver-orders-badge">${activeOrders}</div>` : ''}
        </div>
        <div class="driver-full-name">${d.full_name||'—'}</div>
        <div class="driver-status-text" style="color:${statusColor}">${statusText}</div>
        <div class="driver-stats-row">
          <div class="driver-stat"><span class="driver-stat-val">${activeOrders}</span><span class="driver-stat-lbl">نشط</span></div>
          <div class="driver-stat"><span class="driver-stat-val">${deliveredOrders}</span><span class="driver-stat-lbl">وصّل</span></div>
          <div class="driver-stat"><span class="driver-stat-val" style="font-size:.8rem">${totalRevenue.toLocaleString()}</span><span class="driver-stat-lbl">ج.م</span></div>
        </div>
        <div class="driver-actions">
          <button class="btn btn-outline btn-sm" onclick="toggleDriverActive('${d.id}', ${d.is_active})">
            ${d.is_active ? 'تعطيل' : 'تفعيل'}
          </button>
        </div>
      </div>`;
  }).join('');
}

function renderPerformance() {
  const tbody = document.getElementById('perfTable');
  const drivers = allDrivers.filter(d => d.is_active);

  const rows = drivers.map(d => {
    const active = allOrders.filter(o => o.driver_id === d.id && o.status === 'picked').length;
    const delivered = allOrders.filter(o => o.driver_id === d.id && ['delivered','completed'].includes(o.status)).length;
    const total = active + delivered;
    const pct = total > 0 ? Math.round((delivered / total) * 100) : 0;
    const revenue = allOrders.filter(o => o.driver_id === d.id && ['delivered','completed'].includes(o.status))
      .reduce((s, o) => s + Number(o.total_bill_net || 0), 0);
    return { d, active, delivered, revenue, pct, total };
  }).sort((a, b) => b.delivered - a.delivered);

  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><p>لا بيانات</p></td></tr>'; return; }
  const maxDelivered = Math.max(...rows.map(r => r.delivered), 1);

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td style="font-weight:600">${r.d.full_name}</td>
      <td>${r.active > 0 ? `<span class="badge badge-picked">${r.active}</span>` : '—'}</td>
      <td><span style="font-weight:700">${r.delivered}</span></td>
      <td style="font-weight:700">${r.revenue.toLocaleString('ar-EG')} ج</td>
      <td>
        <div class="perf-bar-wrap">
          <div class="perf-bar"><div class="perf-bar-fill" style="width:${(r.delivered/maxDelivered)*100}%"></div></div>
          <span class="perf-pct">${r.pct}%</span>
        </div>
      </td>
    </tr>`).join('');
}

async function toggleDriverActive(id, current) {
  showLoading(true);
  await db.from('users').update({ is_active: !current }).eq('id', id);
  await init();
}

function openAddDriverModal() {
  ['d-name','d-username','d-password','d-phone'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('addDriverModal').classList.add('open');
}

async function saveDriver() {
  const name = document.getElementById('d-name').value.trim();
  const username = document.getElementById('d-username').value.trim();
  const password = document.getElementById('d-password').value.trim();
  if (!name || !username || !password) { alert('الاسم واسم المستخدم وكلمة المرور مطلوبة'); return; }
  showLoading(true);
  try {
    await db.from('users').insert({
      full_name: name,
      username,
      password_hash: password,
      role: 'driver',
      is_active: true,
      phone: document.getElementById('d-phone').value.trim()
    });
    closeModal('addDriverModal');
    await init();
  } catch(e) { alert('حدث خطأ: ' + e.message); }
  showLoading(false);
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }

init();
</script>
</body>
</html>
