<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الطيارين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../delivery-style.css">
<style>
body{padding:1.25rem;overflow-y:auto;height:100vh;background:var(--bg)}
.drivers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.875rem}
.driver-card{background:white;border-radius:14px;border:1.5px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:all .15s;position:relative}
.driver-card:hover{box-shadow:var(--shadow-md)}
.driver-card.online{border-top:3px solid var(--green)}
.driver-card.offline{border-top:3px solid #9ca3af}
.driver-card.inactive{opacity:.55}
.online-dot{position:absolute;top:.875rem;left:.875rem;width:10px;height:10px;border-radius:50%;border:2px solid white}
.dot-online{background:var(--green);animation:onlinePulse 2s infinite}
.dot-offline{background:#9ca3af}
@keyframes onlinePulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.4)}50%{box-shadow:0 0 0 5px rgba(22,163,74,0)}}
.dc-body{padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.dc-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:white}
.dc-name{font-weight:700;font-size:.9rem;text-align:center}
.dc-phone{font-size:.72rem;color:var(--text-muted);direction:ltr}
.dc-badges{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center}
.dc-badge{font-size:.62rem;font-weight:700;padding:.15rem .5rem;border-radius:20px}
.badge-online{background:var(--green-light);color:#15803d}
.badge-offline{background:var(--gray-light);color:#6b7280}
.badge-active{background:var(--blue-light);color:#0e7490}
.badge-inactive{background:var(--red-light);color:#b91c1c}
.dc-info{width:100%;display:flex;flex-direction:column;gap:.2rem;margin-top:.25rem}
.dc-info-row{display:flex;align-items:flex-start;justify-content:space-between;font-size:.72rem;padding:.2rem 0;border-bottom:1px solid var(--gray-light);gap:.5rem}
.dc-info-row:last-child{border-bottom:none}
.dc-info-label{color:var(--text-muted);flex-shrink:0}
.dc-info-value{font-weight:600;text-align:left;word-break:break-word}
.zones-wrap{display:flex;gap:.2rem;flex-wrap:wrap;justify-content:flex-end}
.zone-tag{font-size:.55rem;font-weight:700;padding:.1rem .35rem;border-radius:10px}
.dc-footer{padding:.625rem 1rem;border-top:1px solid var(--border);display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;background:#fafafa}
.dc-btn{padding:.3rem .75rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.7rem;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .15s}
.dcb-online{background:var(--green-light);color:#15803d;border-color:#bbf7d0}
.dcb-offline{background:var(--gray-light);color:#374151;border-color:#d1d5db}
.dcb-edit{background:var(--blue-light);color:#0e7490;border-color:#a5f3fc}
.dcb-deactivate{background:var(--red-light);color:#b91c1c;border-color:#fecaca}
.dcb-activate{background:var(--green-light);color:#15803d;border-color:#bbf7d0}
.filter-chip{padding:.3rem .75rem;border-radius:20px;font-size:.72rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--text-muted);font-family:'Cairo',sans-serif;transition:all .15s}
.filter-chip.active{background:var(--primary);color:white;border-color:var(--primary)}
.stats-bar{display:flex;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap}
.stat-pill{display:flex;align-items:center;gap:.4rem;padding:.5rem 1rem;background:white;border-radius:10px;border:1px solid var(--border);font-size:.78rem;box-shadow:var(--shadow)}
.stat-pill-val{font-weight:800;font-size:1.1rem}
.type-inside{background:var(--green-light);color:#15803d}
.type-outside{background:var(--yellow-light);color:#a16207}
.type-permit{background:var(--purple-light);color:#6d28d9}
.type-hard{background:var(--red-light);color:#b91c1c}
</style>
</head>
<body>

<div class="flex-between" style="margin-bottom:1rem;flex-wrap:wrap;gap:.625rem">
  <div>
    <div style="font-size:.9rem;font-weight:700">إدارة الطيارين</div>
    <div style="font-size:.75rem;color:var(--text-muted)" id="driversCount">جاري التحميل...</div>
  </div>
  <button class="btn btn-primary" onclick="openAddModal()">+ إضافة طيار</button>
</div>

<div class="stats-bar" id="statsBar"></div>

<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem">
  <input type="text" class="search-input" id="searchInput" placeholder="🔍 بحث..." oninput="renderDrivers()" style="width:200px">
  <button class="filter-chip active" onclick="setFilter('all',this)">الكل</button>
  <button class="filter-chip" onclick="setFilter('online',this)">🟢 أونلاين</button>
  <button class="filter-chip" onclick="setFilter('offline',this)">⚫ أوفلاين</button>
  <button class="filter-chip" onclick="setFilter('inactive',this)">معطل</button>
</div>

<div class="drivers-grid" id="driversGrid">
  <div class="empty-state" style="grid-column:1/-1"><div class="icon">⏳</div><p>جاري التحميل...</p></div>
</div>

<!-- Modal: Add/Edit Driver -->
<div class="modal-overlay" id="driverModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">إضافة طيار جديد</span>
      <button class="modal-close" onclick="closeModal('driverModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="d-id">

      <div class="section-label-sm">البيانات الشخصية</div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>الاسم الكامل *</label>
          <input type="text" class="form-control" id="d-name" placeholder="الاسم الكامل">
        </div>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="text" class="form-control" id="d-phone" placeholder="01xxxxxxxxx" dir="ltr">
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>الرقم القومي</label>
          <input type="text" class="form-control" id="d-national" placeholder="14 رقم" dir="ltr">
        </div>
        <div class="form-group">
          <label>الفرع *</label>
          <select class="form-control" id="d-branch">
            <option value="">اختر الفرع...</option>
          </select>
        </div>
      </div>

      <div class="section-label-sm" style="margin-top:.75rem">الرخص</div>
      <div style="display:flex;gap:1rem;flex-wrap:wrap">
        <label class="checkbox-item" style="font-size:.82rem">
          <input type="checkbox" id="d-lic-vehicle" style="accent-color:var(--primary);width:15px;height:15px">
          <span style="font-weight:600">🚗 رخصة مركبة</span>
        </label>
        <label class="checkbox-item" style="font-size:.82rem">
          <input type="checkbox" id="d-lic-drive" style="accent-color:var(--primary);width:15px;height:15px">
          <span style="font-weight:600">📋 رخصة قيادة</span>
        </label>
      </div>

      <div class="section-label-sm" style="margin-top:.75rem">التصنيفات المغطاة</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        <label class="checkbox-item" style="font-size:.82rem;padding:.5rem .75rem;border:1.5px solid var(--border);border-radius:10px;cursor:pointer">
          <input type="checkbox" id="cov-inside" style="accent-color:#16a34a;width:15px;height:15px">
          <span style="display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:10px;border-radius:50%;background:#16a34a;flex-shrink:0"></span>داخل الزون</span>
        </label>
        <label class="checkbox-item" style="font-size:.82rem;padding:.5rem .75rem;border:1.5px solid var(--border);border-radius:10px;cursor:pointer">
          <input type="checkbox" id="cov-outside" style="accent-color:#ca8a04;width:15px;height:15px">
          <span style="display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:10px;border-radius:50%;background:#ca8a04;flex-shrink:0"></span>خارج الزون</span>
        </label>
        <label class="checkbox-item" style="font-size:.82rem;padding:.5rem .75rem;border:1.5px solid var(--border);border-radius:10px;cursor:pointer">
          <input type="checkbox" id="cov-permit" style="accent-color:#7c3aed;width:15px;height:15px">
          <span style="display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:10px;border-radius:50%;background:#7c3aed;flex-shrink:0"></span>يحتاج ترخيص</span>
        </label>
        <label class="checkbox-item" style="font-size:.82rem;padding:.5rem .75rem;border:1.5px solid var(--border);border-radius:10px;cursor:pointer">
          <input type="checkbox" id="cov-hard" style="accent-color:#dc2626;width:15px;height:15px">
          <span style="display:flex;align-items:center;gap:.3rem"><span style="width:10px;height:10px;border-radius:50%;background:#dc2626;flex-shrink:0"></span>صعب الوصول</span>
        </label>
      </div>

      <div class="section-label-sm" style="margin-top:.75rem">بيانات المركبة</div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>نوع المركبة</label>
          <select class="form-control" id="d-vtype">
            <option value="">اختر...</option>
            <option value="دراجة نارية">دراجة نارية</option>
            <option value="سيارة">سيارة</option>
            <option value="توك توك">توك توك</option>
            <option value="دراجة هوائية">دراجة هوائية</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>
        <div class="form-group">
          <label>رقم اللوحة</label>
          <input type="text" class="form-control" id="d-vplate" placeholder="أ ب ج 1234" dir="ltr">
        </div>
      </div>

      <div class="section-label-sm" style="margin-top:.75rem">بيانات الحساب</div>
      <div class="form-grid-2">
        <div class="form-group" id="usernameGroup">
          <label>اسم المستخدم *</label>
          <input type="text" class="form-control" id="d-username" placeholder="username" dir="ltr">
        </div>
        <div class="form-group" id="passwordGroup">
          <label>كلمة المرور *</label>
          <input type="text" class="form-control" id="d-password" placeholder="كلمة المرور" dir="ltr">
        </div>
      </div>
      <div class="form-group">
        <label>الإيميل (لاستعادة كلمة السر)</label>
        <input type="email" class="form-control" id="d-email" placeholder="example@mail.com" dir="ltr">
      </div>

      <div class="section-label-sm" style="margin-top:.75rem">الحالة</div>
      <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
        <label class="checkbox-item" style="font-size:.82rem">
          <input type="checkbox" id="d-active" checked style="accent-color:var(--primary);width:15px;height:15px">
          <span style="font-weight:600">طيار نشط</span>
        </label>
        <label class="checkbox-item" style="font-size:.82rem">
          <input type="checkbox" id="d-online" style="accent-color:var(--green);width:15px;height:15px">
          <span style="font-weight:600">أونلاين الآن</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('driverModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveDriver()">حفظ</button>
    </div>
  </div>
</div>

<!-- Modal: Confirm -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span class="modal-title" id="confirmTitle">تأكيد</span>
      <button class="modal-close" onclick="closeModal('confirmModal')">✕</button>
    </div>
    <div class="modal-body"><p style="font-size:.875rem" id="confirmText"></p></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('confirmModal')">إلغاء</button>
      <button class="btn btn-red" id="confirmActionBtn">تأكيد</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js?v=brand2"></script>
<script src="../permissions.js"></script>
<script>
const COLORS=['#1a56db','#7c3aed','#16a34a','#ea580c','#0891b2','#ca8a04','#dc2626','#0d9488','#b45309','#1e40af'];
const TYPE_LABELS={inside:'داخل الزون',outside:'خارج الزون',permit:'يحتاج ترخيص',hard:'صعب الوصول'};
const TYPE_CLASS={inside:'type-inside',outside:'type-outside',permit:'type-permit',hard:'type-hard'};

let allDrivers=[], allBranches=[], allRegions=[], currentFilter='all';

// CSS for section labels
const style=document.createElement('style');
style.textContent='.section-label-sm{font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem;padding-bottom:.25rem;border-bottom:1px solid var(--border)}';
document.head.appendChild(style);

async function init(){
  const user=getCurrentUser();if(!user)return;
  showLoading(true);
  try{
    // الأدمن يشوف كل الفروع؛ أي دور تاني يشوف فرعه بس
    const isAdmin = user.role==='admin';
    let userBranchId = null;
    if(!isAdmin && user.branch){
      const {data:b} = await db.from('branches').select('id').eq('name', user.branch).maybeSingle();
      userBranchId = b?.id || null;
    }

    let driversQuery = db.from('drivers').select('*,branches(name)').order('full_name');
    if(!isAdmin && userBranchId) driversQuery = driversQuery.eq('branch_id', userBranchId);

    const [dR,bR,rR,eR]=await Promise.all([
      driversQuery,
      db.from('branches').select('*').order('name'),
      db.from('regions').select('*').eq('is_active',true).order('name'),
      db.rpc('get_driver_emails')
    ]);
    allDrivers=dR.data||[];
    // إلحاق إيميل حساب كل طيار (من branch_users عبر RPC)
    const emailMap={}; (eR.data||[]).forEach(x=>{ emailMap[x.driver_id]=x.email; });
    allDrivers.forEach(d=>{ d.account_email = emailMap[d.id] || ''; });
    allBranches=bR.data||[];
    allRegions=rR.data||[];
    renderBranchSelect();
    renderStats();
    renderDrivers();
  }catch(e){console.error(e);}
  showLoading(false);
}

function renderBranchSelect(){
  const sel=document.getElementById('d-branch');
  sel.innerHTML='<option value="">اختر الفرع...</option>'+
    allBranches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
}

function renderStats(){
  const total=allDrivers.length;
  const online=allDrivers.filter(d=>d.is_online&&d.is_active).length;
  const offline=allDrivers.filter(d=>!d.is_online&&d.is_active).length;
  const inactive=allDrivers.filter(d=>!d.is_active).length;
  document.getElementById('driversCount').textContent=`${total} طيار`;
  document.getElementById('statsBar').innerHTML=`
    <div class="stat-pill"><span class="stat-pill-val">${total}</span><span class="stat-pill-lbl">إجمالي</span></div>
    <div class="stat-pill"><span class="stat-pill-val" style="color:var(--green)">${online}</span><span class="stat-pill-lbl">🟢 أونلاين</span></div>
    <div class="stat-pill"><span class="stat-pill-val" style="color:#6b7280">${offline}</span><span class="stat-pill-lbl">⚫ أوفلاين</span></div>
    <div class="stat-pill"><span class="stat-pill-val" style="color:var(--red)">${inactive}</span><span class="stat-pill-lbl">معطل</span></div>`;
}

function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderDrivers();
}

function renderDrivers(){
  const search=document.getElementById('searchInput').value.toLowerCase();
  let drivers=allDrivers.filter(d=>{
    if(search&&!(d.full_name||'').toLowerCase().includes(search)&&
       !(d.phone||'').includes(search)&&!(d.vehicle_plate||'').toLowerCase().includes(search))return false;
    if(currentFilter==='online') return d.is_online&&d.is_active;
    if(currentFilter==='offline') return !d.is_online&&d.is_active;
    if(currentFilter==='inactive') return !d.is_active;
    return true;
  });

  const grid=document.getElementById('driversGrid');
  if(!drivers.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="icon">👤</div><p>لا يوجد طيارين</p></div>';return;}

  grid.innerHTML=drivers.map((d,i)=>{
    const color=COLORS[i%COLORS.length];
    const initials=(d.full_name||'?').split(' ').slice(0,2).map(w=>w[0]).join('');
    const isOnline=d.is_online&&d.is_active;
    const branchName=d.branches?.name||'—';

    // الرخص
    const licenses=[];
    if(d.has_vehicle_license) licenses.push('🚗 رخصة مركبة');
    if(d.has_drive_license) licenses.push('📋 رخصة قيادة');

    // التصنيفات المغطاة
    const covTypes=d.covered_types||[];
    const covColors={inside:'#16a34a',outside:'#ca8a04',permit:'#7c3aed',hard:'#dc2626'};
    const covNames={inside:'داخل الزون',outside:'خارج الزون',permit:'ترخيص',hard:'صعب'};
    const regionTags=covTypes.map(t=>`<span class="zone-tag" style="background:${covColors[t]}22;color:${covColors[t]};border:1px solid ${covColors[t]}44">${covNames[t]||t}</span>`).join('');

    return `<div class="driver-card ${isOnline?'online':'offline'} ${!d.is_active?'inactive':''}">
      <div class="online-dot ${isOnline?'dot-online':'dot-offline'}"></div>
      <div class="dc-body">
        <div class="dc-avatar" style="background:${color}">${initials}</div>
        <div class="dc-name">${d.full_name}</div>
        ${d.phone?`<div class="dc-phone">${d.phone}</div>`:''}
        <div class="dc-badges">
          <span class="dc-badge ${isOnline?'badge-online':'badge-offline'}">${isOnline?'🟢 أونلاين':'⚫ أوفلاين'}</span>
          <span class="dc-badge ${d.is_active?'badge-active':'badge-inactive'}">${d.is_active?'نشط':'معطل'}</span>
        </div>
        <div class="dc-info">
          <div class="dc-info-row"><span class="dc-info-label">الفرع</span><span class="dc-info-value">${branchName}</span></div>
          ${d.vehicle_type?`<div class="dc-info-row"><span class="dc-info-label">المركبة</span><span class="dc-info-value">${d.vehicle_type}${d.vehicle_plate?' · '+d.vehicle_plate:''}</span></div>`:''}
          ${licenses.length?`<div class="dc-info-row"><span class="dc-info-label">الرخص</span><span class="dc-info-value" style="font-size:.65rem">${licenses.join(' · ')}</span></div>`:''}
          ${covTypes.length?`<div class="dc-info-row"><span class="dc-info-label">يغطي</span><div class="zones-wrap">${regionTags}</div></div>`:''}
        </div>
      </div>
      <div class="dc-footer">
        ${d.is_active?`<button class="dc-btn ${isOnline?'dcb-offline':'dcb-online'}" onclick="toggleOnline('${d.id}',${d.is_online})">${isOnline?'⚫ أوفلاين':'🟢 أونلاين'}</button>`:''}
        <button class="dc-btn dcb-edit" onclick="openEdit('${d.id}')">تعديل</button>
        <button class="dc-btn ${d.is_active?'dcb-deactivate':'dcb-activate'}" onclick="confirmToggleActive('${d.id}',${d.is_active},'${d.full_name}')">${d.is_active?'تعطيل':'تفعيل'}</button>
      </div>
    </div>`;
  }).join('');
}

// ===== ADD/EDIT =====
function openAddModal(){
  document.getElementById('modalTitle').textContent='إضافة طيار جديد';
  document.getElementById('d-id').value='';
  ['d-name','d-phone','d-national','d-username','d-password','d-vplate','d-email'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('d-branch').value='';
  document.getElementById('d-vtype').value='';
  document.getElementById('d-active').checked=true;
  document.getElementById('d-online').checked=false;
  document.getElementById('d-lic-vehicle').checked=false;
  document.getElementById('d-lic-drive').checked=false;
  document.getElementById('usernameGroup').style.display='';
  document.getElementById('passwordGroup').style.display='';
  ['cov-inside','cov-outside','cov-permit','cov-hard'].forEach(id=>document.getElementById(id).checked=false);
  document.getElementById('driverModal').classList.add('open');
}

async function openEdit(id){
  const d=allDrivers.find(x=>x.id===id);if(!d)return;
  document.getElementById('modalTitle').textContent='تعديل بيانات الطيار';
  document.getElementById('d-id').value=d.id;
  document.getElementById('d-name').value=d.full_name||'';
  document.getElementById('d-phone').value=d.phone||'';
  document.getElementById('d-national').value=d.national_id||'';
  document.getElementById('d-branch').value=d.branch_id||'';
  document.getElementById('d-vtype').value=d.vehicle_type||'';
  document.getElementById('d-vplate').value=d.vehicle_plate||'';
  document.getElementById('d-active').checked=d.is_active!==false;
  document.getElementById('d-online').checked=d.is_online||false;
  document.getElementById('d-lic-vehicle').checked=d.has_vehicle_license||false;
  document.getElementById('d-lic-drive').checked=d.has_drive_license||false;
  document.getElementById('d-username').value='';
  document.getElementById('d-password').value='';
  document.getElementById('d-email').value=d.account_email||'';
  // الطيار اللي مالوش حساب (branch_user_id فاضي) → أظهر الحقول عشان ننشئ له حساب
  const hasAccount = d.branch_user_id != null;
  document.getElementById('usernameGroup').style.display = hasAccount ? 'none' : '';
  document.getElementById('passwordGroup').style.display = hasAccount ? 'none' : '';
  // تلميح للمستخدم
  const uLabel = document.querySelector('#usernameGroup label');
  if(uLabel) uLabel.textContent = hasAccount ? 'اسم المستخدم *' : '⚠️ اسم المستخدم * (هذا الطيار لا يملك حساب دخول)';
  // تصنيفات المغطاة
  const cov=d.covered_types||[];
  document.getElementById('cov-inside').checked=cov.includes('inside');
  document.getElementById('cov-outside').checked=cov.includes('outside');
  document.getElementById('cov-permit').checked=cov.includes('permit');
  document.getElementById('cov-hard').checked=cov.includes('hard');
  document.getElementById('driverModal').classList.add('open');
}

async function saveDriver(){
  const name=document.getElementById('d-name').value.trim();
  const branchId=document.getElementById('d-branch').value;
  const username=document.getElementById('d-username').value.trim();
  const password=document.getElementById('d-password').value.trim();
  const id=document.getElementById('d-id').value;
  if(!name){alert('الاسم مطلوب');return;}
  if(!branchId){alert('الفرع مطلوب');return;}
  // لطيار جديد أو طيار قديم مالوش حساب → لازم بيانات دخول
    const editingNoAccount = id && document.getElementById('usernameGroup').style.display !== 'none';
    if((!id || editingNoAccount) && (!username||!password)){alert('اسم المستخدم وكلمة المرور مطلوبان');return;}

  const coveredTypes=['inside','outside','permit','hard'].filter(t=>document.getElementById(`cov-${t}`).checked);

  showLoading(true);
  try{
    const { data, error } = await db.rpc('manager_upsert_driver', {
      p_driver_id: id || null,
      p_full_name: name,
      p_phone: document.getElementById('d-phone').value.trim() || null,
      p_national_id: document.getElementById('d-national').value.trim() || null,
      p_branch_id: branchId,
      p_username: username || null,
      p_password: password || null,
      p_vehicle_type: document.getElementById('d-vtype').value || null,
      p_vehicle_plate: document.getElementById('d-vplate').value.trim() || null,
      p_is_active: document.getElementById('d-active').checked,
      p_is_online: document.getElementById('d-online').checked,
      p_has_vehicle_license: document.getElementById('d-lic-vehicle').checked,
      p_has_drive_license: document.getElementById('d-lic-drive').checked,
      p_covered_types: coveredTypes,
      p_email: document.getElementById('d-email').value.trim() || null
    });

    if (error || (data && data.success === false)) {
      throw new Error(error?.message || data?.error);
    }

    closeModal('driverModal');
    await init();
    showToast(id?'✓ تم تحديث بيانات الطيار':'✓ تم إضافة الطيار');
  }catch(e){alert('خطأ: '+e.message);}
  showLoading(false);
}

async function toggleOnline(id,current){
  showLoading(true);
  await db.from('drivers').update({is_online:!current,last_seen:current?new Date().toISOString():null}).eq('id',id);
  await init();
  showToast(!current?'🟢 الطيار أونلاين':'⚫ الطيار أوفلاين');
}

function confirmToggleActive(id,isActive,name){
  document.getElementById('confirmTitle').textContent=isActive?'تعطيل الطيار':'تفعيل الطيار';
  document.getElementById('confirmText').innerHTML=isActive?`هل تريد تعطيل <strong>${name}</strong>؟`:`هل تريد تفعيل <strong>${name}</strong>؟`;
  document.getElementById('confirmActionBtn').textContent=isActive?'تعطيل':'تفعيل';
  document.getElementById('confirmActionBtn').onclick=()=>toggleActive(id,isActive);
  document.getElementById('confirmModal').classList.add('open');
}

async function toggleActive(id,isActive){
  showLoading(true);
  await db.rpc('manager_toggle_driver', { p_driver_id: id, p_is_active: !isActive });
  closeModal('confirmModal');
  await init();
  showToast(isActive?'تم تعطيل الطيار':'✓ تم تفعيل الطيار');
}

function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
function showLoading(show){document.getElementById('loadingOverlay').classList.toggle('show',show);}
function showToast(msg){
  let t=document.getElementById('_t');
  if(!t){t=document.createElement('div');t.id='_t';t.style.cssText='position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:.6rem 1.25rem;border-radius:10px;font-size:.8rem;font-weight:600;z-index:999;display:none';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);
}
init();
</script>
</body>
