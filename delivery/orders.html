<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الطلبات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-dark:#1344b0;
  --green:#16a34a;--green-light:#dcfce7;
  --yellow:#ca8a04;--yellow-light:#fef9c3;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#0891b2;--blue-light:#ecfeff;
  --gray:#6b7280;--gray-light:#f3f4f6;
  --text:#111827;--text-muted:#6b7280;
  --border:#e5e7eb;--bg:#f1f5f9;--white:#fff;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* Top bar */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:.5rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.topbar-right{display:flex;align-items:center;gap:.5rem}
.topbar-left{display:flex;align-items:center;gap:.5rem}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .85rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}
.btn-green{background:var(--green);color:white}
.btn-outline{background:white;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:var(--gray-light)}
.btn-red{background:var(--red);color:white}
.btn-sm{padding:.3rem .65rem;font-size:.72rem}

/* Stats bar */
.statsbar{background:var(--white);border-bottom:1px solid var(--border);padding:.4rem 1rem;display:flex;align-items:center;gap:.5rem;overflow-x:auto;flex-wrap:nowrap}
.stat-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .75rem;border-radius:20px;font-size:.72rem;font-weight:600;cursor:pointer;border:2px solid transparent;white-space:nowrap;transition:all .15s}
.stat-pill.active{border-color:var(--primary)}
.stat-pill .count{font-weight:700;font-size:.8rem}
.sp-all{background:#f0f9ff;color:#0369a1}
.sp-green{background:var(--green-light);color:#15803d}
.sp-purple{background:var(--purple-light);color:#6d28d9}
.sp-yellow{background:var(--yellow-light);color:#a16207}
.sp-red{background:var(--red-light);color:#b91c1c}
.sp-blue{background:var(--blue-light);color:#0e7490}
.sp-gray{background:var(--gray-light);color:#374151}

/* Drivers row */
.drivers-section{background:var(--white);border-bottom:1px solid var(--border);padding:.6rem 1rem}
.drivers-label{font-size:.72rem;color:var(--text-muted);font-weight:600;margin-bottom:.5rem}
.drivers-row{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem}
.driver-card{display:flex;flex-direction:column;align-items:center;gap:.2rem;cursor:pointer;min-width:64px;padding:.3rem .4rem;border-radius:10px;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.driver-card:hover{background:var(--gray-light)}
.driver-card.selected{border-color:var(--primary);background:var(--primary-light,#e8f0fe)}
.driver-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:white;position:relative;flex-shrink:0}
.driver-avatar .badge{position:absolute;top:-4px;left:-4px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:white;font-size:.6rem;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid white}
.driver-name{font-size:.65rem;color:var(--text);font-weight:600;text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.driver-status{font-size:.6rem;font-weight:600}
.da-green{background:#16a34a}
.da-purple{background:#7c3aed}
.da-yellow{background:#ca8a04}
.da-gray{background:#9ca3af}

/* Main content */
.main-content{flex:1;padding:.75rem 1rem;overflow:hidden}

/* Tabs */
.tabs-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
.tab-btn{padding:.35rem .85rem;border-radius:20px;font-size:.75rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--text-muted);transition:all .15s;display:flex;align-items:center;gap:.3rem}
.tab-btn.active{background:var(--primary);color:white;border-color:var(--primary)}
.tab-badge{background:rgba(255,255,255,0.3);padding:.1rem .4rem;border-radius:10px;font-size:.65rem}
.tab-btn:not(.active) .tab-badge{background:var(--gray-light);color:var(--text-muted)}

/* Orders grid */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem;overflow-y:auto;max-height:calc(100vh - 280px)}

/* Order card */
.order-card{background:white;border-radius:10px;border:1.5px solid var(--border);padding:.6rem;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.order-card:hover{border-color:var(--primary);box-shadow:0 2px 12px rgba(26,86,219,0.1)}
.order-card.status-pending{border-right:4px solid var(--green)}
.order-card.status-postponed{border-right:4px solid var(--purple)}
.order-card.status-stopped{border-right:4px solid var(--red)}
.order-card.status-picked{border-right:4px solid var(--blue)}
.order-card.status-delivered{border-right:4px solid var(--yellow)}
.order-card.status-late{border-right:4px solid var(--red);background:#fff8f8}

.order-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.order-no{font-size:.72rem;font-weight:700;color:var(--primary)}
.order-time{font-size:.65rem;color:var(--text-muted)}
.order-timer{font-size:.72rem;font-weight:700;padding:.1rem .4rem;border-radius:6px}
.timer-green{background:var(--green-light);color:#15803d}
.timer-red{background:var(--red-light);color:#b91c1c}
.timer-yellow{background:var(--yellow-light);color:#a16207}

.order-customer{font-size:.78rem;font-weight:600;color:var(--text);margin-bottom:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-address{font-size:.68rem;color:var(--text-muted);margin-bottom:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-region{font-size:.65rem;font-weight:600;color:var(--blue);background:var(--blue-light);padding:.1rem .4rem;border-radius:6px;display:inline-block;margin-bottom:.35rem}

.order-footer{display:flex;align-items:center;justify-content:space-between;margin-top:.35rem;padding-top:.35rem;border-top:1px solid var(--gray-light)}
.order-amount{font-size:.75rem;font-weight:700;color:var(--text)}
.order-type{font-size:.65rem;font-weight:600;padding:.1rem .4rem;border-radius:6px}
.type-cash{background:#fef3c7;color:#92400e}
.type-visa{background:#dbeafe;color:#1e40af}
.order-status-badge{font-size:.62rem;font-weight:600;padding:.1rem .4rem;border-radius:6px}
.sb-pending{background:var(--green-light);color:#15803d}
.sb-picked{background:var(--blue-light);color:#0e7490}
.sb-delivered{background:var(--yellow-light);color:#a16207}
.sb-postponed{background:var(--purple-light);color:#6d28d9}
.sb-cancelled{background:var(--red-light);color:#b91c1c}
.sb-completed{background:var(--gray-light);color:#374151}

.order-driver{font-size:.65rem;color:var(--text-muted);margin-top:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.order-actions{display:flex;gap:.25rem;margin-top:.35rem;flex-wrap:wrap}
.action-btn{padding:.2rem .45rem;border-radius:6px;font-size:.62rem;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s}
.ab-assign{background:var(--green-light);color:#15803d;border-color:#bbf7d0}.ab-assign:hover{background:#bbf7d0}
.ab-postpone{background:var(--purple-light);color:#6d28d9;border-color:#ddd6fe}.ab-postpone:hover{background:#ddd6fe}
.ab-urgent{background:var(--red-light);color:#b91c1c;border-color:#fecaca}.ab-urgent:hover{background:#fecaca}
.ab-delivered{background:var(--yellow-light);color:#a16207;border-color:#fde68a}.ab-delivered:hover{background:#fde68a}
.ab-cancel{background:var(--gray-light);color:#374151;border-color:#d1d5db}.ab-cancel:hover{background:#d1d5db}
.ab-edit{background:var(--blue-light);color:#0e7490;border-color:#a5f3fc}.ab-edit:hover{background:#a5f3fc}

/* Empty */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted);grid-column:1/-1}
.empty-state svg{width:48px;height:48px;margin:0 auto 1rem;opacity:.3;display:block}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-start;justify-content:center;padding-top:5vh}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:14px;width:90%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.modal-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:1}
.modal-title{font-weight:700;font-size:.9rem}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:.25rem;border-radius:6px;font-size:1.1rem}
.modal-body{padding:1.25rem}
.modal-footer{padding:.875rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:.5rem;justify-content:flex-end;position:sticky;bottom:0;background:white}
.form-group{margin-bottom:.875rem}
.form-group label{display:block;font-size:.78rem;font-weight:600;margin-bottom:.35rem;color:var(--text)}
.form-control{width:100%;height:36px;padding:0 .75rem;border:1px solid var(--border);border-radius:8px;font-family:'Cairo',sans-serif;font-size:.82rem;color:var(--text);outline:none}
.form-control:focus{border-color:var(--primary)}
textarea.form-control{height:70px;padding:.5rem .75rem;resize:vertical}

/* Detail modal */
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--gray-light);font-size:.8rem}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-muted);font-weight:500}
.detail-value{font-weight:600;color:var(--text);text-align:left}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.7);z-index:300;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Refresh indicator */
.refresh-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-right" style="gap:.75rem">
    <span style="font-weight:700;font-size:.9rem;color:var(--text)">إدارة الطلبات</span>
    <div class="refresh-dot" title="تحديث تلقائي كل دقيقة"></div>
  </div>
  <div class="topbar-left">
    <button class="btn btn-green" onclick="openAddOrderModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      طلب يدوي
    </button>
    <button class="btn btn-outline" onclick="loadData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      تحديث
    </button>
    <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      الرئيسية
    </button>
  </div>
</div>

<!-- Stats bar -->
<div class="statsbar" id="statsbar">
  <div class="stat-pill sp-all active" onclick="filterByStatus('')" data-status="">
    كل الطلبات <span class="count" id="cnt-all">0</span>
  </div>
  <div class="stat-pill sp-green" onclick="filterByStatus('pending')" data-status="pending">
    جاهز <span class="count" id="cnt-pending">0</span>
  </div>
  <div class="stat-pill sp-blue" onclick="filterByStatus('picked')" data-status="picked">
    في رحلة <span class="count" id="cnt-picked">0</span>
  </div>
  <div class="stat-pill sp-yellow" onclick="filterByStatus('delivered')" data-status="delivered">
    تم التوصيل <span class="count" id="cnt-delivered">0</span>
  </div>
  <div class="stat-pill sp-purple" onclick="filterByStatus('postponed')" data-status="postponed">
    مؤجل <span class="count" id="cnt-postponed">0</span>
  </div>
  <div class="stat-pill sp-red" onclick="filterByStatus('cancelled')" data-status="cancelled">
    ملغي <span class="count" id="cnt-cancelled">0</span>
  </div>
  <div class="stat-pill sp-gray" onclick="filterByStatus('completed')" data-status="completed">
    مكتمل <span class="count" id="cnt-completed">0</span>
  </div>
  <div class="stat-pill sp-red" onclick="filterByLate()" data-status="late" style="margin-right:auto">
    ⚠️ متأخر <span class="count" id="cnt-late">0</span>
  </div>
</div>

<!-- Drivers row -->
<div class="drivers-section">
  <div class="drivers-label">الطيارين</div>
  <div class="drivers-row" id="driversRow">
    <div style="font-size:.75rem;color:var(--text-muted)">جاري التحميل...</div>
  </div>
</div>

<!-- Main -->
<div class="main-content">
  <div class="tabs-row" id="tabsRow">
    <button class="tab-btn active" onclick="setTab('all', this)">كل الطلبات <span class="tab-badge" id="tab-cnt-all">0</span></button>
    <button class="tab-btn" onclick="setTab('pending', this)">جاهز <span class="tab-badge" id="tab-cnt-pending">0</span></button>
    <button class="tab-btn" onclick="setTab('picked', this)">في رحلة <span class="tab-badge" id="tab-cnt-picked">0</span></button>
    <button class="tab-btn" onclick="setTab('delivered', this)">تم التوصيل <span class="tab-badge" id="tab-cnt-delivered">0</span></button>
    <button class="tab-btn" onclick="setTab('postponed', this)">مؤجل <span class="tab-badge" id="tab-cnt-postponed">0</span></button>
    <button class="tab-btn" onclick="setTab('late', this)">متأخر <span class="tab-badge" id="tab-cnt-late">0</span></button>
    <input type="text" placeholder="بحث..." id="searchInput" oninput="renderOrders()"
      style="margin-right:auto;height:32px;padding:0 .75rem;border:1px solid var(--border);border-radius:20px;font-family:'Cairo',sans-serif;font-size:.78rem;outline:none;width:160px">
  </div>
  <div class="orders-grid" id="ordersGrid">
    <div class="empty-state"><div style="font-size:2rem">⏳</div><p>جاري تحميل الطلبات...</p></div>
  </div>
</div>

<!-- Modal: Order Detail / Actions -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="orderModalTitle">تفاصيل الطلب</span>
      <button class="modal-close" onclick="closeModal('orderModal')">✕</button>
    </div>
    <div class="modal-body" id="orderModalBody"></div>
    <div class="modal-footer" id="orderModalFooter"></div>
  </div>
</div>

<!-- Modal: Assign Driver -->
<div class="modal-overlay" id="assignModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title">تعيين طيار</span>
      <button class="modal-close" onclick="closeModal('assignModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="assignOrderId">
      <div class="form-group">
        <label>اختر الطيار</label>
        <select class="form-control" id="assignDriverSelect"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('assignModal')">إلغاء</button>
      <button class="btn btn-green" onclick="confirmAssign()">تعيين</button>
    </div>
  </div>
</div>

<!-- Modal: Postpone -->
<div class="modal-overlay" id="postponeModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title">تأجيل الطلب</span>
      <button class="modal-close" onclick="closeModal('postponeModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="postponeOrderId">
      <div class="form-group">
        <label>وقت التأجيل</label>
        <input type="datetime-local" class="form-control" id="postponeTime">
      </div>
      <div class="form-group">
        <label>سبب التأجيل</label>
        <textarea class="form-control" id="postponeReason" placeholder="أدخل سبب التأجيل..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('postponeModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="confirmPostpone()">تأجيل</button>
    </div>
  </div>
</div>

<!-- Modal: Edit Region -->
<div class="modal-overlay" id="editModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title">تعديل الطلب</span>
      <button class="modal-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editOrderId">
      <div class="form-group">
        <label>المنطقة</label>
        <input type="text" class="form-control" id="editRegion" placeholder="أدخل المنطقة">
      </div>
      <div class="form-group">
        <label>ملاحظات</label>
        <textarea class="form-control" id="editNotes" placeholder="ملاحظات..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="confirmEdit()">حفظ</button>
    </div>
  </div>
</div>

<!-- Modal: Add Manual Order -->
<div class="modal-overlay" id="addOrderModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">إضافة طلب يدوي</span>
      <button class="modal-close" onclick="closeModal('addOrderModal')">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="form-group">
          <label>رقم الفاتورة</label>
          <input type="text" class="form-control" id="mo-billno" placeholder="رقم الفاتورة">
        </div>
        <div class="form-group">
          <label>نوع الدفع</label>
          <select class="form-control" id="mo-billtype">
            <option value="كاش">كاش</option>
            <option value="فيزا">فيزا</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>اسم العميل</label>
        <input type="text" class="form-control" id="mo-custname" placeholder="اسم العميل">
      </div>
      <div class="form-group">
        <label>عنوان العميل</label>
        <input type="text" class="form-control" id="mo-address" placeholder="العنوان">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
        <div class="form-group">
          <label>المنطقة</label>
          <input type="text" class="form-control" id="mo-region" placeholder="المنطقة">
        </div>
        <div class="form-group">
          <label>المبلغ</label>
          <input type="number" class="form-control" id="mo-amount" placeholder="0">
        </div>
      </div>
      <div class="form-group">
        <label>ملاحظات</label>
        <textarea class="form-control" id="mo-notes" placeholder="ملاحظات..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('addOrderModal')">إلغاء</button>
      <button class="btn btn-green" onclick="saveManualOrder()">إضافة</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

let currentDriver = null;
let isLateFilter = false;
let currentTab = 'all';
let currentUser = null;

const LATE_MINUTES = 30;

window.addEventListener('DOMContentLoaded', async () => {
  const stored = sessionStorage.getItem('delivery_user');
  if (!stored) { window.location.href = 'auth.html'; return; }
  currentUser = JSON.parse(stored);
  await loadData();
  setInterval(loadData, 60000);
});

async function loadData() {
  showLoading(true);
  try {
    const [ordersRes, driversRes] = await Promise.all([
      db.from('orders').select('*').order('created_at', {ascending: false}),
      db.from('users').select('*').eq('role', 'driver').eq('is_active', true)
    ]);
    allOrders = ordersRes.data || [];
    allDrivers = driversRes.data || [];
    updateStats();
    renderDrivers();
    renderOrders();
  } catch(e) { console.error(e); }
  showLoading(false);
}

function updateStats() {
  const now = new Date();
  const lateOrders = allOrders.filter(o => isLate(o));
  document.getElementById('cnt-all').textContent = allOrders.length;
  document.getElementById('cnt-pending').textContent = allOrders.filter(o=>o.status==='pending').length;
  document.getElementById('cnt-picked').textContent = allOrders.filter(o=>o.status==='picked').length;
  document.getElementById('cnt-delivered').textContent = allOrders.filter(o=>o.status==='delivered').length;
  document.getElementById('cnt-postponed').textContent = allOrders.filter(o=>o.status==='postponed').length;
  document.getElementById('cnt-cancelled').textContent = allOrders.filter(o=>o.status==='cancelled').length;
  document.getElementById('cnt-completed').textContent = allOrders.filter(o=>o.status==='completed').length;
  document.getElementById('cnt-late').textContent = lateOrders.length;
  document.getElementById('tab-cnt-all').textContent = allOrders.length;
  document.getElementById('tab-cnt-pending').textContent = allOrders.filter(o=>o.status==='pending').length;
  document.getElementById('tab-cnt-picked').textContent = allOrders.filter(o=>o.status==='picked').length;
  document.getElementById('tab-cnt-delivered').textContent = allOrders.filter(o=>o.status==='delivered').length;
  document.getElementById('tab-cnt-postponed').textContent = allOrders.filter(o=>o.status==='postponed').length;
  document.getElementById('tab-cnt-late').textContent = lateOrders.length;
}

function isLate(order) {
  if (['completed','cancelled','delivered'].includes(order.status)) return false;
  const created = new Date(order.created_at);
  const diff = (new Date() - created) / 60000;
  return diff > LATE_MINUTES;
}

function getElapsedTime(dateStr) {
  if (!dateStr) return '—';
  const diff = Math.floor((new Date() - new Date(dateStr)) / 60000);
  if (diff < 60) return diff + ' د';
  return Math.floor(diff/60) + ':' + String(diff%60).padStart(2,'0');
}

function renderDrivers() {
  const row = document.getElementById('driversRow');
  if (!allDrivers.length) { row.innerHTML = '<div style="font-size:.75rem;color:var(--text-muted)">لا يوجد طيارين</div>'; return; }

  const driverOrders = {};
  allDrivers.forEach(d => { driverOrders[d.id] = {active:[], delivered:[]}; });
  allOrders.forEach(o => {
    if (o.driver_id && driverOrders[o.driver_id]) {
      if (['picked'].includes(o.status)) driverOrders[o.driver_id].active.push(o);
      if (['delivered','completed'].includes(o.status)) driverOrders[o.driver_id].delivered.push(o);
    }
  });

  row.innerHTML = allDrivers.map(d => {
    const active = driverOrders[d.id]?.active.length || 0;
    const delivered = driverOrders[d.id]?.delivered.length || 0;
    let colorClass = 'da-green', statusLabel = 'متاح';
    if (active > 0 && delivered < active) { colorClass = 'da-purple'; statusLabel = active + ' طلب'; }
    else if (active > 0 && delivered >= active) { colorClass = 'da-yellow'; statusLabel = 'وصّل'; }
    const initials = d.full_name?.split(' ').slice(0,2).map(w=>w[0]).join('') || 'D';
    const isSelected = currentDriver === d.id;
    return `
      <div class="driver-card ${isSelected?'selected':''}" onclick="filterByDriver('${d.id}')">
        <div class="driver-avatar ${colorClass}">
          ${initials}
          ${active > 0 ? `<div class="badge">${active}</div>` : ''}
        </div>
        <div class="driver-name">${d.full_name?.split(' ').slice(0,2).join(' ') || '—'}</div>
        <div class="driver-status" style="color:${colorClass==='da-green'?'#16a34a':colorClass==='da-purple'?'#7c3aed':'#ca8a04'}">${statusLabel}</div>
      </div>`;
  }).join('');
}

function renderOrders() {
  const search = document.getElementById('searchInput')?.value?.toLowerCase() || '';
  let orders = [...allOrders];

  if (isLateFilter) orders = orders.filter(o => isLate(o));
  else if (currentTab !== 'all') orders = orders.filter(o => o.status === currentTab);
  if (currentDriver) orders = orders.filter(o => o.driver_id === currentDriver);
  if (search) orders = orders.filter(o =>
    (o.bill_no||'').toLowerCase().includes(search) ||
    (o.customer_name||'').toLowerCase().includes(search) ||
    (o.cust_region||'').toLowerCase().includes(search) ||
    (o.cust_code||'').toLowerCase().includes(search)
  );

  const grid = document.getElementById('ordersGrid');
  if (!orders.length) {
    grid.innerHTML = `<div class="empty-state"><div style="font-size:2.5rem">📭</div><p>لا توجد طلبات</p></div>`;
    return;
  }

  grid.innerHTML = orders.map(o => {
    const late = isLate(o);
    const elapsed = getElapsedTime(o.created_at);
    const timerClass = late ? 'timer-red' : (parseInt(elapsed) > 20 ? 'timer-yellow' : 'timer-green');
    const cardClass = late ? 'status-late' : `status-${o.status}`;
    const typeClass = (o.bill_type||'').includes('فيزا') || (o.bill_type||'').includes('visa') ? 'type-visa' : 'type-cash';
    const statusLabels = {pending:'جاهز',picked:'في رحلة',delivered:'وصّل',completed:'مكتمل',postponed:'مؤجل',cancelled:'ملغي'};
    const sbClass = `sb-${o.status}`;

    return `
      <div class="order-card ${cardClass}" onclick="openOrderDetail('${o.id}')">
        <div class="order-header">
          <span class="order-no">${o.bill_no || o.id?.slice(0,8)}</span>
          <span class="order-timer ${timerClass}">${elapsed}</span>
        </div>
        <div class="order-customer">${o.customer_name || '—'}</div>
        <div class="order-address">${o.customer_address || '—'}</div>
        ${o.cust_region ? `<span class="order-region">${o.cust_region}</span>` : ''}
        <div class="order-footer">
          <span class="order-amount">${(o.total_bill_net||o.amount||0).toLocaleString()} ج.م</span>
          <span class="order-type ${typeClass}">${o.bill_type||'كاش'}</span>
          <span class="order-status-badge ${sbClass}">${statusLabels[o.status]||o.status}</span>
        </div>
        ${o.deliveryman ? `<div class="order-driver">🚗 ${o.deliveryman}</div>` : ''}
        <div class="order-actions" onclick="event.stopPropagation()">
          ${o.status==='pending'?`<button class="action-btn ab-assign" onclick="openAssign('${o.id}')">تعيين</button>`:''}
          ${['pending','postponed'].includes(o.status)?`<button class="action-btn ab-postpone" onclick="openPostpone('${o.id}')">تأجيل</button>`:''}
          ${o.status==='pending'?`<button class="action-btn ab-urgent" onclick="markUrgent('${o.id}')">عاجل</button>`:''}
          ${o.status==='picked'?`<button class="action-btn ab-delivered" onclick="changeStatus('${o.id}','delivered')">وصّل</button>`:''}
          <button class="action-btn ab-edit" onclick="openEdit('${o.id}')">تعديل</button>
          ${!['completed','cancelled'].includes(o.status)?`<button class="action-btn ab-cancel" onclick="changeStatus('${o.id}','cancelled')">إلغاء</button>`:''}
        </div>
      </div>`;
  }).join('');
}

function filterByStatus(status) {
  currentStatus = status;
  currentTab = status || 'all';
  isLateFilter = false;
  document.querySelectorAll('.stat-pill').forEach(p => p.classList.toggle('active', p.dataset.status === status));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  renderOrders();
}

function filterByLate() {
  isLateFilter = true;
  currentTab = 'late';
  document.querySelectorAll('.stat-pill').forEach(p => p.classList.toggle('active', p.dataset.status === 'late'));
  renderOrders();
}

function filterByDriver(driverId) {
  currentDriver = currentDriver === driverId ? null : driverId;
  renderDrivers();
  renderOrders();
}

function setTab(tab, el) {
  currentTab = tab;
  isLateFilter = tab === 'late';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderOrders();
}

function openOrderDetail(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  const statusLabels = {pending:'جاهز',picked:'في رحلة',delivered:'وصّل',completed:'مكتمل',postponed:'مؤجل',cancelled:'ملغي'};
  document.getElementById('orderModalTitle').textContent = `طلب #${o.bill_no||id.slice(0,8)}`;
  document.getElementById('orderModalBody').innerHTML = `
    <div class="detail-row"><span class="detail-label">رقم الفاتورة</span><span class="detail-value">${o.bill_no||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">العميل</span><span class="detail-value">${o.customer_name||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">العنوان</span><span class="detail-value">${o.customer_address||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">المنطقة</span><span class="detail-value">${o.cust_region||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">المبلغ</span><span class="detail-value">${(o.total_bill_net||0).toLocaleString()} ج.م</span></div>
    <div class="detail-row"><span class="detail-label">نوع الدفع</span><span class="detail-value">${o.bill_type||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">الحالة</span><span class="detail-value">${statusLabels[o.status]||o.status}</span></div>
    <div class="detail-row"><span class="detail-label">الطيار</span><span class="detail-value">${o.deliveryman||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">عدد الأصناف</span><span class="detail-value">${o.count_of_items||0}</span></div>
    <div class="detail-row"><span class="detail-label">رصيد العميل</span><span class="detail-value">${o.current_customer_balance||0} ج.م</span></div>
    <div class="detail-row"><span class="detail-label">ملاحظات</span><span class="detail-value">${o.notes||'—'}</span></div>
    <div class="detail-row"><span class="detail-label">تاريخ الطلب</span><span class="detail-value">${o.bill_date ? new Date(o.bill_date).toLocaleString('ar-EG') : '—'}</span></div>
  `;
  document.getElementById('orderModalFooter').innerHTML = `
    <button class="btn btn-outline btn-sm" onclick="closeModal('orderModal')">إغلاق</button>
    ${o.status==='pending'?`<button class="btn btn-green btn-sm" onclick="closeModal('orderModal');openAssign('${o.id}')">تعيين طيار</button>`:''}
    ${o.status==='picked'?`<button class="btn btn-sm" style="background:#ca8a04;color:white" onclick="changeStatus('${o.id}','delivered');closeModal('orderModal')">تم التوصيل</button>`:''}
  `;
  document.getElementById('orderModal').classList.add('open');
}

function openAssign(orderId) {
  document.getElementById('assignOrderId').value = orderId;
  const sel = document.getElementById('assignDriverSelect');
  sel.innerHTML = allDrivers.map(d => `<option value="${d.id}">${d.full_name}</option>`).join('');
  document.getElementById('assignModal').classList.add('open');
}

async function confirmAssign() {
  const orderId = document.getElementById('assignOrderId').value;
  const driverId = document.getElementById('assignDriverSelect').value;
  const driver = allDrivers.find(d => d.id === driverId);
  showLoading(true);
  await db.from('orders').update({
    driver_id: driverId,
    deliveryman: driver?.full_name,
    status: 'picked',
    updated_at: new Date().toISOString()
  }).eq('id', orderId);
  closeModal('assignModal');
  await loadData();
}

function openPostpone(orderId) {
  document.getElementById('postponeOrderId').value = orderId;
  const now = new Date();
  now.setHours(now.getHours() + 1);
  document.getElementById('postponeTime').value = now.toISOString().slice(0,16);
  document.getElementById('postponeReason').value = '';
  document.getElementById('postponeModal').classList.add('open');
}

async function confirmPostpone() {
  const orderId = document.getElementById('postponeOrderId').value;
  const time = document.getElementById('postponeTime').value;
  const reason = document.getElementById('postponeReason').value;
  showLoading(true);
  await db.from('orders').update({
    status: 'postponed',
    notes: reason,
    updated_at: new Date().toISOString()
  }).eq('id', orderId);
  closeModal('postponeModal');
  await loadData();
}

function openEdit(orderId) {
  const o = allOrders.find(x => x.id === orderId);
  if (!o) return;
  document.getElementById('editOrderId').value = orderId;
  document.getElementById('editRegion').value = o.cust_region || '';
  document.getElementById('editNotes').value = o.notes || '';
  document.getElementById('editModal').classList.add('open');
}

async function confirmEdit() {
  const orderId = document.getElementById('editOrderId').value;
  const region = document.getElementById('editRegion').value;
  const notes = document.getElementById('editNotes').value;
  showLoading(true);
  await db.from('orders').update({cust_region: region, notes, updated_at: new Date().toISOString()}).eq('id', orderId);
  closeModal('editModal');
  await loadData();
}

async function markUrgent(orderId) {
  if (!confirm('هل تريد تحديد هذا الطلب كعاجل؟')) return;
  showLoading(true);
  await db.from('orders').update({notes: '🚨 عاجل', updated_at: new Date().toISOString()}).eq('id', orderId);
  await loadData();
}

async function changeStatus(orderId, status) {
  const labels = {delivered:'تم التوصيل',cancelled:'إلغاء الطلب'};
  if (!confirm(`هل تريد ${labels[status]||'تغيير الحالة'}؟`)) return;
  showLoading(true);
  await db.from('orders').update({status, updated_at: new Date().toISOString()}).eq('id', orderId);
  await loadData();
}

function openAddOrderModal() {
  document.getElementById('addOrderModal').classList.add('open');
}

async function saveManualOrder() {
  const billNo = document.getElementById('mo-billno').value.trim();
  const custName = document.getElementById('mo-custname').value.trim();
  if (!billNo || !custName) { alert('رقم الفاتورة واسم العميل مطلوبان'); return; }
  showLoading(true);
  await db.from('orders').insert({
    bill_no: billNo,
    bill_type: document.getElementById('mo-billtype').value,
    customer_name: custName,
    customer_address: document.getElementById('mo-address').value,
    cust_region: document.getElementById('mo-region').value,
    total_bill_net: parseFloat(document.getElementById('mo-amount').value) || 0,
    notes: document.getElementById('mo-notes').value,
    status: 'pending',
    branch_id: currentUser?.branch_id
  });
  closeModal('addOrderModal');
  await loadData();
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('open'); }));
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }
</script>
</body>
</html>
