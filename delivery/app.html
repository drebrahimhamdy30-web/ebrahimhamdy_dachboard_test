<html lang="ar" dir="rtl">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-dark:#1344b0;--primary-light:#e8f0fe;
  --green:#16a34a;--green-light:#dcfce7;
  --yellow:#ca8a04;--yellow-light:#fef9c3;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#0891b2;--blue-light:#ecfeff;
  --gray:#6b7280;--gray-light:#f3f4f6;
  --text:#111827;--text-muted:#6b7280;--text-light:#9ca3af;
  --border:#e5e7eb;--bg:#f1f5f9;--white:#fff;
  --sidebar-w:260px;--rail-w:72px;--header-h:56px;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow:hidden}

.sidebar{
  width:var(--sidebar-w);background:var(--white);border-left:1.5px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:fixed;right:0;top:0;z-index:100;
  box-shadow:2px 0 12px rgba(0,0,0,.04);
}
.sidebar-logo{padding:1.1rem 1.25rem;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:.75rem}
.logo-icon{width:40px;height:40px;background:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{fill:white;width:21px;height:21px}
.logo-text{font-weight:800;font-size:1.05rem;color:var(--text);line-height:1.25}
.logo-sub{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-top:.1rem}
.sidebar-nav{flex:1;padding:.75rem 0;overflow-y:auto}
.nav-section-label{padding:.9rem 1.25rem .35rem;font-size:.72rem;color:var(--primary);font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem;cursor:pointer;font-size:.92rem;font-weight:600;color:var(--text);border:none;background:none;width:100%;text-align:right;border-radius:0;transition:all .15s;position:relative}
.nav-item:hover{background:var(--gray-light)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:800}
.nav-item.active::before{content:'';position:absolute;right:0;top:15%;height:70%;width:4px;background:var(--primary);border-radius:4px 0 0 4px}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.55}
.nav-badge{margin-right:auto;background:var(--red);color:white;font-size:.68rem;font-weight:800;padding:.15rem .5rem;border-radius:10px;min-width:20px;text-align:center}
.sidebar-footer{padding:1.1rem 1.25rem;border-top:1.5px solid var(--border)}
.user-card{display:flex;align-items:center;gap:.75rem;margin-bottom:.875rem}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:.92rem;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:.92rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-top:.1rem}
.logout-btn{width:100%;padding:.6rem;border:1.5px solid var(--border);background:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;transition:all .15s}
.logout-btn:hover{border-color:var(--red);color:var(--red);background:#fff5f5}
.update-btn{border-color:var(--primary);color:var(--primary-dark)}
.update-btn:hover{border-color:var(--primary);color:#fff;background:var(--primary)}

.main{margin-right:var(--sidebar-w);flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{height:var(--header-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0}
.header-title{font-weight:700;font-size:.95rem;color:var(--text)}
.header-actions{display:flex;align-items:center;gap:.625rem}
.header-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .75rem;border-radius:7px;font-family:'Cairo',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:white;color:var(--text);transition:all .15s}
.header-btn:hover{background:var(--gray-light)}
.content-area{flex:1;overflow:hidden;position:relative}
.page-frame{width:100%;height:100%;border:none;display:none}
.page-frame.active{display:block}
.page-loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;z-index:10}
.page-loading.hidden{display:none}
.load-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:.8rem;color:var(--text-muted)}
.header-stats{display:flex;align-items:center;gap:.5rem}
.hstat{display:flex;align-items:center;gap:.25rem;padding:.2rem .6rem;border-radius:12px;font-size:.7rem;font-weight:600}
.hstat-pending{background:var(--green-light);color:#15803d}
.hstat-late{background:var(--red-light);color:#b91c1c}
.hstat-picked{background:var(--blue-light);color:#0e7490}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:.25rem}
.empty-perms{padding:2rem 1rem;text-align:center;color:var(--text-muted);font-size:.8rem}

/* ===== الروابط السريعة في الهيدر (أيقونة + الاسم جنبها) ===== */
.quick-links{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.qbtn{height:34px;padding:0 .7rem;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--text-muted);display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;transition:all .15s;position:relative;flex-shrink:0;font-family:'Cairo',sans-serif;font-size:.75rem;font-weight:700;white-space:nowrap}
.qbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.qbtn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.qbtn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.qbtn-badge{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;font-size:.6rem;font-weight:800;min-width:16px;height:16px;padding:0 3px;border-radius:8px;display:none;align-items:center;justify-content:center;line-height:1;border:1.5px solid #fff}
.q-divider{width:1px;height:22px;background:var(--border);margin:0 .2rem;flex-shrink:0}

/* ===== شريط أيقونات مطوي (Desktop) — يتوسّع كطبقة فوق الشاشة عند المرور ثم يرجع ===== */
@media(min-width:769px){
  .sidebar{width:var(--rail-w);overflow:hidden;
    transition:width .22s cubic-bezier(.4,0,.2,1),box-shadow .22s}
  .sidebar:hover{width:var(--sidebar-w);box-shadow:-10px 0 40px rgba(15,23,42,.18)}
  .main{margin-right:var(--rail-w)}
  /* الحالة المطوية: أيقونات فقط في المنتصف */
  .sidebar:not(:hover) .sidebar-logo{justify-content:center;padding-left:0;padding-right:0}
  .sidebar:not(:hover) .logo-text,
  .sidebar:not(:hover) .logo-sub,
  .sidebar:not(:hover) .nav-lbl,
  .sidebar:not(:hover) .nav-section-label,
  .sidebar:not(:hover) .user-info,
  .sidebar:not(:hover) .sidebar-footer .logout-btn{display:none}
  .sidebar:not(:hover) .nav-item{justify-content:center;padding-left:0;padding-right:0}
  .sidebar:not(:hover) .sidebar-footer{padding-left:0;padding-right:0;display:flex;justify-content:center}
  .sidebar:not(:hover) .user-card{margin-bottom:0;justify-content:center}
  /* الشارة تبقى نقطة صغيرة في الحالة المطوية */
  .sidebar:not(:hover) .nav-badge{position:absolute;top:7px;left:18px;min-width:9px;width:9px;height:9px;padding:0;font-size:0;line-height:0;border-radius:50%}
}
@media(max-width:768px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0; min-width:0;}
  .menu-toggle{display:flex}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99}
  .overlay.show{display:block}

  /* الهيدر كان بيتحشر في سطر واحد ويعمل سكرول جانبي للصفحة كلها — دلوقتي بيلف على أكتر من سطر */
  .header{
    flex-wrap:wrap; height:auto; min-height:var(--header-h);
    padding:.5rem .75rem; row-gap:.4rem;
  }
  .header-actions{ flex-wrap:wrap; width:100%; justify-content:center; min-width:0; }
  .header-stats{ flex-wrap:wrap; justify-content:center; width:100%; min-width:0; }
  .header-title{ white-space:normal; }
  .quick-links{ width:100%; justify-content:center; flex-wrap:wrap; }
  .q-divider{ display:none; }
}
html, body { max-width:100%; overflow-x:hidden; }
.main, .header, .header-actions { min-width:0; }
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>

let currentUser = null;
let currentPage = null;
let allowedPages = [];

window.addEventListener('DOMContentLoaded', async () => {
  const token = localStorage.getItem('authToken');
  const activeUser = localStorage.getItem('activeUser');
  if (!token || !activeUser) { window.location.href = 'auth.html'; return; }

  // تجديد تلقائي: جلسة قديمة بلا JWT صالح → عدّي على صفحة الدخول لتجديده (بدون كتابة بيانات)
  const _jwt = localStorage.getItem('authJwt');
  let _jwtOk = false;
  try { const _p = _jwt && JSON.parse(atob(_jwt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); _jwtOk = _p && _p.exp*1000 > Date.now()+60000; } catch(e){ _jwtOk = false; }
  if (!_jwtOk && !sessionStorage.getItem('jwtRefreshDone')) {
    sessionStorage.setItem('jwtRefreshDone', '1');
    window.location.href = 'auth.html';
    return;
  }

  currentUser = {
    id: activeUser,
    legacyId: localStorage.getItem('legacyId') || null,
    username: activeUser,
    full_name: localStorage.getItem('fullName') || activeUser,
    role: localStorage.getItem('userRole') || '',
    branch: localStorage.getItem('userBranch') || ''
  };

  if (currentUser.role === 'driver') { window.location.href = 'driver.html'; return; }

  document.getElementById('userName').textContent = currentUser.full_name;
  document.getElementById('userRoleLabel').textContent = ROLE_LABELS[currentUser.role] || currentUser.role;
  document.getElementById('userAvatar').textContent = currentUser.full_name?.charAt(0) || 'U';
  document.getElementById('branchName').textContent =
    currentUser.role === 'admin' ? 'كل الفروع' : (currentUser.branch || '—');

  await loadAllowedPages();
  buildSidebar();
  buildQuickLinks();
  await loadHeaderStats();
  setInterval(loadHeaderStats, 60000);

  const lastPage = sessionStorage.getItem('delivery_last_page');
  const lastTitle = sessionStorage.getItem('delivery_last_title');
  const isLastPageAllowed = lastPage && allowedPages.some(p => p.page === lastPage);
  if (isLastPageAllowed) {
    const navEl = document.querySelector(`[data-page="${lastPage}"]`);
    if (navEl) { navigate(lastPage, lastTitle || lastPage, navEl); return; }
  }
  if (allowedPages.length) {
    const first = allowedPages[0];
    const navEl = document.querySelector(`[data-page="${first.page}"]`);
    navigate(first.page, PAGE_META[first.page]?.title || first.page, navEl);
  }
});

async function loadAllowedPages() {
  try {
    const { data, error } = await db.rpc('get_role_pages', { p_role: currentUser.role });
    if (error) throw error;
    allowedPages = data || [];
  } catch (e) {
    console.error('loadAllowedPages failed', e);
    allowedPages = [];
  }
}

function buildSidebar() {
  const container = document.getElementById('navContainer');
  if (!allowedPages.length) {
    container.innerHTML = '<div class="empty-perms">لا توجد صفحات مسموح بها لدورك حاليًا</div>';
    return;
  }

  const byGroup = {};
  allowedPages.forEach(p => {
    const meta = PAGE_META[p.page];
    if (!meta) return; // صفحة غير معروفة، تجاهلها بأمان
    if (!byGroup[meta.group]) byGroup[meta.group] = [];
    byGroup[meta.group].push({ ...meta, page: p.page });
  });

  let html = '';
  GROUP_ORDER.forEach(group => {
    const items = byGroup[group];
    if (!items || !items.length) return;
    html += `<div class="nav-section-label">${group}</div>`;
    items.forEach(item => {
      const badgeHtml = item.badge
        ? `<span class="nav-badge" id="nav-badge-${item.badge}" style="display:none">0</span>`
        : '';
      html += `
        <button class="nav-item" data-page="${item.page}" title="${item.title.replace(/"/g,'&quot;')}"
          onclick="navigate('${item.page}', '${item.title.replace(/'/g,"\\'")}', this)">
          ${navIcon(item.page)}
          <span class="nav-lbl">${item.title}</span>
          ${badgeHtml}
        </button>`;
    });
  });

  container.innerHTML = html;
}

// بناء أزرار الوصول السريع — بتظهر بس لو الصفحة مسموحة لدور المستخدم
function buildQuickLinks() {
  const el = document.getElementById('quickLinks');
  if (!el) return;
  el.innerHTML = QUICK_LINKS
    .filter(q => allowedPages.some(p => p.page === q.page))
    .map(q => `
      <button class="qbtn" data-quick="${q.page}" title="${q.title}"
        onclick="quickGo('${q.page}','${q.title.replace(/'/g,"\\'")}')">
        <svg viewBox="0 0 24 24">${q.icon}</svg>
        <span>${q.title}</span>
        ${q.badge ? `<span class="qbtn-badge" id="qbadge-${q.badge}">0</span>` : ''}
      </button>`).join('');
  syncQuickActive(currentPage);
}

function quickGo(page, title) {
  const navEl = document.querySelector(`[data-page="${page}"]`);
  navigate(page, title, navEl);
}

function syncQuickActive(page) {
  document.querySelectorAll('.qbtn').forEach(b =>
    b.classList.toggle('active', b.dataset.quick === page));
}

function setQuickBadge(key, count) {
  const b = document.getElementById('qbadge-' + key);
  if (!b) return;
  b.textContent = count > 99 ? '99+' : count;
  b.style.display = count > 0 ? 'flex' : 'none';
}

async function loadHeaderStats() {
  try {
    const { data } = await db.from('orders').select('status,bill_date,created_at');
    if (!data) return;
    const pending = data.filter(o => o.status === 'pending').length;
    const picked  = data.filter(o => o.status === 'picked').length;
    const late    = data.filter(o => {
      if (['completed','cancelled','delivered'].includes(o.status)) return false;
      return (new Date() - new Date(o.bill_date || o.created_at)) / 60000 > 30;
    }).length;

    const ordersBadge = document.getElementById('nav-badge-orders');
    if (ordersBadge) { ordersBadge.textContent = pending; ordersBadge.style.display = pending > 0 ? 'inline-block' : 'none'; }

    // في شاشة التوزيع سيبها لإحصائيات الفرع المختار (اللي بتيجي من الشاشة نفسها) — متكتبش فوقها إحصائيات كل الفروع
    const statsEl = document.getElementById('headerStats');
    if (statsEl && currentPage !== 'dispatch.html') {
      statsEl.innerHTML = `
        <span class="hstat hstat-pending">${pending} جاهز</span>
        <span class="hstat hstat-picked">${picked} رحلة</span>
        ${late > 0 ? `<span class="hstat hstat-late">⚠️ ${late} متأخر</span>` : ''}
      `;
    }
  } catch (e) {
    console.warn('loadHeaderStats failed (طبيعي لو الصفحة الحالية من نظام الصيدلية)', e);
  }
}

// كل رابط للـ iframe بياخد رقم فريد (cache-bust) عشان يضمن إن المتصفح
// دايمًا يجيب أحدث نسخة من الصفحة، مش نسخة متخزنة (cached) قديمة
function buildFrameSrc(page) {
  const base = ERP_PAGES.has(page) ? `../${page}` : `pages/${page}`;
  return `${base}?_v=${Date.now()}`;
}

function navigate(page, title, el) {
  if (currentPage === page) return;
  currentPage = page;
  syncQuickActive(page);
  sessionStorage.setItem('delivery_last_page', page);
  sessionStorage.setItem('delivery_last_title', title);
  document.getElementById('pageTitle').textContent = title;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  showLoading(true);
  document.getElementById('mainFrame').src = buildFrameSrc(page);
  if (window.innerWidth <= 768) closeSidebar();
}

function frameLoaded() {
  showLoading(false);
  // إخفاء شريط الناف القديم (.nav-bar) الخاص بصفحات ERP لما تفتح جوه app —
  // ده كان بيعمله nav.js قبل ما نحذفه؛ دلوقتي app هو المسؤول عن إخفائه
  try {
    const doc = document.getElementById('mainFrame').contentDocument;
    if (doc) doc.querySelectorAll('.nav-bar').forEach(el => { el.style.display = 'none'; });
  } catch (e) { /* الصفحة لسه بتحمّل أو مختلفة الأصل — نتجاهل بأمان */ }
}

function reloadCurrentPage() {
  if (!currentPage) return;
  showLoading(true);
  document.getElementById('mainFrame').src = buildFrameSrc(currentPage);
}

// زرار "تحديث لآخر إصدار" — بيعمل Hard Reload كامل للبورتال نفسه (مش بس الـ iframe)
// من غير ما يمسح تسجيل الدخول، فقط يجبر المتصفح يجيب كل الملفات (HTML/JS/CSS) من جديد
async function forceUpdateToLatest() {
  if (!confirm('هيتم تحديث التطبيق لآخر إصدار. هتفضل مسجّل دخول، بس الصفحة الحالية هتتحمّل من جديد. تكمل؟')) return;

  try {
    // مسح أي كاش متخزن عن طريق Cache Storage API (لو موجود)
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    // إلغاء أي Service Worker مسجّل (احتياطي، حتى لو مش متوقع وجوده هنا)
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch (e) {
    console.warn('forceUpdateToLatest cache cleanup failed (غير حرج):', e);
  }

  // إعادة تحميل البورتال نفسه برابط فريد يجبر المتصفح يجيب نسخة جديدة تمامًا
  const url = window.location.pathname + '?_v=' + Date.now();
  window.location.replace(url);
}

function showLoading(show) {
  document.getElementById('pageLoading').classList.toggle('hidden', !show);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function logout() {
  localStorage.removeItem('authToken');
  localStorage.removeItem('activeUser');
  localStorage.removeItem('userBranch');
  localStorage.removeItem('userRole');
  localStorage.removeItem('fullName');
  localStorage.removeItem('legacyId');
  localStorage.removeItem('loginTime');
  sessionStorage.removeItem('delivery_last_page');
  sessionStorage.removeItem('delivery_last_title');
  window.location.href = 'auth.html';
}

function openChangePassword(){
  if (!currentUser?.username) {
    alert('لم يتم التعرف على المستخدم — سجّل الدخول من جديد');
    return;
  }
  document.getElementById('pwd-old').value='';
  document.getElementById('pwd-new').value='';
  document.getElementById('pwd-confirm').value='';
  document.getElementById('pwdOverlay').style.display='flex';
}
function closeChangePassword(){
  document.getElementById('pwdOverlay').style.display='none';
}
async function submitChangePassword(){
  const oldP=document.getElementById('pwd-old').value.trim();
  const newP=document.getElementById('pwd-new').value.trim();
  const confirmP=document.getElementById('pwd-confirm').value.trim();
  if(!oldP||!newP||!confirmP){alert('املأ كل الخانات');return;}
  if(newP!==confirmP){alert('كلمة المرور الجديدة وتأكيدها غير متطابقين');return;}
  if(newP.length<6){alert('كلمة المرور الجديدة قصيرة جداً (6 أحرف على الأقل)');return;}
  if(newP===oldP){alert('كلمة المرور الجديدة مطابقة للحالية');return;}
  try{
    const {data,error}=await db.rpc('change_branch_user_password',{
      p_username:currentUser.username,
      p_old_password:oldP,
      p_new_password:newP
    });
    if(error)throw error;
    if(data?.success){
      closeChangePassword();
      alert('✓ تم تغيير كلمة المرور بنجاح');
    } else {
      alert('❌ '+(data?.error||'حدث خطأ'));
    }
  }catch(e){
    console.error('changePassword:',e);
    alert('❌ حدث خطأ: '+(e.message||'فشل تغيير كلمة المرور'));
  }
}

window.addEventListener('message', (e) => {
  if (e.data?.type === 'navigate') {
    const el = document.querySelector(`[data-page="${e.data.page}"]`);
    if (el) navigate(e.data.page, e.data.title, el);
  }
  if (e.data?.type === 'refreshStats') loadHeaderStats();
  if (e.data?.type === 'dispatchStats') {
    const s = e.data.stats || {};
    const statsEl = document.getElementById('headerStats');
    if (statsEl) {
      statsEl.innerHTML = `
        <span class="hstat hstat-pending">📦 ${s.unassigned||0} غير موزع</span>
        <span class="hstat hstat-picked">🚗 ${s.inTransit||0} في الطريق</span>
        ${s.late>0 ? `<span class="hstat hstat-late">⚠️ ${s.late} متأخر</span>` : ''}
        <span class="hstat" style="background:rgba(74,222,128,.15);color:#16a34a">🟢 ${s.online||0} أونلاين</span>
        <span class="hstat hstat-picked" style="background:var(--purple-light);color:#6d28d9">👤 ${s.available||0} متاح</span>
        ${s.totAM>0 ? `<span class="hstat" style="background:rgba(37,99,235,.14);color:#2563eb" title="تلقائي ${s.autoN} · يدوي ${s.manN}">⚙️ ${s.autoPct}% تلقائي · ${100-s.autoPct}% يدوي</span>` : ''}
        ${s.unknownRegions>0 ? `<span class="hstat hstat-late">⚠️ ${s.unknownRegions} منطقة غير مسجلة</span>` : ''}
      `;
    }
  }
});

// ===== تثبيت كارت إنهاء الرحلة كنافذة عائمة (يُنفَّذ من المستوى الأساسي — مسموح به) =====
// تُستدعى من داخل الإطار عبر window.parent.pinFloatingCard()
window.pinFloatingCard = async function(){
  const iframe = document.getElementById('mainFrame');
  const idoc = iframe && iframe.contentDocument;
  const iwin = iframe && iframe.contentWindow;
  if(!idoc || !iwin) return 'no-frame';
  const card = idoc.querySelector('#completeApprovalModal .modal');
  if(!card) return 'no-card';
  if(!('documentPictureInPicture' in window)) return 'unsupported';
  try{
    if(window._tripPip && !window._tripPip.closed){ window._tripPip.focus(); return true; }
    // نقيس حجم الكارت الطبيعي ونفتح النافذة بنفس المقاس بالظبط
    let cw=440, ch=620;
    try{ cw = Math.max(300, Math.min((card.offsetWidth||440), 560)); ch = Math.max(260, Math.min((card.offsetHeight||620), 760)); }catch(e){}
    const pip = await window.documentPictureInPicture.requestWindow({width: Math.round(cw+22), height: Math.round(ch+22)});
    window._tripPip = pip;
    const pdoc = pip.document;
    pdoc.documentElement.setAttribute('dir','rtl');
    pdoc.documentElement.setAttribute('lang','ar');
    // انسخ ستايلات مستند الإطار (فيه ستايل الكارت)
    [...idoc.styleSheets].forEach(ss=>{
      try{ const css=[...ss.cssRules].map(r=>r.cssText).join('\n'); const st=pdoc.createElement('style'); st.textContent=css; pdoc.head.appendChild(st); }
      catch(e){ if(ss.href){ const l=pdoc.createElement('link'); l.rel='stylesheet'; l.href=ss.href; pdoc.head.appendChild(l); } }
    });
    let bg='#f1f5f9'; try{ bg=iwin.getComputedStyle(idoc.body).backgroundColor||bg; }catch(e){}
    pdoc.body.style.cssText='margin:0;padding:10px;background:'+bg;

    // ننقل الكارت الأصلي نفسه (مش نسخة) للنافذة العائمة، ونحفظ مكانه الأصلي لإرجاعه
    const overlay = idoc.getElementById('completeApprovalModal');   // الغلاف يفضل في الداشبورد
    const prevCardCss = card.style.cssText;
    pdoc.body.appendChild(pdoc.adoptNode(card));
    card.style.margin='0 auto';   // نخليه بحجمه الطبيعي مش ممدود
    if(overlay) overlay.style.display='none';                       // الغلاف بقى فاضي — نخفيه
    // نخلي دوال الإطار تلاقي عناصر الكارت في النافذة العائمة
    iwin._tripPipDoc = pdoc;

    // أزرار الكارت (الحقيقي) تنفّذ دوال الإطار مباشرة — تنهي الرحلة من هنا بدون الرجوع للداشبورد
    pip.closeModal      = ()=>{ try{ iwin.closeModal('completeApprovalModal'); }catch(e){} try{ if(!pip.closed) pip.close(); }catch(e){} };
    pip.pinCompleteCard = ()=>{ try{ pip.focus(); }catch(e){} };
    pip.approveComplete = async()=>{ try{ await iwin.approveComplete(); }finally{ if(!pip.closed) pip.close(); } };
    pip.rejectComplete  = async()=>{ try{ await iwin.rejectComplete(); }finally{ if(!pip.closed) pip.close(); } };
    pip.approveCollected= (a,b,c)=> iwin.approveCollected(a,b,c);   // بيعيد رسم الكارت الحقيقي في النافذة مباشرة

    // عند غلق النافذة: نرجّع الكارت الحقيقي لمكانه في الداشبورد (نحافظ عليه للمرات الجاية)
    pip.addEventListener('pagehide',()=>{
      try{
        card.style.cssText = prevCardCss;
        if(overlay){ overlay.appendChild(idoc.adoptNode(card)); overlay.style.display=''; }
      }catch(e){ console.error('restore card', e); }
      try{ iwin._tripPipDoc = null; }catch(e){}
      window._tripPip=null;
    });
    return true;
  }catch(e){ console.error('pinFloatingCard', e); window._tripPip=null; return 'error:'+(e&&e.name||''); }
};
