<style>
/* درجات كانت الشاشة دي مستعملاها عن قصد (أغمق للتباين) — الوضع الداكن
   لسه بيتجاوزها لأن html[data-theme="dark"] محدّده أقوى من :root */
:root{--text:#111827;--text-muted:#6b7280;--border:#e5e7eb;}

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-dark:#1344b0;--primary-light:#e8f0fe;
  --green:#16a34a;--green-light:#dcfce7;
  --yellow:#ca8a04;--yellow-light:#fef9c3;
  --purple-light:#ede9fe;
  --red:#dc2626;
  --blue:#0891b2;--blue-light:#ecfeff;
  --gray:#6b7280;--gray-light:#f3f4f6;
  --text-light:#9ca3af;
  
  --sidebar-w:260px;--rail-w:72px;--header-h:56px;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow:hidden}

.sidebar{
  width:var(--sidebar-w);background:var(--white);border-left:1.5px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:fixed;right:0;top:0;z-index:100;
  box-shadow:2px 0 12px rgba(0,0,0,.04);
}
.sidebar-logo{padding:1.1rem 1.25rem;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:.75rem}
.logo-icon{width:40px;height:40px;background:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{fill:white;width:21px;height:21px}
.logo-text{font-weight:800;font-size:1.05rem;color:var(--text);line-height:1.25}
.logo-sub{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-top:.1rem}
.sidebar-nav{flex:1;padding:.75rem 0;overflow-y:auto}
.nav-section-label{display:flex;align-items:center;gap:.4rem;width:100%;padding:.7rem .85rem .3rem;font-family:inherit;font-size:.72rem;color:var(--text-muted);font-weight:700;letter-spacing:.03em;opacity:1;background:none;border:none;cursor:pointer;text-align:right;transition:opacity .15s}
.nav-section-label:hover{opacity:1}
.nav-chevron{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform .18s}
.nav-group.collapsed .nav-chevron{transform:rotate(-90deg)}
.nav-group.collapsed .nav-group-items{display:none}
/* ستايل المنصة: عنوان المجموعة مخفّف صغير، والصفحات متقاربة بإزاحة بسيطة ورأس دائري */
.nav-group-items{margin-right:0}
.nav-group-items .nav-item{padding-right:1.4rem}
.nav-item{display:flex;align-items:center;gap:.65rem;padding:.48rem .85rem;cursor:pointer;font-size:.88rem;font-weight:500;color:var(--text);border:none;background:none;width:100%;text-align:right;border-radius:9px;transition:all .12s;position:relative;margin-bottom:1px}
.nav-item:hover{background:var(--gray-light)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:700}
.nav-item.active::before{display:none}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.55}
.nav-badge{margin-right:auto;background:var(--red);color:white;font-size:.68rem;font-weight:800;padding:.15rem .5rem;border-radius:10px;min-width:20px;text-align:center}
.sidebar-footer{padding:1.1rem 1.25rem;border-top:1.5px solid var(--border)}
.user-card{display:flex;align-items:center;gap:.75rem;margin-bottom:.875rem}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:.92rem;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:.92rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-top:.1rem}
.logout-btn{width:100%;padding:.6rem;border:1.5px solid var(--border);background:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;transition:all .15s}
.logout-btn:hover{border-color:var(--red);color:var(--red);background:#fff5f5}
.update-btn{border-color:var(--primary);color:var(--primary-dark)}
.update-btn:hover{border-color:var(--primary);color:#fff;background:var(--primary)}

.main{margin-right:var(--sidebar-w);flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{height:var(--header-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0}
.header-title{font-weight:700;font-size:.95rem;color:var(--text)}
.header-actions{display:flex;align-items:center;gap:.625rem}
.header-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .75rem;border-radius:7px;font-family:'Cairo',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .15s}
.header-btn:hover{background:var(--gray-light)}
.content-area{flex:1;overflow:hidden;position:relative}
.page-frame{width:100%;height:100%;border:none;display:none}
.page-frame.active{display:block}
.page-loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;z-index:10}
.page-loading.hidden{display:none}
.load-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:.8rem;color:var(--text-muted)}
.header-stats{display:flex;align-items:center;gap:.35rem}
.hstat{display:flex;align-items:center;gap:.2rem;padding:.14rem .5rem;border-radius:10px;font-size:.66rem;font-weight:600;white-space:nowrap;flex-shrink:0}
.hstat-pending{background:var(--green-light);color:#15803d}
.hstat-late{background:var(--red-light);color:#b91c1c}
.hstat-picked{background:var(--blue-light);color:#0e7490}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:.25rem}
.empty-perms{padding:2rem 1rem;text-align:center;color:var(--text-muted);font-size:.8rem}

/* ===== الروابط السريعة في الهيدر (أيقونة + الاسم جنبها) ===== */
.hdr-search{position:relative;display:flex;align-items:center;gap:4px}
.hs-mode{font-family:inherit;font-size:.72rem;border:1px solid var(--border);border-radius:8px;padding:5px 6px;background:var(--surface);cursor:pointer;color:#334155}
.hs-input{font-family:inherit;font-size:.78rem;border:1px solid var(--border);border-radius:8px;padding:6px 10px;width:150px;max-width:40vw}
.hs-results{position:absolute;top:calc(100% + 5px);right:0;width:440px;max-width:92vw;max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.16);z-index:3000;display:none}
.hs-results.open{display:block}
.hs-row{padding:7px 11px;border-bottom:1px solid #f1f5f9;font-size:.76rem;line-height:1.5}
.hs-row:last-child{border-bottom:none}
.quick-links{display:flex;align-items:center;gap:.35rem;flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none}
.quick-links::-webkit-scrollbar{display:none}
.qbtn{height:34px;padding:0 .7rem;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;transition:all .15s;position:relative;flex-shrink:0;font-family:'Cairo',sans-serif;font-size:.75rem;font-weight:700;white-space:nowrap}
.qbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.qbtn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.qbtn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.qbtn-badge{position:absolute;top:-6px;left:-6px;background:var(--red);color:#fff;font-size:.6rem;font-weight:800;min-width:16px;height:16px;padding:0 3px;border-radius:8px;display:none;align-items:center;justify-content:center;line-height:1;border:1.5px solid #fff}
.q-divider{width:1px;height:22px;background:var(--border);margin:0 .2rem;flex-shrink:0}

/* ===== شريط أيقونات مطوي (Desktop) — يتوسّع كطبقة فوق الشاشة عند المرور ثم يرجع ===== */
@media(min-width:769px){
  .sidebar{width:var(--rail-w);overflow:hidden;
    transition:width .22s cubic-bezier(.4,0,.2,1),box-shadow .22s}
  .sidebar:hover{width:var(--sidebar-w);box-shadow:-10px 0 40px rgba(15,23,42,.18)}
  .main{margin-right:var(--rail-w)}
  /* الحالة المطوية: أيقونات فقط في المنتصف */
  .sidebar:not(:hover) .sidebar-logo{justify-content:center;padding-left:0;padding-right:0}
  .sidebar:not(:hover) .logo-text,
  .sidebar:not(:hover) .logo-sub,
  .sidebar:not(:hover) .nav-lbl,
  .sidebar:not(:hover) .nav-section-label,
  .sidebar:not(:hover) .user-info,
  .sidebar:not(:hover) .sidebar-footer .logout-btn{display:none}
  .sidebar:not(:hover) .nav-item{justify-content:center;padding-left:0;padding-right:0}
  .sidebar:not(:hover) .sidebar-footer{padding-left:0;padding-right:0;display:flex;justify-content:center}
  .sidebar:not(:hover) .user-card{margin-bottom:0;justify-content:center}
  /* الشارة تبقى نقطة صغيرة في الحالة المطوية */
  .sidebar:not(:hover) .nav-badge{position:absolute;top:7px;left:18px;min-width:9px;width:9px;height:9px;padding:0;font-size:0;line-height:0;border-radius:50%}
  /* في شريط الأيقونات (غير مُمرَّر): تفضل كل الرموز ظاهرة حتى لو المجموعة مطويّة —
     الطي بيبان بس لما الشريط يتوسّع بالمرور */
  .sidebar:not(:hover) .nav-group.collapsed .nav-group-items{display:block}
  /* على الرِيل: نشيل الإزاحة وخط التبادئ عشان الرموز تفضل في النص */
  .sidebar:not(:hover) .nav-group-items{margin-right:0;border-right:none}
}
@media(max-width:768px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0; min-width:0;}
  .menu-toggle{display:flex}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99}
  .overlay.show{display:block}

  /* الهيدر كان بيتحشر في سطر واحد ويعمل سكرول جانبي للصفحة كلها — دلوقتي بيلف على أكتر من سطر */
  .header{
    flex-wrap:wrap; height:auto; min-height:var(--header-h);
    padding:.5rem .75rem; row-gap:.4rem;
  }
  .header-actions{ flex-wrap:wrap; width:100%; justify-content:center; min-width:0; }
  .header-stats{ flex-wrap:wrap; justify-content:center; width:100%; min-width:0; }
  .header-title{ white-space:normal; }
  .quick-links{ width:100%; justify-content:center; flex-wrap:wrap; }
  .q-divider{ display:none; }
}
html, body { max-width:100%; overflow-x:hidden; }
.main, .header, .header-actions { min-width:0; }
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
<style>
/* الهوية الموحّدة (Cairo + تركوازي) على الشريط الجانبي */
:root{ --primary:#0d9488; --primary-dark:#0f766e; --primary-light:#ccfbf1; }
/* أزرار الفوتر: سطر واحد كرموز */
.footer-icons{display:flex;gap:6px;margin-top:.5rem}
.ficon{flex:1;height:38px;border:1.5px solid var(--border);background:var(--white);color:var(--text-muted);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.ficon:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.ficon svg{width:17px;height:17px}
.ficon-out:hover{border-color:#dc2626;color:#dc2626;background:#fee2e2}
/* الوضع الداكن للشِّل */
body.dark{     --text-light:#6b7a94;  --gray-light:#16223a; --primary-light:#12403c; }
.theme-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);color:var(--text-muted);cursor:pointer;font-size:1rem;flex-shrink:0}
.theme-btn:hover{border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    </div>
    <div>
      <div class="logo-text" data-org-name>Phalix</div>
      <div class="logo-sub" id="branchName">—</div>
    </div>
  </div>

  <nav class="sidebar-nav" id="navContainer">
    <div class="empty-perms">جاري تحميل الصلاحيات...</div>
  </nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar" id="userAvatar">A</div>
      <div class="user-info">
        <div class="user-name" id="userName">...</div>
        <div class="user-role" id="userRoleLabel">...</div>
      </div>
    </div>
    <div class="footer-icons">
      <button class="ficon" title="تحديث لآخر إصدار" onclick="forceUpdateToLatest()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="ficon" title="تغيير كلمة المرور" onclick="openChangePassword()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
      <button class="ficon ficon-out" title="تسجيل الخروج" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>
</aside>

<main class="main">
  <header class="header">
    <div style="display:flex;align-items:center;gap:.75rem">
      <button class="menu-toggle" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="header-title" id="pageTitle">جاري التحميل...</span>
    </div>
    <div class="header-actions">
      <div class="hdr-search" id="hdrSearch">
        <select id="hsMode" class="hs-mode" onchange="hsSearch()">
          <option value="stock">المخزون</option>
          <option value="stores">المخازن</option>
        </select>
        <input type="text" tabindex="-1" aria-hidden="true" autocomplete="username" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none">

        <div class="hs-results" id="hsResults"></div>
      </div>
      <div class="quick-links" id="quickLinks"></div>
      <button class="header-btn" onclick="reloadCurrentPage()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        تحديث

      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="الوضع الفاتح/الداكن">🌙</button>

  </header>

  <div class="content-area" id="contentArea">
    <div class="page-loading" id="pageLoading">
      <div class="load-spinner"></div>
      <div class="load-text">جاري التحميل...</div>
    </div>
    <iframe class="page-frame active" id="mainFrame" src="about:blank" allow="clipboard-write" onload="if(typeof frameLoaded==='function')frameLoaded()"></iframe>
  </div>
</main>

<div id="pwdOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:500;align-items:center;justify-content:center">
  <div style="background:var(--surface);border-radius:14px;width:360px;max-width:92vw;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="font-weight:700;font-size:1rem;margin-bottom:1.25rem;text-align:center">🔑 تغيير كلمة المرور</div>
    <div style="margin-bottom:1rem">
      <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem;color:var(--text-muted)">كلمة المرور الحالية</label>
      <input type="password" id="pwd-old" placeholder="••••••" style="width:100%;height:44px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;outline:none">
    </div>
    <div style="margin-bottom:1rem">
      <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem;color:var(--text-muted)">كلمة المرور الجديدة</label>
      <input type="password" id="pwd-new" placeholder="••••••" style="width:100%;height:44px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;outline:none">
    </div>
    <div style="margin-bottom:1.25rem">
      <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem;color:var(--text-muted)">تأكيد كلمة المرور الجديدة</label>
      <input type="password" id="pwd-confirm" placeholder="••••••" style="width:100%;height:44px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;outline:none">
    </div>
    <div style="display:flex;gap:.5rem">
      <button onclick="submitChangePassword()" style="flex:1;height:44px;border:none;border-radius:10px;background:var(--green);color:white;font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer">✓ حفظ</button>
      <button onclick="closeChangePassword()" style="flex:1;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer">إلغاء</button>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
// التوكن بيتقرا **لكل نداء** (Session بيجدّده لو لزم) مش مرة واحدة وقت
// التحميل — النسخة القديمة كانت تفضل تبعت توكن منتهي بعد ساعة و401 على
// كل حاجة. والجداول بقت authenticated-only فالتوكن بقى شرط مش تحسين.
const db = Session.client();

// الهوية في brand.js والفروع في branches.js — كانت الكتلة دي مكررة
// حرفيًا في 3 ملفات.

const ROLE_LABELS = {
  admin:'Admin', supervisor:'مشرف', cashier:'كاشير', pharmacist:'مشتريات', driver:'طيار',

let allowedPages = [];

// تجديد توكن Supabase — التنفيذ الوحيد في session.js. الشل والـiframe
// وأي تبويب بيشاركوا نفس القفل فمفيش سياقين بيحرقوا الـrefresh token.
async function sbRefreshJwt(marginMs) {
  return Session.refresh(marginMs);
}

window.addEventListener('DOMContentLoaded', async () => {
  const token = localStorage.getItem('authToken');
  const activeUser = Session.username();
  if (!token || !activeUser) { window.location.href = 'auth.html'; return; }

  // توكن Supabase عمره ساعة — Session.refresh() بيرجّع true لو التوكن صالح
  // أو اتجدّد بنجاح، وبيقفل عشان مايتصادمش مع الـiframe أو تبويب تاني.
  // tokenValid الأول: جلسة n8n معاها JWT صالح لازم تعدّي — Session.refresh()
  // بترجّع false فورًا لأي مزوّد غير supabase.
  const _jwtOk = Session.tokenValid(60000) || await Session.refresh(60000);
  if (_jwtOk) sessionStorage.removeItem('jwtRefreshDone');

  if (!_jwtOk && !sessionStorage.getItem('jwtRefreshDone')) {
    sessionStorage.setItem('jwtRefreshDone', '1');
    window.location.href = 'auth.html';
    return;
  }

  // تجديد استباقي كل 5 دقائق: يضمن التوكن دايمًا صالح لأكتر من 15 دقيقة —
  // فأي شاشة مفتوحة في الـiframe (جرد/إغلاقات/…) تلاقي توكن حي ومتقعش في 401/403.
  if (!window.__sbRefreshTimer) {
    window.__sbRefreshTimer = setInterval(() => { sbRefreshJwt(15*60*1000); }, 5*60*1000);
  }

  currentUser = Session.user();   // نفس الشكل بالظبط، مصدر واحد

  if (currentUser.role === 'driver') { window.location.href = 'driver.html'; return; }

  document.getElementById('userName').textContent = currentUser.full_name;
  document.getElementById('userRoleLabel').textContent = ROLE_LABELS[currentUser.role] || currentUser.role;
  document.getElementById('userAvatar').textContent = currentUser.full_name?.charAt(0) || 'U';
  document.getElementById('branchName').textContent =
    currentUser.role === 'admin' ? 'كل الفروع' : (currentUser.branch || '—');

  await loadAllowedPages();
  buildSidebar();
  buildQuickLinks();
  applyTheme();
  await loadHeaderStats();
  setInterval(loadHeaderStats, 60000);

  const lastPage = sessionStorage.getItem('delivery_last_page');
  const lastTitle = sessionStorage.getItem('delivery_last_title');
  const isLastPageAllowed = lastPage && allowedPages.some(p => p.page === lastPage);
  if (isLastPageAllowed) {
    const navEl = document.querySelector(`[data-page="${lastPage}"]`);
    if (navEl) { navigate(lastPage, lastTitle || lastPage, navEl); return; }
  }
  if (allowedPages.length) {
    const first = allowedPages[0];
    const navEl = document.querySelector(`[data-page="${first.page}"]`);
    navigate(first.page, first.title || Pages.title(first.page), navEl);
  }
});

async function loadAllowedPages() {
  try {
    const { data, error } = await db.rpc('get_role_pages', { p_role: currentUser.role });
    if (error) throw error;
    allowedPages = data || [];
  } catch (e) {
    console.error('loadAllowedPages failed', e);
    allowedPages = [];
  }
}

// المجموعات تبدأ مطويّة دايمًا. الطي/الفتح للجلسة الحالية فقط — من غير حفظ،
// عشان أي ريفريش يرجّعها كلها مطويّة (ماعدا مجموعة الصفحة المفتوحة بيفتحها navigate).
function toggleGroup(btn, group) {
  const sec = btn.closest('.nav-group'); if (!sec) return;
  sec.classList.toggle('collapsed');
}

function buildSidebar() {
  const container = document.getElementById('navContainer');
  if (!allowedPages.length) {
    container.innerHTML = '<div class="empty-perms">لا توجد صفحات مسموح بها لدورك حاليًا</div>';
    return;
  }

  // get_role_pages بترجّع الاسم والمجموعة مع الصلاحية (من app_pages)،
  // فمفيش كتالوج تاني هنا يتفرّع عنها.
  const byGroup = {};
  allowedPages.forEach(p => {
    const meta = Pages.byKey(p.key) || Pages.byFile(p.page);
    const group = p.section || (meta && meta.section);
    const title = p.title   || (meta && meta.title);
    if (!group || !title) return;   // صفحة مش في الكتالوج — تجاهلها بأمان
    if (!byGroup[group]) byGroup[group] = [];
    byGroup[group].push({ title, group, badge: p.badge || (meta && meta.badge), page: p.page });
  });

  let html = '';
  Pages.sections().forEach(group => {
    const items = byGroup[group];
    if (!items || !items.length) return;
    const gEsc = group.replace(/'/g, "\\'");
    html += `<div class="nav-group collapsed" data-group="${group}">`;   // تبدأ مطويّة دايمًا
    html += `<button type="button" class="nav-section-label" onclick="toggleGroup(this,'${gEsc}')">
        <svg class="nav-chevron" viewBox="0 0 24 24" width="13" height="13"><path d="M6 9l6 6 6-6"/></svg>
        <span class="nav-sec-txt">${group}</span>
      </button>`;
    html += `<div class="nav-group-items">`;
    items.forEach(item => {
      const badgeHtml = item.badge
        ? `<span class="nav-badge" id="nav-badge-${item.badge}" style="display:none">0</span>`
        : '';
      html += `
        <button class="nav-item" data-page="${item.page}" title="${item.title.replace(/"/g,'&quot;')}"
          onclick="navigate('${item.page}', '${item.title.replace(/'/g,"\\'")}', this)">
          ${navIcon(item.page)}
          <span class="nav-lbl">${item.title}</span>
          ${badgeHtml}
        </button>`;
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;
}

let hsTimer = null;
const hsEsc = s => String(s == null ? '' : s).replace(/</g, '&lt;').replace(/>/g, '&gt;');
const hsR1 = v => { const n = parseFloat(v); return isFinite(n) ? Math.round(n * 10) / 10 : 0; };
function hsShow(html) { const r = document.getElementById('hsResults'); if (r) { r.innerHTML = html; r.classList.add('open'); } }
function hsClose() { const r = document.getElementById('hsResults'); if (r) r.classList.remove('open'); }
function hsDebounce() { clearTimeout(hsTimer); hsTimer = setTimeout(hsSearch, 300); }
async function hsSearch() {
  const q = (document.getElementById('hsInput').value || '').trim();
  const mode = document.getElementById('hsMode').value;
  if (q.length < 2) { hsClose(); return; }
  hsShow('<div class="hs-row" style="color:#64748b">جارٍ البحث…</div>');

        + '<div style="color:#334155;margin-top:2px">المعمورة: <b>' + hsR1(x.m_q) + '</b> · سان: <b>' + hsR1(x.s_q) + '</b> · بشر: <b>' + hsR1(x.b_q) + '</b>'
        + (x.unit ? ' · ' + hsEsc(x.unit) : '') + (x.m_p ? ' · سعر ' + hsR1(x.m_p) : '') + '</div></div>').join(''));
    } else {
      const qs = q.replace(/[,()%]/g, ' ').trim();
      const { data } = await db.from('store_item_prices')
        .select('item_name,code,store,price,discount_perc')
        .or('item_name.ilike.%' + qs + '%,code.ilike.%' + qs + '%')
        .eq('available', true).order('item_name').limit(40);
      if (!data || !data.length) { hsShow('<div class="hs-row" style="color:#64748b">لا نتائج في المخازن</div>'); return; }
      hsShow(data.map(x =>

async function loadHeaderStats() {
  try {
    const { data } = await db.from('orders').select('status,bill_date,created_at');
    if (!data) return;
    const pending = data.filter(o => o.status === 'pending').length;
    const picked  = data.filter(o => o.status === 'picked').length;
    const late    = data.filter(o => {
      if (['completed','cancelled','delivered'].includes(o.status)) return false;
      return (new Date() - new Date(o.bill_date || o.created_at)) / 60000 > 30;
    }).length;

    const ordersBadge = document.getElementById('nav-badge-orders');
    if (ordersBadge) { ordersBadge.textContent = pending; ordersBadge.style.display = pending > 0 ? 'inline-block' : 'none'; }

    // في شاشة التوزيع سيبها لإحصائيات الفرع المختار (اللي بتيجي من الشاشة نفسها) — متكتبش فوقها إحصائيات كل الفروع
    const statsEl = document.getElementById('headerStats');
    if (statsEl && currentPage !== 'dispatch.html') {
      statsEl.innerHTML = `
        <span class="hstat hstat-pending">${pending} جاهز</span>
        <span class="hstat hstat-picked">${picked} رحلة</span>
        ${late > 0 ? `<span class="hstat hstat-late">⚠️ ${late} متأخر</span>` : ''}
      `;
    }
  } catch (e) {
    console.warn('loadHeaderStats failed (طبيعي لو الصفحة الحالية من نظام الصيدلية)', e);
  }
}

// كل رابط للـ iframe بياخد رقم فريد (cache-bust) عشان يضمن إن المتصفح
// دايمًا يجيب أحدث نسخة من الصفحة، مش نسخة متخزنة (cached) قديمة
// «أرصدة الموظفين» مش شاشة مستقلة — دي تبويب جوّه شاشة العملاء (customers.html)
const PAGE_ALIAS = { 'employees.html': 'customers.html?tab=employees' };
function buildFrameSrc(page) {
  const target = PAGE_ALIAS[page] || page;
  const qi = target.indexOf('?');
  const file = qi < 0 ? target : target.slice(0, qi);
  const qs = qi < 0 ? '' : target.slice(qi + 1);
  const base = ERP_PAGES.has(file) ? `../${file}` : `pages/${file}`;
  return `${base}?_v=${Date.now()}${qs ? '&' + qs : ''}`;
}

function navigate(page, title, el) {
  if (currentPage === page) return;
  currentPage = page;
  syncQuickActive(page);
  sessionStorage.setItem('delivery_last_page', page);
  sessionStorage.setItem('delivery_last_title', title);
  document.getElementById('pageTitle').textContent = title;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) {
    el.classList.add('active');
    // افتح مجموعة الصفحة الحالية لو كانت مطويّة عشان تبان مكانك
    const g = el.closest('.nav-group'); if (g) g.classList.remove('collapsed');
  }
  showLoading(true);
  document.getElementById('mainFrame').src = buildFrameSrc(page);
  if (window.innerWidth <= 768) closeSidebar();
}

// ===== الوضع الفاتح/الداكن =====
// مفتاح واحد للوضع الداكن في كل النظام. كان فيه مفتاحين مستقلين
// (phalix_theme هنا و phalix_dark في شاشة التوزيع) فالتبديل في واحد
// مايظهرش في التاني. phalix_dark لسه بيتقرا للتوافق مع جلسات قديمة.
let darkOn = localStorage.getItem('phalix_theme') === 'dark'
           || localStorage.getItem('phalix_dark') === '1';
function applyTheme() {
  // data-theme على <html> هو اللي tokens.css بيعتمد عليه؛ body.dark
  // باقي للتوافق مع القواعد القديمة في style.css.
  document.documentElement.setAttribute('data-theme', darkOn ? 'dark' : 'light');
  document.body.classList.toggle('dark', darkOn);
  const b = document.getElementById('themeBtn'); if (b) b.textContent = darkOn ? '☀️' : '🌙';
  applyThemeToFrame();
}
function applyThemeToFrame() {
  try {
    const d = document.getElementById('mainFrame').contentDocument;
    if (!d) return;
    // ⚠️ لازم documentElement كمان مش body بس: صفحات التوصيل بتعتمد
    // على [data-theme] وماكانتش بتتأثر بالتبديل من الشل خالص.
    d.documentElement.setAttribute('data-theme', darkOn ? 'dark' : 'light');
    if (d.body) d.body.classList.toggle('dark', darkOn);
  } catch (e) {}
}
function toggleTheme() {
  darkOn = !darkOn;
  localStorage.setItem('phalix_theme', darkOn ? 'dark' : 'light');
  localStorage.setItem('phalix_dark', darkOn ? '1' : '0');   // توافق
  applyTheme();
}

function frameLoaded() {
  showLoading(false);
  // كل صفحة جديدة تفتح في الـiframe لازم تاخد الثيم الحالي — من غير كده
  // التبديل بيضيع مع أول تنقّل.
  applyThemeToFrame();
  // إخفاء شريط الناف القديم (.nav-bar) الخاص بصفحات ERP لما تفتح جوه app —
  // ده كان بيعمله nav.js قبل ما نحذفه؛ دلوقتي app هو المسؤول عن إخفائه
  try {
    const doc = document.getElementById('mainFrame').contentDocument;
    if (doc) doc.querySelectorAll('.nav-bar').forEach(el => { el.style.display = 'none'; });
    if (doc && doc.body) doc.body.classList.toggle('dark', darkOn);   // انشر الوضع الداكن للصفحة المحمّلة
  } catch (e) { /* الصفحة لسه بتحمّل أو مختلفة الأصل — نتجاهل بأمان */ }
}

// زرار "تحديث لآخر إصدار" — بيعمل Hard Reload كامل للبورتال نفسه (مش بس الـ iframe)
// من غير ما يمسح تسجيل الدخول، فقط يجبر المتصفح يجيب كل الملفات (HTML/JS/CSS) من جديد
async function forceUpdateToLatest() {
  if (!confirm('هيتم تحديث التطبيق لآخر إصدار. هتفضل مسجّل دخول، بس الصفحة الحالية هتتحمّل من جديد. تكمل؟')) return;

  try {
    // مسح أي كاش متخزن عن طريق Cache Storage API (لو موجود)
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    // إلغاء أي Service Worker مسجّل (احتياطي، حتى لو مش متوقع وجوده هنا)
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch (e) {
    console.warn('forceUpdateToLatest cache cleanup failed (غير حرج):', e);
  }

  // إعادة تحميل البورتال نفسه برابط فريد يجبر المتصفح يجيب نسخة جديدة تمامًا
  const url = window.location.pathname + '?_v=' + Date.now();
  window.location.replace(url);
}

async function submitChangePassword(){
  const oldP=document.getElementById('pwd-old').value.trim();

// ===== تثبيت كارت إنهاء الرحلة كنافذة عائمة (يُنفَّذ من المستوى الأساسي — مسموح به) =====
// تُستدعى من داخل الإطار عبر window.parent.pinFloatingCard()
window.pinFloatingCard = async function(){
  const iframe = document.getElementById('mainFrame');
  const idoc = iframe && iframe.contentDocument;
  const iwin = iframe && iframe.contentWindow;
  if(!idoc || !iwin) return 'no-frame';
  const card = idoc.querySelector('#completeApprovalModal .modal');
  if(!card) return 'no-card';
  if(!('documentPictureInPicture' in window)) return 'unsupported';
  try{
    if(window._tripPip && !window._tripPip.closed){ window._tripPip.focus(); return true; }
    // نقيس حجم الكارت الطبيعي ونفتح النافذة بنفس المقاس بالظبط
    let cw=440, ch=620;
    try{ cw = Math.max(300, Math.min((card.offsetWidth||440), 560)); ch = Math.max(260, Math.min((card.offsetHeight||620), 760)); }catch(e){}
    const pip = await window.documentPictureInPicture.requestWindow({width: Math.round(cw+22), height: Math.round(ch+22)});
    window._tripPip = pip;
    const pdoc = pip.document;
    pdoc.documentElement.setAttribute('dir','rtl');
    pdoc.documentElement.setAttribute('lang','ar');
    // انسخ ستايلات مستند الإطار (فيه ستايل الكارت)
    [...idoc.styleSheets].forEach(ss=>{
      try{ const css=[...ss.cssRules].map(r=>r.cssText).join('\n'); const st=pdoc.createElement('style'); st.textContent=css; pdoc.head.appendChild(st); }
      catch(e){ if(ss.href){ const l=pdoc.createElement('link'); l.rel='stylesheet'; l.href=ss.href; pdoc.head.appendChild(l); } }
    });
    let bg='#f1f5f9'; try{ bg=iwin.getComputedStyle(idoc.body).backgroundColor||bg; }catch(e){}
    pdoc.body.style.cssText='margin:0;padding:10px;background:'+bg;

    // ننقل الكارت الأصلي نفسه (مش نسخة) للنافذة العائمة، ونحفظ مكانه الأصلي لإرجاعه
    const overlay = idoc.getElementById('completeApprovalModal');   // الغلاف يفضل في الداشبورد
    const prevCardCss = card.style.cssText;
    pdoc.body.appendChild(pdoc.adoptNode(card));
    card.style.margin='0 auto';   // نخليه بحجمه الطبيعي مش ممدود
    if(overlay) overlay.style.display='none';                       // الغلاف بقى فاضي — نخفيه
    // نخلي دوال الإطار تلاقي عناصر الكارت في النافذة العائمة
    iwin._tripPipDoc = pdoc;

    // أزرار الكارت (الحقيقي) تنفّذ دوال الإطار مباشرة — تنهي الرحلة من هنا بدون الرجوع للداشبورد
    pip.closeModal      = ()=>{ try{ iwin.closeModal('completeApprovalModal'); }catch(e){} try{ if(!pip.closed) pip.close(); }catch(e){} };
    pip.pinCompleteCard = ()=>{ try{ pip.focus(); }catch(e){} };
    pip.approveComplete = async()=>{ try{ await iwin.approveComplete(); }finally{ if(!pip.closed) pip.close(); } };
    pip.rejectComplete  = async()=>{ try{ await iwin.rejectComplete(); }finally{ if(!pip.closed) pip.close(); } };
    pip.approveCollected= (a,b,c)=> iwin.approveCollected(a,b,c);   // بيعيد رسم الكارت الحقيقي في النافذة مباشرة

    // عند غلق النافذة: نرجّع الكارت الحقيقي لمكانه في الداشبورد (نحافظ عليه للمرات الجاية)
    pip.addEventListener('pagehide',()=>{
      try{
        card.style.cssText = prevCardCss;
        if(overlay){ overlay.appendChild(idoc.adoptNode(card)); overlay.style.display=''; }
      }catch(e){ console.error('restore card', e); }
      try{ iwin._tripPipDoc = null; }catch(e){}
      window._tripPip=null;
    });
    return true;
  }catch(e){ console.error('pinFloatingCard', e); window._tripPip=null; return 'error:'+(e&&e.name||''); }
};

// تثبيت نافذة الطيار كنافذة عائمة (Document PiP) — نفس فكرة كارت إنهاء الرحلة
window.pinDriverPopup = async function(){
  const iframe = document.getElementById('mainFrame');
  const idoc = iframe && iframe.contentDocument;
  const iwin = iframe && iframe.contentWindow;
  if(!idoc || !iwin) return 'no-frame';
  const card = idoc.getElementById('driverPopup');
  if(!card) return 'no-card';
  if(!('documentPictureInPicture' in window)) return 'unsupported';
  try{
    if(window._drvPip && !window._drvPip.closed){ window._drvPip.focus(); return true; }
    let cw=340, ch=580;
    try{ cw = Math.max(300, Math.min((card.offsetWidth||340), 460)); ch = Math.max(300, Math.min((card.offsetHeight||580), 800)); }catch(e){}
    const pip = await window.documentPictureInPicture.requestWindow({width: Math.round(cw+24), height: Math.round(ch+24)});
    window._drvPip = pip;
    // نحاول نثبّتها أعلى يسار الشاشة (بعض المتصفحات بتسمح بـ moveTo على نافذة PiP)
    const _toTopLeft = ()=>{ try{ pip.moveTo(0, 0); }catch(e){} };
    _toTopLeft();
    setTimeout(_toTopLeft, 80);
    setTimeout(_toTopLeft, 300);
    const pdoc = pip.document;
    pdoc.documentElement.setAttribute('dir','rtl');
    pdoc.documentElement.setAttribute('lang','ar');
    [...idoc.styleSheets].forEach(ss=>{
      try{ const css=[...ss.cssRules].map(r=>r.cssText).join('\n'); const st=pdoc.createElement('style'); st.textContent=css; pdoc.head.appendChild(st); }
      catch(e){ if(ss.href){ const l=pdoc.createElement('link'); l.rel='stylesheet'; l.href=ss.href; pdoc.head.appendChild(l); } }
    });
    pdoc.body.style.cssText='margin:0;padding:12px;background:#1e293b';
    // بريدج أزرار النافذة (تشتغل من داخل النافذة العائمة على دوال الداشبورد)
    const did = iwin.currentPopupDriverId;
    pip.currentPopupDriverId = did;
    pip.callDriver         = (x)=> iwin.callDriver(x||did);
    pip.openSendMessage    = (x)=> iwin.openSendMessage(x||did);
    pip.showDriverLocation = (x)=> iwin.showDriverLocation(x||did);
    pip.endDriverBreak     = (x)=> iwin.endDriverBreak(x||did);
    pip.forceDriverOffline = (x)=> iwin.forceDriverOffline(x||did);
    pip.popupApproveCollected = (a,b)=> iwin.popupApproveCollected(a,b);
    pip.pinDriverPopupCard = ()=>{ try{ pip.focus(); }catch(e){} };
    pip.closeDriverPopup   = ()=>{ try{ iwin.closeDriverPopup(); }catch(e){} try{ if(!pip.closed) pip.close(); }catch(e){} };
    // ننقل النافذة الأصلية للنافذة العائمة ونحفظ ستايلها لإرجاعه
    const prevCss = card.style.cssText;
    pdoc.body.appendChild(pdoc.adoptNode(card));
    card.style.cssText = 'position:static;transform:none;width:100%;max-width:100%;max-height:none;display:block;box-shadow:none';
    pip.addEventListener('pagehide',()=>{
      try{ card.style.cssText = prevCss; idoc.body.appendChild(idoc.adoptNode(card)); card.classList.remove('open'); }catch(e){}
      window._drvPip=null;
    });
    return true;
  }catch(e){ console.error('pinDriverPopup', e); window._drvPip=null; return 'error:'+(e&&e.name||''); }
};
</script>
