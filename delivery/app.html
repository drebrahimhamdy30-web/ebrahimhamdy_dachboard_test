<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phalix</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-dark:#1344b0;--primary-light:#e8f0fe;
  --green:#16a34a;--green-light:#dcfce7;
  --yellow:#ca8a04;--yellow-light:#fef9c3;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#0891b2;--blue-light:#ecfeff;
  --gray:#6b7280;--gray-light:#f3f4f6;
  --text:#111827;--text-muted:#6b7280;--text-light:#9ca3af;
  --border:#e5e7eb;--bg:#f1f5f9;--white:#fff;
  --sidebar-w:240px;--header-h:56px;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow:hidden}

.sidebar{
  width:8px;background:var(--primary);border-left:none;
  display:flex;flex-direction:column;height:100vh;position:fixed;right:0;top:0;z-index:200;
  overflow:hidden;transition:width .22s ease, background .22s ease;
  box-shadow:2px 0 12px rgba(0,0,0,0);
}
.sidebar.open{
  width:var(--sidebar-w);background:var(--white);
  box-shadow:2px 0 20px rgba(0,0,0,.15);
}
.sidebar-logo{padding:.875rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.625rem;opacity:0;white-space:nowrap;transition:opacity .12s ease .05s}
.sidebar.open .sidebar-logo{opacity:1}
.logo-icon{width:34px;height:34px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{fill:white;width:18px;height:18px}
.logo-text{font-weight:700;font-size:.85rem;color:var(--text);line-height:1.2}
.logo-sub{font-size:.65rem;color:var(--text-muted);font-weight:400}
.sidebar-nav{flex:1;padding:.5rem 0;overflow-y:auto;opacity:0;white-space:nowrap;transition:opacity .12s ease .05s}
.sidebar.open .sidebar-nav{opacity:1}
.nav-section-label{padding:.5rem 1rem .2rem;font-size:.65rem;color:var(--text-light);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;cursor:pointer;font-size:.8rem;color:var(--text-muted);border:none;background:none;width:100%;text-align:right;border-radius:0;transition:all .15s;position:relative}
.nav-item:hover{background:var(--gray-light);color:var(--text)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;right:0;top:20%;height:60%;width:3px;background:var(--primary);border-radius:3px 0 0 3px}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.6}
.nav-badge{margin-right:auto;background:var(--red);color:white;font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:10px;min-width:18px;text-align:center}
.sidebar-footer{padding:.875rem 1rem;border-top:1px solid var(--border);opacity:0;white-space:nowrap;transition:opacity .12s ease .05s}
.sidebar.open .sidebar-footer{opacity:1}
.user-card{display:flex;align-items:center;gap:.625rem;margin-bottom:.625rem}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.75rem;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:.78rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.65rem;color:var(--text-muted)}
.logout-btn{width:100%;padding:.4rem;border:1px solid var(--border);background:none;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.75rem;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.35rem;transition:all .15s}
.logout-btn:hover{border-color:var(--red);color:var(--red);background:#fff5f5}

.main{margin-right:8px;flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{height:var(--header-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0}
.header-title{font-weight:700;font-size:.95rem;color:var(--text)}
.header-actions{display:flex;align-items:center;gap:.625rem}
.header-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .75rem;border-radius:7px;font-family:'Cairo',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:white;color:var(--text);transition:all .15s}
.header-btn:hover{background:var(--gray-light)}
.content-area{flex:1;overflow:hidden;position:relative}
.page-frame{width:100%;height:100%;border:none;display:none}
.page-frame.active{display:block}
.page-loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;z-index:10}
.page-loading.hidden{display:none}
.load-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:.8rem;color:var(--text-muted)}
.header-stats{display:flex;align-items:center;gap:.5rem}
.hstat{display:flex;align-items:center;gap:.25rem;padding:.2rem .6rem;border-radius:12px;font-size:.7rem;font-weight:600}
.hstat-pending{background:var(--green-light);color:#15803d}
.hstat-late{background:var(--red-light);color:#b91c1c}
.hstat-picked{background:var(--blue-light);color:#0e7490}
.menu-toggle{display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;padding:.25rem;color:var(--text)}
.empty-perms{padding:2rem 1rem;text-align:center;color:var(--text-muted);font-size:.8rem}
@media(max-width:768px){
  .sidebar{width:0;transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99}
  .overlay.show{display:block}
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    </div>
    <div>
      <div class="logo-text">Phalix</div>
      <div class="logo-sub" id="branchName">—</div>
    </div>
  </div>

  <nav class="sidebar-nav" id="navContainer">
    <div class="empty-perms">جاري تحميل الصلاحيات...</div>
  </nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar" id="userAvatar">A</div>
      <div class="user-info">
        <div class="user-name" id="userName">...</div>
        <div class="user-role" id="userRoleLabel">...</div>
      </div>
    </div>
    <button class="logout-btn" onclick="openChangePassword()" style="margin-bottom:.5rem">
      🔑 تغيير كلمة المرور
    </button>
    <button class="logout-btn" onclick="logout()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      تسجيل الخروج
    </button>
  </div>
</aside>

<main class="main">
  <header class="header">
    <div style="display:flex;align-items:center;gap:.75rem">
      <button class="menu-toggle" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="header-title" id="pageTitle">جاري التحميل...</span>
    </div>
    <div class="header-actions">
      <div class="header-stats" id="headerStats"></div>
      <button class="header-btn" onclick="reloadCurrentPage()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        تحديث
      </button>
    </div>
  </header>

  <div class="content-area" id="contentArea">
    <div class="page-loading" id="pageLoading">
      <div class="load-spinner"></div>
      <div class="load-text">جاري التحميل...</div>
    </div>
    <iframe class="page-frame active" id="mainFrame" src="about:blank" onload="frameLoaded()"></iframe>
  </div>
</main>

<div id="pwdOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:500;align-items:center;justify-content:center">
  <div style="background:white;border-radius:14px;width:360px;max-width:92vw;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="font-weight:700;font-size:1rem;margin-bottom:1.25rem;text-align:center">🔑 تغيير كلمة المرور</div>
    <div style="margin-bottom:1rem">
      <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem;color:var(--text-muted)">كلمة المرور الحالية</label>
      <input type="password" id="pwd-old" placeholder="••••••" style="width:100%;height:44px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;outline:none">
    </div>
    <div style="margin-bottom:1rem">
      <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem;color:var(--text-muted)">كلمة المرور الجديدة</label>
      <input type="password" id="pwd-new" placeholder="••••••" style="width:100%;height:44px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;outline:none">
    </div>
    <div style="margin-bottom:1.25rem">
      <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem;color:var(--text-muted)">تأكيد كلمة المرور الجديدة</label>
      <input type="password" id="pwd-confirm" placeholder="••••••" style="width:100%;height:44px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;outline:none">
    </div>
    <div style="display:flex;gap:.5rem">
      <button onclick="submitChangePassword()" style="flex:1;height:44px;border:none;border-radius:10px;background:var(--green);color:white;font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer">✓ حفظ</button>
      <button onclick="closeChangePassword()" style="flex:1;height:44px;border:1px solid var(--border);border-radius:10px;background:white;color:var(--text);font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer">إلغاء</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://rxtjoqulmgkkcohmgzgi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dGpvcXVsbWdra2NvaG1nemdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDQ2OTUsImV4cCI6MjA5NDI4MDY5NX0.QVoJPtlRlRIz9tdhmdTZxHtKxrwAxJq0Je4QHkFKxj0';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_LABELS = {
  admin:'Admin', supervisor:'مشرف', cashier:'كاشير', pharmacist:'صيدلي', driver:'طيار',
  employee:'موظف فرع', manager:'مدير فرع', inventory:'مسؤول جرد', accountant:'محاسب'
};

// صفحات نظام الصيدلية (بتتحمّل بمسار ../ لأنها في جذر الريبو)
const ERP_PAGES = new Set([
  'main.html','transfers.html','inventory.html','notifications.html','offers.html',
  'missing_items.html','inventory_min.html','customers.html','employees.html','dashboard.html',
  'purchases.html','cosmo_order.html','inventory_management.html','price_check.html',
  'customer_service.html','shortages.html','print_invoice.html','sales_contracts.html',
  'claims.html','contracts.html','contracts_stats.html','visa_transactions.html',
  'bank_monitor.html','paymob.html','sms.html','pos_reconciliation.html','machine_import.html'
]);

// بيانات عرض كل صفحة (العنوان + المجموعة + شارة اختيارية)
const PAGE_META = {
  'main.html':{title:'طلب جديد', group:'الصيدلية'},
  'transfers.html':{title:'التحويلات', group:'الصيدلية'},
  'inventory.html':{title:'الجرد', group:'الصيدلية'},
  'notifications.html':{title:'الإشعارات', group:'الصيدلية'},
  'offers.html':{title:'العروض', group:'الصيدلية'},
  'missing_items.html':{title:'لم يصل من الشركات', group:'الصيدلية'},
  'inventory_min.html':{title:'حدود المخزون', group:'الصيدلية'},
  'customers.html':{title:'العملاء', group:'الصيدلية'},
  'employees.html':{title:'الموظفين', group:'الصيدلية'},
  'dashboard.html':{title:'داشبورد', group:'الصيدلية'},
  'purchases.html':{title:'مشتريات', group:'الصيدلية'},
  'cosmo_order.html':{title:'طلبيات الكوزمو والشركات', group:'الصيدلية'},
  'inventory_management.html':{title:'إدارة المخزون', group:'الصيدلية'},
  'price_check.html':{title:'مراجعة السعر لإذون الصرف', group:'الصيدلية'},
  'customer_service.html':{title:'خدمة العملاء', group:'الصيدلية'},
  'shortages.html':{title:'نواقص', group:'الصيدلية'},
  'print_invoice.html':{title:'طباعة فاتورة بيع', group:'الصيدلية'},
  'sales_contracts.html':{title:'فواتير التعاقد', group:'الصيدلية'},
  'claims.html':{title:'مطالبات', group:'الصيدلية'},
  'contracts.html':{title:'لنا فواتير لدى العملاء', group:'الصيدلية'},
  'contracts_stats.html':{title:'إحصائيات التعاقدات', group:'الصيدلية'},
  'visa_transactions.html':{title:'معاملات الفيزا', group:'الصيدلية'},
  'bank_monitor.html':{title:'متابعة البنك', group:'الصيدلية'},
  'paymob.html':{title:'معاملات باي موب', group:'الصيدلية'},
  'sms.html':{title:'معاملات المحافظ', group:'الصيدلية'},
  'pos_reconciliation.html':{title:'تسوية وإغلاق', group:'الصيدلية'},
  'machine_import.html':{title:'استيراد جدول الماكينات', group:'الصيدلية'},

  'overview.html':{title:'نظرة عامة', group:'التوصيل'},
  'operations.html':{title:'غرفة العمليات', group:'التوصيل', badge:'operations'},
  'dispatch.html':{title:'شاشة التوزيع', group:'التوصيل'},
  'orders.html':{title:'الطلبات', group:'التوصيل', badge:'orders'},
  'trips.html':{title:'الرحلات', group:'التوصيل'},
  'drivers.html':{title:'الطيارين', group:'التوصيل'},
  'attendance.html':{title:'الحضور', group:'التوصيل', badge:'attendance'},
  'branches.html':{title:'الفروع', group:'إعدادات التوصيل'},
  'regions.html':{title:'المناطق', group:'إعدادات التوصيل'},
  'routes.html':{title:'خطوط السير', group:'إعدادات التوصيل'},
  'dispatch-settings.html':{title:'إعدادات التوزيع', group:'إعدادات التوصيل'},
  'reports.html':{title:'التقارير', group:'تقارير'},
  'users.html':{title:'المستخدمون', group:'إدارة'},
  'permissions.html':{title:'الصلاحيات', group:'إدارة'},
};

const GROUP_ORDER = ['الصيدلية','التوصيل','إعدادات التوصيل','تقارير','إدارة'];

let currentUser = null;
let currentPage = null;
let allowedPages = [];

window.addEventListener('DOMContentLoaded', async () => {
  const token = localStorage.getItem('authToken');
  const activeUser = localStorage.getItem('activeUser');
  if (!token || !activeUser) { window.location.href = 'auth.html'; return; }

  currentUser = {
    id: activeUser,
    legacyId: localStorage.getItem('legacyId') || null,
    username: activeUser,
    full_name: localStorage.getItem('fullName') || activeUser,
    role: localStorage.getItem('userRole') || '',
    branch: localStorage.getItem('userBranch') || ''
  };

  if (currentUser.role === 'driver') { window.location.href = 'driver.html'; return; }

  document.getElementById('userName').textContent = currentUser.full_name;
  document.getElementById('userRoleLabel').textContent = ROLE_LABELS[currentUser.role] || currentUser.role;
  document.getElementById('userAvatar').textContent = currentUser.full_name?.charAt(0) || 'U';
  document.getElementById('branchName').textContent =
    currentUser.role === 'admin' ? 'كل الفروع' : (currentUser.branch || '—');

  await loadAllowedPages();
  buildSidebar();
  await loadHeaderStats();
  setInterval(loadHeaderStats, 60000);

  const lastPage = sessionStorage.getItem('delivery_last_page');
  const lastTitle = sessionStorage.getItem('delivery_last_title');
  const isLastPageAllowed = lastPage && allowedPages.some(p => p.page === lastPage);
  if (isLastPageAllowed) {
    const navEl = document.querySelector(`[data-page="${lastPage}"]`);
    if (navEl) { navigate(lastPage, lastTitle || lastPage, navEl); return; }
  }
  if (allowedPages.length) {
    const first = allowedPages[0];
    const navEl = document.querySelector(`[data-page="${first.page}"]`);
    navigate(first.page, PAGE_META[first.page]?.title || first.page, navEl);
  }
});

async function loadAllowedPages() {
  try {
    const { data, error } = await db.rpc('get_role_pages', { p_role: currentUser.role });
    if (error) throw error;
    allowedPages = data || [];
  } catch (e) {
    console.error('loadAllowedPages failed', e);
    allowedPages = [];
  }
}

function buildSidebar() {
  const container = document.getElementById('navContainer');
  if (!allowedPages.length) {
    container.innerHTML = '<div class="empty-perms">لا توجد صفحات مسموح بها لدورك حاليًا</div>';
    return;
  }

  const byGroup = {};
  allowedPages.forEach(p => {
    const meta = PAGE_META[p.page];
    if (!meta) return; // صفحة غير معروفة، تجاهلها بأمان
    if (!byGroup[meta.group]) byGroup[meta.group] = [];
    byGroup[meta.group].push({ ...meta, page: p.page });
  });

  let html = '';
  GROUP_ORDER.forEach(group => {
    const items = byGroup[group];
    if (!items || !items.length) return;
    html += `<div class="nav-section-label">${group}</div>`;
    items.forEach(item => {
      const badgeHtml = item.badge
        ? `<span class="nav-badge" id="nav-badge-${item.badge}" style="display:none">0</span>`
        : '';
      html += `
        <button class="nav-item" data-page="${item.page}"
          onclick="navigate('${item.page}', '${item.title.replace(/'/g,"\\'")}', this)">
          <span class="dot"></span>
          ${item.title}
          ${badgeHtml}
        </button>`;
    });
  });

  container.innerHTML = html;
}

async function loadHeaderStats() {
  try {
    const { data } = await db.from('orders').select('status,bill_date,created_at');
    if (!data) return;
    const pending = data.filter(o => o.status === 'pending').length;
    const picked  = data.filter(o => o.status === 'picked').length;
    const late    = data.filter(o => {
      if (['completed','cancelled','delivered'].includes(o.status)) return false;
      return (new Date() - new Date(o.bill_date || o.created_at)) / 60000 > 30;
    }).length;

    const ordersBadge = document.getElementById('nav-badge-orders');
    if (ordersBadge) { ordersBadge.textContent = pending; ordersBadge.style.display = pending > 0 ? 'inline-block' : 'none'; }

    const statsEl = document.getElementById('headerStats');
    if (statsEl) {
      statsEl.innerHTML = `
        <span class="hstat hstat-pending">${pending} جاهز</span>
        <span class="hstat hstat-picked">${picked} رحلة</span>
        ${late > 0 ? `<span class="hstat hstat-late">⚠️ ${late} متأخر</span>` : ''}
      `;
    }
  } catch (e) {
    console.warn('loadHeaderStats failed (طبيعي لو الصفحة الحالية من نظام الصيدلية)', e);
  }
}

function navigate(page, title, el) {
  if (currentPage === page) return;
  currentPage = page;
  sessionStorage.setItem('delivery_last_page', page);
  sessionStorage.setItem('delivery_last_title', title);
  document.getElementById('pageTitle').textContent = title;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  showLoading(true);
  const src = ERP_PAGES.has(page) ? `../${page}` : `pages/${page}`;
  document.getElementById('mainFrame').src = src;
  if (window.innerWidth <= 768) closeSidebar();
}

function frameLoaded() { showLoading(false); }

function reloadCurrentPage() {
  if (!currentPage) return;
  showLoading(true);
  const src = ERP_PAGES.has(currentPage) ? `../${currentPage}` : `pages/${currentPage}`;
  document.getElementById('mainFrame').src = src;
}

function showLoading(show) {
  document.getElementById('pageLoading').classList.toggle('hidden', !show);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function logout() {
  localStorage.removeItem('authToken');
  localStorage.removeItem('activeUser');
  localStorage.removeItem('userBranch');
  localStorage.removeItem('userRole');
  localStorage.removeItem('fullName');
  localStorage.removeItem('legacyId');
  localStorage.removeItem('loginTime');
  sessionStorage.removeItem('delivery_last_page');
  sessionStorage.removeItem('delivery_last_title');
  window.location.href = 'auth.html';
}

function openChangePassword(){
  if (!currentUser?.legacyId) {
    alert('تغيير كلمة المرور من هنا متاح حاليًا بس للحسابات القديمة بتاعة نظام التوصيل. للحسابات التانية، غيّرها من نظام الصيدلية.');
    return;
  }
  document.getElementById('pwd-old').value='';
  document.getElementById('pwd-new').value='';
  document.getElementById('pwd-confirm').value='';
  document.getElementById('pwdOverlay').style.display='flex';
}
function closeChangePassword(){
  document.getElementById('pwdOverlay').style.display='none';
}
async function submitChangePassword(){
  const oldP=document.getElementById('pwd-old').value.trim();
  const newP=document.getElementById('pwd-new').value.trim();
  const confirmP=document.getElementById('pwd-confirm').value.trim();
  if(!oldP||!newP||!confirmP){alert('املأ كل الخانات');return;}
  if(newP!==confirmP){alert('كلمة المرور الجديدة وتأكيدها غير متطابقين');return;}
  if(newP.length<4){alert('كلمة المرور الجديدة قصيرة جداً (4 أحرف على الأقل)');return;}
  try{
    const {data,error}=await db.rpc('change_user_password',{
      p_user_id:currentUser.legacyId,
      p_old_password:oldP,
      p_new_password:newP
    });
    if(error)throw error;
    if(data?.success){
      closeChangePassword();
      alert('✓ تم تغيير كلمة المرور بنجاح');
    } else {
      alert(data?.error||'حدث خطأ');
    }
  }catch(e){
    console.error(e);
    alert('حدث خطأ في تغيير كلمة المرور');
  }
}

window.addEventListener('message', (e) => {
  if (e.data?.type === 'navigate') {
    const el = document.querySelector(`[data-page="${e.data.page}"]`);
    if (el) navigate(e.data.page, e.data.title, el);
  }
  if (e.data?.type === 'refreshStats') loadHeaderStats();
  if (e.data?.type === 'dispatchStats') {
    const s = e.data.stats || {};
    const statsEl = document.getElementById('headerStats');
    if (statsEl) {
      statsEl.innerHTML = `
        <span class="hstat hstat-pending">📦 ${s.unassigned||0} غير موزع</span>
        <span class="hstat hstat-picked">🚗 ${s.inTransit||0} في الطريق</span>
        ${s.late>0 ? `<span class="hstat hstat-late">⚠️ ${s.late} متأخر</span>` : ''}
        <span class="hstat hstat-picked" style="background:var(--purple-light);color:#6d28d9">👤 ${s.available||0} متاح</span>
        ${s.unknownRegions>0 ? `<span class="hstat hstat-late">⚠️ ${s.unknownRegions} منطقة غير مسجلة</span>` : ''}
      `;
    }
  }
});
</script>
