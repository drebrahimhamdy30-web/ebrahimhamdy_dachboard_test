<head>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg,#f1f5f9);color:var(--text,#0f172a)}
.top{position:sticky;top:0;background:var(--primary,#1a56db);color:#fff;padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;z-index:6}
.top h1{font-size:1.05rem;margin:0}
.top .b{font-size:.75rem;opacity:.92;margin-top:.1rem}
.logout{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:.35rem .8rem;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.bar{position:sticky;top:52px;background:var(--bg,#f1f5f9);z-index:5;padding:.6rem .8rem .2rem;max-width:640px;margin:0 auto}
.tabs{display:flex;gap:.5rem;margin-bottom:.5rem}
.ptab{flex:1;padding:.55rem .25rem;border-radius:12px;border:2px solid var(--border,#e5e7eb);background:var(--surface,#fff);color:var(--text-muted,#64748b);font-weight:800;font-size:.76rem;cursor:pointer;font-family:'Cairo',sans-serif;display:flex;align-items:center;justify-content:center;gap:.25rem}
.ptab.active{border-color:var(--primary,#1a56db);color:var(--primary,#1a56db);background:#eff6ff}
body.dark .ptab.active{background:#0f2748}
.ptab .cnt{background:var(--primary,#1a56db);color:#fff;border-radius:10px;padding:.02rem .4rem;font-size:.72rem}
.search{width:100%;padding:.6rem .8rem;border-radius:10px;border:1.5px solid var(--border,#e5e7eb);background:var(--surface,#fff);color:var(--text,#0f172a);font-family:'Cairo',sans-serif;font-size:.9rem}
.wrap{max-width:640px;margin:0 auto;padding:.2rem .8rem 1rem}
.count{font-size:.8rem;font-weight:800;margin:.3rem 0 .6rem;color:var(--text-muted)}
.card{background:var(--surface,#fff);border:1px solid var(--border,#e5e7eb);border-right:6px solid #b45309;border-radius:14px;padding:.8rem .9rem;margin-bottom:.7rem;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.card:active{transform:scale(.995)}
.hint{font-size:.66rem;color:var(--text-muted);margin-top:.35rem;opacity:.8}
.card.old{border-right-color:#dc2626}
.card.ready{border-right-color:#16a34a}
.card.held{border-right-color:#64748b;opacity:.92}
.nm{font-weight:800;font-size:1.05rem}
.meta{font-size:.8rem;color:var(--text-muted);margin-top:.3rem;line-height:1.85}
.wait{font-weight:900}
.btn{width:100%;margin-top:.65rem;padding:.75rem;border:none;border-radius:10px;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;font-family:'Cairo',sans-serif}
.btn-done{background:#16a34a}
.btn-return{background:#b45309}
.btn-hold{background:#64748b}
.btn-resume{background:#0d9488}
.btn-skip{background:#94a3b8}
.btns{display:flex;gap:.5rem;margin-top:.65rem}
.btns .btn{margin-top:0}
.btns .btn-done{flex:2}
.btns .btn-hold{flex:1}
.btns .btn-skip{flex:1}
.btn:disabled{opacity:.6}
.empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:.95rem}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:.12rem .45rem;border-radius:6px;margin-top:.15rem}
.tag-drv{background:#e0e7ff;color:#4338ca}
.tag-pool{background:#fef3c7;color:#b45309}
.tag-warn{background:#fee2e2;color:#b91c1c}
/* شريط الشيفت */
.shiftbar{max-width:640px;margin:.6rem auto 0;padding:0 .8rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.sb-inp{flex:1;min-width:120px;padding:.55rem .7rem;border-radius:10px;border:1.5px solid var(--border,#e5e7eb);background:var(--surface,#fff);color:var(--text,#0f172a);font-family:'Cairo',sans-serif;font-size:.9rem}
.sb-go{background:var(--primary,#1a56db);color:#fff;border:none;border-radius:10px;padding:.55rem 1.1rem;font-weight:800;font-family:'Cairo',sans-serif;cursor:pointer}
.sb-on{flex:1;display:flex;align-items:center;gap:.4rem;background:#ecfdf5;color:#15803d;border:1px solid #bbf7d0;border-radius:10px;padding:.45rem .7rem;font-size:.82rem;font-weight:800}
.sb-end{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:9px;padding:.45rem .85rem;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;white-space:nowrap}
.needshift{max-width:640px;margin:0 auto;text-align:center;padding:2.5rem 1rem;color:var(--text-muted,#64748b);font-size:.95rem;line-height:1.9}
/* بانر الإشعار */
.notif{position:fixed;top:62px;left:50%;transform:translateX(-50%);width:92%;max-width:600px;background:#16a34a;color:#fff;border-radius:12px;padding:.7rem 1rem;font-weight:800;font-size:.92rem;box-shadow:0 10px 34px rgba(0,0,0,.28);z-index:30;display:none;cursor:pointer;text-align:center}
.notif.show{display:block;animation:nfpop .25s}
@keyframes nfpop{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.card.fresh{box-shadow:0 0 0 3px #16a34a inset;animation:flash 1.2s ease-in-out 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 3px #16a34a inset}50%{box-shadow:0 0 0 3px rgba(22,163,74,.2) inset}}
/* مودال الأصناف */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--surface,#fff);width:100%;max-width:640px;max-height:85vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-hd{padding:.8rem 1rem;border-bottom:1px solid var(--border,#e5e7eb);display:flex;justify-content:space-between;align-items:center;gap:.5rem;position:sticky;top:0;background:var(--surface,#fff)}
.sheet-hd h3{margin:0;font-size:.95rem;font-weight:800}
.sheet-x{background:var(--border,#e5e7eb);border:none;color:var(--text,#0f172a);width:30px;height:30px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:800}
.sheet-bd{padding:.6rem 1rem 1.2rem;overflow-y:auto}
.ihead{display:flex;justify-content:space-between;font-size:.68rem;font-weight:800;color:var(--text-muted);padding:.3rem 0;border-bottom:2px solid var(--border,#e5e7eb)}
.irow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem .1rem;border-bottom:1px solid var(--border,#eef2f7)}
.inm{font-weight:700;font-size:.9rem}
.iunit{color:var(--text-muted);font-weight:600;font-size:.75rem}
.iqp{display:flex;gap:.4rem;align-items:center;white-space:nowrap}
.iq{background:#0A3D62;color:#fff;font-weight:800;font-size:.75rem;padding:.1rem .45rem;border-radius:6px}
.ip{color:#b45309;font-weight:700;font-size:.78rem}
.il{color:#16a34a;font-weight:800;font-size:.82rem;min-width:64px;text-align:left}
.istk{display:inline-block;margin-top:.25rem;font-size:.72rem;font-weight:800;padding:.1rem .45rem;border-radius:6px}
.istk-ok{background:#ecfdf5;color:#15803d}
.istk-low{background:#fef3c7;color:#b45309}
.istk-no{background:#fee2e2;color:#b91c1c}
.istk-na{background:#f1f5f9;color:#64748b}
.itot{margin-top:.6rem;padding-top:.5rem;border-top:2px solid var(--border,#e5e7eb);font-weight:800;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="top">
  <div><h1>🧪 تحضير الطلبات</h1><div class="b" id="branchLbl"></div></div>
  <button class="logout" onclick="doLogout()">خروج</button>
</div>
<div class="shiftbar" id="shiftbar"></div>
<div class="notif" id="notif" onclick="onNotifClick()"></div>
<div class="needshift" id="noShift" style="display:none">⏱️ اكتب اسمك وابدأ شيفت التحضير عشان تبدأ،<br>وهيوصلك إشعار بأي طلب جديد يدخل التحضير أثناء الشيفت.</div>
<div id="main" style="display:none">
<div class="bar">
  <div class="tabs">
    <button class="ptab active" data-t="prep" onclick="setTab('prep')">🧪 تحت التجهيز <span class="cnt" id="cnt-prep">0</span></button>
    <button class="ptab" data-t="ready" onclick="setTab('ready')">📦 اتحضّر <span class="cnt" id="cnt-ready">0</span></button>
    <button class="ptab" data-t="hold" onclick="setTab('hold')">⏸️ موقوف <span class="cnt" id="cnt-hold">0</span></button>
    <button class="ptab" data-t="skipped" onclick="setTab('skipped')">🚫 مستثناة <span class="cnt" id="cnt-skipped">0</span></button>
  </div>
  <input type="text" class="search" id="search" placeholder="🔎 بحث بكود العميل أو الاسم" oninput="render()">
</div>
<div class="wrap">
  <div class="count" id="count">جاري التحميل…</div>
  <div id="list"></div>
</div>
</div><!-- /#main -->
<div class="ov" id="itemsOv" onclick="if(event.target===this)closeItems()">
  <div class="sheet">
    <div class="sheet-hd"><h3 id="itemsTitle">أصناف الطلب</h3><button class="sheet-x" onclick="closeItems()">✕</button></div>
    <div class="sheet-bd" id="itemsBody"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js?v=20260904c"></script>
<script src="../session.js?v=20261119"></script>
<script src="../branches.js?v=20260904d"></script>
<script src="../brand.js?v=20261017n"></script>
<script src="supabase-config.js?v=20260901"></script>
<script src="permissions.js"></script>
<script>
let currentUser=null, branchId=null, tab='prep', allRows=[];
function doLogout(){ try{ logout(); }catch(e){ location.href='auth.html'; } }

/* ===== شيفت التحضير + الإشعارات (نفس فكرة شاشة المراجعة) ===== */
let prepShift=null;          // { id, preparer_name, started_at }
let pollTimer=null;          // مؤقّت التحديث — يشتغل أثناء الشيفت بس
let prevPrepIds=null;        // أكواد طلبات التحضير في آخر فحص (للإشعار)
let notifTarget=null;        // الطلب اللي الإشعار بيوجّهله
let titleTimer=null;
const SHIFT_KEY='phalix_prep_shift';
const TITLE_BASE='تحضير الطلبات';

// اسم من يُنسب له الإجراء: اسم شيفت التحضير أولًا، وإلا حساب الدخول
function actorName(){ return (prepShift&&prepShift.preparer_name) || (currentUser&&currentUser.full_name) || 'المحضّر'; }
function fmtClock(iso){ try{ return new Date(iso).toLocaleTimeString('ar-EG',{timeZone:'Africa/Cairo',hour:'numeric',minute:'2-digit',hour12:true}); }catch(e){ return ''; } }

function renderShiftBar(){
  const bar=document.getElementById('shiftbar');
  if(prepShift){
    bar.innerHTML=`<div class="sb-on">🟢 شيفت التحضير: <b>${esc(prepShift.preparer_name)}</b> — من ${fmtClock(prepShift.started_at)}</div>
      <button class="sb-end" onclick="endShift()">إنهاء الشيفت</button>`;
  }else{
    bar.innerHTML=`<input class="sb-inp" id="prepName" placeholder="اسم المحضّر" value="${esc((currentUser&&currentUser.full_name)||'')}" onkeydown="if(event.key==='Enter')startShift()">
      <button class="sb-go" onclick="startShift()">ابدأ شيفت التحضير</button>`;
  }
}

async function startShift(){
  const el=document.getElementById('prepName');
  const nm=(el&&el.value||'').trim();
  if(!nm){ alert('اكتب اسم المحضّر الأول'); return; }
  const btn=document.querySelector('.sb-go'); if(btn){ btn.disabled=true; btn.textContent='…'; }
  try{
    const { data, error } = await db.from('prep_shifts')
      .insert({ preparer_name:nm, branch_id:branchId, started_by:(currentUser&&currentUser.full_name)||nm })
      .select().single();
    if(error) throw error;
    prepShift={ id:data.id, preparer_name:data.preparer_name, started_at:data.started_at };
    try{ localStorage.setItem(SHIFT_KEY, JSON.stringify(prepShift)); }catch(_){}
    applyShiftUI();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='ابدأ شيفت التحضير'; } alert('تعذّر بدء الشيفت: '+(e.message||'حاول تاني')); }
}

async function endShift(){
  if(!confirm('إنهاء شيفت التحضير؟')) return;
  const id=prepShift&&prepShift.id;
  prepShift=null; prevPrepIds=null;
  try{ localStorage.removeItem(SHIFT_KEY); }catch(_){}
  hideNotif();
  applyShiftUI();
  if(id){ try{ await db.from('prep_shifts').update({ ended_at:new Date().toISOString() }).eq('id',id); }catch(_){} }
}

// يفتح/يقفل محتوى الشاشة حسب وجود شيفت فعّال، ويضبط مؤقّت التحديث
function applyShiftUI(){
  renderShiftBar();
  const on=!!prepShift;
  document.getElementById('main').style.display = on?'block':'none';
  document.getElementById('noShift').style.display = on?'none':'block';
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(on){
    prevPrepIds=null;           // أول فحص بيسجّل الأساس من غير إشعار
    load(); notifyCheck();
    pollTimer=setInterval(()=>{ load(); notifyCheck(); }, 20000);
  }
}

/* ===== الإشعار المرئي بظهور طلب جديد للتحضير ===== */
// فحص خفيف مستقل عن التبويب الحالي: لو ظهر طلب جديد في طابور التحضير
// بعد بدء الشيفت → بانر إشعار + وميض عنوان التبويب (الصوت مؤجّل لحد
// ما نحوّلها لتطبيق). بيشتغل على نفس مؤقّت الـ20 ثانية.
async function notifyCheck(){
  if(!prepShift) return;
  try{
    let q=db.from('orders').select('id,customer_name,cust_name,created_at')
      .is('prep_done_at',null).not('prep_hold','is',true).is('prep_excluded_at',null)
      .in('status',['pending','assigned','postponed']);
    if(branchId) q=q.eq('branch_id',branchId);
    const { data, error } = await q.limit(400);
    if(error) return;
    const rows=data||[];
    const ids=new Set(rows.map(r=>r.id));
    if(prevPrepIds===null){ prevPrepIds=ids; return; }   // الأساس
    const started=new Date(prepShift.started_at).getTime();
    const fresh=rows.filter(r=> !prevPrepIds.has(r.id) && new Date(r.created_at).getTime() >= started-1000);
    prevPrepIds=ids;
    if(fresh.length) notifyNew(fresh);
  }catch(e){}
}

function notifyNew(fresh){
  const newest=fresh[fresh.length-1];
  notifTarget=newest.id;
  const nm=esc(newest.customer_name||newest.cust_name||'عميل');
  const extra=fresh.length>1?` <span style="opacity:.85">(+${fresh.length-1} كمان)</span>`:'';
  const n=document.getElementById('notif');
  n.innerHTML=`🔔 طلب جديد للتحضير: <b>${nm}</b>${extra} — اضغط للعرض`;
  n.classList.add('show');
  flashTitle(fresh.length);
}
function hideNotif(){ const n=document.getElementById('notif'); if(n) n.classList.remove('show'); }
function flashTitle(n){
  if(titleTimer) clearInterval(titleTimer);
  let on=false, t=0;
  titleTimer=setInterval(()=>{
    document.title = on ? TITLE_BASE : ('🔔 '+n+' طلب جديد للتحضير');
    on=!on;
    if(++t>8){ clearInterval(titleTimer); titleTimer=null; document.title=TITLE_BASE; }
  }, 700);
}
// الضغط على البانر: يروح لتبويب التحضير ويوصّل للطلب ويلوّنه
function onNotifClick(){
  const target=notifTarget; hideNotif();
  if(tab!=='prep') setTab('prep');
  let tries=0;
  const iv=setInterval(()=>{ if(highlightOrder(target) || ++tries>25){ clearInterval(iv); } }, 150);
}
function highlightOrder(id){
  if(!id) return true;
  const el=document.querySelector('[data-oid="'+id+'"]');
  if(!el) return false;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.add('fresh');
  setTimeout(()=>el.classList.remove('fresh'), 3200);
  return true;
}
function _mins(t){ return Math.max(0, Math.floor((Date.now()-new Date(t))/60000)); }
function fm(m){ return m<60?(m+' د'):(Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' س'); }
// اسم الدكتور اللي عمل الفاتورة (موجود في الطلب نفسه) — المحضّر
// بيحتاجه لو حب يراجع معاه في صنف أو سعر
function docLine(o){
  const d=String(o&&o.employee_name||'').trim();
  return d ? ('🩺 <b>'+esc(d)+'</b><br>') : '';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ===== أصناف الطلب (اسم/كمية/سعر البيع) =====
const SALES_ITEMS_WEBHOOK='https://agent.ebrahimhamdy.com/webhook/sales_item';
const itemsCache={}, stockCache={};
// خريطة فرع→حرف (m/s/b/f) عشان نعرف عمود الرصيد المناسب في stock_flat
let BRANCH_LETTER={};
async function loadBranchLetters(){
  try{ const {data}=await db.from('branches').select('id,letter');
    (data||[]).forEach(b=>{ if(b.letter) BRANCH_LETTER[b.id]=String(b.letter).toLowerCase(); });
  }catch(e){}
}
// رصيد الأصناف الحالي في فرع الطلب — من stock_flat (عمود <حرف الفرع>_q)
async function fetchStock(items, branchId){
  const map={};
  const letter=BRANCH_LETTER[branchId];
  if(!letter || !/^[a-z]$/.test(letter)) return map;
  const codes=[...new Set((items||[]).map(i=>String(i.code||'')).filter(Boolean))];
  if(!codes.length) return map;
  try{
    // data-ok: أصناف فاتورة واحدة (عشرات على الأكثر) — مش معرّضة لسقف الألف
    const { data } = await db.from('stock_flat').select('itm_code,u,'+letter+'_q').in('itm_code',codes);
    (data||[]).forEach(r=>{ map[String(r.itm_code)]={ q:Number(r[letter+'_q'])||0, u:r.u||'' }; });
  }catch(e){}
  return map;
}
function closeItems(){ document.getElementById('itemsOv').classList.remove('open'); }
function stkBadge(it, stock){
  if(!stock) return '';                                  // لسه بيحمّل الرصيد
  const st=stock[String(it.code||'')];
  if(!st) return '<div class="istk istk-na">الرصيد غير متاح</div>';
  const sq=Number(st.q)||0, req=Number(it.qty)||0;
  const unitSame = st.u && it.unit && String(st.u).trim()===String(it.unit).trim();
  if(sq<=0) return '<div class="istk istk-no">⚠️ غير متوفر في المخزون</div>';
  if(unitSame && sq<req) return `<div class="istk istk-low">⚠️ الرصيد ${sq.toLocaleString()} ${esc(st.u)} — أقل من المطلوب</div>`;
  return `<div class="istk istk-ok">الرصيد: ${sq.toLocaleString()}${st.u?' '+esc(st.u):''}</div>`;
}
function renderItems(items, stock){
  if(!items||!items.length) return '<div class="empty">لا توجد أصناف في الفاتورة</div>';
  let total=0;
  const rows=items.map(it=>{
    const q=Number(it.qty)||0, p=Number(it.price)||0, line=q*p; total+=line;
    return `<div class="irow">
      <div class="inm">${esc(it.name||'—')}${it.unit?` · <span class="iunit">${esc(it.unit)}</span>`:''}${stkBadge(it,stock)}</div>
      <div class="iqp"><span class="iq">×${esc(it.qty)}</span><span class="ip">${p.toLocaleString()} ج</span><span class="il">${line.toLocaleString()} ج</span></div>
    </div>`;
  }).join('');
  return `<div class="ihead"><span>الصنف · الرصيد الحالي</span><span>كمية · سعر · إجمالي</span></div>${rows}<div class="itot"><span>الإجمالي (${items.length} صنف)</span><span>${total.toLocaleString()} ج</span></div>`;
}
async function openItems(oid){
  const o=allRows.find(x=>x.id===oid); if(!o) return;
  const body=document.getElementById('itemsBody');
  document.getElementById('itemsTitle').innerHTML='🧾 أصناف '+esc(o.customer_name||o.cust_name||'—')+(o.bill_no?` · فاتورة ${esc(o.bill_no)}`:'');
  document.getElementById('itemsOv').classList.add('open');
  if(itemsCache[oid]){ body.innerHTML=renderItems(itemsCache[oid], stockCache[oid]); return; }
  if(!o.bill_no){ body.innerHTML='<div class="empty">لا يوجد رقم فاتورة لهذا الطلب</div>'; return; }
  body.innerHTML='<div class="empty">⏳ جاري جلب الأصناف…</div>';
  try{
    const r=await fetch(SALES_ITEMS_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({branch_id:o.branch_id||'',bill_no:String(o.bill_no)})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    const root=Array.isArray(data)?(data[0]||{}):(data||{});
    const bills=(root&&root.Data)||[];
    const bill=bills.find(b=>String(b.bill_no)===String(o.bill_no))||bills[0]||{};
    const raw=(bill&&bill.Items)||[];
    const items=raw.map(it=>({ code:String(it.itm_code||'').trim(), name:(it.itm_name_ar||it.itm_name_en||'').toString().trim(), qty:it.itm_qty, unit:it.unit_name||'', price:it.unit_price }));
    itemsCache[oid]=items;
    body.innerHTML=renderItems(items);                       // الأصناف فورًا
    const stock=await fetchStock(items, o.branch_id);        // الرصيد بعدها
    stockCache[oid]=stock;
    if(document.getElementById('itemsOv').classList.contains('open')) body.innerHTML=renderItems(items, stock);
  }catch(e){
    body.innerHTML='<div class="empty" style="color:#dc2626">❌ تعذّر جلب الأصناف<br><span style="font-size:.75rem">'+esc(e&&e.message||e)+'</span></div>';
  }
}

async function resolveBranch(){
  if(currentUser.branch_id) return currentUser.branch_id;
  if(currentUser.branch){ try{ const {data}=await db.from('branches').select('id').eq('name',currentUser.branch).maybeSingle(); return data&&data.id||null; }catch(e){} }
  return null;
}

function setTab(t){
  tab=t;
  document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  load();
}

async function refreshCounts(){
  try{
    // .is('prep_excluded_at',null) في كل نداء: الطلب اللي اتشال من الشاشة
    // (الصيدلي حضّره / خارج وقت المحضّر) مايظهرش ومايتعدّش
    let q1=db.from('orders').select('id',{count:'exact',head:true}).is('prep_done_at',null).not('prep_hold','is',true).is('prep_excluded_at',null).in('status',['pending','assigned','postponed']);
    let q2=db.from('orders').select('id',{count:'exact',head:true}).not('prep_done_at','is',null).is('picked_at',null).is('prep_excluded_at',null).in('status',['pending','assigned','postponed']);
    let q3=db.from('orders').select('id',{count:'exact',head:true}).is('prep_done_at',null).is('prep_hold',true).is('prep_excluded_at',null).in('status',['pending','assigned','postponed']);
    let q4=db.from('orders').select('id',{count:'exact',head:true}).not('prep_excluded_at','is',null).in('status',['pending','assigned','postponed']);
    if(branchId){ q1=q1.eq('branch_id',branchId); q2=q2.eq('branch_id',branchId); q3=q3.eq('branch_id',branchId); q4=q4.eq('branch_id',branchId); }
    const [r1,r2,r3,r4]=await Promise.all([q1,q2,q3,q4]);
    document.getElementById('cnt-prep').textContent = r1.count||0;
    document.getElementById('cnt-ready').textContent = r2.count||0;
    document.getElementById('cnt-hold').textContent = r3.count||0;
    document.getElementById('cnt-skipped').textContent = r4.count||0;
  }catch(e){}
}

async function load(){
  document.getElementById('count').textContent='جاري التحميل…';
  let q=db.from('orders').select('*');
  if(branchId) q=q.eq('branch_id',branchId);
  if(tab==='prep'){
    // كل طلب مش متحضّر ولسه ماتستلمش (جاهز/متعيّن/مؤجّل) — عشان مفيش طلب مش متحضّر يختفي
    q=q.is('prep_done_at',null).not('prep_hold','is',true).is('prep_excluded_at',null).in('status',['pending','assigned','postponed']).order('created_at',{ascending:true});
  }else if(tab==='hold'){
    q=q.is('prep_done_at',null).is('prep_hold',true).is('prep_excluded_at',null).in('status',['pending','assigned','postponed']).order('created_at',{ascending:true});
  }else if(tab==='skipped'){
    // الطلبات اللي اتشالت من الشاشة ولسه مفتوحة — عشان الرجوع ينفع
    q=q.not('prep_excluded_at','is',null).in('status',['pending','assigned','postponed']).order('prep_excluded_at',{ascending:false});
  }else{
    q=q.not('prep_done_at','is',null).is('picked_at',null).is('prep_excluded_at',null)
       .in('status',['pending','assigned','postponed']).order('prep_done_at',{ascending:false});
  }
  const { data, error } = await q.limit(300);
  if(error){ document.getElementById('count').textContent='تعذّر التحميل — تأكد من الاتصال'; allRows=[]; render(); return; }
  allRows=data||[];
  render();
  refreshCounts();
}

// نصوص كل تبويب — كانت مكتوبة على تبويبين بس، فتبويب «موقوف» كان
// بيقول «لا توجد طلبات متحضّرة بانتظار الطيار» وهو فاضي
const TAB_EMPTY = {
  prep:   '✅ لا توجد طلبات تحت التجهيز حاليًا',
  ready:  'لا توجد طلبات متحضّرة بانتظار الطيار',
  hold:   'مفيش طلبات موقوفة',
  skipped:'مفيش طلبات متشالة من الشاشة'
};
const TAB_COUNT = {
  prep:   ' طلب تحت التجهيز — الأقدم فوق',
  ready:  ' طلب متحضّر بانتظار استلام الطيار',
  hold:   ' طلب موقوف',
  skipped:' طلب اتشال من شاشة التحضير — الأحدث فوق'
};

function render(){
  const term=(document.getElementById('search').value||'').trim().toLowerCase();
  let rows=allRows;
  if(term) rows=rows.filter(o=>
    String(o.cust_code||'').toLowerCase().includes(term) ||
    String(o.customer_name||o.cust_name||'').toLowerCase().includes(term));

  const list=document.getElementById('list');
  if(!rows.length){
    document.getElementById('count').textContent='';
    list.innerHTML='<div class="empty">'+(term?'مفيش نتيجة للبحث ده':(TAB_EMPTY[tab]||'لا يوجد'))+'</div>';
    return;
  }
  document.getElementById('count').textContent = rows.length + (TAB_COUNT[tab]||' طلب');

  list.innerHTML=rows.map((o,i)=>{
    if(tab==='prep'||tab==='hold'){
      const w=_mins(o.created_at); const old=tab==='prep'&&((i===0&&!term)||w>=20);
      const skipBtn = `<button class="btn btn-skip" onclick="event.stopPropagation();excludeOrder('${o.id}',this)" title="يشيله من الشاشة من غير ما يتحسب تحضير">🚫 إزالة</button>`;
      const btns = tab==='prep'
        ? `<div class="btns">
             <button class="btn btn-done" onclick="event.stopPropagation();markDone('${o.id}',this)">✓ تم التحضير</button>
             <button class="btn btn-hold" onclick="event.stopPropagation();holdOrder('${o.id}',this)">⏸ إيقاف</button>
             ${skipBtn}
           </div>`
        : `<div class="btns">
             <button class="btn btn-resume" onclick="event.stopPropagation();resumeOrder('${o.id}',this)">▶ استئناف التحضير</button>
             ${skipBtn}
           </div>`;
      return `<div class="card ${old?'old':''} ${tab==='hold'?'held':''}" data-oid="${o.id}" onclick="openItems('${o.id}')">
        <div class="nm">${esc(o.customer_name||o.cust_name||'—')}</div>
        <div class="meta">
          🧾 <b>${esc(o.bill_no||'—')}</b> · كود ${esc(o.cust_code||'—')} · 💰 ${Number(o.total_bill_net||0).toLocaleString()} ج<br>
          ${docLine(o)}
          📍 ${esc(o.cust_region||'—')}<br>
          🏠 ${esc(o.customer_address||o.cust_address||'—')}<br>
          ${o.driver_id?`<span class="tag tag-warn">⚠️ متعيّن لطيار (${esc(o.deliveryman||'—')}) — لسه متحضّر!</span><br>`:(o.status==='postponed'?`<span class="tag tag-pool">⏰ مؤجّل — لسه متحضّر</span><br>`:'')}
          ⏱ ${tab==='prep'?'منتظر تحضير':'موقوف من'}: <span class="wait" style="color:${tab==='prep'&&w>=20?'#dc2626':'#b45309'}">${fm(w)}</span>
        </div>
        <div class="hint">👆 اضغط لعرض الأصناف والأسعار</div>
        ${btns}
      </div>`;
    }else if(tab==='skipped'){
      const w=_mins(o.prep_excluded_at);
      return `<div class="card held" data-oid="${o.id}" onclick="openItems('${o.id}')">
        <div class="nm">${esc(o.customer_name||o.cust_name||'—')}</div>
        <div class="meta">
          🧾 <b>${esc(o.bill_no||'—')}</b> · كود ${esc(o.cust_code||'—')} · 💰 ${Number(o.total_bill_net||0).toLocaleString()} ج<br>
          ${docLine(o)}
          📍 ${esc(o.cust_region||'—')}<br>
          🚫 شاله: <b>${esc(o.prep_excluded_by||'—')}</b> · من <span class="wait">${fm(w)}</span>
        </div>
        <div class="hint">👆 اضغط لعرض الأصناف والأسعار</div>
        <button class="btn btn-resume" onclick="event.stopPropagation();unexcludeOrder('${o.id}',this)">↩ رجوع للتحضير</button>
      </div>`;
    }else{
      const w=_mins(o.prep_done_at);
      const withDrv=!!o.driver_id;
      return `<div class="card ready" data-oid="${o.id}" onclick="openItems('${o.id}')">
        <div class="nm">${esc(o.customer_name||o.cust_name||'—')}</div>
        <div class="meta">
          🧾 <b>${esc(o.bill_no||'—')}</b> · كود ${esc(o.cust_code||'—')} · 💰 ${Number(o.total_bill_net||0).toLocaleString()} ج<br>
          ${docLine(o)}
          📍 ${esc(o.cust_region||'—')}<br>
          ${withDrv?`<span class="tag tag-drv">🚗 مع الطيار: ${esc(o.deliveryman||'—')} — لسه ماستلمش</span>`:`<span class="tag tag-pool">📋 في التوزيع — بانتظار طيار</span>`}<br>
          ✅ اتحضّر من: <span class="wait">${fm(w)}</span>
        </div>
        <div class="hint">👆 اضغط لعرض الأصناف والأسعار</div>
        <button class="btn btn-return" onclick="event.stopPropagation();returnToPrep('${o.id}',this)">↩ رجوع للتحضير</button>
      </div>`;
    }
  }).join('');
}

async function markDone(id, btn){
  btn.disabled=true; btn.textContent='… جاري الحفظ';
  try{
    const _now=new Date().toISOString();
    const { error } = await db.from('orders').update({ prep_done_at:_now }).eq('id',id);
    if(error) throw error;
    try{ await db.from('order_logs').insert({ order_id:id, event:'order_prepared', details:{ by:'prep', shift_id:(prepShift&&prepShift.id)||null }, user_name:actorName() }); }catch(_){}
    allRows=allRows.filter(o=>o.id!==id);
    render();
  }catch(e){ btn.disabled=false; btn.textContent='✓ تم التحضير'; alert('تعذّر الحفظ — حاول تاني'); }
}

/* «إزالة»: الطلب يختفي من شاشة التحضير وبس — حالته ورحلته وطياره
   زي ما هم بالظبط، ومابيتكتبش سجل «تم التحضير» فماتأثرش على تقارير
   المحضّرين. بيتسجّل حدث prep_excluded باسم اللي شاله، فيبان في
   تتبّع الطلب. الحراسة على السيرفر (المحضّر ومدير الفرع والأدمن). */
async function excludeOrder(id, btn){
  if(!confirm('إزالة الطلب من شاشة التحضير؟\n\nالطلب هيفضل زي ما هو بالظبط (حالته ورحلته) — هو بس هيختفي من الشاشة دي، ومش هيتحسب تحضير.')) return;
  btn.disabled=true; btn.textContent='…';
  try{
    const { data, error } = await db.rpc('prep_exclude_order',{ p_order_id:id, p_user_name:actorName() });
    if(error) throw error;
    if(data && data.success===false) throw new Error(data.error||'تعذّر');
    allRows=allRows.filter(o=>o.id!==id); render(); refreshCounts();
  }catch(e){ btn.disabled=false; btn.textContent='🚫 إزالة'; alert('تعذّر: '+(e.message||'حاول تاني')); }
}

// رجوع الطلب لشاشة التحضير (لو اتشال بالغلط) — بيمسح علامة الاستثناء
// ويتسجّل حدث prep_unexcluded في تتبّع الطلب
async function unexcludeOrder(id, btn){
  btn.disabled=true; btn.textContent='…';
  try{
    const { data, error } = await db.rpc('prep_unexclude_order',{ p_order_id:id, p_user_name:actorName() });
    if(error) throw error;
    if(data && data.success===false) throw new Error(data.error||'تعذّر');
    allRows=allRows.filter(o=>o.id!==id); render(); refreshCounts();
  }catch(e){ btn.disabled=false; btn.textContent='↩ رجوع للتحضير'; alert('تعذّر: '+(e.message||'حاول تاني')); }
}

async function holdOrder(id, btn){
  btn.disabled=true; btn.textContent='…';
  try{
    const { error } = await db.from('orders').update({ prep_hold:true }).eq('id',id);
    if(error) throw error;
    allRows=allRows.filter(o=>o.id!==id); render(); refreshCounts();
  }catch(e){ btn.disabled=false; btn.textContent='⏸ إيقاف'; alert('تعذّر الإيقاف — حاول تاني'); }
}
async function resumeOrder(id, btn){
  btn.disabled=true; btn.textContent='…';
  try{
    const { error } = await db.from('orders').update({ prep_hold:false }).eq('id',id);
    if(error) throw error;
    allRows=allRows.filter(o=>o.id!==id); render(); refreshCounts();
  }catch(e){ btn.disabled=false; btn.textContent='▶ استئناف التحضير'; alert('تعذّر الاستئناف — حاول تاني'); }
}
async function returnToPrep(id, btn){
  if(!confirm('رجوع الطلب للتحضير؟ لو على رحلة هيتشال من الطيار ويرجع «قيد التحضير» في التوزيع لحد ما يتحضّر تاني.')) return;
  btn.disabled=true; btn.textContent='… جاري الرجوع';
  try{
    const { data, error } = await db.rpc('prep_return_to_prep',{ p_order_id:id, p_user_name:actorName() });
    if(error) throw error;
    if(data && data.success===false) throw new Error(data.error||'تعذّر الرجوع');
    allRows=allRows.filter(o=>o.id!==id);
    render();
  }catch(e){ btn.disabled=false; btn.textContent='↩ رجوع للتحضير'; alert('تعذّر: '+(e.message||'حاول تاني')); }
}

window.addEventListener('DOMContentLoaded', async()=>{
  currentUser = getCurrentUser();
  if(!currentUser){ location.href='auth.html'; return; }
  if(!Session.tokenValid(60000)){
    const ok=await Session.refresh(60000);
    if(!ok && !sessionStorage.getItem('jwtRefreshDone')){ sessionStorage.setItem('jwtRefreshDone','1'); location.href='auth.html'; return; }
  }
  sessionStorage.removeItem('jwtRefreshDone');
  document.getElementById('branchLbl').textContent = currentUser.branch || (currentUser.role==='admin'?'كل الفروع':'');
  branchId = await resolveBranch();
  loadBranchLetters();   // خريطة فرع→حرف لعرض رصيد الأصناف (بلا انتظار)
  // استرجاع شيفت مفتوح (لو الصفحة اترفريشت) — نتأكد إنه لسه مش منتهي
  try{
    const saved=JSON.parse(localStorage.getItem(SHIFT_KEY)||'null');
    if(saved&&saved.id){
      const { data } = await db.from('prep_shifts').select('id,preparer_name,started_at,ended_at').eq('id',saved.id).maybeSingle();
      if(data && !data.ended_at){ prepShift={ id:data.id, preparer_name:data.preparer_name, started_at:data.started_at }; }
      else { localStorage.removeItem(SHIFT_KEY); }
    }
  }catch(_){}
  applyShiftUI();
});
</script>
