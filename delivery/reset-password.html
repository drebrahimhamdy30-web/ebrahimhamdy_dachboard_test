<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعيين كلمة سر جديدة — Phalix</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--primary:#1a56db;--primary-dark:#1344b0;--danger:#dc2626;--success:#16a34a;--text:#111827;--text-muted:#6b7280;--border:#e5e7eb;--bg:#f9fafb;--white:#fff}
  body{font-family:'Cairo',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
  .wrap{width:100%;max-width:420px}
  .logo{text-align:center;margin-bottom:1.5rem}
  .logo .ic{width:60px;height:60px;background:var(--primary);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:.75rem}
  .logo .ic svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2}
  .logo h1{font-size:1.3rem;font-weight:700;color:var(--text)}
  .card{background:var(--white);border-radius:16px;padding:2rem;box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid var(--border)}
  .card h2{font-size:1.05rem;font-weight:700;margin-bottom:.3rem}
  .card .sub{font-size:.82rem;color:var(--text-muted);margin-bottom:1.25rem}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.5rem}
  input{width:100%;height:44px;padding:0 1rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.9rem;outline:none;direction:ltr}
  input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
  .form-group{margin-bottom:1.1rem}
  .btn{width:100%;height:46px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.3rem}
  .btn:hover{background:var(--primary-dark)} .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{border-radius:8px;padding:.75rem 1rem;font-size:.85rem;margin-top:1rem;display:none}
  .msg.show{display:block}
  .msg.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
  .msg.err{background:#fef2f2;border:1px solid #fecaca;color:var(--danger)}
  a.link{display:inline-block;margin-top:1.1rem;color:var(--primary);font-weight:600;font-size:.85rem;text-decoration:none}
  .center{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1>Phalix</h1>
  </div>
  <div class="card" id="card">
    <h2>تعيين كلمة سر جديدة</h2>
    <div class="sub">اكتب كلمة السر الجديدة لحسابك.</div>
    <div id="form">
      <div class="form-group">
        <label for="p1">كلمة السر الجديدة</label>
        <input type="password" id="p1" placeholder="6 أحرف على الأقل" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="p2">تأكيد كلمة السر</label>
        <input type="password" id="p2" placeholder="أعد كتابتها" autocomplete="new-password">
      </div>
      <button class="btn" id="btn" onclick="submitReset()">حفظ كلمة السر</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="center"><a class="link" href="auth.html">‹ الرجوع لتسجيل الدخول</a></div>
  </div>
</div>

<script>
  const SB_URL = 'https://rxtjoqulmgkkcohmgzgi.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dGpvcXVsbWdra2NvaG1nemdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDQ2OTUsImV4cCI6MjA5NDI4MDY5NX0.QVoJPtlRlRIz9tdhmdTZxHtKxrwAxJq0Je4QHkFKxj0';
  const token = new URLSearchParams(location.search).get('token') || '';

  function showMsg(t, ok){ const m=document.getElementById('msg'); m.textContent=t; m.className='msg show '+(ok?'ok':'err'); }

  if(!token){ document.getElementById('form').style.display='none'; showMsg('الرابط ناقص أو غير صالح. اطلب رابط استعادة جديد من صفحة الدخول.', false); }

  async function submitReset(){
    const p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
    if(!p1 || p1.length<6){ showMsg('كلمة السر لازم تكون 6 أحرف على الأقل', false); return; }
    if(p1!==p2){ showMsg('كلمتا السر غير متطابقتين', false); return; }
    const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='جاري الحفظ...';
    try{
      const r=await fetch(SB_URL+'/rest/v1/rpc/reset_password_with_token',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
        body:JSON.stringify({ p_token:token, p_new_password:p1 })
      });
      const data=await r.json();
      if(data && data.success){
        document.getElementById('form').style.display='none';
        showMsg('✓ اتغيّرت كلمة السر بنجاح. تقدر تسجّل دخول دلوقتي.', true);
      }else{
        showMsg((data && data.error) || 'تعذّر تغيير كلمة السر', false);
        btn.disabled=false; btn.textContent='حفظ كلمة السر';
      }
    }catch(e){
      showMsg('فشل الاتصال، حاول تاني', false);
      btn.disabled=false; btn.textContent='حفظ كلمة السر';
    }
  }
</script>
</body>
</html>
