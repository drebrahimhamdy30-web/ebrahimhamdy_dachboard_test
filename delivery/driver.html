<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بورتال الطيار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-dark:#1344b0;--primary-light:#e8f0fe;
  --green:#16a34a;--green-light:#dcfce7;
  --yellow:#ca8a04;--yellow-light:#fef9c3;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#0891b2;--blue-light:#ecfeff;
  --orange:#ea580c;--orange-light:#fff7ed;
  --text:#111827;--text-muted:#6b7280;
  --border:#e5e7eb;--bg:#f1f5f9;--white:#fff;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.driver-header{background:var(--primary);color:white;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.driver-header-title{font-size:1rem;font-weight:700}
.driver-header-name{font-size:.78rem;opacity:.85}
.logout-btn{background:rgba(255,255,255,0.15);border:none;color:white;padding:.35rem .75rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.75rem;cursor:pointer}

.refresh-bar{text-align:center;padding:.4rem;font-size:.72rem;color:var(--text-muted);background:white;border-bottom:1px solid var(--border)}

.driver-stats{display:flex;gap:.75rem;padding:.875rem 1.25rem;background:white;border-bottom:1px solid var(--border);overflow-x:auto}
.driver-stat-pill{display:flex;flex-direction:column;align-items:center;gap:.1rem;flex-shrink:0;min-width:72px}
.dsp-value{font-size:1.3rem;font-weight:700;color:var(--text)}
.dsp-label{font-size:.65rem;color:var(--text-muted);white-space:nowrap}

.driver-tabs{display:flex;gap:.4rem;padding:.75rem 1.25rem;background:white;border-bottom:1px solid var(--border);overflow-x:auto}
.driver-tab{padding:.35rem .85rem;border-radius:20px;font-size:.75rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:white;color:var(--text-muted);white-space:nowrap;display:flex;align-items:center;gap:.3rem;font-family:'Cairo',sans-serif}
.driver-tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.tab-num{background:rgba(255,255,255,0.25);padding:.1rem .35rem;border-radius:10px;font-size:.65rem}
.driver-tab:not(.active) .tab-num{background:var(--bg);color:var(--text-muted)}

.driver-content{padding:1rem 1.25rem}

.driver-order-card{background:white;border-radius:12px;border:1.5px solid var(--border);margin-bottom:.75rem;overflow:hidden;transition:box-shadow .15s}
.driver-order-card.status-picked{border-right:4px solid var(--blue)}
.driver-order-card.status-delivered{border-right:4px solid var(--yellow)}
.driver-order-card.status-completed{border-right:4px solid #6b7280}

.doc-header{padding:.875rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.doc-no{font-weight:700;color:var(--primary);font-size:.875rem}
.doc-time{font-size:.7rem;color:var(--text-muted)}
.doc-body{padding:1rem}
.doc-customer{font-size:.9rem;font-weight:700;margin-bottom:.35rem}
.doc-address{font-size:.78rem;color:var(--text-muted);margin-bottom:.5rem}
.doc-info-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.doc-info-pill{font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:8px}
.doc-amount{font-size:1.1rem;font-weight:700;color:var(--text)}
.doc-notes{font-size:.72rem;color:#6d28d9;margin-top:.5rem;padding:.4rem .6rem;background:var(--purple-light,#ede9fe);border-radius:6px}

.doc-actions{padding:.75rem 1rem;border-top:1px solid var(--border);display:flex;gap:.5rem;flex-wrap:wrap}
.doc-btn{flex:1;min-width:100px;padding:.6rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:.35rem}
.doc-btn-deliver{background:var(--yellow);color:white}
.doc-btn-complete{background:var(--green);color:white}
.doc-btn-issue{background:var(--red-light);color:var(--red);border:1px solid #fecaca}

/* Payment modal */
.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.25rem}
.pay-opt{padding:.75rem;border-radius:10px;font-family:'Cairo',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;border:2px solid var(--border);background:white;color:var(--text);transition:all .15s;text-align:center}
.pay-opt:hover{border-color:var(--primary)}
.pay-opt.selected{border-width:2px}
.pay-opt.pay-cash.selected{border-color:#92400e;background:#fef3c7;color:#92400e}
.pay-opt.pay-visa.selected{border-color:#1e40af;background:#dbeafe;color:#1e40af}
.pay-opt.pay-transfer.selected{border-color:#15803d;background:var(--green-light);color:#15803d}
.pay-opt.pay-deferred.selected{border-color:#c2410c;background:var(--orange-light);color:#c2410c}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:1.5rem}
.modal-title{font-weight:700;font-size:1rem;margin-bottom:1rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem}
.form-control{width:100%;height:44px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;outline:none;background:white}
.form-control:focus{border-color:var(--primary)}
textarea.form-control{height:80px;padding:.75rem;resize:none}
.btn-full{width:100%;height:46px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;border:none;margin-bottom:.5rem}
.btn-primary{background:var(--primary);color:white}
.btn-green{background:var(--green);color:white}
.btn-cancel-modal{background:var(--bg);color:var(--text)}

.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
.empty-icon{font-size:2.5rem;margin-bottom:.75rem}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.75);z-index:300;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="driver-header">
  <div>
    <div class="driver-header-title">بورتال الطيار</div>
    <div class="driver-header-name" id="driverName">جاري التحميل...</div>
  </div>
  <button class="logout-btn" onclick="doLogout()">خروج</button>
</div>

<div class="refresh-bar" id="refreshBar">آخر تحديث: —</div>

<div class="driver-stats">
  <div class="driver-stat-pill"><span class="dsp-value" id="ds-active">—</span><span class="dsp-label">نشط الآن</span></div>
  <div class="driver-stat-pill"><span class="dsp-value" id="ds-delivered">—</span><span class="dsp-label">وصّل اليوم</span></div>
  <div class="driver-stat-pill"><span class="dsp-value" id="ds-revenue" style="font-size:1rem">—</span><span class="dsp-label">إيرادات</span></div>
  <div class="driver-stat-pill"><span class="dsp-value" id="ds-avgtime" style="font-size:.9rem">—</span><span class="dsp-label">متوسط الوقت</span></div>
</div>

<div class="driver-tabs">
  <button class="driver-tab active" onclick="setTab('picked',this)">في الطريق <span class="tab-num" id="tab-picked">0</span></button>
  <button class="driver-tab" onclick="setTab('delivered',this)">تم التسليم <span class="tab-num" id="tab-delivered">0</span></button>
  <button class="driver-tab" onclick="setTab('completed',this)">مكتمل <span class="tab-num" id="tab-completed">0</span></button>
  <button class="driver-tab" onclick="setTab('postponed',this)">مؤجل <span class="tab-num" id="tab-postponed">0</span></button>
</div>

<div class="driver-content" id="driverContent">
  <div class="empty-state"><div class="empty-icon">⏳</div><p>جاري التحميل...</p></div>
</div>

<!-- Modal: Deliver (Payment) -->
<div class="modal-overlay" id="deliverModal">
  <div class="modal">
    <div class="modal-title">✅ تأكيد التوصيل</div>
    <input type="hidden" id="deliver-order-id">
    <div class="form-group">
      <label class="form-label">طريقة الدفع *</label>
      <div class="payment-grid">
        <button class="pay-opt pay-cash" onclick="selectPay('cash',this)">💵 كاش</button>
        <button class="pay-opt pay-visa" onclick="selectPay('visa',this)">💳 فيزا</button>
        <button class="pay-opt pay-transfer" onclick="selectPay('transfer',this)">🏦 تحويل</button>
        <button class="pay-opt pay-deferred" onclick="selectPay('deferred',this)">📋 آجل</button>
      </div>
      <input type="hidden" id="deliver-payment">
    </div>
    <div class="form-group">
      <label class="form-label">المبلغ المحصل (ج.م)</label>
      <input type="number" class="form-control" id="deliver-amount" placeholder="0" min="0">
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظة (اختياري)</label>
      <textarea class="form-control" id="deliver-note" placeholder="أي ملاحظة على التوصيل..."></textarea>
    </div>
    <button class="btn-full btn-green" onclick="confirmDeliver()">✓ تأكيد التوصيل</button>
    <button class="btn-full btn-cancel-modal" onclick="closeModal('deliverModal')">إلغاء</button>
  </div>
</div>

<!-- Modal: Issue -->
<div class="modal-overlay" id="issueModal">
  <div class="modal">
    <div class="modal-title">⚠️ الإبلاغ عن مشكلة</div>
    <input type="hidden" id="issue-order-id">
    <div class="form-group">
      <label class="form-label">نوع المشكلة</label>
      <select class="form-control" id="issue-type">
        <option value="العميل غير متاح">العميل غير متاح</option>
        <option value="العنوان غير صحيح">العنوان غير صحيح</option>
        <option value="رفض الاستلام">رفض الاستلام</option>
        <option value="طلب التأجيل">طلب التأجيل من العميل</option>
        <option value="منطقة بعيدة">منطقة بعيدة</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظات إضافية</label>
      <textarea class="form-control" id="issue-notes" placeholder="تفاصيل المشكلة..."></textarea>
    </div>
    <button class="btn-full btn-primary" onclick="submitIssue()">إرسال البلاغ</button>
    <button class="btn-full btn-cancel-modal" onclick="closeModal('issueModal')">إلغاء</button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://rxtjoqulmgkkcohmgzgi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dGpvcXVsbWdra2NvaG1nemdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDQ2OTUsImV4cCI6MjA5NDI4MDY5NX0.QVoJPtlRlRIz9tdhmdTZxHtKxrwAxJq0Je4QHkFKxj0';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const PAYMENT_LABELS = { cash:'💵 كاش', visa:'💳 فيزا', transfer:'🏦 تحويل', deferred:'📋 آجل' };
const PAYMENT_STYLE  = { cash:'background:#fef3c7;color:#92400e', visa:'background:#dbeafe;color:#1e40af', transfer:'background:#dcfce7;color:#15803d', deferred:'background:#fff7ed;color:#c2410c' };

let currentUser = null, myOrders = [], currentTab = 'picked';

window.addEventListener('DOMContentLoaded', async () => {
  const stored = sessionStorage.getItem('delivery_user');
  if (!stored) { window.location.href = 'auth.html'; return; }
  currentUser = JSON.parse(stored);
  if (currentUser.role !== 'driver') { window.location.href = 'app.html'; return; }
  document.getElementById('driverName').textContent = currentUser.full_name;
  await loadOrders();
  setInterval(loadOrders, 30000);
});

async function loadOrders() {
  try {
    const { data } = await db.from('orders').select('*')
      .eq('driver_id', currentUser.id)
      .order('created_at', { ascending: false });
    myOrders = data || [];
    updateStats();
    renderOrders();
    document.getElementById('refreshBar').textContent =
      `آخر تحديث: ${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}`;
  } catch(e) { console.error(e); }
}

function calcDuration(from, to) {
  if (!from || !to) return null;
  const mins = Math.floor((new Date(to) - new Date(from)) / 60000);
  if (mins < 60) return `${mins} د`;
  return `${Math.floor(mins/60)}س ${mins%60}د`;
}

function updateStats() {
  const today = new Date(); today.setHours(0,0,0,0);
  const active = myOrders.filter(o => o.status === 'picked').length;
  const delivered = myOrders.filter(o => ['delivered','completed'].includes(o.status) && new Date(o.created_at) >= today).length;
  const revenue = myOrders.filter(o => ['delivered','completed'].includes(o.status) && new Date(o.created_at) >= today)
    .reduce((s, o) => s + Number(o.collected_amount || o.total_bill_net || 0), 0);

  // Average delivery time
  const withTime = myOrders.filter(o => o.picked_at && o.delivered_at);
  const avgMins = withTime.length ? Math.round(withTime.reduce((s,o) => s + (new Date(o.delivered_at) - new Date(o.picked_at))/60000, 0) / withTime.length) : 0;

  document.getElementById('ds-active').textContent = active;
  document.getElementById('ds-delivered').textContent = delivered;
  document.getElementById('ds-revenue').textContent = revenue.toLocaleString('ar-EG') + ' ج';
  document.getElementById('ds-avgtime').textContent = avgMins ? `${avgMins} د` : '—';

  ['picked','delivered','completed','postponed'].forEach(s =>
    document.getElementById(`tab-${s}`).textContent = myOrders.filter(o=>o.status===s).length
  );
}

function renderOrders() {
  const orders = myOrders.filter(o => o.status === currentTab);
  const content = document.getElementById('driverContent');
  const labels = { picked:'لا توجد طلبات في الطريق', delivered:'لا توجد طلبات مسلّمة', completed:'لا توجد طلبات مكتملة', postponed:'لا توجد طلبات مؤجلة' };

  if (!orders.length) {
    content.innerHTML = `<div class="empty-state"><div class="empty-icon">${currentTab==='picked'?'🚗':currentTab==='delivered'?'📦':currentTab==='postponed'?'🕐':'✅'}</div><p>${labels[currentTab]||'لا توجد طلبات'}</p></div>`;
    return;
  }

  content.innerHTML = orders.map(o => {
    const mins = Math.floor((new Date() - new Date(o.created_at)) / 60000);
    const timeStr = mins < 60 ? `منذ ${mins} د` : `منذ ${Math.floor(mins/60)}س`;
    const amount = Number(o.total_bill_net || 0);
    const pm = o.payment_method;
    const pmLabel = pm ? PAYMENT_LABELS[pm] : (o.bill_type || 'كاش');
    const pmStyle = pm ? PAYMENT_STYLE[pm] : 'background:#fef3c7;color:#92400e';
    const driverTime = calcDuration(o.picked_at, o.delivered_at);

    let actions = '';
    if (o.status === 'picked') {
      actions = `
        <button class="doc-btn doc-btn-deliver" onclick="openDeliver('${o.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          تم التسليم
        </button>
        <button class="doc-btn doc-btn-issue" onclick="openIssue('${o.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          مشكلة
        </button>`;
    } else if (o.status === 'delivered') {
      actions = `<button class="doc-btn doc-btn-complete" onclick="completeOrder('${o.id}')" style="flex:1">✓ تأكيد الإنجاز</button>`;
    }

    return `
      <div class="driver-order-card status-${o.status}">
        <div class="doc-header">
          <span class="doc-no">${o.bill_no||o.id?.slice(0,8)}</span>
          <span class="doc-time">${timeStr}</span>
        </div>
        <div class="doc-body">
          <div class="doc-customer">${o.customer_name||o.cust_name||'—'}</div>
          <div class="doc-address">📍 ${o.customer_address||o.cust_address||'—'}</div>
          <div class="doc-info-row">
            ${o.cust_region?`<span class="doc-info-pill" style="background:var(--blue-light);color:#0e7490">${o.cust_region}</span>`:''}
            <span class="doc-info-pill" style="${pmStyle}">${pmLabel}</span>
            ${o.count_of_items?`<span class="doc-info-pill" style="background:var(--gray-light);color:#374151">${o.count_of_items} صنف</span>`:''}
          </div>
          <div class="doc-amount">${amount.toLocaleString('ar-EG')} ج.م</div>
          ${o.collected_amount && o.collected_amount !== o.total_bill_net ?
            `<div style="font-size:.72rem;color:var(--green);font-weight:600;margin-top:.25rem">✓ محصل: ${Number(o.collected_amount).toLocaleString()} ج</div>` : ''}
          ${driverTime?`<div style="font-size:.68rem;color:var(--text-muted);margin-top:.25rem">⏱ وقت التوصيل: ${driverTime}</div>`:''}
          ${o.notes?`<div class="doc-notes">📝 ${o.notes}</div>`:''}
          ${o.staff_notes?`<div style="font-size:.72rem;color:#0e7490;margin-top:.35rem;padding:.4rem .6rem;background:var(--blue-light);border-radius:6px">💼 ${o.staff_notes}</div>`:''}
          ${o.postpone_reason?`<div style="font-size:.72rem;color:#6d28d9;margin-top:.35rem;padding:.4rem .6rem;background:var(--purple-light,#ede9fe);border-radius:6px">⏰ ${o.postpone_reason}</div>`:''}
        </div>
        ${actions?`<div class="doc-actions">${actions}</div>`:''}
      </div>`;
  }).join('');
}

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.driver-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderOrders();
}

// ===== DELIVER =====
function openDeliver(orderId) {
  const o = myOrders.find(x=>x.id===orderId); if (!o) return;
  document.getElementById('deliver-order-id').value = orderId;
  document.getElementById('deliver-payment').value = '';
  document.getElementById('deliver-amount').value = o.total_bill_net || '';
  document.getElementById('deliver-note').value = '';
  document.querySelectorAll('.pay-opt').forEach(b=>b.classList.remove('selected'));
  document.getElementById('deliverModal').classList.add('open');
}
function selectPay(method, btn) {
  document.querySelectorAll('.pay-opt').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('deliver-payment').value = method;
}
async function confirmDeliver() {
  const orderId = document.getElementById('deliver-order-id').value;
  const payment = document.getElementById('deliver-payment').value;
  if (!payment) { alert('اختر طريقة الدفع أولاً'); return; }
  const amount = parseFloat(document.getElementById('deliver-amount').value) || 0;
  const note = document.getElementById('deliver-note').value.trim();
  showLoading(true);
  await db.from('orders').update({
    status: 'delivered',
    payment_method: payment,
    collected_amount: amount,
    driver_notes: note || null,
    delivered_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  }).eq('id', orderId);
  closeModal('deliverModal');
  await loadOrders();
  showLoading(false);
}

async function completeOrder(orderId) {
  showLoading(true);
  await db.from('orders').update({ status:'completed', updated_at:new Date().toISOString() }).eq('id', orderId);
  await loadOrders();
  showLoading(false);
}

// ===== ISSUE =====
function openIssue(orderId) {
  document.getElementById('issue-order-id').value = orderId;
  document.getElementById('issue-notes').value = '';
  document.getElementById('issueModal').classList.add('open');
}
async function submitIssue() {
  const orderId = document.getElementById('issue-order-id').value;
  const type = document.getElementById('issue-type').value;
  const notes = document.getElementById('issue-notes').value;
  showLoading(true);
  await db.from('orders').update({
    status: 'postponed',
    postpone_reason: type,
    driver_notes: notes || null,
    attempt_count: db.rpc ? undefined : undefined,
    updated_at: new Date().toISOString()
  }).eq('id', orderId);

  // Increment attempt_count
  const o = myOrders.find(x=>x.id===orderId);
  if (o) await db.from('orders').update({ attempt_count: (o.attempt_count||0)+1 }).eq('id', orderId);

  closeModal('issueModal');
  await loadOrders();
  showLoading(false);
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show',show); }
function doLogout() { sessionStorage.removeItem('delivery_user'); window.location.href = 'auth.html'; }
</script>
</body>
</html>
