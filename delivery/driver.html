<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>بورتال الطيار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--green:#16a34a;--green-light:#dcfce7;
  --yellow:#ca8a04;--yellow-light:#fef9c3;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#0891b2;--blue-light:#ecfeff;
  --orange:#ea580c;--orange-light:#fff7ed;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --text:#111827;--text-muted:#6b7280;
  --border:#e5e7eb;--bg:#f1f5f9;--white:#fff;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:2rem}

/* HEADER */
.header{background:var(--primary);color:white;padding:.875rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.h-name{font-size:.95rem;font-weight:700}
.h-sub{font-size:.7rem;opacity:.8;margin-top:.1rem}
.h-actions{display:flex;gap:.5rem;align-items:center}
.h-btn{background:rgba(255,255,255,.15);border:none;color:white;padding:.35rem .75rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:.75rem;cursor:pointer;font-weight:600}

/* STATUS BAR */
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1.25rem;font-size:.75rem;font-weight:600}
.status-bar.online{background:#f0fdf4;border-bottom:2px solid #bbf7d0}
.status-bar.offline{background:#fef2f2;border-bottom:2px solid #fecaca}
.status-bar.on-break{background:#fef9c3;border-bottom:2px solid #fde68a}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:.4rem}
.dot-green{background:var(--green);animation:pulse 2s infinite}
.dot-red{background:#9ca3af}
.dot-yellow{background:var(--yellow);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* BREAK BANNER */
.break-banner{background:var(--yellow-light);border-bottom:2px solid #fde68a;padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between}
.break-timer{font-size:1.75rem;font-weight:800;color:#92400e;font-variant-numeric:tabular-nums}

/* STATS */
.stats{display:flex;gap:0;border-bottom:1px solid var(--border);background:white}
.stat{flex:1;padding:.75rem .5rem;text-align:center;border-left:1px solid var(--border)}
.stat:last-child{border-left:none}
.stat-val{font-size:1.4rem;font-weight:800;color:var(--text)}
.stat-lbl{font-size:.62rem;color:var(--text-muted);margin-top:.1rem}

/* TABS */
.tabs{display:flex;background:white;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{flex:1;padding:.625rem .5rem;text-align:center;font-size:.72rem;font-weight:600;color:var(--text-muted);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:'Cairo',sans-serif;min-width:80px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* CONTENT */
.content{padding:.875rem 1rem}

/* ORDER CARD */
.order-card{background:white;border-radius:12px;border:1.5px solid var(--border);margin-bottom:.75rem;overflow:hidden}
.order-card.status-assigned{border-right:4px solid var(--orange)}
.order-card.status-picked{border-right:4px solid var(--blue)}
.order-card.status-delivered{border-right:4px solid var(--yellow)}
.order-card.late{border-right:4px solid var(--red)}

.oc-head{padding:.625rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#fafafa}
.oc-no{font-weight:800;color:var(--primary);font-size:.875rem}
.oc-timers{display:flex;gap:.25rem;flex-wrap:wrap}
.oc-timer{font-size:.6rem;font-weight:700;padding:.1rem .35rem;border-radius:6px}
.t-create{background:#f0f9ff;color:#0369a1}
.t-assign{background:var(--orange-light);color:#c2410c}
.t-pick{background:var(--purple-light);color:#6d28d9}
.t-deliver{background:var(--green-light);color:#15803d}
.t-late{background:var(--red-light);color:#b91c1c}

.oc-body{padding:.875rem 1rem}
.oc-name{font-size:.95rem;font-weight:700;margin-bottom:.25rem}
.oc-addr{font-size:.75rem;color:var(--text-muted);margin-bottom:.4rem}
.oc-tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem}
.oc-tag{font-size:.65rem;font-weight:600;padding:.15rem .45rem;border-radius:6px}
.tag-region{background:var(--blue-light);color:#0e7490}
.tag-pay-cash{background:#fef3c7;color:#92400e}
.tag-pay-visa{background:#dbeafe;color:#1e40af}
.tag-pay-transfer{background:var(--green-light);color:#15803d}
.tag-pay-deferred{background:var(--orange-light);color:#c2410c}
.oc-amount{font-size:1.2rem;font-weight:800;color:var(--text)}
.oc-note{font-size:.72rem;padding:.35rem .6rem;border-radius:7px;margin-top:.4rem}
.note-staff{background:var(--blue-light);color:#0e7490}
.note-general{background:var(--yellow-light);color:#92400e}
.note-urgent{background:var(--red-light);color:#b91c1c;font-weight:700}

.oc-actions{padding:.625rem 1rem;border-top:1px solid var(--border);display:flex;gap:.5rem}
.oc-btn{flex:1;padding:.625rem;border-radius:10px;font-family:'Cairo',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:.3rem}
.btn-pickup{background:var(--orange);color:white}
.btn-deliver{background:var(--green);color:white}
.btn-issue{background:var(--red-light);color:#b91c1c;border:1px solid #fecaca}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:16px 16px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:1.5rem}
.modal-title{font-weight:700;font-size:1rem;margin-bottom:1rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.4rem}
.form-ctrl{width:100%;height:46px;padding:0 .875rem;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:.875rem;outline:none}
.form-ctrl:focus{border-color:var(--primary)}
textarea.form-ctrl{height:80px;padding:.75rem;resize:none}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.25rem}
.pay-opt{padding:.75rem;border-radius:10px;font-family:'Cairo',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;border:2px solid var(--border);background:white;text-align:center}
.po-cash{border-color:#92400e!important;background:#fef3c7!important;color:#92400e!important}
.po-visa{border-color:#1e40af!important;background:#dbeafe!important;color:#1e40af!important}
.po-transfer{border-color:#15803d!important;background:var(--green-light)!important;color:#15803d!important}
.po-deferred{border-color:#c2410c!important;background:var(--orange-light)!important;color:#c2410c!important}
.btn-full{width:100%;height:48px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;border:none;margin-bottom:.5rem}
.btn-green{background:var(--green);color:white}
.btn-orange{background:var(--orange);color:white}
.btn-primary{background:var(--primary);color:white}
.btn-gray{background:var(--bg);color:var(--text)}

/* EMPTY */
.empty{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
.empty-icon{font-size:3rem;margin-bottom:.75rem}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:300;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="h-name" id="driverName">بورتال الطيار</div>
    <div class="h-sub" id="driverBranch">جاري التحميل...</div>
  </div>
  <div class="h-actions">
    <button class="h-btn" onclick="requestBreak()" id="breakBtn" style="display:none">☕ استراحة</button>
    <button class="h-btn" onclick="toggleStatus()" id="statusBtn">جاري...</button>
    <button class="h-btn" onclick="doLogout()">خروج</button>
  </div>
</div>

<div class="status-bar offline" id="statusBar">
  <span><span class="status-dot dot-red" id="statusDot"></span><span id="statusText">جاري التحميل...</span></span>
  <span id="lastRefresh" style="font-size:.65rem;color:var(--text-muted)"></span>
</div>

<div class="break-banner" id="breakBanner" style="display:none">
  <div>
    <div style="font-weight:700;color:#92400e">☕ في استراحة</div>
    <div style="font-size:.72rem;color:#a16207">الوقت المتبقي</div>
  </div>
  <div class="break-timer" id="breakTimer">00:00</div>
</div>

<div class="stats" id="statsBar">
  <div class="stat"><div class="stat-val" id="s-assigned">0</div><div class="stat-lbl">على رحلة</div></div>
  <div class="stat"><div class="stat-val" id="s-picked">0</div><div class="stat-lbl">استلمت</div></div>
  <div class="stat"><div class="stat-val" id="s-delivered">0</div><div class="stat-lbl">وصّلت</div></div>
  <div class="stat"><div class="stat-val" id="s-revenue" style="font-size:1rem">0</div><div class="stat-lbl">إيرادات ج</div></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setTab('assigned',this)">على رحلة</button>
  <button class="tab" onclick="setTab('picked',this)">استلمت</button>
  <button class="tab" onclick="setTab('delivered',this)">وصّلت</button>
  <button class="tab" onclick="setTab('postponed',this)">مؤجل</button>
</div>

<div class="content" id="content">
  <div class="empty"><div class="empty-icon">⏳</div><p>جاري التحميل...</p></div>
</div>

<!-- Modal: Pickup confirmation -->
<div class="modal-overlay" id="pickupModal">
  <div class="modal">
    <div class="modal-title">▶️ تأكيد الاستلام</div>
    <input type="hidden" id="pk-id">
    <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:1rem">هل استلمت الطلب من الصيدلية؟</p>
    <button class="btn-full btn-orange" onclick="confirmPickup()">✓ نعم، استلمت</button>
    <button class="btn-full btn-gray" onclick="closeModal('pickupModal')">إلغاء</button>
  </div>
</div>

<!-- Modal: Deliver -->
<div class="modal-overlay" id="deliverModal">
  <div class="modal">
    <div class="modal-title">✅ تأكيد التوصيل</div>
    <input type="hidden" id="dlv-id">
    <div class="form-group">
      <label class="form-label">طريقة الدفع *</label>
      <div class="pay-grid">
        <button class="pay-opt" onclick="selPay('cash',this)">💵 كاش</button>
        <button class="pay-opt" onclick="selPay('visa',this)">💳 فيزا</button>
        <button class="pay-opt" onclick="selPay('transfer',this)">🏦 تحويل</button>
        <button class="pay-opt" onclick="selPay('deferred',this)">📋 آجل</button>
      </div>
      <input type="hidden" id="dlv-pay">
    </div>
    <div class="form-group">
      <label class="form-label">المبلغ المحصل (ج.م)</label>
      <input type="number" class="form-ctrl" id="dlv-amt" placeholder="0" min="0">
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظة (اختياري)</label>
      <textarea class="form-ctrl" id="dlv-note" placeholder="ملاحظات على التوصيل..."></textarea>
    </div>
    <button class="btn-full btn-green" onclick="confirmDeliver()">✓ تأكيد التوصيل</button>
    <button class="btn-full btn-gray" onclick="closeModal('deliverModal')">إلغاء</button>
  </div>
</div>

<!-- Modal: Issue -->
<div class="modal-overlay" id="issueModal">
  <div class="modal">
    <div class="modal-title">⚠️ الإبلاغ عن مشكلة</div>
    <input type="hidden" id="iss-id">
    <div class="form-group">
      <label class="form-label">نوع المشكلة</label>
      <select class="form-ctrl" id="iss-type">
        <option value="العميل غير متاح">العميل غير متاح</option>
        <option value="العنوان غير صحيح">العنوان غير صحيح</option>
        <option value="رفض الاستلام">رفض الاستلام</option>
        <option value="طلب التأجيل من العميل">طلب التأجيل من العميل</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">تفاصيل</label>
      <textarea class="form-ctrl" id="iss-note" placeholder="تفاصيل المشكلة..."></textarea>
    </div>
    <button class="btn-full btn-primary" onclick="submitIssue()">إرسال البلاغ</button>
    <button class="btn-full btn-gray" onclick="closeModal('issueModal')">إلغاء</button>
  </div>
</div>

<!-- Modal: Break -->
<div class="modal-overlay" id="breakModal">
  <div class="modal">
    <div class="modal-title">☕ طلب استراحة</div>
    <div class="form-group">
      <label class="form-label">سبب الاستراحة (اختياري)</label>
      <textarea class="form-ctrl" id="brk-reason" placeholder="سبب الاستراحة..."></textarea>
    </div>
    <div style="background:var(--yellow-light);border-radius:10px;padding:.75rem;font-size:.78rem;color:#92400e;margin-bottom:1rem">
      ⏳ سيُرسل طلبك للإدارة وستُفعّل الاستراحة بعد الموافقة
    </div>
    <button class="btn-full btn-primary" onclick="submitBreak()">إرسال الطلب</button>
    <button class="btn-full btn-gray" onclick="closeModal('breakModal')">إلغاء</button>
  </div>
</div>

<div class="loading-overlay" id="lo"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://rxtjoqulmgkkcohmgzgi.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dGpvcXVsbWdra2NvaG1nemdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDQ2OTUsImV4cCI6MjA5NDI4MDY5NX0.QVoJPtlRlRIz9tdhmdTZxHtKxrwAxJq0Je4QHkFKxj0';
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const PAY_LABELS={cash:'💵 كاش',visa:'💳 فيزا',transfer:'🏦 تحويل',deferred:'📋 آجل'};
const STATUS_LABELS={pending:'جاهز',assigned:'على رحلة',picked:'استلم',delivered:'تم التوصيل',completed:'مكتمل',postponed:'مؤجل'};

let currentUser=null, driverRecord=null, myOrders=[], currentTab='assigned';
let settings=null, activeBreak=null, breakInterval=null;

// AUTH
window.addEventListener('DOMContentLoaded', async()=>{
  const stored=sessionStorage.getItem('delivery_user');
  if(!stored){window.location.href='auth.html';return;}
  currentUser=JSON.parse(stored);
  if(currentUser.role!=='driver'){window.location.href='app.html';return;}

  document.getElementById('driverName').textContent=currentUser.full_name||'طيار';
  await loadDriver();
  await loadSettings();
  await loadOrders();
  setInterval(loadOrders,30000);
  setInterval(updateTimers,60000);
});

async function loadDriver(){
  try{
    const {data,error}=await db.from('drivers')
      .select('*,branches(name)')
      .eq('user_id',currentUser.id);
    if(error) throw error;
    driverRecord = data && data.length > 0 ? data[0] : null;
    if(driverRecord){
      document.getElementById('driverBranch').textContent=driverRecord.branches?.name||'—';
      updateStatusUI();
      if(settings?.driver_can_request_break!==false){
        document.getElementById('breakBtn').style.display='block';
      }
      await checkBreak();
    }
  }catch(e){console.error('loadDriver error:',e);}
}

async function loadSettings(){
  if(!driverRecord?.branch_id)return;
  try{
    const {data}=await db.from('dispatch_settings').select('*').eq('branch_id',driverRecord.branch_id);
    settings=data?.[0]||null;
    if(settings?.driver_can_request_break!==false&&driverRecord){
      document.getElementById('breakBtn').style.display='block';
    }
  }catch(e){}
}

function updateStatusUI(){
  if(!driverRecord)return;
  const bar=document.getElementById('statusBar');
  const dot=document.getElementById('statusDot');
  const txt=document.getElementById('statusText');
  const btn=document.getElementById('statusBtn');
  if(activeBreak){
    bar.className='status-bar on-break';
    dot.className='status-dot dot-yellow';
    txt.textContent='في استراحة';
    btn.textContent='الرجوع للعمل';
  }else if(driverRecord.is_online){
    bar.className='status-bar online';
    dot.className='status-dot dot-green';
    txt.textContent='أنت أونلاين — جاهز للرحلات';
    btn.textContent='🔴 أوفلاين';
  }else{
    bar.className='status-bar offline';
    dot.className='status-dot dot-red';
    txt.textContent='أنت أوفلاين';
    btn.textContent='🟢 أونلاين';
  }
}

async function toggleStatus(){
  if(!driverRecord)return;
  if(activeBreak){await endBreak();return;}
  load(true);
  const newStatus=!driverRecord.is_online;
  await db.from('drivers').update({is_online:newStatus,last_seen:new Date().toISOString()}).eq('id',driverRecord.id);
  driverRecord.is_online=newStatus;
  updateStatusUI();
  load(false);
}

async function checkBreak(){
  if(!driverRecord)return;
  try{
    const {data}=await db.from('driver_breaks').select('*').eq('driver_id',driverRecord.id).eq('status','approved').order('created_at',{ascending:false}).limit(1);
    if(data?.length){
      activeBreak=data[0];
      document.getElementById('breakBanner').style.display='flex';
      if(breakInterval)clearInterval(breakInterval);
      breakInterval=setInterval(updateBreakTimer,1000);
      updateBreakTimer();
    }else{
      activeBreak=null;
      document.getElementById('breakBanner').style.display='none';
      if(breakInterval)clearInterval(breakInterval);
    }
    updateStatusUI();
  }catch(e){}
}

function updateBreakTimer(){
  if(!activeBreak?.started_at)return;
  const elapsed=Math.floor((new Date()-new Date(activeBreak.started_at))/1000);
  const total=(activeBreak.duration_minutes||30)*60;
  const remaining=Math.max(total-elapsed,0);
  const m=Math.floor(remaining/60),s=remaining%60;
  document.getElementById('breakTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(remaining===0)checkBreak();
}

async function endBreak(){
  if(!activeBreak)return;
  load(true);
  await db.from('driver_breaks').update({status:'ended',ended_at:new Date().toISOString()}).eq('id',activeBreak.id);
  await db.from('drivers').update({is_online:true}).eq('id',driverRecord.id);
  driverRecord.is_online=true;
  activeBreak=null;
  document.getElementById('breakBanner').style.display='none';
  if(breakInterval)clearInterval(breakInterval);
  updateStatusUI();
  load(false);
}

// ORDERS
async function loadOrders(){
  if(!currentUser)return;
  try{
    const driverId=driverRecord?.id||currentUser.id;
    const {data,error}=await db.from('orders').select('*').eq('driver_id',driverId);
    console.log('loadOrders result:', data?.length, error);
    myOrders=data||[];
    updateStats();
    renderOrders();
    document.getElementById('lastRefresh').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  }catch(e){console.error(e);}
}
function fm(mins){if(mins<0)mins=0;return mins<60?`${mins}د`:`${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}`}
function dm(from,to=new Date()){return Math.floor((new Date(to)-new Date(from))/60000)}

function isLate(o){
  const base=o.bill_date||o.created_at;
  const maxP=settings?.max_pending_minutes||10;
  const maxA=settings?.max_assigned_minutes||10;
  const maxK=settings?.max_picked_minutes||30;
  if(o.status==='assigned') return dm(o.assigned_at||base)>maxA;
  if(o.status==='picked')   return dm(o.picked_at||base)>maxK;
  return false;
}

function buildTimers(o){
  const base=o.bill_date||o.created_at;
  let html='';
  const t1=dm(base);
  html+=`<span class="oc-timer t-create">إنشاء ${fm(t1)}</span>`;
  if(o.assigned_at){
    const w=dm(base,o.assigned_at);
    html+=`<span class="oc-timer t-assign">تعيين ${fm(w)}</span>`;
  }
  if(o.assigned_at&&!o.picked_at){
    const w=dm(o.assigned_at);
    const late=w>(settings?.max_assigned_minutes||10);
    html+=`<span class="oc-timer ${late?'t-late':'t-assign'}">ينتظر ${fm(w)}</span>`;
  }
  if(o.picked_at){
    const p=dm(o.assigned_at||base,o.picked_at);
    html+=`<span class="oc-timer t-pick">استلم ${fm(p)}</span>`;
    if(!o.delivered_at){
      const d=dm(o.picked_at);
      const late=d>(settings?.max_picked_minutes||30);
      html+=`<span class="oc-timer ${late?'t-late':'t-pick'}">طيار ${fm(d)}</span>`;
    }
  }
  if(o.delivered_at){
    const d=dm(o.picked_at||base,o.delivered_at);
    html+=`<span class="oc-timer t-deliver">وصّل ${fm(d)}</span>`;
  }
  return html;
}

function updateTimers(){renderOrders();}

function updateStats(){
  const today=new Date();today.setHours(0,0,0,0);
  document.getElementById('s-assigned').textContent=myOrders.filter(o=>o.status==='assigned').length;
  document.getElementById('s-picked').textContent=myOrders.filter(o=>o.status==='picked').length;
  const del=myOrders.filter(o=>['delivered','completed'].includes(o.status)&&new Date(o.delivered_at||o.created_at)>=today);
  document.getElementById('s-delivered').textContent=del.length;
  const rev=del.reduce((s,o)=>s+Number(o.collected_amount||o.total_bill_net||0),0);
  document.getElementById('s-revenue').textContent=rev.toLocaleString('ar-EG');
}

function setTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderOrders();
}

function renderOrders(){
  const orders=myOrders.filter(o=>o.status===currentTab);
  const content=document.getElementById('content');
  const emptyLabels={assigned:'لا توجد طلبات على رحلة',picked:'لا توجد طلبات استلمتها',delivered:'لا توجد طلبات وصّلتها',postponed:'لا توجد طلبات مؤجلة'};
  if(!orders.length){
    content.innerHTML=`<div class="empty"><div class="empty-icon">${currentTab==='assigned'?'🚗':currentTab==='picked'?'📦':currentTab==='delivered'?'✅':'⏰'}</div><p>${emptyLabels[currentTab]||'لا توجد طلبات'}</p></div>`;
    return;
  }

  content.innerHTML=orders.map(o=>{
    const late=isLate(o);
    const pm=o.payment_method;
    const pmTag=pm?`tag-pay-${pm}`:'tag-pay-cash';
    const pmLabel=pm?PAY_LABELS[pm]:'كاش';
    const amount=Number(o.total_bill_net||0);

    let actions='';
    if(o.status==='assigned'){
      actions=`<button class="oc-btn btn-pickup" onclick="openPickup('${o.id}')">▶️ استلمت</button>
               <button class="oc-btn btn-issue" onclick="openIssue('${o.id}')">⚠️ مشكلة</button>`;
    }else if(o.status==='picked'){
      actions=`<button class="oc-btn btn-deliver" onclick="openDeliver('${o.id}')">✅ وصّلت</button>
               <button class="oc-btn btn-issue" onclick="openIssue('${o.id}')">⚠️ مشكلة</button>`;
    }

    return `<div class="order-card status-${o.status} ${late?'late':''}">
      <div class="oc-head">
        <span class="oc-no">${o.bill_no||o.id?.slice(0,8)}</span>
        <div class="oc-timers">${buildTimers(o)}</div>
      </div>
      <div class="oc-body">
        <div class="oc-name">${o.customer_name||o.cust_name||'—'}</div>
        <div class="oc-addr">📍 ${o.customer_address||o.cust_address||'—'}</div>
        <div class="oc-tags">
          ${o.cust_region?`<span class="oc-tag tag-region">${o.cust_region}</span>`:''}
          <span class="oc-tag ${pmTag}">${pmLabel}</span>
          ${o.count_of_items?`<span class="oc-tag" style="background:var(--bg);color:var(--text-muted)">${o.count_of_items} صنف</span>`:''}
        </div>
        <div class="oc-amount">${amount.toLocaleString('ar-EG')} ج.م</div>
        ${o.collected_amount?`<div style="font-size:.72rem;color:var(--green);font-weight:600;margin-top:.2rem">✓ محصل: ${Number(o.collected_amount).toLocaleString()} ج</div>`:''}
        ${(o.notes||'').includes('🚨')?`<div class="oc-note note-urgent">🚨 طلب عاجل</div>`:''}
        ${o.staff_notes?`<div class="oc-note note-staff">💼 ${o.staff_notes}</div>`:''}
        ${o.postpone_reason?`<div class="oc-note note-general">⏰ ${o.postpone_reason}</div>`:''}
      </div>
      ${actions?`<div class="oc-actions">${actions}</div>`:''}
    </div>`;
  }).join('');
}

// ACTIONS
function openPickup(id){
  document.getElementById('pk-id').value=id;
  document.getElementById('pickupModal').classList.add('open');
}
async function confirmPickup(){
  const id=document.getElementById('pk-id').value;
  load(true);
  const now=new Date().toISOString();
  await db.from('orders').update({status:'picked',picked_at:now,updated_at:now}).eq('id',id);
  try{await db.from('order_logs').insert({order_id:id,event:'order_picked',details:{},user_id:currentUser.id,user_name:currentUser.full_name});}catch(e){}
  closeModal('pickupModal');
  await loadOrders();
  load(false);
}

function openDeliver(id){
  const o=myOrders.find(x=>x.id===id);if(!o)return;
  document.getElementById('dlv-id').value=id;
  document.getElementById('dlv-pay').value='';
  document.getElementById('dlv-amt').value=o.total_bill_net||'';
  document.getElementById('dlv-note').value='';
  document.querySelectorAll('.pay-opt').forEach(b=>b.className='pay-opt');
  document.getElementById('deliverModal').classList.add('open');
}
function selPay(m,btn){document.querySelectorAll('.pay-opt').forEach(b=>b.className='pay-opt');btn.classList.add(`po-${m}`);document.getElementById('dlv-pay').value=m;}
async function confirmDeliver(){
  const id=document.getElementById('dlv-id').value;
  const pay=document.getElementById('dlv-pay').value;
  if(!pay){alert('اختر طريقة الدفع');return;}
  const amt=parseFloat(document.getElementById('dlv-amt').value)||0;
  const note=document.getElementById('dlv-note').value.trim();
  load(true);
  const now=new Date().toISOString();
  await db.from('orders').update({status:'delivered',payment_method:pay,collected_amount:amt,driver_notes:note||null,delivered_at:now,updated_at:now}).eq('id',id);
  try{await db.from('order_logs').insert({order_id:id,event:'order_delivered',details:{payment:pay,amount:amt},user_id:currentUser.id,user_name:currentUser.full_name});}catch(e){}
  closeModal('deliverModal');
  await loadOrders();
  load(false);
}

function openIssue(id){
  document.getElementById('iss-id').value=id;
  document.getElementById('iss-note').value='';
  document.getElementById('issueModal').classList.add('open');
}
async function submitIssue(){
  const id=document.getElementById('iss-id').value;
  const type=document.getElementById('iss-type').value;
  const note=document.getElementById('iss-note').value;
  const o=myOrders.find(x=>x.id===id);
  load(true);
  const now=new Date().toISOString();
  await db.from('orders').update({status:'postponed',postpone_reason:type,driver_notes:note||null,attempt_count:(o?.attempt_count||0)+1,driver_id:null,deliveryman:null,assigned_at:null,picked_at:null,updated_at:now}).eq('id',id);
  try{await db.from('order_logs').insert({order_id:id,event:'order_postponed',details:{reason:type},user_id:currentUser.id,user_name:currentUser.full_name});}catch(e){}
  closeModal('issueModal');
  await loadOrders();
  load(false);
}

function requestBreak(){
  document.getElementById('brk-reason').value='';
  document.getElementById('breakModal').classList.add('open');
}
async function submitBreak(){
  if(!driverRecord){alert('خطأ في بيانات الطيار');return;}
  const reason=document.getElementById('brk-reason').value.trim();
  load(true);
  await db.from('driver_breaks').insert({driver_id:driverRecord.id,requested_by:'driver',status:'pending',duration_minutes:settings?.break_duration_minutes||30,notes:reason||null});
  closeModal('breakModal');
  alert('✓ تم إرسال طلب الاستراحة — انتظر موافقة الإدارة');
  load(false);
}

function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
function load(s){document.getElementById('lo').classList.toggle('show',s);}
function doLogout(){sessionStorage.removeItem('delivery_user');window.location.href='auth.html';}
</script>
