<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — Phalix</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #1a56db;
    --primary-dark: #1344b0;
    --primary-light: #e8f0fe;
    --danger: #dc2626;
    --success: #16a34a;
    --text: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f9fafb;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .login-wrapper {
    width: 100%;
    max-width: 420px;
  }

  .logo-area {
    text-align: center;
    margin-bottom: 2rem;
  }

  .logo-icon {
    width: 64px;
    height: 64px;
    background: var(--primary);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .logo-icon svg {
    width: 32px;
    height: 32px;
    fill: white;
  }

  .logo-area h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
  }

  .logo-area p {
    font-size: 0.875rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }

  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  input {
    width: 100%;
    height: 44px;
    padding: 0 1rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--white);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap input {
    padding-left: 2.75rem;
  }

  .input-icon {
    position: absolute;
    left: 0.875rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .btn {
    width: 100%;
    height: 46px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .btn:hover { background: var(--primary-dark); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .error-msg {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--danger);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    margin-top: 1rem;
    display: none;
    align-items: center;
    gap: 0.5rem;
  }

  .error-msg.show { display: flex; }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .btn.loading .spinner { display: block; }
  .btn.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-note {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* شاشة التحقق الأولي (لما يكون فيه جلسة محفوظة بالفعل) */
  .checking-screen {
    text-align: center;
    padding: 2rem;
  }
  .checking-screen .spinner {
    display: block;
    margin: 0 auto 1rem;
    border-top-color: var(--primary);
    border: 3px solid var(--primary-light);
    border-top-color: var(--primary);
    width: 32px;
    height: 32px;
  }
  .checking-screen p {
    color: var(--text-muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="logo-area">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
      </svg>
    </div>
    <h1>Phalix</h1>
    <p>سجّل دخولك للمتابعة</p>
  </div>

  <div class="card" id="checkingCard">
    <div class="checking-screen">
      <div class="spinner"></div>
      <p>جاري التحقق من الجلسة...</p>
    </div>
  </div>

  <div class="card" id="loginCard" style="display:none">
    <div class="form-group">
      <label for="username">اسم المستخدم</label>
      <div class="input-wrap">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <div class="input-wrap">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
      </div>
    </div>

    <button class="btn" id="loginBtn" onclick="handleLogin()">
      <div class="spinner"></div>
      <span class="btn-text">تسجيل الدخول</span>
    </button>

    <div class="error-msg" id="errorMsg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errorText">اسم المستخدم أو كلمة المرور غير صحيحة</span>
    </div>
  </div>

  <p class="footer-note">نظام إدارة التوصيل &copy; 2025</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const LOGIN_URL  = 'https://agent.ebrahimhamdy.com/webhook/login';
  const VERIFY_URL = 'https://agent.ebrahimhamdy.com/webhook/verify_token';

  function redirectByRole(role) {
    if (role === 'driver') {
      window.location.href = 'driver.html';
    } else {
      window.location.href = 'app.html';
    }
  }

  function showLoginForm() {
    document.getElementById('checkingCard').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') handleLogin();
    });
  }

  // ===== تحقق أول: هل فيه جلسة صالحة بالفعل (من الـ ERP أو دخول سابق)؟ =====
  async function checkExistingSession() {
    const token = localStorage.getItem('authToken');
    if (!token) return false;

    try {
      const response = await fetch(VERIFY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });
      if (!response.ok) return false;
      const data = await response.json();
      if (data && data.valid === true) {
        redirectByRole(data.role || localStorage.getItem('userRole'));
        return true;
      }
    } catch (e) {
      console.warn('checkExistingSession failed', e);
    }
    return false;
  }

  (async () => {
    const hasSession = await checkExistingSession();
    if (!hasSession) showLoginForm();
  })();

  // ===== تسجيل الدخول عبر الـ login workflow الموحّد =====
  async function loginRequest(username, password) {
    try {
      const response = await fetch(LOGIN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ user: username, pass: password })
      });
      if (!response.ok) return { status: 'error', message: 'السيرفر لا يستجيب' };
      return await response.json();
    } catch (e) {
      return { status: 'error', message: 'فشل الاتصال بالإنترنت أو السيرفر' };
    }
  }

  async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    if (!username || !password) {
      showError('من فضلك أدخل اسم المستخدم وكلمة المرور');
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;
    errorMsg.classList.remove('show');

    try {
      const result = await loginRequest(username, password);

      if (result && result.status === 'success') {
        localStorage.setItem('authToken',  result.token);
        localStorage.setItem('activeUser', result.user);
        localStorage.setItem('userBranch', result.branch);
        localStorage.setItem('userRole',   result.role || 'employee');
        localStorage.setItem('fullName',   result.full_name || result.user);
        localStorage.setItem('loginTime',  Date.now());

        // جلب وتخزين branch_id (uuid) مرة واحدة وقت الدخول لغير الـ admin
        if (result.role !== 'admin' && result.branch) {
          const { data: b } = await db.from('branches').select('id').eq('name', result.branch).maybeSingle();
          localStorage.setItem('userBranchId', b?.id || '');
        } else {
          localStorage.setItem('userBranchId', '');
        }

        redirectByRole(result.role);
      } else {
        showError(result?.message || 'اسم المستخدم أو كلمة المرور غير صحيحة');
      }
    } catch (err) {
      showError('حدث خطأ، حاول مرة أخرى');
      console.error(err);
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  function showError(msg) {
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorMsg').classList.add('show');
  }
</script>
</body>
</html>
