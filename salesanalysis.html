<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تحليل المبيعات - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-md,10px);padding:12px 14px;margin-bottom:14px;}
    .filters .fld{display:flex;flex-direction:column;gap:4px;}
    .filters label{font-size:0.72rem;font-weight:700;color:var(--text-secondary);}
    .filters input,.filters select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-primary);font-family:var(--font);font-size:0.85rem;}
    .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
    .tab-btn{padding:9px 16px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text-secondary);border-radius:9px;font-family:var(--font);font-weight:700;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:7px;}
    .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
    .tab-btn .cnt{background:var(--danger);color:#fff;font-size:0.7rem;font-weight:800;min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;}
    .tab-btn.active .cnt{background:rgba(255,255,255,.25);}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--border);font-size:0.83rem;}
    thead th{background:var(--surface-3);font-weight:800;font-size:0.78rem;color:var(--text-secondary);white-space:nowrap;}
    tbody tr:hover{background:var(--surface-3);}
    .diff-pos{color:var(--danger);font-weight:800;}
    .diff-neg{color:#0e7490;font-weight:800;}
    .rev-btn{background:var(--success);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-family:var(--font);font-weight:700;font-size:0.78rem;cursor:pointer;}
    .rev-btn:hover{filter:brightness(.95);}
    .disc-row{cursor:pointer;}
    .caret{transition:transform .15s;color:var(--text-secondary);font-size:0.75rem;margin-left:5px;}
    .sub-inner{padding:6px 4px 10px;}
    .sub-tbl{width:100%;border-collapse:collapse;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
    .sub-tbl th,.sub-tbl td{padding:6px 9px;border-bottom:1px solid var(--border);font-size:0.78rem;}
    .sub-tbl thead th{background:var(--surface-3);color:var(--text-secondary);font-weight:700;}
    .empty-tab{text-align:center;color:var(--text-muted);padding:40px;font-size:0.9rem;}
    .blocked{text-align:center;padding:60px 20px;color:var(--danger);font-size:1rem;font-weight:700;}
    .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
    .kpi{background:var(--surface-3);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center;}
    .kpi-val{font-size:1.25rem;font-weight:900;color:var(--text-primary);}
    .kpi-lbl{font-size:0.75rem;color:var(--text-secondary);font-weight:700;margin-top:3px;}
    .kpi-sub{font-size:0.68rem;color:var(--text-muted);margin-top:2px;}
    .sec-title{font-size:0.92rem;font-weight:800;color:var(--accent-dark,#3730a3);margin:18px 2px 10px;padding-right:8px;border-right:3px solid var(--accent);}
    .chan-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
    .chan{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
    .chan-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
    .chan-name{font-weight:800;font-size:0.88rem;}
    .chan-pct{font-weight:900;font-size:1.05rem;}
    .chan-bar{height:8px;background:var(--surface-3);border-radius:6px;overflow:hidden;}
    .chan-bar>div{height:100%;border-radius:6px;}
    .chan-meta{font-size:0.75rem;color:var(--text-secondary);margin-top:6px;}
    .hours{display:flex;gap:4px;align-items:flex-end;height:130px;padding:6px 2px;overflow-x:auto;}
    .hbar{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
    .hbar-fill{width:70%;min-height:2px;background:linear-gradient(180deg,var(--accent),#93c5fd);border-radius:5px 5px 0 0;}
    .hbar-lbl{font-size:0.62rem;color:var(--text-muted);margin-top:4px;white-space:nowrap;}
    .emp-sec{margin-bottom:16px;}
    .emp-chart{display:flex;flex-direction:column;gap:7px;}
    .ec-row{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;}
    .ec-name{font-size:0.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
    .ec-track{height:15px;background:var(--surface-3);border-radius:8px;overflow:hidden;}
    .ec-fill{height:100%;border-radius:8px;min-width:3px;}
    .ec-val{font-size:0.75rem;font-weight:800;white-space:nowrap;color:var(--text-secondary);}
    .ec-val b{color:var(--text-primary);}
    /* ===== نظرة عامة احترافية ===== */
    .ov-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:2px 2px 16px;}
    .ov-period{font-size:0.9rem;font-weight:800;color:var(--text-primary);display:flex;align-items:center;gap:7px;}
    .ov-period i{color:var(--accent);}
    .ov-days{font-size:0.72rem;color:var(--text-secondary);font-weight:700;background:var(--surface-3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;}
    .ov-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px;}
    .ov-kpi{position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;overflow:hidden;}
    .ov-kpi::after{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--_c,var(--accent));}
    .ov-kpi-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:#fff;background:var(--_c,var(--accent));margin-bottom:10px;}
    .ov-kpi-val{font-size:1.45rem;font-weight:900;color:var(--text-primary);line-height:1.15;}
    .ov-kpi-val small{font-size:0.72rem;font-weight:700;color:var(--text-secondary);}
    .ov-kpi-lbl{font-size:0.74rem;color:var(--text-secondary);font-weight:700;margin-top:5px;}
    .ov-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:16px;}
    .ov-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
    .ov-card-title{font-size:0.95rem;font-weight:800;color:var(--text-primary);display:flex;align-items:center;gap:8px;}
    .ov-card-title i{color:var(--accent);}
    .ov-card-sub{font-size:0.72rem;color:var(--text-muted);font-weight:700;}
    .ov-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    @media(max-width:760px){.ov-grid2{grid-template-columns:1fr;}}
    .ov-hours{display:flex;gap:5px;align-items:flex-end;height:170px;padding:8px 2px 2px;overflow-x:auto;}
    .ov-hbar{flex:1;min-width:24px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
    .ov-hbar-fill{width:64%;min-height:3px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent),#bfdbfe);transition:filter .15s;}
    .ov-hbar:hover .ov-hbar-fill{filter:brightness(1.12);}
    .ov-hbar.peak .ov-hbar-fill{background:linear-gradient(180deg,#16a34a,#86efac);}
    .ov-hbar-cap{font-size:0.6rem;font-weight:800;color:var(--text-secondary);margin-bottom:3px;min-height:0.85em;}
    .ov-hbar-lbl{font-size:0.6rem;color:var(--text-muted);margin-top:5px;white-space:nowrap;}
    .ov-rank{display:flex;flex-direction:column;gap:10px;}
    .ov-rk{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;}
    .ov-rk-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:800;background:var(--surface-3);color:var(--text-secondary);flex-shrink:0;}
    .ov-rk-num.top{background:#fed7aa;color:#9a3412;}
    .ov-rk-body{min-width:0;}
    .ov-rk-name{font-size:0.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ov-rk-track{height:7px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-top:5px;}
    .ov-rk-fill{height:100%;border-radius:6px;min-width:3px;}
    .ov-rk-val{font-size:0.76rem;font-weight:800;color:var(--text-primary);white-space:nowrap;text-align:left;line-height:1.3;}
    .ov-rk-val small{color:var(--text-muted);font-weight:700;font-size:0.66rem;}
    .ov-staff-ctrl{display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text-secondary);font-weight:700;}
    .ov-staff-ctrl input{width:56px;padding:4px 6px;border:1.5px solid var(--border);border-radius:8px;text-align:center;font-family:var(--font);font-weight:800;background:var(--surface-3);color:var(--text-primary);}
    .ov-staff-table tr.peak{background:rgba(22,163,74,.08);}
    .ov-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 8px;border-radius:8px;font-weight:900;font-size:0.85rem;background:var(--surface-3);color:var(--text-primary);}
    .ov-badge.hi{background:#dcfce7;color:#15803d;}
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-chart-line"></i> تحليل المبيعات</div>
        <button class="btn btn-primary" onclick="loadActive()"><i class="fas fa-sync-alt"></i> تحديث</button>
      </div>

      <div id="accessPanel" style="display:none;background:var(--surface-3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px">
        <div style="font-weight:800;font-size:0.88rem;margin-bottom:6px"><i class="fas fa-user-lock"></i> صلاحيات فتح الشاشة لمديري الفروع</div>
        <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:10px">حدّد الفروع اللي مديرها يقدر يفتح شاشة تحليل المبيعات — كل مدير يشوف فرعه فقط. الأدمن يشوف كل الفروع دائمًا.</div>
        <div id="accessBoxes" style="display:flex;gap:18px;flex-wrap:wrap"></div>
      </div>

      <div id="main" style="display:none">
        <div class="filters">
          <div class="fld" id="fldFrom"><label>من تاريخ</label><input type="date" id="fFrom" onchange="loadActive()"></div>
          <div class="fld" id="fldTo"><label>إلى تاريخ</label><input type="date" id="fTo" onchange="loadActive()"></div>
          <div class="fld"><label>الفرع</label>
            <select id="fStore" onchange="loadActive()">
              <option value="">كل الفروع</option>
              <option value="الصيدلية">المعمورة</option>
              <option value="ابراهيم حمدي 2">سان ستيفانو</option>
              <option value="ابراهيم حمدي 3">سيدى بشر</option>
            </select>
          </div>
        </div>

        <div class="tabs">
          <button class="tab-btn active" id="tab-overview" onclick="switchTab('overview')">
            <i class="fas fa-gauge-high"></i> نظرة عامة
          </button>
          <button class="tab-btn" id="tab-emp" onclick="switchTab('emp')">
            <i class="fas fa-user-tie"></i> أداء الموظفين
          </button>
          <button class="tab-btn" id="tab-price" onclick="switchTab('price')">
            <i class="fas fa-tags"></i> مراجعة الأسعار <span class="cnt" id="cnt-price" style="display:none">0</span>
          </button>
          <button class="tab-btn" id="tab-disc" onclick="switchTab('disc')">
            <i class="fas fa-percent"></i> فواتير الخصومات <span class="cnt" id="cnt-disc" style="display:none">0</span>
          </button>
        </div>

        <div id="tableWrap" style="overflow-x:auto">
          <div class="empty-tab"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
        </div>
      </div>

      <div id="blocked" class="blocked" style="display:none">
        <i class="fas fa-lock" style="font-size:2rem;display:block;margin-bottom:12px"></i>
        هذه الشاشة متاحة للأدمن فقط
      </div>
    </div>
  </div>

  <script src="api.js?v=salesanalysis6"></script>
  <script>
    let ACTIVE = 'overview';
    let USER = '';
    let SCOPED_STORE = null;   // لو مدير فرع: يتقفل على فرعه
    let OV_HOURS = [];         // فواتير كل ساعة (مجموع الفترة) — لحساب جدول الموظفين
    let OV_ACTIVE_DAYS = 0;    // عدد أيام العمل في الفترة (لحساب المتوسط اليومي)

    // الفروع الثلاثة (store_name الحقيقي + الاسم المعروض)
    const BRANCHES = [
      { store:'الصيدلية',        label:'المعمورة' },
      { store:'ابراهيم حمدي 2',  label:'سان ستيفانو' },
      { store:'ابراهيم حمدي 3',  label:'سيدى بشر' }
    ];
    // يحوّل الفرع المخزّن للمستخدم (اسم معروض أو store_name) إلى store_name الحقيقي
    const STORE_BY_BRANCH = {
      'المعمورة':'الصيدلية', 'سان ستيفانو':'ابراهيم حمدي 2', 'سيدى بشر':'ابراهيم حمدي 3',
      'الصيدلية':'الصيدلية', 'ابراهيم حمدي 2':'ابراهيم حمدي 2', 'ابراهيم حمدي 3':'ابراهيم حمدي 3'
    };

    checkAuth().then(async user => {
      if (!user) return;
      USER = localStorage.getItem('activeUser') || '';
      const role   = (localStorage.getItem('userRole')   || '').trim();
      const branch = (localStorage.getItem('userBranch') || '').trim();

      // الأدمن: كل الفروع + لوحة التحكم في الصلاحيات
      if (role === 'admin') {
        document.getElementById('main').style.display = 'block';
        buildAccessPanel();
        loadActive();
        return;
      }

      // غير الأدمن: لازم يكون فرعه مسموح له
      const myStore = STORE_BY_BRANCH[branch] || '';
      const allowed = (await sbSalesAccessList()).map(r => r.store_name);
      if (myStore && allowed.includes(myStore)) {
        SCOPED_STORE = myStore;
        const sel = document.getElementById('fStore');
        sel.value = myStore;
        sel.disabled = true;
        const fld = sel.closest('.fld'); if (fld) fld.style.display = 'none';   // نخفي منتقي الفرع
        document.getElementById('main').style.display = 'block';
        loadActive();
      } else {
        const b = document.getElementById('blocked');
        b.innerHTML = '<i class="fas fa-lock" style="font-size:2rem;display:block;margin-bottom:12px"></i> هذه الشاشة غير متاحة لفرعك';
        b.style.display = 'block';
      }
    });

    // لوحة الأدمن: فتح/غلق الشاشة لكل فرع
    async function buildAccessPanel(){
      const panel = document.getElementById('accessPanel');
      panel.style.display = 'block';
      const boxes = document.getElementById('accessBoxes');
      boxes.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const allowed = (await sbSalesAccessList()).map(r => r.store_name);
      boxes.innerHTML = BRANCHES.map((b,i)=>`
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:700;font-size:0.85rem">
          <input type="checkbox" id="acc-${i}" ${allowed.includes(b.store)?'checked':''} onchange="toggleAccess(${i},this.checked)">
          ${esc(b.label)}
        </label>`).join('');
    }
    async function toggleAccess(i, on){
      const b = BRANCHES[i]; const cb = document.getElementById('acc-'+i);
      if (cb) cb.disabled = true;
      const ok = on ? await sbSalesAccessEnable(b.store) : await sbSalesAccessDisable(b.store);
      if (cb) cb.disabled = false;
      if (!ok){ alert('تعذّر حفظ الصلاحية'); if (cb) cb.checked = !on; }
    }

    function fltFrom(){ const v=document.getElementById('fFrom').value; return v ? new Date(v+'T00:00:00').toISOString() : null; }
    function fltTo(){ const v=document.getElementById('fTo').value; if(!v) return null; const d=new Date(v+'T00:00:00'); d.setDate(d.getDate()+1); return d.toISOString(); }
    function fltStore(){ if(SCOPED_STORE) return SCOPED_STORE; return document.getElementById('fStore').value || null; }
    // bill_date جاي من sales_items (مخزّن كوقت محلي مُعلّم UTC) — نعرضه UTC عشان يطلع الوقت الحقيقي بدون إزاحة +3
    function fmtDT(s){ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'})+' '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'UTC'}); }
    function num(n){ return (Number(n)||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function switchTab(t){
      ACTIVE=t;
      ['overview','emp','price','disc'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active', t===x));
      updateFilterVis();
      loadActive();
    }

    // النظرة العامة دائمًا الشهر الحالي — نخفي فلتر التواريخ فيها لتفادي اللبس
    function updateFilterVis(){
      const show = ACTIVE !== 'overview';
      const ff=document.getElementById('fldFrom'), ft=document.getElementById('fldTo');
      if(ff) ff.style.display = show ? '' : 'none';
      if(ft) ft.style.display = show ? '' : 'none';
    }

    function loadActive(){
      updateFilterVis();
      if(ACTIVE==='overview') return loadOverview();
      if(ACTIVE==='emp')      return loadEmployees();
      if(ACTIVE==='price')    return loadPrice();
      return loadDisc();
    }

    function pct(part, whole){ whole=Number(whole)||0; return whole>0 ? Math.round((Number(part)||0)/whole*100) : 0; }

    // مدى الشهر الحالي (من أول الشهر لحد دلوقتي) + عدد الأيام المنقضية + اسم الشهر
    function curMonthRange(){
      const now = new Date();
      const from = new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0);
      // نستبعد اليوم الحالي (الناقص) — المدى لحد بداية النهاردة = نهاية أمس، عشان المعدل يبقى على أيام كاملة بس
      const toEx = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0,0);
      return { from: from.toISOString(), to: toEx.toISOString(),
               label: now.toLocaleDateString('ar-EG',{month:'long',year:'numeric'}) };
    }

    // المدى الفعّال: الشهر الحالي افتراضيًا، إلا لو المستخدم اختار تاريخ
    function effRange(){
      const f=document.getElementById('fFrom').value, t=document.getElementById('fTo').value;
      if(!f && !t){ const m=curMonthRange(); return { from:m.from, to:m.to, label:'الشهر الحالي (حتى أمس) — '+m.label }; }
      return { from: fltFrom(), to: fltTo(), label:'الفترة المختارة' };
    }

    async function loadOverview(){
      const wrap=document.getElementById('tableWrap');
      wrap.innerHTML='<div class="empty-tab"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
      const mr = effRange();
      const hours = await sbSalesByHour(mr.from, mr.to, fltStore());
      // عدد الفواتير لكل ساعة، ونرتّب الساعات من 9ص لـ8ص اليوم اللي بعده (يوم العمل 24 ساعة)
      const byHr = {};
      (hours||[]).forEach(h=>{ byHr[Number(h.hr)] = Number(h.bills)||0; });
      const data = [];
      for(let i=0;i<24;i++){ const hr=(9+i)%24; data.push({ hr, bills: byHr[hr]||0 }); }
      // أيام العمل الفعلية في الفترة — عشان نحوّل مجموع الساعة لمتوسط يومي (لجدول الموظفين)
      const activeDays = ((await sbSalesActiveDays(mr.from, mr.to, fltStore()))||{}).active_days || 0;
      OV_HOURS = data; OV_ACTIVE_DAYS = activeDays;
      const hrLabel = hr => (hr%12===0?12:hr%12)+(hr<12?'ص':'م');
      const maxB = Math.max(1, ...data.map(d=>d.bills));
      const peak = data.reduce((a,b)=> b.bills>a.bills?b:a, {hr:9,bills:0});
      const peakAvg = activeDays>0 ? peak.bills/activeDays : 0;
      const bars = data.map(d=>{
        const isPeak = d.bills===maxB && maxB>0;
        const avg = activeDays>0 ? d.bills/activeDays : 0;
        return `<div class="ov-hbar${isPeak?' peak':''}" title="${hrLabel(d.hr)} — ${d.bills} فاتورة إجمالي · متوسط ${avg.toFixed(1)}/يوم">
          <div class="ov-hbar-cap">${avg>=1?Math.round(avg):''}</div>
          <div class="ov-hbar-fill" style="height:${Math.round(d.bills/maxB*100)}%"></div>
          <div class="ov-hbar-lbl">${hrLabel(d.hr)}</div></div>`;
      }).join('');
      // ===== الخصومات =====
      const dstats = await sbSalesDiscountStats(mr.from, mr.to, fltStore());
      const dTotal = (dstats||[]).find(x=>x.grp==='total') || { bills:0, discount:0 };
      const dEmps  = (dstats||[]).filter(x=>x.grp==='employee').sort((a,b)=>Number(b.discount)-Number(a.discount));
      const dCusts = (dstats||[]).filter(x=>x.grp==='customer').sort((a,b)=>Number(b.discount)-Number(a.discount));
      const totD   = Number(dTotal.discount)||0;
      const dBills = Number(dTotal.bills)||0;
      const avgDisc= dBills>0 ? totD/dBills : 0;
      const custLabel = n => (!n || n==='—') ? 'عميل نقدي (بدون اسم)' : n;

      // قائمة ترتيب احترافية بقيمة الخصم (أعلى 12)
      const rankList = (list, color, nameFn) => {
        if(!list.length) return '<div class="empty-tab">لا توجد خصومات</div>';
        const top = list.slice(0,12);
        const max = Math.max(1, ...top.map(r=>Number(r.discount)||0));
        return `<div class="ov-rank">${top.map((r,i)=>{ const v=Number(r.discount)||0; const p=totD>0?Math.round(v/totD*100):0; const nm=nameFn(r.name);
          return `<div class="ov-rk" title="${esc(nm)} — ${num(v)} ج · ${r.bills} فاتورة (${p}%)">
            <div class="ov-rk-num${i<3?' top':''}">${i+1}</div>
            <div class="ov-rk-body"><div class="ov-rk-name">${esc(nm)}</div>
              <div class="ov-rk-track"><div class="ov-rk-fill" style="width:${Math.round(v/max*100)}%;background:${color}"></div></div></div>
            <div class="ov-rk-val">${num(v)} ج<br><small>${r.bills} فات · ${p}%</small></div>
          </div>`;}).join('')}</div>
          ${list.length>12?`<div style="font-size:0.72rem;color:var(--text-muted);margin:8px 2px 0">+ ${list.length-12} غيرهم…</div>`:''}`;
      };
      const kpi = (c,ic,val,lbl,idAttr='') => `<div class="ov-kpi" style="--_c:${c}"><div class="ov-kpi-ic"><i class="fas ${ic}"></i></div><div class="ov-kpi-val"${idAttr}>${val}</div><div class="ov-kpi-lbl">${lbl}</div></div>`;

      wrap.innerHTML = `
        <div class="ov-head">
          <div class="ov-period"><i class="fas fa-calendar-day"></i> ${esc(mr.label)}</div>
          <div class="ov-days">يوم العمل 9ص–8:59ص · ${activeDays} يوم</div>
        </div>

        <div class="ov-kpis">
          ${kpi('#dc2626','fa-tags', `${num(totD)} <small>ج</small>`, 'إجمالي قيمة الخصم')}
          ${kpi('#2563eb','fa-file-invoice', dBills, 'فواتير عليها خصم')}
          ${kpi('#d97706','fa-percent', `${num(avgDisc)} <small>ج</small>`, 'متوسط الخصم/فاتورة')}
          ${kpi('#16a34a','fa-clock', `${hrLabel(peak.hr)} <small>${peakAvg.toFixed(0)}/س</small>`, 'ساعة الذروة')}
          ${kpi('#7c3aed','fa-users', '—', 'أقصى موظفين مطلوبين', ' id="kpiPeakStaff"')}
        </div>

        <div class="ov-card">
          <div class="ov-card-head">
            <div class="ov-card-title"><i class="fas fa-chart-column"></i> ساعات الذروة</div>
            <div class="ov-card-sub">الرقم فوق العمود = متوسط الفواتير/يوم · الأخضر = الذروة</div>
          </div>
          <div class="ov-hours">${bars||'<div class="empty-tab">لا يوجد بيانات</div>'}</div>
        </div>

        <div class="ov-card">
          <div class="ov-card-head">
            <div class="ov-card-title"><i class="fas fa-user-clock"></i> الموظفون المطلوبون حسب الفترة</div>
            <div class="ov-staff-ctrl">كل فاتورة ≈
              <input id="minPerBill" type="number" min="1" max="60" value="7" oninput="renderStaffTable()"> دقيقة</div>
          </div>
          <div id="staffTable"></div>
        </div>

        <div class="ov-grid2">
          <div class="ov-card">
            <div class="ov-card-head"><div class="ov-card-title"><i class="fas fa-user-tie"></i> أكثر الموظفين عملاً للخصومات</div></div>
            ${rankList(dEmps, 'linear-gradient(90deg,#dc2626,#f87171)', n=>n||'—')}
          </div>
          <div class="ov-card">
            <div class="ov-card-head"><div class="ov-card-title"><i class="fas fa-user-group"></i> أكثر العملاء حصولاً على خصم</div></div>
            ${rankList(dCusts, 'linear-gradient(90deg,#d97706,#fbbf24)', custLabel)}
          </div>
        </div>
      `;
      renderStaffTable();
    }

    // جدول الموظفين المطلوبين لكل ساعة:
    // متوسط الفواتير/الساعة = مجموع الساعة ÷ أيام العمل، والموظف يخدم (60÷دقائق_الفاتورة) فاتورة/ساعة
    // فالمطلوب = ⌈ متوسط الفواتير × دقائق_الفاتورة ÷ 60 ⌉
    function renderStaffTable(){
      const el = document.getElementById('staffTable'); if(!el) return;
      const mpb  = Math.max(1, Number((document.getElementById('minPerBill')||{}).value) || 7);
      const days = OV_ACTIVE_DAYS || 0;
      const hrLabel = hr => (hr%12===0?12:hr%12)+(hr<12?'ص':'م');
      if(!days || !OV_HOURS.some(d=>d.bills>0)){ el.innerHTML='<div class="empty-tab">لا يوجد بيانات كافية</div>'; return; }
      const rows = OV_HOURS.map(d=>{
        const avg = days>0 ? d.bills/days : 0;
        return { hr:d.hr, avg, staff: Math.ceil(avg*mpb/60) };
      });
      const maxStaff = Math.max(1, ...rows.map(r=>r.staff));
      const totNeeded = rows.reduce((s,r)=>s+r.staff,0); // مجموع ساعات-الموظف على مدار اليوم
      const kps = document.getElementById('kpiPeakStaff'); if(kps) kps.textContent = maxStaff;
      el.innerHTML = `<table class="ov-staff-table"><thead><tr>
          <th>الفترة</th><th>متوسط الفواتير/الساعة</th><th>الموظفون المطلوبون</th></tr></thead><tbody>
        ${rows.map(r=>{ const hot=r.staff===maxStaff && maxStaff>0;
          return `<tr class="${hot?'peak':''}">
            <td style="font-weight:700;white-space:nowrap">${hrLabel(r.hr)} – ${hrLabel((r.hr+1)%24)}</td>
            <td>${r.avg.toFixed(1)}</td>
            <td><span class="ov-badge${hot?' hi':''}">${r.staff}</span>${hot?' <i class="fas fa-fire" style="color:#ea580c"></i>':''}</td>
          </tr>`;}).join('')}
        </tbody>
        <tfoot><tr style="border-top:2px solid var(--border);font-weight:800">
          <td>إجمالي ساعات-الموظف / يوم</td><td></td><td style="color:#2563eb;font-weight:900">${totNeeded}</td></tr></tfoot>
      </table>
      <div style="font-size:0.72rem;color:var(--text-muted);margin:8px 2px 0">💡 «الموظفون المطلوبون» = العدد اللازم في نفس الوقت خلال الساعة لخدمة متوسط الفواتير بدون تكدّس. الصف المميّز = ساعة الذروة.</div>`;
    }

    async function loadEmployees(){
      const wrap=document.getElementById('tableWrap');
      wrap.innerHTML='<div class="empty-tab"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
      const rng = effRange();
      const rows = await sbSalesByEmployee(rng.from, rng.to, fltStore());
      if(!rows.length){ wrap.innerHTML='<div class="empty-tab">لا يوجد بيانات</div>'; return; }

      const totRev = rows.reduce((s,r)=>s+(Number(r.revenue)||0),0);
      const totBills = rows.reduce((s,r)=>s+(Number(r.bills)||0),0);

      // رسم بار أفقي مرتّب تنازليًا: كل موظف + نسبته من الإجمالي
      const chart=(title, valOf, fmtVal, total, color)=>{
        const sorted=[...rows].sort((a,b)=>valOf(b)-valOf(a));
        const max=Math.max(1,...sorted.map(valOf));
        return `<div class="sec-title">${title}</div>
          <div class="emp-sec"><div class="emp-chart">
          ${sorted.map(r=>{ const v=valOf(r); const pctTot=total>0?Math.round(v/total*100):0;
            return `<div class="ec-row" title="${esc(r.employee_name||'—')} — ${fmtVal(v)} (${pctTot}% من الإجمالي)">
              <div class="ec-name">${esc(r.employee_name||'—')}</div>
              <div class="ec-track"><div class="ec-fill" style="width:${Math.round(v/max*100)}%;background:${color}"></div></div>
              <div class="ec-val"><b>${fmtVal(v)}</b> · ${pctTot}%</div>
            </div>`;}).join('')}
          </div></div>`;
      };

      wrap.innerHTML =
        `<div style="font-size:0.8rem;color:var(--text-secondary);font-weight:700;margin:0 2px 12px"><i class="fas fa-calendar-alt"></i> ${esc(rng.label)}</div>`
        + chart('مساهمة الموظفين — بالقيمة (ج)', r=>Number(r.revenue)||0, v=>num(v), totRev, '#2563eb')
        + chart('مساهمة الموظفين — بعدد الفواتير', r=>Number(r.bills)||0, v=>String(v), totBills, '#0d9488');
    }

    async function loadPrice(){
      const wrap=document.getElementById('tableWrap');
      wrap.innerHTML='<div class="empty-tab"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
      const rows = await sbSalesPriceReview(fltFrom(), fltTo(), fltStore());
      setCnt('price', rows.length);
      if(!rows.length){ wrap.innerHTML='<div class="empty-tab">✅ لا توجد مخالفات أسعار للمراجعة</div>'; return; }
      wrap.innerHTML = `<table><thead><tr>
        <th>رقم الفاتورة</th><th>التاريخ والوقت</th><th>الموظف</th><th>الصنف</th><th>الوحدة</th>
        <th>سعر البيع</th><th>سعر المخزون</th><th>الفرق</th><th>مراجعة</th></tr></thead><tbody>
        ${rows.map(r=>`<tr id="pr-${r.id}">
          <td><b>${esc(r.bill_no)}</b></td>
          <td style="white-space:nowrap">${fmtDT(r.bill_date)}</td>
          <td>${esc(r.employee_name||'—')}</td>
          <td style="text-align:right;font-weight:600">${r.itm_code?`<span style="color:var(--text-muted);font-weight:700;margin-left:5px">${esc(r.itm_code)}</span>`:''}${esc(r.itm_name_ar||'—')}</td>
          <td>${esc(r.unit_name||'—')}</td>
          <td>${num(r.unit_price)}</td>
          <td>${num(r.stock_unit_price)}</td>
          <td class="${Number(r.price_diff)>=0?'diff-pos':'diff-neg'}">${Number(r.price_diff)>=0?'+':''}${num(r.price_diff)}</td>
          <td><button class="rev-btn" onclick="doPriceReviewed('${r.id}')"><i class="fas fa-check"></i> تمت</button></td>
        </tr>`).join('')}
      </tbody></table>`;
    }

    async function loadDisc(){
      const wrap=document.getElementById('tableWrap');
      wrap.innerHTML='<div class="empty-tab"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
      const rows = await sbSalesDiscountBills(fltFrom(), fltTo(), fltStore());
      setCnt('disc', rows.length);
      if(!rows.length){ wrap.innerHTML='<div class="empty-tab">✅ لا توجد فواتير خصومات للمراجعة</div>'; return; }
      wrap.innerHTML = `<table><thead><tr>
        <th>رقم الفاتورة</th><th>التاريخ والوقت</th><th>الموظف</th><th>العميل</th><th>الدفع</th>
        <th>الإجمالي</th><th>الصافي</th><th>الخصم</th><th>مراجعة</th></tr></thead><tbody>
        ${rows.map(r=>{ const k=esc(r.store_name)+'-'+esc(r.bill_no); return `<tr class="disc-row" id="dr-${k}" onclick="toggleBill('${esc(r.store_name)}','${esc(r.bill_no)}')">
          <td><i class="fas fa-chevron-left caret" id="cr-${k}"></i><b>${esc(r.bill_no)}</b>${r.bill_notes?` <i class="fas fa-note-sticky" title="${esc(r.bill_notes)}" style="color:#d97706;margin-right:4px"></i>`:''}</td>
          <td style="white-space:nowrap">${fmtDT(r.bill_date)}</td>
          <td>${esc(r.employee_name||'—')}</td>
          <td style="text-align:right">${esc(r.cust_name||'—')}</td>
          <td>${esc(r.bill_type||'—')}</td>
          <td>${num(r.total_bill)}</td>
          <td>${num(r.total_bill_net)}</td>
          <td class="diff-pos">${num(r.discount)}${Number(r.total_bill)>0?` <span style="color:var(--text-muted);font-weight:700;font-size:0.75rem">(${Math.round((Number(r.discount)||0)/Number(r.total_bill)*100)}%)</span>`:''}</td>
          <td><button class="rev-btn" onclick="event.stopPropagation();doDiscReviewed('${esc(r.store_name)}','${esc(r.bill_no)}')"><i class="fas fa-check"></i> تمت</button></td>
        </tr>
        <tr class="sub-row" id="sub-${k}" style="display:none"><td colspan="9"><div class="sub-inner"></div></td></tr>`;}).join('')}
      </tbody></table>`;
    }

    function setCnt(t, n){
      const el=document.getElementById('cnt-'+t);
      el.textContent=n; el.style.display = n>0 ? 'inline-block' : 'none';
    }

    async function doPriceReviewed(id){
      const ok = await sbMarkPriceReviewed(id, USER);
      if(ok){ const tr=document.getElementById('pr-'+id); if(tr) tr.remove(); setCnt('price', document.querySelectorAll('#tableWrap tbody tr').length); }
      else alert('تعذّر الحفظ');
    }
    async function toggleBill(store, bill){
      const k=store+'-'+bill;
      const sub=document.getElementById('sub-'+k); const cr=document.getElementById('cr-'+k);
      if(!sub) return;
      const isOpen = sub.style.display!=='none';
      if(isOpen){ sub.style.display='none'; if(cr) cr.style.transform=''; return; }
      sub.style.display='table-row'; if(cr) cr.style.transform='rotate(-90deg)';
      const inner=sub.querySelector('.sub-inner');
      if(inner.dataset.loaded) return;
      inner.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري تحميل الأصناف...';
      const items=await sbBillItems(store, bill);
      inner.dataset.loaded='1';
      if(!items.length){ inner.innerHTML='<span style="color:var(--text-muted)">لا توجد أصناف</span>'; return; }
      const note = (items[0] && items[0].bill_notes) ? String(items[0].bill_notes).trim() : '';
      inner.innerHTML = (note ? `<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:7px 11px;margin-bottom:8px;font-size:0.82rem;color:#92400e;font-weight:600"><i class="fas fa-note-sticky"></i> ملاحظات الفاتورة: ${esc(note)}</div>` : '')
        + `<table class="sub-tbl"><thead><tr>
        <th>الصنف</th><th>الوحدة</th><th>الكمية</th><th>سعر الوحدة</th><th>خصم السطر</th><th>الإجمالي</th></tr></thead><tbody>
        ${items.map(it=>`<tr>
          <td style="text-align:right">${esc(it.itm_name_ar||it.itm_code||'—')}</td>
          <td>${esc(it.unit_name||'—')}</td>
          <td>${num(it.itm_qty)}</td>
          <td>${num(it.unit_price)}</td>
          <td>${num(it.itm_disc_value)}</td>
          <td>${num(it.line_total)}</td></tr>`).join('')}
      </tbody></table>`;
    }

    async function doDiscReviewed(store, bill){
      const ok = await sbMarkDiscountReviewed(store, bill, USER);
      if(ok){
        const k=store+'-'+bill;
        const tr=document.getElementById('dr-'+k); if(tr) tr.remove();
        const sub=document.getElementById('sub-'+k); if(sub) sub.remove();
        setCnt('disc', document.querySelectorAll('#tableWrap tbody tr.disc-row').length);
      } else alert('تعذّر الحفظ');
    }
  </script>
</body>
</html>
