<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إعدادات المؤسسة - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="config.js?v=20260903"></script>
  <script src="session.js?v=20260903"></script>
  <script src="branches.js?v=20260904"></script>
  <script src="pages.js?v=20260905"></script>
  <script src="brand.js?v=20260904"></script>
  <script src="api.js?v=tt20260830"></script>
  <style>
    :root{ --primary:#0d9488; --primary-dark:#0f766e; --primary-light:#ccfbf1; }
    .container { max-width:820px !important; margin:0 auto; }
    .os-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:20px; margin-bottom:16px; }
    .os-card h3 { font-size:0.95rem; margin:0 0 14px; display:flex; align-items:center; gap:8px; color:var(--text-primary); }
    .os-card h3 i { color:var(--primary); }
    .os-field { margin-bottom:14px; }
    .os-field label { display:block; font-size:0.8rem; font-weight:700; color:var(--text-secondary); margin-bottom:6px; }
    .os-field input[type=text], .os-field textarea { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:var(--font); font-size:0.9rem; background:var(--surface); color:var(--text-primary); outline:none; }
    .os-field input:focus, .os-field textarea:focus { border-color:var(--primary); }

    .os-logo-row { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
    .os-logo-box { width:150px; height:100px; border:1.5px dashed var(--border); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; background:var(--surface-2); overflow:hidden; }
    .os-logo-box img { max-width:100%; max-height:100%; object-fit:contain; }

    .os-colors { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    @media(max-width:560px){ .os-colors{ grid-template-columns:1fr; } }
    .os-color { display:flex; flex-direction:column; gap:6px; }
    .os-color label { font-size:0.78rem; font-weight:700; color:var(--text-secondary); }
    .os-color .row { display:flex; align-items:center; gap:8px; }
    .os-color input[type=color] { width:44px; height:38px; border:1.5px solid var(--border); border-radius:8px; padding:2px; cursor:pointer; background:var(--surface); }
    .os-color input[type=text] { flex:1; padding:8px 10px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:var(--font); font-size:0.82rem; }

    .os-preview { border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }
    .os-pv-bar { padding:12px 16px; color:#fff; font-weight:800; display:flex; align-items:center; gap:8px; }
    .os-pv-body { padding:16px; background:var(--surface-2); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .os-pv-btn { padding:9px 18px; border:none; border-radius:8px; color:#fff; font-family:var(--font); font-weight:700; font-size:0.85rem; }
    .os-pv-badge { padding:3px 12px; border-radius:20px; font-weight:800; font-size:0.75rem; }
    .os-pv-th { padding:6px 14px; color:#fff; font-weight:700; font-size:0.78rem; border-radius:6px; }

    .os-branch-row { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center; }
    .os-branch-row input { padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-family:var(--font); font-size:0.85rem; background:var(--surface); color:var(--text-primary); outline:none; }
    .os-branch-row input:focus { border-color:var(--primary); }
    .os-branch-row .del { border:none; background:none; color:var(--danger); cursor:pointer; font-size:0.95rem; padding:6px 8px; }
    .os-actions { display:flex; gap:10px; justify-content:flex-end; }
    .os-denied { text-align:center; padding:60px 20px; color:var(--text-muted); }
    .os-msg { font-size:0.82rem; font-weight:700; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="page-header">
      <div class="page-title"><i class="fas fa-building"></i> إعدادات المؤسسة</div>
    </div>

    <div id="os-denied" class="os-denied" style="display:none">
      <i class="fas fa-lock" style="font-size:2rem;display:block;margin-bottom:10px;opacity:.4"></i>
      هذه الشاشة للأدمن فقط.
    </div>

    <div id="os-main" style="display:none">
      <!-- الهوية -->
      <div class="os-card">
        <h3><i class="fas fa-id-card"></i> الهوية</h3>
        <div class="os-field"><label>اسم المؤسسة</label><input type="text" id="f-name" placeholder="اسم الصيدلية / الشركة"></div>
        <div class="os-field"><label>الوصف (تحت الاسم في شاشة الدخول)</label><input type="text" id="f-tagline"></div>
      </div>

      <!-- الشعار -->
      <div class="os-card">
        <h3><i class="fas fa-image"></i> الشعار</h3>
        <div class="os-logo-row">
          <div class="os-logo-box"><img id="f-logo-preview" src="" alt="الشعار"></div>
          <div>
            <input type="file" id="f-logo-file" accept="image/*" style="display:none" onchange="onLogoPick(this)">
            <button class="btn btn-primary btn-sm" onclick="document.getElementById('f-logo-file').click()"><i class="fas fa-upload"></i> رفع شعار جديد</button>
            <div id="logo-msg" class="os-msg" style="margin-top:8px;color:var(--text-muted)">PNG بخلفية شفافة يُفضّل.</div>
          </div>
        </div>
      </div>

      <!-- الألوان -->
      <div class="os-card">
        <h3><i class="fas fa-palette"></i> ألوان الهوية</h3>
        <div class="os-colors">
          <div class="os-color"><label>اللون الأساسي</label><div class="row"><input type="color" id="c-primary" oninput="onPrimary()"><input type="text" id="c-primary-t" oninput="syncFromText('primary')"></div></div>
          <div class="os-color"><label>الغامق (hover/عناوين)</label><div class="row"><input type="color" id="c-dark" oninput="syncFromColor('dark')"><input type="text" id="c-dark-t" oninput="syncFromText('dark')"></div></div>
          <div class="os-color"><label>الفاتح (خلفيات)</label><div class="row"><input type="color" id="c-light" oninput="syncFromColor('light')"><input type="text" id="c-light-t" oninput="syncFromText('light')"></div></div>
        </div>
        <div style="margin:14px 0 6px;font-size:0.78rem;color:var(--text-secondary);font-weight:700">معاينة حيّة</div>
        <div class="os-preview">
          <div class="os-pv-bar" id="pv-bar"><i class="fas fa-store"></i> <span id="pv-name">المؤسسة</span></div>
          <div class="os-pv-body">
            <span class="os-pv-th" id="pv-th">رأس جدول</span>
            <button class="os-pv-btn" id="pv-btn">زر أساسي</button>
            <span class="os-pv-badge" id="pv-badge">شارة</span>
            <a href="#" id="pv-link" style="font-weight:800;text-decoration:none">رابط</a>
          </div>
        </div>
      </div>

      <!-- الفروع (عرض فقط — التعديل في شاشة «الفروع») -->
      <div class="os-card">
        <h3><i class="fas fa-code-branch"></i> الفروع</h3>
        <div id="os-branches"></div>
        <div style="font-size:.74rem;color:var(--text-muted);margin-top:10px">
          التعديل من شاشة <b>«الفروع»</b> في تطبيق التوصيل — دي المصدر الوحيد (جدول branches).
          كانت الفروع بتتحرّر من هنا كمان في مكان تخزين تاني، فالاتنين كانوا بيتفرّعوا.
        </div>
      </div>

      <div class="os-actions">
        <span id="save-msg" class="os-msg" style="align-self:center;margin-inline-end:auto"></span>
        <button class="btn btn-primary" onclick="saveSettings()"><i class="fas fa-check"></i> حفظ التغييرات</button>
      </div>
    </div>
  </div>

  <script>
    const REST = SB_URL_API + '/rest/v1/';
    const H = { apikey: SB_ANON_API, Authorization: 'Bearer ' + SB_ANON_API };
    const HW = { ...H, 'Content-Type': 'application/json' };
    const isAdmin = Session.is('admin');
    let pendingLogoUrl = null;

    // ===== الفروع =====
    function escAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }
    // عرض فقط — المصدر جدول branches والتعديل من شاشة «الفروع»
    function renderBranches(){
      document.getElementById('os-branches').innerHTML = Branches.all().map(function(b){
        var al = (b.aliases||[]).join('، ');
        return '<div class="os-branch-row" style="grid-template-columns:1fr auto">'
          + '<div style="font-weight:700">' + escAttr(b.name)
          +   (al ? ' <span style="font-weight:400;color:var(--text-muted);font-size:.8rem">(' + escAttr(al) + ')</span>' : '')
          + '</div>'
          + '<code style="font-size:.78rem;color:var(--text-muted)">' + escAttr(b.code || '—') + '</code>'
          + '</div>';
      }).join('') || '<div style="color:var(--text-muted);font-size:.8rem">لا فروع</div>';
    }
    Branches.onChange(function(){ if (document.getElementById('os-branches')) renderBranches(); });

    // ===== أدوات ألوان =====
    function hx(h){ h=(h||'').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
    function toHex(r,g,b){ return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join(''); }
    function darken(h,a){ var c=hx(h); return toHex(c[0]*(1-a),c[1]*(1-a),c[2]*(1-a)); }
    function lighten(h,a){ var c=hx(h); return toHex(c[0]+(255-c[0])*a,c[1]+(255-c[1])*a,c[2]+(255-c[2])*a); }
    function isHex(v){ return /^#?[0-9a-fA-F]{6}$/.test((v||'').trim()) || /^#?[0-9a-fA-F]{3}$/.test((v||'').trim()); }
    function norm(v){ v=v.trim(); return v[0]==='#'?v:'#'+v; }

    function setColor(which, hex){
      document.getElementById('c-'+which).value = hex;
      document.getElementById('c-'+which+'-t').value = hex;
      preview();
    }
    function onPrimary(){
      var p = document.getElementById('c-primary').value;
      document.getElementById('c-primary-t').value = p;
      setColor('dark', darken(p, 0.18));
      setColor('light', lighten(p, 0.85));
      preview();
    }
    function syncFromColor(which){ document.getElementById('c-'+which+'-t').value = document.getElementById('c-'+which).value; preview(); }
    function syncFromText(which){
      var v = document.getElementById('c-'+which+'-t').value;
      if (isHex(v)) { document.getElementById('c-'+which).value = norm(v); if(which==='primary'){ setColor('dark',darken(norm(v),0.18)); setColor('light',lighten(norm(v),0.85)); } preview(); }
    }
    function preview(){
      var p = document.getElementById('c-primary').value, d = document.getElementById('c-dark').value, l = document.getElementById('c-light').value;
      document.getElementById('pv-bar').style.background = p;
      document.getElementById('pv-th').style.background = p;
      document.getElementById('pv-btn').style.background = p;
      document.getElementById('pv-badge').style.background = l; document.getElementById('pv-badge').style.color = d;
      document.getElementById('pv-link').style.color = d;
      document.getElementById('pv-name').textContent = document.getElementById('f-name').value || 'المؤسسة';
    }

    // ===== الشعار =====
    function onLogoPick(inp){
      var f = inp.files && inp.files[0]; if(!f) return;
      var reader = new FileReader();
      reader.onload = e => { document.getElementById('f-logo-preview').src = e.target.result; };
      reader.readAsDataURL(f);
      document.getElementById('logo-msg').textContent = 'جارٍ الرفع…'; document.getElementById('logo-msg').style.color = 'var(--text-muted)';
      uploadLogo(f).then(url => { pendingLogoUrl = url; document.getElementById('logo-msg').textContent = 'تم رفع الشعار ✓ — اضغط «حفظ»'; document.getElementById('logo-msg').style.color = '#16a34a'; })
        .catch(() => { document.getElementById('logo-msg').textContent = 'تعذّر رفع الشعار'; document.getElementById('logo-msg').style.color = 'var(--danger)'; });
    }
    async function uploadLogo(file){
      var ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g,'') || 'png';
      var path = 'logo_' + Date.now() + '.' + ext;
      var r = await fetch(SB_URL_API + '/storage/v1/object/branding/' + path, {
        method:'POST', headers:{ ...H, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'true' }, body: file
      });
      if(!r.ok) throw new Error(await r.text());
      return SB_URL_API + '/storage/v1/object/public/branding/' + path;
    }

    // ===== تحميل/حفظ =====
    async function load(){
      if (!isAdmin){ document.getElementById('os-denied').style.display='block'; return; }
      document.getElementById('os-main').style.display='block';
      try {
        var d = (await (await fetch(REST+'org_settings?select=*&id=eq.1', { headers:H })).json())[0];
        if (!d) return;
        document.getElementById('f-name').value = d.company_name || '';
        document.getElementById('f-tagline').value = d.company_tagline || '';
        document.getElementById('f-logo-preview').src = d.logo_url || '';
        setColor('primary', d.brand_primary || '#0d9488');
        setColor('dark',    d.brand_primary_dark || '#0f766e');
        setColor('light',   d.brand_primary_light || '#ccfbf1');
        document.getElementById('c-primary-t').value = d.brand_primary || '#0d9488';
        renderBranches();
        preview();
      } catch(e){}
    }

    async function saveSettings(){
      var msg = document.getElementById('save-msg');
      var rec = {
        company_name: document.getElementById('f-name').value.trim() || 'المؤسسة',
        company_tagline: document.getElementById('f-tagline').value.trim(),
        brand_primary: norm(document.getElementById('c-primary-t').value),
        brand_primary_dark: norm(document.getElementById('c-dark-t').value),
        brand_primary_light: norm(document.getElementById('c-light-t').value),
        // الفروع مابقتش تتكتب هنا — مصدرها جدول branches (شاشة «الفروع»).
        updated_at: new Date().toISOString()
      };
      if (pendingLogoUrl) rec.logo_url = pendingLogoUrl;
      try {
        await fetch(REST+'org_settings?id=eq.1', { method:'PATCH', headers:{ ...HW, Prefer:'return=minimal' }, body: JSON.stringify(rec) });
        // حدّث الكاش + طبّق فورًا
        var cached = {}; try { cached = JSON.parse(localStorage.getItem('orgBrand')||'{}'); } catch(e){}
        Object.assign(cached, rec); try { localStorage.setItem('orgBrand', JSON.stringify(cached)); } catch(e){}
        msg.textContent = 'تم الحفظ ✓ — سيظهر في كل الشاشات بعد التحديث'; msg.style.color = '#16a34a';
      } catch(e){ msg.textContent = 'تعذّر الحفظ'; msg.style.color = 'var(--danger)'; }
    }

    load();
  </script>
</body>
</html>
