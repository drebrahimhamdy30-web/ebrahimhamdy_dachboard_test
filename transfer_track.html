<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تتبع التحويلات - Phalix</title>
  <link rel="stylesheet" href="tokens.css?v=20260906">
  <script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض. */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(345px, 1fr)); gap:14px; }

    .trf-card { border:1.5px solid var(--border); border-radius:var(--radius-md); padding:14px 16px;
                background:var(--surface-2); border-inline-start:5px solid var(--warning); }
    .trf-card.moving { border-inline-start-color:#2563eb; }
    .trf-card.done   { border-inline-start-color:var(--success); }
    .trf-card.wait   { border-inline-start-color:var(--danger); }
    .trf-card.dead   { border-inline-start-color:var(--text-muted); opacity:.85; }

    .trf-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
    .trf-route { font-size:1.05rem; font-weight:800; }
    .trf-route .arrow { color:var(--accent); margin:0 6px; font-size:1.2rem; }
    .trf-meta { font-size:0.72rem; color:var(--text-muted); margin-top:3px; }
    .guess { font-size:0.68rem; color:var(--warning); font-weight:700; }

    .state { display:inline-block; padding:3px 11px; border-radius:20px; font-size:0.73rem; font-weight:700; white-space:nowrap; }
    .s-road { background:#dbeafe; color:#1e40af; }
    .s-asg  { background:#fef3c7; color:#92400e; }
    .s-none { background:#fee2e2; color:#991b1b; }
    .s-done { background:#dcfce7; color:#15803d; }
    .s-dead { background:var(--surface-3); color:var(--text-muted); }

    .steps { margin-top:11px; border-top:1px dashed var(--border); padding-top:10px; }
    .stp { display:flex; gap:9px; align-items:flex-start; padding:4px 0; font-size:0.83rem; }
    .stp .ic { width:17px; text-align:center; margin-top:2px; }
    .stp.ok   .ic { color:var(--success); }
    .stp.no   .ic { color:var(--text-muted); }
    .stp.x    .ic { color:var(--danger); }
    .stp .ttl { font-weight:700; color:var(--text-primary); }
    .stp.no .ttl { color:var(--text-muted); font-weight:600; }
    .stp .tm  { color:var(--text-secondary); font-weight:700; font-size:0.77rem; margin-inline-start:6px; }
    .stp .sub { font-size:0.77rem; color:var(--text-secondary); margin-top:2px; }
    .stp .sub a { color:var(--accent); text-decoration:none; font-weight:700; }

    .cnt-box { margin-top:11px; border-top:1px dashed var(--border); padding-top:9px; }
    .cnt-line { display:flex; justify-content:space-between; align-items:center; gap:8px;
                font-size:0.79rem; color:var(--text-secondary); padding:3px 0; }
    .cnt-line b { color:var(--text-primary); }
    .cnt-num { background:var(--surface-3); border:1.5px solid var(--border); border-radius:20px;
               padding:1px 11px; font-weight:800; font-size:0.82rem; color:var(--text-primary); }
    .cnt-num.hot { background:#fee2e2; border-color:#fecaca; color:#991b1b; }

    .empty { text-align:center; padding:34px; color:var(--text-muted); font-size:0.9rem;
             border:1.5px dashed var(--border); border-radius:var(--radius-md); }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-truck-fast"></i> تتبع التحويلات</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span id="last-upd" style="font-size:0.76rem;color:var(--text-muted);"></span>
          <button class="btn btn-primary" onclick="loadAll()"><i class="fas fa-sync-alt"></i> تحديث</button>
        </div>
      </div>
      <div class="cards" id="cards"></div>
    </div>
  </div>

  <script src="config.js?v=20260904c"></script>
  <script src="session.js?v=20260926dl"></script>
  <script src="branches.js?v=20260904d"></script>
  <script src="pages.js?v=20260904d"></script>
  <script src="brand.js?v=20260904c"></script>
  <script src="api.js?v=20260926dl"></script>
  <script>
    // ═════════════════════════════════════════════════════════════
    //  تتبع التحويلات — كروت فقط للتحويلات **الجارية**، وكل الفروع
    //  بتشوف كل الكروت. التحويلة بتختفي أول ما توصل أو تتلغي.
    //  كل تحويلة في كارت بمراحلها: تم الإنشاء ← تم تعيين الطيار ←
    //  تم الاستلام ← وصلت، بالتاريخ والوقت. وتحت الكارت عدّادين
    //  للفرع المرسل: كام صنف طلبه ولم يُحوَّل، وكام صنف مطلوب منه.
    //  المصدر get_open_transfers() — دالة قراءة، والتحميل عند الفتح
    //  وبزر «تحديث» بس.
    // ═════════════════════════════════════════════════════════════
    let TODAY = '';

    checkAuth().then(function (user) {
      if (!user) return;
      loadAll();
    });

    async function loadAll() {
      const box = document.getElementById('cards');
      box.innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';
      try {
        const res = await fetch(SB_URL_API + '/rest/v1/rpc/get_open_transfers', {
          method: 'POST',
          headers: await sbH({ 'Content-Type': 'application/json' }),
          body: '{}'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        TODAY = (d && d.today) || '';
        // الوقت ده وقت آخر تحميل — الشاشة مابتجدّدش نفسها، فمهم يبان
        document.getElementById('last-upd').textContent = 'البيانات لحظة ' + ((d && d.now) || '');
        render((d && d.shipments) || [], (d && d.pending) || {});
      } catch (e) {
        console.error('get_open_transfers:', e);
        box.innerHTML = '<div class="empty" style="color:var(--danger);border-color:var(--danger);">' +
                        '❌ تعذّر تحميل البيانات — اضغط «تحديث» مرة أخرى</div>';
      }
    }

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    // «اليوم ١٧:٥٦» / «أمس ٢١:٠٣» / «٢٤/٩ — ١٣:٢١» — التواريخ بتوقيت القاهرة من السيرفر
    function when(dateStr, timeStr) {
      if (!timeStr) return '';
      if (!dateStr || dateStr === TODAY) return 'اليوم ' + timeStr;
      const y = new Date(TODAY + 'T12:00:00Z'); y.setUTCDate(y.getUTCDate() - 1);
      if (dateStr === y.toISOString().slice(0, 10)) return 'أمس ' + timeStr;
      const p = String(dateStr).split('-');
      return (+p[2]) + '/' + (+p[1]) + ' — ' + timeStr;
    }

    function step(kind, title, time, sub) {
      const ic = kind === 'ok' ? '<i class="fas fa-circle-check"></i>'
               : kind === 'x'  ? '<i class="fas fa-circle-xmark"></i>'
                               : '<i class="far fa-circle"></i>';
      return '<div class="stp ' + kind + '"><div class="ic">' + ic + '</div><div>' +
               '<span class="ttl">' + title + '</span>' +
               (time ? '<span class="tm">' + esc(time) + '</span>' : '') +
               (sub ? '<div class="sub">' + sub + '</div>' : '') +
             '</div></div>';
    }

    function render(rows, pending) {
      const box = document.getElementById('cards');
      if (!rows.length) {
        box.innerHTML = '<div class="empty">لا توجد تحويلات جارية حالياً ✌️</div>';
        return;
      }

      box.innerHTML = rows.map(function (s) {
        const dead      = (s.status === 'cancelled' || s.status === 'failed');
        const delivered = !!s.delivered;
        const picked    = !!s.picked;
        const hasDrv    = !!s.driver_name;

        const cls = dead ? 'dead' : (delivered ? 'done' : (picked ? 'moving' : (hasDrv ? '' : 'wait')));
        const state = dead      ? '<span class="state s-dead">✖ ' + (s.status === 'cancelled' ? 'ملغاة' : 'تعذّر التسليم') + '</span>'
                    : delivered ? '<span class="state s-done">✅ وصلت</span>'
                    : picked    ? '<span class="state s-road">🚚 مع الطيار في الطريق</span>'
                    : hasDrv    ? '<span class="state s-asg">📦 بانتظار استلام الطيار</span>'
                                : '<span class="state s-none">⚠️ بانتظار تعيين طيار</span>';

        // ① الإنشاء
        let steps = step('ok', 'تم إنشاء التحويلة', when(s.created_d, s.created),
                         'بواسطة: ' + esc(s.created_by || '—'));

        // ② تعيين الطيار
        steps += hasDrv
          ? step('ok', 'تم تعيين الطيار', when(s.assigned_d, s.assigned),
                 '<b>' + esc(s.driver_name) + '</b>' +
                 (s.driver_phone ? ' · <a href="tel:' + esc(s.driver_phone) + '">' +
                                   '<i class="fas fa-phone"></i> ' + esc(s.driver_phone) + '</a>' : ''))
          : step(dead ? 'x' : 'no', 'لم يتم تعيين طيار', '', '');

        // ③ الاستلام من الفرع
        steps += picked
          ? step('ok', 'تم استلامها من الفرع', when(s.picked_d, s.picked), '')
          : step(dead ? 'x' : 'no', 'لم يستلمها الطيار بعد', '', '');

        // ④ الوصول للفرع المستلم
        steps += delivered
          ? step('ok', 'وصلت إلى ' + esc(s.to_branch || 'الفرع المستلم'), when(s.delivered_d, s.delivered), '')
          : step(dead ? 'x' : 'no', 'لم تصل بعد', '', '');

        // عدّادات الفرع المُرسِل — أصناف معلّقة في شاشة التحويلات
        const p  = (pending && pending[s.from_branch]) || { requested: 0, required: 0 };
        const br = esc(s.from_branch || 'الفرع');
        const counts =
          '<div class="cnt-box">' +
            '<div class="cnt-line"><span>📥 أصناف طلبها فرع <b>' + br + '</b> ولم تُحوَّل له</span>' +
              '<span class="cnt-num' + (p.requested ? ' hot' : '') + '">' + p.requested + '</span></div>' +
            '<div class="cnt-line"><span>📤 أصناف مطلوبة من فرع <b>' + br + '</b> ولم يحوّلها</span>' +
              '<span class="cnt-num' + (p.required ? ' hot' : '') + '">' + p.required + '</span></div>' +
          '</div>';

        return '<div class="trf-card ' + cls + '">' +
            '<div class="trf-head">' +
              '<div><div class="trf-route">' + esc(s.from_branch || '؟') +
                  '<span class="arrow">←</span>' + esc(s.to_branch || '؟') + '</div>' +
                (s.to_exact ? '' : '<div class="guess" title="مستنتج من «' +
                    esc(s.to_hint || s.region || '') + '»">؟ الفرع المستلم مستنتج</div>') +
                '<div class="trf-meta">رقم التحويلة: ' + esc(s.bill_no || '—') + '</div>' +
              '</div>' +
              '<div>' + state + '</div>' +
            '</div>' +
            '<div class="steps">' + steps + '</div>' +
            counts +
          '</div>';
      }).join('');
    }
  </script>
</body>
</html>
