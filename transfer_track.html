<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تتبع التحويلات - Phalix</title>
  <link rel="stylesheet" href="tokens.css?v=20260906">
  <script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض. */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .sec-title { display:flex; align-items:center; gap:8px; font-size:0.95rem; font-weight:800;
                 color:var(--text-primary); margin:18px 0 10px; flex-wrap:wrap; }
    .sec-title .n { background:var(--surface-3); border:1.5px solid var(--border); border-radius:20px;
                    padding:1px 10px; font-size:0.78rem; color:var(--text-secondary); }

    .live-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; }
    .trf-card { border:1.5px solid var(--border); border-radius:var(--radius-md); padding:12px 14px;
                background:var(--surface-2); border-inline-start:5px solid var(--warning); }
    .trf-card.moving  { border-inline-start-color:#2563eb; }
    .trf-card.waiting { border-inline-start-color:var(--danger); }
    .trf-route { font-size:1rem; font-weight:800; }
    .trf-route .arrow { color:var(--accent); margin:0 5px; }
    .trf-line { font-size:0.8rem; color:var(--text-secondary); margin-top:5px; }
    .trf-line b { color:var(--text-primary); }
    .trf-line a { color:var(--accent); text-decoration:none; font-weight:700; }
    .guess { font-size:0.68rem; color:var(--warning); font-weight:700; }

    .step { display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.72rem; font-weight:700; }
    .st-wait { background:#fee2e2; color:#991b1b; }
    .st-road { background:#dbeafe; color:#1e40af; }
    .st-done { background:#dcfce7; color:#15803d; }

    .empty { text-align:center; padding:26px; color:var(--text-muted); font-size:0.86rem;
             border:1.5px dashed var(--border); border-radius:var(--radius-md); }
    .with-btn { background:none; border:1.5px solid var(--border); border-radius:14px; padding:2px 9px;
                cursor:pointer; font-family:var(--font); font-size:0.75rem; font-weight:700; color:var(--text-secondary); }
    .with-btn:hover { border-color:var(--accent); color:var(--accent); }
    .mini { display:inline-block; background:var(--surface-3); border:1px solid var(--border);
            border-radius:8px; padding:2px 7px; margin:2px; font-size:0.72rem; }

    .forgot { background:#fef2f2 !important; }
    .forgot td { color:#991b1b; }
    .pager { display:flex; gap:6px; align-items:center; justify-content:center; margin-top:12px; flex-wrap:wrap; }
    .pager button { min-width:32px; padding:4px 9px; border-radius:7px; border:1.5px solid var(--border);
                    background:var(--surface-2); color:var(--text-secondary); font-family:var(--font);
                    font-weight:700; font-size:0.8rem; cursor:pointer; }
    .pager button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
    .pager button:disabled { opacity:0.4; cursor:default; }
    .pager .info { font-size:0.78rem; color:var(--text-muted); margin-inline-start:8px; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-truck-fast"></i> تتبع التحويلات
          <span class="highlight" id="branch-tag"></span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span id="last-upd" style="font-size:0.76rem;color:var(--text-muted);"></span>
          <button class="btn btn-primary" onclick="loadAll()"><i class="fas fa-sync-alt"></i> تحديث</button>
        </div>
      </div>

      <div class="filter-bar">
        <div>
          <label class="filter-label" style="display:block;margin-bottom:4px;">الفرع</label>
          <select id="f-branch" class="form-select" style="width:auto;" onchange="render()">
            <option value="all">كل الفروع</option>
          </select>
        </div>
        <div>
          <label class="filter-label" style="display:block;margin-bottom:4px;">الاتجاه</label>
          <select id="f-dir" class="form-select" style="width:auto;" onchange="render()">
            <option value="all" selected>الكل</option>
            <option value="out">طالعة من الفرع 📤</option>
            <option value="in">جاية للفرع 📥</option>
          </select>
        </div>
        <div>
          <label class="filter-label" style="display:block;margin-bottom:4px;">بحث</label>
          <div style="position:relative;display:flex;align-items:center;">
            <i class="fas fa-search" style="position:absolute;right:9px;font-size:13px;color:var(--text-muted);pointer-events:none;"></i>
            <input type="text" id="f-q" placeholder="طيار، صنف، مين عملها…"
              oninput="searchTyped()"
              style="padding:6px 30px 6px 10px;width:210px;font-size:13px;border-radius:8px;
                     border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);">
          </div>
        </div>
      </div>

      <!-- (1) تحويلات لسه في الشارع -->
      <div class="sec-title">🚚 طالعة دلوقتي <span class="n" id="n-live">0</span></div>
      <div class="live-grid" id="live-grid"></div>

      <!-- (2) خلصت النهاردة -->
      <div class="sec-title">✅ وصلت النهاردة <span class="n" id="n-done">0</span></div>
      <div id="done-wrap"></div>

      <!-- (3) طلبات لسه معلّقة -->
      <div class="sec-title">⏳ طلبات لسه معلّقة <span class="n" id="n-req">0</span>
        <span style="font-size:0.74rem;font-weight:400;color:var(--text-muted);">
          (الفرع لسه ماردّش عليها — الأحمر يعني طلعت تحويلة بعد الطلب وهو لسه معلّق)
        </span>
      </div>
      <div id="req-wrap"></div>
      <div class="pager" id="req-pager"></div>
    </div>
  </div>

  <script src="config.js?v=20260904c"></script>
  <script src="session.js?v=20260905"></script>
  <script src="branches.js?v=20260904d"></script>
  <script src="pages.js?v=20260904d"></script>
  <script src="brand.js?v=20260904c"></script>
  <script src="api.js?v=20260904c"></script>
  <script>
    // ═════════════════════════════════════════════════════════════
    //  تتبع التحويلات — لقطة لحظية مش أرشيف:
    //   (1) التحويلات اللي لسه في الشارع: مين طالع بيها ووصلت ولا لأ
    //   (2) اللي وصلت النهاردة (تأكيد إنها تمت)
    //   (3) طلبات التحويل اللي لسه معلّقة عند الفرع
    //  كله من get_open_transfers() — دالة قراءة، مفيش أي تخزين.
    // ═════════════════════════════════════════════════════════════
    const PER_PAGE = 40;
    const AUTO_MS  = 60000;   // تحديث صامت كل دقيقة عشان الشاشة تفضل صح

    let userBranch = '';
    let DATA = { shipments: [], requests: [] };
    let pageReq = 1;
    let searchTimer = null;

    checkAuth().then(user => {
      if (!user) return;
      userBranch = (Session.branch() || '').trim();
      document.getElementById('branch-tag').textContent = userBranch || 'كل الفروع';
      Branches.ready().then(() => {
        const sel = document.getElementById('f-branch');
        Branches.names().forEach(n => {
          const o = document.createElement('option');
          o.value = n; o.textContent = n;
          sel.appendChild(o);
        });
        // كل فرع بيفتح على فرعه — ويقدر يشوف الباقي
        const mine = Branches.names().find(n => Branches.same(n, userBranch));
        if (mine) sel.value = mine;
        loadAll();
        setInterval(function () { loadAll(true); }, AUTO_MS);
      });
    });

    async function loadAll(silent) {
      if (!silent) {
        document.getElementById('live-grid').innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';
        document.getElementById('done-wrap').innerHTML = '';
        document.getElementById('req-wrap').innerHTML  = '';
      }
      try {
        const res = await fetch(SB_URL_API + '/rest/v1/rpc/get_open_transfers', {
          method: 'POST',
          headers: await sbH({ 'Content-Type': 'application/json' }),
          body: '{}'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        DATA = { shipments: d && d.shipments ? d.shipments : [],
                 requests:  d && d.requests  ? d.requests  : [] };
        markForgotten();
        document.getElementById('last-upd').textContent = 'آخر تحديث ' + ((d && d.now) || '');
        render();
      } catch (e) {
        console.error('get_open_transfers:', e);
        if (!silent) {
          document.getElementById('live-grid').innerHTML =
            '<div class="empty" style="color:var(--danger);border-color:var(--danger);">❌ فشل تحميل البيانات — جرّب تحديث الصفحة</div>';
        }
      }
    }

    // «اتنسى»: الطلب لسه معلّق رغم إن تحويلة طلعت من نفس الفرع للفرع الطالب بعد وقت الطلب
    function markForgotten() {
      DATA.requests.forEach(function (q) {
        q._forgot = DATA.shipments.some(function (s) {
          return Branches.same(s.from_branch || '', q.from_branch || '') &&
                 Branches.same(s.to_branch   || '', q.req_branch  || '') &&
                 ((s.created_d || '') + ' ' + (s.created || '')) >
                 ((q.created_d || '') + ' ' + (q.created || ''));
        });
      });
    }

    function searchTyped() {                 // debounce بسيط: مانرسمش على كل حرف
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { pageReq = 1; render(); }, 280);
    }

    // ─────────────── فلترة (على كل البيانات) ───────────────
    function dirOk(from, to) {
      const br  = document.getElementById('f-branch').value;
      const dir = document.getElementById('f-dir').value;
      if (br === 'all') return true;
      const isOut = Branches.same(from || '', br);
      const isIn  = Branches.same(to   || '', br);
      if (dir === 'out') return isOut;
      if (dir === 'in')  return isIn;
      return isOut || isIn;
    }
    function qOk(vals) {
      const q = document.getElementById('f-q').value.trim().toLowerCase();
      if (!q) return true;
      return vals.map(function (v) { return String(v == null ? '' : v).toLowerCase(); })
                 .join(' ').includes(q);
    }

    function filteredShipments() {
      return DATA.shipments.filter(function (s) {
        return dirOk(s.from_branch, s.to_branch) &&
               qOk([s.bill_no, s.from_branch, s.to_branch, s.to_hint, s.region,
                    s.created_by, s.driver_name, s.driver_phone, s.notes]);
      });
    }
    function filteredRequests() {
      return DATA.requests.filter(function (r) {
        return dirOk(r.from_branch, r.req_branch) &&
               qOk([r.item_code, r.item_name, r.from_branch, r.req_branch,
                    r.req_name, r.cust_name, r.note]);
      });
    }

    // ─────────────── أدوات عرض ───────────────
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function waited(min) {
      const n = parseInt(min, 10) || 0;
      if (n < 60) return n + ' د';
      if (n < 1440) return Math.floor(n / 60) + ' س و' + (n % 60) + ' د';
      return Math.floor(n / 1440) + ' يوم';
    }
    const ST_AR = { pending:'في الانتظار', assigned:'متعيّن لطيار', picked:'مع الطيار',
                    completed:'اتوصّل', delivered:'اتوصّل', cancelled:'ملغي',
                    failed:'فشل التسليم', postponed:'مؤجل', prep:'تحت التحضير' };
    function stAr(s) { return ST_AR[s] || s || ''; }

    function render() {
      const ships = filteredShipments();
      const live  = ships.filter(function (s) { return s.live; });
      const done  = ships.filter(function (s) { return !s.live && s.delivered; });
      const reqs  = filteredRequests();

      document.getElementById('n-live').textContent = live.length;
      document.getElementById('n-done').textContent = done.length;
      document.getElementById('n-req').textContent  = reqs.length;

      renderLive(live);
      renderDone(done);
      renderReqs(reqs);
    }

    // (1) كروت التحويلات اللي في الشارع
    function renderLive(rows) {
      const box = document.getElementById('live-grid');
      if (!rows.length) {
        box.innerHTML = '<div class="empty">مفيش تحويلة في الشارع دلوقتي ✌️</div>';
        return;
      }
      box.innerHTML = rows.map(function (s) {
        const moving = !!s.driver_name && (s.status === 'picked' || !!s.picked);
        const cls = moving ? 'moving' : (s.driver_name ? '' : 'waiting');
        const badge = moving
          ? '<span class="step st-road">🚚 مع الطيار من ' + esc(s.picked || s.created) + '</span>'
          : (s.driver_name
              ? '<span class="step st-wait">📦 متعيّنة ولسه ماطلعتش</span>'
              : '<span class="step st-wait">⚠️ لسه محدش خدها</span>');
        const others = (s.others || []).length;
        const withBox = others ? (
            '<div class="trf-line">' +
              '<button class="with-btn" onclick="toggleWith(\'' + esc(s.id) + '\')">' +
                (others === 1 ? 'معاه طلب تاني' : 'معاه ' + others + ' طلبات تانية') +
                ' <i class="fas fa-chevron-down"></i></button>' +
              '<div id="with-' + esc(s.id) + '" style="display:none;margin-top:6px;">' +
                (s.others || []).map(function (o) {
                  return '<span class="mini">' + esc(o.name || o.bill_no) +
                         ' <span style="color:var(--text-muted)">· ' + esc(o.region || '') +
                         ' · ' + esc(stAr(o.status)) + '</span></span>';
                }).join('') +
              '</div></div>') : '';

        return '<div class="trf-card ' + cls + '">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
              '<div class="trf-route">' + esc(s.from_branch || '؟') +
                '<span class="arrow">→</span>' + esc(s.to_branch || '؟') +
                (s.to_exact ? '' : '<div class="guess" title="مستنتج من «' +
                    esc(s.to_hint || s.region || '') + '»">؟ الوجهة مستنتجة</div>') +
              '</div><div>' + badge + '</div>' +
            '</div>' +
            '<div class="trf-line"><i class="fas fa-user-pen"></i> عملها <b>' +
              esc(s.created_by || '—') + '</b> الساعة ' + esc(s.created) +
              ' · بقالها ' + waited(s.age_min) + '</div>' +
            '<div class="trf-line"><i class="fas fa-motorcycle"></i> ' +
              (s.driver_name
                ? '<b>' + esc(s.driver_name) + '</b>' + (s.driver_phone
                    ? ' · <a href="tel:' + esc(s.driver_phone) + '"><i class="fas fa-phone"></i> ' +
                      esc(s.driver_phone) + '</a>' : '')
                : '<span style="color:var(--danger);font-weight:700;">لسه مامتعيّنش طيار</span>') +
            '</div>' + withBox +
            (s.notes ? '<div class="trf-line"><i class="fas fa-note-sticky"></i> ' + esc(s.notes) + '</div>' : '') +
          '</div>';
      }).join('');
    }

    function toggleWith(id) {
      const el = document.getElementById('with-' + id);
      if (el) el.style.display = (el.style.display === 'none') ? '' : 'none';
    }

    // (2) اللي وصلت النهاردة — سطر مختصر يأكّد إنها تمت
    function renderDone(rows) {
      const box = document.getElementById('done-wrap');
      if (!rows.length) { box.innerHTML = '<div class="empty">مفيش تحويلة وصلت النهاردة لحد دلوقتي</div>'; return; }
      box.innerHTML =
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>المسار</th><th>عملها</th><th>الطيار</th><th>اتسلّمت</th><th>وصلت</th></tr></thead><tbody>' +
          rows.map(function (s) {
            return '<tr>' +
              '<td><b>' + esc(s.from_branch || '؟') + '</b> <span style="color:var(--accent)">→</span> <b>' +
                esc(s.to_branch || '؟') + '</b></td>' +
              '<td style="font-size:.8rem;">' + esc(s.created_by || '—') + '</td>' +
              '<td style="font-size:.82rem;font-weight:700;">' + esc(s.driver_name || '—') +
                (s.driver_phone ? ' <a href="tel:' + esc(s.driver_phone) +
                   '" style="color:var(--accent);font-size:.75rem;text-decoration:none;">' +
                   esc(s.driver_phone) + '</a>' : '') + '</td>' +
              '<td style="font-size:.8rem;">' + esc(s.picked || '—') + '</td>' +
              '<td><span class="step st-done">✅ ' + esc(s.delivered) + '</span></td>' +
            '</tr>';
          }).join('') +
        '</tbody></table></div>';
    }

    // (3) الطلبات المعلّقة
    function renderReqs(rows) {
      const box = document.getElementById('req-wrap');
      const pg  = document.getElementById('req-pager');
      if (!rows.length) { box.innerHTML = '<div class="empty">مفيش طلبات معلّقة 👌</div>'; pg.innerHTML = ''; return; }

      const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
      if (pageReq > pages) pageReq = pages;
      const slice = rows.slice((pageReq - 1) * PER_PAGE, pageReq * PER_PAGE);

      box.innerHTML =
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>الوقت</th><th>المسار</th><th>الصنف</th><th>الكمية</th><th>العميل</th><th>مستنّي</th></tr></thead><tbody>' +
          slice.map(function (r) {
            return '<tr class="' + (r._forgot ? 'forgot' : '') + '">' +
              '<td style="font-size:.75rem;line-height:1.5;">' + esc(r.created) + '<br>' +
                '<span style="color:var(--text-muted);font-size:.7rem;">' +
                esc(String(r.created_d || '').slice(5).replace('-', '/')) + '</span></td>' +
              '<td><b>' + esc(r.from_branch || '؟') + '</b> <span style="color:var(--accent)">→</span> <b>' +
                esc(r.req_branch || '؟') + '</b>' +
                ((r.req_name && r.req_name !== r.req_branch)
                  ? '<div style="font-size:.7rem;color:var(--text-muted);">طلبها ' + esc(r.req_name) + '</div>' : '') +
                (r._forgot ? '<div style="font-size:.7rem;font-weight:800;color:var(--danger);">⚠️ طلعت تحويلة وهو لسه معلّق</div>' : '') +
              '</td>' +
              '<td style="font-weight:700;font-size:.83rem;">' + esc(r.item_name || '—') +
                '<div style="font-size:.72rem;color:var(--text-muted);">' + esc(r.item_code || '') + '</div>' +
                (r.note ? '<div style="font-size:.72rem;color:var(--danger);font-weight:700;">' +
                          '<i class="fas fa-triangle-exclamation"></i> ' + esc(r.note) + '</div>' : '') +
              '</td>' +
              '<td><b style="color:var(--warning);">' + esc(r.qty || '1') + '</b></td>' +
              '<td style="font-size:.78rem;">' + esc(r.cust_name || '—') + '</td>' +
              '<td style="font-size:.78rem;">' + waited(r.age_min) + '</td>' +
            '</tr>';
          }).join('') +
        '</tbody></table></div>';

      renderPager(pageReq, pages, rows.length, function (p) { pageReq = p; render(); });
    }

    // شريط الصفحات: « ‹ 1 2 … › »  + «صفحة X من Y»
    function renderPager(page, pages, total, go) {
      const el = document.getElementById('req-pager');
      if (pages <= 1) { el.innerHTML = '<span class="info">' + total + ' طلب</span>'; return; }
      const nums = [];
      const push = function (p) {
        nums.push('<button class="' + (p === page ? 'on' : '') + '" data-p="' + p + '">' + p + '</button>');
      };
      const win = 2;
      push(1);
      if (page - win > 2) nums.push('<span class="info">…</span>');
      for (let p = Math.max(2, page - win); p <= Math.min(pages - 1, page + win); p++) push(p);
      if (page + win < pages - 1) nums.push('<span class="info">…</span>');
      push(pages);

      el.innerHTML =
        '<button data-p="1" ' + (page === 1 ? 'disabled' : '') + '>«</button>' +
        '<button data-p="' + (page - 1) + '" ' + (page === 1 ? 'disabled' : '') + '>‹</button>' +
        nums.join('') +
        '<button data-p="' + (page + 1) + '" ' + (page === pages ? 'disabled' : '') + '>›</button>' +
        '<button data-p="' + pages + '" ' + (page === pages ? 'disabled' : '') + '>»</button>' +
        '<span class="info">صفحة ' + page + ' من ' + pages + ' · ' + total + ' طلب</span>';
      el.querySelectorAll('button[data-p]').forEach(function (b) {
        b.onclick = function () {
          const p = parseInt(b.dataset.p, 10);
          if (p >= 1 && p <= pages) go(p);
        };
      });
    }
  </script>
</body>
</html>
