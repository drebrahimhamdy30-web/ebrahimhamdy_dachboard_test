<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>معاملات المحافظ - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* توسيع الشاشة لصفحة المحافظ */
    .container { max-width:100% !important; }
    .table-wrap { overflow-x:auto; }

    .sms-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
    .sms-header-left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .sms-header-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    .search-wrap { position:relative; min-width:200px; flex:1; max-width:280px; }
    .search-wrap i { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem; pointer-events:none; }
    .search-wrap input { padding-right:34px; }

    /* تبويبات المحافظ — كل محفظة (رقم) لها لون */
    .tabs-bar { display:flex; gap:8px; flex-wrap:wrap; }
    .wtab { display:inline-flex; align-items:center; gap:6px; padding:7px 16px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-3); color:var(--text-secondary); font-size:0.82rem; cursor:pointer; transition:all 0.2s; font-family:var(--font); user-select:none; }
    .wtab:hover { border-color:var(--w-accent, var(--accent)); }
    .wtab.active { color:#fff; font-weight:700; border-color:var(--w-accent); background:var(--w-accent); }

    /* بطاقة رصيد كل محفظة */
    .wallet-summary { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .wallet-card { background:var(--surface); border:1.5px solid var(--border); border-top:3px solid var(--w-accent); border-radius:10px; padding:9px 14px; flex:1; min-width:150px; }
    .wallet-card .wc-name { display:flex; align-items:center; gap:6px; font-size:0.72rem; font-weight:800; color:var(--text-secondary); margin-bottom:5px; }
    .wallet-card .wc-dot  { width:8px; height:8px; border-radius:50%; background:var(--w-accent); flex-shrink:0; }
    .wallet-card .wc-bal  { font-size:1.05rem; font-weight:900; color:var(--w-accent); line-height:1.1; }
    .wallet-card .wc-meta { display:flex; justify-content:space-between; margin-top:4px; font-size:0.62rem; color:var(--text-muted); }

    .wallet-badge { display:inline-block; font-size:0.72rem; font-weight:700; border-radius:20px; padding:2px 10px; white-space:nowrap; }
    .type-in  { background:#dcfce7; color:#15803d; }
    .type-out { background:#fee2e2; color:#b91c1c; }
    .amount-in  { color:var(--text-primary); font-weight:900; white-space:nowrap; }
    .amount-out { color:#b91c1c; font-weight:900; white-space:nowrap; }

    .msg-cell { display:flex; align-items:center; gap:6px; max-width:260px; }
    .msg-preview { font-size:0.78rem; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .msg-open { background:var(--surface-3); border:1px solid var(--border); border-radius:6px; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; flex-shrink:0; transition:all 0.15s; }
    .msg-open:hover { border-color:var(--accent); color:var(--accent); }

    /* صف رصيده غير مظبوط */
    tr.bad-row > td { background:#fff5f5 !important; }
    tr.bad-row > td:first-child { box-shadow:inset 3px 0 0 #ef4444; }
    .bad-flag { display:inline-flex; align-items:center; gap:3px; font-size:0.66rem; font-weight:800; color:#b91c1c; background:#fee2e2; border-radius:20px; padding:1px 7px; margin-right:5px; }

    .warn-banner { display:none; align-items:center; gap:8px; background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; border-radius:10px; padding:9px 14px; font-size:0.82rem; font-weight:700; margin-bottom:12px; }
    .warn-banner.show { display:flex; }

    .total-bar { display:flex; gap:16px; flex-wrap:wrap; padding:10px 0; font-size:0.88rem; font-weight:700; }
    .wallet-pager { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center; margin:14px 0 4px; }
    .wpg-btn { min-width:34px; height:34px; padding:0 10px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface-3); color:var(--text-secondary); font-size:0.82rem; font-weight:700; cursor:pointer; font-family:var(--font); }
    .wpg-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .wpg-btn:not(:disabled):hover { border-color:var(--primary); }
    .wpg-btn:disabled { opacity:0.4; cursor:not-allowed; }
    .wpg-ellipsis { color:var(--text-muted); padding:0 2px; }
    .wpg-info { font-size:0.75rem; color:var(--text-muted); margin-right:8px; }

    /* شريط تجميع المعاملات المحددة */
    .selection-bar { display:none; align-items:center; gap:16px; flex-wrap:wrap; background:#eff6ff; border:1.5px solid #bfdbfe; border-radius:10px; padding:10px 16px; margin-bottom:12px; font-size:0.85rem; font-weight:700; color:#1e3a8a; }
    .selection-bar.show { display:flex; }
    .selection-bar .sb-clear { margin-right:auto; background:transparent; border:1px solid #bfdbfe; color:#1e3a8a; border-radius:8px; padding:4px 10px; font-size:0.76rem; cursor:pointer; font-family:var(--font); }

    /* Modal الرسالة الكاملة */
    .sms-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:99999; align-items:center; justify-content:center; }
    .sms-modal { background:#1e293b; border:2px solid #334155; border-radius:16px; padding:22px; width:92%; max-width:480px; direction:rtl; font-family:var(--font); box-shadow:0 20px 60px rgba(0,0,0,0.6); max-height:88vh; overflow-y:auto; }
    .sms-modal h3 { color:#f1f5f9; font-size:1rem; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
    .sms-modal .sm-body { color:#e2e8f0; font-size:0.92rem; line-height:1.9; background:#0f172a; border:1px solid #334155; border-radius:10px; padding:14px; white-space:pre-wrap; }
    .sms-modal .sm-meta { display:flex; gap:14px; flex-wrap:wrap; font-size:0.78rem; color:#94a3b8; margin-top:12px; }
    .sms-modal .sm-meta b { color:#cbd5e1; }
    .sm-close-btn { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:9px 22px; font-family:var(--font); font-weight:700; cursor:pointer; margin-top:14px; float:left; }

    /* Modal إضافة معاملة */
    .add-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:99999; align-items:center; justify-content:center; }
    .add-modal { background:#1e293b; border:2px solid #334155; border-radius:16px; padding:22px; width:92%; max-width:500px; direction:rtl; font-family:var(--font); box-shadow:0 20px 60px rgba(0,0,0,0.6); max-height:90vh; overflow-y:auto; }
    .add-modal h3 { color:#f1f5f9; font-size:1rem; margin:0 0 16px; display:flex; align-items:center; gap:8px; }
    .add-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .add-field { display:flex; flex-direction:column; gap:5px; }
    .add-field.full { grid-column:1 / -1; }
    .add-field label { font-size:0.76rem; font-weight:700; color:#cbd5e1; }
    .add-field input, .add-field select, .add-field textarea {
      background:#0f172a; border:1.5px solid #334155; border-radius:9px; color:#e2e8f0;
      font-family:var(--font); font-size:0.86rem; padding:9px 11px; outline:none; width:100%; box-sizing:border-box;
    }
    .add-field input:focus, .add-field select:focus, .add-field textarea:focus { border-color:var(--accent); }
    .add-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">

      <div class="sms-header">
        <div class="sms-header-left">
          <div class="page-title" style="margin:0;">
            <i class="fas fa-wallet"></i> معاملات المحافظ
            <span class="highlight" id="display-branch">...</span>
          </div>
        </div>
        <div class="sms-header-right">
          <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="form-input" placeholder="بحث برقم/اسم/رسالة..." oninput="applyFilter()">
          </div>
          <button class="btn btn-primary" onclick="openAdd()"><i class="fas fa-plus"></i> إضافة معاملة</button>
          <button class="btn" id="toggle-posted-btn" style="background:var(--surface-3);color:var(--text-secondary);border:1.5px solid var(--border);" onclick="togglePosted()"><i class="fas fa-eye"></i> إظهار المرحّل</button>
          <button class="btn btn-success" id="post-selected-btn" style="display:none;" onclick="postSelected()">
            <i class="fas fa-check-double" id="post-selected-icon"></i>
            <span id="post-selected-label">ترحيل المحدّد</span>
            <span id="sel-count" style="background:rgba(255,255,255,0.25);border-radius:20px;padding:1px 8px;margin-right:4px;">0</span>
          </button>
          <button class="btn btn-primary" onclick="loadAll()"><i class="fas fa-sync-alt"></i></button>
        </div>
      </div>

      <div class="tabs-bar" id="tabs-bar" style="margin-bottom:12px;">
        <label class="wtab active" data-wallet="__ALL__" style="--w-accent:#475569;" onclick="switchWallet('__ALL__', this)">📋 الكل</label>
      </div>

      <div class="wallet-summary" id="wallet-summary"></div>

      <div class="warn-banner" id="warn-banner">
        <i class="fas fa-triangle-exclamation"></i>
        <span>فيه معاملات رصيدها غير متطابق مع المتوقع — معلّمة بالأحمر بالأسفل.</span>
      </div>

      <div class="selection-bar" id="selection-bar"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:34px;text-align:center;"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)" title="تحديد الكل"></th>
              <th>التاريخ والوقت</th>
              <th>المحفظة</th>
              <th>النوع</th>
              <th>القيمة</th>
              <th>الرسوم</th>
              <th id="party-th">من / إلى</th>
              <th>الرصيد الحالي</th>
              <th>الحالة</th>
              <th>الرسالة</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="10">⏳ جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="total-bar" id="total-bar"></div>
      <div class="wallet-pager" id="wallet-pager"></div>
    </div>
  </div>

  <!-- Modal الرسالة الكاملة -->
  <div class="sms-modal-overlay" id="sms-modal-overlay" onclick="if(event.target===this)closeMsg()">
    <div class="sms-modal">
      <h3><i class="fas fa-comment-dots"></i> نص الرسالة كامل</h3>
      <div class="sm-body" id="sm-body"></div>
      <div class="sm-meta" id="sm-meta"></div>
      <button class="sm-close-btn" onclick="closeMsg()">إغلاق</button>
      <div style="clear:both;"></div>
    </div>
  </div>

  <!-- Modal إضافة معاملة -->
  <div class="add-modal-overlay" id="add-modal-overlay" onclick="if(event.target===this)closeAdd()">
    <div class="add-modal">
      <h3><i class="fas fa-plus"></i> إضافة معاملة جديدة</h3>
      <div class="add-grid">
        <div class="add-field">
          <label>المحفظة (رقم to_no)</label>
          <input type="text" id="add-to_no" placeholder="01205415869" inputmode="numeric">
        </div>
        <div class="add-field">
          <label>النوع</label>
          <select id="add-type-sel">
            <option value="استلام">استلام</option>
            <option value="إرسال">إرسال (تحويل)</option>
          </select>
        </div>
        <div class="add-field">
          <label>القيمة</label>
          <input type="number" id="add-ammount" step="0.01" placeholder="0.00">
        </div>
        <div class="add-field">
          <label>الرسوم (تُخصم دايماً من الرصيد)</label>
          <input type="number" id="add-fees" step="0.01" placeholder="0.00" value="0">
        </div>
        <div class="add-field">
          <label>الرصيد الحالي بعد المعاملة</label>
          <input type="number" id="add-balance" step="0.01" placeholder="0.00">
        </div>
        <div class="add-field">
          <label>من / إلى (اسم أو رقم)</label>
          <input type="text" id="add-from_no" placeholder="الاسم أو الرقم">
        </div>
        <div class="add-field">
          <label>الفرع</label>
          <input type="text" id="add-branch" placeholder="المعمورة">
        </div>
        <div class="add-field full">
          <label>نص الرسالة (اختياري)</label>
          <textarea id="add-message" rows="2" placeholder="نص الرسالة..."></textarea>
        </div>
      </div>
      <div class="add-actions">
        <button class="btn" style="background:#334155;color:#94a3b8;border:none;" onclick="closeAdd()">إلغاء</button>
        <button class="btn btn-primary" id="add-save-btn" onclick="saveAdd()"><i class="fas fa-save"></i> حفظ</button>
      </div>
    </div>
  </div>

  <script src="config.js?v=20260903"></script>
  <script src="session.js?v=20260903"></script>
  <script src="branches.js?v=20260904"></script>
  <script src="pages.js?v=20260905"></script>
  <script src="brand.js?v=20260904"></script>
  <script src="api.js?v=tt20260830"></script>
  <script>
    /* ============================================================
       معاملات المحافظ (SMS) — بتقرأ وتكتب من Supabase (جدول wallet_sms) مباشرة
       أعمدة الجدول: id, branch, ammount, from_no, to_no, balance,
                     message, type, fees, bill_no, done
       - المحفظة = رقم to_no (كل رقم محفظة، وياخد لون ثابت)
       - الفلترة بالفرع من عمود branch
       - النوع: استلام/إرسال من بداية نص عمود type
       - فحص الرصيد داخل كل محفظة على حدة بالترتيب
       ============================================================ */

    /* ===== Supabase (بدل الويب هوك) ===== */
    const _authJwt = localStorage.getItem('authJwt');
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false },
      global: { headers: _authJwt ? { Authorization: 'Bearer ' + _authJwt } : {} }
    });

    // ألوان ثابتة لكل رقم محفظة (عدّل/أضف أرقامك هنا)
    // غيّر اللون لو عايز رقم معيّن يبقى برتقالي (أورانج) أو أحمر (فودافون)
    const WALLET_COLORS = {
      '01205415869': '#FF6B00',  // برتقالي
      '01070400654': '#E60000',  // أحمر
    };
    const FALLBACK_COLORS = ['#6366f1','#0ea5e9','#10b981','#f59e0b','#ec4899','#8b5cf6'];
    const _cache = {};
    function walletColor(w) {
      if (WALLET_COLORS[w]) return WALLET_COLORS[w];
      if (_cache[w]) return _cache[w];
      const c = FALLBACK_COLORS[Object.keys(_cache).length % FALLBACK_COLORS.length];
      _cache[w] = c; return c;
    }

    // المحفظة = رقم to_no
    function walletOf(item){ return String(item.to_no || 'غير محدد').trim(); }

    // النوع: إرسال لو النص فيه إرسال/تحويل/صادر، غير كده استلام
    function isSend(item){ return /إرسال|ارسال|تحويل|صادر/i.test(String(item.type||'')); }

    let activeUser = null, userBranch = '';
    let allData = [], walletsList = [], activeWallet = '__ALL__';
    let badIds = new Set();
    let showPosted = false;          // الافتراضي: عرض غير المرحّل بس
    let selected = new Set();        // ids المعاملات المحددة للترحيل
    let walletPage = 1;              // الصفحة الحالية في العرض
    const WALLET_PAGE_SIZE = 50;     // عدد المعاملات في الصفحة الواحدة

    // هل المعاملة مرحّلة؟ done === true
    function isPosted(item){ return item.done === true || item.done === 'true'; }

    function num(v){ const x=parseFloat(v); return isNaN(x)?0:x; }
    function fmt(n){ return num(n).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    // قيمة زمنية للترتيب (من createdAt، fallback للـ id)
    function ts(item){
      const raw = item.createdAt || item.created_at;
      const d = raw ? new Date(raw) : null;
      if (d && !isNaN(d)) return d.getTime();
      const n = parseInt(item.id); return isNaN(n) ? 0 : n;
    }
    // ترتيب فحص الرصيد: نعتمد على id (ترتيب الإدخال الحقيقي في الجدول)
    // لأن أكتر من معاملة ممكن يكون عندها نفس createdAt بالضبط (نفس الثانية)،
    // فالاعتماد على الوقت بس يقلب الترتيب الحقيقي ويطلّع أحمر كاذب
    function sortKey(item){
      const n = parseInt(item.id);
      return isNaN(n) ? ts(item) : n;
    }
    // عرض التاريخ والوقت من createdAt
    function dateCell(item){
      const raw = item.createdAt || item.created_at;
      if (!raw) return '<span style="color:var(--text-muted);">---</span>';
      const d = new Date(raw);
      if (isNaN(d)) return '<span style="color:var(--text-muted);">---</span>';
      const day = d.toLocaleDateString('ar-EG');
      const time = d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',hour12:true});
      return `${day}<br><span style="font-size:0.7rem;color:var(--text-muted);">${time}</span>`;
    }

    // الحماية (نفس نمط باقي الصفحات)
    const BRANCHES_SMS = Branches.names();
    const USER_ROLE_SMS = (Session.role()||'').trim();
    const CAN_SWITCH_BRANCH = USER_ROLE_SMS==='accountant'||USER_ROLE_SMS==='admin'||USER_ROLE_SMS==='manager'||USER_ROLE_SMS==='reviewer';

    checkAuth().then(async user => {
      activeUser = user;
      if (user) {
        userBranch = (Session.branch()).trim();
        const dispEl = document.getElementById('display-branch');
        if(CAN_SWITCH_BRANCH && dispEl){
          // استبدل النص بـselector
          const sel = document.createElement('select');
          sel.style.cssText='font-family:Cairo,sans-serif;font-size:0.85rem;border:1px solid #cbd5e1;border-radius:8px;padding:3px 10px;background:#fff;color:#0f172a;cursor:pointer;';
          BRANCHES_SMS.forEach(b=>{
            const o=document.createElement('option');
            o.value=b; o.textContent=b;
            if(b===userBranch)o.selected=true;
            sel.appendChild(o);
          });
          if(!userBranch){ sel.value=BRANCHES_SMS[0]; userBranch=BRANCHES_SMS[0]; }
          sel.addEventListener('change',async e=>{
            userBranch=e.target.value;
            await loadAll();
          });
          dispEl.parentNode.replaceChild(sel,dispEl);
        }else{
          dispEl.textContent = userBranch || 'كل الفروع';
        }
        await loadAll();
      }
    });

    async function loadAll() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="10">⏳ جاري جلب البيانات...</td></tr>';
      try {
        // جلب من Supabase على دفعات (تخطّي حد الـ 1000)
        let all = [], from = 0; const page = 1000;
        while (true) {
          let q = db.from('wallet_sms').select('*').order('id', { ascending: true }).range(from, from + page - 1);
          if (userBranch) q = q.eq('branch', userBranch);
          const { data, error } = await q;
          if (error) throw error;
          all = all.concat(data);
          if (data.length < page) break;
          from += page;
        }
        allData = all;

        // ترتيب بالـ id (ترتيب الإدخال الحقيقي) — مهم عشان فحص الرصيد يطلع صح
        allData.sort((a,b) => sortKey(a) - sortKey(b));

        allData.forEach((r,i)=>{ if(r.id===undefined||r.id===null) r.id='_'+i; });

        computeBalanceFlags();
        applyFilter();
      } catch(e) {
        console.error(e);
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--danger);padding:30px;">❌ فشل تحميل البيانات<br><span style="font-size:0.72rem;color:var(--text-muted);">${e.message||e}</span></td></tr>`;
      }
    }

    // فحص الرصيد داخل كل محفظة على حدة بالترتيب
    function computeBalanceFlags() {
      badIds = new Set();
      walletsList = [...new Set(allData.map(walletOf))];
      walletsList.forEach(w => {
        const rows = allData.filter(r => walletOf(r) === w);
        for (let i=1; i<rows.length; i++) {
          const prev=rows[i-1], cur=rows[i];
          const sign = isSend(cur) ? -1 : 1;
          // الرسوم دايماً بتُخصم من الرصيد، سواء استلام أو إرسال
          const expected = num(prev.balance) + sign*num(cur.ammount) - num(cur.fees);
          if (Math.abs(expected - num(cur.balance)) > 0.01) {
            badIds.add(String(cur.id)); badIds.add(String(prev.id));
          }
        }
      });
    }

    function buildWalletTabs() {
      const bar = document.getElementById('tabs-bar');
      bar.innerHTML = `<label class="wtab ${activeWallet==='__ALL__'?'active':''}" data-wallet="__ALL__" style="--w-accent:#475569;" onclick="switchWallet('__ALL__', this)">📋 الكل</label>`;
      walletsList.forEach(w => {
        const c = walletColor(w);
        const lbl = document.createElement('label');
        lbl.className = 'wtab' + (activeWallet===w?' active':'');
        lbl.style.setProperty('--w-accent', c);
        lbl.textContent = w;
        lbl.onclick = function(){ switchWallet(w, this); };
        bar.appendChild(lbl);
      });
    }

    function switchWallet(w, el) {
      activeWallet = w;
      document.querySelectorAll('.wtab').forEach(b=>b.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('party-th').textContent = (w==='__ALL__') ? 'من / إلى' : 'الطرف';
      applyFilter();
    }

    function renderWalletSummary() {
      const wrap = document.getElementById('wallet-summary');
      const list = (activeWallet==='__ALL__') ? walletsList : [activeWallet];
      wrap.innerHTML = list.map(w => {
        const rows = allData.filter(r => walletOf(r)===w);
        if (!rows.length) return '';
        const last = rows[rows.length-1];
        const c = walletColor(w);
        return `<div class="wallet-card" style="--w-accent:${c};">
          <div class="wc-name"><span class="wc-dot"></span>${w}</div>
          <div class="wc-bal">${fmt(last.balance)} <span style="font-size:0.55rem;font-weight:600;color:var(--text-muted);">ج</span></div>
          <div class="wc-meta"><span>${rows.length} معاملة</span><span>الرصيد الحالي</span></div>
        </div>`;
      }).join('');
    }

    function matchSearch(item, q) {
      return [item.from_no,item.to_no,item.message,String(item.ammount),item.bill_no,item.branch]
        .some(v => String(v||'').toLowerCase().includes(q));
    }

    function getFiltered() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      return allData.filter(item => {
        if (!showPosted && isPosted(item)) return false;     // إخفاء المرحّل افتراضياً
        if (activeWallet!=='__ALL__' && walletOf(item)!==activeWallet) return false;
        return !q || matchSearch(item, q);
      });
    }

    function applyFilter() {
      walletPage = 1;              // أي تغيير في الفلتر/البحث/التبويب يرجّع لأول صفحة
      buildWalletTabs();
      renderWalletSummary();
      const items = getFiltered();
      renderTable(items);
      document.getElementById('warn-banner').classList.toggle('show', items.some(i=>badIds.has(String(i.id))));
    }

    function renderTable(items) {
      const tbody = document.getElementById('table-body');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج</td></tr>';
        document.getElementById('total-bar').innerHTML=''; 
        syncSelectionUI();
        return;
      }
      // عرض الأحدث أولاً (نسخة معكوسة — لا نغيّر ترتيب allData المستخدم في فحص الرصيد)
      const view = items.slice().sort((a,b) => (ts(b) - ts(a)) || (sortKey(b) - sortKey(a)));

      // الإجماليات على كل المعاملات المفلترة (مش الصفحة المعروضة بس)
      let totalIn=0, totalOut=0, totalFees=0;
      view.forEach(item => { const a=num(item.ammount); if (isSend(item)) totalOut+=a; else totalIn+=a; totalFees+=num(item.fees); });

      // تقسيم الصفحات — نعرض شريحة واحدة بس عشان التحميل يبقى أسرع
      const pageCount = Math.max(1, Math.ceil(view.length / WALLET_PAGE_SIZE));
      if (walletPage > pageCount) walletPage = pageCount;
      if (walletPage < 1) walletPage = 1;
      const start = (walletPage-1) * WALLET_PAGE_SIZE;
      const pageRows = view.slice(start, start + WALLET_PAGE_SIZE);

      tbody.innerHTML = pageRows.map(item => {
        const w = walletOf(item), c = walletColor(w);
        const send = isSend(item), bad = badIds.has(String(item.id));
        const posted = isPosted(item);
        const amt = num(item.ammount);
        const fee = num(item.fees);
        const party = item.from_no || item.to_no || '---';
        const checked = selected.has(String(item.id)) ? 'checked' : '';
        // المرحّل مايتحددش (اتراجع خلاص)
        const cbCell = posted
          ? '<i class="fas fa-lock" style="color:var(--text-muted);font-size:0.7rem;" title="مرحّل"></i>'
          : `<input type="checkbox" class="row-cb" data-id="${item.id}" ${checked} onclick="toggleRow('${item.id}', this)">`;
        const statusCell = posted
          ? '<span class="wallet-badge" style="background:#dcfce7;color:#15803d;">✅ مرحّل</span>'
          : '<span class="wallet-badge" style="background:#fef9c3;color:#a16207;">⏳ غير مرحّل</span>';
        return `<tr class="${bad?'bad-row':''}" ${posted?'style="opacity:0.72;"':''}>
          <td style="text-align:center;">${cbCell}</td>
          <td style="font-size:0.78rem;white-space:nowrap;">${dateCell(item)}</td>
          <td><span class="wallet-badge" style="background:color-mix(in srgb, ${c} 14%, transparent);color:${c};border:1px solid color-mix(in srgb, ${c} 35%, transparent);">${w}</span></td>
          <td>${send?'<span class="wallet-badge type-out">إرسال ↑</span>':'<span class="wallet-badge type-in">استلام ↓</span>'}</td>
          <td class="${send?'amount-out':'amount-in'}">${send?'−':'+'}${fmt(amt)} ج</td>
          <td style="white-space:nowrap;color:${fee>0?'#b91c1c':'var(--text-muted)'};font-weight:${fee>0?'700':'400'};">${fee>0?'−'+fmt(fee):'—'} ${fee>0?'ج':''}</td>
          <td style="font-weight:600;font-size:0.85rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(party)}">${escapeHtml(party)}</td>
          <td style="white-space:nowrap;"><b style="color:${bad?'#b91c1c':c};">${fmt(item.balance)} ج</b>${bad?'<span class="bad-flag"><i class="fas fa-triangle-exclamation"></i> غير مظبوط</span>':''}</td>
          <td>${statusCell}</td>
          <td><div class="msg-cell"><span class="msg-preview">${escapeHtml(item.message||'—')}</span><button class="msg-open" title="فتح كامل" onclick="openMsg('${item.id}')"><i class="fas fa-up-right-and-down-left-from-center" style="font-size:0.62rem;"></i></button></div></td>
        </tr>`;
      }).join('');
      document.getElementById('total-bar').innerHTML =
        `<span>إجمالي الوارد: <b style="color:#15803d;">${fmt(totalIn)}</b> ج</span>`+
        `<span>إجمالي الصادر: <b style="color:#b91c1c;">${fmt(totalOut)}</b> ج</span>`+
        `<span>إجمالي الرسوم: <b style="color:#b91c1c;">${fmt(totalFees)}</b> ج</span>`+
        `<span style="color:var(--text-muted);">عدد المعاملات: <b>${view.length}</b></span>`+
        `<span style="color:var(--text-muted);">المعروض: <b>${start+1}–${start+pageRows.length}</b></span>`;
      renderWalletPager(pageCount);
      syncSelectionUI();
    }

    // شريط تنقّل الصفحات (الأحدث في الصفحة 1)
    function renderWalletPager(pageCount) {
      const pager = document.getElementById('wallet-pager');
      if (!pager) return;
      if (pageCount <= 1) { pager.innerHTML = ''; return; }
      const mk = (label, page, o) => o&&o.disabled
        ? `<button class="wpg-btn" disabled>${label}</button>`
        : `<button class="wpg-btn ${o&&o.active?'active':''}" onclick="gotoWalletPage(${page})">${label}</button>`;
      const nums = []; const win = 2;
      for (let p=1; p<=pageCount; p++) {
        if (p===1 || p===pageCount || (p>=walletPage-win && p<=walletPage+win)) nums.push(p);
        else if (nums[nums.length-1] !== '…') nums.push('…');
      }
      pager.innerHTML =
        mk('«', 1, {disabled: walletPage===1}) +
        mk('‹', walletPage-1, {disabled: walletPage===1}) +
        nums.map(p => p==='…' ? '<span class="wpg-ellipsis">…</span>' : mk(p, p, {active: p===walletPage})).join('') +
        mk('›', walletPage+1, {disabled: walletPage===pageCount}) +
        mk('»', pageCount, {disabled: walletPage===pageCount}) +
        `<span class="wpg-info">صفحة ${walletPage} من ${pageCount}</span>`;
    }

    function gotoWalletPage(p) {
      walletPage = p;
      renderTable(getFiltered());
      try { document.getElementById('table-body').scrollIntoView({ block:'start', behavior:'smooth' }); } catch(e){}
    }

    // ===== التحديد والترحيل =====
    function toggleRow(id, cb) {
      if (cb.checked) selected.add(String(id)); else selected.delete(String(id));
      syncSelectionUI();
    }

    function toggleSelectAll(master) {
      // يحدد كل الصفوف غير المرحّلة المعروضة حالياً
      document.querySelectorAll('.row-cb').forEach(cb => {
        cb.checked = master.checked;
        const id = String(cb.dataset.id);
        if (master.checked) selected.add(id); else selected.delete(id);
      });
      syncSelectionUI();
    }

    // يحدّث عدّاد المحدد، زر الترحيل، وحالة checkbox تحديد الكل
    function syncSelectionUI() {
      const rowCbs = Array.from(document.querySelectorAll('.row-cb'));
      const count = selected.size;
      const selCountEl = document.getElementById('sel-count');
      const postBtnEl  = document.getElementById('post-selected-btn');
      if (selCountEl) selCountEl.textContent = count;
      if (postBtnEl)  postBtnEl.style.display = count>0 ? 'inline-flex' : 'none';
      const master = document.getElementById('select-all');
      if (master) {
        const allChecked = rowCbs.length>0 && rowCbs.every(cb=>cb.checked);
        master.checked = allChecked;
        master.indeterminate = !allChecked && rowCbs.some(cb=>cb.checked);
      }
      renderSelectionSummary();
    }

    // تجميع المعاملات المحددة بالـ checkbox: القيمة (وارد/صادر) + الرسوم + العدد
    function renderSelectionSummary() {
      const bar = document.getElementById('selection-bar');
      if (!bar) return;
      if (!selected.size) { bar.classList.remove('show'); bar.innerHTML=''; return; }

      const items = allData.filter(it => selected.has(String(it.id)));
      let inSum=0, outSum=0, feeSum=0;
      items.forEach(it => {
        const amt = num(it.ammount), fee = num(it.fees);
        if (isSend(it)) outSum += amt; else inSum += amt;
        feeSum += fee;
      });
      const net = inSum - outSum - feeSum; // الأثر الصافي على الرصيد

      bar.classList.add('show');
      bar.innerHTML =
        `<span><i class="fas fa-layer-group"></i> محدّد: <b>${items.length}</b></span>`+
        `<span>وارد: <b style="color:#15803d;">${fmt(inSum)}</b> ج</span>`+
        `<span>صادر: <b style="color:#b91c1c;">${fmt(outSum)}</b> ج</span>`+
        `<span>رسوم: <b style="color:#b91c1c;">${fmt(feeSum)}</b> ج</span>`+
        `<span>الصافي: <b style="color:${net>=0?'#15803d':'#b91c1c'};">${fmt(net)}</b> ج</span>`+
        `<button class="sb-clear" onclick="clearSelection()"><i class="fas fa-times"></i> إلغاء التحديد</button>`;
    }

    function clearSelection() {
      selected.clear();
      document.querySelectorAll('.row-cb').forEach(cb => cb.checked = false);
      syncSelectionUI();
    }

    async function postSelected() {
      const ids = Array.from(selected);
      if (!ids.length) return;
      if (!confirm(`ترحيل ${ids.length} معاملة؟ هتتعلّم كـ "تمت المراجعة" ومش هتظهر في الافتراضي.`)) return;
      const btn   = document.getElementById('post-selected-btn');
      const icon  = document.getElementById('post-selected-icon');
      const label = document.getElementById('post-selected-label');
      btn.disabled = true;
      icon.className = 'fas fa-spinner fa-spin';
      label.textContent = 'جاري الترحيل...';
      try {
        const numIds = ids.map(x => isNaN(Number(x)) ? x : Number(x));
        const chunk = 200;
        for (let i = 0; i < numIds.length; i += chunk) {
          const slice = numIds.slice(i, i + chunk);
          const { error } = await db.from('wallet_sms').update({ done: true }).in('id', slice);
          if (error) throw error;
        }
        allData.forEach(it => { if (selected.has(String(it.id))) it.done = true; });
        selected.clear();
        applyFilter();
      } catch(e) {
        console.error('postSelected error:', e);
        alert('❌ فشل الترحيل: ' + (e.message || e));
      }
      btn.disabled = false;
      icon.className = 'fas fa-check-double';
      label.textContent = 'ترحيل المحدّد';
      syncSelectionUI();
    }

    function togglePosted() {
      showPosted = !showPosted;
      const btn = document.getElementById('toggle-posted-btn');
      if (showPosted) {
        btn.innerHTML = '<i class="fas fa-eye-slash"></i> إخفاء المرحّل';
        btn.style.background = 'var(--accent)'; btn.style.color = 'var(--primary)';
      } else {
        btn.innerHTML = '<i class="fas fa-eye"></i> إظهار المرحّل';
        btn.style.background = 'var(--surface-3)'; btn.style.color = 'var(--text-secondary)';
      }
      applyFilter();
    }

    // ===== Modal الرسالة =====
    function openMsg(id) {
      const item = allData.find(x=>String(x.id)===String(id)); if(!item) return;
      document.getElementById('sm-body').textContent = item.message || '—';
      document.getElementById('sm-meta').innerHTML =
        `<span>المحفظة: <b>${walletOf(item)}</b></span>`+
        `<span>القيمة: <b>${fmt(item.ammount)} ج</b></span>`+
        `<span>الرصيد: <b>${fmt(item.balance)} ج</b></span>`+
        (item.from_no?`<span>الطرف: <b>${escapeHtml(item.from_no)}</b></span>`:'');
      document.getElementById('sms-modal-overlay').style.display='flex';
    }
    function closeMsg(){ document.getElementById('sms-modal-overlay').style.display='none'; }

    // ===== Modal الإضافة =====
    function openAdd() {
      if (activeWallet!=='__ALL__') document.getElementById('add-to_no').value = activeWallet;
      document.getElementById('add-branch').value = userBranch || '';
      document.getElementById('add-modal-overlay').style.display='flex';
    }
    function closeAdd(){ document.getElementById('add-modal-overlay').style.display='none'; }

    async function saveAdd() {
      const to_no   = document.getElementById('add-to_no').value.trim();
      const typeSel = document.getElementById('add-type-sel').value;
      const ammount = document.getElementById('add-ammount').value;
      const fees    = document.getElementById('add-fees').value;
      const balance = document.getElementById('add-balance').value;
      const from_no = document.getElementById('add-from_no').value.trim();
      const branch  = document.getElementById('add-branch').value.trim();
      const message = document.getElementById('add-message').value.trim();

      if (!to_no || !ammount || !balance) { alert('املأ المحفظة والقيمة والرصيد على الأقل'); return; }

      const btn = document.getElementById('add-save-btn');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      try {
        // op_ref فريد للإضافة اليدوية عشان ما يتعارضش مع قيد التفرّد
        const manualRef = 'MANUAL-' + Date.now();
        const { error } = await db.from('wallet_sms').insert({
          branch:  branch || null,
          ammount: num(ammount),
          from_no: from_no || null,
          to_no:   to_no,
          balance: num(balance),
          message: message || null,
          type:    typeSel,
          fees:    num(fees),
          op_ref:  manualRef
        });
        if (error) throw error;
        closeAdd(); clearAdd(); await loadAll();
      } catch(e) {
        console.error('saveAdd error:', e);
        alert('❌ فشل الحفظ: ' + (e.message || e));
      }
      btn.disabled=false; btn.innerHTML='<i class="fas fa-save"></i> حفظ';
    }
    function clearAdd(){
      ['add-to_no','add-ammount','add-balance','add-from_no','add-message'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('add-fees').value = '0';
    }
  </script>
</body>
</html>
