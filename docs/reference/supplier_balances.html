<div id="root" dir="rtl">
  <header class="topbar">
    <div class="brand">
      <span class="mark">₪</span>
      <div>
        <h1>متابعة أرصدة الموردين</h1>
        <p class="sub">الصق كشف الفرع كل يوم، وتظهر لك الموردين اللي رصيدهم اتغيّر عن آخر لصق</p>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main id="view"></main>

  <div id="toast" class="toast"></div>
</div>

<style>
  #root {
    --ink: #12232e;
    --ink-soft: #46606f;
    --paper: #f6f4ef;
    --card: #ffffff;
    --line: #dcd6c9;
    --brass: #a9762b;
    --brass-soft: #f0e3cc;
    --up: #0f7a52;
    --up-bg: #e3f3ec;
    --down: #b0322b;
    --down-bg: #fbe8e6;
    --new: #2f4f9e;
    --new-bg: #e7ecfa;

    font-family: "Segoe UI", "Tahoma", "Noto Naskh Arabic", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100%;
    padding: 0 0 48px;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  #root *, #root *::before, #root *::after { box-sizing: border-box; }
  #root h1, #root h2, #root h3, #root p { margin: 0; }
  #root button { font-family: inherit; }

  .topbar {
    background: var(--ink);
    color: #f6f4ef;
    padding: 18px 20px 0;
    border-bottom: 3px solid var(--brass);
  }
  .brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .mark {
    width: 42px; height: 42px; flex: 0 0 42px;
    display: grid; place-items: center;
    background: var(--brass); color: #12232e;
    font-size: 22px; font-weight: 700;
    border-radius: 4px;
  }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .sub { font-size: 13px; color: #a8bcc7; }

  .tabs { display: flex; gap: 4px; margin-top: 16px; flex-wrap: wrap; }
  .tab {
    background: transparent; border: 0; color: #a8bcc7;
    padding: 10px 16px; font-size: 14px; cursor: pointer;
    border-radius: 6px 6px 0 0; position: relative;
  }
  .tab:hover { color: #fff; background: rgba(255,255,255,.06); }
  .tab.active { background: var(--paper); color: var(--ink); font-weight: 700; }
  .tab .dot {
    display: inline-block; min-width: 20px; padding: 0 5px; margin-inline-start: 6px;
    background: var(--brass); color: #12232e; border-radius: 10px;
    font-size: 11px; font-weight: 700; line-height: 18px;
  }
  .tab.active .dot { background: var(--ink); color: #fff; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 0; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 18px;
  }
  .card > h2 {
    font-size: 15px; font-weight: 700; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .card .hint { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px; }

  .meta {
    display: flex; gap: 22px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--brass-soft);
    border: 1px solid #e3d2b3; border-radius: 8px; margin-bottom: 16px;
  }
  .meta div { font-size: 13px; }
  .meta b { display: block; font-size: 11px; color: #7d5a1e; font-weight: 700; letter-spacing: .3px; }

  textarea {
    width: 100%; min-height: 140px; resize: vertical;
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font-family: "Consolas", "Courier New", monospace; font-size: 12.5px;
    background: #fdfcfa; color: var(--ink); direction: ltr; text-align: left;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--brass); outline-offset: 1px; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .grow { flex: 1 1 200px; }

  button.btn {
    border: 1px solid var(--ink); background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 7px; font-size: 14px; cursor: pointer;
    font-weight: 600;
  }
  button.btn:hover { background: #1c3546; }
  button.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
  button.btn.ghost:hover { background: #f0ece2; }
  button.btn.brass { background: var(--brass); border-color: var(--brass); color: #1b1408; }
  button.btn.brass:hover { background: #925f1c; color: #fff; }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }

  input[type=text], input[type=number], select {
    border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px;
    font-size: 14px; background: #fff; color: var(--ink); font-family: inherit;
  }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-soft); }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 4px; }
  .chip {
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
    background: #fff; min-width: 108px;
  }
  .chip b { display: block; font-size: 22px; font-weight: 700; line-height: 1.2; }
  .chip span { font-size: 12px; color: var(--ink-soft); }
  .chip.c-up b { color: var(--up); }
  .chip.c-down b { color: var(--down); }
  .chip.c-new b { color: var(--new); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    background: #eee9dd; text-align: right; padding: 9px 10px;
    font-size: 12px; font-weight: 700; color: #5c4a2a;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  tbody td { padding: 9px 10px; border-bottom: 1px solid #eee9df; vertical-align: middle; }
  tbody tr:hover { background: #faf8f3; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: left; direction: ltr; }
  td.code { font-weight: 700; color: var(--brass); white-space: nowrap; }
  .delta { font-weight: 700; padding: 2px 8px; border-radius: 20px; display: inline-block; direction: ltr; }
  .delta.up { color: var(--up); background: var(--up-bg); }
  .delta.down { color: var(--down); background: var(--down-bg); }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--new-bg); color: var(--new); font-weight: 700; }
  .tag.gone { background: #efeae0; color: #6b6152; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
  .sec-title {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 22px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); flex-wrap: wrap;
  }
  .sec-title h3 { font-size: 14.5px; font-weight: 700; }

  .mini { background: none; border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; font-size: 11.5px; cursor: pointer; color: var(--ink-soft); }
  .mini:hover { border-color: var(--down); color: var(--down); }

  .empty { padding: 26px; text-align: center; color: var(--ink-soft); font-size: 13.5px; background: #faf8f3; border-radius: 8px; border: 1px dashed var(--line); }

  .toast {
    position: fixed; inset-block-end: 22px; inset-inline-start: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 8px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--down); }

  .warn { background: #fdf5e6; border: 1px solid #e8d3a8; color: #7a5a12; padding: 10px 14px; border-radius: 7px; font-size: 13px; margin-top: 12px; }

  @media (max-width: 640px) {
    .topbar h1 { font-size: 17px; }
    main { padding: 16px 12px 0; }
    .card { padding: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  const BR = [
    { id: 'b1', def: 'فرع 1' },
    { id: 'b2', def: 'فرع 2' },
    { id: 'b3', def: 'فرع 3' }
  ];
  const K_STATE = 'supbal:state:v1';

  let state = {
    config: { threshold: 0.01, autoSave: true, exclusions: [], names: {} },
    branches: {}
  };
  BR.forEach(b => state.branches[b.id] = blankBranch());
  function blankBranch() {
    return { snapshot: null, pastedAt: null, prevSnapshot: null, prevPastedAt: null, result: null, runAt: null };
  }

  let active = 'b1';
  let draft = {};   // نص اللصق قبل التحليل
  let filter = {};  // بحث داخل النتائج

  /* ---------- تخزين ---------- */
  async function load() {
    try {
      const r = await window.storage.get(K_STATE);
      if (r && r.value) {
        const s = JSON.parse(r.value);
        state.config = Object.assign(state.config, s.config || {});
        BR.forEach(b => { if (s.branches && s.branches[b.id]) state.branches[b.id] = Object.assign(blankBranch(), s.branches[b.id]); });
      }
    } catch (e) { /* أول تشغيل: لا توجد بيانات محفوظة */ }
  }
  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await window.storage.set(K_STATE, JSON.stringify(state)); }
      catch (e) { toast('تعذّر الحفظ. جرّب مرة أخرى.', true); }
    }, 120);
  }

  /* ---------- أدوات ---------- */
  const norm = s => (s || '')
    .replace(/[\u0640\u064B-\u0652]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ').trim().toLowerCase();

  function toNum(v) {
    if (v == null) return NaN;
    let s = String(v).replace(/[\u066B]/g, '.').replace(/[,\u066C\s\u200f\u200e]/g, '').trim();
    s = s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }   // شكل 1.000-
    if (s.startsWith('-')) { neg = true; s = s.slice(1); }
    if (s === '' || isNaN(Number(s))) return NaN;
    return (neg ? -1 : 1) * Number(s);
  }

  const fmt = n => (n === null || n === undefined || isNaN(n)) ? '—'
    : Number(n).toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  const fmtSigned = n => (n > 0 ? '+' : '') + fmt(n);
  const when = t => t ? new Date(t).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function toast(msg, bad) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
    setTimeout(() => t.className = 'toast', 2600);
  }

  /* ---------- قراءة الجدول الملصوق ---------- */
  function parse(text) {
    const lines = String(text || '').split(/\r?\n/).filter(l => l.trim() !== '');
    if (!lines.length) return { rows: [], skipped: 0, error: 'ما فيش بيانات في الصندوق.' };

    const cut = l => l.includes('\t') ? l.split('\t') : l.split(/ {2,}|\u00a0{2,}/);
    let idx = { bal: 0, limit: 1, mgr: 2, phone: 3, en: 4, ar: 5, code: 6 };
    let start = 0, foundHeader = false;

    for (let i = 0; i < Math.min(lines.length, 5); i++) {
      const cells = cut(lines[i]).map(norm);
      if (!cells.some(c => c.includes('كود'))) continue;
      const m = {};
      cells.forEach((c, j) => {
        if (c.includes('كود')) m.code = j;
        else if (c.includes('حد') && c.includes('مسحوبات')) m.limit = j;
        else if (c.includes('مسحوبات') || c.includes('رصيد')) m.bal = j;
        else if (c.includes('(ع') || c.includes('عربي')) m.ar = j;
        else if (c.includes('(en') || c.includes('انجل')) m.en = j;
        else if (c.includes('تليفون') || c.includes('هاتف') || c.includes('موبايل')) m.phone = j;
        else if (c.includes('مدير')) m.mgr = j;
      });
      if (m.code !== undefined && m.bal !== undefined) { idx = Object.assign(idx, m); start = i + 1; foundHeader = true; break; }
    }

    const rows = {}; let skipped = 0;
    for (let i = start; i < lines.length; i++) {
      const c = cut(lines[i]).map(x => String(x).replace(/\u200f|\u200e/g, '').trim());
      const code = c[idx.code];
      const bal = toNum(c[idx.bal]);
      if (!code || !/^[0-9A-Za-z\-]+$/.test(code) || isNaN(bal)) { skipped++; continue; }
      rows[code] = {
        b: bal,
        a: c[idx.ar] || '',
        e: c[idx.en] || '',
        l: toNum(c[idx.limit]),
        p: c[idx.phone] || ''
      };
    }
    const n = Object.keys(rows).length;
    if (!n) return { rows: {}, skipped, error: 'مفيش صف واحد اتقرأ. اتأكد إنك ناسخ الجدول بالأعمدة زي ما هو من الشاشة.' };
    return { rows, skipped, foundHeader, count: n };
  }

  /* ---------- المقارنة ---------- */
  function compare(oldSnap, newSnap) {
    const ex = new Set(state.config.exclusions.map(x => String(x.code)));
    const th = Number(state.config.threshold) || 0;
    const changed = [], added = [], removed = [];

    Object.keys(newSnap).forEach(code => {
      if (ex.has(code)) return;
      const cur = newSnap[code];
      const prev = oldSnap ? oldSnap[code] : undefined;
      if (!prev) { added.push({ code, name: cur.a || cur.e, en: cur.e, phone: cur.p, now: cur.b }); return; }
      const d = cur.b - prev.b;
      if (Math.abs(d) > th) changed.push({ code, name: cur.a || cur.e, en: cur.e, phone: cur.p, before: prev.b, now: cur.b, diff: d });
    });
    if (oldSnap) Object.keys(oldSnap).forEach(code => {
      if (ex.has(code) || newSnap[code]) return;
      removed.push({ code, name: oldSnap[code].a || oldSnap[code].e, en: oldSnap[code].e, before: oldSnap[code].b });
    });

    changed.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
    added.sort((a, b) => String(a.code).localeCompare(String(b.code), 'en', { numeric: true }));
    removed.sort((a, b) => String(a.code).localeCompare(String(b.code), 'en', { numeric: true }));
    return { changed, added, removed, total: Object.keys(newSnap).length, baseline: !!oldSnap };
  }

  /* ---------- الإجراءات ---------- */
  function analyze(id) {
    const text = draft[id] || '';
    const p = parse(text);
    if (p.error) { toast(p.error, true); return; }

    const b = state.branches[id];
    const res = compare(b.snapshot, p.rows);
    res.skipped = p.skipped;

    b.result = res; b.runAt = Date.now();
    if (state.config.autoSave) {
      b.prevSnapshot = b.snapshot; b.prevPastedAt = b.pastedAt;
      b.snapshot = p.rows; b.pastedAt = Date.now();
      toast(`تمت المقارنة وحُفظ الكشف مرجعًا (${p.count} مورد)`);
    } else {
      b._pending = p.rows;
      toast(`تمت المقارنة (${p.count} مورد). لسه محتاج تحفظه مرجعًا.`);
    }
    draft[id] = '';
    save(); render();
  }

  function keepAsBaseline(id) {
    const b = state.branches[id];
    if (!b._pending) return;
    b.prevSnapshot = b.snapshot; b.prevPastedAt = b.pastedAt;
    b.snapshot = b._pending; b.pastedAt = Date.now(); delete b._pending;
    toast('اتحفظ كمرجع للمقارنة الجاية'); save(); render();
  }

  function undo(id) {
    const b = state.branches[id];
    if (!b.prevSnapshot) return;
    b.snapshot = b.prevSnapshot; b.pastedAt = b.prevPastedAt;
    b.prevSnapshot = null; b.prevPastedAt = null; b.result = null;
    toast('رجعنا للمرجع السابق'); save(); render();
  }

  function resetBranch(id) {
    state.branches[id] = blankBranch();
    toast('اتمسح المرجع. أول لصق جاي هيبقى هو البداية.'); save(); render();
  }

  function addExclusion(code, note) {
    code = String(code || '').trim();
    if (!code) { toast('اكتب كود المورد الأول', true); return false; }
    if (state.config.exclusions.some(x => String(x.code) === code)) { toast('الكود ده مستثنى بالفعل', true); return false; }
    let name = note || '';
    if (!name) for (const b of BR) { const s = state.branches[b.id].snapshot; if (s && s[code]) { name = s[code].a || s[code].e; break; } }
    state.config.exclusions.push({ code, note: name });
    // إزالة الكود من نتائج معروضة
    BR.forEach(b => { const r = state.branches[b.id].result; if (r) { ['changed', 'added', 'removed'].forEach(k => r[k] = r[k].filter(x => String(x.code) !== code)); } });
    save(); return true;
  }

  function csv(id) {
    const b = state.branches[id], r = b.result;
    if (!r) return;
    const rows = [['النوع', 'الكود', 'الاسم', 'الرصيد السابق', 'الرصيد الحالي', 'الفرق']];
    r.changed.forEach(x => rows.push(['تغيّر', x.code, x.name, fmt(x.before), fmt(x.now), fmt(x.diff)]));
    r.added.forEach(x => rows.push(['جديد', x.code, x.name, '', fmt(x.now), '']));
    r.removed.forEach(x => rows.push(['اختفى', x.code, x.name, fmt(x.before), '', '']));
    const body = '\uFEFF' + rows.map(r2 => r2.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv' }));
    a.download = `فروقات-${branchName(id)}-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  }

  const branchName = id => state.config.names[id] || BR.find(b => b.id === id).def;

  /* ---------- العرض ---------- */
  function render() {
    document.getElementById('tabs').innerHTML =
      BR.map(b => {
        const r = state.branches[b.id].result;
        const n = r ? r.changed.length + r.added.length : 0;
        return `<button class="tab ${active === b.id ? 'active' : ''}" data-tab="${b.id}">${esc(branchName(b.id))}${n ? `<span class="dot">${n}</span>` : ''}</button>`;
      }).join('') +
      `<button class="tab ${active === 'ex' ? 'active' : ''}" data-tab="ex">الاستثناءات<span class="dot">${state.config.exclusions.length}</span></button>` +
      `<button class="tab ${active === 'set' ? 'active' : ''}" data-tab="set">الإعدادات</button>`;

    const v = document.getElementById('view');
    v.innerHTML = active === 'ex' ? viewExclusions() : active === 'set' ? viewSettings() : viewBranch(active);
    bind();
  }

  function viewBranch(id) {
    const b = state.branches[id];
    const r = b.result;
    const cnt = b.snapshot ? Object.keys(b.snapshot).length : 0;

    let head = `
      <div class="meta">
        <div><b>آخر لصق محفوظ</b>${when(b.pastedAt)}</div>
        <div><b>عدد الموردين في المرجع</b>${cnt || '—'}</div>
        <div><b>آخر مقارنة</b>${when(b.runAt)}</div>
        <div><b>الموردين المستثنون</b>${state.config.exclusions.length}</div>
      </div>`;

    let paste = `
      <div class="card">
        <h2>لصق كشف ${esc(branchName(id))}</h2>
        <p class="hint">انسخ الجدول من الشاشة عندك (بالعناوين أو من غيرها) والصقه هنا. المهم يفضل الأعمدة مفصولة زي ما هي.</p>
        <textarea id="ta" placeholder="الصق هنا…">${esc(draft[id] || '')}</textarea>
        <div class="row">
          <button class="btn" id="go">قارن مع آخر لصق</button>
          <button class="btn ghost" id="clr">مسح الصندوق</button>
          ${b.prevSnapshot ? '<button class="btn ghost" id="undo">تراجع عن آخر حفظ</button>' : ''}
          <span class="grow"></span>
          ${b.snapshot ? '<button class="btn ghost" id="reset">مسح المرجع وبدء من جديد</button>' : ''}
        </div>
        ${!b.snapshot ? '<div class="warn">ده أول لصق للفرع ده، فمفيش حاجة نقارن بيها. هيتسجل كنقطة البداية، والمقارنة تبدأ من اللصق اللي بعده.</div>' : ''}
        ${b._pending ? '<div class="warn">النتيجة تحت اتحسبت لكن الكشف لسه ما اتحفظش مرجعًا. <button class="btn brass" id="keep" style="padding:5px 12px;font-size:12.5px;margin-inline-start:6px">احفظه مرجعًا</button></div>' : ''}
      </div>`;

    if (!r) return head + paste + '<div class="card"><div class="empty">لسه مفيش مقارنة للفرع ده. الصق الكشف واضغط «قارن مع آخر لصق».</div></div>';

    const q = (filter[id] || '').trim().toLowerCase();
    const match = x => !q || String(x.code).includes(q) || String(x.name || '').toLowerCase().includes(q) || String(x.en || '').toLowerCase().includes(q);
    const ch = r.changed.filter(match), ad = r.added.filter(match), rm = r.removed.filter(match);
    const up = r.changed.filter(x => x.diff > 0).length;
    const dn = r.changed.length - up;

    let out = head + paste + `<div class="card">
      <h2>نتيجة المقارنة — ${esc(branchName(id))}</h2>
      <p class="hint">${r.baseline ? 'مقارنة بآخر كشف محفوظ للفرع.' : 'أول كشف: كل الموردين اتسجلوا كنقطة بداية.'}${r.skipped ? ` (${r.skipped} سطر اتخطيناه لأنه مش صف بيانات)` : ''}</p>
      <div class="chips">
        <div class="chip"><b>${r.changed.length}</b><span>رصيده اتغيّر</span></div>
        <div class="chip c-up"><b>${up}</b><span>زاد</span></div>
        <div class="chip c-down"><b>${dn}</b><span>نقص</span></div>
        <div class="chip c-new"><b>${r.added.length}</b><span>مورد جديد</span></div>
        <div class="chip"><b>${r.total}</b><span>إجمالي الكشف</span></div>
      </div>
      <div class="row">
        <input type="text" id="q" class="grow" placeholder="ابحث بالكود أو الاسم…" value="${esc(filter[id] || '')}">
        <button class="btn ghost" id="csv">تنزيل CSV</button>
        <button class="btn ghost" id="cpy">نسخ الملخص</button>
      </div>`;

    out += `<div class="sec-title"><h3>أرصدة اتغيّرت (${ch.length})</h3></div>`;
    out += ch.length ? table(ch, 'ch') : '<div class="empty">مفيش رصيد اتغيّر عن آخر لصق.</div>';

    if (r.added.length) {
      out += `<div class="sec-title"><h3>موردين ظهروا لأول مرة (${ad.length})</h3></div>` + table(ad, 'ad');
    }
    if (r.removed.length) {
      out += `<div class="sec-title"><h3>موردين مش موجودين في الكشف الجديد (${rm.length})</h3></div>` + table(rm, 'rm');
    }
    return out + '</div>';
  }

  function table(rows, kind) {
    const head = kind === 'ch'
      ? '<th>الكود</th><th>المورد</th><th>الرصيد السابق</th><th>الرصيد الحالي</th><th>الفرق</th><th></th>'
      : kind === 'ad'
        ? '<th>الكود</th><th>المورد</th><th>الرصيد الحالي</th><th>الحالة</th><th></th>'
        : '<th>الكود</th><th>المورد</th><th>آخر رصيد معروف</th><th>الحالة</th><th></th>';

    const body = rows.map(x => {
      const nm = `${esc(x.name || '—')}${x.en && x.en !== x.name ? `<div style="font-size:11.5px;color:#46606f;direction:ltr;text-align:right">${esc(x.en)}</div>` : ''}`;
      const btn = `<button class="mini" data-ex="${esc(x.code)}">استثناء</button>`;
      if (kind === 'ch') return `<tr><td class="code">${esc(x.code)}</td><td>${nm}</td><td class="num">${fmt(x.before)}</td><td class="num">${fmt(x.now)}</td>
        <td class="num"><span class="delta ${x.diff > 0 ? 'up' : 'down'}">${fmtSigned(x.diff)}</span></td><td>${btn}</td></tr>`;
      if (kind === 'ad') return `<tr><td class="code">${esc(x.code)}</td><td>${nm}</td><td class="num">${fmt(x.now)}</td><td><span class="tag">جديد</span></td><td>${btn}</td></tr>`;
      return `<tr><td class="code">${esc(x.code)}</td><td>${nm}</td><td class="num">${fmt(x.before)}</td><td><span class="tag gone">اختفى</span></td><td>${btn}</td></tr>`;
    }).join('');

    return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function viewExclusions() {
    const ex = state.config.exclusions;
    return `
      <div class="card">
        <h2>الموردين المستثنون</h2>
        <p class="hint">الأكواد هنا مش هتظهر في نتائج المقارنة في أي فرع.</p>
        <div class="row">
          <label class="field">كود المورد<input type="text" id="exc" placeholder="مثال: 260" style="width:140px"></label>
          <label class="field grow">ملاحظة (اختياري)<input type="text" id="exn" placeholder="اسم المورد أو سبب الاستثناء"></label>
          <button class="btn brass" id="exadd" style="align-self:flex-end">إضافة للاستثناءات</button>
        </div>
      </div>
      <div class="card">
        <h2>القائمة (${ex.length})</h2>
        ${ex.length ? `<div class="table-wrap"><table><thead><tr><th>الكود</th><th>الملاحظة</th><th></th></tr></thead><tbody>
          ${ex.map((x, i) => `<tr><td class="code">${esc(x.code)}</td><td>${esc(x.note || '—')}</td><td><button class="mini" data-rm="${i}">حذف</button></td></tr>`).join('')}
        </tbody></table></div>` : '<div class="empty">مفيش استثناءات. ضيف كود من فوق، أو من زرار «استثناء» جنب أي مورد في النتائج.</div>'}
      </div>`;
  }

  function viewSettings() {
    return `
      <div class="card">
        <h2>إعدادات المقارنة</h2>
        <div class="row">
          <label class="field">تجاهل الفروق الأصغر من
            <input type="number" id="th" step="0.001" min="0" value="${state.config.threshold}" style="width:140px">
          </label>
          <label class="field" style="justify-content:flex-end">
            <span style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)">
              <input type="checkbox" id="auto" ${state.config.autoSave ? 'checked' : ''}> حفظ الكشف مرجعًا تلقائيًا بعد كل مقارنة
            </span>
          </label>
        </div>
        <p class="hint" style="margin-top:10px">الفروق الصغيرة (زي 0.001) بتيجي من تقريب الكسور، فالافتراضي بيتجاهلها.</p>
      </div>
      <div class="card">
        <h2>أسماء الفروع</h2>
        <div class="row">
          ${BR.map(b => `<label class="field grow">${esc(b.def)}<input type="text" class="bn" data-b="${b.id}" value="${esc(branchName(b.id))}"></label>`).join('')}
        </div>
      </div>
      <div class="card">
        <h2>حالة البيانات</h2>
        <div class="table-wrap"><table><thead><tr><th>الفرع</th><th>آخر لصق</th><th>عدد الموردين</th></tr></thead><tbody>
          ${BR.map(b => { const s = state.branches[b.id]; return `<tr><td>${esc(branchName(b.id))}</td><td>${when(s.pastedAt)}</td><td class="num">${s.snapshot ? Object.keys(s.snapshot).length : 0}</td></tr>`; }).join('')}
        </tbody></table></div>
        <p class="hint" style="margin-top:12px">البيانات محفوظة معاك وبتفضل موجودة لما تفتح الشاشة تاني.</p>
      </div>`;
  }

  /* ---------- ربط الأحداث ---------- */
  function bind() {
    document.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { active = el.dataset.tab; render(); });

    const id = active;
    const ta = document.getElementById('ta');
    if (ta) ta.oninput = e => draft[id] = e.target.value;

    const on = (elId, fn) => { const el = document.getElementById(elId); if (el) el.onclick = fn; };
    on('go', () => analyze(id));
    on('clr', () => { draft[id] = ''; render(); });
    on('undo', () => undo(id));
    on('reset', () => resetBranch(id));
    on('keep', () => keepAsBaseline(id));
    on('csv', () => csv(id));
    on('cpy', () => {
      const r = state.branches[id].result; if (!r) return;
      const txt = [`فروقات ${branchName(id)} — ${when(Date.now())}`, '']
        .concat(r.changed.map(x => `${x.code} | ${x.name} | ${fmt(x.before)} ← ${fmt(x.now)} | ${fmtSigned(x.diff)}`))
        .concat(r.added.length ? ['', 'موردين جدد:'].concat(r.added.map(x => `${x.code} | ${x.name} | ${fmt(x.now)}`)) : [])
        .join('\n');
      navigator.clipboard.writeText(txt).then(() => toast('اتنسخ الملخص'), () => toast('النسخ مش متاح هنا', true));
    });

    const q = document.getElementById('q');
    if (q) q.oninput = e => {
      filter[id] = e.target.value;
      const pos = e.target.selectionStart; render();
      const nq = document.getElementById('q'); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); }
    };

    document.querySelectorAll('[data-ex]').forEach(el => el.onclick = () => {
      if (addExclusion(el.dataset.ex)) { toast('اتضاف للاستثناءات'); render(); }
    });

    on('exadd', () => {
      const c = document.getElementById('exc').value, n = document.getElementById('exn').value;
      if (addExclusion(c, n)) { toast('اتضاف للاستثناءات'); render(); }
    });
    document.querySelectorAll('[data-rm]').forEach(el => el.onclick = () => {
      state.config.exclusions.splice(Number(el.dataset.rm), 1); save(); render();
    });

    const th = document.getElementById('th');
    if (th) th.onchange = e => { state.config.threshold = Math.max(0, Number(e.target.value) || 0); save(); toast('اتحفظ'); };
    const au = document.getElementById('auto');
    if (au) au.onchange = e => { state.config.autoSave = e.target.checked; save(); };
    document.querySelectorAll('.bn').forEach(el => el.onchange = () => {
      state.config.names[el.dataset.b] = el.value.trim() || BR.find(b => b.id === el.dataset.b).def;
      save(); render();
    });
  }

  load().then(render);
})();
</script>
