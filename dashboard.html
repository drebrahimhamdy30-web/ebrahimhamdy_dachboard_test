<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .dash-header {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap;
      gap: 12px; margin-bottom: 20px;
    }
    .date-filter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .date-filter label { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
    .date-filter input { width: 150px; }

    /* Tabs */
    .dash-tabs {
      display: flex; gap: 0; margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }
    .dash-tab {
      padding: 10px 20px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600;
      color: var(--text-muted); border: none;
      background: none; font-family: var(--font);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px; transition: all 0.2s;
    }
    .dash-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); }
    .dash-tab:hover  { color: var(--text-primary); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* KPI */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 14px; }
    .kpi-icon { width: 46px; height: 46px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .kpi-body { flex: 1; min-width: 0; }
    .kpi-value { font-size: 1.5rem; font-weight: 900; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; font-weight: 500; }

    /* Branch Cards */
    .branches-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .branch-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm); }
    .branch-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .branch-name { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); }
    .branch-total { font-size: 1.1rem; font-weight: 900; color: var(--accent-dark); }
    .branch-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .branch-metric { text-align: center; }
    .branch-metric-val { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); }
    .branch-metric-lbl { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }
    .pay-breakdown { display: flex; gap: 6px; flex-wrap: wrap; }
    .pay-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .pay-walkin   { background: #dcfce7; color: #15803d; }
    .pay-delivery { background: #dbeafe; color: #1d4ed8; }

    /* Emp Table */
    .section-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .section-title i { color: var(--accent); }
    .emp-table { width: 100%; border-collapse: collapse; }
    .emp-table th { background: var(--surface-3); padding: 9px 12px; font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-align: right; border-bottom: 2px solid var(--border); }
    .emp-table td { padding: 9px 12px; font-size: 0.82rem; border-bottom: 1px solid var(--surface-3); vertical-align: middle; }
    .emp-table tr:last-child td { border-bottom: none; }
    .emp-table tr:hover td { background: var(--surface-2); }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 0.72rem; font-weight: 700; }
    .rank-1 { background: #fef9c3; color: #a16207; }
    .rank-2 { background: #f1f5f9; color: #475569; }
    .rank-3 { background: #ffedd5; color: #c2410c; }
    .rank-n { background: var(--surface-3); color: var(--text-muted); }

    /* ===== TREND TAB ===== */
    .trend-controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      align-items: center; margin-bottom: 20px;
      padding: 14px 16px;
      background: var(--surface-3);
      border-radius: var(--radius-md);
    }
    .trend-controls label { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); }
    .trend-controls select { width: auto; }

    .trend-table-wrap { overflow-x: auto; margin-bottom: 24px; }
    .trend-table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .trend-table th {
      background: var(--primary); color: #fff;
      padding: 10px 12px; font-size: 0.75rem; font-weight: 700;
      text-align: center; white-space: nowrap;
    }
    .trend-table th:first-child { text-align: right; }
    .trend-table td {
      padding: 9px 12px; font-size: 0.8rem;
      border-bottom: 1px solid var(--surface-3);
      text-align: center; vertical-align: middle;
    }
    .trend-table td:first-child { text-align: right; font-weight: 600; white-space: nowrap; }
    .trend-table tr:hover td { background: #f8fafc; }
    .trend-table tr.total-row td { background: var(--surface-3); font-weight: 700; }

    .cell-high { background: #dcfce7 !important; color: #15803d; font-weight: 700; }
    .cell-low  { background: #fee2e2 !important; color: #b91c1c; font-weight: 700; }
    .cell-mid  { background: #fff; }

    .trend-legend {
      display: flex; gap: 12px; margin-bottom: 16px;
      font-size: 0.75rem; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    /* Shift emp breakdown */
    .shift-emp-section { margin-top: 16px; }
    .shift-emp-title { font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 10px; }
    .emp-day-grid { display: grid; gap: 6px; }
    .emp-day-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
    }
    .emp-day-name { font-weight: 600; color: var(--text-primary); }
    .emp-day-sales { color: var(--accent-dark); font-weight: 700; }

    .loading-overlay { text-align: center; padding: 60px; color: var(--text-muted); font-size: 1rem; }

    @media(max-width:640px) {
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .branches-grid { grid-template-columns: 1fr; }
      .branch-metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">

      <div class="dash-header">
        <div class="page-title"><i class="fas fa-chart-line"></i> لوحة المؤشرات</div>
        <div class="date-filter">
          <label>من</label>
          <input type="date" id="date-from" class="form-input">
          <label>إلى</label>
          <input type="date" id="date-to" class="form-input">
          <button class="btn btn-primary" onclick="loadDashboard()">
            <i class="fas fa-search"></i> عرض
          </button>
        </div>
      </div>

      <!-- Tabs -->
      <div class="dash-tabs">
        <button class="dash-tab active" onclick="switchTab('overview')">
          <i class="fas fa-chart-pie"></i> نظرة عامة
        </button>
        <button class="dash-tab" onclick="switchTab('trend')">
          <i class="fas fa-chart-line"></i> تحليل الشيفتات
        </button>
      </div>

      <div id="dashboard-content">
        <div class="loading-overlay">⏳ جاري تحميل البيانات...</div>
      </div>

    </div>
  </div>

  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script>
    const DASH_URL = 'https://agent.ebrahimhamdy.com/webhook/dashboard';
    const BRANCH_DISPLAY = {
      'الصيدلية':       'المعمورة',
      'ابراهيم حمدي 2': 'سان ستيفانو',
      'ابراهيم حمدي 3': 'سيدى بشر'
    };
    const BRANCH_KEYS = ['الصيدلية', 'ابراهيم حمدي 2', 'ابراهيم حمدي 3'];

    let globalData = [];
    let activeTab  = 'overview';

    checkAuth().then(user => {
      if (!user) return;
      const role = localStorage.getItem('userRole') || '';
      if (role !== 'admin') {
        document.getElementById('dashboard-content').innerHTML =
          '<div class="loading-overlay" style="color:var(--danger);">🔒 هذه الصفحة للإدارة فقط</div>';
        return;
      }
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date-from').value = today;
      document.getElementById('date-to').value   = today;
      loadDashboard();
    });

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.dash-tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'overview') || (i === 1 && tab === 'trend'));
      });
      if (globalData.length) renderAll(globalData);
    }

async function loadDashboard() {
  const dateFrom = document.getElementById('date-from').value;
  const dateTo   = document.getElementById('date-to').value;
  if (!dateFrom || !dateTo) { alert('برجاء اختيار الفترة'); return; }

  document.getElementById('dashboard-content').innerHTML =
    '<div class="loading-overlay">⏳ جاري جلب البيانات...</div>';

  try {
    const resp = await fetch(DASH_URL + '?type=sales_summary');
    const raw  = await resp.json();
    const all  = Array.isArray(raw) ? raw : (raw.data || []);

    // فلترة بالتاريخ في الـ JS
    globalData = all.filter(r => {
      const d = r.Report_Date ? r.Report_Date.slice(0, 10) : '';
      return d >= dateFrom && d <= dateTo;
    });

    if (!globalData.length) {
      document.getElementById('dashboard-content').innerHTML =
        '<div class="loading-overlay">لا توجد بيانات في هذه الفترة</div>';
      return;
    }
    renderAll(globalData);
  } catch(e) {
    document.getElementById('dashboard-content').innerHTML =
      '<div class="loading-overlay" style="color:var(--danger);">❌ فشل الاتصال</div>';
  }
}

    function renderAll(data) {
      if (activeTab === 'overview') renderOverview(data);
      else renderTrend(data);
    }

    function num(v) { return parseFloat(v) || 0; }
    function fmt(v)  { return num(v).toLocaleString('ar-EG', {minimumFractionDigits:0, maximumFractionDigits:0}); }
    function fmt2(v) { return num(v).toLocaleString('ar-EG', {minimumFractionDigits:2, maximumFractionDigits:2}); }

    // ==================== TAB 1: OVERVIEW ====================
    function renderOverview(data) {
      const totalSales  = data.reduce((s, r) => s + num(r.Net_Sales), 0);
      const totalTx     = data.reduce((s, r) => s + num(r.Bills_Count), 0);
      const totalDisc   = data.reduce((s, r) => s + num(r.Total_Discounts), 0);
      const avgPerTx    = totalTx > 0 ? totalSales / totalTx : 0;
      const walkinSales = data.filter(r => r.Type === 'Walk-in').reduce((s,r) => s+num(r.Net_Sales), 0);
      const deliverySales = data.filter(r => r.Type === 'توصيل').reduce((s,r) => s+num(r.Net_Sales), 0);

      const branches = {};
      data.forEach(r => {
        const b = r.Branch_Name;
        if (!branches[b]) branches[b] = {total:0, tx:0, disc:0, walkin:0, delivery:0};
        branches[b].total    += num(r.Net_Sales);
        branches[b].tx       += num(r.Bills_Count);
        branches[b].disc     += num(r.Total_Discounts);
        if (r.Type === 'Walk-in') branches[b].walkin += num(r.Net_Sales);
        if (r.Type === 'توصيل')  branches[b].delivery += num(r.Net_Sales);
      });

      const empMap = {};
      data.forEach(r => {
        const key = r.Employee_Name + '||' + r.Branch_Name;
        if (!empMap[key]) empMap[key] = {name: r.Employee_Name, branch: r.Branch_Name, sales:0, tx:0};
        empMap[key].sales += num(r.Net_Sales);
        empMap[key].tx    += num(r.Bills_Count);
      });
      const allEmps = Object.values(empMap).sort((a,b) => b.sales - a.sales);

      let html = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-icon" style="background:#dbeafe;"><i class="fas fa-pound-sign" style="color:#1d4ed8;"></i></div>
            <div class="kpi-body">
              <div class="kpi-value" style="color:#1d4ed8;">${fmt(totalSales)}</div>
              <div class="kpi-label">إجمالي المبيعات (جنيه)</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon" style="background:#dcfce7;"><i class="fas fa-receipt" style="color:#15803d;"></i></div>
            <div class="kpi-body">
              <div class="kpi-value" style="color:#15803d;">${fmt(totalTx)}</div>
              <div class="kpi-label">عدد الفواتير</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon" style="background:#fef9c3;"><i class="fas fa-calculator" style="color:#a16207;"></i></div>
            <div class="kpi-body">
              <div class="kpi-value" style="color:#a16207;">${fmt2(avgPerTx)}</div>
              <div class="kpi-label">متوسط الفاتورة (جنيه)</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon" style="background:#fee2e2;"><i class="fas fa-tags" style="color:#b91c1c;"></i></div>
            <div class="kpi-body">
              <div class="kpi-value" style="color:#b91c1c;">${fmt2(totalDisc)}</div>
              <div class="kpi-label">إجمالي الخصومات (جنيه)</div>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;">
          <span style="font-size:0.8rem;font-weight:700;color:var(--text-secondary);">تفصيل:</span>
          <span class="pay-badge pay-walkin">🏪 walk_in: ${fmt(walkinSales)} ج</span>
          <span class="pay-badge pay-delivery">🛵 توصيل: ${fmt(deliverySales)} ج</span>
        </div>

        <div class="branches-grid">
      `;

      BRANCH_KEYS.forEach(bk => {
        const b = branches[bk];
        if (!b) return;
        const displayName = BRANCH_DISPLAY[bk] || bk;
        const avg = b.tx > 0 ? b.total / b.tx : 0;
        html += `
          <div class="branch-card">
            <div class="branch-card-header">
              <span class="branch-name"><i class="fas fa-store" style="color:var(--accent);margin-left:6px;"></i>${displayName}</span>
              <span class="branch-total">${fmt(b.total)} ج</span>
            </div>
            <div class="branch-metrics">
              <div class="branch-metric">
                <div class="branch-metric-val">${fmt(b.tx)}</div>
                <div class="branch-metric-lbl">فاتورة</div>
              </div>
              <div class="branch-metric">
                <div class="branch-metric-val">${fmt2(avg)}</div>
                <div class="branch-metric-lbl">متوسط/فاتورة</div>
              </div>
              <div class="branch-metric">
                <div class="branch-metric-val" style="color:var(--danger);">${fmt2(b.disc)}</div>
                <div class="branch-metric-lbl">خصومات</div>
              </div>
            </div>
            <div class="pay-breakdown">
              <span class="pay-badge pay-walkin">walk-in ${fmt(b.walkin)}</span>
              ${b.delivery > 0 ? `<span class="pay-badge pay-delivery">توصيل ${fmt(b.delivery)}</span>` : ''}
            </div>
          </div>
        `;
      });

      html += `</div>
        <div class="card" style="margin-top:0;border:1px solid var(--border);">
          <div class="section-title"><i class="fas fa-trophy"></i> الموظفون مرتبين حسب المبيعات</div>
          <div style="overflow-x:auto;">
            <table class="emp-table">
              <thead>
                <tr>
                  <th style="width:40px;text-align:center;">#</th>
                  <th>الموظف</th><th>الفرع</th>
                  <th style="text-align:left;">المبيعات</th>
                  <th style="text-align:left;">الفواتير</th>
                  <th style="text-align:left;">متوسط/فاتورة</th>
                </tr>
              </thead>
              <tbody>
      `;
      allEmps.forEach((e, i) => {
        const rc = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
        const ri = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
        const avg = e.tx>0 ? e.sales/e.tx : 0;
        html += `<tr>
          <td style="text-align:center;"><span class="rank-badge ${rc}">${ri}</span></td>
          <td style="font-weight:600;">${e.name}</td>
          <td><span class="branch-tag">${BRANCH_DISPLAY[e.branch]||e.branch}</span></td>
          <td style="font-weight:700;color:var(--accent-dark);">${fmt(e.sales)} ج</td>
          <td>${fmt(e.tx)}</td>
          <td>${fmt2(avg)} ج</td>
        </tr>`;
      });
      html += `</tbody></table></div></div>`;

      document.getElementById('dashboard-content').innerHTML = html;
    }

    // ==================== TAB 2: TREND ====================
    function renderTrend(data) {
      // الشيفتات والفروع المتاحة
      const branches = [...new Set(data.map(r => r.Branch_Name))].sort();
      const shifts   = [...new Set(data.map(r => r.Shift))].sort();
      const dates    = [...new Set(data.map(r => r.Report_Date))].sort();

      let html = `
        <div class="trend-controls">
          <label>الفرع:</label>
          <select class="form-select" id="trend-branch" onchange="renderTrendTable()">
            ${branches.map(b => `<option value="${b}">${BRANCH_DISPLAY[b]||b}</option>`).join('')}
          </select>
          <label>الشيفت:</label>
          <select class="form-select" id="trend-shift" onchange="renderTrendTable()">
            <option value="all">كل الشيفتات</option>
            ${shifts.map(s => `<option value="${s}">${s}</option>`).join('')}
          </select>
          <label>عرض:</label>
          <select class="form-select" id="trend-metric" onchange="renderTrendTable()">
            <option value="sales">المبيعات (جنيه)</option>
            <option value="tx">عدد الفواتير</option>
            <option value="avg">متوسط الفاتورة</option>
          </select>
        </div>
        <div class="trend-legend">
          <div class="legend-item"><div class="legend-dot" style="background:#dcfce7;border:1px solid #15803d;"></div> أعلى يوم</div>
          <div class="legend-item"><div class="legend-dot" style="background:#fee2e2;border:1px solid #b91c1c;"></div> أدنى يوم</div>
        </div>
        <div id="trend-table-container"></div>
        <div id="trend-emp-container"></div>
      `;

      document.getElementById('dashboard-content').innerHTML = html;
      renderTrendTable();
    }

    function renderTrendTable() {
      const data     = globalData;
      const branch   = document.getElementById('trend-branch').value;
      const shift    = document.getElementById('trend-shift').value;
      const metric   = document.getElementById('trend-metric').value;

      const filtered = data.filter(r =>
        r.Branch_Name === branch &&
        (shift === 'all' || r.Shift === shift)
      );

      const dates  = [...new Set(filtered.map(r => r.Report_Date))].sort();
      const shifts = shift === 'all'
        ? [...new Set(filtered.map(r => r.Shift))].sort()
        : [shift];

      if (!dates.length) {
        document.getElementById('trend-table-container').innerHTML =
          '<p style="color:var(--text-muted);text-align:center;padding:30px;">لا توجد بيانات</p>';
        document.getElementById('trend-emp-container').innerHTML = '';
        return;
      }

      // بناء matrix: shift × date
      const matrix = {};
      shifts.forEach(s => {
        matrix[s] = {};
        dates.forEach(d => {
          const rows = filtered.filter(r => r.Shift === s && r.Report_Date === d);
          const sales = rows.reduce((sum, r) => sum + num(r.Net_Sales), 0);
          const tx    = rows.reduce((sum, r) => sum + num(r.Bills_Count), 0);
          matrix[s][d] = { sales, tx, avg: tx>0 ? sales/tx : 0 };
        });
      });

      // إيجاد أعلى وأدنى لكل شيفت
      const shiftStats = {};
      shifts.forEach(s => {
        const vals = dates.map(d => matrix[s][d][metric === 'sales' ? 'sales' : metric === 'tx' ? 'tx' : 'avg']);
        const nonZero = vals.filter(v => v > 0);
        shiftStats[s] = {
          max: nonZero.length ? Math.max(...nonZero) : 0,
          min: nonZero.length ? Math.min(...nonZero) : 0,
          avg: nonZero.length ? nonZero.reduce((a,b)=>a+b,0)/nonZero.length : 0
        };
      });

      // بناء الجدول
      let html = `<div class="trend-table-wrap">
        <table class="trend-table">
          <thead>
            <tr>
              <th>الشيفت</th>
              ${dates.map(d => `<th>${d.slice(5)}</th>`).join('')}
              <th>المتوسط</th>
            </tr>
          </thead>
          <tbody>
      `;

      shifts.forEach(s => {
        const stat = shiftStats[s];
        html += `<tr>
          <td>${s}</td>
          ${dates.map(d => {
            const val = matrix[s][d][metric === 'sales' ? 'sales' : metric === 'tx' ? 'tx' : 'avg'];
            const disp = metric === 'avg' ? fmt2(val) : fmt(val);
            let cls = '';
            if (val > 0 && val === stat.max) cls = 'cell-high';
            else if (val > 0 && val === stat.min) cls = 'cell-low';
            return `<td class="${cls}">${val > 0 ? disp : '—'}</td>`;
          }).join('')}
          <td style="background:var(--surface-3);font-weight:700;">${metric==='avg' ? fmt2(stat.avg) : fmt(stat.avg)}</td>
        </tr>`;
      });

      // صف الإجمالي
      const totals = dates.map(d => {
        const rows = filtered.filter(r => r.Report_Date === d);
        const s = rows.reduce((sum,r) => sum+num(r.Net_Sales), 0);
        const t = rows.reduce((sum,r) => sum+num(r.Bills_Count), 0);
        return { sales:s, tx:t, avg: t>0?s/t:0 };
      });
      const grandAvg = totals.reduce((sum,t) => sum + t[metric==='sales'?'sales':metric==='tx'?'tx':'avg'], 0) / (totals.filter(t=>t.sales>0).length||1);

      html += `<tr class="total-row">
        <td>الإجمالي</td>
        ${totals.map(t => {
          const v = t[metric==='sales'?'sales':metric==='tx'?'tx':'avg'];
          return `<td>${v>0?(metric==='avg'?fmt2(v):fmt(v)):'—'}</td>`;
        }).join('')}
        <td>${metric==='avg'?fmt2(grandAvg):fmt(grandAvg)}</td>
      </tr>`;

      html += `</tbody></table></div>`;
      document.getElementById('trend-table-container').innerHTML = html;

      // ===== تحليل الموظفين =====
      renderEmpBreakdown(filtered, dates, shift);
    }

    function renderEmpBreakdown(filtered, dates, shift) {
      // لكل يوم — من كان شغال وكم باع
      let html = `
        <div style="margin-top:24px;">
          <div class="section-title"><i class="fas fa-users"></i> تأثير الموظفين على كل يوم</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">
      `;

      dates.forEach(d => {
        const dayRows = filtered.filter(r => r.Report_Date === d);
        const empDay  = {};
        dayRows.forEach(r => {
          const k = r.Employee_Name;
          if (!empDay[k]) empDay[k] = { sales:0, tx:0 };
          empDay[k].sales += num(r.Net_Sales);
          empDay[k].tx    += num(r.Bills_Count);
        });
        const emps     = Object.entries(empDay).sort((a,b) => b[1].sales - a[1].sales);
        const dayTotal = emps.reduce((s,[,v]) => s+v.sales, 0);
        const dayTx    = emps.reduce((s,[,v]) => s+v.tx, 0);

        html += `
          <div class="branch-card" style="padding:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);">
              <span style="font-size:0.82rem;font-weight:700;color:var(--text-secondary);">📅 ${d}</span>
              <span style="font-size:0.88rem;font-weight:900;color:var(--accent-dark);">${fmt(dayTotal)} ج</span>
            </div>
            <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:8px;">${fmt(dayTx)} فاتورة — متوسط ${dayTx>0?fmt2(dayTotal/dayTx):0} ج</div>
            <div style="display:flex;flex-direction:column;gap:5px;">
              ${emps.map(([name, v], i) => {
                const pct = dayTotal > 0 ? (v.sales/dayTotal*100).toFixed(0) : 0;
                const color = i===0 ? '#15803d' : i===1 ? '#1d4ed8' : '#64748b';
                return `
                  <div style="font-size:0.78rem;">
                    <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
                      <span style="font-weight:600;color:${color};">${name}</span>
                      <span style="color:var(--text-secondary);">${fmt(v.sales)} ج (${pct}%)</span>
                    </div>
                    <div style="background:var(--surface-3);border-radius:4px;height:5px;">
                      <div style="background:${color};width:${pct}%;height:5px;border-radius:4px;"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      html += `</div></div>`;
      document.getElementById('trend-emp-container').innerHTML = html;
    }
  </script>
</body>
</html>
