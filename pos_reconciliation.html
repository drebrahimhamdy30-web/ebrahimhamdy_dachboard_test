<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسوية المدفوعات وإغلاق الشيفت — Phalix</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ===== أنماط خاصة بصفحة التسوية (متناسقة مع style.css) ===== */
  .tabs-bar{display:flex;gap:6px;background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-md);padding:5px;margin-bottom:16px;flex-wrap:wrap}
  .tab-btn{flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border:none;background:transparent;border-radius:var(--radius-sm);font-family:var(--font);font-size:0.85rem;font-weight:700;color:var(--text-secondary);cursor:pointer;transition:all .2s}
  .tab-btn:hover{background:var(--surface)}
  .tab-btn.active{background:var(--accent);color:var(--primary)}
  .tab-view{display:none}
  .tab-view.active{display:block}

  /* ===== Reconciliation aligned table (each pair = one row, two halves) ===== */
  .recon-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .recon-thead{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-3);border-bottom:2px solid #16a34a;position:sticky;top:0;z-index:3}
  .recon-thead .rh{padding:9px 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:0.82rem;color:var(--text-secondary)}
  .recon-thead .rh.sys{border-inline-end:2px solid #16a34a}
  .recon-thead .rh .col-count{margin-inline-start:auto;font-size:0.72rem;color:var(--text-muted);font-weight:600}
  .recon-tbody{max-height:70vh;overflow-y:auto}

  .pair{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #16a34a;position:relative;transition:opacity .15s,filter .15s}
  .pair:last-child{border-bottom:none}
  .pair:hover{background:#fafbfc}
  .half{position:relative;min-height:40px;display:flex;align-items:stretch}
  .half.sys{border-inline-end:2px solid #16a34a}
  .half .rbody{flex:1;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .half .r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .half .ramt{font-size:0.92rem;font-weight:800;color:var(--text-primary);white-space:nowrap;font-variant-numeric:tabular-nums}
  .half .r2{display:flex;align-items:center;gap:6px;margin-top:1px;color:var(--text-muted);font-size:0.68rem;flex-wrap:wrap}
  .half .ractions{display:flex;align-items:center;gap:3px;padding:0 7px;opacity:0;transition:.15s}
  .pair:hover .half .ractions{opacity:1}

  .pair.matched .half{background:linear-gradient(90deg,#f3fbf6,transparent 85%)}
  .pair.matched .ramt{color:#15803d}
  .pair.diff .half{background:#fffaf0}
  .pair.diff .ramt{color:#b45309}
  .pair.manual .half{background:#f3f7fd}
  .pair.hidden-soft{opacity:.5}

  .half.empty{background:#fdf4f4;align-items:center;justify-content:center;color:#b91c1c;font-weight:700;font-size:0.76rem;gap:8px;padding:6px 12px;text-align:center;border:1px dashed #f3c6c6}
  .half.sel{outline:2px solid var(--accent);outline-offset:-2px}

  /* ---- مجموعة الربط المتعدد: خانة واحدة ممتدة بصرياً (grid-row span) مقابل عناصر مرصوصة ---- */
  .half.multi-anchor{background:#f3f7fd}
  .half.multi-item.multi-sep{border-top:2px solid #16a34a}

  /* ---- وضع الربط البصري (موحّد: واحد لواحد + متعدد) ---- */
  .pair.link-dim{opacity:.32;filter:saturate(.6)}
  .half.link-anchor{background:#dcfce7 !important;outline:2px solid #16a34a;outline-offset:-2px;z-index:1}
  .half.link-pickable{cursor:pointer;outline:1.5px dashed #94a3b8;outline-offset:-2px}
  .half.link-pickable:hover{background:#f0fdf4;outline-color:#16a34a}
  .half.link-picked{background:#bbf7d0 !important;outline:2px solid #16a34a;outline-offset:-2px;cursor:pointer}
  .link-pick-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#16a34a;color:#fff;font-size:0.62rem;font-weight:800;margin-inline-end:4px}

  .rstatus{position:absolute;top:4px;inset-inline-end:7px;font-size:0.6rem;font-weight:800;padding:1px 6px;border-radius:20px;z-index:2}

  .ibtn{width:25px;height:25px;border-radius:6px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text-muted);transition:.15s;font-size:0.74rem}
  .ibtn:hover{color:var(--text-primary);border-color:var(--text-muted)}
  .ibtn.danger:hover{color:var(--danger);border-color:var(--danger)}
  .ibtn.go:hover{color:var(--success);border-color:var(--success)}

  .add-here{border:1px solid #f3c6c6;background:#fff;color:#b91c1c;padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;font-family:var(--font);font-weight:700;font-size:0.72rem;display:inline-flex;gap:5px;align-items:center}
  .add-here:hover{background:#fef2f2}

  .src-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;font-size:0.66rem;font-weight:700}
  .src-paymob{background:#fae8ff;color:#a21caf}
  .src-orange{background:#ffedd5;color:#c2410c}
  .src-vodafone{background:#fee2e2;color:#b91c1c}
  .src-instapay{background:#ede9fe;color:#6d28d9}
  .src-fawry{background:#dcfce7;color:#15803d}
  .src-other{background:#f1f5f9;color:#475569}
  .bill-chip{background:#e0f2fe;color:#0369a1;padding:1px 8px;border-radius:20px;font-size:0.66rem;font-weight:700}

  /* ---- شريط الربط الثابت فوق الصفحة ---- */
  #link-bar{position:sticky;top:0;z-index:60;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:10px 16px;margin-bottom:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 6px 20px rgba(15,23,42,.25)}
  #link-bar b{color:#fff}
  #link-bar .lb-tag{font-weight:800;color:#4ade80;display:flex;align-items:center;gap:6px}
  #link-bar .lb-stat{font-size:0.82rem;color:#cbd5e1}
  #link-bar .lb-diff{font-size:0.82rem;font-weight:700}
  #link-bar .lb-actions{margin-inline-start:auto;display:flex;gap:8px}
  #link-bar button{border:none;border-radius:8px;padding:7px 14px;font-family:var(--font);font-weight:700;font-size:0.8rem;cursor:pointer}
  #link-bar .lb-cancel{background:#334155;color:#cbd5e1}
  #link-bar .lb-cancel:hover{background:#475569}
  #link-bar .lb-confirm{background:#16a34a;color:#fff}
  #link-bar .lb-confirm:hover{background:#15803d}

  /* ===== Close shift ===== */
  .close-grid{display:grid;grid-template-columns:.65fr 1fr .65fr;gap:14px;align-items:start}
  .denom-row{display:grid;grid-template-columns:80px 1fr 110px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--surface-3)}
  .denom-row:last-child{border-bottom:none}
  .denom-face{text-align:center;font-weight:800;font-size:0.9rem;padding:6px 0;border-radius:var(--radius-sm);background:var(--surface-3)}
  .denom-face.coin{color:#a16207;background:#fef9c3}
  .denom-face.note{color:#0369a1;background:#e0f2fe}
  .denom-sub{text-align:left;font-weight:700;color:var(--text-primary);font-size:0.9rem}
  .denom-sub.zero{color:var(--text-muted);font-weight:400}

  .cust-line{display:grid;grid-template-columns:1fr 110px 32px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--surface-3)}
  .cust-line:last-child{border-bottom:none}
  .add-line-btn{margin-top:10px;width:100%;padding:9px;border:1.5px dashed var(--border);background:transparent;border-radius:var(--radius-sm);color:var(--text-secondary);cursor:pointer;font-family:var(--font);font-weight:600;font-size:0.82rem}
  .add-line-btn:hover{border-color:var(--accent);color:var(--accent-dark)}

  .wtot-line{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--surface-3)}

  /* جدول فواتير الكاش المحوّلة لمحفظة — أعمدة أرقام ضيقة، مش متمدّدة */
  .c2w-table{width:100%;border-collapse:collapse;font-size:0.8rem;margin-top:4px}
  .c2w-table th,.c2w-table td{padding:6px 8px;border-bottom:1px solid var(--surface-3);text-align:start;white-space:nowrap}
  .c2w-table th{font-size:0.7rem;color:var(--text-muted);font-weight:700}
  .c2w-table th.num,.c2w-table td.num{width:78px;max-width:78px;text-align:center}
  .c2w-table th.actions,.c2w-table td.actions{width:150px;text-align:center}
  .c2w-table td.c2w-editable{text-decoration:underline dotted;text-decoration-color:var(--text-muted)}
  .c2w-table td.c2w-editable:hover{background:#f0fdf4}
  .wtot-line:last-child{border-bottom:none}

  .card-mini-head{font-size:0.9rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .card-mini-head .htot{margin-inline-start:auto;font-weight:900;color:var(--accent-dark)}

  .grand-card{grid-column:1/-1;background:linear-gradient(135deg,#f0fdf4,#fff);border:1.5px solid #86efac;border-radius:var(--radius-lg);padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:4px}
  .grand-cell{text-align:center}
  .grand-cell .gl{font-size:0.72rem;color:var(--text-secondary);font-weight:600;margin-bottom:5px}
  .grand-cell .gv{font-size:1.5rem;font-weight:900;line-height:1}
  .grand-cell.cash .gv{color:#a16207}
  .grand-cell.cust .gv{color:#c2410c}
  .grand-cell.auto .gv{color:#0369a1}
  .grand-cell.total .gv{color:#15803d}

  .lock-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:var(--radius-md);padding:14px 16px;font-size:0.85rem;font-weight:600;display:flex;align-items:center;gap:10px}

  .mono{font-variant-numeric:tabular-nums}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;z-index:2000;padding:16px}
  .modal-bg.show{display:grid}
  .modal-box{background:var(--surface);border-radius:var(--radius-lg);width:min(460px,100%);box-shadow:var(--shadow-lg);overflow:hidden}
  .modal-box h3{padding:16px 18px;border-bottom:1px solid var(--border);font-size:1rem;display:flex;align-items:center;gap:8px}
  .modal-box .mb{padding:18px}
  .modal-box .mf{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2)}
  .modal-lbl{display:block;font-size:0.78rem;font-weight:700;color:var(--text-secondary);margin:14px 0 5px}
  .modal-lbl:first-child{margin-top:0}
  .modal-hint{font-size:0.76rem;color:var(--text-muted);margin-top:5px}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 20px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:3000;font-weight:600;font-size:0.85rem}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:#15803d} .toast.bad{background:#b91c1c}

  @media (max-width:760px){
    .close-grid{grid-template-columns:1fr}
    .grand-card{grid-template-columns:1fr 1fr}
    .half .ramt{font-size:0.95rem}
    .half .r2{font-size:0.68rem}
  }
</style>
</head>
<body>

<div class="nav-bar"></div>

<div class="container">

  <div class="page-header" style="display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;padding:8px 0">
    <div class="page-title" style="white-space:nowrap;font-size:0.95rem">
      <i class="fas fa-scale-balanced"></i> تسوية المدفوعات <span class="highlight" id="branch-title"></span>
    </div>
    <div class="tabs-bar" style="margin:0;flex:0 0 auto">
      <button class="tab-btn active" data-tab="close" style="min-width:auto;padding:7px 12px;font-size:0.8rem"><i class="fas fa-lock"></i> إغلاق الشيفت</button>
      <button class="tab-btn" data-tab="history" style="min-width:auto;padding:7px 12px;font-size:0.8rem;${IS_ADMIN?'':'display:none'}"><i class="fas fa-clock-rotate-left"></i> الإغلاقات السابقة</button>
    </div>
    <div style="flex:1;min-width:8px"></div>
    <input class="form-input" id="close-cashier-top" style="width:auto;min-width:130px;max-width:180px;padding:6px 10px;font-size:0.8rem;flex-shrink:0" placeholder="اسم الكاشير">
    <select class="form-select" id="branch-select" style="width:auto;display:none;flex-shrink:0"></select>
    <button class="btn btn-primary btn-sm" id="btn-refresh" style="flex-shrink:0"><i class="fas fa-rotate"></i> تحديث</button>
  </div>

  <!-- ===== CLOSE TAB ===== -->
  <div class="tab-view active" id="tab-close">
    <div id="close-wrap"></div>
  </div>

  <!-- ===== HISTORY TAB ===== -->
  <div class="tab-view" id="tab-history">
    <div class="card">
      <div class="page-header" style="margin-bottom:14px">
        <div class="page-title" style="font-size:1rem"><i class="fas fa-clock-rotate-left"></i> سجل إغلاقات الشيفت</div>
        <button class="btn btn-primary btn-sm" id="hist-refresh"><i class="fas fa-rotate"></i> تحديث</button>
      </div>
      <div id="hist-body"></div>
    </div>
  </div>

</div>

<!-- ===== MODALS ===== -->
<div class="modal-bg" id="modal-add"><div class="modal-box">
  <h3><i class="fas fa-plus-circle" style="color:var(--accent-dark)"></i> إضافة معاملة مقابِلة</h3>
  <div class="mb">
    <p class="modal-hint" id="add-context" style="margin-bottom:6px"></p>
    <label class="modal-lbl">القيمة</label>
    <input class="form-input" id="add-amount" type="number" step="0.01">
    <div class="modal-hint">اتعبّت بقيمة الفاتورة. عدّلها لو العميل دفع زيادة أو أقل.</div>
    <label class="modal-lbl">المصدر / المحفظة</label>
    <select class="form-select" id="add-source">
      <option value="paymob">Paymob (فيزا/ماكينة)</option>
      <option value="orange">أورنج كاش</option>
      <option value="vodafone">فودافون كاش</option>
      <option value="instapay">إنستاباي</option>
      <option value="fawry">فوري</option>
      <option value="other">أخرى</option>
    </select>
    <label class="modal-lbl">ملاحظة (اختياري)</label>
    <input class="form-input" id="add-note" placeholder="سبب الإضافة اليدوية…">
  </div>
  <div class="mf">
    <button class="btn btn-sm" style="background:var(--surface-3)" onclick="closeModal('modal-add')">إلغاء</button>
    <button class="btn btn-primary btn-sm" id="add-confirm">إضافة وربط</button>
  </div>
</div></div>

<div class="modal-bg" id="modal-hide"><div class="modal-box">
  <h3><i class="fas fa-eye-slash" style="color:var(--danger)"></i> إخفاء معاملة</h3>
  <div class="mb">
    <p class="modal-hint" id="hide-context" style="margin-bottom:6px"></p>
    <label class="modal-lbl">سبب الإخفاء</label>
    <select class="form-select" id="hide-reason">
      <option value="cash_saved_visa">فاتورة فيزا وهي أصلاً كاش</option>
      <option value="api_duplicate">الـAPI كرّر المعاملة بالخطأ</option>
      <option value="test">معاملة تجريبية</option>
      <option value="other">سبب آخر</option>
    </select>
    <label class="modal-lbl">ملاحظة (اختياري)</label>
    <input class="form-input" id="hide-note">
  </div>
  <div class="mf">
    <button class="btn btn-sm" style="background:var(--surface-3)" onclick="closeModal('modal-hide')">إلغاء</button>
    <button class="btn btn-danger btn-sm" id="hide-confirm">إخفاء</button>
  </div>
</div></div>

<div class="modal-bg" id="modal-pull"><div class="modal-box">
  <h3><i class="fas fa-magnifying-glass" style="color:var(--accent-dark)"></i> استدعاء فاتورة برقمها</h3>
  <div class="mb">
    <p class="modal-hint" id="pull-context" style="margin-bottom:6px"></p>
    <label class="modal-lbl">رقم الفاتورة</label>
    <input class="form-input" id="pull-billno" placeholder="مثال: 1386021">
    <div class="modal-hint">المعاملة من الـAPI بلا فاتورة. اكتب رقم الفاتورة وهتتربط بيها. مش هيتعدّل على الفاتورة.</div>
    <div id="pull-result" style="margin-top:12px"></div>
  </div>
  <div class="mf">
    <button class="btn btn-sm" style="background:var(--surface-3)" onclick="closeModal('modal-pull')">إلغاء</button>
    <button class="btn btn-primary btn-sm" id="pull-confirm" disabled>ربط الفاتورة</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<!-- Modal تأكيد إضافة الفاتورة -->
<div id="bill-confirm-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100000;align-items:center;justify-content:center;">
  <div style="background:var(--surface-2,#1e293b);border:2px solid var(--border);border-radius:16px;padding:22px;width:92%;max-width:460px;direction:rtl;box-shadow:0 20px 60px rgba(0,0,0,0.6);max-height:88vh;overflow-y:auto;">
    <h3 style="margin:0 0 14px;font-size:1rem;display:flex;align-items:center;gap:8px;"><i class="fas fa-file-circle-check" style="color:var(--accent);"></i> تأكيد إضافة الفاتورة</h3>
    <div id="bill-confirm-body"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px;">
      <button class="btn btn-sm" style="background:var(--surface-3);color:var(--text-secondary);" onclick="closeBillConfirm()">إلغاء</button>
      <button class="btn btn-primary btn-sm" id="bill-confirm-add" onclick="confirmAddBill()"><i class="fas fa-plus"></i> إضافة</button>
    </div>
  </div>
</div>

.lk-msg{ font-size:0.75rem;padding:2px 8px;border-radius:20px;font-weight:600; }

.lk-msg.err{ background:#fee2e2;color:#b91c1c; }
.lk-msg.loading{ background:#e0f2fe;color:#0369a1; }

<script>
/* ============================================================
   تسوية المدفوعات + إغلاق الشيفت
   متكاملة مع api.js و nav.js و style.css
   ============================================================ */

/* ---- صلاحية + فرع المستخدم ---- */
const USER_ROLE   = (localStorage.getItem('userRole')   || '').trim();
const USER_BRANCH_RAW = (localStorage.getItem('userBranch') || '').trim();
const IS_ADMIN    = USER_ROLE === 'admin' || USER_ROLE === 'manager';

/* ---- خريطة أسماء الفروع القديمة → أسماء المناطق ----
   المستخدم ممكن يكون داخل باسم الفرع القديم (الصيدلية/ابراهيم حمدي 2/3)،
   لكن البيانات (wallet + sales_wallet) بقت بأسماء المناطق.
   هنا نترجم اسم الفرع القديم لاسم المنطقة قبل الفلترة. */
const BRANCH_ALIAS = {
  'الصيدلية'      : 'المعمورة',
  'ابراهيم حمدي 2': 'سان ستيفانو',
  'ابراهيم حمدي 3': 'سيدى بشر'
};
function resolveBranch(name){
  const n = (name || '').trim();
  return BRANCH_ALIAS[n] || n;   // لو مش في الخريطة، يرجّعه زي ما هو (يدعم اللي داخل باسم المنطقة أصلاً)
}
const USER_BRANCH = resolveBranch(USER_BRANCH_RAW);

/* الفرع الفعّال: الأدمن يختار، غير الأدمن مقفول على فرعه (بعد الترجمة) */
let ACTIVE_BRANCH = IS_ADMIN ? '' : USER_BRANCH;

/* ---- overlay محلي للتعديلات (إخفاء/إضافة/ربط) ---- */
const LS_OVERLAY = 'recon.overlay.v1';
const overlay = Object.assign(
  { hidden:{}, manual:[], matches:{}, pulls:{}, amends:{}, excluded:{} },
  JSON.parse(localStorage.getItem(LS_OVERLAY) || '{}')
);
function saveOverlay(){ localStorage.setItem(LS_OVERLAY, JSON.stringify(overlay)); }

let SYSTEM=[], WALLET=[], MACHINES=[], PAIRS=[], LINKS=[], CASH2WALLET=[];
let TERMINAL2STORE={}, MNAME2STORE={}, ALL_STORES=[];

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:NaN;};
const money=n=>isNaN(n)?'—':n.toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=s=>{if(!s)return'';const d=new Date(String(s).replace(' ','T'));return isNaN(d)?s:d.toLocaleString('ar-EG',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});};

let toastT=null;
function toast(msg,kind){const t=$('#toast');t.className='toast show '+(kind||'');t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function openModal(id){$('#'+id).classList.add('show');}
function closeModal(id){$('#'+id).classList.remove('show');}
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)m.classList.remove('show');}));

/* ============ machine maps ============ */
function mkey(s){
  return String(s||'').toLowerCase().replace(/\s+/g,'')
    .replace(/cash|كاش/g,'').replace(/orange|اورنج|أورنج|اورنچ/g,'orange')
    .replace(/vodafone|فودافون/g,'vodafone').replace(/etisalat|اتصالات/g,'etisalat')
    .replace(/instapay|انستاباي|إنستاباي|انستا/g,'instapay').replace(/fawry|فوري|فورى/g,'fawry')
    .replace(/[^a-z0-9]/g,'');
}
function buildMachineMaps(){
  TERMINAL2STORE={};MNAME2STORE={};const owners={};
  MACHINES.forEach(m=>{
    const store=m.store_name;if(!store)return;
    if(m.terminal_id)TERMINAL2STORE[String(m.terminal_id)]=store;
    const k=mkey(m.machine_name);if(k)(owners[k]=owners[k]||new Set()).add(store);
  });
  Object.entries(owners).forEach(([k,set])=>{if(set.size===1)MNAME2STORE[k]=[...set][0];});
}

/* ============ source detection ============
   البنية الجديدة: type=SALE => فيزا/Paymob. غير كده محفظة،
   ونوعها يتحدد من عمود to (اسم الماكينة/المحفظة). */
function walletSource(rec){
  const type=String(rec.type||'').trim().toUpperCase();
  if(type==='SALE'||rec.order_id||rec.terminal_id)return'paymob';
  const m=String(rec.to||'')+' '+String(rec.message||'')+' ';
  if(/اورنچ|أورنج|orange/i.test(m))return'orange';
  if(/فودافون|vodafone|vfcash/i.test(m))return'vodafone';
  if(/اتصالات|etisalat/i.test(m))return'etisalat';
  if(/انستا|instapay/i.test(m))return'instapay';
  if(/فوري|فورى|fawry/i.test(m))return'fawry';
  if(/wee|وي/i.test(m))return'wee';
  return'other';
}
const SRC_LABEL={paymob:'Paymob',orange:'أورنج كاش',vodafone:'فودافون كاش',etisalat:'اتصالات كاش',instapay:'إنستاباي',fawry:'فوري',wee:'wee',other:'محفظة'};
const SRC_ICON={paymob:'fa-mobile-screen-button',orange:'fa-wallet',vodafone:'fa-wallet',instapay:'fa-money-bill-transfer',fawry:'fa-store',etisalat:'fa-wallet',wee:'fa-wallet',other:'fa-wallet'};

/* توحيد رسم العربي للفرع: الياء/الألف المقصورة، التاء المربوطة، الألفات، والمسافات */
function normBranch(s){
  return String(s||'').trim()
    .replace(/\u0649/g,'\u064a')      // ى → ي
    .replace(/\u0629/g,'\u0647')      // ة → ه
    .replace(/[\u0623\u0625\u0622]/g,'\u0627') // أ إ آ → ا
    .replace(/\s+/g,' ');
}

/* ============ normalize ============ */
function normSystem(r){
  const store=(r.branch||r.store_name||'').trim();
  return{side:'system',id:'sys-'+(r.id??r.bill_no),raw:r,
    bill_no:String(r.bill_no??'').trim(),amount:num(r.net_ammount??r.total_bill_net??r.total_bill),
    date:r.bill_date||r.createdAt,store,storeKey:normBranch(store),who:r.employee_name||'',
    machine:r.machine_name||'',cust:r.cust_name_ar||'',
    closed:r.closed===true||r.closed==='true'||r.closed===1};
}
function normWallet(r){
  const src=walletSource(r);
  const store=(r.branch||'').trim();
  return{side:'wallet',id:'wal-'+(r.id??(r.order_id||Math.random())),raw:r,
    bill_no:String(r.bill_no??'').trim(),amount:num(r.ammount??r.amount),
    date:r.transaction_time||r.createdAt,src,srcLabel:SRC_LABEL[src],
    store,storeKey:normBranch(store),
    dir:String(r.type||'').trim(),
    ref:r.order_id||r.to||r.from||'',terminal:r.terminal_id||'',
    closed:r.closed===true||r.closed==='true'||r.closed===1,
    is_excess:r.is_excess===true||r.is_excess==='true'||r.is_excess===1};
}

/* ============ matching engine ============ */
function buildPairs(){
  const hidden=overlay.hidden;
  const sys=SYSTEM.filter(r=>!hidden[r.id]);
  const wal=WALLET.filter(r=>!hidden[r.id]);
  [...sys,...wal].forEach(r=>{if(overlay.amends[r.id]!=null)r.amount=overlay.amends[r.id];});

  const usedW=new Set(),usedS=new Set(),rows=[];
  const sysById=Object.fromEntries(sys.map(r=>[r.id,r]));
  const walById=Object.fromEntries(wal.map(r=>[r.id,r]));

  // الربط المتعدد: عن طريق LINKS — في اتجاهين (نتجاهل السطور المفكوكة/الفاضية)
  const activeLinks=LINKS.filter(l=>!(l.closed===true||l.closed==='true')&&String(l.bill_no||'').trim()!=='');
  const linksByWallet={};
  activeLinks.forEach(l=>{
    const wid=String(l.wallet_id||'');
    (linksByWallet[wid]=linksByWallet[wid]||[]).push(l);
  });

  // اتجاه 1: معاملة واحدة (MULTI) لها أكتر من سطر links (بفواتير متعددة)
  const handledLinkIds=new Set();
  for(const w of wal){
    if(usedW.has(w.id))continue;
    if(String(w.bill_no||'').toUpperCase()!=='MULTI')continue;
    const rawId=String((w.raw&&w.raw.id!=null)?w.raw.id:w.id);
    const myLinks=linksByWallet[rawId]||[];
    if(myLinks.length<=1)continue;   // واحد بس → يُعالَج في الاتجاه 2
    const billRecs=[];
    myLinks.forEach(l=>{
      handledLinkIds.add(l.id);
      const s=sys.find(x=>x.bill_no&&x.bill_no===String(l.bill_no)&&!usedS.has(x.id));
      if(s){usedS.add(s.id);billRecs.push(s);}
      else billRecs.push({bill_no:l.bill_no,amount:+l.amount||0,store:l.branch,_fromLink:true});
    });
    usedW.add(w.id);
    rows.push(makePair(null,w,'multi',{dir:'w2b',bills:billRecs}));
  }

  // اتجاه 2: فاتورة واحدة مربوطة بأكتر من معاملة (كل معاملة سطر links واحد، نفس bill_no)
  const remainingLinks=activeLinks.filter(l=>!handledLinkIds.has(l.id));
  const linksByBill={};
  remainingLinks.forEach(l=>{
    const bn=String(l.bill_no||'');
    (linksByBill[bn]=linksByBill[bn]||[]).push(l);
  });
  for(const bn of Object.keys(linksByBill)){
    const grp=linksByBill[bn];
    const walRecs=[];
    grp.forEach(l=>{
      const wid=String(l.wallet_id||'');
      const w=wal.find(x=>!usedW.has(x.id)&&String((x.raw&&x.raw.id!=null)?x.raw.id:x.id)===wid&&String(x.bill_no||'').toUpperCase()==='MULTI');
      if(w){usedW.add(w.id);walRecs.push(w);}
      else walRecs.push({srcLabel:'معاملة',amount:+l.amount||0,store:l.branch,_fromLink:true});
    });
    if(!walRecs.length)continue;
    let s=sys.find(x=>x.bill_no&&x.bill_no===bn&&!usedS.has(x.id));
    if(s)usedS.add(s.id);
    else s={id:'lnk-bill-'+bn,bill_no:bn,amount:walRecs.reduce((t,w)=>t+(+w.amount||0),0),store:walRecs[0]?.store||'',_fromLink:true};
    rows.push(makePair(s,null,'multi',{dir:'b2w',wallets:walRecs}));
  }

  for(const[sid,wid]of Object.entries(overlay.matches)){
    const s=sysById[sid],w=walById[wid];
    if(s&&w&&!usedS.has(sid)&&!usedW.has(wid)){usedS.add(sid);usedW.add(wid);rows.push(makePair(s,w,'manual'));}
  }
  for(const[wid,billno]of Object.entries(overlay.pulls)){
    const w=walById[wid];if(!w||usedW.has(wid))continue;
    const s=sys.find(x=>x.bill_no&&x.bill_no===String(billno)&&!usedS.has(x.id));
    if(s){usedS.add(s.id);usedW.add(wid);rows.push(makePair(s,w,'pulled'));}
    else{usedW.add(wid);rows.push(makePair(null,w,'pulled-missing',{billno}));}
  }
  const walByBill={};
  wal.forEach(w=>{if(w.bill_no&&!usedW.has(w.id))(walByBill[w.bill_no]=walByBill[w.bill_no]||[]).push(w);});
  for(const s of sys){
    if(usedS.has(s.id)||!s.bill_no)continue;
    const c=(walByBill[s.bill_no]||[]).filter(w=>!usedW.has(w.id));
    if(c.length){usedS.add(s.id);usedW.add(c[0].id);rows.push(makePair(s,c[0],'bill'));}
  }
  const walByAmt={};
  wal.forEach(w=>{if(!usedW.has(w.id)&&!overlay.excluded[w.id]&&!isNaN(w.amount)){const k=w.amount.toFixed(2);(walByAmt[k]=walByAmt[k]||[]).push(w);}});
  Object.values(walByAmt).forEach(a=>a.sort((x,y)=>new Date(x.date)-new Date(y.date)));
  const sysSorted=sys.filter(s=>!usedS.has(s.id)).sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const s of sysSorted){
    if(isNaN(s.amount))continue;
    const arr=walByAmt[s.amount.toFixed(2)];if(!arr||!arr.length)continue;
    let idx=arr.findIndex(w=>!usedW.has(w.id)&&w.storeKey&&s.storeKey&&w.storeKey===s.storeKey);
    if(idx<0)idx=arr.findIndex(w=>!usedW.has(w.id)&&!w.store);
    if(idx<0)continue;
    const w=arr.splice(idx,1)[0];usedS.add(s.id);usedW.add(w.id);rows.push(makePair(s,w,'amount'));
  }
  sys.forEach(s=>{if(!usedS.has(s.id))rows.push(makePair(s,null,'sys-only'));});
  wal.forEach(w=>{if(!usedW.has(w.id))rows.push(makePair(null,w,'wal-only'));});

  const sev=r=>({'sys-only':0,'wal-only':0,'pulled-missing':0,diff:1,manual:2,pulled:2,multi:2,bill:3,amount:3}[r.kind]??3);
  rows.sort((a,b)=>{const s=sev(a)-sev(b);if(s)return s;return new Date(b.sys?.date||b.wal?.date||0)-new Date(a.sys?.date||a.wal?.date||0);});
  PAIRS=rows;
}
function makePair(s,w,kind,extra={}){
  if(kind==='multi')return{sys:s||null,wal:w||null,kind:'multi',...extra};
  if(s&&w){
    const diff=!isNaN(s.amount)&&!isNaN(w.amount)?+(s.amount-w.amount).toFixed(2):0;
    // عند الفرق الحقيقي: 'diff' دايماً. عند التطابق التام: نحافظ على التصنيف الأصلي (manual/bill/amount/pulled)
    let status=Math.abs(diff)>=0.01?'diff':kind;
    return{sys:s,wal:w,kind:status,diff,...extra};
  }
  if(s)return{sys:s,wal:null,kind:'sys-only',...extra};
  return{sys:null,wal:w,kind:(kind==='pulled-missing'?'pulled-missing':'wal-only'),...extra};
}

/* خانة كاملة التفاصيل لعنصر واحد جوّه مجموعة ربط متعدد (مقابلة بصرياً للأنكر) */
function multiItemHalf(rec,col){
  const half=document.createElement('div');half.className='half multi-item '+(col==='system'?'sys':'wal');
  const body=document.createElement('div');body.className='rbody';
  const r1=document.createElement('div');r1.className='r1';
  const amt=document.createElement('span');amt.className='ramt mono';amt.textContent=money(+rec.amount||0)+' ج';r1.appendChild(amt);
  if(col==='system'){
    r1.appendChild(billChip('فاتورة '+(rec.bill_no||'—')));
  }else{
    r1.appendChild(srcChip(rec.src||'other',rec.srcLabel||'معاملة'));
    if(rec.bill_no&&rec.bill_no!=='MULTI')r1.appendChild(billChip('فاتورة '+rec.bill_no));
  }
  body.appendChild(r1);
  const r2=document.createElement('div');r2.className='r2';
  if(rec.store)r2.appendChild(elSpan('🏥 '+rec.store));
  if(rec.who)r2.appendChild(elSpan('👤 '+rec.who));
  if(rec.ref)r2.appendChild(elSpan('#'+rec.ref));
  if(rec.date)r2.appendChild(elSpan('🕐 '+fmtDate(rec.date)));
  if(rec._fromLink)r2.appendChild(elSpan('⚠ بيانات من الربط'));
  body.appendChild(r2);
  half.appendChild(body);
  return half;
}

/* ============ render recon ============ */
let FILTER={status:'all',q:''};
function passFilter(p){
  if(FILTER.status==='issues'&&['matched','bill','amount','multi'].includes(p.kind))return false;
  if(FILTER.status==='matched'&&!['matched','manual','bill','amount','pulled','multi'].includes(p.kind))return false;
  if(ACTIVE_BRANCH){
    const ak=normBranch(ACTIVE_BRANCH);
    const inS=(p.sys?.storeKey||'')===ak,inW=(p.wal?.storeKey||'')===ak;
    if(!inS&&!inW)return false;
  }
  if(FILTER.q){
    const q=FILTER.q.toLowerCase();
    const hay=[p.sys?.bill_no,p.sys?.who,p.sys?.store,p.wal?.ref,p.wal?.srcLabel,
      p.sys&&!isNaN(p.sys.amount)?p.sys.amount:'',p.wal&&!isNaN(p.wal.amount)?p.wal.amount:''].join(' ').toLowerCase();
    if(!hay.includes(q))return false;
  }
  return true;
}
function render(){
  if(!$('#recon-rows'))return;   // تبويب التسوية أُلغي — الدالة محفوظة بدون تأثير
  buildPairs();
  const tb=$('#recon-rows');tb.innerHTML='';
  let cM=0,cD=0,cUs=0,cUw=0;
  PAIRS.filter(passFilter).forEach(p=>{
    const pair=document.createElement('div');pair.className='pair';
    if(['matched','bill','amount'].includes(p.kind))pair.classList.add('matched');
    else if(p.kind==='diff')pair.classList.add('diff');
    else if(p.kind==='manual'||p.kind==='pulled')pair.classList.add('manual');
    else if(p.kind==='multi'){pair.classList.add('manual');pair.classList.add('pair-multi');}
    // وضع الربط: تعتيم الصفوف غير ذات الصلة بالأنكر/المرشّحين
    if(LINK){
      const isAnchorRow=(LINK.anchorSide==='wallet'&&p.wal&&p.wal.id===LINK.anchor.id)||(LINK.anchorSide==='system'&&p.sys&&p.sys.id===LINK.anchor.id);
      const isCandidateRow=LINK.anchorSide==='wallet'?p.kind==='sys-only':p.kind==='wal-only';
      if(!isAnchorRow&&!isCandidateRow)pair.classList.add('link-dim');
    }
    // status badge once, on the pair (top-end corner)
    const[bc,bt]=statusInfo(p.kind);
    if(bt){const st=document.createElement('span');st.className='rstatus badge '+bc;st.textContent=bt;pair.appendChild(st);}
    if(p.kind==='multi'){
      const anchorSide=p.dir==='b2w'?'system':'wallet';
      const manySide=p.dir==='b2w'?'wallet':'system';
      const items=p.dir==='b2w'?(p.wallets||[]):(p.bills||[]);
      const n=Math.max(items.length,1);
      const anchorHalf=halfEl(p,anchorSide);
      anchorHalf.style.gridColumn=anchorSide==='system'?'1':'2';
      anchorHalf.style.gridRow=`1 / ${n+1}`;
      anchorHalf.classList.add('multi-anchor');
      pair.appendChild(anchorHalf);
      items.forEach((it,i)=>{
        const mh=multiItemHalf(it,manySide);
        mh.style.gridColumn=manySide==='system'?'1':'2';
        mh.style.gridRow=String(i+1);
        if(i>0)mh.classList.add('multi-sep');
        pair.appendChild(mh);
      });
    }else{
      pair.appendChild(halfEl(p,'system'));
      pair.appendChild(halfEl(p,'wallet'));
    }
    tb.appendChild(pair);
  });
  PAIRS.forEach(p=>{
    if(['matched','manual','bill','amount','pulled','multi'].includes(p.kind))cM++;
    else if(p.kind==='diff')cD++;
    else if(p.kind==='sys-only')cUs++;
    else if(p.kind==='wal-only'||p.kind==='pulled-missing')cUw++;
  });
  $('#s-matched').textContent=cM;$('#s-diff').textContent=cD;$('#s-unsys').textContent=cUs;$('#s-unwal').textContent=cUw;
  const ak=ACTIVE_BRANCH?normBranch(ACTIVE_BRANCH):'';
  const sysN=SYSTEM.filter(s=>!ak||s.storeKey===ak).length;
  const walN=WALLET.filter(w=>!ak||w.storeKey===ak).length;
  $('#c-system').textContent=sysN+' فاتورة';$('#c-wallet').textContent=walN+' معاملة';
  if($('#show-hidden').checked)renderHidden();
  renderLinkBar();
}
function elSpan(t){const s=document.createElement('span');s.textContent=t;return s;}
function srcChip(src,label){const s=document.createElement('span');s.className='src-chip src-'+src;s.innerHTML='<i class="fas '+SRC_ICON[src]+'"></i> '+label;return s;}
function billChip(t){const s=document.createElement('span');s.className='bill-chip';s.textContent=t;return s;}

function statusInfo(kind){
  return{matched:['badge-green','مطابَقة'],manual:['badge-blue','ربط يدوي'],bill:['badge-green','رقم الفاتورة'],
    amount:['badge-green','بالقيمة'],pulled:['badge-blue','فاتورة مستدعاة'],diff:['badge-yellow','فرق قيمة'],
    multi:['badge-blue','ربط متعدد'],
    'sys-only':['badge-red','بلا دفع'],'wal-only':['badge-red','بلا فاتورة'],'pulled-missing':['badge-red','فاتورة غير موجودة']}[kind]||['badge-gray',''];
}
function ibtn(cls,icon,title,fn){const b=document.createElement('button');b.className='ibtn '+cls;b.title=title;b.innerHTML='<i class="fas '+icon+'"></i>';b.onclick=e=>{e.stopPropagation();fn();};return b;}

/* بناء نص واحد (يمين=system / يسار=wallet) داخل صف الزوج */
function halfEl(p,col){
  const rec=col==='system'?p.sys:p.wal;
  const half=document.createElement('div');half.className='half '+(col==='system'?'sys':'wal');

  if(!rec){
    half.classList.add('empty');
    if(col==='wallet'){
      const b=document.createElement('button');b.className='add-here';
      b.innerHTML='<i class="fas fa-plus"></i> إضافة معاملة دفع';b.onclick=()=>openAdd(p.sys);
      half.appendChild(elSpan('لا توجد معاملة دفع'));half.appendChild(b);
    }else{
      const b=document.createElement('button');b.className='add-here';
      b.innerHTML='<i class="fas fa-magnifying-glass"></i> استدعاء فاتورة';b.onclick=()=>lookupBillFromRow(p.billno);
      half.appendChild(elSpan(p.billno?('فاتورة '+p.billno+' غير موجودة'):'لا توجد فاتورة'));half.appendChild(b);
    }
    return half;
  }

  const body=document.createElement('div');body.className='rbody';
  const r1=document.createElement('div');r1.className='r1';
  const amt=document.createElement('span');amt.className='ramt mono';amt.textContent=money(rec.amount)+' ج';r1.appendChild(amt);
  if(col==='system'){
    r1.appendChild(billChip('فاتورة '+(rec.bill_no||'—')));
  }else{
    r1.appendChild(srcChip(rec.src,rec.srcLabel));
    if(rec.bill_no)r1.appendChild(billChip('فاتورة '+rec.bill_no));
  }
  body.appendChild(r1);

  const r2=document.createElement('div');r2.className='r2';
  if(col==='system'){
    if(rec.store)r2.appendChild(elSpan('🏥 '+rec.store));
    if(rec.who)r2.appendChild(elSpan('👤 '+rec.who));
    if(rec.date)r2.appendChild(elSpan('🕐 '+fmtDate(rec.date)));
    if(p.kind==='diff'&&p.diff){const d=document.createElement('span');d.style.cssText='font-weight:700;color:'+(p.diff>0?'#b91c1c':'#15803d');d.textContent=(p.diff>0?'دفع أقل بـ ':'دفع زيادة بـ ')+money(Math.abs(p.diff))+' ج';r2.appendChild(d);}
  }else{
    if(rec.store)r2.appendChild(elSpan('🏥 '+rec.store));else r2.appendChild(elSpan('🏥 فرع غير محدد'));
    if(rec.ref)r2.appendChild(elSpan('#'+rec.ref));
    if(rec.date)r2.appendChild(elSpan('🕐 '+fmtDate(rec.date)));
    if(overlay.amends[rec.id]!=null)r2.appendChild(elSpan('✏ معدّلة'));
  }
  body.appendChild(r2);
  half.appendChild(body);

  const acts=document.createElement('div');acts.className='ractions';
  acts.appendChild(ibtn('danger','fa-eye-slash','إخفاء',()=>openHide(rec)));
  if(rec.id.startsWith('man-'))acts.appendChild(ibtn('','fa-pen','تعديل القيمة',()=>editAmount(rec)));
  if((p.kind==='manual'||p.kind==='pulled'))acts.appendChild(ibtn('','fa-link-slash','فك الربط',()=>unlink(p)));
  if(p.kind==='bill')acts.appendChild(ibtn('','fa-link-slash','فك الربط',()=>unlinkBillMatch(p)));
  if(p.kind==='amount')acts.appendChild(ibtn('','fa-link-slash','فك الربط',()=>excludeAutoMatch(p)));
  if(p.kind==='multi'&&p.dir!=='b2w'&&col==='wallet')acts.appendChild(ibtn('','fa-link-slash','فك الربط المتعدد',()=>unlinkMulti(p.wal)));
  if(p.kind==='multi'&&p.dir==='b2w'&&col==='system')acts.appendChild(ibtn('','fa-link-slash','فك الربط المتعدد',()=>unlinkMultiBill(p)));
  if(!LINK&&p.kind==='sys-only'&&col==='system')acts.appendChild(ibtn('go','fa-link','ربط',()=>startLink(p.sys,'system')));
  if(!LINK&&(p.kind==='wal-only'||p.kind==='diff')&&col==='wallet')acts.appendChild(ibtn('go','fa-link','ربط',()=>startLink(p.wal,'wallet')));
  half.appendChild(acts);

  /* ====== وضع الربط الموحّد (واحد لواحد + متعدد) ====== */
  if(LINK){
    const isAnchor=col===LINK.anchorSide&&LINK.anchor.id===rec.id;
    const isCandidateRow=LINK.anchorSide==='wallet'?p.kind==='sys-only':p.kind==='wal-only';
    if(isAnchor){
      half.classList.add('link-anchor');
      if(LINK_PICKS.size){
        const grow=document.createElement('div');
        grow.style.cssText='display:flex;flex-direction:column;gap:2px;margin-top:5px;padding-top:5px;border-top:1px dashed #86efac;';
        [...LINK_PICKS.values()].forEach(pk=>{
          const row=document.createElement('div');
          row.style.cssText='font-size:0.72rem;color:#15803d;display:flex;justify-content:space-between;gap:8px;';
          row.innerHTML=`<span><span class="link-pick-badge"><i class="fas fa-check"></i></span>${LINK.anchorSide==='wallet'?('فاتورة '+(pk.bill_no||'—')):(pk.srcLabel||'معاملة')}</span><b>${money(pk.amount)} ج</b>`;
          grow.appendChild(row);
        });
        half.appendChild(grow);
      }
    }else if(col!==LINK.anchorSide&&isCandidateRow){
      const picked=LINK_PICKS.has(rec.id);
      half.classList.add(picked?'link-picked':'link-pickable');
      half.addEventListener('click',e=>{ if(e.target.closest('button'))return; toggleLinkPick(rec); });
      if(picked){
        const bd=document.createElement('span');bd.className='link-pick-badge';bd.innerHTML='<i class="fas fa-check"></i>';
        half.querySelector('.r1')?.prepend(bd);
      }
    }
  }

  return half;
}

/* ============ الربط الموحّد البصري (واحد لواحد + متعدد) ============ */
let LINK=null;          // { anchorSide:'wallet'|'system', anchor:record }
let LINK_PICKS=new Map(); // id -> record (المختارين من الناحية التانية)

function startLink(rec,side){
  LINK={anchorSide:side,anchor:rec};
  LINK_PICKS=new Map();
  render();
  toast(side==='wallet'?'اختَر الفاتورة (أو الفواتير) المرتبطة':'اختَر المعاملة المرتبطة','ok');
}
function cancelLink(){ LINK=null; LINK_PICKS=new Map(); render(); }

function toggleLinkPick(rec){
  if(!LINK)return;
  if(LINK_PICKS.has(rec.id)){ LINK_PICKS.delete(rec.id); render(); return; }
  LINK_PICKS.set(rec.id,rec);
  render();
}

async function confirmLink(){
  if(!LINK)return;
  const picks=[...LINK_PICKS.values()];
  if(!picks.length){ toast('اختَر عنصر واحد على الأقل','err'); return; }

  const btn=$('#lb-confirm'); if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';}

  try{
    if(picks.length===1){
      const pick=picks[0];
      const sysRec=LINK.anchorSide==='wallet'?pick:LINK.anchor;
      const walRec=LINK.anchorSide==='wallet'?LINK.anchor:pick;
      const diff=+((sysRec.amount||0)-(walRec.amount||0)).toFixed(2);
      if(Math.abs(diff)>=0.01&&!confirm(`القيمتين مختلفتين بفرق ${money(Math.abs(diff))} ج. تأكيد الربط بالرغم من الفرق؟`)){
        if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> تأكيد الربط';} return;
      }
      const walId=(walRec.raw&&walRec.raw.id!=null)?walRec.raw.id:walRec.id;
      await posUpdate({table:'wallet',action:'update',id:walId,data:{bill_no:String(sysRec.bill_no||'')}});
      delete overlay.excluded[walRec.id]; saveOverlay();
    }else{
      const branch=LINK.anchor.store||'';
      const now=new Date().toISOString();
      const anchorAmt=+(LINK.anchor.amount||0).toFixed(2);
      const pickSum=+(picks.reduce((s,r)=>s+(+r.amount||0),0)).toFixed(2);
      const diff=+(anchorAmt-pickSum).toFixed(2);
      if(Math.abs(diff)>=0.01&&!confirm(`مجموع المختار (${money(pickSum)}) مختلف عن القيمة (${money(anchorAmt)}) بفرق ${money(Math.abs(diff))} ج.\n\nتأكيد الربط بالرغم من الفرق؟`)){
        if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> تأكيد الربط';} return;
      }
      if(LINK.anchorSide==='wallet'){
        // معاملة واحدة بفواتير متعددة
        const wal=LINK.anchor;
        const walId=(wal.raw&&wal.raw.id!=null)?wal.raw.id:wal.id;
        for(const b of picks){
          await posUpdate({table:'links',action:'insert',data:{
            wallet_id:String(walId),bill_no:String(b.bill_no||''),branch,amount:String(b.amount||''),created_at:now,closed:false
          }});
        }
        await posUpdate({table:'wallet',action:'update',id:walId,data:{bill_no:'MULTI'}});
      }else{
        // فاتورة واحدة بمعاملات متعددة
        const bill=LINK.anchor;
        for(const w of picks){
          const wId=(w.raw&&w.raw.id!=null)?w.raw.id:w.id;
          await posUpdate({table:'links',action:'insert',data:{
            wallet_id:String(wId),bill_no:String(bill.bill_no||''),branch,amount:String(w.amount||''),created_at:now,closed:false
          }});
          await posUpdate({table:'wallet',action:'update',id:wId,data:{bill_no:'MULTI'}});
        }
      }
    }
    cancelLink();
    toast('تم الربط','ok');
    await loadData();
  }catch(e){
    toast('فشل حفظ الربط','err');
    if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> تأكيد الربط';}
  }
}

async function unlinkMultiBill(p){
  if(!confirm('فك الربط المتعدد؟ هيتشال الربط وترجع المعاملات غير مربوطة.'))return;

      for(const l of myLinks){
        if(l.id!=null) await posUpdate({table:'links',action:'update',id:l.id,data:{wallet_id:rawId,bill_no:'',branch:l.branch||'',amount:'0',created_at:l.created_at||'',closed:true}});
      }
      await posUpdate({table:'wallet',action:'update',id:walId,data:{bill_no:''}});
    }
    toast('تم فك الربط المتعدد','ok');

  }catch(e){ toast('فشل فك الربط','err'); }
}

const DENOMS=[200,100,50,20,10,5,1];
const LS_DRAFT='recon.closedraft.v1';
let closeDraft=JSON.parse(localStorage.getItem(LS_DRAFT)||'{}');
function saveDraft(){localStorage.setItem(LS_DRAFT,JSON.stringify(closeDraft));}

function branchWalletTotals(branch){
  const bk=branch?normBranch(branch):'';
  const rows=WALLET.filter(w=>!overlay.hidden[w.id]).filter(w=>bk?(w.storeKey===bk):true);
  const g={};
  rows.forEach(w=>{const k=w.terminal?(w.srcLabel+' · '+w.terminal):w.srcLabel;if(!g[k])g[k]={label:k,src:w.src,count:0,total:0};g[k].count++;if(!isNaN(w.amount))g[k].total+=w.amount;});
  return Object.values(g).sort((a,b)=>b.total-a.total);
}

/* فواتير كاش بالغلط تتحوّل لمحفظة — المعلّقة (غير المصروفة) لفرع معيّن */
function cashToWalletForBranch(branch){
  const bk=branch?normBranch(branch):'';
  return CASH2WALLET.filter(r=>!r.disbursed && (!bk || normBranch(r.branch)===bk));
}

/* أسباب اختلاف قيمة الفاتورة عن قيمة إيصال الدفع/التحويل، وتأثير كل سبب على إجمالي التقفيل.
   mode='invoice' → التأثير = قيمة الفاتورة (الفاتورة هي اللي اتحفظت كاش في نقطة البيع، بغض النظر عن قيمة الإيصال الفعلية).
   mode='diff' → التأثير = قيمة الإيصال − قيمة الفاتورة (الفرق بينهم، يطلع +/− تلقائياً حسب الحالة).
   mode='none' → بدون أي تأثير، للعلم بس. */
const C2W_REASONS={
  cash_as_visa:    {label:'تم الحفظ كاش عن طريق الخطأ', mode:'receipt'},
  driver_fee:      {label:'فرق لصالح الطيار (خدمة توصيل)', mode:'diff'},
  partial_cash:    {label:'جزء كاش وجزء فيزا', mode:'diff'},
  return_new:      {label:'مرتجع + فاتورة جديدة أعلى', mode:'diff'},
  customer_account:{label:'فرق لحساب العميل (دفع زيادة، له رصيد)', mode:'diff'},
  transfer_fee:    {label:'ضريبة/رسوم تحويل', mode:'none'}
};
function c2wEffect(r){
const cfg=C2W_REASONS[r.reason]||C2W_REASONS.cash_as_visa;
if(cfg.mode==='invoice') return r.invoice_amount||0;
if(cfg.mode==='receipt') return r.transaction_value||0;
if(cfg.mode==='diff') return (r.transaction_value||0)-(r.invoice_amount||0);
  return 0;
}

function renderDenoms(){
  const el=$('#denoms');el.innerHTML='';
  DENOMS.forEach(d=>{
    const coin=d<1,row=document.createElement('div');row.className='denom-row';
    const c=closeDraft.counts[d]??'';
    row.innerHTML='<div class="denom-face '+(coin?'coin':'note')+'">'+(d>=1?d:d.toFixed(2))+' ج</div><input class="table-input" type="number" min="0" inputmode="numeric" data-d="'+d+'" value="'+c+'" placeholder="العدد" style="text-align:center"><div class="denom-sub zero mono" data-sub="'+d+'">0.00</div>';
    el.appendChild(row);
  });
  // صف العهدة مع الطيارين — بنفس شكل وحجم فئات النقدية، بس قيمة مباشرة بدل عدد×فئة
  const custRow=document.createElement('div');custRow.className='denom-row';
  custRow.innerHTML='<div class="denom-face" style="background:#ffedd5;color:#c2410c;">عهدة</div><input class="table-input mono" id="custody-total" type="number" step="0.01" value="'+(closeDraft.custodyTotal||'')+'" placeholder="0.00" style="text-align:center"><div class="denom-sub zero mono" id="custody-sub">0.00</div>';
  el.appendChild(custRow);

  el.querySelectorAll('input[data-d]').forEach(inp=>{
    const upd=()=>{const d=parseFloat(inp.dataset.d),c=parseInt(inp.value)||0;closeDraft.counts[d]=inp.value===''?'':c;saveDraft();const sub=el.querySelector('[data-sub="'+d+'"]');sub.textContent=money(d*c);sub.classList.toggle('zero',!(d*c));recalc();};
    inp.addEventListener('input',upd);
    const d=parseFloat(inp.dataset.d),c=parseInt(inp.value)||0,sub=el.querySelector('[data-sub="'+d+'"]');sub.textContent=money(d*c);sub.classList.toggle('zero',!(d*c));
  });
  const custInp=$('#custody-total'),custSub=$('#custody-sub');
  const updCust=()=>{const v=parseFloat(custInp.value)||0;closeDraft.custodyTotal=custInp.value===''?'':v;saveDraft();custSub.textContent=money(v);custSub.classList.toggle('zero',!v);recalc();};
  custInp.addEventListener('input',updCust);
  custSub.textContent=money(parseFloat(custInp.value)||0);custSub.classList.toggle('zero',!parseFloat(custInp.value));
}
function recalc(){
  let cash=0;DENOMS.forEach(d=>cash+=d*(parseInt(closeDraft.counts[d])||0));
  const cust=parseFloat(closeDraft.custodyTotal)||0;
  const c2wSum=cashToWalletForBranch(ACTIVE_BRANCH).reduce((s,r)=>s+c2wEffect(r),0);
  const set=(id,v)=>{const e=$(id);if(e)e.textContent=v;};
  set('#cash-h',money(cash)+' ج');set('#cust-h',money(cust)+' ج');set('#c2w-h',money(c2wSum)+' ج');
  set('#g-cash',money(cash));set('#g-cust',money(cust));set('#g-auto',money(c2wSum));set('#g-total',money(cash+cust+c2wSum));
}
async function saveClose(branch,c2wSum){
  let cash=0;DENOMS.forEach(d=>cash+=d*(parseInt(closeDraft.counts[d])||0));
  const custSum=parseFloat(closeDraft.custodyTotal)||0;
  const cashier=($('#close-cashier-top')?.value||'').trim();
  if(cash===0&&c2wSum===0&&custSum===0){if(!confirm('كل المبالغ صفر. تأكيد إغلاق شيفت فاضي؟'))return;}

  const record={
    branch,cashier,closed_at:new Date().toISOString(),
    cash_breakdown:JSON.stringify(Object.fromEntries(DENOMS.map(d=>[d,parseInt(closeDraft.counts[d])||0]).filter(x=>x[1]))),
    cash_total:+cash.toFixed(2),custody_total:+custSum.toFixed(2),
    wallet_total:+c2wSum.toFixed(2),grand_total:+(cash+custSum+c2wSum).toFixed(2),
    notes:closeDraft.notes||''
  };

  $('#btn-save-close').disabled=true;
  let ok=false;
  try{
    const res=await posUpdate({table:'shift_closes',action:'insert',data:record});
    ok=!!(res&&(res.ok||res.id||res.insertedId||Array.isArray(res)));
  }catch(e){console.warn('shift close save failed:',e);}

  const local=JSON.parse(localStorage.getItem('recon.closes.v1')||'[]');
  local.unshift({...record,id:'local-'+Date.now(),_local:true,_synced:ok});
  localStorage.setItem('recon.closes.v1',JSON.stringify(local));

  saveOverlay();
  closeDraft={counts:{},custodyTotal:'',notes:'',cashier:''};saveDraft();
  $('#btn-save-close').disabled=false;
  toast(ok?'تم حفظ الإغلاق وترحيل الشيفت':'تم الحفظ محلياً (n8n غير موصّل)',ok?'ok':'bad');
  render();buildCloseView();
}

const POSMGMT_URL = 'https://agent.ebrahimhamdy.com/webhook/posmanagement';
const POSUPDATE_URL = 'https://agent.ebrahimhamdy.com/webhook/posupdate';

/* نداء موحّد لـ posupdate (إضافة/تعديل/بحث) */
async function posUpdate(payload){
  const r = await fetch(POSUPDATE_URL,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  const t = await r.text();
  let d = t && t.trim() ? JSON.parse(t) : {};
  if(Array.isArray(d)) d = d[0] || {};
  return d;
}

/* بحث مشترك: يستخدمه الشريط فوق وزر الاستدعاء داخل الصف */
async function doBillLookup(billNo,branch,uiBtn,uiMsg){
  if(uiBtn){ uiBtn.disabled=true; uiBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i>'; }
  if(uiMsg){ uiMsg.textContent='جاري البحث…'; uiMsg.className='lk-msg loading'; }
  try{
    const res = await posUpdate({ table:'lookup', action:'search', data:{ branch, bill_no:billNo } });
    const data = res?.result?.Data || [];
    if(!data.length){
      if(uiMsg){ uiMsg.textContent='الفاتورة مش موجودة في السيستم'; uiMsg.className='lk-msg err'; }
      else toast('الفاتورة رقم '+billNo+' مش موجودة في السيستم','err');
    } else {
      showBillConfirm(data[0], branch);
      if(uiMsg){ uiMsg.textContent=''; uiMsg.className='lk-msg'; }
    }
  }catch(e){
    if(uiMsg){ uiMsg.textContent='خطأ في الاتصال'; uiMsg.className='lk-msg err'; }
    else toast('خطأ في الاتصال','err');
  }
  if(uiBtn){ uiBtn.disabled=false; uiBtn.innerHTML='<i class="fas fa-search"></i> استدعاء'; }
}

async function lookupBill(){
  const inp = $('#lookup-bill-input');

  if(!billNo){ if(msg){msg.textContent='اكتب رقم الفاتورة'; msg.className='lk-msg err';} return; }

  if(!branch){ if(msg){msg.textContent='اختر الفرع أولاً'; msg.className='lk-msg err';} return; }

  const btn = $('#lookup-bill-btn');
  await doBillLookup(billNo,branch,btn,msg);
}

      <select id="c2w-reason-select" class="form-select" style="width:auto;font-size:0.78rem;padding:5px 8px;">${reasonOptions}</select>
      <label style="font-weight:700;">قيمة إيصال الدفع أو التحويل:</label>
      <input id="c2w-value-input" class="table-input mono" type="number" step="0.01" value="${net}" style="width:90px;text-align:center;">
      <button class="btn btn-success btn-sm" id="c2w-confirm-btn"><i class="fas fa-plus"></i> إضافة</button>
      <button class="btn btn-sm" style="background:var(--surface-3)" onclick="cancelC2WPreview()">إلغاء</button>
    </div>
    <div class="modal-hint" style="margin-bottom:6px;">اكتب قيمة الإيصال الفعلية اللي معاك (مش الفرق) — النظام بيحسب الفرق مع الفاتورة تلقائياً حسب السبب المختار. (في حالة «تم الحفظ كاش عن طريق الخطأ» تحديداً، المتحسوب هو قيمة الفاتورة نفسها، لأنها اللي اتحفظت في الدرج فعلياً).</div>
    <div id="c2w-action-msg"></div>`;
  $('#c2w-confirm-btn').onclick=confirmAddC2W;
  const reasonSel=$('#c2w-reason-select'), valInp=$('#c2w-value-input');
  const updMsg=()=>{
    const reasonKey=reasonSel.value;
    const val=parseFloat(valInp.value)||0;
    const msgEl=$('#c2w-action-msg');
    const diff=val-net;
    const absDiff=Math.abs(diff);
    const hasDiff=absDiff>0.01;

    if(reasonKey==='cash_as_visa'){
      if(hasDiff){
        const diffReasons=Object.entries(C2W_REASONS)
          .filter(([k])=>k!=='cash_as_visa')
          .map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
        msgEl.innerHTML=`
          <div style="background:#fef2f2;border:2px solid #ef4444;border-radius:10px;padding:12px 14px;margin-top:4px;">
            <div style="display:flex;align-items:center;gap:8px;font-weight:800;color:#b91c1c;font-size:0.88rem;margin-bottom:10px;">
              <i class="fas fa-triangle-exclamation" style="font-size:1rem;"></i>
              فيه فرق بين الإيصال والفاتورة (<span style="background:#fee2e2;padding:1px 8px;border-radius:6px;">${money(absDiff)} ج</span>) — اختار سبب الفرق وهيتضاف تلقائياً:
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <label style="font-weight:700;color:#b91c1c;font-size:0.82rem;white-space:nowrap;"><i class="fas fa-list-check"></i> سبب الفرق:</label>
              <select id="c2w-diff-reason" class="form-select" style="font-size:0.78rem;padding:5px 8px;border-color:#ef4444;flex:1;min-width:180px;">${diffReasons}</select>
            </div>
            <div id="c2w-diff-action" style="margin-top:8px;font-size:0.8rem;font-weight:700;color:#92400e;"></div>
          </div>`;
        const diffSel=$('#c2w-diff-reason');
        const updDiffMsg=()=>{
          const dk=diffSel.value; const dEl=$('#c2w-diff-action'); if(!dEl)return;
          if(dk==='driver_fee')
            dEl.innerHTML='<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 10px;"><i class="fas fa-motorcycle"></i> برجاء إعطاء الطيار '+money(absDiff)+' ج من نقطة البيع دون أي صرف.</div>';
          else if(dk==='customer_account')
            dEl.innerHTML='<div style="background:#eff6ff;border:1px solid #93c5fd;border-radius:8px;padding:6px 10px;"><i class="fas fa-user-plus"></i> برجاء توريد '+money(absDiff)+' ج من العميل إلى نقطة البيع.</div>';
          else if(dk==='partial_cash')
            dEl.innerHTML='<div style="background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:6px 10px;"><i class="fas fa-circle-info"></i> سيُخصم '+money(absDiff)+' ج من إجمالي النقدية بالدرج.</div>';
          else if(dk==='return_new')
            dEl.innerHTML='<div style="background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:6px 10px;"><i class="fas fa-rotate-left"></i> سيُخصم '+money(absDiff)+' ج من إجمالي النقدية بالدرج (مرتجع + فاتورة جديدة).</div>';
          else if(dk==='transfer_fee')
            dEl.innerHTML='<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;color:#64748b;"><i class="fas fa-info-circle"></i> رسوم تحويل — لا تأثير على الإجمالي.</div>';
          else dEl.innerHTML='';
        };
        diffSel.addEventListener('change',updDiffMsg); updDiffMsg();
      }else{
        msgEl.innerHTML='<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 12px;font-size:0.8rem;color:#15803d;font-weight:700;"><i class="fas fa-circle-check"></i> قيمة الإيصال مطابقة للفاتورة — لا يوجد فرق.</div>';
      }
    }else if(reasonKey==='driver_fee'){
      msgEl.innerHTML=`<div style="background:#fffbeb;border:2px solid #f59e0b;border-radius:10px;padding:10px 14px;font-size:0.82rem;font-weight:700;color:#92400e;display:flex;align-items:center;gap:8px;"><i class="fas fa-motorcycle" style="font-size:1rem;"></i> برجاء إعطاء الطيار <span style="background:#fef3c7;padding:1px 8px;border-radius:6px;font-size:0.9rem;">${money(absDiff)} ج</span> من نقطة البيع دون أي صرف.</div>`;
    }else if(reasonKey==='customer_account'){
      msgEl.innerHTML=`<div style="background:#eff6ff;border:2px solid #93c5fd;border-radius:10px;padding:10px 14px;font-size:0.82rem;font-weight:700;color:#1d4ed8;display:flex;align-items:center;gap:8px;"><i class="fas fa-user-plus" style="font-size:1rem;"></i> برجاء توريد <span style="background:#dbeafe;padding:1px 8px;border-radius:6px;font-size:0.9rem;">${money(absDiff)} ج</span> من العميل إلى نقطة البيع.</div>`;
    }else if(reasonKey==='partial_cash'||reasonKey==='return_new'){
      if(hasDiff) msgEl.innerHTML=`<div style="background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:8px 12px;font-size:0.8rem;color:#9a3412;font-weight:700;"><i class="fas fa-circle-info"></i> سيُخصم <b>${money(absDiff)} ج</b> من إجمالي النقدية بالدرج.</div>`;
      else msgEl.innerHTML='';
    }else{
      msgEl.innerHTML='<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:0.78rem;color:#64748b;"><i class="fas fa-info-circle"></i> لا يوجد تأثير على إجمالي النقدية بالدرج — للمعرفة والمتابعة فقط.</div>';
    }
  };
  reasonSel.addEventListener('change',updMsg);
  valInp.addEventListener('input',updMsg);
  updMsg();
}
function cancelC2WPreview(){ PENDING_C2W=null; const el=$('#c2w-preview'); if(el)el.innerHTML=''; }

async function confirmAddC2W(){
  if(!PENDING_C2W)return;
  const {bill,branch}=PENDING_C2W;
  const val=num($('#c2w-value-input').value);
  const reason=$('#c2w-reason-select')?.value||'cash_as_visa';
  if(isNaN(val)){ toast('اكتب قيمة صحيحة','bad'); return; }
  const net=parseFloat(bill.total_bill_net??bill.total_bill??0);
  const diffReason=$('#c2w-diff-reason')?.value||null;
  const hasTwoRows=reason==='cash_as_visa' && diffReason && Math.abs(val-net)>0.01;
  const btn=$('#c2w-confirm-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';}
  try{
    // السطر الأول دايماً
    await posUpdate({table:'cash_to_wallet',action:'insert',data:{
      bill_no:String(bill.bill_no||''), branch,
      invoice_amount:String(net),
      transaction_value:String(val), customer_name:bill.cust_name_ar||'', reason,
      created_at:new Date().toISOString(), disbursed:false, disbursed_at:''
    }});
    // السطر الثاني تلقائياً لو فيه فرق وتم اختيار سببه
    if(hasTwoRows){
      await posUpdate({table:'cash_to_wallet',action:'insert',data:{
        bill_no:String(bill.bill_no||''), branch,
        invoice_amount:String(net),
        transaction_value:String(val), customer_name:bill.cust_name_ar||'', reason:diffReason,
        created_at:new Date().toISOString(), disbursed:false, disbursed_at:''
      }});
      toast('تمت الإضافة — سطرين (كاش بالخطأ + الفرق)','ok');
    }else{
      toast('تمت الإضافة','ok');
    }
    cancelC2WPreview(); const inp=$('#c2w-bill'); if(inp)inp.value='';
    await loadData();
  }catch(e){
    toast('تأخّر الرد — بنحدّث الشاشة للتأكد من الحالة الفعلية','err');
    cancelC2WPreview(); const inp=$('#c2w-bill'); if(inp)inp.value='';
    await loadData();
  }
}

function editC2WValue(id,el,current){
  const input=document.createElement('input');
  input.type='number'; input.step='0.01'; input.value=current;
  input.className='table-input mono'; input.style.width='90px'; input.style.textAlign='center';
  el.replaceWith(input); input.focus(); input.select();
  const save=async()=>{
    const v=num(input.value);
    if(isNaN(v)){ buildCloseView(); return; }
    const row=CASH2WALLET.find(r=>r.id===id); if(row)row.transaction_value=v;
    buildCloseView();
    try{ await posUpdate({table:'cash_to_wallet',action:'update',id,data:{transaction_value:String(v)}}); }
    catch(e){ toast('فشل حفظ التعديل','err'); }
  };
  input.addEventListener('blur',save);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){input.value=current;input.blur();}});
}

async function disburseC2W(id){
  if(!confirm('تأكيد صرف المبلغ من نقطة البيع؟ السطر هيتشال من القائمة.'))return;
  try{
    await posUpdate({table:'cash_to_wallet',action:'update',id,data:{disbursed:true,disbursed_at:new Date().toISOString()}});
    toast('تم الصرف','ok');
  }catch(e){ toast('تأخّر الرد — بنحدّث الشاشة للتأكد من الحالة الفعلية','err'); }
  await loadData();
}
async function deleteC2W(id){
  if(!confirm('حذف هذا السطر نهائياً؟'))return;
  try{ await posUpdate({table:'cash_to_wallet',action:'delete',id}); toast('تم الحذف','ok'); }
  catch(e){ toast('تأخّر الرد — بنحدّث الشاشة للتأكد من الحالة الفعلية','err'); }
  await loadData();
}

async function loadData(){
  $('#btn-refresh').disabled=true;
  try{
    const res=await fetch(POSMGMT_URL);
    const text=await res.text();
    let data = text && text.trim() ? JSON.parse(text) : {};
    // n8n ممكن يلف الرد في array: [{...}]
    if(Array.isArray(data)) data = data[0] || {};

    const pick=o=>Array.isArray(o)?o:[];
    // البنية الجديدة: جدولين بس
    const walletRows = pick(data.wallet);
    const salesRows  = pick(data.sales_wallet || data.branch_visa_sales || data.branchvisasales);
    LINKS = pick(data.links);   // اختياري: لو posmanagement بيرجّعه
    CASH2WALLET = pick(data.cash_to_wallet).map(r=>({
      id:r.id, bill_no:r.bill_no, branch:r.branch,
      invoice_amount:num(r.invoice_amount), transaction_value:num(r.transaction_value),
      customer_name:r.customer_name, created_at:r.created_at, reason:r.reason||'cash_as_visa',
      disbursed:(r.disbursed===true||r.disbursed==='true'), disbursed_at:r.disbursed_at
    }));

    MACHINES=[];
    SYSTEM = salesRows.map(normSystem);
    WALLET = walletRows.map(normWallet);
    overlay.manual.forEach(m=>WALLET.push(m));
    ALL_STORES=[...new Set([
      ...WALLET.map(w=>w.store).filter(Boolean),
      ...SYSTEM.map(s=>s.store).filter(Boolean)
    ])].sort();
    populateBranches();
    render();
    if(CURRENT_TAB==='close')buildCloseView();
  }catch(e){
    console.error(e);
    toast('تعذّر تحميل البيانات — تأكد من اتصالك ومن أن posmanagement شغّال','err');
  }finally{$('#btn-refresh').disabled=false;}
}

function populateBranches(){
  const sel=$('#branch-select');
  if(IS_ADMIN){
    sel.style.display='';
    const cur=sel.value;
    sel.innerHTML='<option value="">كل الفروع (أدمن)</option>'+ALL_STORES.map(s=>'<option>'+s+'</option>').join('');
    if(ALL_STORES.includes(cur))sel.value=cur;
  }else{
    sel.style.display='none';
  }
  updateBranchTitle();
}
function updateBranchTitle(){
  const t=$('#branch-title');
  if(ACTIVE_BRANCH)t.textContent='· '+ACTIVE_BRANCH;
  else if(IS_ADMIN)t.textContent='· كل الفروع';
  else t.textContent='';
}

/* ============================================================
   TABS + WIRE UP
   ============================================================ */
let CURRENT_TAB='close';
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    CURRENT_TAB=b.dataset.tab;
    document.querySelectorAll('.tab-view').forEach(v=>v.classList.remove('active'));
    $('#tab-'+CURRENT_TAB).classList.add('active');
    if(CURRENT_TAB==='close')buildCloseView();
    if(CURRENT_TAB==='history')loadHistory();
  };
});
$('#btn-refresh').onclick=loadData;
$('#close-cashier-top').addEventListener('input',e=>{closeDraft.cashier=e.target.value;saveDraft();});
$('#hist-refresh').onclick=loadHistory;
$('#branch-select').addEventListener('change',e=>{
  ACTIVE_BRANCH=e.target.value;updateBranchTitle();render();
  if(CURRENT_TAB==='close')buildCloseView();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-bg.show').forEach(m=>m.classList.remove('show'));if(LINK){cancelLink();}}});

/* ============================================================
   INIT — حماية + تحميل
   ============================================================ */
(async function init(){
  if(typeof checkAuth==='function'){
    const user=await checkAuth();
    if(!user)return; // checkAuth بيعمل redirect
  }
  updateBranchTitle();
  loadData();
})();
</script>
</body>
