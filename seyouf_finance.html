<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحساب المالي لفرع السيوف</title>
<link rel="stylesheet" href="tokens.css?v=20260906">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{ --teal:#0d9488; --teal-d:#0f766e; --blue:#0369a1; --blueb:#e0f2fe; --red:#dc2626; --green:#15803d; --purp:#7c3aed; --purpb:#ede9fe; }
  *{ box-sizing:border-box; }
  body{ font-family:'Cairo',sans-serif; color:var(--text,#1f2937); background:var(--bg,#f1f5f9); margin:0; padding:16px; font-size:.86rem; }
  .wrap{ max-width:100%; margin:0 auto; }
  h1{ font-size:1.15rem; font-weight:800; display:flex; align-items:center; gap:8px; margin:0 0 4px; }
  h1 .ic{ color:var(--teal); }
  .sub{ color:var(--text-muted,#6b7280); font-size:.8rem; margin:0 0 14px; }
  .card{ background:var(--surface,#fff); border:1px solid var(--border,#e5e7eb); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .card-h{ padding:10px 14px; font-weight:800; border-bottom:1px solid var(--border,#e5e7eb); display:flex; justify-content:space-between; align-items:center; font-size:.9rem; }
  .card-h .ic{ color:var(--teal); margin-left:6px; }
  table{ width:100%; border-collapse:collapse; font-size:.82rem; min-width:0; }
  thead th{ position:sticky; top:0; background:var(--surface-2,#f8fafc); color:var(--text-secondary,#475569); text-align:right; padding:9px 12px; font-weight:700; border-bottom:1px solid var(--border,#e5e7eb); white-space:nowrap; }
  tbody td{ padding:9px 12px; border-bottom:1px solid var(--border,#eef2f7); text-align:right; }
  tbody tr:nth-child(even){ background:var(--surface-2,#fafbfc); }
  .num{ font-variant-numeric:tabular-nums; text-align:left; direction:ltr; }
  .name{ font-weight:600; } .muted{ color:var(--text-muted,#9ca3af); font-size:.78rem; }

  .sumt thead th{ text-align:center; font-size:.82rem; }
  .sumt thead th.lbl{ text-align:right; }
  .sumt td{ text-align:center; font-size:1.05rem; font-weight:800; font-variant-numeric:tabular-nums; padding:12px; }
  .sumt td.lbl{ text-align:right; font-size:.9rem; color:var(--text-secondary,#475569); }
  .sumt tr.tot td{ border-top:2px solid var(--border,#e5e7eb); font-size:1.25rem; background:var(--surface-2,#f8fafc); }
  .sumt .in{ color:var(--green); } .sumt .out{ color:var(--red); } .sumt .net{ color:var(--teal-d); }
  .sumt th.in{ color:var(--green); } .sumt th.out{ color:var(--red); } .sumt th.net{ color:var(--teal-d); }
  .ico-cash{ color:var(--green); } .ico-goods{ color:var(--purp); }

  .bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; padding:10px 14px; border-bottom:1px solid var(--border,#eef2f7); }
  .fld{ display:flex; flex-direction:column; gap:3px; }
  .fld label{ font-size:.72rem; color:var(--text-muted,#6b7280); font-weight:700; }
  .inp{ height:32px; border:1px solid var(--border,#e5e7eb); border-radius:8px; padding:0 10px; font-family:inherit; font-size:.82rem; background:var(--surface,#fff); color:inherit; }
  .btn-g{ background:var(--surface-2,#f1f5f9); color:inherit; border:1px solid var(--border,#e5e7eb); border-radius:8px; padding:8px 12px; font-family:inherit; font-weight:700; cursor:pointer; height:32px; align-self:flex-end; }
  .pill{ font-size:.64rem; font-weight:800; padding:2px 9px; border-radius:20px; white-space:nowrap; }
  .pill.cash{ background:#dcfce7; color:#15803d; } .pill.goods{ background:var(--purpb); color:var(--purp); }
  .dir{ font-size:.64rem; font-weight:800; padding:2px 9px; border-radius:20px; }
  .dir.in{ background:#e0f2fe; color:#0369a1; } .dir.out{ background:#fee2e2; color:#b91c1c; }
  .scroll{ max-height:56vh; overflow:auto; }
  .pager{ display:flex; gap:6px; align-items:center; justify-content:center; padding:10px; flex-wrap:wrap; }
  .pager button{ min-width:32px; height:32px; border:1px solid var(--border,#e5e7eb); background:var(--surface,#fff); border-radius:7px; cursor:pointer; font-family:inherit; font-weight:700; color:inherit; }
  .pager button.on{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .pager button:disabled{ opacity:.4; cursor:default; }
  .pager .info{ color:var(--text-muted,#6b7280); font-size:.78rem; margin:0 8px; }
  .empty{ text-align:center; color:var(--text-muted,#9ca3af); padding:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><i class="fa-solid fa-code-branch ic"></i> الحساب المالي لفرع السيوف</h1>
  <p class="sub">الوارد إلى السيوف والمنصرف منه (كاش + أذون صرف البضاعة)، والصافي — من 15/9/2026. البضاعة مقيّمة بآخر سعر شراء.</p>

  <div class="card">
    <table class="sumt">
      <thead><tr><th class="lbl">النوع</th><th class="in">وارد إلى السيوف</th><th class="out">مصروفات السيوف (صادر)</th><th class="net">الصافي</th></tr></thead>
      <tbody>
        <tr><td class="lbl"><i class="fa-solid fa-money-bill-wave ico-cash"></i> كاش</td><td class="in" id="cIn">0</td><td class="out" id="cOut">0</td><td class="net" id="cNet">0</td></tr>
        <tr><td class="lbl"><i class="fa-solid fa-boxes-stacked ico-goods"></i> بضاعة (أذون صرف)</td><td class="in" id="gIn">0</td><td class="out" id="gOut">0</td><td class="net" id="gNet">0</td></tr>
        <tr class="tot"><td class="lbl">الإجمالي</td><td class="in" id="tIn">0</td><td class="out" id="tOut">0</td><td class="net" id="tNet">0</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-h"><span><i class="fa-solid fa-list ic"></i> الحركات</span><span class="muted" id="cnt"></span></div>
    <div class="bar">
      <div class="fld"><label>من تاريخ</label><input type="date" id="fFrom" class="inp"></div>
      <div class="fld"><label>إلى تاريخ</label><input type="date" id="fTo" class="inp"></div>
      <div class="fld"><label>النوع</label>
        <select id="fTyp" class="inp"><option value="">الكل</option><option value="cash">كاش</option><option value="goods">بضاعة</option></select>
      </div>
      <div class="fld"><label>الاتجاه</label>
        <select id="fDir" class="inp"><option value="">الكل</option><option value="in">وارد للسيوف</option><option value="out">صادر من السيوف</option></select>
      </div>
      <div class="fld"><label>بحث</label><input type="text" id="fQ" class="inp" placeholder="فرع / مستخدم / ملاحظات"></div>
      <button class="btn-g" id="btnReset"><i class="fa-solid fa-rotate-left"></i> تصفير</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>التاريخ</th><th>النوع</th><th>الاتجاه</th><th>الطرف</th><th>القيمة</th><th>تفاصيل</th><th>المستخدم</th></tr></thead>
        <tbody id="tRows"><tr><td colspan="7" class="empty">جارِ التحميل…</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script src="config.js?v=20261017"></script>
<script src="session.js?v=20261030"></script>
<script>
let DATA = [];
const PER = 40; let page = 1;
const money = n => Math.round(n||0).toLocaleString('en-US');
const dmy = s => { const t=(s||'').split('T'); return (t[0]||'').split('-').reverse().join('/') + (t[1]? '  '+t[1].slice(0,5):''); };
const val = id => document.getElementById(id).value;
function set(id,v){ document.getElementById(id).textContent = money(v); }

async function loadData(){
  try{
    const tok = (window.Session && Session.bearer) ? await Session.bearer() : (typeof SB_ANON_API!=='undefined'?SB_ANON_API:'');
    const r = await fetch(SB_URL_API+'/rest/v1/rpc/get_seyouf_account', {
      method:'POST',
      headers:{ apikey:SB_ANON_API, Authorization:'Bearer '+tok, 'Content-Type':'application/json' },
      body:'{}'
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    DATA = (Array.isArray(d)?d:[]).map(x=>({...x, day:(x.d||'').slice(0,10)}));
    render();
  }catch(e){
    document.getElementById('cnt').textContent='تعذّر التحميل';
    document.getElementById('tRows').innerHTML='<tr><td colspan="7" class="empty">تعذّر تحميل البيانات — تأكد من تسجيل الدخول والصلاحية.</td></tr>';
  }
}

function filtered(){
  const from=val('fFrom'), to=val('fTo'), typ=val('fTyp'), dir=val('fDir'), q=val('fQ').trim();
  return DATA.filter(r=>{
    if(from && r.day<from) return false;
    if(to && r.day>to) return false;
    if(typ && r.typ!==typ) return false;
    if(dir && r.dir!==dir) return false;
    if(q && !((r.notes||'').includes(q) || (r.usr||'').includes(q) || (r.party||'').includes(q))) return false;
    return true;
  });
}

function render(){
  const rows = filtered();
  const sum = (t,d) => rows.filter(r=>r.typ===t && r.dir===d).reduce((s,r)=>s+(+r.val||0),0);
  const cI=sum('cash','in'), cO=sum('cash','out'), gI=sum('goods','in'), gO=sum('goods','out');
  set('cIn',cI); set('cOut',cO); set('cNet',cI-cO);
  set('gIn',gI); set('gOut',gO); set('gNet',gI-gO);
  set('tIn',cI+gI); set('tOut',cO+gO); set('tNet',(cI+gI)-(cO+gO));

  rows.sort((a,b)=> a.d<b.d?1:-1);
  const pages=Math.max(1,Math.ceil(rows.length/PER));
  if(page>pages) page=pages;
  const slice=rows.slice((page-1)*PER, page*PER);
  const tb=document.getElementById('tRows'); tb.innerHTML='';
  if(!slice.length) tb.innerHTML='<tr><td colspan="7" class="empty">لا توجد حركات مطابقة للفلتر</td></tr>';
  slice.forEach(r=>{
    const typ = r.typ==='goods' ? '<span class="pill goods">بضاعة</span>' : '<span class="pill cash">كاش</span>';
    const dir = r.dir==='in' ? '<span class="dir in">وارد</span>' : '<span class="dir out">صادر</span>';
    const det = r.typ==='goods'
      ? `<span class="muted">${r.nitems||0} صنف · ${r.flag||''}</span>`
      : `<span class="muted">${r.notes||'—'}</span>`;
    tb.insertAdjacentHTML('beforeend', `<tr>
      <td class="num">${dmy(r.d)}</td><td>${typ}</td><td>${dir}</td>
      <td class="name">${r.party||'—'}</td><td class="num">${money(r.val)}</td>
      <td>${det}</td><td>${r.usr||'—'}</td></tr>`);
  });
  document.getElementById('cnt').textContent = rows.length + ' حركة';

  const pg=document.getElementById('pager'); pg.innerHTML='';
  if(pages>1){
    const mk=(lbl,p,dis,on)=>{ const b=document.createElement('button'); b.innerHTML=lbl; b.disabled=dis; if(on)b.className='on'; b.onclick=()=>{page=p; render(); document.querySelector('.scroll').scrollTop=0;}; return b; };
    pg.appendChild(mk('«',1,page===1)); pg.appendChild(mk('‹',page-1,page===1));
    for(let p=1;p<=pages;p++){ if(p===1||p===pages||Math.abs(p-page)<=2) pg.appendChild(mk(p,p,false,p===page)); else if(Math.abs(p-page)===3){ const s=document.createElement('span'); s.className='info'; s.textContent='…'; pg.appendChild(s);} }
    pg.appendChild(mk('›',page+1,page===pages)); pg.appendChild(mk('»',pages,page===pages));
    const inf=document.createElement('span'); inf.className='info'; inf.textContent=`صفحة ${page} من ${pages}`; pg.appendChild(inf);
  }
}

let t=null;
['fFrom','fTo','fTyp','fDir'].forEach(id=> document.getElementById(id).addEventListener('change',()=>{page=1; render();}));
document.getElementById('fQ').addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>{page=1; render();},280); });
document.getElementById('btnReset').addEventListener('click',()=>{ ['fFrom','fTo','fTyp','fDir','fQ'].forEach(id=>document.getElementById(id).value=''); page=1; render(); });

(async function(){
  try{ if(window.Session && Session.require){ const u = await Session.require({page:'seyouf_finance'}); if(!u) return; } }catch(e){}
  loadData();
})();
</script>
</body>
</html>
