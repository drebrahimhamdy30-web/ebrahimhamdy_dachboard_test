<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تعليمات عامة - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root{ --primary:#0d9488; --primary-dark:#0f766e; }
    .container{ max-width:1000px; }
    .ins-note{ background:#f0fdfa;border:1.5px solid #99f6e4;border-radius:10px;padding:10px 14px;font-size:.82rem;color:#0f766e;line-height:1.7;margin-bottom:14px }
    .ins-bar{ display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px }
    .ins-bar input.q{ flex:1 1 220px;border:1px solid var(--border);border-radius:9px;padding:.5rem .7rem;font-family:inherit;font-size:.85rem }
    .cats{ display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--surface-3);margin-bottom:14px }
    .cat{ border:none;background:none;padding:8px 14px;font-family:inherit;font-size:.85rem;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px }
    .cat.active{ color:var(--primary-dark);border-bottom-color:var(--primary) }
    .cat .n{ background:var(--surface-3);border-radius:10px;padding:0 7px;font-size:.7rem;margin-inline-start:5px }
    .ins{ border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 16px;margin-bottom:10px;position:relative }
    .ins.pin{ border-color:#fcd34d;background:#fffbeb }
    .ins-h{ display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap }
    .ins-title{ font-weight:800;font-size:.98rem;flex:1;min-width:160px }
    .ins-cat{ font-size:.68rem;font-weight:700;color:var(--primary-dark);background:var(--primary-light,#ccfbf1);border-radius:999px;padding:2px 9px;white-space:nowrap }
    .ins-body{ margin-top:7px;font-size:.88rem;color:var(--text-primary);line-height:1.85;white-space:pre-wrap }
    .ins-meta{ margin-top:8px;font-size:.7rem;color:var(--text-muted) }
    .ins-actions{ display:flex;gap:4px }
    .ic-btn{ border:none;background:none;cursor:pointer;font-size:.85rem;padding:3px 6px;border-radius:6px;color:var(--text-muted) }
    .ic-btn:hover{ background:var(--surface-2) }
    .ic-del:hover{ color:var(--danger) }
    .ic-pin.on{ color:#d97706 }
    .empty{ text-align:center;color:var(--text-muted);padding:36px }
    /* modal */
    .im-bg{ display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9999;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto }
    .im-bg.open{ display:flex }
    .im{ background:var(--surface);border-radius:14px;max-width:600px;width:100%;box-shadow:var(--shadow-lg) }
    .im-hd{ padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:800 }
    .im-bd{ padding:16px }
    .im-bd label{ display:block;font-size:.76rem;font-weight:800;color:var(--text-secondary);margin:0 0 4px }
    .im-bd input,.im-bd textarea{ width:100%;border:1px solid var(--border);border-radius:9px;padding:.55rem .7rem;font-family:inherit;font-size:.88rem;margin-bottom:12px }
    .im-bd textarea{ min-height:130px;resize:vertical;line-height:1.8 }
    .btn{ border:1px solid var(--primary);background:var(--primary);color:#fff;padding:.55rem 1rem;border-radius:9px;font-family:inherit;font-size:.83rem;font-weight:700;cursor:pointer }
    .btn.ghost{ background:#fff;color:var(--text-primary);border-color:var(--border);font-weight:600 }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-book-open"></i> تعليمات عامة</div>
        <button class="btn" id="addBtn" style="display:none" onclick="openEdit(null)"><i class="fas fa-plus"></i> إضافة تعليمة</button>
      </div>
      <div class="ins-note">قاعدة تعليمات للموظفين مقسّمة بالأقسام. أي مشكلة بتقابلنا بنحوّلها لتعليمة واضحة هنا يقرأها الموظف المختص.</div>

      <div class="ins-bar">
        <input type="text" class="q" id="q" placeholder="🔍 بحث في كل التعليمات…">
        <button class="btn ghost" onclick="exportPdf()"><i class="fas fa-file-pdf"></i> تصدير PDF للقسم</button>
      </div>
      <div class="cats" id="cats"></div>
      <div id="list"><div class="empty"><i class="fas fa-spinner fa-spin"></i> جارٍ التحميل…</div></div>
    </div>
  </div>

  <div class="im-bg" id="im-bg">
    <div class="im">
      <div class="im-hd"><span id="im-title">إضافة تعليمة</span><button class="ic-btn" onclick="closeEdit()"><i class="fas fa-xmark"></i></button></div>
      <div class="im-bd">
        <input type="hidden" id="f-id">
        <label>القسم</label>
        <input type="text" id="f-cat" list="catlist" placeholder="صيادلة / طيارين / خدمة عملاء…">
        <datalist id="catlist"></datalist>
        <label>العنوان</label>
        <input type="text" id="f-title" placeholder="عنوان مختصر للتعليمة">
        <label>التفاصيل</label>
        <textarea id="f-body" placeholder="اكتب التعليمة بوضوح…"></textarea>
        <label style="display:flex;align-items:center;gap:7px;font-weight:600"><input type="checkbox" id="f-pin" style="width:16px;height:16px;margin:0"> مثبّتة فوق</label>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          <button class="btn ghost" onclick="closeEdit()">إلغاء</button>
          <button class="btn" onclick="save()"><i class="fas fa-save"></i> حفظ</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js?v=20260903"></script>
  <script src="api.js?v=tt20260830"></script>
  <script>
    const REST = SB_URL_API + '/rest/v1/';
    const H = { apikey: SB_ANON_API, Authorization: 'Bearer ' + SB_ANON_API, 'Content-Type': 'application/json' };
    const PRESETS = ['صيادلة','طيارين','مشتريات','تحضير','مراجعة','كاشير'];
    const WHO = (localStorage.getItem('fullName') || localStorage.getItem('activeUser') || '—').trim();
    let INS = [], CAT = '', Q = '', canEdit = false;

    function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function dt(s){ return s ? new Date(s).toLocaleDateString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'short'}) : ''; }

    async function load(){
      try{
        const r = await fetch(REST + 'instructions?select=*&order=pinned.desc,created_at.desc', { headers: H });
        INS = await r.json(); if(!Array.isArray(INS)) INS = [];
      }catch(e){ INS = []; }
      renderCats(); render();
    }
    function cats(){ return [...new Set([...PRESETS, ...INS.map(x=>x.category).filter(Boolean)])]; }
    function renderCats(){
      const list = cats();
      if(!CAT) CAT = list[0] || 'عام';
      document.getElementById('cats').innerHTML = list.map(c=>{
        const n = INS.filter(x=>x.category===c).length;
        return `<button class="cat ${CAT===c?'active':''}" onclick="setCat('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}${n?`<span class="n">${n}</span>`:''}</button>`;
      }).join('');
      document.getElementById('catlist').innerHTML = list.map(c=>`<option value="${esc(c)}">`).join('');
    }
    window.setCat = c => { CAT = c; render(); renderCats(); };

    function render(){
      const box = document.getElementById('list');
      let rows = INS;
      if(Q) rows = rows.filter(x => (x.title||'').includes(Q) || (x.body||'').includes(Q) || (x.category||'').includes(Q));
      else rows = rows.filter(x => x.category === CAT);
      if(!rows.length){ box.innerHTML = `<div class="empty">${Q?'مفيش نتائج للبحث.':'مفيش تعليمات في القسم ده بعد.'}</div>`; return; }
      box.innerHTML = rows.map(x=>`
        <div class="ins ${x.pinned?'pin':''}">
          <div class="ins-h">
            ${x.pinned?'<i class="fas fa-thumbtack" style="color:#d97706"></i>':''}
            <span class="ins-title">${esc(x.title)}</span>
            <span class="ins-cat">${esc(x.category)}</span>
            ${canEdit?`<span class="ins-actions">
              <button class="ic-btn ic-pin ${x.pinned?'on':''}" title="تثبيت" onclick="togglePin(${x.id},${x.pinned?0:1})"><i class="fas fa-thumbtack"></i></button>
              <button class="ic-btn" title="تعديل" onclick="openEdit(${x.id})"><i class="fas fa-pen"></i></button>
              <button class="ic-btn ic-del" title="حذف" onclick="del(${x.id})"><i class="fas fa-trash-can"></i></button>
            </span>`:''}
          </div>
          ${x.body?`<div class="ins-body">${esc(x.body)}</div>`:''}
          <div class="ins-meta">${esc(x.updated_by||x.created_by||'')} · ${dt(x.updated_at||x.created_at)}</div>
        </div>`).join('');
    }

    document.getElementById('q').addEventListener('input', e=>{ Q = e.target.value.trim(); render(); });

    function openEdit(id){
      const x = id!=null ? INS.find(i=>i.id===id) : null;
      document.getElementById('im-title').textContent = x?'تعديل تعليمة':'إضافة تعليمة';
      document.getElementById('f-id').value = x?x.id:'';
      document.getElementById('f-cat').value = x?x.category:(CAT||'عام');
      document.getElementById('f-title').value = x?x.title:'';
      document.getElementById('f-body').value = x?(x.body||''):'';
      document.getElementById('f-pin').checked = x?!!x.pinned:false;
      document.getElementById('im-bg').classList.add('open');
    }
    function closeEdit(){ document.getElementById('im-bg').classList.remove('open'); }

    async function save(){
      const id = document.getElementById('f-id').value;
      const category = document.getElementById('f-cat').value.trim() || 'عام';
      const title = document.getElementById('f-title').value.trim();
      const body = document.getElementById('f-body').value.trim() || null;
      const pinned = document.getElementById('f-pin').checked;
      if(!title){ alert('اكتب عنوان التعليمة'); return; }
      const payload = { category, title, body, pinned, updated_by: WHO, updated_at: new Date().toISOString() };
      try{
        if(id){ await fetch(REST+'instructions?id=eq.'+id, { method:'PATCH', headers:{...H,Prefer:'return=minimal'}, body: JSON.stringify(payload) }); }
        else { payload.created_by = WHO; await fetch(REST+'instructions', { method:'POST', headers:{...H,Prefer:'return=minimal'}, body: JSON.stringify(payload) }); }
        CAT = category; closeEdit(); await load();
      }catch(e){ alert('فشل الحفظ'); }
    }
    async function del(id){
      if(!confirm('تأكيد حذف التعليمة؟')) return;
      try{ await fetch(REST+'instructions?id=eq.'+id, { method:'DELETE', headers:H }); await load(); }catch(e){ alert('فشل الحذف'); }
    }
    async function togglePin(id,on){
      try{ await fetch(REST+'instructions?id=eq.'+id, { method:'PATCH', headers:{...H,Prefer:'return=minimal'}, body: JSON.stringify({ pinned: !!on }) }); await load(); }catch(e){}
    }

    function exportPdf(){
      const rows = INS.filter(x=>x.category===CAT);
      if(!rows.length){ alert('مفيش تعليمات في القسم ده'); return; }
      const html = `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>تعليمات ${esc(CAT)}</title>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
        <style>@page{margin:16mm} *{box-sizing:border-box} body{font-family:'Cairo',sans-serif;color:#111;margin:0}
          h1{font-size:22px;color:#0f766e;border-bottom:2.5px solid #0d9488;padding-bottom:10px;margin:0 0 6px}
          .sub{font-size:11px;color:#888;margin-bottom:16px}
          .ins{margin:0 0 15px;padding:0 0 13px;border-bottom:1px dashed #ddd;page-break-inside:avoid}
          .t{font-weight:800;font-size:15px} .b{white-space:pre-wrap;line-height:1.9;font-size:13px;margin-top:5px}
          .m{font-size:10px;color:#999;margin-top:6px}</style></head>
        <body><h1>تعليمات — ${esc(CAT)}</h1>
        <div class="sub">عدد التعليمات: ${rows.length} · ${new Date().toLocaleDateString('ar-EG',{timeZone:'Africa/Cairo'})}</div>
        ${rows.map(x=>`<div class="ins"><div class="t">${x.pinned?'📌 ':''}${esc(x.title)}</div>${x.body?`<div class="b">${esc(x.body)}</div>`:''}<div class="m">${esc(x.updated_by||x.created_by||'')} · ${dt(x.updated_at||x.created_at)}</div></div>`).join('')}
        <scr`+`ipt>window.onload=function(){setTimeout(function(){window.print();},350);};</scr`+`ipt></body></html>`;
      const w = window.open('','_blank');
      if(!w){ alert('اسمح بالنوافذ المنبثقة عشان يطلع الـPDF'); return; }
      w.document.write(html); w.document.close();
    }

    (async function(){
      const role = (localStorage.getItem('userRole') || 'employee').trim();
      canEdit = (role === 'admin' || role === 'manager');
      if(!canEdit){
        try{ const pages = await sbGetRolePages(role); const p = (pages||[]).find(x=>x.page==='customer_problems.html'); canEdit = !!(p && p.can_edit); }catch(e){}
      }
      if(canEdit) document.getElementById('addBtn').style.display = 'inline-flex';
      load();
    })();
  </script>
</body>
</html>
