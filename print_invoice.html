<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>طباعة فاتورة بيع - Phalix</title>
<link rel="stylesheet" href="tokens.css?v=20260906">
<script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض.
   ⚠️ من غيره الصفحة مابتقولش هي فاتحة ولا داكنة، فقاعدة
   prefers-color-scheme في tokens.css بتتبع **إعداد الجهاز** بدل
   إعداد التطبيق — وده اللي كان بيخلّي ويب الطيار وكروت شاشة
   التوزيع تطلع داكنة عند ناس جهازهم على الوضع الليلي.
   الافتراضي فاتح: الوضع الليلي باختيار صريح من الزر بس. */
try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
<style>
/* درجات كانت الشاشة دي مستعملاها عن قصد (أغمق للتباين) — الوضع الداكن
   لسه بيتجاوزها لأن html[data-theme="dark"] محدّده أقوى من :root */
:root{--muted:#6b7280;--bg:#f3f4f6;}
</style>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root{
    --blue:#1d6fe0;
    --blue-dark:#1357b8;
    
    
    
    
    --red:#dc2626;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:24px;
  }

  /* ---------- search bar ---------- */
  .search-bar{
    max-width:760px;
    margin:0 auto 20px;
    background:var(--surface);
    border-radius:14px;
    padding:18px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search-bar input, .search-bar select{
    flex:1 1 160px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
  }
  .search-bar button{
    background:var(--blue);
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
  }
  .search-bar button:hover{background:var(--blue-dark);}
  .status{
    max-width:760px;
    margin:0 auto 14px;
    font-size:14px;
    color:var(--muted);
    text-align:center;
  }
  .status.error{color:var(--red);}

  /* ---------- invoice card ---------- */
  .invoice{
    max-width:760px;
    margin:0 auto;
    background:var(--surface);
    border-radius:14px;
    padding:32px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    display:none;
  }
  .invoice.show{display:block;}
  .title{
    text-align:center;
    font-size:26px;
    font-weight:800;
    color:var(--blue);
    margin:0 0 12px;
  }
  hr{border:none;border-top:3px solid var(--blue);margin:0 0 20px;}

  .meta{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 24px;
    font-size:15px;
    margin-bottom:20px;
  }
  .meta div{line-height:1.9;}
  .meta b{font-weight:700;}
  .meta input{
    border:none;
    border-bottom:1px dashed #c7c7c7;
    font-size:15px;
    font-family:inherit;
    background:transparent;
    text-align:right;
    width:140px;
  }
  .meta input:focus{outline:none;border-bottom:1px solid var(--blue);}

  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:0;
  }
  thead th{
    background:var(--blue);
    color:#fff;
    padding:12px 8px;
    font-size:15px;
    font-weight:700;
  }
  tbody td{
    padding:12px 8px;
    text-align:center;
    border-bottom:1px solid var(--line);
    font-size:15px;
  }
  tbody td.desc{text-align:right;}
  tbody tr:last-child td{border-bottom:none;}

  td input, td .cell-input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:15px;
    font-family:inherit;
    padding:4px;
    border-radius:4px;
  }
  td.desc input{text-align:right;}
  td input:focus{outline:1px solid var(--blue);background:#eef4ff;}

  .row-del{
    background:none;
    border:none;
    color:var(--red);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:2px 6px;
  }

  .add-row{
    margin-top:14px;
    background:#eef4ff;
    color:var(--blue-dark);
    border:1px dashed var(--blue);
    border-radius:8px;
    padding:9px 14px;
    font-size:14px;
    cursor:pointer;
    width:100%;
  }
  .add-row:hover{background:#dfeaff;}

  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f9fafb;
    border-radius:10px;
    padding:16px 18px;
    margin-top:18px;
  }
  .total-row .label{font-size:16px;font-weight:700;}
  .total-row .amount{font-size:20px;font-weight:800;color:var(--red);}

  .actions{
    margin-top:22px;
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .actions button{
    border:none;
    border-radius:8px;
    padding:11px 22px;
    font-size:15px;
    cursor:pointer;
  }
  .btn-print{background:var(--blue);color:#fff;}
  .btn-print:hover{background:var(--blue-dark);}
  .btn-reset{background:var(--surface);color:var(--ink);border:1px solid var(--line) !important;}

  /* ---------- print ---------- */
  @media print{
    body{background:var(--surface);padding:0;}
    .nav-bar{display:none !important;}
    .search-bar,.status,.actions,.row-del,.add-row{display:none !important;}
    .invoice{box-shadow:none;padding:0;max-width:100%;}
    td input, .meta input{border:none !important;}
  }
</style>
</head>
<body>
  <div class="nav-bar"></div>

  <div class="search-bar">
    <select data-branches id="branch">
    </select>
    <input id="billNo" type="text" placeholder="رقم الفاتورة" inputmode="numeric">
    <button id="searchBtn">بحث عن الفاتورة</button>
  </div>
  <div class="status" id="status"></div>

  <div class="invoice" id="invoice">
    <div class="title">Sales Invoice / فاتورة مبيعات</div>
    <hr>
    <div class="meta">
      <div>
        <div><b>رقم الفاتورة:</b> <span id="metaBillNo"></span></div>
        <div><b>سجل تجاري:</b> <input id="companyCR" value="61360"></div>
      </div>
      <div>
        <div><b>اسم العميل:</b> <input id="customerName" placeholder="------------------------"></div>
        <div><b>بطاقة ضريبية:</b> <input id="companyTax" value="540181552"></div>
      </div>
      <div>
        <div><b>التاريخ:</b> <input id="billDate"></div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:6%">م</th>
          <th style="width:42%">الصنف (Description)</th>
          <th style="width:13%">العدد</th>
          <th style="width:15%">سعر الوحدة</th>
          <th style="width:15%">الإجمالي</th>
          <th style="width:5%"></th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <button class="add-row" id="addRow">+ إضافة صنف</button>

    <div class="total-row">
      <div class="label">الإجمالي الكلي (Grand Total)</div>
      <div class="amount">EGP <span id="grandTotal">0.00</span></div>
    </div>

    <div class="actions">
      <button class="btn-print" id="printBtn">🖨 طباعة الفاتورة</button>
      <button class="btn-reset" id="resetBtn">بحث جديد</button>
    </div>
  </div>

<script src="config.js?v=20260904c"></script>
<script src="session.js?v=20260905"></script>
<script src="branches.js?v=20260904d"></script>
<script src="pages.js?v=20260904d"></script>
<script src="brand.js?v=20260904c"></script>
<script src="api.js?v=20260904c"></script>
<script>
// ====== EDIT THIS: your n8n webhook full URL ======
const WEBHOOK_URL = "https://agent.ebrahimhamdy.com/webhook/invouce";
// ===================================================

const billNoEl = document.getElementById('billNo');
const branchEl = document.getElementById('branch');
const statusEl = document.getElementById('status');
const invoiceEl = document.getElementById('invoice');
const itemsBody = document.getElementById('itemsBody');

let nextId = 1;

function fmt(n){ return (Math.round((n + Number.EPSILON) * 100) / 100).toFixed(2); }

function recalcTotals(){
  let grand = 0;
  itemsBody.querySelectorAll('tr').forEach((tr, idx) => {
    tr.querySelector('.idx').textContent = idx + 1;
    const qty = parseFloat(tr.querySelector('.qty').value) || 0;
    const price = parseFloat(tr.querySelector('.price').value) || 0;
    const total = qty * price;
    tr.querySelector('.lineTotal').textContent = fmt(total);
    grand += total;
  });
  document.getElementById('grandTotal').textContent = fmt(grand);
}

function addRow(name = '', qty = 1, price = 0){
  const tr = document.createElement('tr');
  tr.dataset.id = nextId++;
  tr.innerHTML = `
    <td class="idx">1</td>
    <td class="desc"><input class="name" value="${name}" placeholder="اسم الصنف"></td>
    <td><input class="qty cell-input" type="number" min="0" step="1" value="${qty}"></td>
    <td><input class="price cell-input" type="number" min="0" step="0.01" value="${price}"></td>
    <td class="lineTotal">0.00</td>
    <td><button class="row-del" title="حذف الصنف">✕</button></td>
  `;
  itemsBody.appendChild(tr);

  tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', recalcTotals));
  tr.querySelector('.row-del').addEventListener('click', () => {
    tr.remove();
    recalcTotals();
  });

  recalcTotals();
}

document.getElementById('addRow').addEventListener('click', () => addRow('', 1, 0));

document.getElementById('printBtn').addEventListener('click', () => window.print());

document.getElementById('resetBtn').addEventListener('click', () => {
  invoiceEl.classList.remove('show');
  statusEl.textContent = '';
  billNoEl.value = '';
  billNoEl.focus();
});

async function searchInvoice(){
  const bill_search_id = billNoEl.value.trim();
  if(!bill_search_id){
    statusEl.textContent = 'من فضلك اكتب رقم الفاتورة';
    statusEl.classList.add('error');
    return;
  }
  statusEl.classList.remove('error');
  statusEl.textContent = 'جاري البحث...';
  invoiceEl.classList.remove('show');

  try{
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bill_search_id: bill_search_id,
        branch: branchEl.value
      })
    });

    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // response can be an array with one item, or a single object
    const payload = Array.isArray(data) ? data[0] : data;
    const raw = (payload.Data && payload.Data[0]) ? payload.Data[0] : payload;
    const rawItems = raw.Items || raw.items || [];

    if(!rawItems.length){
      statusEl.textContent = 'لم يتم العثور على فاتورة بهذا الرقم';
      statusEl.classList.add('error');
      return;
    }

    document.getElementById('metaBillNo').textContent = raw.bill_no || bill_search_id;
    document.getElementById('billDate').value = raw.bill_date || '';
    document.getElementById('customerName').value = raw.customer_name || '';

    itemsBody.innerHTML = '';
    nextId = 1;
    rawItems.forEach(it => {
      addRow(
        it.itm_name_en || it.itm_name || '',
        it.itm_qty || 1,
        it.unit_price || 0
      );
    });

    statusEl.textContent = '';
    invoiceEl.classList.add('show');
  }catch(err){
    statusEl.textContent = 'حدث خطأ أثناء جلب الفاتورة: ' + err.message;
    statusEl.classList.add('error');
  }
}

document.getElementById('searchBtn').addEventListener('click', searchInvoice);
billNoEl.addEventListener('keydown', e => { if(e.key === 'Enter') searchInvoice(); });
</script>
</body>
</html>
