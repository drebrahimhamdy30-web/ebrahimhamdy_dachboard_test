<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>الحد الأدنى للمخزون - Phalix</title>
  <link rel="stylesheet" href="tokens.css?v=20260906">
  <script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض.
     ⚠️ من غيره الصفحة مابتقولش هي فاتحة ولا داكنة، فقاعدة
     prefers-color-scheme في tokens.css بتتبع **إعداد الجهاز** بدل
     إعداد التطبيق — وده اللي كان بيخلّي ويب الطيار وكروت شاشة
     التوزيع تطلع داكنة عند ناس جهازهم على الوضع الليلي.
     الافتراضي فاتح: الوضع الليلي باختيار صريح من الزر بس. */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .below-min { background: #fef2f2 !important; }
    .below-min td { color: #991b1b; }
    .stock-badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:0.75rem; font-weight:700; }
    .badge-danger { background:#fee2e2; color:#991b1b; }
    .badge-ok     { background:#dcfce7; color:#15803d; }
    .lookup-box { background:var(--surface-2); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:20px; }
    .min-input { width:70px; padding:4px 8px; border-radius:6px; border:1.5px solid var(--border); background:var(--surface-3); color:var(--text-primary); font-family:var(--font); font-size:0.85rem; text-align:center; }
    .min-input:focus { border-color:var(--accent); outline:none; }
    .save-min-btn { background:var(--success); color:#fff; border:none; border-radius:6px; padding:3px 8px; cursor:pointer; font-size:0.85rem; font-weight:700; line-height:1.6; }
    .save-min-btn:hover { opacity:0.85; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-boxes"></i> الحد الأدنى للمخزون</div>
        <button class="btn btn-primary" onclick="loadAll()"><i class="fas fa-sync-alt"></i> تحديث</button>
      </div>

      <!-- بحث بالكود أو بالاسم -->
      <div class="lookup-box">
        <div style="font-size:0.85rem;font-weight:700;color:var(--text-secondary);margin-bottom:12px;">
          <i class="fas fa-search"></i> إضافة صنف جديد
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
          <div>
            <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">كود الصنف</label>
            <input type="text" id="lookup-code" class="form-input" style="width:140px;"
              placeholder="الكود..."
              oninput="this.value = this.value.replace(/[^0-9]/g, '')"
              onkeydown="if(event.key==='Enter') lookupItem()">
          </div>
          <div style="font-size:0.78rem;color:var(--text-muted);padding-bottom:10px;">أو</div>
          <div style="flex:1;min-width:220px;">
            <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">اسم الصنف</label>
            <input type="text" id="lookup-name-q" class="form-input" style="width:100%;"
              placeholder="اكتب جزء من الاسم — البحث بيسامح الأخطاء وترتيب الكلمات"
              onkeydown="if(event.key==='Enter') lookupItem()">
          </div>
          <button class="btn btn-primary" onclick="lookupItem()" id="lookup-btn">
            <i class="fas fa-search"></i> بحث
          </button>
        </div>
        <div id="lookup-result" style="margin-top:8px;"></div>
        <div id="lookup-matches" style="margin-top:10px;"></div>

        <!-- نتيجة البحث -->
        <div id="lookup-details" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;align-items:flex-end;">
            <div>
              <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">اسم الصنف</label>
              <input type="text" id="lookup-name" class="form-input" readonly style="background:var(--surface-3);color:var(--text-muted);">
            </div>
            <div>
              <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">الرصيد الحالي</label>
              <input type="text" id="lookup-stock" class="form-input" readonly style="background:var(--surface-3);color:var(--text-muted);">
            </div>
            <div>
              <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">نوع الصنف</label>
              <input type="text" id="lookup-type" class="form-input" readonly style="background:var(--surface-3);color:var(--text-muted);">
            </div>
            <div>
              <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">الحد الأدنى</label>
              <input type="number" id="lookup-min" class="form-input" min="0" placeholder="0">
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="btn btn-primary" onclick="saveNewItem()" id="save-btn">
              <i class="fas fa-save"></i> حفظ الصنف
            </button>
            <button class="btn" onclick="resetLookup()" style="background:var(--surface-3);color:var(--text-muted);border:none;">إلغاء</button>
          </div>
        </div>
      </div>

      <!-- فلتر -->
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
        <div class="field-icon-wrap" style="min-width:220px;">
          <i class="fas fa-search field-icon"></i>
          <input type="text" id="searchInput" class="form-input"
            placeholder="بحث بالكود أو الاسم..." oninput="applyFilter()" style="padding-right:34px;">
        </div>
        <select data-branches id="branchFilter" class="form-select" style="width:auto;" onchange="applyFilter()">
          <option value="all">كل الفروع</option>
        </select>
        <select id="typeFilter" class="form-select" style="width:auto;" onchange="applyFilter()">
          <option value="all">كل الأنواع</option>
          <option value="دواء">💊 دواء</option>
          <option value="غير دواء">🧴 غير دواء</option>
        </select>
        <label class="check-label">
          <input type="checkbox" id="belowOnly" onchange="applyFilter()">
          تحت الحد الأدنى فقط ⚠️
        </label>
        <label class="check-label" title="الفرع المصدر بنسيب له الأكبر: حده الأدنى أو استهلاك الأيام دي — والباقي هو الفائض">
          يحتفظ الفرع المصدر باستهلاك
          <input type="number" id="coverDays" min="0" max="120" step="1" value="30" oninput="onCoverDaysChange()"
            style="width:58px;padding:3px 6px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface-3);color:var(--text-primary);font-family:var(--font);font-size:0.82rem;text-align:center;margin:0 4px;">
          يوم
        </label>
        <div id="stats-bar" style="display:flex;gap:8px;align-items:center;font-size:0.82rem;margin-right:auto;"></div>
      </div>

      <!-- الجدول -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>كود الصنف</th>
              <th>اسم الصنف</th>
              <th>النوع</th>
              <th>الفرع</th>
              <th>الرصيد الحالي</th>
              <th>الحد الأدنى</th>
              <th>باقي الفروع</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="9">⏳ جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="config.js?v=20260904c"></script>
  <script src="session.js?v=20260905"></script>
  <script src="branches.js?v=20260904d"></script>
  <script src="pages.js?v=20260904d"></script>
  <script src="brand.js?v=20260904c"></script>
  <script src="api.js?v=20260904c"></script>
  <script>
    let activeUser = null;
    let userBranch = '';
    let allData    = [];

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (Session.branch()).trim();
        try {
          const d = localStorage.getItem('minstock_cover_days');
          if (d !== null && document.getElementById('coverDays')) document.getElementById('coverDays').value = d;
        } catch (e) {}
        loadAll();
      }
    });

    async function loadAll() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="9">⏳ جاري جلب البيانات...</td></tr>';
      try {
        // من Supabase: كل صف بالرصيد الحالي محسوب لحظياً من مخزون فرعه
        // وبالتوازي أرصدة الفروع التلاتة لكل صنف (عشان نعرف نطلب تحويل من فرع فيه فائض)
        const [response] = await Promise.all([sbStockLimits('عام'), loadCross()]);
        allData = Array.isArray(response) ? response : [];
        applyFilter();
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--danger);padding:30px;">❌ فشل الاتصال</td></tr>';
      }
    }

    function applyFilter() {
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      const belowOnly = document.getElementById('belowOnly').checked;
      const branchVal = document.getElementById('branchFilter').value;
      const typeVal   = document.getElementById('typeFilter').value;

      const filtered = allData.filter(item => {
        const searchMatch = !searchVal || [item.item_code, item.item_name]
          .some(v => String(v || '').toLowerCase().includes(searchVal));
        const belowMatch  = !belowOnly || (parseFloat(item.current_stock) < parseFloat(item.min_stock));
        const branchMatch = branchVal === 'all' || String(item.branch    || '').trim() === branchVal;
        const typeMatch   = typeVal   === 'all' || String(item.item_type || '').trim() === typeVal;
        return searchMatch && belowMatch && branchMatch && typeMatch;
      });

      renderStats();
      renderTable(filtered);
    }

    function renderStats() {
      const total = allData.length;
      const below = allData.filter(i => parseFloat(i.current_stock) < parseFloat(i.min_stock)).length;
      document.getElementById('stats-bar').innerHTML = `
        <span style="background:var(--surface-3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-weight:700;color:var(--text-secondary);">📦 الكل: ${total}</span>
        ${below > 0 ? `<span style="background:#fee2e2;border-radius:20px;padding:4px 12px;font-weight:700;color:#991b1b;">⚠️ تحت الحد: ${below}</span>` : ''}`;
    }

    function renderTable(items) {
      const tbody = document.getElementById('table-body');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج</td></tr>';
        return;
      }
      items.sort((a, b) => {
        const aB = parseFloat(a.current_stock) < parseFloat(a.min_stock);
        const bB = parseFloat(b.current_stock) < parseFloat(b.min_stock);
        if (aB && !bB) return -1;
        if (!aB && bB) return 1;
        return String(a.item_code).localeCompare(String(b.item_code));
      });
      tbody.innerHTML = items.map(item => {
        const stock     = parseFloat(item.current_stock) || 0;
        const minS      = parseFloat(item.min_stock)     || 0;
        const isBelow   = stock < minS;
        const typeColor = item.item_type === 'دواء' ? '#0ea5e9' : '#8b5cf6';
        return `
          <tr class="${isBelow ? 'below-min' : ''}" id="row-${item.id}">
            <td><code style="font-size:0.82rem;">${item.item_code || '---'}</code></td>
            <td style="font-weight:600;font-size:0.85rem;">${item.item_name || '---'}</td>
            <td><span style="font-size:0.78rem;font-weight:700;color:${typeColor};">${item.item_type === 'دواء' ? '💊' : '🧴'} ${item.item_type || '---'}</span></td>
            <td><span class="branch-tag">${item.branch || '---'}</span></td>
            <td><b id="stock-${item.id}" style="color:${isBelow ? 'var(--danger)' : 'var(--success)'};">${stock}</b></td>
            <td>
              <div style="display:flex;gap:4px;align-items:center;">
                <input type="number" class="min-input" value="${minS}" min="0" id="min-${item.id}"
                  onkeydown="if(event.key==='Enter') saveMinStock('${item.id}', this.value)">
                <button class="save-min-btn" onclick="saveMinStock('${item.id}', document.getElementById('min-${item.id}').value)" title="حفظ">✓</button>
              </div>
            </td>
            <td style="font-size:0.76rem;line-height:1.7;">${otherBranchesHtml(item)}</td>
            <td><span class="stock-badge ${isBelow ? 'badge-danger' : 'badge-ok'}" id="badge-${item.id}">${isBelow ? '⚠️ تحت الحد' : '✅ كافي'}</span></td>
            <td>
              ${requestHtml(item)}
              <div style="display:flex;gap:4px;">
                <button class="btn btn-sm" onclick="refreshItem('${item.id}', '${item.item_code}')" style="background:var(--accent);color:#fff;padding:5px 8px;" title="تحديث الرصيد"><i class="fas fa-sync-alt"></i></button>
                <button class="btn btn-sm" onclick="deleteItem('${item.id}', '${item.item_name}')" style="background:var(--danger);color:#fff;padding:5px 8px;" title="حذف"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    // ═══════════════════════════════════════════════════════════════
    // طلب تحويل/شراء مباشر من الصف
    // ═══════════════════════════════════════════════════════════════
    // أرصدة الفروع التلاتة وحدودها بتيجي من get_min_stock_alerts (migrate_26)
    // — نفس مصدر stock_flat اللي بيتحدّث كل 10 دقايق. الفائض في فرع =
    // رصيده − حده الأدنى هو كمان، عشان ما نفضّيش فرع على حساب فرع.
    const BR_SUF = [['المعمورة','m'], ['سان ستيفانو','s'], ['سيدى بشر','b']];
    let crossMap = {};    // كود الصنف → أرصدة/حدود الفروع
    let pendBuy  = {};    // "فرع|كود" → طلب شراء مفتوح
    let branchReps = null;

    function sufOf(branch) {
      const hit = BR_SUF.find(([name]) => Branches.same(name, branch || ''));
      return hit ? hit[1] : null;
    }
    const nOf = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
    const qtyIn = (c, suf) => nOf(c ? c['qty_' + suf] : 0);
    const minIn = (c, suf) => { const v = c ? c['min_' + suf] : null; return (v === null || v === undefined || v === '') ? 0 : nOf(v); };
    const pendIn = (c, suf) => !!(c && c['pend_' + suf]);
    const avIn  = (c, suf) => nOf(c ? c['av_' + suf] : 0);   // معدل الاستهلاك الشهري للفرع

    // عدد أيام الاستهلاك اللي الفرع المصدر بيحتفظ بيها (افتراضي شهر)
    function coverDays() {
      const v = parseFloat((document.getElementById('coverDays') || {}).value);
      return (isNaN(v) || v < 0) ? 30 : v;
    }
    // اللي الفرع المصدر بيحتفظ بيه = الأكبر بين حده الأدنى واستهلاكه في فترة التغطية
    function reserveIn(c, suf) { return Math.max(minIn(c, suf), avIn(c, suf) * coverDays() / 30); }
    // الفائض المتاح للتحويل = رصيده − اللي بيحتفظ بيه
    const surplusIn = (c, suf) => Math.floor(qtyIn(c, suf) - reserveIn(c, suf));
    function onCoverDaysChange() {
      try { localStorage.setItem('minstock_cover_days', String(coverDays())); } catch (e) {}
      applyFilter();
    }

    async function loadCross() {
      try {
        const r = await fetch(SB_URL_API + '/rest/v1/rpc/get_min_stock_alerts', {
          method: 'POST', headers: await sbH({ 'Content-Type': 'application/json' }), body: '{}' });
        const j = await r.json();
        crossMap = {};
        if (j && j.success) (j.rows || []).forEach(x => { crossMap[String(x.code)] = x; });
        await loadPendingBuys();
      } catch (e) { crossMap = {}; }
    }
    // طلبات شراء لسه مفتوحة (عشان مانطلبش الصنف مرتين)
    async function loadPendingBuys() {
      pendBuy = {};
      try {
        const since = new Date(Date.now() - 45 * 24 * 3600 * 1000).toISOString();
        const r = await fetch(SB_URL_API + '/rest/v1/task?select=item_code,branch,state&type=eq.' + encodeURIComponent('شراء')
          + '&state=in.(pending,ordered)&created_at=gte.' + since + '&limit=2000', { headers: await sbH() });
        const rows = await r.json();
        (Array.isArray(rows) ? rows : []).forEach(x => { pendBuy[String(x.branch || '') + '|' + String(x.item_code || '')] = x.state; });
      } catch (e) {}
    }

    // أرصدة الفروع التانية في خلية واحدة (الأخضر = عنده فائض يقدر يحوّل منه)
    function otherBranchesHtml(item) {
      const c = crossMap[String(item.item_code)];
      if (!c) return '<span style="color:var(--text-muted)">—</span>';
      const mine = sufOf(item.branch);
      return BR_SUF.filter(([, suf]) => suf !== mine).map(([name, suf]) => {
        const s = surplusIn(c, suf), res = reserveIn(c, suf), av = avIn(c, suf);
        const col = s > 0 ? 'var(--success,#16a34a)' : 'var(--text-muted)';
        const why = (av * coverDays() / 30 > minIn(c, suf)) ? 'استهلاك ' + coverDays() + ' يوم' : 'الحد الأدنى';
        return '<div title="' + name + ': بيحتفظ بـ' + (Math.round(res * 10) / 10) + ' (' + why + ')' + (av ? ' · معدل ' + av + '/شهر' : '') + '">'
             + '<span style="color:var(--text-muted)">' + name + ':</span> <b style="color:' + col + '">' + nOf(qtyIn(c, suf)) + '</b>'
             + (s > 0 ? ' <span style="font-size:0.68rem;color:var(--success,#16a34a)">(فائض ' + s + ')</span>'
                      : ' <span style="font-size:0.68rem;color:var(--text-muted)">(محجوز ' + (Math.round(res * 10) / 10) + ')</span>') + '</div>';
      }).join('');
    }

    // زر الطلب: تحويل من أكبر فائض، وإلا شراء
    function requestHtml(item) {
      const stock = nOf(item.current_stock), minS = nOf(item.min_stock);
      const need  = Math.ceil(minS - stock);
      if (!(need > 0)) return '';
      const c = crossMap[String(item.item_code)];
      const mine = sufOf(item.branch);
      const branch = String(item.branch || '').trim();
      if (mine && pendIn(c, mine)) return '<div style="font-size:0.72rem;font-weight:700;color:var(--warning,#f59e0b);margin-bottom:4px">⏳ تم طلب تحويله</div>';
      const buy = pendBuy[branch + '|' + String(item.item_code)];
      if (buy) return '<div style="font-size:0.72rem;font-weight:700;color:var(--warning,#f59e0b);margin-bottom:4px">⏳ ' + (buy === 'ordered' ? 'اتطلب شراؤه' : 'طلب شراء مفتوح') + '</div>';

      let best = null, bestQty = 0;
      if (c) BR_SUF.forEach(([name, suf]) => {
        if (suf === mine) return;
        const s = surplusIn(c, suf);
        if (s > bestQty) { bestQty = s; best = name; }
      });
      const id = 'req-' + item.id;
      if (best) {
        const qty = Math.min(need, bestQty);
        // الكمية قابلة للتعديل قبل الإرسال (المقترح = الأقل بين اللي ناقصك وفائض المصدر)
        return '<div style="display:flex;gap:3px;align-items:center;margin-bottom:4px">'
             + '<input type="number" id="qty-' + item.id + '" value="' + qty + '" min="1" step="1" title="كمية التحويل — تقدر تعدّلها"'
             + ' style="width:48px;padding:4px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface-3);color:var(--text-primary);font-family:var(--font);font-size:0.75rem;text-align:center">'
             + '<button id="' + id + '" class="btn btn-sm" style="background:var(--accent,#0d9488);color:#fff;padding:5px 6px;font-size:0.72rem;font-weight:700;flex:1"'
             + ' onclick="requestTransfer(\'' + item.id + '\',\'' + best.replace(/'/g, "\\'") + '\',' + bestQty + ')">↪ حوّل من ' + best + '</button></div>';
      }
      return '<button id="' + id + '" class="btn btn-sm" style="background:var(--surface-3);color:var(--text-primary);border:1.5px solid var(--border);padding:5px 8px;font-size:0.72rem;font-weight:700;margin-bottom:4px;width:100%"'
           + ' onclick="requestBuy(\'' + item.id + '\',' + need + ')">🛒 اطلب شراء ' + need + '</button>';
    }

    // حساب الفرع الممثّل (عشان الطلب ينتسب لفرع الطالب) — نفس RPC شاشة التحويل
    async function ensureBranchReps() {
      if (branchReps) return;
      try {
        const r = await fetch(SB_URL_API + '/rest/v1/rpc/get_branch_rep_users', {
          method: 'POST', headers: await sbH({ 'Content-Type': 'application/json' }), body: '{}' });
        const j = await r.json();
        branchReps = (j && typeof j === 'object') ? j : {};
      } catch (e) { branchReps = {}; }
    }

    async function requestTransfer(id, sourceName, maxQty) {
      const item = allData.find(x => String(x.id) === String(id));
      if (!item) return;
      const box = document.getElementById('qty-' + id);
      const qty = Math.floor(parseFloat(box ? box.value : maxQty));
      if (!(qty > 0)) { alert('اكتب كمية أكبر من صفر'); return; }
      if (qty > maxQty && !confirm('الكمية ' + qty + ' أكبر من فائض ' + sourceName + ' (' + maxQty + ') — تبعت برضه؟')) return;
      const targetName = String(item.branch || '').trim();
      const btn = document.getElementById('req-' + id);
      if (btn) { btn.disabled = true; btn.textContent = '... جاري الإرسال'; }
      await ensureBranchReps();
      const out = await sbTaskInsert({
        type: 'تحويل',
        user: (branchReps && branchReps[targetName]) || targetName,
        target_branch: sourceName,
        item_code: String(item.item_code),
        item: item.item_name,
        qty: qty,
        note: 'تحت الحد الأدنى — رصيد ' + targetName + ' ' + nOf(item.current_stock) + ' والحد ' + nOf(item.min_stock)
      });
      if (out && out.ok) {
        // علامة «قيد التحويل» — شاشة التحويل بتمسح الصف لما الطلب يتقفل
        try {
          await fetch(SB_URL_API + '/rest/v1/order_transfer_pending?on_conflict=branch,itm_code', {
            method: 'POST',
            headers: await sbH({ 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
            body: JSON.stringify({ branch: targetName, itm_code: String(item.item_code), qty: qty, requested_at: new Date().toISOString() })
          });
        } catch (e) {}
        const c = crossMap[String(item.item_code)], suf = sufOf(targetName);
        if (c && suf) c['pend_' + suf] = true;
        applyFilter();
      } else {
        alert('❌ فشل إرسال طلب التحويل');
        applyFilter();
      }
    }

    async function requestBuy(id, qty) {
      const item = allData.find(x => String(x.id) === String(id));
      if (!item || !(qty > 0)) return;
      const targetName = String(item.branch || '').trim();
      if (!confirm('اطلب شراء ' + qty + ' من «' + item.item_name + '» لفرع ' + targetName + '؟')) return;
      const btn = document.getElementById('req-' + id);
      if (btn) { btn.disabled = true; btn.textContent = '... جاري الإرسال'; }
      await ensureBranchReps();
      const c = crossMap[String(item.item_code)];
      const out = await sbTaskInsert({
        type: 'شراء',
        user: (branchReps && branchReps[targetName]) || targetName,
        branch: targetName,
        item_code: String(item.item_code),
        item: item.item_name,
        qty: qty,
        order_type: (c && c.med) ? 'دواء' : (item.item_type === 'دواء' ? 'دواء' : 'كوزمو'),
        note: 'تحت الحد الأدنى — مفيش فرع عنده فائض (رصيد ' + targetName + ' ' + nOf(item.current_stock) + ' والحد ' + nOf(item.min_stock) + ')'
      });
      if (out && out.ok) {
        pendBuy[targetName + '|' + String(item.item_code)] = 'pending';
        applyFilter();
      } else {
        alert('❌ فشل إرسال طلب الشراء');
        applyFilter();
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // البحث: بالكود أو بالاسم (بحث ذكي)
    // ═══════════════════════════════════════════════════════════════
    // search_stock_items على السيرفر بيدوّر في مخزون الفروع كلها: بيتجاهل
    // الهمزات والتشكيل، وترتيب الكلمات مايفرقش، وبيسامح غلطة إملائية
    // (trigram)، والأصناف اللي عليها رصيد بتطلع فوق.
    let lastMatches = [];

    async function lookupItem() {
      const code = document.getElementById('lookup-code').value.trim();
      const name = document.getElementById('lookup-name-q').value.trim();
      const q    = code || name;
      if (!q) { alert('اكتب كود الصنف أو جزء من اسمه'); return; }

      const btn = document.getElementById('lookup-btn');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      document.getElementById('lookup-result').innerHTML = '';
      document.getElementById('lookup-matches').innerHTML =
        '<span style="font-size:0.82rem;color:var(--text-muted)">⏳ جاري البحث...</span>';

      try {
        const r = await fetch(SB_URL_API + '/rest/v1/rpc/search_stock_items', {
          method: 'POST', headers: await sbH({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ p_q: q, p_limit: 12 }) });
        const j = await r.json();
        if (!j || !j.success) throw new Error((j && j.error) || 'فشل البحث');
        lastMatches = j.rows || [];

        if (!lastMatches.length) {
          document.getElementById('lookup-matches').innerHTML = '';
          document.getElementById('lookup-result').innerHTML =
            '<span style="color:var(--danger);font-size:0.85rem;">❌ مفيش صنف بالاسم/الكود ده في المخزون</span>';
          document.getElementById('lookup-details').style.display = 'none';
          return;
        }
        // كود مظبوط ونتيجة واحدة = اختيار مباشر
        if (lastMatches.length === 1 && String(lastMatches[0].code) === String(q)) { pickMatch(0); return; }
        renderMatches();
      } catch(e) {
        document.getElementById('lookup-matches').innerHTML = '';
        document.getElementById('lookup-result').innerHTML =
          '<span style="color:var(--danger);font-size:0.85rem;">❌ ' + e.message + '</span>';
      } finally {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-search"></i> بحث';
      }
    }

    function renderMatches() {
      const box = document.getElementById('lookup-matches');
      box.innerHTML = '<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:6px">'
        + lastMatches.length + ' نتيجة — اختار الصنف:</div>'
        + '<div style="display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto">'
        + lastMatches.map((m, i) => {
            const have = allData.some(x => String(x.item_code).trim() === String(m.code) && Branches.same(x.branch, userBranch));
            return '<button onclick="pickMatch(' + i + ')" style="text-align:right;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-family:var(--font)">'
              + '<div style="font-weight:700;font-size:0.84rem;color:var(--text-primary)">' + escHtml(m.name)
              + (have ? ' <span style="font-size:0.7rem;color:var(--warning)">— مسجّل عندك</span>' : '') + '</div>'
              + '<div style="font-size:0.72rem;color:var(--text-muted)">' + escHtml(m.code)
              + (m.company ? ' · ' + escHtml(m.company) : '')
              + ' · المعمورة ' + nOf(m.qty_m) + ' | سان ' + nOf(m.qty_s) + ' | بشر ' + nOf(m.qty_b) + '</div></button>';
          }).join('') + '</div>';
    }
    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // اختيار صنف من النتائج → يملا خانات الحفظ
    function pickMatch(i) {
      const m = lastMatches[i];
      if (!m) return;
      const exists = allData.some(x =>
        String(x.item_code).trim() === String(m.code) && Branches.same(x.branch, userBranch));
      if (exists) {
        document.getElementById('lookup-result').innerHTML =
          '<span style="color:var(--warning);font-size:0.85rem;">⚠️ «' + escHtml(m.name) + '» متسجّل بالفعل لفرع ' + escHtml(userBranch) + ' — عدّل حده من الجدول تحت</span>';
        document.getElementById('lookup-details').style.display = 'none';
        return;
      }
      const suf = sufOf(userBranch);
      const bal = suf ? nOf(m['qty_' + suf]) : (nOf(m.qty_m) + nOf(m.qty_s) + nOf(m.qty_b));
      document.getElementById('lookup-code').value  = m.code;
      document.getElementById('lookup-name').value  = m.name;
      document.getElementById('lookup-stock').value = bal + (suf ? '' : ' (مجموع الفروع)');
      document.getElementById('lookup-type').value  = m.med ? 'دواء' : 'غير دواء';
      document.getElementById('lookup-min').value   = '';
      document.getElementById('lookup-result').innerHTML = '';
      document.getElementById('lookup-matches').innerHTML = '';
      document.getElementById('lookup-details').style.display = '';
      setTimeout(() => { const el = document.getElementById('lookup-min'); if (el) el.focus(); }, 30);
    }

    async function saveNewItem() {
      const code  = document.getElementById('lookup-code').value.trim();
      const name  = document.getElementById('lookup-name').value.trim();
      const stock = document.getElementById('lookup-stock').value;
      const type  = document.getElementById('lookup-type').value.trim();
      const minS  = document.getElementById('lookup-min').value.trim();
      if (!minS) { alert('برجاء إدخال الحد الأدنى'); return; }

      const btn = document.getElementById('save-btn');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      let success = false, err = '';
      try {
        const r = await fetch(SB_URL_API + '/rest/v1/rpc/set_stock_limit', {
          method: 'POST', headers: await sbH({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ p_code: code, p_branch: userBranch, p_min: Number(minS), p_name: name, p_type: type }) });
        const j = await r.json();
        success = !!(j && j.success);
        err = (j && j.error) || '';
      } catch (e) { err = 'مفيش اتصال'; }

      if (success) { resetLookup(); await loadAll(); }
      else alert('❌ فشل الحفظ' + (err ? ' — ' + err : ''));

      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ الصنف';
    }

    function resetLookup() {
      document.getElementById('lookup-code').value       = '';
      document.getElementById('lookup-name-q').value     = '';
      document.getElementById('lookup-matches').innerHTML = '';
      document.getElementById('lookup-name').value       = '';
      document.getElementById('lookup-stock').value      = '';
      document.getElementById('lookup-type').value       = '';
      document.getElementById('lookup-min').value        = '';
      document.getElementById('lookup-result').innerHTML = '';
      document.getElementById('lookup-details').style.display = 'none';
    }

    async function saveMinStock(id, newMin) {
      const item = allData.find(x => String(x.id) === String(id));
      const success = await sbStockLimitUpdate(id, { min_stock: (newMin !== '' ? Number(newMin) : null) });
      if (success) {
        if (item) {
          item.min_stock = parseFloat(newMin);
          const stock = parseFloat(item.current_stock) || 0;
          const minS  = parseFloat(newMin) || 0;
          const isBelow = stock < minS;
          const row   = document.getElementById(`row-${id}`);
          const badge = document.getElementById(`badge-${id}`);
          const stockEl = document.getElementById(`stock-${id}`);
          if (row)    row.className = isBelow ? 'below-min' : '';
          if (badge)  { badge.className = `stock-badge ${isBelow ? 'badge-danger' : 'badge-ok'}`; badge.textContent = isBelow ? '⚠️ تحت الحد' : '✅ كافي'; }
          if (stockEl) stockEl.style.color = isBelow ? 'var(--danger)' : 'var(--success)';
          renderStats();
        }
      } else { alert('❌ فشل التحديث'); loadAll(); }
    }

    async function refreshItem(id, itemCode) {
      try {
        const item = allData.find(x => String(x.id) === String(id));

        // الرصيد الحالي لحظياً من مخزون الفرع (بدل get_balance) — الرصيد غير مخزّن، بيتحسب مباشرة
        const balance = await sbItemBalance(itemCode, item?.branch || userBranch);

        if (item) {
          item.current_stock = balance;
          const stock   = parseFloat(balance) || 0;
          const minS    = parseFloat(item.min_stock) || 0;
          const isBelow = stock < minS;
          const row     = document.getElementById(`row-${id}`);
          const badge   = document.getElementById(`badge-${id}`);
          const stockEl = document.getElementById(`stock-${id}`);
          if (row)    row.className = isBelow ? 'below-min' : '';
          if (badge)  { badge.className = `stock-badge ${isBelow ? 'badge-danger' : 'badge-ok'}`; badge.textContent = isBelow ? '⚠️ تحت الحد' : '✅ كافي'; }
          if (stockEl) { stockEl.textContent = stock; stockEl.style.color = isBelow ? 'var(--danger)' : 'var(--success)'; }
          renderStats();
        }
      } catch(e) { alert('❌ خطأ في الاتصال'); }
    }

    async function deleteItem(id, itemName) {
      if (!confirm(`هل تريد حذف "${itemName}" من قائمة الحد الأدنى للمخزون؟`)) return;
      const success = await sbStockLimitDelete(id);
      if (success) { allData = allData.filter(x => String(x.id) !== String(id)); renderStats(); applyFilter(); }
      else alert('❌ فشل الحذف');
    }
  </script>
</body>
</html>
