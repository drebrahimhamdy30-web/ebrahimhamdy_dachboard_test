<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>خدمة العملاء - Phalix</title>
  <link rel="stylesheet" href="tokens.css?v=20260906">
  <script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض.
     ⚠️ من غيره الصفحة مابتقولش هي فاتحة ولا داكنة، فقاعدة
     prefers-color-scheme في tokens.css بتتبع **إعداد الجهاز** بدل
     إعداد التطبيق — وده اللي كان بيخلّي ويب الطيار وكروت شاشة
     التوزيع تطلع داكنة عند ناس جهازهم على الوضع الليلي.
     الافتراضي فاتح: الوضع الليلي باختيار صريح من الزر بس. */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .pagination-row { display:flex; justify-content:center; gap:12px; margin-top:16px; align-items:center; }
    .page-info { font-size:0.8rem; color:var(--text-secondary); font-weight:700; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-headset"></i> معالجة طلبات
          <span class="highlight" id="display-branch">...</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <!-- الأدمن (أو أي حساب بلا فرع) بيختار الفرع؛ موظف الفرع مابيشوفش القائمة أصلاً -->
          <select id="branchFilter" data-branches class="form-select" hidden
                  onchange="onBranchChange()" style="min-width:150px;">
            <option value="">كل الفروع</option>
          </select>
          <div class="field-icon-wrap" style="min-width:220px;">
            <i class="fas fa-search field-icon"></i>
            <input type="text" id="searchInput" class="form-input"
              placeholder="بحث..."
              oninput="onFilterChange()"
              style="padding-right:34px;">
          </div>
          <label class="check-label">
            <input type="checkbox" id="hideDone" checked onchange="onHideDoneChange()"> إخفاء المنفذ
          </label>
          <!-- عرض «المنفّذ» بيفتح آلاف الصفوف، فبيتقيّد بمدة. العرض المفتوح لأ. -->
          <select id="periodFilter" class="form-select" hidden
                  onchange="onFilterReload()" style="min-width:130px;">
            <option value="30">آخر شهر</option>
            <option value="90">آخر 3 شهور</option>
            <option value="180">آخر 6 شهور</option>
            <option value="0">كل التاريخ</option>
          </select>
          <button class="btn btn-primary" onclick="loadCSData()">
            <i class="fas fa-sync-alt"></i> تحديث
          </button>
          <span class="page-info" id="result-count"></span>
        </div>
      </div>

      <div id="truncated-warn" hidden
           style="margin-bottom:12px;padding:10px 14px;border-radius:8px;
                  background:var(--danger-bg,#fee2e2);color:var(--danger,#b91c1c);
                  font-size:0.82rem;font-weight:700;">
        <i class="fas fa-triangle-exclamation"></i>
        البيانات وصلت ناقصة — فيه طلبات مش ظاهرة. حدّث الصفحة، ولو فضلت الرسالة بلّغ المسؤول.
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>اسم الصنف</th>
              <th>كود الصنف</th>
              <th>اسم العميل</th>
              <th>كود العميل</th>
              <th>رد المشتريات</th>
              <th>الحالة</th>
              <th>إجراء خدمة العملاء</th>
              <th>حفظ</th>
            </tr>
          </thead>
          <tbody id="data-list">
            <tr class="loading-row"><td colspan="9">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination-row" id="pager" hidden>
        <button class="btn btn-sm" id="prev-page" onclick="changePage(-1)"><i class="fas fa-chevron-right"></i></button>
        <span class="page-info" id="page-info">صفحة 1 من 1</span>
        <button class="btn btn-sm" id="next-page" onclick="changePage(1)"><i class="fas fa-chevron-left"></i></button>
      </div>
    </div>
  </div>

<script src="config.js?v=20260904c"></script>
<script src="session.js?v=20260905"></script>
<script src="branches.js?v=20260904d"></script>
<script src="pages.js?v=20260904d"></script>
<script src="brand.js?v=20260904c"></script>
<script src="api.js?v=20260923cs"></script>
  <script>
    let activeUser = null;
    let userBranch = '';
    let allItems   = [];

    // الأدمن مالوش فرع مخزّن، فـSession.branch() بترجع فاضي — وقبل كده كان
    // شرط isMyBranch بيقارن بالفاضي فالشاشة تطلع فاضية تمامًا بدل ما تعرض الكل.
    let SEE_ALL = false;
    const seeAllBranches = b => !b || b === 'عام' || b === 'Admin' || b === 'كل الفروع';
    // الفرع المعروض دلوقتي: للأدمن = اللي مختاره، ولغيره = فرعه هو
    const activeBranch = () => SEE_ALL
      ? (document.getElementById('branchFilter').value || '')
      : userBranch;

    const PAGE_SIZE = 50;
    let currentPage = 1;

    // خريطة (اسم مستخدم/موبايل → فرع) عشان نطابق فرع الطالب حتى لو داخل بحساب فردي
    let userBranchMap = {};
    const LEGACY_USER_BRANCH = {
      mangersan: 'سان ستيفانو', mangermamora: 'المعمورة',
      inventorymamora: 'المعمورة', inventorysbishr: 'سيدى بشر'
    };
    function branchOf(u){
      if (!u) return u;
      return userBranchMap[u] || LEGACY_USER_BRANCH[u] || u;
    }
    async function loadUserBranchMap(){
      if (Object.keys(userBranchMap).length) return;
      try {
        const res = await fetch(SB_URL_API + '/rest/v1/rpc/get_user_branch_map', {
          method:'POST',
          headers: await sbH({ 'Content-Type':'application/json' }),
          body:'{}'
        });
        const d = await res.json();
        userBranchMap = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
      } catch(e){ userBranchMap = {}; }
    }

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (Session.branch() || '').trim();
        SEE_ALL    = Session.isAdmin() || seeAllBranches(userBranch);
        if (SEE_ALL) document.getElementById('branchFilter').hidden = false;
        updateBranchLabel();
        loadCSData();
      }
    });

    function updateBranchLabel() {
      const b = activeBranch();
      document.getElementById('display-branch').textContent = b || 'كل الفروع';
    }

    /* المدة بتتطبّق على عرض «المُنفَّذ» بس.
       ⚠️ ماتخليهاش تشمل الطلبات المفتوحة: فيه طلبات عميل مفتوحة من مايو،
          وأي تقييد بالتاريخ هيخفيها تاني زي ما كان بيحصل مع سقف الـ1000. */
    function periodSince() {
      if (document.getElementById('hideDone').checked) return null;
      const days = parseInt(document.getElementById('periodFilter').value, 10) || 0;
      if (!days) return null;
      return new Date(Date.now() - days * 86400000).toISOString();
    }

    function onHideDoneChange() {
      const hide = document.getElementById('hideDone').checked;
      document.getElementById('periodFilter').hidden = hide;
      loadCSData();
    }
    function onFilterReload() { loadCSData(); }

    // أي تغيير في الفلتر بيرجّع لأول صفحة — من غير زر «تطبيق»
    function onFilterChange() { currentPage = 1; renderItems(); }
    function onBranchChange() { currentPage = 1; updateBranchLabel(); loadCSData(); }

    function changePage(step) {
      currentPage += step;
      renderItems();
      const w = document.querySelector('.table-wrap');
      if (w) w.scrollIntoView({ behavior:'smooth', block:'start' });
    }

    async function loadCSData() {
      try {
        currentPage = 1;
        await loadUserBranchMap();
        const hideDone = document.getElementById('hideDone').checked;
        // الـRPC بيفلتر على الفرع الطالب وبيحوّل حسابات الموبايل لفروعها على السيرفر،
        // فبنبعتله الفرع المختار بدل ما نسحب الكل ونرمي الباقي في المتصفح.
        // شيل «إخفاء المُنفَّذ» = آلاف الصفوف على دفعات، فبنطمّن المستخدم إنها ماشية.
        // رجّع صف التحميل الأول — لولا كده تغيير الفرع يفضل عارض بيانات الفرع القديم
        document.getElementById('data-list').innerHTML =
          '<tr class="loading-row"><td colspan="9">جاري التحميل...</td></tr>';
        const loadingCell = document.querySelector('#data-list .loading-row td');
        const response = await sbCsOrders(activeBranch(), hideDone, {
          since: periodSince(),
          onProgress: count => {
            if (loadingCell) loadingCell.textContent = `جاري التحميل... (${count} صف)`;
          }
        });
        allItems = (response[0]?.data) ? response[0].data : (response.data || response);
        // لو الجلب وقف نص الطريق نقولها صراحة — العطل القديم كان صامت تمامًا
        document.getElementById('truncated-warn').hidden = !response.incomplete;
        renderItems();
      } catch(e) {
        document.getElementById('truncated-warn').hidden = true;
        document.getElementById('data-list').innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--danger);padding:30px;">❌ فشل الاتصال</td></tr>';
      }
    }

    function renderItems() {
      const tbody     = document.getElementById('data-list');
      const hideDone  = document.getElementById('hideDone').checked;
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

      const viewBranch = activeBranch();
      const filtered = allItems.filter(item => {
        // على «كل الفروع» مفيش قصر على فرع؛ غير كده بنقارن بالفرع المعروض
        const isMyBranch  = !viewBranch ||
          Branches.same(branchOf(item.user), viewBranch) ||
          String(branchOf(item.user)).trim() === String(viewBranch).trim();
        const validStates = ['ordered', 'unavailable', 'transferred'];
        const isResponded = validStates.includes(String(item.state || "").trim().toLowerCase());
        const hasAction   = (item.cust_state && item.cust_state !== "" && item.cust_state !== "null" && item.cust_state !== "حاولنا التواصل مع العميل");
        const hasCustomer = (
          (item.cust_name && item.cust_name.trim() !== "" && item.cust_name !== "null") ||
          (item.cust_code && item.cust_code.trim() !== "" && item.cust_code !== "null")
        );
        // بعد 3 محاولات تواصل مع العميل يختفي الطلب من الشاشة (يُعتبر تم التعامل معه)
        const attempts = parseInt(item.contact_attempts) || 0;

        if (!hasCustomer)                       return false;
        if (hideDone && (hasAction || attempts >= 3)) return false;
        if (!isMyBranch || !isResponded)        return false;

        const searchMatch = !searchVal || [
          item.item_name, item.item_code,
          item.cust_name, item.cust_code,
          item.company,   item.cust_state,
          item.note
        ].some(val => String(val || '').toLowerCase().includes(searchVal));

        return searchMatch;
      });

      // العدّاد والصفحات بتتحسب على كل النتائج المفلترة، مش على الصفحة المعروضة
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const pager = document.getElementById('pager');
      pager.hidden = (filtered.length <= PAGE_SIZE);
      document.getElementById('page-info').textContent = `صفحة ${currentPage} من ${totalPages}`;
      document.getElementById('prev-page').disabled = (currentPage === 1);
      document.getElementById('next-page').disabled = (currentPage === totalPages);
      document.getElementById('result-count').textContent =
        filtered.length ? `${filtered.length} طلب` : '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج</td></tr>`;
        return;
      }

      const start = (currentPage - 1) * PAGE_SIZE;
      tbody.innerHTML = filtered.slice(start, start + PAGE_SIZE).map(item => {
        const currentAction = (item.cust_state && item.cust_state !== "null") ? item.cust_state : "";
        const isDone        = (currentAction !== "" && currentAction !== "حاولنا التواصل مع العميل");
        const attempts      = parseInt(item.contact_attempts) || 0;
        const s             = String(item.state || "").trim().toLowerCase();
        // شريط لوني لحالة الإجراء: أخضر=تم الإبلاغ، أحمر=يحتاج متابعة، برتقالي=حاولنا التواصل، رمادي=ملغى، أصفر=قيد المعالجة
        const stColor =
            currentAction === 'استلم'                    ? '#0891b2' :
            currentAction === 'متوفر وتم ابلاغ العميل'   ? '#16a34a' :
            currentAction === 'غير متوفر وتم ابلاغ العميل' ? '#b91c1c' :
            currentAction === 'غير متوفر يحتاج متابعة'   ? '#dc2626' :
            currentAction === 'حاولنا التواصل مع العميل' ? '#ea580c' :
            currentAction === 'العميل الغى الطلب'        ? '#6b7280' :
            '#f59e0b';

        const dateObj = item.createdAt ? new Date(item.createdAt) : null;
        const dateStr = dateObj
          ? dateObj.toLocaleDateString('ar-EG', {month:'numeric', day:'numeric'})
          : '---';
        const timeStr = dateObj
          ? dateObj.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true})
          : '';

        return `
          <tr class="${isDone ? 'row-done' : ''}">
            <td style="font-size:0.75rem;line-height:1.6;white-space:nowrap;box-shadow:inset -6px 0 0 0 ${stColor};">
              ${dateStr}<br>
              <span style="color:var(--text-muted);font-size:0.7rem;">${timeStr}</span>
            </td>
            <td style="text-align:right;font-weight:700;">
              ${item.item_name || item.item || '---'}
            </td>
            <td><code style="font-size:0.82rem;color:var(--text-secondary);">${(item.item_code && item.item_code !== 'null') ? item.item_code : ''}</code></td>
            <td style="font-size:0.82rem;">
              ${(item.cust_name && item.cust_name !== 'null') ? item.cust_name : ''}
              ${(item.note && item.note !== 'null') ? `
                <div style="font-size:0.72rem;color:var(--accent-dark);margin-top:3px;">
                  <i class="fas fa-sticky-note"></i> ${item.note}
                </div>` : ''}
            </td>
            <td><code style="font-size:0.82rem;color:var(--text-secondary);">${(item.cust_code && item.cust_code !== 'null') ? item.cust_code : ''}</code></td>
            <td><small style="color:var(--text-secondary);">${(item.company && item.company !== 'null') ? item.company : ''}</small></td>
            <td>
              <span class="badge ${s === 'ordered' ? 'badge-green' : 'badge-red'}">
                ${s === 'ordered' ? 'تم الطلب' : (s === 'transferred' ? 'محول' : 'غير متوفر')}
              </span>
            </td>
            <td>
              <select id="select-${item.id}" class="table-select" ${isDone ? 'disabled' : ''}>
                <option value="" disabled ${currentAction === "" ? 'selected' : ''}>اختر إجراء...</option>
                <option value="استلم"                    ${currentAction === 'استلم'                    ? 'selected' : ''}>استلم 📦</option>
                <option value="متوفر وتم ابلاغ العميل"   ${currentAction === 'متوفر وتم ابلاغ العميل'   ? 'selected' : ''}>متوفر وتم ابلاغ العميل ✅</option>
                <option value="غير متوفر وتم ابلاغ العميل" ${currentAction === 'غير متوفر وتم ابلاغ العميل' ? 'selected' : ''}>غير متوفر وتم ابلاغ العميل ❌</option>
                <option value="غير متوفر يحتاج متابعة"   ${currentAction === 'غير متوفر يحتاج متابعة'   ? 'selected' : ''}>غير متوفر يحتاج متابعة 🔍</option>
                <option value="حاولنا التواصل مع العميل" ${currentAction === 'حاولنا التواصل مع العميل' ? 'selected' : ''}>حاولنا التواصل مع العميل 📞</option>
                <option value="العميل الغى الطلب"        ${currentAction === 'العميل الغى الطلب'        ? 'selected' : ''}>العميل الغى الطلب 🚫</option>
              </select>
              ${(currentAction === 'حاولنا التواصل مع العميل' || attempts > 0) ? `<div style="margin-top:5px;font-size:0.74rem;color:var(--accent-dark);font-weight:700;"><i class="fas fa-phone-alt"></i> حاولنا التواصل: ${attempts || 1} مرة</div>` : ''}
            </td>
            <td>
              ${!isDone
                ? `<button class="btn btn-success btn-sm" onclick="submitCSAction(event, '${item.id}')">تم</button>`
                : `<span style="color:var(--success);font-weight:bold;"><i class="fas fa-check-circle"></i></span>`}
            </td>
          </tr>`;
      }).join('');
    }

    async function submitCSAction(event, id) {
      const btn      = event.target;
      const decision = document.getElementById(`select-${id}`).value;
      if (!decision) { alert("برجاء اختيار إجراء من القائمة"); return; }
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const patch = { cust_state: decision };
      if (decision === "حاولنا التواصل مع العميل") {
        const item = allItems.find(x => x.id == id);
        const prev = (item && parseInt(item.contact_attempts)) || 0;
        patch.contact_attempts = prev + 1;   // كل مرة نختارها يزيد العداد والطلب يفضل مفتوح للمتابعة
      }
      const success = await sbTaskUpdate(id, patch);

      if (success) {
        loadCSData();
      } else {
        alert("⚠️ فشل التحديث");
        btn.disabled    = false;
        btn.textContent = "تم";
      }
    }
  </script>
</body>
</html>
