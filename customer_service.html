<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>خدمة العملاء - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-headset"></i> معالجة طلبات
          <span class="highlight" id="display-branch">...</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <div class="field-icon-wrap" style="min-width:220px;">
            <i class="fas fa-search field-icon"></i>
            <input type="text" id="searchInput" class="form-input"
              placeholder="بحث..."
              oninput="renderItems()"
              style="padding-right:34px;">
          </div>
          <label class="check-label">
            <input type="checkbox" id="hideDone" checked onchange="loadCSData()"> إخفاء المنفذ
          </label>
          <button class="btn btn-primary" onclick="loadCSData()">
            <i class="fas fa-sync-alt"></i> تحديث
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>اسم الصنف</th>
              <th>كود الصنف</th>
              <th>اسم العميل</th>
              <th>كود العميل</th>
              <th>رد المشتريات</th>
              <th>الحالة</th>
              <th>إجراء خدمة العملاء</th>
              <th>حفظ</th>
            </tr>
          </thead>
          <tbody id="data-list">
            <tr class="loading-row"><td colspan="9">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script src="config.js?v=20260903"></script>
<script src="session.js?v=20260903"></script>
<script src="api.js?v=tt20260830"></script>
  <script>
    let activeUser = null;
    let userBranch = '';
    let allItems   = [];

    // خريطة (اسم مستخدم/موبايل → فرع) عشان نطابق فرع الطالب حتى لو داخل بحساب فردي
    let userBranchMap = {};
    const LEGACY_USER_BRANCH = {
      mangersan: 'سان ستيفانو', mangermamora: 'المعمورة',
      inventorymamora: 'المعمورة', inventorysbishr: 'سيدى بشر'
    };
    function branchOf(u){
      if (!u) return u;
      return userBranchMap[u] || LEGACY_USER_BRANCH[u] || u;
    }
    async function loadUserBranchMap(){
      if (Object.keys(userBranchMap).length) return;
      try {
        const res = await fetch(SB_URL_API + '/rest/v1/rpc/get_user_branch_map', {
          method:'POST',
          headers:{ apikey:SB_ANON_API, Authorization:'Bearer '+SB_ANON_API, 'Content-Type':'application/json' },
          body:'{}'
        });
        const d = await res.json();
        userBranchMap = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
      } catch(e){ userBranchMap = {}; }
    }

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (Session.branch()).trim();
        document.getElementById('display-branch').textContent = userBranch;
        loadCSData();
      }
    });

    async function loadCSData() {
      try {
        await loadUserBranchMap();
        const hideDone = document.getElementById('hideDone').checked;
        const response = await sbCsOrders(userBranch, hideDone);   // hideDone=true → بس اللي محتاج إجراء
        allItems = (response[0]?.data) ? response[0].data : (response.data || response);
        renderItems();
      } catch(e) {
        document.getElementById('data-list').innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--danger);padding:30px;">❌ فشل الاتصال</td></tr>';
      }
    }

    function renderItems() {
      const tbody     = document.getElementById('data-list');
      const hideDone  = document.getElementById('hideDone').checked;
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = allItems.filter(item => {
        const isMyBranch  = (String(branchOf(item.user)).trim() === String(userBranch).trim());
        const validStates = ['ordered', 'unavailable', 'transferred'];
        const isResponded = validStates.includes(String(item.state || "").trim().toLowerCase());
        const hasAction   = (item.cust_state && item.cust_state !== "" && item.cust_state !== "null" && item.cust_state !== "حاولنا التواصل مع العميل");
        const hasCustomer = (
          (item.cust_name && item.cust_name.trim() !== "" && item.cust_name !== "null") ||
          (item.cust_code && item.cust_code.trim() !== "" && item.cust_code !== "null")
        );
        // بعد 3 محاولات تواصل مع العميل يختفي الطلب من الشاشة (يُعتبر تم التعامل معه)
        const attempts = parseInt(item.contact_attempts) || 0;

        if (!hasCustomer)                       return false;
        if (hideDone && (hasAction || attempts >= 3)) return false;
        if (!isMyBranch || !isResponded)        return false;

        const searchMatch = !searchVal || [
          item.item_name, item.item_code,
          item.cust_name, item.cust_code,
          item.company,   item.cust_state,
          item.note
        ].some(val => String(val || '').toLowerCase().includes(searchVal));

        return searchMatch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const currentAction = (item.cust_state && item.cust_state !== "null") ? item.cust_state : "";
        const isDone        = (currentAction !== "" && currentAction !== "حاولنا التواصل مع العميل");
        const attempts      = parseInt(item.contact_attempts) || 0;
        const s             = String(item.state || "").trim().toLowerCase();
        // شريط لوني لحالة الإجراء: أخضر=تم الإبلاغ، أحمر=يحتاج متابعة، برتقالي=حاولنا التواصل، رمادي=ملغى، أصفر=قيد المعالجة
        const stColor =
            currentAction === 'استلم'                    ? '#0891b2' :
            currentAction === 'متوفر وتم ابلاغ العميل'   ? '#16a34a' :
            currentAction === 'غير متوفر وتم ابلاغ العميل' ? '#b91c1c' :
            currentAction === 'غير متوفر يحتاج متابعة'   ? '#dc2626' :
            currentAction === 'حاولنا التواصل مع العميل' ? '#ea580c' :
            currentAction === 'العميل الغى الطلب'        ? '#6b7280' :
            '#f59e0b';

        const dateObj = item.createdAt ? new Date(item.createdAt) : null;
        const dateStr = dateObj
          ? dateObj.toLocaleDateString('ar-EG', {month:'numeric', day:'numeric'})
          : '---';
        const timeStr = dateObj
          ? dateObj.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true})
          : '';

        return `
          <tr class="${isDone ? 'row-done' : ''}">
            <td style="font-size:0.75rem;line-height:1.6;white-space:nowrap;box-shadow:inset -6px 0 0 0 ${stColor};">
              ${dateStr}<br>
              <span style="color:var(--text-muted);font-size:0.7rem;">${timeStr}</span>
            </td>
            <td style="text-align:right;font-weight:700;">
              ${item.item_name || item.item || '---'}
            </td>
            <td><code style="font-size:0.82rem;color:var(--text-secondary);">${(item.item_code && item.item_code !== 'null') ? item.item_code : ''}</code></td>
            <td style="font-size:0.82rem;">
              ${(item.cust_name && item.cust_name !== 'null') ? item.cust_name : ''}
              ${(item.note && item.note !== 'null') ? `
                <div style="font-size:0.72rem;color:var(--accent-dark);margin-top:3px;">
                  <i class="fas fa-sticky-note"></i> ${item.note}
                </div>` : ''}
            </td>
            <td><code style="font-size:0.82rem;color:var(--text-secondary);">${(item.cust_code && item.cust_code !== 'null') ? item.cust_code : ''}</code></td>
            <td><small style="color:var(--text-secondary);">${(item.company && item.company !== 'null') ? item.company : ''}</small></td>
            <td>
              <span class="badge ${s === 'ordered' ? 'badge-green' : 'badge-red'}">
                ${s === 'ordered' ? 'تم الطلب' : (s === 'transferred' ? 'محول' : 'غير متوفر')}
              </span>
            </td>
            <td>
              <select id="select-${item.id}" class="table-select" ${isDone ? 'disabled' : ''}>
                <option value="" disabled ${currentAction === "" ? 'selected' : ''}>اختر إجراء...</option>
                <option value="استلم"                    ${currentAction === 'استلم'                    ? 'selected' : ''}>استلم 📦</option>
                <option value="متوفر وتم ابلاغ العميل"   ${currentAction === 'متوفر وتم ابلاغ العميل'   ? 'selected' : ''}>متوفر وتم ابلاغ العميل ✅</option>
                <option value="غير متوفر وتم ابلاغ العميل" ${currentAction === 'غير متوفر وتم ابلاغ العميل' ? 'selected' : ''}>غير متوفر وتم ابلاغ العميل ❌</option>
                <option value="غير متوفر يحتاج متابعة"   ${currentAction === 'غير متوفر يحتاج متابعة'   ? 'selected' : ''}>غير متوفر يحتاج متابعة 🔍</option>
                <option value="حاولنا التواصل مع العميل" ${currentAction === 'حاولنا التواصل مع العميل' ? 'selected' : ''}>حاولنا التواصل مع العميل 📞</option>
                <option value="العميل الغى الطلب"        ${currentAction === 'العميل الغى الطلب'        ? 'selected' : ''}>العميل الغى الطلب 🚫</option>
              </select>
              ${(currentAction === 'حاولنا التواصل مع العميل' || attempts > 0) ? `<div style="margin-top:5px;font-size:0.74rem;color:var(--accent-dark);font-weight:700;"><i class="fas fa-phone-alt"></i> حاولنا التواصل: ${attempts || 1} مرة</div>` : ''}
            </td>
            <td>
              ${!isDone
                ? `<button class="btn btn-success btn-sm" onclick="submitCSAction(event, '${item.id}')">تم</button>`
                : `<span style="color:var(--success);font-weight:bold;"><i class="fas fa-check-circle"></i></span>`}
            </td>
          </tr>`;
      }).join('');
    }

    async function submitCSAction(event, id) {
      const btn      = event.target;
      const decision = document.getElementById(`select-${id}`).value;
      if (!decision) { alert("برجاء اختيار إجراء من القائمة"); return; }
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const patch = { cust_state: decision };
      if (decision === "حاولنا التواصل مع العميل") {
        const item = allItems.find(x => x.id == id);
        const prev = (item && parseInt(item.contact_attempts)) || 0;
        patch.contact_attempts = prev + 1;   // كل مرة نختارها يزيد العداد والطلب يفضل مفتوح للمتابعة
      }
      const success = await sbTaskUpdate(id, patch);

      if (success) {
        loadCSData();
      } else {
        alert("⚠️ فشل التحديث");
        btn.disabled    = false;
        btn.textContent = "تم";
      }
    }
  </script>
</body>
</html>
