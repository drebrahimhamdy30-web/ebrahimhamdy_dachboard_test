<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>سجل الجرد - صيدليات د. إبراهيم</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .tabs-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .tab-btn {
      padding:8px 18px; border-radius:20px; border:1px solid var(--border);
      background:var(--surface-3); color:var(--text-secondary);
      font-size:0.88rem; cursor:pointer; transition:all 0.2s;
    }
    .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; }
    .btn-done {
      padding:5px 12px; font-size:0.78rem; border-radius:8px;
      border:1px solid var(--success,#16a34a); background:transparent;
      color:var(--success,#16a34a); cursor:pointer; transition:all 0.2s; white-space:nowrap;
    }
    .btn-done:hover, .btn-done.active { background:var(--success,#16a34a); color:#fff; }
    .btn-skip {
      padding:5px 12px; font-size:0.78rem; border-radius:8px;
      border:1px solid var(--text-muted); background:transparent;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s; white-space:nowrap;
    }
    .btn-skip:hover, .btn-skip.active { background:var(--text-muted); color:#fff; }
    .btn-balance {
      padding:4px 10px; font-size:0.75rem; border-radius:8px;
      border:1px solid var(--border); background:var(--surface-3);
      cursor:pointer; color:var(--text-secondary); white-space:nowrap; transition:all 0.2s;
    }
    .btn-balance:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
    .balance-val { font-weight:700; font-size:1rem; color:var(--success,#16a34a); }
    .summary-bar {
      margin-top:12px; padding:10px 16px; background:var(--surface-3);
      border-radius:10px; font-size:0.85rem; display:flex; gap:20px; flex-wrap:wrap;
    }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-clipboard-list"></i> سجل الجرد
          <span class="highlight" id="branch-tag"></span>
        </div>
        <button class="btn btn-primary" onclick="loadCurrentTab()">
          <i class="fas fa-sync-alt"></i> تحديث
        </button>
      </div>

      <div class="tabs-bar">
        <button class="tab-btn active" onclick="switchTab('تلاجة', this)">🧊 تلاجة</button>
        <button class="tab-btn" onclick="switchTab('غوالي', this)">💊 غوالي</button>
        <button class="tab-btn" onclick="switchTab('سريع', this)">⚡ سريع</button>
        <button class="tab-btn" onclick="switchTab('مرتجعات', this)">🔄 مرتجعات</button>
      </div>

      <div style="margin-bottom:12px;">
        <div class="field-icon-wrap" style="max-width:280px;">
          <i class="fas fa-search field-icon"></i>
          <input type="text" id="searchInput" class="form-input"
            placeholder="بحث بالكود أو الاسم..."
            oninput="applyFilter()"
            style="padding-right:34px;">
        </div>
      </div>

      <div class="table-wrap">
        <table id="inv-table">
          <thead id="inv-thead"></thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="6">⏳ جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="summary-bar" id="summary-bar" style="display:none;">
        <span>📦 إجمالي: <b id="sum-total">0</b></span>
        <span style="color:var(--success,#16a34a);">✅ تم الجرد: <b id="sum-done">0</b></span>
        <span style="color:var(--text-muted);">⏭️ تجاهل: <b id="sum-skip">0</b></span>
        <span style="color:var(--warning);">⏳ لم يُجرد: <b id="sum-pending">0</b></span>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script>
    const BALANCE_URL = "https://agent.ebrahimhamdy.com/webhook/get_balance";

const TAB_COLS = {
  'تلاجة':    ['code', 'itm_name_ar'],
  'غوالي':    ['code', 'itm_name_ar', 'itm_name_en'],
  'سريع':     ['code', 'itm_name_ar'],
  'مرتجعات':  ['code', 'itm_name_ar', 'itm_name_en', 'time', 'bill_no'],
  'erp':      ['code', 'itm_name_ar', 'itm_name_en']
};

    const COL_LABELS = {
      code:        'كود',
      itm_name_ar: 'الاسم عربي',
      itm_name_en: 'الاسم إنجليزي',
      time:        'تاريخ المرتجع',
      bill_no:     'رقم الفاتورة'
    };

    let activeUser  = null;
    let rawData     = [];
    let currentTab  = 'تلاجة';
    let userBranch  = '';

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (localStorage.getItem('userBranch') || '').trim();
        document.getElementById('branch-tag').textContent = userBranch;
        loadCurrentTab();
      }
    });

    function switchTab(tabName, btn) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('searchInput').value = '';
      loadCurrentTab();
    }

    async function loadCurrentTab() {
      const tbody = document.getElementById('table-body');
      const cols  = TAB_COLS[currentTab] || ['code', 'itm_name_ar'];
      tbody.innerHTML = `<tr class="loading-row"><td colspan="${cols.length + 3}">⏳ جاري جلب البيانات...</td></tr>`;
      document.getElementById('summary-bar').style.display = 'none';

      try {
const items = await fetchInventory();
rawData = items.filter(item => {
  const typeMatch   = (item.type || '').toLowerCase() === currentTab.toLowerCase();
  const branchMatch = (item.branch || '') === userBranch;
  return typeMatch && branchMatch;
});
        buildTableHeader();
        applyFilter();
      } catch(e) {
        tbody.innerHTML = `<tr><td colspan="${cols.length + 3}" style="text-align:center;color:var(--danger);padding:30px;">❌ خطأ في الاتصال</td></tr>`;
      }
    }

    function buildTableHeader() {
      const cols  = TAB_COLS[currentTab] || ['code', 'itm_name_ar'];
      document.getElementById('inv-thead').innerHTML = `
        <tr>
          ${cols.map(c => `<th>${COL_LABELS[c] || c}</th>`).join('')}
          <th>الرصيد الحالي</th>
          <th>إجراء</th>
          <th>حالة الحفظ</th>
        </tr>`;
    }

    function applyFilter() {
      const search   = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = !search
        ? rawData
        : rawData.filter(item =>
            ['code','itm_name_ar','itm_name_en','bill_no']
              .some(k => (item[k] || '').toLowerCase().includes(search))
          );
      renderTable(filtered);
    }

    function renderTable(items) {
      const tbody = document.getElementById('table-body');
      const cols  = TAB_COLS[currentTab] || ['code', 'itm_name_ar'];

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${cols.length + 3}" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد أصناف</td></tr>`;
        updateSummary();
        return;
      }

      tbody.innerHTML = '';
      items.forEach(item => {
        const id     = item.id;
        const isDone = item.done === true || item.done === 'true';
        const isSkip = item.skip === true || item.skip === 'true';

        let timeVal = item.time || '';
        if (timeVal) {
          try { timeVal = new Date(timeVal).toLocaleDateString('ar-EG'); } catch(e) {}
        }

        const colCells = cols.map(c => {
          const val = c === 'time' ? timeVal : (item[c] || '---');
          return `<td style="font-size:0.82rem;">${val}</td>`;
        }).join('');

        const tr = document.createElement('tr');
        tr.id = `row-${id}`;
        tr.innerHTML = `
          ${colCells}
          <td id="bal-cell-${id}">
            <button class="btn-balance" onclick="fetchBalance('${id}', '${item.code || ''}', this)">
              <i class="fas fa-database"></i> جلب الرصيد
            </button>
          </td>
          <td>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn-done ${isDone ? 'active' : ''}" id="done-btn-${id}"
                onclick="handleAction('${id}', 'done')">✅ تم الجرد</button>
              <button class="btn-skip ${isSkip ? 'active' : ''}" id="skip-btn-${id}"
                onclick="handleAction('${id}', 'skip')">⏭️ تجاهل</button>
            </div>
          </td>
          <td id="action-${id}">
            <i class="fas fa-circle" style="color:var(--text-muted);font-size:0.7rem;" title="يتم الحفظ تلقائياً"></i>
          </td>`;
        tbody.appendChild(tr);
      });

      updateSummary();
    }

    async function fetchBalance(id, code, btn) {
      const cell = document.getElementById(`bal-cell-${id}`);
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      try {
        const res  = await fetch(`${BALANCE_URL}?code=${encodeURIComponent(code)}&branch=${encodeURIComponent(userBranch)}`);
        const data = await res.json();

        if (data.found) {
          cell.innerHTML = `<span class="balance-val">${data.balance}</span>`;
        } else {
          cell.innerHTML = `<span style="color:var(--warning);font-size:0.78rem;">⚠️ غير موجود</span>`;
        }
      } catch(e) {
        cell.innerHTML = `<span style="color:var(--danger);font-size:0.78rem;">❌ فشل</span>`;
      }
    }

    async function handleAction(id, action) {
      const actionEl = document.getElementById(`action-${id}`);
      const doneBtn  = document.getElementById(`done-btn-${id}`);
      const skipBtn  = document.getElementById(`skip-btn-${id}`);
      const isDone   = action === 'done';
      const isSkip   = action === 'skip';

      doneBtn.classList.toggle('active', isDone);
      skipBtn.classList.toggle('active', isSkip);
      actionEl.innerHTML = '<i class="fas fa-spinner fa-spin" style="color:var(--text-muted);"></i>';

      const success = await updateData({
        id,
        done:   isDone,
        skip:   isSkip,
        type:   "جرد",
        action: "update_status"
      });

      if (success) {
        actionEl.innerHTML = '<i class="fas fa-check-circle" style="color:var(--success,#16a34a);font-size:1.1rem;"></i>';
        const item = rawData.find(x => x.id == id);
        if (item) { item.done = isDone; item.skip = isSkip; }
        updateSummary();
        setTimeout(() => {
          if (actionEl) actionEl.innerHTML = '<i class="fas fa-circle" style="color:var(--text-muted);font-size:0.7rem;"></i>';
        }, 2000);
      } else {
        actionEl.innerHTML = '<i class="fas fa-exclamation-circle" style="color:var(--danger);font-size:1.1rem;" title="فشل الحفظ"></i>';
        const oldItem = rawData.find(x => x.id == id);
        if (oldItem) {
          doneBtn.classList.toggle('active', oldItem.done === true || oldItem.done === 'true');
          skipBtn.classList.toggle('active', oldItem.skip === true || oldItem.skip === 'true');
        }
        alert("⚠️ فشل الحفظ، يرجى المحاولة مجدداً");
      }
    }

    function updateSummary() {
      const bar     = document.getElementById('summary-bar');
      const total   = rawData.length;
      const done    = rawData.filter(i => i.done === true || i.done === 'true').length;
      const skipped = rawData.filter(i => i.skip === true || i.skip === 'true').length;
      const pending = total - done - skipped;

      document.getElementById('sum-total').textContent   = total;
      document.getElementById('sum-done').textContent    = done;
      document.getElementById('sum-skip').textContent    = skipped;
      document.getElementById('sum-pending').textContent = pending;
      bar.style.display = 'flex';
    }
  </script>
</body>
</html>
