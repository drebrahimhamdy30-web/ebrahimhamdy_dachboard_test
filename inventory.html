<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>سجل الجرد - صيدليات د. إبراهيم</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .tabs-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .tab-btn {
      padding:8px 18px; border-radius:20px; border:1px solid var(--border);
      background:var(--surface-3); color:var(--text-secondary);
      font-size:0.88rem; cursor:pointer; transition:all 0.2s;
    }
    .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; }
    .btn-done {
      padding:5px 12px; font-size:0.78rem; border-radius:8px;
      border:1px solid var(--success,#16a34a); background:transparent;
      color:var(--success,#16a34a); cursor:pointer; transition:all 0.2s; white-space:nowrap;
    }
    .btn-done:hover, .btn-done.active { background:var(--success,#16a34a); color:#fff; }
    .btn-skip {
      padding:5px 12px; font-size:0.78rem; border-radius:8px;
      border:1px solid var(--text-muted); background:transparent;
      color:var(--text-muted); cursor:pointer; transition:all 0.2s; white-space:nowrap;
    }
    .btn-skip:hover, .btn-skip.active { background:var(--text-muted); color:#fff; }
    .btn-balance {
      padding:4px 10px; font-size:0.75rem; border-radius:8px;
      border:1px solid var(--border); background:var(--surface-3);
      cursor:pointer; color:var(--text-secondary); white-space:nowrap; transition:all 0.2s;
    }
    .btn-balance:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
    .balance-val { font-weight:700; font-size:1rem; color:var(--success,#16a34a); }
    .top-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .summary-inline {
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      font-size:0.8rem; padding:6px 12px;
      background:var(--surface-3); border-radius:20px;
    }
    .pagination { display:flex; gap:6px; align-items:center; }
    .page-btn {
      padding:4px 10px; border-radius:8px;
      border:1px solid var(--border); background:var(--surface-3);
      color:var(--text-secondary); cursor:pointer; transition:all 0.2s; font-size:0.8rem;
    }
    .page-btn:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
    .page-btn:disabled { opacity:0.4; cursor:not-allowed; }
    .filter-toggle {
      padding:6px 12px; border-radius:20px; font-size:0.8rem; cursor:pointer;
      border:1px solid var(--border); background:var(--surface-3);
      color:var(--text-secondary); white-space:nowrap; transition:all 0.2s;
    }
    .filter-toggle.all { background:var(--primary); color:#fff; border-color:var(--primary); }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-clipboard-list"></i> سجل الجرد
          <span class="highlight" id="branch-tag"></span>
        </div>
        <button class="btn btn-primary" onclick="loadCurrentTab()">
          <i class="fas fa-sync-alt"></i> تحديث
        </button>
      </div>

      <div class="tabs-bar">
        <button class="tab-btn active" onclick="switchTab('تلاجه', this)">🧊 تلاجة</button>
        <button class="tab-btn" onclick="switchTab('غوالى', this)">💊 غوالي</button>
        <button class="tab-btn" onclick="switchTab('fastmove', this)">⚡ سريع</button>
        <button class="tab-btn" onclick="switchTab('مرتجعات', this)">🔄 مرتجعات</button>
        <button class="tab-btn" onclick="switchTab('erp', this)">🖥️ ERP</button>
      </div>

      <div class="top-bar">
        <div class="field-icon-wrap" style="min-width:180px;flex:1;max-width:240px;">
          <i class="fas fa-search field-icon"></i>
          <input type="text" id="searchInput" class="form-input"
            placeholder="بحث بالكود أو الاسم..."
            oninput="onSearch()"
            style="padding-right:34px;">
        </div>

        <button id="filter-btn" class="filter-toggle" onclick="toggleFilter()">
          ⏳ غير مجروده
        </button>

        <div class="summary-inline">
          <span>📦 <b id="sum-total">0</b></span>
          <span style="color:var(--success,#16a34a);">✅ <b id="sum-done">0</b></span>
          <span style="color:var(--text-muted);">⏭️ <b id="sum-skip">0</b></span>
          <span style="color:var(--warning);">⏳ <b id="sum-pending">0</b></span>
        </div>

        <div class="pagination">
          <button class="page-btn" id="btn-prev" onclick="changePage(-1)">
            <i class="fas fa-chevron-right"></i>
          </button>
          <span id="page-info" style="font-size:0.8rem;color:var(--text-secondary);white-space:nowrap;">
            1 / 1
          </span>
          <button class="page-btn" id="btn-next" onclick="changePage(1)">
            <i class="fas fa-chevron-left"></i>
          </button>
        </div>
      </div>

      <!-- بحث عن رصيد أي كود (حتى لو خارج قائمة الجرد) -->
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--surface-3);border-radius:10px;">
        <span style="font-size:0.82rem;font-weight:700;color:var(--text-secondary);white-space:nowrap;">
          <i class="fas fa-magnifying-glass-dollar" style="color:var(--primary);"></i> بحث عن رصيد كود:
        </span>
        <input type="text" id="balance-code-input" class="form-input" style="width:160px;"
          placeholder="اكتب الكود..." inputmode="numeric"
          onkeydown="if(event.key==='Enter') lookupBalance()">
        <button class="btn btn-primary" onclick="lookupBalance()" id="balance-lookup-btn">
          <i class="fas fa-search"></i> بحث
        </button>
        <div id="balance-result" style="font-size:0.85rem;"></div>
      </div>

      <div class="table-wrap">
        <table id="inv-table">
          <thead id="inv-thead"></thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="6">⏳ جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script src="api.js"></script>
<script src="nav.js" defer></script>
  <script>
    const BALANCE_URL = "https://agent.ebrahimhamdy.com/webhook/get_balance";
    const PAGE_SIZE   = 20;

    const TAB_COLS = {
      'تلاجه':    ['code', 'itm_name_ar'],
      'غوالى':    ['code', 'itm_name_ar', 'itm_name_en'],
      'fastmove': ['code', 'itm_name_ar'],
      'مرتجعات':  ['code', 'itm_name_ar', 'itm_name_en', 'time', 'bill_no'],
      'erp':      ['code', 'itm_name_ar', 'itm_name_en']
    };

    const COL_LABELS = {
      code:        'كود',
      itm_name_ar: 'الاسم عربي',
      itm_name_en: 'الاسم إنجليزي',
      time:        'تاريخ المرتجع',
      bill_no:     'رقم الفاتورة'
    };

    let activeUser   = null;
    let rawData      = [];
    let filteredData = [];
    let currentTab   = 'تلاجه';
    let userBranch   = '';
    let userRole     = '';
    let currentPage  = 1;
    let showPending  = true;

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (localStorage.getItem('userBranch') || '').trim();
        userRole   = (localStorage.getItem('userRole')   || 'employee').trim();
        document.getElementById('branch-tag').textContent = userBranch;

        loadCurrentTab();
      }
    });

    function switchTab(tabName, btn) {
      currentTab  = tabName;
      currentPage = 1;
      showPending = true;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('searchInput').value = '';
      updateFilterBtn();
      loadCurrentTab();
    }

    function toggleFilter() {
      showPending = !showPending;
      currentPage = 1;
      updateFilterBtn();
      applyFilter();
    }

    function updateFilterBtn() {
      const btn = document.getElementById('filter-btn');
      if (showPending) {
        btn.textContent = '⏳ غير مجروده';
        btn.classList.remove('all');
      } else {
        btn.textContent = '📦 الكل';
        btn.classList.add('all');
      }
    }

    async function loadCurrentTab() {
      const tbody = document.getElementById('table-body');
      const cols  = TAB_COLS[currentTab] || ['code', 'itm_name_ar'];
      tbody.innerHTML = `<tr class="loading-row"><td colspan="${cols.length + 2}">⏳ جاري جلب البيانات...</td></tr>`;

      try {
        const items = await fetchInventory();
rawData = items.filter(item => {
  const typeMatch   = (item.type   || '').toLowerCase() === currentTab.toLowerCase();
  const branchMatch = (item.branch || '') === userBranch;
  return typeMatch && branchMatch;
});

// ترتيب بالكود — عشان النسخ المكررة تتجمّع تحت بعضها
rawData.sort((a, b) => {
  const codeA = String(a.code || '').trim();
  const codeB = String(b.code || '').trim();
  return codeA.localeCompare(codeB, 'ar', { numeric: true });
});
        buildTableHeader();
        applyFilter();
      } catch(e) {
        tbody.innerHTML = `<tr><td colspan="${cols.length + 2}" style="text-align:center;color:var(--danger);padding:30px;">❌ خطأ في الاتصال</td></tr>`;
      }
    }

    function buildTableHeader() {
      const cols    = TAB_COLS[currentTab] || ['code', 'itm_name_ar'];
      const canEdit = (userRole === 'inventory' || userRole === 'admin');
      document.getElementById('inv-thead').innerHTML = `
        <tr>
          ${cols.map(c => `<th>${COL_LABELS[c] || c}</th>`).join('')}
          <th>الرصيد الحالي</th>
          ${canEdit ? '<th>إجراء</th>' : '<th>الحالة</th>'}
        </tr>`;
    }

    function onSearch() {
      currentPage = 1;
      applyFilter();
    }

    function applyFilter() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();

      let data = rawData;

      if (showPending) {
        data = data.filter(item => {
          const done = item.done === true || item.done === 'true';
          const skip = item.skip === true || item.skip === 'true';
          return !done && !skip;
        });
      }

      filteredData = !search
        ? data
        : data.filter(item =>
            ['code','itm_name_ar','itm_name_en','bill_no']
              .some(k => (item[k] || '').toLowerCase().includes(search))
          );

      updateSummary();
      updatePagination();
      renderPage();
    }

    function updatePagination() {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      document.getElementById('page-info').textContent = `${currentPage} / ${totalPages}`;
      document.getElementById('btn-prev').disabled = currentPage <= 1;
      document.getElementById('btn-next').disabled = currentPage >= totalPages;
    }

    function changePage(dir) {
      const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
      currentPage = Math.min(Math.max(1, currentPage + dir), totalPages);
      updatePagination();
      renderPage();
    }

    function renderPage() {
      const start = (currentPage - 1) * PAGE_SIZE;
      const page  = filteredData.slice(start, start + PAGE_SIZE);
      renderTable(page);
    }

    // بترجّع Map: id الصنف → true لو ده أول نسخة pending لنفس الكود (الرئيسية)
    function computePrimaryFlags(items) {
      const seenPending = new Set();   // الأكواد اللي لقينا أول pending ليها
      const flags = new Map();
      // نمشي بالترتيب الظاهر (الأقدم أول) عشان أول واحد يبقى هو الرئيسي
      items.forEach(item => {
        const isDone = item.done === true || item.done === 'true';
        const isSkip = item.skip === true || item.skip === 'true';
        const code   = String(item.code || '').trim();

        if (isDone || isSkip || !code || code === '---') {
          flags.set(String(item.id), true);   // مش pending أو مفيش كود → يتعامل عادي
          return;
        }
        if (seenPending.has(code)) {
          flags.set(String(item.id), false);  // نسخة مكررة تابعة
        } else {
          seenPending.add(code);
          flags.set(String(item.id), true);   // أول نسخة pending = الرئيسية
        }
      });
      return flags;
    }

    function renderTable(items) {
      const tbody   = document.getElementById('table-body');
      const cols    = TAB_COLS[currentTab] || ['code', 'itm_name_ar'];
      const canEdit = (userRole === 'inventory' || userRole === 'admin');

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${cols.length + 2}" style="text-align:center;padding:40px;color:var(--text-muted);">
          ${showPending ? 'تم جرد كل الأصناف ✅' : 'لا توجد أصناف'}
        </td></tr>`;
        return;
      }

      const primaryFlags = computePrimaryFlags(items);

      tbody.innerHTML = '';
      items.forEach(item => {
        const id        = item.id;
        const isDone    = item.done === true || item.done === 'true';
        const isSkip    = item.skip === true || item.skip === 'true';
        const isPrimary = primaryFlags.get(String(id)) !== false;

        let timeVal = item.time || '';
        if (timeVal) {
          try { timeVal = new Date(timeVal).toLocaleDateString('ar-EG'); } catch(e) {}
        }

        const colCells = cols.map(c => {
          const val = c === 'time' ? timeVal : (item[c] || '---');
          return `<td style="font-size:0.82rem;" id="col-${c}-${id}">${val}</td>`;
        }).join('');

        let actionCell;
        if (!canEdit) {
          actionCell = `<td>
               <span style="font-size:0.78rem;color:var(--text-muted);">
                 ${isDone ? '✅ تم الجرد' : isSkip ? '⏭️ تجاهل' : '⏳ لم يُجرد'}
               </span>
             </td>`;
        } else if (!isPrimary) {
          // نسخة مكررة تابعة — أزرار مقفولة
          actionCell = `<td>
               <span style="font-size:0.75rem;color:var(--text-muted);background:var(--surface-3);padding:3px 8px;border-radius:8px;">
                 🔁 نسخة مكررة — تتبع الأولى
               </span>
             </td>`;
        } else {
          actionCell = `<td>
               <div style="display:flex;gap:6px;flex-wrap:wrap;">
                 <button class="btn-done ${isDone ? 'active' : ''}" id="done-btn-${id}"
                   onclick="handleAction('${id}', 'done')">✅ تم الجرد</button>
                 <button class="btn-skip ${isSkip ? 'active' : ''}" id="skip-btn-${id}"
                   onclick="handleAction('${id}', 'skip')">⏭️ تجاهل</button>
               </div>
             </td>`;
        }

        const tr = document.createElement('tr');
        tr.id = `row-${id}`;
        tr.innerHTML = `
          ${colCells}
          <td id="bal-cell-${id}">
            <button class="btn-balance" onclick="fetchBalance('${id}', '${(item.code||'').replace(/'/g,"\\'")}', this)">
              <i class="fas fa-database"></i> جلب الرصيد
            </button>
          </td>
          ${actionCell}`;
        tbody.appendChild(tr);
      });
    }

    async function lookupBalance() {
      const input = document.getElementById('balance-code-input');
      const resEl = document.getElementById('balance-result');
      const btn   = document.getElementById('balance-lookup-btn');
      const code  = input.value.trim();

      if (!code) { resEl.innerHTML = '<span style="color:var(--warning);">اكتب الكود أولاً</span>'; return; }

      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      resEl.innerHTML = '<span style="color:var(--text-muted);">⏳ جاري البحث...</span>';

      try {
        const res  = await fetch(`${BALANCE_URL}?code=${encodeURIComponent(code)}&branch=${encodeURIComponent(userBranch)}`);
        const raw  = await res.json();
        const data = Array.isArray(raw) ? raw[0] : raw;

        if (data && data.found) {
          resEl.innerHTML =
            `<span style="font-weight:700;color:var(--text-primary);">${data.itm_name_ar || '---'}</span>` +
            ` — الرصيد: <b class="balance-val">${data.balance}</b>`;
        } else {
          resEl.innerHTML = '<span style="color:var(--warning);">⚠️ الكود غير موجود</span>';
        }
      } catch(e) {
        resEl.innerHTML = '<span style="color:var(--danger);">❌ فشل الاتصال</span>';
      }

      btn.disabled = false; btn.innerHTML = '<i class="fas fa-search"></i> بحث';
    }

    async function fetchBalance(id, code, btn) {
      const cell     = document.getElementById(`bal-cell-${id}`);
      const nameCell = document.getElementById(`col-itm_name_ar-${id}`);
      btn.disabled   = true;
      btn.innerHTML  = '<i class="fas fa-spinner fa-spin"></i>';
      try {
        const res  = await fetch(`${BALANCE_URL}?code=${encodeURIComponent(code)}&branch=${encodeURIComponent(userBranch)}`);
        const raw  = await res.json();
        const data = Array.isArray(raw) ? raw[0] : raw;

        if (data && data.found) {
          cell.innerHTML = `<span class="balance-val">${data.balance}</span>`;
          if (nameCell && (!nameCell.textContent.trim() || nameCell.textContent.trim() === '---')) {
            nameCell.textContent = data.itm_name_ar || '---';
          }
        } else {
          cell.innerHTML = `<span style="color:var(--warning);font-size:0.78rem;">⚠️ غير موجود</span>`;
        }
      } catch(e) {
        cell.innerHTML = `<span style="color:var(--danger);font-size:0.78rem;">❌ فشل</span>`;
      }
    }

    async function handleAction(id, action) {
      const doneBtn = document.getElementById(`done-btn-${id}`);
      const skipBtn = document.getElementById(`skip-btn-${id}`);
      const isDone  = action === 'done';
      const isSkip  = action === 'skip';

      doneBtn.disabled = true;
      skipBtn.disabled = true;
      doneBtn.classList.toggle('active', isDone);
      skipBtn.classList.toggle('active', isSkip);

      const clicked = rawData.find(x => x.id == id);
      const code    = String(clicked?.code || '').trim();

      // كل النسخ pending بنفس الكود + نفس القسم (الفرع مضمون لأن rawData متفلتر بالفرع)
      const sameCode = (code && code !== '---')
        ? rawData.filter(x =>
            String(x.code || '').trim() === code &&
            (x.type || '').toLowerCase() === currentTab.toLowerCase() &&
            !(x.done === true || x.done === 'true') &&
            !(x.skip === true || x.skip === 'true')
          )
        : [clicked];

      // الرئيسية = اللي ضغط عليها (تاخد اختياره) — الباقي تجاهل
      let success = true;
      for (const it of sameCode) {
        const itDone = String(it.id) === String(id) ? isDone : false;
        const itSkip = String(it.id) === String(id) ? isSkip : true;
        const ok = await updateData({
          id:     it.id,
          done:   itDone,
          skip:   itSkip,
          type:   "جرد",
          action: "update_status"
        });
        if (!ok) success = false;
      }

      doneBtn.disabled = false;
      skipBtn.disabled = false;

      if (success) {
        sameCode.forEach(it => {
          if (String(it.id) === String(id)) { it.done = isDone; it.skip = isSkip; }
          else { it.done = false; it.skip = true; }
        });
        const ids = new Set(sameCode.map(it => String(it.id)));
        filteredData.forEach(f => {
          if (!ids.has(String(f.id))) return;
          if (String(f.id) === String(id)) { f.done = isDone; f.skip = isSkip; }
          else { f.done = false; f.skip = true; }
        });
        updateSummary();

        if (showPending) {
          setTimeout(() => {
            filteredData = filteredData.filter(x => !ids.has(String(x.id)));
            updatePagination();
            renderPage();
          }, 800);
        }
      } else {
        const oldItem = rawData.find(x => x.id == id);
        if (oldItem) {
          doneBtn.classList.toggle('active', oldItem.done === true || oldItem.done === 'true');
          skipBtn.classList.toggle('active', oldItem.skip === true || oldItem.skip === 'true');
        }
        alert("⚠️ فشل الحفظ، يرجى المحاولة مجدداً");
      }
    }

    function updateSummary() {
      const done    = rawData.filter(i => i.done === true || i.done === 'true').length;
      const skipped = rawData.filter(i => i.skip === true || i.skip === 'true').length;
      const pending = rawData.length - done - skipped;

      document.getElementById('sum-total').textContent   = rawData.length;
      document.getElementById('sum-done').textContent    = done;
      document.getElementById('sum-skip').textContent    = skipped;
      document.getElementById('sum-pending').textContent = pending;
    }
  </script>
</body>
</html>
