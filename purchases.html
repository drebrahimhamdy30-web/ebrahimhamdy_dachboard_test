<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>سجل المشتريات - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-shopping-cart"></i> سجل المشتريات والطلبيات
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div class="field-icon-wrap" style="min-width:220px;">
            <i class="fas fa-search field-icon"></i>
            <input type="text" id="searchInput" class="form-input"
              placeholder="بحث..."
              oninput="applyFilter()"
              style="padding-right:34px;">
          </div>
          <button class="btn btn-primary" onclick="loadOrders()">
            <i class="fas fa-sync-alt"></i> تحديث
          </button>
        </div>
      </div>

      <div class="filter-bar">
        <span class="filter-label"><i class="fas fa-filter"></i> الحالة:</span>
        <select id="statusFilter" class="form-select" style="width:auto;" onchange="applyFilter()">
          <option value="all">الكل</option>
          <option value="pending" selected>قيد الانتظار ⏳</option>
          <option value="ordered">تم الطلب ✅</option>
          <option value="unavailable">غير متوفر ❌</option>
        </select>
        <span class="filter-label" style="margin-right:4px;">نوع الطلب:</span>
        <select id="orderTypeFilter" class="form-select" style="width:auto;" onchange="applyFilter()">
          <option value="all">الكل</option>
          <option value="دواء">💊 دواء</option>
          <option value="كوزمو">💄 كوزمو</option>
          <option value="تركيبات">⚗️ تركيبات</option>
        </select>
        <div id="branchList" style="display:flex;gap:8px;flex-wrap:wrap;margin-right:4px;"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>الفرع</th>
              <th>نوع الطلب</th>
              <th>الصنف</th>
              <th>العميل</th>
              <th>الكمية</th>
              <th>المورد</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="9">⏳ جاري تحميل البيانات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal التعديل -->
  <div id="edit-modal" style="
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,0.75);
    z-index:99999;
    align-items:center;
    justify-content:center;
  ">
    <div style="
      background:#1e293b;
      border:2px solid #334155;
      border-radius:16px;
      padding:24px;
      width:90%;
      max-width:480px;
      direction:rtl;
      font-family:var(--font);
      box-shadow:0 20px 60px rgba(0,0,0,0.6);
    ">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 style="margin:0;font-size:1rem;color:#f1f5f9;">
          <i class="fas fa-edit"></i> تعديل الطلب
        </h3>
        <button onclick="closeEditModal()"
          style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.2rem;">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <input type="hidden" id="edit-id">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">كود الصنف</label>
          <input type="text" id="edit-item-code" class="form-input"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">اسم الصنف</label>
          <input type="text" id="edit-item-name" class="form-input">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">كود العميل</label>
          <input type="text" id="edit-cust-code" class="form-input"
            inputmode="numeric"
            oninput="this.value = this.value.replace(/[^0-9]/g, ''); if (this.value.length > 5) this.value = this.value.slice(0, 5);"
            onchange="const v = parseInt(this.value); if (this.value && v > 40000) { alert('كود العميل يجب أن يكون بين 1 و 40000'); this.value = ''; }">
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">اسم العميل</label>
          <input type="text" id="edit-cust-name" class="form-input">
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">ملاحظة / المورد</label>
        <input type="text" id="edit-company" class="form-input">
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:8px;">نوع الطلب</label>
        <div style="display:flex;gap:8px;">
          <label id="ot-label-dawaa" style="flex:1;text-align:center;padding:10px;border:2px solid #334155;border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:700;color:#94a3b8;transition:all 0.2s;">
            <input type="radio" name="edit_order_type" value="دواء" style="display:none;" onchange="updateOtLabel()">
            💊 دواء
          </label>
          <label id="ot-label-cosmo" style="flex:1;text-align:center;padding:10px;border:2px solid #334155;border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:700;color:#94a3b8;transition:all 0.2s;">
            <input type="radio" name="edit_order_type" value="كوزمو" style="display:none;" onchange="updateOtLabel()">
            💄 كوزمو
          </label>
          <label id="ot-label-tark" style="flex:1;text-align:center;padding:10px;border:2px solid #334155;border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:700;color:#94a3b8;transition:all 0.2s;">
            <input type="radio" name="edit_order_type" value="تركيبات" style="display:none;" onchange="updateOtLabel()">
            ⚗️ تركيبات
          </label>
        </div>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeEditModal()" class="btn"
          style="background:#334155;color:#94a3b8;border:none;">
          إلغاء
        </button>
        <button onclick="saveEdit()" class="btn btn-primary" id="edit-save-btn">
          <i class="fas fa-save"></i> حفظ التعديلات
        </button>
      </div>
    </div>
  </div>

<script src="api.js?v=sbtask1"></script>
<script src="nav.js" defer></script>
  <script>
    let activeUser = null;
    let rawData    = [];

    checkAuth().then(user => {
      activeUser = user;
      if (user) loadOrders();
    });

    async function loadOrders() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="9">⏳ جاري جلب البيانات...</td></tr>';
      try {
        const response = await sbTaskList({ type: 'شراء' });
        let items = (response && response[0]?.data)
          ? response[0].data
          : (response.data || response);

        if (Array.isArray(items) && items.length > 0) {
          rawData = items.map(item => ({
            id:            item.id || item.row_id || item.ID,
            branch:        item.branch || '-',
            item_code:     item.item_code || '',
            item_name:     item.item || item.item_name || 'صنف غير مسمى',
            customer_code: item.cust_code || '',
            customer_name: item.cust_name || '',
            qty:           item.qty || 0,
            company:       (item.company && item.company !== 'null') ? item.company : '',
            status:        (item.status === '-' || !item.status) ? (item.state || 'pending') : item.status,
            order_type:    item.order_type || '',
            type:          item.type || '',
            note:          (item.note && item.note !== 'null') ? item.note : '',
            createdAt:     item.createdAt
          })).filter(i => String(i.type).includes("شراء"));

          generateBranches(rawData);
          applyFilter();
        } else {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-muted);">لا توجد طلبات شراء</td></tr>';
        }
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--danger);padding:30px;">❌ خطأ في تحميل البيانات</td></tr>';
      }
    }

    function generateBranches(data) {
      const container = document.getElementById('branchList');
      const branches  = [...new Set(data.map(i => i.branch))].filter(b => b !== '-').sort();
      container.innerHTML = branches.map(b => `
        <label class="check-label" style="background:var(--surface-3);padding:5px 10px;border-radius:20px;border:1px solid var(--border);">
          <input type="checkbox" class="branch-cb" value="${b}" checked onchange="applyFilter()"> ${b}
        </label>
      `).join('');
    }

    function applyFilter() {
      const statusVal        = document.getElementById('statusFilter').value;
      const orderTypeVal     = document.getElementById('orderTypeFilter').value;
      const searchVal        = document.getElementById('searchInput').value.trim().toLowerCase();
      const selectedBranches = Array.from(document.querySelectorAll('.branch-cb:checked')).map(c => c.value);

      const filtered = rawData.filter(i => {
        const sMatch = (statusVal === 'all' || i.status === statusVal);
        const bMatch = selectedBranches.includes(i.branch);
        const tMatch = (orderTypeVal === 'all' || String(i.order_type).includes(orderTypeVal));
        const searchMatch = !searchVal || [
          i.item_name, i.item_code,
          i.customer_name, i.customer_code,
          i.branch, i.company, i.order_type, i.note
        ].some(val => String(val || '').toLowerCase().includes(searchVal));
        return sMatch && bMatch && tMatch && searchMatch;
      });

      renderTable(filtered);
    }

    function renderTable(items) {
      const tbody = document.getElementById('table-body');
      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج تطابق التصفية</td></tr>';
        return;
      }

      tbody.innerHTML = items.map(i => {
        let displayDate = "---", displayTime = "";
        if (i.createdAt) {
          const d     = new Date(i.createdAt);
          displayDate = d.toLocaleDateString('ar-EG', {month:'numeric', day:'numeric'});
          displayTime = d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true});
        }

        const orderTypeBadge = i.order_type
          ? `<span class="badge badge-blue" style="font-size:0.72rem;">${i.order_type}</span>`
          : '<span style="color:var(--text-muted);font-size:0.78rem;">---</span>';

        return `
          <tr>
            <td style="font-size:0.75rem;line-height:1.4;">
              ${displayDate}<br>
              <span style="color:var(--text-muted);font-size:0.7rem;">${displayTime}</span>
            </td>
            <td><span class="branch-tag">${i.branch}</span></td>
            <td>${orderTypeBadge}</td>
            <td style="text-align:right;">
              <div style="font-weight:700;font-size:0.85rem;">${i.item_name}</div>
              <div style="font-size:0.72rem;color:var(--text-muted);">
                <i class="fas fa-barcode"></i> ${i.item_code || '---'}
              </div>
            </td>
            <td style="text-align:right;">
              <div style="font-weight:600;font-size:0.82rem;">${i.customer_name || '---'}</div>
              <div style="font-size:0.72rem;color:var(--text-muted);">
                <i class="fas fa-phone-alt"></i> ${i.customer_code || '---'}
              </div>
              ${i.note ? `<div style="font-size:0.72rem;color:var(--accent-dark);margin-top:3px;">
                <i class="fas fa-sticky-note"></i> ${i.note}
              </div>` : ''}
            </td>
            <td><b style="font-size:1.1rem;color:var(--warning);">${i.qty}</b></td>
            <td>
              <input type="text" value="${i.company}" id="comp-${i.id}"
                class="table-input" placeholder="المورد..."
                onchange="autoSave('${i.id}')">
            </td>
            <td>
              <select id="stat-${i.id}" class="table-select"
                onchange="autoSave('${i.id}', this)">
                <option value="pending"     ${i.status==='pending'     ?'selected':''}>⏳ انتظار</option>
                <option value="ordered"     ${i.status==='ordered'     ?'selected':''}>✅ تم الطلب</option>
                <option value="unavailable" ${i.status==='unavailable' ?'selected':''}>❌ نقص</option>
              </select>
            </td>
            <td id="action-${i.id}">
              <div style="display:flex;gap:6px;align-items:center;justify-content:center;">
                <i class="fas fa-check-circle" style="color:var(--text-muted);font-size:1rem;" title="يتم الحفظ تلقائياً"></i>
                <button class="btn btn-sm btn-icon"
                  onclick="openEditModal('${i.id}')"
                  style="background:var(--accent);color:#fff;padding:5px 8px;"
                  title="تعديل بيانات الطلب">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-icon"
                  onclick="convertToTransfer('${i.id}', this)"
                  style="background:#8b5cf6;color:#fff;padding:5px 8px;"
                  title="متوفر بفرع آخر">
                  <i class="fas fa-exchange-alt"></i>
                </button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    async function autoSave(id, triggerEl) {
      const statusEl  = document.getElementById(`stat-${id}`);
      const compEl    = document.getElementById(`comp-${id}`);
      const actionEl  = document.getElementById(`action-${id}`);
      if (!statusEl) return;

      const icons     = actionEl.querySelector('div');
      const checkIcon = icons ? icons.querySelector('.fa-check-circle, .fa-spinner, .fa-exclamation-circle') : null;
      if (checkIcon) checkIcon.className = 'fas fa-spinner fa-spin';

      const success = await sbTaskUpdate(id, {
        state:   statusEl.value,
        company: compEl ? compEl.value : ''
      });

      if (success) {
        if (checkIcon) {
          checkIcon.className   = 'fas fa-check-circle';
          checkIcon.style.color = 'var(--success)';
          setTimeout(() => { if(checkIcon) checkIcon.style.color = 'var(--text-muted)'; }, 2000);
        }
        const item = rawData.find(x => x.id == id);
        if (item) { item.status = statusEl.value; item.company = compEl ? compEl.value : ''; }
      } else {
        if (checkIcon) {
          checkIcon.className   = 'fas fa-exclamation-circle';
          checkIcon.style.color = 'var(--danger)';
        }
        if (triggerEl) alert("⚠️ فشل في الحفظ");
      }
    }

    // ===== Modal التعديل =====
    function updateOtLabel() {
      const labels = { 'دواء': 'ot-label-dawaa', 'كوزمو': 'ot-label-cosmo', 'تركيبات': 'ot-label-tark' };
      Object.values(labels).forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.style.borderColor = '#334155'; el.style.background = '#0f172a'; el.style.color = '#94a3b8'; }
      });
      const checked = document.querySelector('input[name="edit_order_type"]:checked');
      if (checked) {
        const lbl = checked.closest('label');
        if (lbl) { lbl.style.borderColor = '#38bdf8'; lbl.style.background = '#0c4a6e'; lbl.style.color = '#7dd3fc'; }
      }
    }

    function openEditModal(id) {
      const item = rawData.find(x => x.id == id);
      if (!item) return;

      document.getElementById('edit-id').value        = id;
      document.getElementById('edit-item-code').value = item.item_code     || '';
      document.getElementById('edit-item-name').value = item.item_name     || '';
      document.getElementById('edit-cust-code').value = item.customer_code || '';
      document.getElementById('edit-cust-name').value = item.customer_name || '';
      document.getElementById('edit-company').value   = item.company       || '';

      document.querySelectorAll('input[name="edit_order_type"]').forEach(r => {
        r.checked = (r.value === item.order_type);
      });
      updateOtLabel();

      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    async function saveEdit() {
      const btn          = document.getElementById('edit-save-btn');
      const id           = document.getElementById('edit-id').value;
      const selectedType = document.querySelector('input[name="edit_order_type"]:checked')?.value || null;

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      const success = await sbTaskUpdate(id, {
        item_code:  document.getElementById('edit-item-code').value.trim() || null,
        item_name:  document.getElementById('edit-item-name').value.trim() || null,
        cust_code:  document.getElementById('edit-cust-code').value.trim() || null,
        cust_name:  document.getElementById('edit-cust-name').value.trim() || null,
        company:    document.getElementById('edit-company').value.trim()   || null,
        order_type: selectedType,
      });

      if (success) {
        const item = rawData.find(x => x.id == id);
        if (item) {
          item.item_code     = document.getElementById('edit-item-code').value.trim();
          item.item_name     = document.getElementById('edit-item-name').value.trim();
          item.customer_code = document.getElementById('edit-cust-code').value.trim();
          item.customer_name = document.getElementById('edit-cust-name').value.trim();
          item.company       = document.getElementById('edit-company').value.trim();
          item.order_type    = selectedType || item.order_type;
        }
        closeEditModal();
        applyFilter();
      } else {
        alert("❌ فشل الحفظ");
      }

      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
    }

    // ===== تحويل من فرع =====
    async function convertToTransfer(id, btn) {
      const item = rawData.find(x => x.id == id);
      if (!item) return;

      const branches = ['المعمورة', 'سان ستيفانو', 'سيدى بشر'].filter(b => b !== item.branch);
      const selected = await showBranchPicker(branches);
      if (!selected) return;

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const success = await sbTaskUpdate(id, {
        type:   'تحويل',
        branch: selected,
        state:  'pending'
      });

      if (success) {
        btn.style.background = "#16a34a";
        btn.innerHTML        = '<i class="fas fa-check"></i>';
        setTimeout(() => loadOrders(), 800);
      } else {
        alert("❌ فشل التحويل");
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-exchange-alt"></i>';
      }
    }

    function showBranchPicker(branches) {
      return new Promise(resolve => {
        const result = prompt(
          `اختر الفرع المتوفر فيه الصنف:\n${branches.map((b, i) => `${i+1}. ${b}`).join('\n')}\n\nاكتب الرقم:`
        );
        if (!result) { resolve(null); return; }
        const idx = parseInt(result) - 1;
        resolve(branches[idx] || null);
      });
    }

    document.getElementById('edit-modal').addEventListener('click', function(e) {
      if (e.target === this) closeEditModal();
    });
  </script>
</body>
</html>
