  <script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض.
     ⚠️ من غيره الصفحة مابتقولش هي فاتحة ولا داكنة، فقاعدة
     prefers-color-scheme في tokens.css بتتبع **إعداد الجهاز** بدل
     إعداد التطبيق — وده اللي كان بيخلّي ويب الطيار وكروت شاشة
     التوزيع تطلع داكنة عند ناس جهازهم على الوضع الليلي.
     الافتراضي فاتح: الوضع الليلي باختيار صريح من الزر بس. */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>

  <script>
    let activeUser = null;
    let rawData    = [];

    // خريطة (اسم مستخدم/موبايل → اسم الشخص) عشان نعرض مين عمل طلب الشراء
    let userNameMap = {};
    function nameOf(u){ if (!u) return u; return userNameMap[u] || u; }
    async function loadUserNameMap(){
      if (Object.keys(userNameMap).length) return;
      try {
        const res = await fetch(SB_URL_API + '/rest/v1/rpc/get_user_name_map', {
          method:'POST',
          headers: await sbH({ 'Content-Type':'application/json' }),
          body:'{}'
        });
        const d = await res.json();
        userNameMap = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
      } catch(e){ userNameMap = {}; }
    }

    checkAuth().then(user => {
      activeUser = user;
      if (user) loadOrders();
    });

    // ===== ترشيح المخزن اللي نجيب منه كل صنف شراء =====
    // كود موجود → أفضل مخزن متاح (أعلى خصم)؛ مفيش → غير متاح.
    // ملوش كود → يطابق الاسم لكود (زي شاشة أسعار المخازن) وبعدها يرشّح المخزن.
    let SRC_MAP = {};   // id -> {status, store, discount_perc, resolved_code, matched_by}
    // الترويسة بتتبني لكل نداء بتوكن المستخدم (sbH بيجدّد لو لزم).
    // ⚠️ كانت كائن ثابت بمفتاح anon: الجداول بقت authenticated-only، وكمان
    //    أي توكن بيتقرا مرة واحدة وقت التحميل بيقدم بعد ساعة ويرجّع 401.
    const SRC_H = extra => sbH(Object.assign({ 'Content-Type': 'application/json' }, extra || {}));
    async function loadSourceSuggestions(items){
      const pending = (items||[]).filter(i => SRC_MAP[i.id] === undefined && i.id != null);
      if (!pending.length) return;
      const _sel = document.getElementById('storeFilter');
      if (_sel){ _sel.disabled = true; _sel.innerHTML = '<option value="all">⏳ جاري تحميل المخازن…</option>'; }
      const CHUNK = 40;
      for (let x=0; x<pending.length; x+=CHUNK){
        const slice = pending.slice(x, x+CHUNK);
        const rows = slice.map(i => ({ k: String(i.id), code: i.item_code || '', name: i.item_name || '' }));
        try {
          const res = await fetch(SB_URL_API + '/rest/v1/rpc/suggest_purchase_sources', {
            method:'POST', headers: await SRC_H(), body: JSON.stringify({ p_rows: rows })
          });
          const data = await res.json();
          (Array.isArray(data) ? data : []).forEach(d => { SRC_MAP[d.k] = d; });
        } catch(e){ /* تجاهل */ }
        slice.forEach(i => { const el = document.getElementById('src-'+i.id); if (el) el.innerHTML = srcHtml(i.id); });
      }
      if (_sel) _sel.disabled = false;
      populateStoreFilter();
    }
    // المخزن المقترح لكل صنف: المختار يدويًا وإلا الأرخص
    function suggestedEntry(s){
      if (!s) return null;
      if (s._chosen) return { e:s._chosen, chosen:true };
      if (Array.isArray(s.stores) && s.stores.length) return { e:s.stores[0], chosen:false };
      return null;
    }
    function srcHtml(id){
      const s = SRC_MAP[id];
      if (s === undefined) return '<span style="font-size:0.68rem;color:var(--text-muted)">⏳</span>';
      if (s.status === 'no_match') return `<span style="font-size:0.68rem;color:var(--text-muted);">لا يوجد تطابق</span>`;
      const pick = suggestedEntry(s);
      if (!pick) return `<span style="font-size:0.74rem;color:#dc2626;font-weight:700;">🚫 غير متوفر</span>`;
      const e = pick.e;
      const disc = (e.discount!=null) ? `<div style="font-size:0.64rem;color:var(--text-muted);font-weight:400">سعر ${e.price} · خصم ${e.discount}%</div>` : '';
      const viaName = (s.matched_by==='name') ? `<div style="font-size:0.62rem;color:#b45309;">مطابقة كود ${s.resolved_code||'—'}</div>` : '';
      const bg = pick.chosen ? '#bbf7d0' : '#ccfbf1';   // أخضر=مختار يدويًا · تركوازي=المقترح (الأرخص)
      const mark = pick.chosen ? '✓ ' : '';
      const many = (Array.isArray(s.stores) && s.stores.length>1) ? ` <span style="font-size:0.6rem;color:var(--text-muted)">+${s.stores.length-1}</span>` : '';
      return `<button onclick="openStoreCompareById('${id}')" title="اضغط لمقارنة المخازن واختيار مخزن الطلب"
                style="background:${bg};color:#0f766e;font-weight:700;font-size:0.74rem;padding:4px 9px;border:none;border-radius:8px;cursor:pointer;">
                <i class="fas fa-store"></i> ${mark}${e.store}</button>${many}${disc}${viaName}`;
    }
    // فلتر المخازن = المخازن المقترحة فقط (المختار/الأرخص لكل صنف)
    function populateStoreFilter(){
      const sel = document.getElementById('storeFilter'); if (!sel) return;
      const cur = sel.value;
      const set = new Set();
      Object.values(SRC_MAP).forEach(s=>{ const p = suggestedEntry(s); if (p && p.e && p.e.store) set.add(p.e.store); });
      const stores = [...set].sort((a,b)=>String(a).localeCompare(String(b),'ar'));
      sel.innerHTML = '<option value="all">كل المخازن</option>' + stores.map(st=>`<option value="${st}">🏬 ${st}</option>`).join('');
      if (stores.includes(cur)) sel.value = cur;
    }
    // ===== مقارنة المخازن لكود (نفس فكرة شاشة الأسعار) =====
    const _num = v => { const n=Number(v); return (v==null||v===''||isNaN(n))?'—':(Math.round(n*100)/100).toLocaleString('ar-EG'); };
    const _netCost = r => { const p=Number(r.price), d=Number(r.discount_perc)||0; if(r.price==null||r.price===''||isNaN(p)) return null; return p*(1-Math.min(Math.max(d,0),100)/100); };
    let _cmpId = null;
    function openStoreCompareById(id){
      const s = SRC_MAP[id]; if (!s || !s.resolved_code) return;
      _cmpId = id;
      const item = rawData.find(x=>String(x.id)===String(id));
      openStoreCompare(s.resolved_code, item ? item.item_name : '');
    }
    async function openStoreCompare(code, name){
      const bg = document.getElementById('cmp-modal');
      document.getElementById('cmp-title').textContent = 'اختر المخزن — ' + (name || ('كود ' + code));
      document.getElementById('cmp-body').innerHTML = 'جارٍ التحميل…';
      bg.style.display = 'flex';
      try {
        const url = SB_URL_API + '/rest/v1/store_item_prices?select=item_name,store,price,discount_perc,available&code=eq.' + encodeURIComponent(code) + '&available=eq.true';
        let rows = await (await fetch(url, { headers: await SRC_H() })).json();
        if (!Array.isArray(rows) || !rows.length){ document.getElementById('cmp-body').innerHTML = '<div style="color:var(--text-muted)">لا يوجد هذا الصنف متاحًا في أي مخزن.</div>'; return; }
        rows = rows.map(r=>({ ...r, _cost:_netCost(r) })).sort((a,b)=>{ const ac=a._cost==null?Infinity:a._cost, bc=b._cost==null?Infinity:b._cost; return ac-bc; });
        const chosen = (_cmpId!=null && SRC_MAP[_cmpId] && SRC_MAP[_cmpId]._chosen) ? SRC_MAP[_cmpId]._chosen.store : null;
        document.getElementById('cmp-body').innerHTML =
          `<div style="font-size:0.76rem;color:var(--text-secondary);margin-bottom:8px;">مرتّبة من الأقل تكلفة — اضغط «اختيار» لاستبداله كمخزن الطلب.</div>`
          + '<table style="width:100%;border-collapse:collapse;font-size:0.8rem;"><thead><tr style="background:#f1f5f9;"><th style="text-align:right;padding:6px">المخزن</th><th style="text-align:right;padding:6px">اسم الصنف بالمخزن</th><th style="padding:6px">سعر البيع</th><th style="padding:6px">الخصم</th><th style="padding:6px">التكلفة</th><th style="padding:6px">الإتاحة</th><th style="padding:6px"></th></tr></thead><tbody>'
          + rows.map(r=>`<tr style="border-bottom:1px solid #e2e8f0;${(chosen && chosen===r.store)?'background:#dcfce7;font-weight:800;':''}">
              <td style="text-align:right;padding:6px;">${r.store||'—'}</td>
              <td style="text-align:right;padding:6px;font-size:0.72rem;color:var(--text-muted);">${r.item_name||'—'}</td>
              <td style="text-align:center;padding:6px;">${_num(r.price)}</td>
              <td style="text-align:center;padding:6px;color:#0f766e;">${_num(r.discount_perc)}%</td>
              <td style="text-align:center;padding:6px;font-weight:700;">${_num(r._cost)}</td>
              <td style="text-align:center;padding:6px;">${r.available?'متاح':'<span style="color:#b91c1c">غير متاح</span>'}</td>
              <td style="text-align:center;padding:6px;"><button onclick="chooseWarehouse('${String(r.store||'').replace(/'/g,"\\'")}',${r.price==null?'null':r.price},${r.discount_perc==null?'null':r.discount_perc})" style="background:#0d9488;color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:0.72rem;font-weight:700;cursor:pointer;">اختيار</button></td>
            </tr>`).join('')
          + '</tbody></table>';
      } catch(e){ document.getElementById('cmp-body').innerHTML = '<div style="color:var(--danger)">خطأ في التحميل</div>'; }
    }
    function closeStoreCompare(){ document.getElementById('cmp-modal').style.display='none'; }
    // اختيار مخزن للطلب: يعلّمه في العمود (أخضر ✓) ويملأ حقل المورد ويحفظ
    function chooseWarehouse(store, price, disc){
      const id = _cmpId; if (id==null || !SRC_MAP[id]) return;
      SRC_MAP[id]._chosen = { store, price:(price==null?null:price), discount:(disc==null?null:disc) };
      const cell = document.getElementById('src-'+id); if (cell) cell.innerHTML = srcHtml(id);
      const comp = document.getElementById('comp-'+id);
      if (comp){ comp.value = store; autoSave(id); }
      closeStoreCompare();
    }

    async function loadOrders() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="10">⏳ جاري جلب البيانات...</td></tr>';
      try {
        await loadUserNameMap();
        const response = await sbTaskList({ type: 'شراء' });
        let items = (response && response[0]?.data)
          ? response[0].data
          : (response.data || response);

        if (Array.isArray(items) && items.length > 0) {
          rawData = items.map(item => ({
            id:            item.id || item.row_id || item.ID,
            branch:        item.branch || '-',
            user:          item.user || '',
            item_code:     item.item_code || '',
            item_name:     item.item || item.item_name || 'صنف غير مسمى',
            customer_code: item.cust_code || '',
            customer_name: item.cust_name || '',
            qty:           item.qty || 0,
            company:       (item.company && item.company !== 'null') ? item.company : '',
            status:        (item.status === '-' || !item.status) ? (item.state || 'pending') : item.status,
            order_type:    item.order_type || '',
            type:          item.type || '',
            note:          (item.note && item.note !== 'null') ? item.note : '',
            createdAt:     item.createdAt
          })).filter(i => String(i.type).includes("شراء"));

          generateBranches(rawData);
          applyFilter();
          loadSourceSuggestions(rawData);
        } else {
          tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:30px;color:var(--text-muted);">لا توجد طلبات شراء</td></tr>';
        }
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--danger);padding:30px;">❌ خطأ في تحميل البيانات</td></tr>';
      }
    }

    function generateBranches(data) {
      const container = document.getElementById('branchList');
      const branches  = [...new Set(data.map(i => i.branch))].filter(b => b !== '-').sort();
      container.innerHTML = branches.map(b => `
        <label class="check-label" style="background:var(--surface-3);padding:5px 10px;border-radius:20px;border:1px solid var(--border);">
          <input type="checkbox" class="branch-cb" value="${b}" checked onchange="applyFilter()"> ${b}
        </label>
      `).join('');
    }

    function applyFilter() {
      const statusVal        = document.getElementById('statusFilter').value;
      const orderTypeVal     = document.getElementById('orderTypeFilter').value;
      const storeVal         = document.getElementById('storeFilter') ? document.getElementById('storeFilter').value : 'all';
      const searchVal        = document.getElementById('searchInput').value.trim().toLowerCase();
      const selectedBranches = Array.from(document.querySelectorAll('.branch-cb:checked')).map(c => c.value);

      const filtered = rawData.filter(i => {
        const sMatch = (statusVal === 'all' || i.status === statusVal);
        const bMatch = selectedBranches.includes(i.branch);
        const tMatch = (orderTypeVal === 'all' || String(i.order_type).includes(orderTypeVal));
        const _sug = SRC_MAP[i.id] ? suggestedEntry(SRC_MAP[i.id]) : null;
        const stMatch = (storeVal === 'all' || (_sug && _sug.e && _sug.e.store === storeVal));
        const searchMatch = !searchVal || [
          i.item_name, i.item_code,
          i.customer_name, i.customer_code,
          i.branch, i.company, i.order_type, i.note
        ].some(val => String(val || '').toLowerCase().includes(searchVal));
        return sMatch && bMatch && tMatch && stMatch && searchMatch;
      });

      renderTable(filtered);
    }

    function renderTable(items) {
      const tbody = document.getElementById('table-body');
      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج تطابق التصفية</td></tr>';
        return;
      }

      tbody.innerHTML = items.map(i => {
        let displayDate = "---", displayTime = "";
        if (i.createdAt) {
          const d     = new Date(i.createdAt);
          displayDate = d.toLocaleDateString('ar-EG', {month:'numeric', day:'numeric'});
          displayTime = d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true});
        }

        const orderTypeBadge = i.order_type
          ? `<span class="badge badge-blue" style="font-size:0.72rem;">${i.order_type}</span>`
          : '<span style="color:var(--text-muted);font-size:0.78rem;">---</span>';

        // شريط لوني للحالة: أخضر=تم الطلب، أحمر=غير متوفر، أصفر=قيد الانتظار
        const stColor = i.status==='ordered' ? '#16a34a' : (i.status==='unavailable' ? '#dc2626' : '#f59e0b');
        return `
          <tr>
            <td style="font-size:0.75rem;line-height:1.4;box-shadow:inset -6px 0 0 0 ${stColor};">
              ${displayDate}<br>
              <span style="color:var(--text-muted);font-size:0.7rem;">${displayTime}</span>
            </td>
            <td>
              ${(nameOf(i.user) && nameOf(i.user) !== i.branch)
                ? `<div style="font-weight:600;font-size:0.8rem;">${nameOf(i.user)}</div>` : ''}
              <span class="branch-tag">${i.branch}</span>
            </td>
            <td>${orderTypeBadge}</td>
            <td style="text-align:right;">
              <div style="font-weight:700;font-size:0.85rem;">${i.item_name}</div>
              <div style="font-size:0.72rem;color:var(--text-muted);">
                <i class="fas fa-barcode"></i> ${i.item_code || '---'}
              </div>
            </td>
            <td style="text-align:center;min-width:120px;" id="src-${i.id}">${srcHtml(i.id)}</td>
            <td style="text-align:right;">
              <div style="font-weight:600;font-size:0.82rem;">${i.customer_name || '---'}</div>
              <div style="font-size:0.72rem;color:var(--text-muted);">
                <i class="fas fa-phone-alt"></i> ${i.customer_code || '---'}
              </div>
              ${i.note ? `<div style="font-size:0.72rem;color:var(--accent-dark);margin-top:3px;">
                <i class="fas fa-sticky-note"></i> ${i.note}
              </div>` : ''}
            </td>
            <td><b style="font-size:1.1rem;color:var(--warning);">${i.qty}</b></td>
            <td>
              <input type="text" value="${i.company}" id="comp-${i.id}"
                class="table-input" placeholder="المورد..."
                onchange="autoSave('${i.id}')">
            </td>
            <td>
              <select id="stat-${i.id}" class="table-select"
                onchange="autoSave('${i.id}', this)">
                <option value="pending"     ${i.status==='pending'     ?'selected':''}>⏳ انتظار</option>
                <option value="ordered"     ${i.status==='ordered'     ?'selected':''}>✅ تم الطلب</option>
                <option value="unavailable" ${i.status==='unavailable' ?'selected':''}>❌ غير متوفر</option>
              </select>
            </td>
            <td id="action-${i.id}">
              <div style="display:flex;gap:6px;align-items:center;justify-content:center;">
                <i class="fas fa-check-circle" style="color:var(--text-muted);font-size:1rem;" title="يتم الحفظ تلقائياً"></i>
                <button class="btn btn-sm btn-icon"
                  onclick="openEditModal('${i.id}')"
                  style="background:var(--accent);color:#fff;padding:5px 8px;"
                  title="تعديل بيانات الطلب">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-icon"
                  onclick="convertToTransfer('${i.id}', this)"
                  style="background:#8b5cf6;color:#fff;padding:5px 8px;"
                  title="متوفر بفرع آخر">
                  <i class="fas fa-exchange-alt"></i>
                </button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    async function autoSave(id, triggerEl) {
      const statusEl  = document.getElementById(`stat-${id}`);
      const compEl    = document.getElementById(`comp-${id}`);
      const actionEl  = document.getElementById(`action-${id}`);
      if (!statusEl) return;

      const icons     = actionEl.querySelector('div');
      const checkIcon = icons ? icons.querySelector('.fa-check-circle, .fa-spinner, .fa-exclamation-circle') : null;
      if (checkIcon) checkIcon.className = 'fas fa-spinner fa-spin';

      const success = await sbTaskUpdate(id, {
        state:   statusEl.value,
        company: compEl ? compEl.value : ''
      });

      if (success) {
        if (checkIcon) {
          checkIcon.className   = 'fas fa-check-circle';
          checkIcon.style.color = 'var(--success)';
          setTimeout(() => { if(checkIcon) checkIcon.style.color = 'var(--text-muted)'; }, 2000);
        }
        const item = rawData.find(x => x.id == id);
        if (item) { item.status = statusEl.value; item.company = compEl ? compEl.value : ''; }
      } else {
        if (checkIcon) {
          checkIcon.className   = 'fas fa-exclamation-circle';
          checkIcon.style.color = 'var(--danger)';
        }
        if (triggerEl) alert("⚠️ فشل في الحفظ");
      }
    }

    // ===== Modal التعديل =====
    function updateOtLabel() {
      const labels = { 'دواء': 'ot-label-dawaa', 'كوزمو': 'ot-label-cosmo', 'تركيبات': 'ot-label-tark' };
      Object.values(labels).forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.style.borderColor = '#334155'; el.style.background = '#0f172a'; el.style.color = '#94a3b8'; }
      });
      const checked = document.querySelector('input[name="edit_order_type"]:checked');
      if (checked) {
        const lbl = checked.closest('label');
        if (lbl) { lbl.style.borderColor = '#38bdf8'; lbl.style.background = '#0c4a6e'; lbl.style.color = '#7dd3fc'; }
      }
    }

    function openEditModal(id) {
      const item = rawData.find(x => x.id == id);
      if (!item) return;

      document.getElementById('edit-id').value        = id;
      document.getElementById('edit-item-code').value = item.item_code     || '';
      document.getElementById('edit-item-name').value = item.item_name     || '';
      document.getElementById('edit-cust-code').value = item.customer_code || '';
      document.getElementById('edit-cust-name').value = item.customer_name || '';
      document.getElementById('edit-company').value   = item.company       || '';

      document.querySelectorAll('input[name="edit_order_type"]').forEach(r => {
        r.checked = (r.value === item.order_type);
      });
      updateOtLabel();

      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    async function saveEdit() {
      const btn          = document.getElementById('edit-save-btn');
      const id           = document.getElementById('edit-id').value;
      const selectedType = document.querySelector('input[name="edit_order_type"]:checked')?.value || null;

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      const success = await sbTaskUpdate(id, {
        item_code:  document.getElementById('edit-item-code').value.trim() || null,
        item_name:  document.getElementById('edit-item-name').value.trim() || null,
        cust_code:  document.getElementById('edit-cust-code').value.trim() || null,
        cust_name:  document.getElementById('edit-cust-name').value.trim() || null,
        company:    document.getElementById('edit-company').value.trim()   || null,
        order_type: selectedType,
      });

      if (success) {
        const item = rawData.find(x => x.id == id);
        if (item) {
          item.item_code     = document.getElementById('edit-item-code').value.trim();
          item.item_name     = document.getElementById('edit-item-name').value.trim();
          item.customer_code = document.getElementById('edit-cust-code').value.trim();
          item.customer_name = document.getElementById('edit-cust-name').value.trim();
          item.company       = document.getElementById('edit-company').value.trim();
          item.order_type    = selectedType || item.order_type;
        }
        closeEditModal();
        applyFilter();
      } else {
        alert("❌ فشل الحفظ");
      }

      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
    }

    // ===== تحويل من فرع =====
    async function convertToTransfer(id, btn) {
      const item = rawData.find(x => x.id == id);
      if (!item) return;

      const branches = Branches.names().filter(b => b !== item.branch);
      const selected = await showBranchPicker(branches);
      if (!selected) return;

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const success = await sbTaskUpdate(id, {
        type:   'تحويل',
        branch: selected,
        state:  'pending'
      });

      if (success) {
        btn.style.background = "#16a34a";
        btn.innerHTML        = '<i class="fas fa-check"></i>';
        setTimeout(() => loadOrders(), 800);
      } else {
        alert("❌ فشل التحويل");
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-exchange-alt"></i>';
      }
    }

    function showBranchPicker(branches) {
      return new Promise(resolve => {
        const result = prompt(
          `اختر الفرع المتوفر فيه الصنف:\n${branches.map((b, i) => `${i+1}. ${b}`).join('\n')}\n\nاكتب الرقم:`
        );
        if (!result) { resolve(null); return; }
        const idx = parseInt(result) - 1;
        resolve(branches[idx] || null);
      });
    }

    document.getElementById('edit-modal').addEventListener('click', function(e) {
      if (e.target === this) closeEditModal();
    });
  </script>
</body>
</html>
