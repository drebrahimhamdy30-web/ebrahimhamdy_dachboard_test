<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إغلاق الشيفت - صيدليات د. إبراهيم</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .section-title {
      font-size: 0.95rem; font-weight: 800; color: var(--text-primary);
      margin: 20px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .section-title:first-child { margin-top: 0; }

    /* ===== بطاقة وسيلة ===== */
    .method-card {
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 14px; margin-bottom: 10px; background: var(--surface);
    }
    .method-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .method-name { font-weight: 800; font-size: 0.92rem; color: var(--text-primary); }
    .method-badge {
      font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .badge-wallet  { background: #dcfce7; color: #15803d; }
    .badge-machine { background: #e0f2fe; color: #0369a1; }

    .method-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .field-box label {
      display: block; font-size: 0.72rem; font-weight: 700;
      color: var(--text-secondary); margin-bottom: 4px;
    }
    .field-box input { width: 100%; }
    .field-box input:disabled { background: var(--surface-3); color: var(--text-muted); }

    .calc-value {
      padding: 8px 12px; border-radius: var(--radius-sm);
      background: var(--surface-3); font-weight: 800; font-size: 0.95rem;
      text-align: center; color: var(--text-primary);
    }
    .calc-value.positive { background: #dcfce7; color: #15803d; }
    .calc-value.negative { background: #fee2e2; color: #b91c1c; }

    .hint {
      font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;
    }
    .hint-warn { color: var(--warning); font-weight: 700; }

    /* ===== الإجمالي ===== */
    .totals-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; padding: 16px; background: var(--surface-3);
      border-radius: var(--radius-md); margin-top: 16px;
    }
    .total-box { text-align: center; }
    .total-num { font-size: 1.35rem; font-weight: 900; color: var(--accent-dark); line-height: 1.2; }
    .total-num.grand { color: var(--success); font-size: 1.6rem; }
    .total-lbl { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; margin-top: 2px; }

    /* ===== الشيفتات غير المرحّلة ===== */
    .shift-row {
      border: 1px solid var(--border); border-radius: var(--radius-md);
      margin-bottom: 8px; overflow: hidden; background: var(--surface);
    }
    .shift-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; gap: 10px; cursor: pointer; flex-wrap: wrap;
      transition: background 0.15s;
    }
    .shift-head:hover { background: var(--surface-2); }
    .shift-meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 0.82rem; }
    .shift-total { font-weight: 900; font-size: 1rem; color: var(--success); }
    .shift-body {
      display: none; padding: 12px 14px; border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
    .shift-body.open { display: block; }
    .shift-body table { min-width: unset; font-size: 0.78rem; }
    .shift-body th, .shift-body td { padding: 6px 8px; }

    .empty-note {
      text-align: center; padding: 30px 16px; color: var(--text-muted); font-size: 0.88rem;
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #166534; color: #dcfce7; padding: 12px 24px; border-radius: 30px;
      font-weight: 700; font-size: 0.9rem; opacity: 0; transition: all 0.3s;
      z-index: 9999; white-space: nowrap; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: #991b1b; color: #fee2e2; }

    @media (max-width: 640px) {
      .method-fields { grid-template-columns: 1fr 1fr; }
      .totals-bar { grid-template-columns: 1fr; gap: 10px; }
      .shift-meta { gap: 8px; font-size: 0.76rem; }
    }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">

    <!-- ===== إغلاق شيفت جديد ===== -->
    <div class="card" style="margin-bottom:16px;">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-cash-register"></i> إغلاق الشيفت
          <span class="highlight" id="branch-tag"></span>
        </div>
        <button class="btn btn-primary" onclick="loadMethods()">
          <i class="fas fa-sync-alt"></i> تحديث
        </button>
      </div>

      <div id="close-form">
        <div class="empty-note">⏳ جاري تحميل الوسائل...</div>
      </div>
    </div>

    <!-- ===== الشيفتات غير المرحّلة ===== -->
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-clock-rotate-left"></i> شيفتات لم تُرحَّل
          <span id="unsettled-count" class="badge badge-yellow">0</span>
        </div>
        <button class="btn btn-primary" id="settle-all-btn" onclick="settleAll()" style="display:none;">
          <i class="fas fa-check-double"></i> ترحيل الكل
        </button>
      </div>

      <div id="unsettled-list">
        <div class="empty-note">⏳ جاري التحميل...</div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="api.js"></script>
  <script src="nav.js" defer></script>
  <script>
    let userBranch    = '';
    let userRole      = '';
    let employeeName  = '';
    let methods       = [];   // وسائل الفرع
    let openingMap    = {};   // method_key -> رصيد البداية
    let systemMap     = {};   // method_key -> اللي النظام حسبه
    let unsettled     = [];

    const isAccountant = () => userRole === 'accountant' || userRole === 'admin';

    checkAuth().then(user => {
      if (!user) return;
      userBranch   = (localStorage.getItem('userBranch') || '').trim();
      userRole     = (localStorage.getItem('userRole')   || 'employee').trim();
      employeeName = (localStorage.getItem('fullName') || user || '').trim();
      document.getElementById('branch-tag').textContent = userBranch;

      loadMethods();
      loadUnsettled();
    });

    function toast(msg, isErr = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('err', isErr);
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    const money = n => (Number(n) || 0).toLocaleString('en-EG', {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    });

    // ===== تحميل الوسائل + القيم المقترحة =====
    async function loadMethods() {
      const form = document.getElementById('close-form');
      form.innerHTML = '<div class="empty-note">⏳ جاري تحميل الوسائل...</div>';

      try {
        const data = await fetchPosCloseData(userBranch);

        methods    = data.methods    || [];
        openingMap = data.openings   || {};
        systemMap  = data.system     || {};

        if (!methods.length) {
          form.innerHTML = `<div class="empty-note">
            لا توجد وسائل مسجّلة لفرع ${userBranch}.<br>
            <span style="font-size:0.78rem;">أضِف الوسائل في جدول <code>pos_methods</code> أولاً.</span>
          </div>`;
          return;
        }

        renderForm();
      } catch (e) {
        form.innerHTML = '<div class="empty-note" style="color:var(--danger);">❌ فشل تحميل الوسائل</div>';
      }
    }

    function renderForm() {
      const wallets  = methods.filter(m => m.method_type === 'wallet');
      const machines = methods.filter(m => m.method_type === 'machine');

      let html = '';

      if (wallets.length) {
        html += `<div class="section-title">💳 المحافظ</div>`;
        html += wallets.map(renderWallet).join('');
      }

      if (machines.length) {
        html += `<div class="section-title">🖥️ الماكينات</div>`;
        html += machines.map(renderMachine).join('');
      }

      html += `
        <div class="totals-bar">
          <div class="total-box">
            <div class="total-num" id="tot-wallets">0.00</div>
            <div class="total-lbl">إجمالي المحافظ</div>
          </div>
          <div class="total-box">
            <div class="total-num" id="tot-machines">0.00</div>
            <div class="total-lbl">إجمالي الماكينات</div>
          </div>
          <div class="total-box">
            <div class="total-num grand" id="tot-grand">0.00</div>
            <div class="total-lbl">الإجمالي الكلي</div>
          </div>
        </div>

        <div class="field-box" style="margin-top:14px;">
          <label>ملاحظات (اختياري)</label>
          <input type="text" id="shift-notes" class="form-input" placeholder="أي ملاحظة على الشيفت...">
        </div>

        <button class="btn btn-success" id="close-shift-btn"
                onclick="closeShift()" style="margin-top:14px;width:100%;justify-content:center;">
          <i class="fas fa-lock"></i> إغلاق الشيفت
        </button>
      `;

      document.getElementById('close-form').innerHTML = html;
      recalc();
    }

    function renderWallet(m) {
      const key      = m.method_key;
      const opening  = openingMap[key];
      const sysClose = systemMap[key];

      const hasOpening = opening !== undefined && opening !== null;

      return `
        <div class="method-card" data-key="${key}" data-type="wallet">
          <div class="method-head">
            <span class="method-name">${m.display_name}</span>
            <span class="method-badge badge-wallet">محفظة</span>
          </div>
          <div class="method-fields">
            <div class="field-box">
              <label>رصيد البداية</label>
              <input type="number" step="0.01" class="form-input inp-opening"
                     value="${hasOpening ? opening : ''}"
                     ${hasOpening ? 'disabled' : ''}
                     placeholder="اكتب الرصيد..."
                     oninput="recalc()">
              <div class="hint">${hasOpening ? 'من آخر شيفت مقفول' : '<span class="hint-warn">أول شيفت — اكتبه يدوي</span>'}</div>
            </div>
            <div class="field-box">
              <label>رصيد النهاية</label>
              <input type="number" step="0.01" class="form-input inp-closing"
                     value="${sysClose ?? ''}"
                     placeholder="اكتب الرصيد..."
                     oninput="recalc()">
              <div class="hint">${sysClose != null ? `النظام: ${money(sysClose)} — عدّله لو مختلف` : 'لم يصل رصيد من النظام'}</div>
            </div>
            <div class="field-box">
              <label>الفعلي للفترة</label>
              <div class="calc-value out-actual">0.00</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMachine(m) {
      const key   = m.method_key;
      const sysAmt = systemMap[key];

      return `
        <div class="method-card" data-key="${key}" data-type="machine">
          <div class="method-head">
            <span class="method-name">${m.display_name}</span>
            <span class="method-badge badge-machine">ماكينة</span>
          </div>
          <div class="method-fields">
            <div class="field-box">
              <label>قيمة الريسيت</label>
              <input type="number" step="0.01" class="form-input inp-receipt"
                     placeholder="من ريسيت الإغلاق..."
                     oninput="recalc()">
              <div class="hint">اكتب القيمة من ريسيت إغلاق الماكينة</div>
            </div>
            <div class="field-box">
              <label>حسب النظام</label>
              <div class="calc-value">${money(sysAmt ?? 0)}</div>
              <div class="hint">مجموع المعاملات غير المقفولة</div>
            </div>
            <div class="field-box">
              <label>الفرق</label>
              <div class="calc-value out-diff">0.00</div>
            </div>
          </div>
        </div>
      `;
    }

    // ===== حساب لحظي =====
    function recalc() {
      let totWallets = 0, totMachines = 0;

      document.querySelectorAll('.method-card').forEach(card => {
        const key  = card.dataset.key;
        const type = card.dataset.type;

        if (type === 'wallet') {
          const opening = parseFloat(card.querySelector('.inp-opening').value);
          const closing = parseFloat(card.querySelector('.inp-closing').value);
          const outEl   = card.querySelector('.out-actual');

          const actual = (isFinite(opening) && isFinite(closing)) ? (closing - opening) : 0;
          totWallets += actual;

          outEl.textContent = money(actual);
          outEl.classList.toggle('positive', actual > 0);
          outEl.classList.toggle('negative', actual < 0);

        } else {
          const receipt = parseFloat(card.querySelector('.inp-receipt').value);
          const sysAmt  = Number(systemMap[key]) || 0;
          const diffEl  = card.querySelector('.out-diff');

          const actual = isFinite(receipt) ? receipt : 0;
          totMachines += actual;

          const diff = isFinite(receipt) ? (receipt - sysAmt) : 0;
          diffEl.textContent = money(diff);
          diffEl.classList.toggle('positive', diff > 0);
          diffEl.classList.toggle('negative', diff < 0);
        }
      });

      document.getElementById('tot-wallets').textContent  = money(totWallets);
      document.getElementById('tot-machines').textContent = money(totMachines);
      document.getElementById('tot-grand').textContent    = money(totWallets + totMachines);
    }

    // ===== إغلاق الشيفت =====
    async function closeShift() {
      const btn = document.getElementById('close-shift-btn');
      const lines = [];
      let totWallets = 0, totMachines = 0;
      let missing = false;

      document.querySelectorAll('.method-card').forEach(card => {
        const key  = card.dataset.key;
        const type = card.dataset.type;
        const m    = methods.find(x => x.method_key === key) || {};

        if (type === 'wallet') {
          const openEl = card.querySelector('.inp-opening');
          const closeEl = card.querySelector('.inp-closing');
          const opening = parseFloat(openEl.value);
          const closing = parseFloat(closeEl.value);

          if (!isFinite(opening) || !isFinite(closing)) {
            missing = true;
            (!isFinite(opening) ? openEl : closeEl).style.borderColor = 'var(--danger)';
            return;
          }
          openEl.style.borderColor = '';
          closeEl.style.borderColor = '';

          const actual = closing - opening;
          totWallets += actual;

          lines.push({
            method_type:     'wallet',
            method_key:      key,
            display_name:    m.display_name || key,
            opening_balance: opening,
            closing_balance: closing,
            system_closing:  systemMap[key] ?? null,
            actual_amount:   actual,
            system_amount:   null,
            difference:      null
          });

        } else {
          const recEl   = card.querySelector('.inp-receipt');
          const receipt = parseFloat(recEl.value);

          if (!isFinite(receipt)) {
            missing = true;
            recEl.style.borderColor = 'var(--danger)';
            return;
          }
          recEl.style.borderColor = '';

          const sysAmt = Number(systemMap[key]) || 0;
          totMachines += receipt;

          lines.push({
            method_type:    'machine',
            method_key:     key,
            display_name:   m.display_name || key,
            receipt_amount: receipt,
            actual_amount:  receipt,
            system_amount:  sysAmt,
            difference:     receipt - sysAmt
          });
        }
      });

      if (missing) {
        toast('املأ كل الخانات المطلوبة أولاً', true);
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإغلاق...';

      const ok = await submitPosShift({
        branch:         userBranch,
        employee_name:  employeeName,
        total_wallets:  totWallets,
        total_machines: totMachines,
        grand_total:    totWallets + totMachines,
        notes:          document.getElementById('shift-notes').value.trim() || null,
        lines:          lines
      });

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-lock"></i> إغلاق الشيفت';

      if (ok) {
        toast('✅ تم إغلاق الشيفت');
        loadMethods();
        loadUnsettled();
      } else {
        toast('❌ فشل الإغلاق، حاول تاني', true);
      }
    }

    // ===== الشيفتات غير المرحّلة =====
    async function loadUnsettled() {
      const list = document.getElementById('unsettled-list');
      list.innerHTML = '<div class="empty-note">⏳ جاري التحميل...</div>';

      try {
        unsettled = await fetchUnsettledShifts(userBranch) || [];

        document.getElementById('unsettled-count').textContent = unsettled.length;
        document.getElementById('settle-all-btn').style.display =
          (isAccountant() && unsettled.length) ? 'inline-flex' : 'none';

        if (!unsettled.length) {
          list.innerHTML = '<div class="empty-note">لا توجد شيفتات في انتظار الترحيل ✅</div>';
          return;
        }

        list.innerHTML = unsettled.map(renderShiftRow).join('');
      } catch (e) {
        list.innerHTML = '<div class="empty-note" style="color:var(--danger);">❌ فشل تحميل الشيفتات</div>';
      }
    }

    function renderShiftRow(s) {
      let dateStr = s.shift_date || '';
      try { dateStr = new Date(s.closed_at).toLocaleString('ar-EG', {
        dateStyle: 'short', timeStyle: 'short'
      }); } catch(e) {}

      const linesHtml = (s.lines || []).map(l => `
        <tr>
          <td>${l.display_name}</td>
          <td>${l.method_type === 'wallet' ? 'محفظة' : 'ماكينة'}</td>
          <td>${l.method_type === 'wallet'
                ? `${money(l.opening_balance)} ← ${money(l.closing_balance)}`
                : money(l.receipt_amount)}</td>
          <td style="font-weight:800;">${money(l.actual_amount)}</td>
          <td style="color:${Number(l.difference) ? 'var(--danger)' : 'inherit'};">
            ${l.difference != null ? money(l.difference) : '—'}
          </td>
        </tr>
      `).join('');

      return `
        <div class="shift-row">
          <div class="shift-head" onclick="toggleShift(${s.id})">
            <div class="shift-meta">
              <span><i class="fas fa-user" style="color:var(--text-muted);"></i> <b>${s.employee_name}</b></span>
              <span><i class="fas fa-calendar" style="color:var(--text-muted);"></i> ${dateStr}</span>
              <span class="badge badge-gray">محافظ: ${money(s.total_wallets)}</span>
              <span class="badge badge-blue">ماكينات: ${money(s.total_machines)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="shift-total">${money(s.grand_total)}</span>
              ${isAccountant() ? `
                <button class="btn btn-sm btn-success"
                        onclick="event.stopPropagation(); settleShift(${s.id}, this)">
                  <i class="fas fa-check"></i> ترحيل
                </button>` : ''}
              <i class="fas fa-chevron-down" id="chev-${s.id}" style="color:var(--text-muted);"></i>
            </div>
          </div>
          <div class="shift-body" id="body-${s.id}">
            ${s.notes ? `<p style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;">
              📝 ${s.notes}</p>` : ''}
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>الوسيلة</th><th>النوع</th><th>القيم</th><th>الفعلي</th><th>الفرق</th></tr>
                </thead>
                <tbody>${linesHtml || '<tr><td colspan="5">لا توجد تفاصيل</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function toggleShift(id) {
      const body = document.getElementById(`body-${id}`);
      const chev = document.getElementById(`chev-${id}`);
      const isOpen = body.classList.toggle('open');
      chev.style.transform = isOpen ? 'rotate(180deg)' : '';
    }

    async function settleShift(id, btn) {
      if (!confirm('ترحيل الشيفت ده؟ مش هينفع تتراجع.')) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const ok = await settlePosShift(id, employeeName);

      if (ok) {
        toast('✅ تم الترحيل');
        loadUnsettled();
      } else {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> ترحيل';
        toast('❌ فشل الترحيل', true);
      }
    }

    async function settleAll() {
      if (!unsettled.length) return;
      if (!confirm(`ترحيل كل الشيفتات (${unsettled.length})؟ مش هينفع تتراجع.`)) return;

      const btn = document.getElementById('settle-all-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الترحيل...';

      let failed = 0;
      for (const s of unsettled) {
        const ok = await settlePosShift(s.id, employeeName);
        if (!ok) failed++;
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check-double"></i> ترحيل الكل';

      toast(failed ? `⚠️ فشل ترحيل ${failed} شيفت` : '✅ تم ترحيل الكل', failed > 0);
      loadUnsettled();
    }
  </script>
</body>
</html>
