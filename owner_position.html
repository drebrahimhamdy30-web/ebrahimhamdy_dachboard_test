<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الموقف اليومي</title>
<link rel="stylesheet" href="tokens.css?v=20260906">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{ --teal:#0d9488; --teal-d:#0f766e; --blue:#0369a1; --amber:#92400e;
         --red:#dc2626; --green:#15803d; }
  *{ box-sizing:border-box; }
  body{ font-family:'Cairo',sans-serif; color:var(--text,#1f2937); background:var(--bg,#f1f5f9);
        margin:0; padding:14px; font-size:.86rem; }
  .wrap{ max-width:100%; margin:0 auto; }
  h1{ font-size:1.1rem; font-weight:800; display:flex; align-items:center; gap:8px; margin:0 0 10px; }
  h1 .ic{ color:var(--teal); }
  .spacer{ flex:1; }
  .btn{ border:0; border-radius:9px; padding:8px 13px; font-family:inherit; font-weight:800; font-size:.82rem; cursor:pointer; }
  .btn-g{ background:var(--surface-2,#f1f5f9); color:inherit; border:1px solid var(--border,#e5e7eb); }

  /* ── شريط الفلاتر ── */
  .bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; background:var(--surface,#fff);
        border:1px solid var(--border,#e5e7eb); border-radius:12px; padding:10px 13px; margin-bottom:12px; }
  .fld{ display:flex; flex-direction:column; gap:3px; }
  .fld label{ font-size:.7rem; color:var(--text-muted,#6b7280); font-weight:700; }
  .inp{ height:32px; border:1px solid var(--border,#e5e7eb); border-radius:8px; padding:0 9px;
        font-family:inherit; font-size:.8rem; font-weight:700; background:var(--surface,#fff); color:inherit; }
  .hint{ font-size:.7rem; color:var(--text-muted,#9ca3af); font-weight:700; align-self:center; }
  .chips{ display:flex; gap:5px; flex-wrap:wrap; }
  .chip{ height:32px; border:1px solid var(--border,#e5e7eb); border-radius:8px; padding:0 11px;
         font-family:inherit; font-size:.78rem; font-weight:700; background:var(--surface,#fff);
         color:var(--text-muted,#6b7280); cursor:pointer; white-space:nowrap; }
  .chip:hover{ border-color:var(--teal); }
  .chip.on{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .chip.all.on{ background:var(--teal-d); border-color:var(--teal-d); }

  /* ── شريط الإحصاءات المضغوط: كل حاجة في صف واحد ── */
  /* ⚠️ كروت منفصلة مش شبكة بخلفية: الشبكة بتسيب خانات فاضية في
     آخر صف وبتبان كشريط رمادي مقطوع. */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(138px,1fr)); gap:8px;
          margin-bottom:12px; }
  .st{ background:var(--surface,#fff); border:1px solid var(--border,#e5e7eb);
       border-radius:10px; padding:8px 11px; min-width:0; }
  .st .k{ font-size:.68rem; color:var(--text-muted,#6b7280); font-weight:700;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st .v{ font-size:1.02rem; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px; line-height:1.25; }
  .st .d{ font-size:.68rem; font-weight:800; }
  .st.net{ grid-column:span 2; background:linear-gradient(135deg,var(--teal),var(--teal-d)); color:#fff; border-color:var(--teal-d); }
  .st.net .k{ color:rgba(255,255,255,.9); }
  .st.net .v{ font-size:1.35rem; }
  .st.net .d{ color:#fff; opacity:.95; }
  .st.g{ background:#ecfdf5; } .st.g .k{ color:#065f46; } .st.g .v{ color:#047857; }
  .st.minus .v{ color:var(--red); } .st.plus .v{ color:var(--blue); }
  .up{ color:var(--green); } .down{ color:var(--red); } .flat{ color:var(--text-muted,#9ca3af); }
  .st.net .up, .st.net .down, .st.net .flat{ color:#fff; }
  .cov{ font-size:.63rem; color:var(--text-muted,#9ca3af); font-weight:700; }

  /* ── الجدول ── */
  .card{ background:var(--surface,#fff); border:1px solid var(--border,#e5e7eb); border-radius:12px;
         overflow:hidden; margin-bottom:12px; }
  .card-h{ padding:9px 14px; font-weight:800; border-bottom:1px solid var(--border,#e5e7eb);
           display:flex; justify-content:space-between; align-items:center; background:#f8fafc; gap:10px; flex-wrap:wrap; }
  .card-h .code{ font-size:.7rem; color:var(--text-muted,#6b7280); font-weight:700; }
  .tscroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:.82rem; }
  thead th{ background:var(--surface-2,#f8fafc); color:var(--text-secondary,#475569); text-align:right;
            padding:8px 11px; font-weight:700; border-bottom:1px solid var(--border,#e5e7eb); white-space:nowrap; }
  tbody td{ padding:8px 11px; border-bottom:1px solid var(--border,#eef2f7); text-align:right; white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:0; }
  tfoot td{ padding:9px 11px; font-weight:800; background:#f8fafc; border-top:2px solid var(--border,#e5e7eb); }
  .num{ font-variant-numeric:tabular-nums; }
  .br{ font-weight:800; }
  .netcol{ background:#ecfdf5; color:var(--teal-d); font-weight:800; }
  .sub{ display:block; font-size:.66rem; font-weight:700; color:var(--text-muted,#9ca3af); }

  .msg{ padding:9px 13px; border-radius:10px; font-weight:700; margin-bottom:12px; display:none; }
  .msg.on{ display:block; }
  .msg.err{ background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
  .foot{ font-size:.72rem; color:var(--text-muted,#6b7280); line-height:1.85;
         display:flex; gap:18px; flex-wrap:wrap; }
  .foot b{ color:var(--text-secondary,#475569); }
  .stale{ color:var(--red); font-weight:800; }
  .empty{ text-align:center; color:var(--text-muted,#9ca3af); padding:20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><i class="fas fa-chart-pie ic"></i> الموقف اليومي
    <span class="spacer"></span>
    <button class="btn btn-g" onclick="load()"><i class="fas fa-sync-alt"></i> تحديث</button>
  </h1>

  <div class="msg" id="msg"></div>

  <div class="bar">
    <div class="fld"><label>الفرع</label>
      <div class="chips" id="fBranch"></div></div>
    <div class="fld"><label>المقارنة مع</label>
      <select class="inp" id="fCompare" onchange="render()"></select></div>
    <div class="fld"><label>العرض</label>
      <select class="inp" id="fView" onchange="render()">
        <option value="all">كل الأرقام</option>
        <option value="assets">الأصول فقط</option>
        <option value="net">الصافي فقط</option>
      </select></div>
    <span class="hint" id="hint"></span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="card-h"><span><i class="fas fa-code-branch"></i> التفصيل بالفرع</span>
      <span class="code" id="asOf"></span></div>
    <div class="tscroll">
      <table>
        <thead><tr id="th"></tr></thead>
        <tbody id="tb"><tr><td class="empty">جارٍ التحميل…</td></tr></tbody>
        <tfoot id="tf"></tfoot>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><span><i class="fas fa-clock-rotate-left"></i> آخر تحديث لكل مصدر</span></div>
    <div style="padding:10px 14px" class="foot" id="fresh">—</div>
  </div>
</div>

<script src="config.js?v=20260904c"></script>
<script src="session.js?v=20261030b"></script>
<script src="branches.js?v=20260904d"></script>
<script src="pages.js?v=20260904d"></script>
<script src="brand.js?v=20261017n"></script>
<script src="api.js?v=20260926dl"></script>
<script>
  let POS = null;
  const SEL = new Set();   // فاضية = كل الفروع

  const f0 = n => (n==null ? '—' : Math.round(Number(n)).toLocaleString('en-US'));
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ⚠️ كل الأوقات بتوقيت القاهرة مهما كان توقيت جهاز المستخدم —
     في أجهزة قديمة ساعتها غلط والعرض كان هيتبع الجهاز. */
  function cairoDT(ts){
    if(!ts) return '—';
    try{ return new Date(ts).toLocaleString('ar-EG',{ timeZone:'Africa/Cairo',
           day:'2-digit', month:'2-digit', hour:'numeric', minute:'2-digit' }); }
    catch(e){ return String(ts); }
  }
  function cairoD(d){
    if(!d) return '—';
    try{ return new Date(d+'T00:00:00').toLocaleDateString('ar-EG',{ timeZone:'Africa/Cairo',
           day:'2-digit', month:'2-digit', year:'numeric' }); }
    catch(e){ return String(d); }
  }
  function hoursSince(ts){
    if(!ts) return null;
    const t = new Date(ts).getTime();
    return isFinite(t) ? (Date.now() - t) / 3600000 : null;
  }
  /* ⚠️ العربي مش بيجمع زي الإنجليزي: ٢ مثنى، ٣–١٠ جمع، ١١+ مفرد
     منصوب. «قبل 7 يوم» غلط لغوي بيبان في وش المالك كل يوم. */
  function agoLabel(n){
    if(n==null) return '';
    if(n === 1)  return 'أمس';
    if(n === 2)  return 'قبل يومين';
    if(n <= 10)  return 'قبل '+n+' أيام';
    return 'قبل '+n+' يومًا';
  }
  function daysAgo(d){
    if(!POS || !POS.today) return null;
    const a = new Date(POS.today+'T00:00:00'), b = new Date(d+'T00:00:00');
    return Math.round((a - b) / 86400000);
  }

  /* `good:false` معناه إن الزيادة إشارة وحشة — المستحق للموردين
     ومديونية العملاء زيادتهم تحذير حتى لو مديونية العملاء بتزوّد
     الصافي حسابيًا. */
  function delta(now, prev, good){
    if(prev==null || now==null) return '<span class="flat">—</span>';
    const d = Math.round(Number(now) - Number(prev));
    if(d === 0) return '<span class="flat">بدون تغيّر</span>';
    const up = d > 0;
    const cls = (good === false) ? (up ? 'down' : 'up') : (up ? 'up' : 'down');
    return '<span class="'+cls+'">'+(up?'▲':'▼')+' '+f0(Math.abs(d))+'</span>';
  }

  function showErr(t){
    const m = document.getElementById('msg');
    m.textContent = t; m.className = 'msg err on';
  }

  async function rpc(fn, body){
    let r, out = null;
    try{
      r = await fetch(SB_URL_API+'/rest/v1/rpc/'+fn, { method:'POST',
            headers: await sbH({'Content-Type':'application/json'}), body: JSON.stringify(body||{}) });
      try{ out = await r.json(); }catch(e){ out = null; }
    }catch(e){ return { error:'تعذّر الاتصال بالخادم' }; }
    if(r.ok) return out;
    /* رسالة الحارس لازم توصل للمستخدم: «الشاشة دي للمالك» أو
       «يلزم تسجيل الدخول» — الرد الفاضي كان بيبان «تعذّر التحميل». */
    return { error: (out && (out.message || out.hint)) || ('تعذّر التحميل ('+r.status+')') };
  }

  /* ── الفلاتر ──────────────────────────────────────────────── */
  function fillFilters(){
    const bs = (POS && POS.branches) || [];
    /* SEL فاضية = كل الفروع. أسهل من إننا نملاها بكل الأكواد
       ونفضل نزامنها لو اتزاد فرع جديد. */
    const allOn = SEL.size === 0 || SEL.size === bs.length;
    document.getElementById('fBranch').innerHTML =
        '<button type="button" class="chip all'+(allOn?' on':'')+'" onclick="pickAll()">كل الفروع</button>'
      + bs.map(x=>'<button type="button" class="chip'+(SEL.size===0||SEL.has(x.code)?' on':'')
          +'" onclick="pickBranch(&quot;'+esc(x.code)+'&quot;)">'+esc(x.name)+'</button>').join('');

    /* ⚠️ الخيارات من اللقطات الموجودة فعلًا — مش «أمس/أسبوع/شهر»
       ثابتة. لو اللقطة فاتت، خيار ثابت كان هيوعد بمقارنة مش موجودة. */
    const h = (POS && POS.history) || [];
    const cSel = document.getElementById('fCompare');
    const keepC = cSel.value;
    cSel.innerHTML = h.length
      ? h.map((x,i)=>{
          const lbl = agoLabel(daysAgo(x.d));
          return '<option value="'+esc(x.d)+'">'+cairoD(x.d)+(lbl?' — '+lbl:'')+'</option>';
        }).join('')
      : '<option value="">لا توجد لقطة سابقة</option>';
    if(keepC && h.some(x=>x.d===keepC)) cSel.value = keepC;
    cSel.disabled = !h.length;
    document.getElementById('hint').textContent =
      h.length ? ('لقطات متاحة: '+h.length) : 'المقارنة تبدأ بعد أول لقطة ليلية';
  }

  /* قواعد الضغط — المقصود تكون متوقّعة:
     • «كل الفروع» بتمسح الاختيار (= الكل).
     • ضغطة على فرع والكل مختار = اعرض الفرع ده لوحده (أسرع طريق).
     • آخر فرع متبقي لو اتشال، نرجع للكل بدل ما الشاشة تفضى. */
  function pickAll(){ SEL.clear(); render(); }
  function pickBranch(code){
    const n = ((POS && POS.branches) || []).length;
    if(SEL.size === 0 || SEL.size === n){ SEL.clear(); SEL.add(code); }
    else if(SEL.has(code)){ SEL.delete(code); if(SEL.size === 0) SEL.clear(); }
    else SEL.add(code);
    render();
  }

  function baseRows(){
    const d = document.getElementById('fCompare').value;
    const h = (POS && POS.history) || [];
    const hit = h.find(x => x.d === d);
    return hit ? hit.rows : null;
  }
  function visibleBranches(){
    const rows = (POS && POS.branches) || [];
    return SEL.size ? rows.filter(x => SEL.has(x.code)) : rows;
  }

  const COLS = [
    { k:'stock_cost',     t:'المخزون بالتكلفة',   ic:'fa-boxes-stacked',         cls:'plus',  good:true,  grp:'assets' },
    { k:'cash',           t:'النقدية بالخزائن',   ic:'fa-sack-dollar',           cls:'plus',  good:true,  grp:'assets' },
    { k:'customers_debt', t:'مديونية العملاء',    ic:'fa-user-clock',            cls:'plus',  good:false, grp:'assets' },
    { k:'vendors_due',    t:'المستحق للموردين',   ic:'fa-file-invoice-dollar',   cls:'minus', good:false, grp:'liab'  }
  ];

  function sum(rows, key){ return rows.reduce((s,x)=> s + (Number(x[key])||0), 0); }
  function mtdOf(rows){
    let sales=0, profit=0, any=false;
    rows.forEach(x=>{ const m=x.mtd; if(m && m.sales!=null){ any=true; sales+=Number(m.sales)||0; profit+=Number(m.profit)||0; } });
    if(!any) return null;
    return { sales, profit, margin: sales ? Math.round(profit/sales*1000)/10 : null };
  }
  function sumBase(rows, key){
    const base = baseRows();
    if(!base) return null;
    let any = false, t = 0;
    rows.forEach(x=>{ const p = base[x.code]; if(p && p[key]!=null){ any = true; t += Number(p[key]); } });
    return any ? t : null;
  }
  function baseOf(code, key){
    const base = baseRows();
    const p = base && base[code];
    return (p && p[key]!=null) ? Number(p[key]) : null;
  }

  function render(){
    if(!POS) return;
    fillFilters();
    const rows = visibleBranches();
    const view = document.getElementById('fView').value;
    if(!rows.length){
      document.getElementById('stats').innerHTML = '';
      document.getElementById('tb').innerHTML = '<tr><td class="empty">لا توجد بيانات</td></tr>';
      return;
    }

    const tNet = sum(rows,'net'), bNet = sumBase(rows,'net');
    const tSell = sum(rows,'stock_sell');

    /* ── شريط الإحصاءات ── */
    let tiles = ['<div class="st net"><div class="k">صافي الموقف</div>'
      + '<div class="v">'+f0(tNet)+'</div>'
      + '<div class="d">'+delta(tNet, bNet, true)+'</div></div>'];

    if(view !== 'net'){
      const covs = rows.map(x=>Number(x.cost_coverage_pct)).filter(v=>isFinite(v));
      const minCov = covs.length ? Math.min.apply(null, covs) : null;
      COLS.filter(c => view === 'all' || c.grp === 'assets').forEach(c=>{
        const v = sum(rows, c.k), b = sumBase(rows, c.k);
        tiles.push('<div class="st '+c.cls+'">'
          + '<div class="k"><i class="fas '+c.ic+'"></i> '+c.t+'</div>'
          + '<div class="v">'+f0(v)+'</div>'
          + '<div class="d">'+delta(v, b, c.good)+'</div>'
          + (c.k==='stock_cost' && minCov!=null
              ? '<div class="cov">تقديري · تغطية '+minCov+'٪+</div>' : '')
          + '</div>');
      });
    }

    /* المبيعات تتبع الفلتر: فرع واحد يوريه أرقامه هو، وكل الفروع
       توري الإجمالي. من غير كده الفلتر كان بيخفي الكروت أصلًا. */
    const m = mtdOf(rows);
    if(view === 'all'){
      tiles.push('<div class="st"><div class="k">المخزون بسعر البيع</div><div class="v">'+f0(tSell)+'</div></div>');
      if(m){
        tiles.push('<div class="st g"><div class="k">مبيعات الشهر</div><div class="v">'+f0(m.sales)+'</div></div>');
        tiles.push('<div class="st g"><div class="k">مجمل الربح</div><div class="v">'+f0(m.profit)+'</div></div>');
        tiles.push('<div class="st g"><div class="k">هامش الربح</div><div class="v">'+(m.margin!=null?m.margin+'٪':'—')+'</div></div>');
      }
    }
    document.getElementById('stats').innerHTML = tiles.join('');

    /* ── الجدول ── */
    const cols = view === 'net'    ? []
               : view === 'assets' ? COLS.filter(c => c.grp === 'assets')
               : COLS;
    document.getElementById('th').innerHTML =
        '<th>الفرع</th>'
      + cols.map(c=>'<th>'+c.t+'</th>').join('')
      + (view === 'all' ? '<th>المخزون بسعر البيع</th>' : '')
      + '<th class="netcol">صافي الموقف</th><th>التغيّر</th>';

    document.getElementById('tb').innerHTML = rows.map(x =>
        '<tr><td class="br">'+esc(x.name)+'</td>'
      + cols.map(c=>'<td class="num">'+f0(x[c.k])
          + (c.k==='stock_cost' && x.cost_coverage_pct!=null
              ? '<span class="sub">تغطية '+x.cost_coverage_pct+'٪</span>' : '')+'</td>').join('')
      + (view === 'all' ? '<td class="num">'+f0(x.stock_sell)+'</td>' : '')
      + '<td class="num netcol">'+f0(x.net)+'</td>'
      + '<td class="num">'+delta(x.net, baseOf(x.code,'net'), true)+'</td></tr>').join('');

    document.getElementById('tf').innerHTML = (rows.length > 1)
      ? ('<tr><td>الإجمالي</td>'
         + cols.map(c=>'<td class="num">'+f0(sum(rows,c.k))+'</td>').join('')
         + (view === 'all' ? '<td class="num">'+f0(tSell)+'</td>' : '')
         + '<td class="num netcol">'+f0(tNet)+'</td>'
         + '<td class="num">'+delta(tNet, bNet, true)+'</td></tr>')
      : '';

    document.getElementById('asOf').textContent = 'الأرقام لحظة ' + cairoDT(POS.as_of);

    /* ⚠️ الشاشة بتجمع مصادر دقّتها مختلفة — من غير آخر تحديث جنب كل
       رقم، مصدر واقف يبان كأنه النهارده. */
    const fr = POS.freshness || {};
    const srcs = [
      { k:'المخزون',          t:(rows[0]||{}).stock_updated_at, lim:6 },
      { k:'أرصدة الموردين',   t:fr.vendors,   lim:6 },
      { k:'أرصدة العملاء',    t:fr.customers, lim:6 },
      { k:'النقدية',          t:fr.cash,      lim:30 },
      { k:'الربحية الشهرية',  t:fr.pnl,       lim:30 }
    ];
    document.getElementById('fresh').innerHTML = srcs.map(s=>{
      const h = hoursSince(s.t);
      const late = (h == null) || (h > s.lim);
      return '<span><b>'+s.k+':</b> <span'+(late?' class="stale"':'')+'>'+cairoDT(s.t)
           + (late ? ' ⚠️' : '') + '</span></span>';
    }).join('');
  }

  async function load(){
    document.getElementById('msg').className = 'msg';
    const res = await rpc('get_owner_position', {});
    const d = Array.isArray(res) ? res[0] : res;
    if(!d || d.error){
      showErr((d && d.error) || 'تعذّر تحميل الموقف');
      document.getElementById('tb').innerHTML = '<tr><td class="empty">—</td></tr>';
      return;
    }
    POS = d;
    render();
  }

  async function init(){
    try{ if(typeof Session!=='undefined' && Session.require) await Session.require(); }catch(e){}
    await load();
    try{ Session.syncWatch && Session.syncWatch(); }catch(e){}
  }
