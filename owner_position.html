<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الموقف اليومي</title>
<link rel="stylesheet" href="tokens.css?v=20260906">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{ --teal:#0d9488; --teal-d:#0f766e; --blue:#0369a1; --blueb:#e0f2fe;
         --amber:#92400e; --amberb:#fef3c7; --red:#dc2626; --green:#15803d; }
  *{ box-sizing:border-box; }
  body{ font-family:'Cairo',sans-serif; color:var(--text,#1f2937); background:var(--bg,#f1f5f9);
        margin:0; padding:16px; font-size:.86rem; }
  .wrap{ max-width:100%; margin:0 auto; }
  h1{ font-size:1.15rem; font-weight:800; display:flex; align-items:center; gap:8px; margin:0 0 12px; }
  h1 .ic{ color:var(--teal); }
  .btn{ border:0; border-radius:9px; padding:9px 14px; font-family:inherit; font-weight:800; font-size:.85rem; cursor:pointer; }
  .btn-g{ background:var(--surface-2,#f1f5f9); color:inherit; border:1px solid var(--border,#e5e7eb); }
  .spacer{ flex:1; }

  /* ── صافي الموقف ── */
  .hero{ background:linear-gradient(135deg,var(--teal),var(--teal-d)); color:#fff; border-radius:14px;
         padding:18px 22px; margin-bottom:14px; display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .hero .lbl{ font-size:.8rem; opacity:.9; font-weight:700; margin-bottom:4px; }
  .hero .big{ font-size:2.1rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
  .hero .eq{ font-size:.74rem; opacity:.82; margin-top:6px; }
  .hero .chg{ margin-inline-start:auto; text-align:center; background:rgba(255,255,255,.16);
              border-radius:12px; padding:10px 16px; min-width:150px; }
  .hero .chg .k{ font-size:.72rem; opacity:.9; font-weight:700; }
  .hero .chg .v{ font-size:1.15rem; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; }

  /* ── كروت الأرقام ── */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:14px; }
  .kpi{ background:var(--surface,#fff); border:1px solid var(--border,#e5e7eb); border-radius:12px; padding:13px 15px; }
  .kpi .k{ font-size:.75rem; color:var(--text-muted,#6b7280); font-weight:700; display:flex; align-items:center; gap:6px; }
  .kpi .v{ font-size:1.42rem; font-weight:800; font-variant-numeric:tabular-nums; margin-top:5px; }
  .kpi .d{ font-size:.74rem; font-weight:700; margin-top:3px; }
  .kpi.plus .v{ color:var(--blue); } .kpi.minus .v{ color:var(--red); }
  .up{ color:var(--green); } .down{ color:var(--red); } .flat{ color:var(--text-muted,#9ca3af); }
  .kpi .note{ font-size:.68rem; color:var(--text-muted,#9ca3af); font-weight:600; margin-top:3px; }

  /* ── الشهر الحالي ── */
  .mtd{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1px;
        background:var(--border,#e5e7eb); border:1px solid var(--border,#e5e7eb);
        border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .mtd>div{ background:var(--surface,#fff); padding:11px 15px; }
  .mtd .k{ font-size:.73rem; color:var(--text-muted,#6b7280); font-weight:700; }
  .mtd .v{ font-size:1.2rem; font-weight:800; font-variant-numeric:tabular-nums; margin-top:3px; }
  .mtd .hd{ background:#ecfdf5; } .mtd .hd .k{ color:#065f46; } .mtd .hd .v{ color:#047857; }

  /* ── جدول الفروع ── */
  .card{ background:var(--surface,#fff); border:1px solid var(--border,#e5e7eb); border-radius:12px;
         overflow:hidden; margin-bottom:14px; }
  .card-h{ padding:10px 15px; font-weight:800; border-bottom:1px solid var(--border,#e5e7eb);
           display:flex; justify-content:space-between; align-items:center; background:#f8fafc; }
  .card-h .code{ font-size:.72rem; color:var(--text-muted,#6b7280); font-weight:700; }
  .tscroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:.83rem; }
  thead th{ background:var(--surface-2,#f8fafc); color:var(--text-secondary,#475569); text-align:right;
            padding:9px 12px; font-weight:700; border-bottom:1px solid var(--border,#e5e7eb); white-space:nowrap; }
  tbody td{ padding:9px 12px; border-bottom:1px solid var(--border,#eef2f7); text-align:right; white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:0; }
  tfoot td{ padding:10px 12px; font-weight:800; background:#f8fafc; border-top:2px solid var(--border,#e5e7eb); }
  .num{ font-variant-numeric:tabular-nums; }
  .br{ font-weight:800; }
  .netcol{ background:#ecfdf5; color:var(--teal-d); font-weight:800; }
  .sub{ display:block; font-size:.68rem; font-weight:700; color:var(--text-muted,#9ca3af); }

  .msg{ padding:9px 13px; border-radius:10px; font-weight:700; margin-bottom:12px; display:none; }
  .msg.on{ display:block; }
  .msg.err{ background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
  .foot{ font-size:.73rem; color:var(--text-muted,#6b7280); line-height:1.9; }
  .foot b{ color:var(--text-secondary,#475569); }
  .stale{ color:var(--red); font-weight:800; }
  .empty{ text-align:center; color:var(--text-muted,#9ca3af); padding:22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><i class="fas fa-chart-pie ic"></i> الموقف اليومي
    <span class="spacer"></span>
    <button class="btn btn-g" onclick="load()"><i class="fas fa-sync-alt"></i> تحديث</button>
  </h1>

  <div class="msg" id="msg"></div>

  <div class="hero" id="hero" style="display:none">
    <div>
      <div class="lbl">صافي الموقف</div>
      <div class="big" id="heroNet">—</div>
      <div class="eq">المخزون بالتكلفة + النقدية + مديونية العملاء − المستحق للموردين</div>
    </div>
    <div class="chg" id="heroChg" style="display:none">
      <div class="k" id="chgLbl">مقارنة بأمس</div>
      <div class="v" id="chgVal">—</div>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="mtd" id="mtd" style="display:none"></div>

  <div class="card">
    <div class="card-h"><span><i class="fas fa-code-branch"></i> التفصيل بالفرع</span>
      <span class="code" id="asOf"></span></div>
    <div class="tscroll">
      <table>
        <thead><tr>
          <th>الفرع</th>
          <th>المخزون بالتكلفة</th>
          <th>المخزون بسعر البيع</th>
          <th>النقدية</th>
          <th>مديونية العملاء</th>
          <th>المستحق للموردين</th>
          <th class="netcol">صافي الموقف</th>
          <th>التغيّر</th>
        </tr></thead>
        <tbody id="tb"><tr><td colspan="8" class="empty">جارٍ التحميل…</td></tr></tbody>
        <tfoot id="tf"></tfoot>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><span><i class="fas fa-clock-rotate-left"></i> آخر تحديث لكل مصدر</span></div>
    <div style="padding:12px 15px" class="foot" id="fresh">—</div>
  </div>
</div>

<script src="config.js?v=20260904c"></script>
<script src="session.js?v=20261030b"></script>
<script src="branches.js?v=20260904d"></script>
<script src="pages.js?v=20260904d"></script>
<script src="brand.js?v=20261017n"></script>
<script src="api.js?v=20260926dl"></script>
<script>
  let POS = null;

  const f0 = n => (n==null ? '—' : Math.round(Number(n)).toLocaleString('en-US'));
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ⚠️ كل الأوقات بتوقيت القاهرة مهما كان توقيت جهاز المستخدم —
     في أجهزة قديمة ساعتها غلط والعرض كان هيتبع الجهاز. */
  function cairoDT(ts){
    if(!ts) return '—';
    try{ return new Date(ts).toLocaleString('ar-EG',{ timeZone:'Africa/Cairo',
           day:'2-digit', month:'2-digit', hour:'numeric', minute:'2-digit' }); }
    catch(e){ return String(ts); }
  }
  function cairoD(d){
    if(!d) return '—';
    try{ return new Date(d+'T00:00:00').toLocaleDateString('ar-EG',{ timeZone:'Africa/Cairo',
           day:'2-digit', month:'2-digit', year:'numeric' }); }
    catch(e){ return String(d); }
  }
  function hoursSince(ts){
    if(!ts) return null;
    const t = new Date(ts).getTime();
    if(!isFinite(t)) return null;
    return (Date.now() - t) / 3600000;
  }

  /* سهم التغيّر. `good` بيقول الزيادة كويسة ولا وحشة: المخزون
     والنقدية زيادتهم كويسة، والمستحق للموردين زيادته مش كويسة. */
  function delta(now, prev, good){
    if(prev==null || now==null) return '<span class="flat">—</span>';
    const d = Math.round(Number(now) - Number(prev));
    if(d === 0) return '<span class="flat">بدون تغيّر</span>';
    const up = d > 0;
    const cls = (good === false) ? (up ? 'down' : 'up') : (up ? 'up' : 'down');
    return '<span class="'+cls+'">'+(up?'▲':'▼')+' '+f0(Math.abs(d))+'</span>';
  }

  function showErr(t){
    const m = document.getElementById('msg');
    m.textContent = t; m.className = 'msg err on';
  }

  async function rpc(fn, body){
    let r, out = null;
    try{
      r = await fetch(SB_URL_API+'/rest/v1/rpc/'+fn, { method:'POST',
            headers: await sbH({'Content-Type':'application/json'}), body: JSON.stringify(body||{}) });
      try{ out = await r.json(); }catch(e){ out = null; }
    }catch(e){ return { error:'تعذّر الاتصال بالخادم' }; }
    if(r.ok) return out;
    /* رسالة الحارس لازم توصل للمستخدم: «الشاشة دي للمالك» أو
       «يلزم تسجيل الدخول» — الرد الفاضي كان بيبان «تعذّر التحميل». */
    return { error: (out && (out.message || out.hint)) || ('تعذّر التحميل ('+r.status+')') };
  }

  function sum(rows, key){ return rows.reduce((s,x)=> s + (Number(x[key])||0), 0); }
  function prevOf(code, key){
    const p = POS && POS.prev && POS.prev.rows && POS.prev.rows[code];
    return p ? Number(p[key]) : null;
  }
  function prevSum(rows, key){
    if(!POS || !POS.prev || !POS.prev.rows) return null;
    let any = false, t = 0;
    rows.forEach(x=>{ const v = prevOf(x.code, key); if(v != null && isFinite(v)){ any = true; t += v; } });
    return any ? t : null;
  }

  function render(){
    const rows = (POS && POS.branches) || [];
    if(!rows.length){
      document.getElementById('tb').innerHTML = '<tr><td colspan="8" class="empty">لا توجد بيانات</td></tr>';
      return;
    }

    const tNet  = sum(rows,'net'),       pNet  = prevSum(rows,'net');
    const tCost = sum(rows,'stock_cost'), pCost = prevSum(rows,'stock_cost');
    const tSell = sum(rows,'stock_sell');
    const tCash = sum(rows,'cash'),      pCash = prevSum(rows,'cash');
    const tCust = sum(rows,'customers_debt'), pCust = prevSum(rows,'customers_debt');
    const tVend = sum(rows,'vendors_due'),    pVend = prevSum(rows,'vendors_due');

    document.getElementById('hero').style.display = '';
    document.getElementById('heroNet').textContent = f0(tNet);
    if(pNet != null){
      document.getElementById('heroChg').style.display = '';
      document.getElementById('chgLbl').textContent =
        'مقارنة بـ ' + cairoD(POS.prev && POS.prev.d);
      const d = Math.round(tNet - pNet);
      document.getElementById('chgVal').textContent =
        (d > 0 ? '▲ +' : d < 0 ? '▼ −' : '') + f0(Math.abs(d));
    }

    /* أقل تغطية بين الفروع هي الأصدق — متوسطها بيخبّي فرعًا ضعيفًا */
    const covs = rows.map(x => Number(x.cost_coverage_pct)).filter(v => isFinite(v));
    const minCov = covs.length ? Math.min.apply(null, covs) : null;

    document.getElementById('kpis').innerHTML = [
      { k:'المخزون بالتكلفة', ic:'fa-boxes-stacked', v:tCost, p:pCost, cls:'plus', good:true,
        note: minCov != null ? ('تقديري — سعر الشراء معروف لـ '+minCov+'٪ على الأقل من قيمة المخزون') : '' },
      { k:'النقدية بالخزائن', ic:'fa-sack-dollar', v:tCash, p:pCash, cls:'plus', good:true },
      /* ⚠️ زيادة المديونية بتزوّد صافي الموقف حسابيًا، لكنها إشارة
         تحصيل متأخر — فاللون أحمر مع الزيادة بقصد. */
      { k:'مديونية العملاء', ic:'fa-user-clock', v:tCust, p:pCust, cls:'plus', good:false },
      { k:'المستحق للموردين', ic:'fa-file-invoice-dollar', v:tVend, p:pVend, cls:'minus', good:false }
    ].map(c =>
      '<div class="kpi '+c.cls+'">'
      + '<div class="k"><i class="fas '+c.ic+'"></i> '+c.k+'</div>'
      + '<div class="v">'+f0(c.v)+'</div>'
      + '<div class="d">'+delta(c.v, c.p, c.good)+'</div>'
      + (c.note ? '<div class="note">'+esc(c.note)+'</div>' : '')
      + '</div>').join('');

    const m = POS.mtd || {};
    const mtd = document.getElementById('mtd');
    if(m.sales != null){
      mtd.style.display = '';
      mtd.innerHTML =
          '<div><div class="k">مبيعات الشهر حتى اليوم</div><div class="v">'+f0(m.sales)+'</div></div>'
        + '<div class="hd"><div class="k">مجمل الربح</div><div class="v">'+f0(m.profit)+'</div></div>'
        + '<div class="hd"><div class="k">هامش الربح</div><div class="v">'+(m.margin!=null?m.margin+'٪':'—')+'</div></div>'
        + '<div><div class="k">المخزون بسعر البيع</div><div class="v">'+f0(tSell)+'</div></div>';
    } else { mtd.style.display = 'none'; }

    document.getElementById('tb').innerHTML = rows.map(x =>
        '<tr>'
      + '<td class="br">'+esc(x.name)+'</td>'
      + '<td class="num">'+f0(x.stock_cost)
        + (x.cost_coverage_pct!=null ? '<span class="sub">تغطية '+x.cost_coverage_pct+'٪</span>' : '')+'</td>'
      + '<td class="num">'+f0(x.stock_sell)+'</td>'
      + '<td class="num">'+f0(x.cash)+'</td>'
      + '<td class="num">'+f0(x.customers_debt)+'</td>'
      + '<td class="num">'+f0(x.vendors_due)+'</td>'
      + '<td class="num netcol">'+f0(x.net)+'</td>'
      + '<td class="num">'+delta(x.net, prevOf(x.code,'net'), true)+'</td>'
      + '</tr>').join('');

    document.getElementById('tf').innerHTML =
        '<tr><td>الإجمالي</td>'
      + '<td class="num">'+f0(tCost)+'</td><td class="num">'+f0(tSell)+'</td>'
      + '<td class="num">'+f0(tCash)+'</td><td class="num">'+f0(tCust)+'</td>'
      + '<td class="num">'+f0(tVend)+'</td>'
      + '<td class="num netcol">'+f0(tNet)+'</td>'
      + '<td class="num">'+delta(tNet, pNet, true)+'</td></tr>';

    document.getElementById('asOf').textContent = 'الأرقام لحظة ' + cairoDT(POS.as_of);

    /* ⚠️ الشاشة بتجمع مصادر دقّتها مختلفة — من غير آخر تحديث جنب كل
       رقم، مصدر واقف يبان كأنه النهارده. */
    const fr = POS.freshness || {};
    const srcs = [
      { k:'المخزون',           t:(rows[0]||{}).stock_updated_at, lim:6 },
      { k:'أرصدة الموردين',    t:fr.vendors,   lim:6 },
      { k:'أرصدة العملاء',     t:fr.customers, lim:6 },
      { k:'النقدية بالخزائن',  t:fr.cash,      lim:30 },
      { k:'الربحية الشهرية',   t:fr.pnl,       lim:30 }
    ];
    document.getElementById('fresh').innerHTML = srcs.map(s=>{
      const h = hoursSince(s.t);
      const late = (h == null) || (h > s.lim);
      return '<div><b>'+s.k+':</b> <span'+(late?' class="stale"':'')+'>'+cairoDT(s.t)
           + (late ? ' ⚠️ متأخر' : '') + '</span></div>';
    }).join('');
  }

  async function load(){
    document.getElementById('msg').className = 'msg';
    const res = await rpc('get_owner_position', {});
    const d = Array.isArray(res) ? res[0] : res;
    if(!d || d.error){
      showErr((d && d.error) || 'تعذّر تحميل الموقف');
      document.getElementById('tb').innerHTML = '<tr><td colspan="8" class="empty">—</td></tr>';
      return;
    }
    POS = d;
    render();
  }

  async function init(){
    try{ if(typeof Session!=='undefined' && Session.require) await Session.require(); }catch(e){}
    await load();
    try{ Session.syncWatch && Session.syncWatch(); }catch(e){}
  }
  (typeof checkAuth==='function'?checkAuth():Promise.resolve(1)).then(init).catch(init);
</script>
</body>
</html>
