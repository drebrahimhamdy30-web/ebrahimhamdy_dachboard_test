<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>متابعة الحساب البنكي - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* تنسيقات إضافية للترقيم والفلتر المتعدد */
    .pagination-row { display: flex; justify-content: center; gap: 10px; margin-top: 20px; align-items: center; }
    .page-info { font-size: 0.85rem; color: var(--text-secondary); font-weight: bold; }
    .source-chips { display: flex; flex-wrap: wrap; gap: 5px; background: var(--surface); border: 1.5px solid var(--border); padding: 5px; border-radius: var(--radius-sm); min-height: 38px; align-items: center; }
    .source-checkbox { display: none; }
    .source-label { font-size: 0.75rem; padding: 4px 10px; border-radius: 15px; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; background: var(--surface-2); }
    .source-checkbox:checked + .source-label { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    /* التنسيقات الأصلية */
    .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
    @media(max-width:700px){ .kpi-row{grid-template-columns:1fr 1fr;} }
    .kpi-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; position:relative; overflow:hidden; }
    .kpi-card::before { content:''; position:absolute; top:0; right:0; width:4px; height:100%; border-radius:0 var(--radius-lg) var(--radius-lg) 0; }
    .kpi-card.blue::before  { background:#3b82f6; }
    .kpi-card.green::before { background:#16a34a; }
    .kpi-card.amber::before { background:#f59e0b; }
    .kpi-card.red::before   { background:#dc2626; }
    .kpi-label { font-size:0.72rem; font-weight:700; color:var(--text-secondary); margin-bottom:4px; }
    .kpi-value { font-size:1.3rem; font-weight:900; line-height:1; }
    .kpi-card.blue  .kpi-value { color:#3b82f6; }
    .kpi-card.green .kpi-value { color:#16a34a; }
    .kpi-card.amber .kpi-value { color:#f59e0b; }
    .kpi-card.red   .kpi-value { color:#dc2626; }
    .kpi-sub { font-size:0.68rem; color:var(--text-muted); margin-top:4px; }
    .opening-row { display:flex; align-items:center; gap:10px; background:var(--surface-3); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:10px 14px; margin-bottom:16px; flex-wrap:wrap; }
    .opening-input { border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:6px 10px; font-family:var(--font); font-size:0.9rem; font-weight:700; width:160px; outline:none; background:var(--surface); }
    .add-row-wrap { background:var(--surface-2); border:1.5px dashed var(--accent); border-radius:var(--radius-md); padding:10px 12px; display:grid; grid-template-columns:1fr 120px 150px auto auto; gap:8px; align-items:center; margin-bottom:12px; }
    @media(max-width:700px){ .add-row-wrap{grid-template-columns:1fr 1fr;} }
    .bm-table { width:100%; border-collapse:collapse; }
    .bm-table th { background:var(--primary); color:#fff; padding:9px 10px; font-size:0.72rem; font-weight:700; text-align:right; white-space:nowrap; }
    .bm-table td { padding:9px 10px; font-size:0.8rem; border-bottom:1px solid var(--surface-3); vertical-align:middle; }
    .bm-table tr.posted-row td { background:#f0fdf4; }
    .bm-table tr.pending-row td { background:#fffbeb; }
    .amount-pos { color:#16a34a; font-weight:700; }
    .amount-neg { color:#dc2626; font-weight:700; }
    .source-badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:0.65rem; font-weight:700; }
    .src-instapay { background:#e0f2fe; color:#0369a1; }
    .src-paymob   { background:#f0fdf4; color:#15803d; }
    .src-abuqir   { background:#fef9c3; color:#a16207; }
    .src-other    { background:#f1f5f9; color:#475569; }
    .posted-badge  { background:#dcfce7; color:#15803d; font-size:0.65rem; font-weight:700; display:inline-block; padding:2px 8px; border-radius:20px; }
    .pending-badge { background:#fef9c3; color:#a16207; font-size:0.65rem; font-weight:700; display:inline-block; padding:2px 8px; border-radius:20px; }
    .filter-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
<style>
    /* إعادة شكل صف الإضافة للأصل */
    .add-row-wrap { 
        background: #f8fafc; 
        border: 1px dashed #38bdf8; 
        border-radius: 12px; 
        padding: 12px; 
        display: flex; /* تحويل لـ flex بدلاً من grid لشكل أفضل */
        gap: 10px; 
        align-items: center; 
        margin-bottom: 20px;
    }
    .add-row-wrap input, .add-row-wrap select { 
        height: 40px; 
        border: 1px solid #e2e8f0; 
        border-radius: 8px; 
        padding: 0 12px; 
    }
    #new-desc { flex: 3; } /* الوصف يأخذ مساحة أكبر */
    #new-amount { flex: 1; min-width: 120px; }
    #new-source { flex: 1; min-width: 110px; }
    
    /* تصميم الفلاتر الجديد (أنيق وغير مزعج) */
    .filter-section {
        display: flex;
        gap: 15px;
        align-items: center;
        background: #fff;
        padding: 10px;
        border-bottom: 1px solid #edf2f7;
        margin-bottom: 15px;
        flex-wrap: wrap;
    }
    .source-filter-group {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #f1f5f9;
        padding: 4px 10px;
        border-radius: 20px;
    }
    .source-filter-group label {
        font-size: 0.75rem;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 12px;
        transition: 0.3s;
    }
    .source-checkbox:checked + label {
        background: #3b82f6;
        color: white;
    }
    .source-checkbox { display: none; }
</style>

<div class="add-row-wrap">
  <button class="btn" style="background:#f1f5f9; color:#64748b; width:40px;" onclick="clearAddRow()">×</button>
  <button class="btn btn-primary" style="background:#38bdf8; border:none; padding:0 20px;" onclick="addTransaction()" id="add-btn">+ إضافة</button>
  <select id="new-source">
    <option value="instapay">انستاباي</option>
    <option value="paymob">باي موب</option>
    <option value="abuqir">أبو قير</option>
    <option value="other">أخرى</option>
  </select>
  <input type="number" id="new-amount" class="amount-input" placeholder="المبلغ (+ وارد / - صادر)" step="0.01">
  <input type="text" id="new-desc" placeholder="الوصف / البيان (اختياري)">
</div>

<div class="filter-section">
    <select id="filter-status" onchange="resetPageAndRender()" style="border:none; font-weight:bold; color:#475569;">
        <option value="pending">⏳ غير مرحّل</option>
        <option value="all">🌐 الكل</option>
        <option value="posted">✅ مرحّل</option>
    </select>
    
    <div style="height: 20px; width: 1px; background: #e2e8f0;"></div>

    <div class="source-filter-group">
        <span style="font-size: 0.7rem; color: #94a3b8; margin-left: 5px;">المصادر:</span>
        <input type="checkbox" id="f-insta" class="source-checkbox" value="instapay" checked onchange="renderTable()">
        <label for="f-insta">انستا</label>
        
        <input type="checkbox" id="f-pay" class="source-checkbox" value="paymob" checked onchange="renderTable()">
        <label for="f-pay">باي موب</label>
        
        <input type="checkbox" id="f-abu" class="source-checkbox" value="abuqir" checked onchange="renderTable()">
        <label for="f-abu">أبو قير</label>
    </div>

    <input type="month" id="filter-month" onchange="renderTable()" style="border:none; font-size:0.85rem;">
</div>
  <script src="api.js"></script>
  <script src="nav.js" defer></script>
  <script>
    const BM_GET  = 'https://agent.ebrahimhamdy.com/webhook/bmonline';
    const BM_POST = 'https://agent.ebrahimhamdy.com/webhook/bmonlinepost';

    let allTx = [];
    let openingBal = 0;
    let isAdmin = false;
    let currentUser = '';
    
    // إعدادات الترقيم
    let currentPage = 1;
    const pageSize = 20;

    checkAuth().then(async user => {
      if (!user) return;
      currentUser = user.username || user.name || user || '';
      isAdmin = (user.role === 'admin');
      if (isAdmin) {
        document.getElementById('opening-input').removeAttribute('readonly');
        document.getElementById('opening-btn').style.display = 'inline-flex';
      }
      await loadAll();
    });

    async function loadAll() {
      try {
        const txResp = await fetch(BM_GET + '?type=get').then(r => r.json()).catch(() => []);
        allTx = Array.isArray(txResp) ? txResp : (txResp.data || []);
        
        const settResp = await fetch(BM_GET + '?type=get_settings').then(r => r.json()).catch(() => []);
        const settings = Array.isArray(settResp) ? settResp : (settResp.data || []);
        const obRow = settings.find(s => s.key === 'opening_balance');
        openingBal = obRow ? parseFloat(obRow.value) || 0 : 0;
        document.getElementById('opening-input').value = openingBal;

        updateKPIs();
        renderTable();
      } catch(e) {
        document.getElementById('bm-tbody').innerHTML = '<tr><td colspan="7" style="text-align:center;">❌ خطأ في التحميل</td></tr>';
      }
    }

    function updateKPIs() {
      const total = allTx.reduce((s,t) => s+(parseFloat(t.amount)||0), 0);
      const posted = allTx.filter(t => t.is_posted==='true'||t.is_posted===true).reduce((s,t) => s+(parseFloat(t.amount)||0), 0);
      document.getElementById('kpi-total').textContent = fmt(openingBal + total);
      document.getElementById('kpi-posted').textContent = fmt(openingBal + posted);
      document.getElementById('kpi-pending').textContent = fmt(total - posted);
      document.getElementById('kpi-count').textContent = allTx.length;
      const pCount = allTx.filter(t => t.is_posted==='true'||t.is_posted===true).length;
      document.getElementById('kpi-count-sub').textContent = `${pCount} مرحّل · ${allTx.length - pCount} غير مرحّل`;
    }

    function fmt(n) { return (parseFloat(n)||0).toLocaleString('ar-EG', {minimumFractionDigits:2}); }

    function resetPageAndRender() {
      currentPage = 1;
      renderTable();
    }

    function changePage(step) {
      currentPage += step;
      renderTable();
    }

    function renderTable() {
      const statusF = document.getElementById('filter-status').value;
      const monthF = document.getElementById('filter-month').value;
      
      // الحصول على المصادر المختارة
      const selectedSources = Array.from(document.querySelectorAll('.source-checkbox:checked')).map(cb => cb.value);

      // الفلترة
      let list = allTx.filter(t => {
        const isPosted = t.is_posted==='true'||t.is_posted===true;
        if (statusF === 'pending' && isPosted) return false;
        if (statusF === 'posted' && !isPosted) return false;
        if (!selectedSources.includes(t.source)) return false;
        if (monthF && t.date && !t.date.startsWith(monthF)) return false;
        return true;
      });

      // الترتيب: الأحدث دائماً بالأعلى
      list.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));

      // الترقيم (Pagination)
      const totalPages = Math.ceil(list.length / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const start = (currentPage - 1) * pageSize;
      const paginatedList = list.slice(start, start + pageSize);

      // تحديث واجهة الترقيم
      document.getElementById('page-info').textContent = `صفحة ${currentPage} من ${totalPages}`;
      document.getElementById('prev-page').disabled = (currentPage === 1);
      document.getElementById('next-page').disabled = (currentPage === totalPages);

      const tbody = document.getElementById('bm-tbody');
      if (!paginatedList.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;">لا توجد نتائج</td></tr>';
        return;
      }

      const srcMap = { instapay:'انستاباي', paymob:'باي موب', abuqir:'أبو قير', other:'أخرى' };
      const srcClass = { instapay:'src-instapay', paymob:'src-paymob', abuqir:'src-abuqir', other:'src-other' };

      tbody.innerHTML = paginatedList.map(t => {
        const isPosted = t.is_posted==='true'||t.is_posted===true;
        const amt = parseFloat(t.amount)||0;
        const _d = t.date ? new Date(t.date) : null;
        const dateStr = _d ? _d.toLocaleDateString('ar-EG') + '<br><small>' + _d.toLocaleTimeString('ar-EG',{hour12:true, hour:'2-digit', minute:'2-digit'}) + '</small>' : '---';

        return `<tr class="${isPosted?'posted-row':'pending-row'}">
          <td>${dateStr}</td>
          <td>${t.description||'---'}</td>
          <td><span class="${amt>=0?'amount-pos':'amount-neg'}">${amt>=0?'+':''}${fmt(Math.abs(amt))}</span></td>
          <td><span class="source-badge ${srcClass[t.source]||'src-other'}">${srcMap[t.source]||t.source}</span></td>
          <td>${t.created_by||'---'}</td>
          <td>${isPosted?'<span class="posted-badge">✅ مرحّل</span>':'<span class="pending-badge">⏳ معلق</span>'}</td>
          <td>${isPosted?'<i class="fas fa-lock"></i>':`<button class="btn btn-success btn-sm" onclick="postTx('${t.id}',this)">ترحيل</button>`}</td>
        </tr>`;
      }).join('');
    }

    // دوال المساعدة الأصلية (Add, Post, Save Opening) تبقى كما هي
    async function addTransaction() {
      const desc = document.getElementById('new-desc').value;
      const amount = parseFloat(document.getElementById('new-amount').value);
      const source = document.getElementById('new-source').value;
      if (isNaN(amount)) return alert('المبلغ مطلوب');
      
      const btn = document.getElementById('add-btn');
      btn.disabled = true;
      try {
        await fetch(BM_POST, {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ type:'insert', date:new Date().toISOString(), description:desc, amount, source, created_by:currentUser })
        });
        clearAddRow(); await loadAll();
      } catch(e) {}
      btn.disabled = false;
    }

    async function postTx(id, btn) {
      if(!confirm('ترحيل المعاملة؟')) return;
      btn.disabled = true;
      try {
        await fetch(BM_POST, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type:'post_transaction', id}) });
        await loadAll();
      } catch(e) {}
    }

    async function saveOpening() {
      const val = parseFloat(document.getElementById('opening-input').value);
      try {
        await fetch(BM_POST, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type:'set_opening', value:val}) });
        openingBal = val; updateKPIs();
        document.getElementById('opening-msg').style.display='inline';
        setTimeout(()=> document.getElementById('opening-msg').style.display='none', 2000);
      } catch(e) {}
    }

    function clearFilters() {
      document.getElementById('filter-status').value = 'pending';
      document.getElementById('filter-month').value = '';
      document.querySelectorAll('.source-checkbox').forEach(cb => cb.checked = true);
      resetPageAndRender();
    }

    function colorAmount(input) {
      const v = parseFloat(input.value);
      input.className = 'amount-input ' + (v >= 0 ? 'positive' : v < 0 ? 'negative' : '');
    }

    function clearAddRow() {
      document.getElementById('new-desc').value = '';
      document.getElementById('new-amount').value = '';
      document.getElementById('new-amount').className = 'amount-input';
    }
  </script>
</body>
</html>
