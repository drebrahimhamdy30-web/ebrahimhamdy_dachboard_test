<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الشيفت الحالي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  :root{--teal:#0d9488;--teal-d:#0f766e;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--green:#059669;--red:#dc2626;}
  *{box-sizing:border-box} body{font-family:'Cairo',sans-serif;margin:0;background:var(--bg);color:var(--ink);padding:16px}
  .wrap{max-width:1340px;margin:0 auto}
  header.rpt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--teal);padding-bottom:10px;margin-bottom:12px}
  header.rpt h1{margin:0;font-size:20px;font-weight:800}
  header.rpt .ctl{display:flex;gap:8px;align-items:center}
  select,input,button{font-family:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  button{cursor:pointer} button:hover{border-color:var(--teal)}
  .tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .tab{font-size:14px;font-weight:700;padding:8px 20px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
  .tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* هيدر مدمج صغير */
  .meta{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;margin-bottom:10px;font-size:13px}
  .meta .it{display:flex;gap:6px;align-items:baseline} .meta .k{color:var(--muted);font-weight:600;font-size:12px} .meta b{font-weight:800}
  .meta .users{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px;cursor:help}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;position:relative;overflow:hidden;flex:1;min-width:230px}
  .kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--teal)}
  .kpi.g::before{background:var(--green)}.kpi.r::before{background:var(--red)}.kpi.v::before{background:#8b5cf6}
  .kpi .lbl{color:var(--muted);font-size:12px;font-weight:700;margin-bottom:3px}
  .kpi .val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums} .kpi .val small{font-size:13px;color:var(--muted)}
  .kpi.r .val{color:var(--red)} .kpi.g .val{color:var(--green)} .kpi.v .val{color:#7c3aed}
  .kpi .formula{margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:700} .kpi .formula span{font-weight:400;font-size:10.5px;margin:0 2px}
  .vchs{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .vch{font-size:11.5px;background:#f3e8ff;color:#6b21a8;border-radius:7px;padding:2px 9px;font-weight:600;cursor:pointer} .vch b{font-weight:800} .vch.on{background:#6b21a8;color:#fff}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:10px}
  .toolbar input[type=search]{flex:1;min-width:160px}
  .flabel{font-size:11.5px;color:var(--muted);font-weight:700}
  .chip{font-size:12px;font-weight:600;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  .shown{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--teal-d);background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:6px 12px}
  .note{font-size:11.5px;color:var(--teal-d);background:#ccfbf1;border:1px solid #99f6e4;border-radius:7px;padding:5px 11px;margin-bottom:10px}
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f8fafc;color:#475569;font-weight:700;font-size:12px;position:sticky;top:0}
  td.r,th.r{text-align:right} td.notes{text-align:right;white-space:normal;color:var(--muted);max-width:220px} td.dev{color:var(--muted);font-size:11.5px} td.visa{background:#faf5ff}
  tbody tr:nth-child(even){background:#fafbfc} tbody tr:hover{background:#f0fdfa}
  .num{font-variant-numeric:tabular-nums;font-weight:700} .pos{color:var(--green)}.neg{color:var(--red)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.cash{background:#e0f2fe;color:#075985}.pill.visa{background:#f3e8ff;color:#6b21a8}.pill.out{background:#fee2e2;color:#991b1b}.pill.in{background:#dcfce7;color:#166534}
  select.e{font-family:inherit;font-size:11.5px;padding:3px 5px;border:1px solid #cbd5e1;border-radius:6px;max-width:120px}
  .state{padding:34px;text-align:center;color:var(--muted);font-weight:600}
  @media(max-width:760px){body{padding:10px}.kpi{min-width:100%}}
</style>
<script src="config.js?v=20261011"></script>
<script src="session.js?v=20261011"></script>
<script src="branches.js?v=20261011"></script>
<script src="pages.js?v=20261011"></script>
<script src="brand.js?v=20261011"></script>
<script src="api.js?v=20261011"></script>
</head>
<body>
<div class="wrap">
  <header class="rpt">
    <h1>تفاصيل الشيفت الحالي</h1>
    <div class="ctl"><select id="brSel" style="display:none"></select><button id="refreshBtn">↻ تحديث</button></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="state">جارِ التحميل…</div></div>
</div>
<script>
const BR = { mamora:'المعمورة', san:'سان ستيفانو', bishr:'سيدى بشر', seyouf:'السيوف' };
const norm = s => String(s||'').replace(/\s+/g,'').replace(/^ال/,'').replace(/[ىي]/g,'ي');
const BR_REV = {}; Object.entries(BR).forEach(([k,v])=>{ BR_REV[norm(v)]=k; });
const CHANNELS = ['instapay','paymob 1','paymob 7','orange cash','fawry313','fawry 6008','vodafon cash'];
const fmt = n => (n<0?'−':'') + Math.abs(Math.round(Number(n)||0)).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function rpc(fn, body){
  try{ const r=await fetch(SB_URL_API+'/rest/v1/rpc/'+fn,{ method:'POST',
    headers:{'Content-Type':'application/json', apikey:SB_ANON_API, Authorization:'Bearer '+SB_ANON_API}, body:JSON.stringify(body||{}) });
    if(!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
let BRANCH='mamora', POINTS=[], CUR=null, SHIFT=null, TXN=[], chFilter=null, typeFilter=null;

function roleDefaultPoint(points){
  let role=''; try{ role=(typeof Session!=='undefined'&&Session.role)?Session.role():''; }catch(e){}
  if(/cash|كاشير/i.test(role)){ const p=points.find(x=>/كاشير/.test(x.point_name)); if(p) return p.cashier_id; }
  const pv=points.find(x=>/نقط/.test(x.point_name)); return pv?pv.cashier_id:(points[0]&&points[0].cashier_id);
}
async function init(){
  let bname='', seesAll=false;
  try{ bname=(typeof Session!=='undefined'&&Session.branch)?Session.branch():''; }catch(e){}
  try{ seesAll=(typeof Session!=='undefined'&&Session.seesAllBranches)?await Session.seesAllBranches():false; }catch(e){}
  const myKey=BR_REV[norm(bname)]; if(myKey) BRANCH=myKey;
  const sel=document.getElementById('brSel');
  if(seesAll || !myKey){
    sel.style.display=''; sel.innerHTML=Object.entries(BR).map(([k,v])=>`<option value="${k}" ${k===BRANCH?'selected':''}>${v}</option>`).join('');
    sel.onchange=()=>{ BRANCH=sel.value; loadPoints(); };
  }
  document.getElementById('refreshBtn').onclick=()=>loadShift();
  await loadPoints();
  setInterval(()=>{ if(CUR) loadShift(); }, 60000);
}
async function loadPoints(){
  document.getElementById('content').innerHTML='<div class="state">جارِ التحميل…</div>';
  POINTS = (await rpc('get_shift_points',{p_branch:BRANCH})) || [];
  const tabs=document.getElementById('tabs');
  if(!POINTS.length){ tabs.innerHTML=''; document.getElementById('content').innerHTML='<div class="state">لا توجد نقاط بيع لهذا الفرع.</div>'; return; }
  CUR = roleDefaultPoint(POINTS);
  tabs.innerHTML = POINTS.map(p=>`<button class="tab ${p.cashier_id===CUR?'active':''}" data-c="${p.cashier_id}">${esc(p.point_name)}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ CUR=+b.dataset.c; chFilter=null; typeFilter=null; tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b)); loadShift(); });
  loadShift();
}
async function loadShift(){
  SHIFT = await rpc('get_current_shift',{p_branch:BRANCH, p_cashier:CUR});
  if(!SHIFT){ document.getElementById('content').innerHTML='<div class="state">تعذّر التحميل.</div>'; return; }
  TXN = (SHIFT.transactions||[]).map(t=>({...t}));  // نسخة قابلة للتعديل
  render();
}
function kpis(){
  const cash=TXN.filter(t=>t.kind==='كاش').reduce((a,t)=>a+ +t.amount,0);
  const visa=TXN.filter(t=>t.kind==='فيزا').reduce((a,t)=>a+ +(t.visa_value||t.amount),0);
  const sarf=TXN.filter(t=>t.kind==='صرف').reduce((a,t)=>a+ +t.amount,0);
  const tran=TXN.filter(t=>t.kind==='توريد').reduce((a,t)=>a+ +t.amount,0);
  const op=Number(SHIFT.opening)||0;
  return { cash, visa, sarf, tran, net: op+cash+tran-sarf, op };
}
function render(){
  const k=kpis();
  const startTxt = SHIFT.shift_start ? new Date(SHIFT.shift_start).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
  const users=(SHIFT.users||[]).map(esc).join('، ')||'—';
  const byCh={}; TXN.filter(t=>t.kind==='فيزا').forEach(t=>{const c=t.channel||'—'; byCh[c]=byCh[c]||{t:0,n:0}; byCh[c].t+=+(t.visa_value||t.amount); byCh[c].n++;});
  const chips=Object.entries(byCh).sort((a,b)=>b[1].t-a[1].t).map(([c,v])=>`<span class="vch ${chFilter===c?'on':''}" data-ch="${esc(c)}">${esc(c)} <b>${fmt(v.t)}</b> (${v.n})</span>`).join('')||'<span class="vch">—</span>';
  document.getElementById('content').innerHTML = `
    <div class="meta">
      <div class="it"><span class="k">النقطة</span><b>${esc(SHIFT.point)}</b></div>
      <div class="it"><span class="k">بداية الشيفت</span><b>${startTxt}</b></div>
      <div class="it"><span class="k">بداية الفترة</span><b>${fmt(SHIFT.opening)} ج</b></div>
      <div class="it"><span class="k">عدد المعاملات</span><b>${TXN.length}</b></div>
      <div class="users" title="${users}">👤 ${users}</div>
    </div>
    <div class="kpis">
      <div class="kpi g"><div class="lbl">صافي الكاش المطلوب تسليمه</div><div class="val" id="k-net">${fmt(k.net)} <small>ج</small></div>
        <div class="formula">${fmt(k.op)} <span>بداية</span> + ${fmt(k.cash+k.tran)} <span>كاش</span> − ${fmt(k.sarf)} <span>صرف</span></div></div>
      <div class="kpi v"><div class="lbl">إجمالي الفيزا (للمطابقة مع البنك)</div><div class="val" id="k-visa">${fmt(k.visa)} <small>ج</small></div>
        <div class="vchs" id="vchs">${chips}</div></div>
    </div>
    <div class="note">✏️ لو معاملة اتحفظت كاش وهي فيزا: غيّر «الحساب» في صفّها → بتتحوّل فيزا والصافي يتعدّل (تصحيح للعرض، مش بيتحفظ في eplus).</div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="🔎 بحث بالطرف / الملاحظة / المستخدم…">
      <span class="flabel">النوع:</span>
      ${['كاش','فيزا','صرف','توريد'].map(t=>`<button class="chip tp ${typeFilter===t?'active':''}" data-t="${t}">${t}</button>`).join('')}
      <span class="shown" id="shown"></span>
    </div>
    <div class="tablecard"><table><thead><tr>
      <th>الوقت</th><th>النوع</th><th>الحساب</th><th class="r">الطرف</th><th class="r">المستخدم</th><th>القيمة</th><th>الجهاز</th><th class="r">ملاحظات</th>
    </tr></thead><tbody id="tb"></tbody></table></div>`;
  document.querySelectorAll('.vch[data-ch]').forEach(c=>c.onclick=()=>{ chFilter=(chFilter===c.dataset.ch?null:c.dataset.ch); render(); });
  document.querySelectorAll('.chip.tp').forEach(c=>c.onclick=()=>{ typeFilter=(typeFilter===c.dataset.t?null:c.dataset.t); drawRows(); document.querySelectorAll('.chip.tp').forEach(x=>x.classList.toggle('active',x.dataset.t===typeFilter)); });
  document.getElementById('q').oninput=drawRows;
  drawRows();
}
function drawRows(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const rows=TXN.filter((t,i)=>{ t._i=i;
    return (!typeFilter||t.kind===typeFilter) && (!chFilter||t.channel===chFilter) &&
      (!q||((t.party||'')+' '+(t.notes||'')+' '+(t.user_name||'')).toLowerCase().includes(q)); });
  const sum=rows.reduce((a,t)=>a+(t.kind==='صرف'?-1:1)*(+t.amount),0);
  document.getElementById('shown').textContent='المعروض: '+rows.length+' · مجموع: '+fmt(sum)+' ج';
  document.getElementById('tb').innerHTML = rows.map(t=>{
    const cls=t.kind==='صرف'?'out':(t.kind==='فيزا'?'visa':(t.kind==='توريد'?'in':'cash')); const iv=(t.kind==='فيزا');
    const editable=(t.kind==='كاش'||t.kind==='فيزا');
    const acct = editable
      ? `<select class="e eacct" data-i="${t._i}"><option value="" ${!iv?'selected':''}>— كاش</option>${CHANNELS.map(c=>`<option ${t.channel===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`
      : esc(t.channel||'—');
    return `<tr><td>${esc(t.time)}</td><td><span class="pill ${cls}">${esc(t.kind)}</span></td>`+
      `<td class="${iv?'visa':''}">${acct}</td><td class="r">${esc(t.party||'—')}</td><td class="r">${esc(t.user_name||'—')}</td>`+
      `<td class="num ${t.kind==='صرف'?'neg':'pos'}">${t.kind==='صرف'?'−':''}${fmt(t.amount)}</td><td class="dev">${esc(t.computer||'—')}</td><td class="notes">${esc(t.notes||'')}</td></tr>`;
  }).join('') || '<tr><td colspan="8" class="state">لا توجد حركات مطابقة.</td></tr>';
  document.querySelectorAll('.eacct').forEach(s=>s.onchange=()=>{
    const t=TXN[+s.dataset.i]; const v=s.value;
    if(v){ t.kind='فيزا'; t.channel=v; } else { t.kind='كاش'; t.channel=''; }
    const k=kpis();
    document.getElementById('k-net').innerHTML=fmt(k.net)+' <small>ج</small>';
    document.getElementById('k-visa').innerHTML=fmt(k.visa)+' <small>ج</small>';
    render();
  });
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
