<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الشيفت الحالي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  :root{--teal:#0d9488;--teal-d:#0f766e;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--green:#059669;--red:#dc2626;}
  *{box-sizing:border-box} body{font-family:'Cairo',sans-serif;margin:0;background:var(--bg);color:var(--ink);padding:16px}
  .wrap{max-width:1340px;margin:0 auto}
  header.rpt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--teal);padding-bottom:10px;margin-bottom:12px}
  header.rpt h1{margin:0;font-size:20px;font-weight:800}
  header.rpt .ctl{display:flex;gap:8px;align-items:center}
  select,input,button{font-family:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  button{cursor:pointer} button:hover{border-color:var(--teal)}
  .tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .tab{font-size:14px;font-weight:700;padding:8px 20px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
  .tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* هيدر مدمج صغير */
  .meta{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;margin-bottom:10px;font-size:13px}
  .meta .it{display:flex;gap:6px;align-items:baseline} .meta .k{color:var(--muted);font-weight:600;font-size:12px} .meta b{font-weight:800}
  .meta .users{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px;cursor:help}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;position:relative;overflow:hidden;flex:1;min-width:230px}
  .kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--teal)}
  .kpi.g::before{background:var(--green)}.kpi.r::before{background:var(--red)}.kpi.v::before{background:#8b5cf6}
  .kpi .lbl{color:var(--muted);font-size:12px;font-weight:700;margin-bottom:3px}
  .kpi .val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums} .kpi .val small{font-size:13px;color:var(--muted)}
  .kpi.r .val{color:var(--red)} .kpi.g .val{color:var(--green)} .kpi.v .val{color:#7c3aed}
  .kpi .formula{margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:700} .kpi .formula span{font-weight:400;font-size:10.5px;margin:0 2px}
  .vchs{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .vch{font-size:11.5px;background:#f3e8ff;color:#6b21a8;border-radius:7px;padding:2px 9px;font-weight:600;cursor:pointer} .vch b{font-weight:800} .vch.on{background:#6b21a8;color:#fff}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:10px}
  .toolbar input[type=search]{flex:1;min-width:160px}
  .flabel{font-size:11.5px;color:var(--muted);font-weight:700}
  .chip{font-size:12px;font-weight:600;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  .usel{font-size:12px;font-weight:600;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;font-family:inherit;max-width:180px}
  .usel:focus{outline:none;border-color:var(--teal)}
  .shown{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--teal-d);background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:6px 12px}
  .note{font-size:11.5px;color:var(--teal-d);background:#ccfbf1;border:1px solid #99f6e4;border-radius:7px;padding:5px 11px;margin-bottom:10px}
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f8fafc;color:#475569;font-weight:700;font-size:12px;position:sticky;top:0}
  td.r,th.r{text-align:right} td.notes{text-align:right;white-space:normal;color:var(--muted);max-width:220px} td.dev{color:var(--muted);font-size:11.5px} td.visa{background:#faf5ff}
  tbody tr:nth-child(even){background:#fafbfc} tbody tr:hover{background:#f0fdfa}
  .num{font-variant-numeric:tabular-nums;font-weight:700} .pos{color:var(--green)}.neg{color:var(--red)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.cash{background:#e0f2fe;color:#075985}.pill.visa{background:#f3e8ff;color:#6b21a8}.pill.out{background:#fee2e2;color:#991b1b}.pill.in{background:#dcfce7;color:#166534}
  select.e{font-family:inherit;font-size:11.5px;padding:3px 5px;border:1px solid #cbd5e1;border-radius:6px;max-width:120px}
  .state{padding:34px;text-align:center;color:var(--muted);font-weight:600}
  .pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap}
  .pager button{min-width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px}
  .pager button.on{background:var(--teal);color:#fff;border-color:var(--teal)} .pager button:disabled{opacity:.4;cursor:default}
  .pager .pinfo{font-size:12px;color:var(--muted);margin-inline-start:8px}
  .logrow{cursor:pointer} .logrow:hover{background:#f0fdfa}
  .lnk{background:none;border:0;color:var(--teal-d);font-weight:800;cursor:pointer;font-family:inherit;font-size:13px}
  .sumcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
  .sumtbl{overflow-x:auto}
  .sumtbl table{width:100%;border-collapse:collapse}
  .sumtbl th{background:#f8fafc;color:#475569;font-weight:700;padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
  .sumtbl td{padding:12px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
  .sumtbl th:not(:first-child),.sumtbl td:not(:first-child){border-inline-start:1px solid var(--line)}
  .sumtbl td.plus{color:#1e40af} .sumtbl td.minus{color:var(--red)}
  .sumtbl th.net,.sumtbl td.net{background:#ecfdf5} .sumtbl td.net{font-size:19px} .sumtbl td.net.pos{color:var(--teal-d)} .sumtbl td.net.neg{color:var(--red)}
  .sumtbl th.visa,.sumtbl td.visa{background:#f5f3ff;color:#7c3aed}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--line);align-items:center}
  .chips .lbl{font-size:12px;color:var(--muted);font-weight:700}
  @media(max-width:760px){body{padding:10px}.kpi{min-width:100%}}
</style>
<script src="config.js?v=20261011"></script>
<script src="session.js?v=20261011"></script>
<script src="branches.js?v=20261011"></script>
<script src="pages.js?v=20261011"></script>
<script src="brand.js?v=20261011"></script>
<script src="api.js?v=20261011"></script>
</head>
<body>
<div class="wrap">
  <header class="rpt">
    <h1>تفاصيل الشيفت الحالي</h1>
    <div class="ctl"><select id="brSel" style="display:none"></select><button id="refreshBtn">↻ تحديث</button></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="state">جارِ التحميل…</div></div>
</div>
<script>
const norm = s => String(s||'').replace(/\s+/g,'').replace(/^ال/,'').replace(/[ىي]/g,'ي');
let BRANCHES = [];  // {id,name,sync_key} من جدول الفروع
async function loadBranches(){
  try{ const r=await fetch(SB_URL_API+"/rest/v1/branches?select=id,name,sync_key&sync_key=not.is.null&order=name",{headers:{apikey:SB_ANON_API,Authorization:'Bearer '+SB_ANON_API}});
    BRANCHES = r.ok ? (await r.json()) : []; }catch(e){ BRANCHES=[]; }
}
const CHANNELS = ['instapay','paymob 1','paymob 7','orange cash','fawry313','fawry 6008','vodafon cash'];
const fmt = n => (n<0?'−':'') + Math.abs(Math.round(Number(n)||0)).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function rpc(fn, body){
  try{ const r=await fetch(SB_URL_API+'/rest/v1/rpc/'+fn,{ method:'POST',
    headers:{'Content-Type':'application/json', apikey:SB_ANON_API, Authorization:'Bearer '+SB_ANON_API}, body:JSON.stringify(body||{}) });
    if(!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
let BRANCH='', POINTS=[], CUR=null, SHIFT=null, TXN=[], chFilter=null, typeFilter=null, userFilter=null;
let VIEW='shift', SLsc=null, SLcashier=null;  // VIEW: shift | log | detail

function roleDefaultPoint(points){
  let role=''; try{ role=(typeof Session!=='undefined'&&Session.role)?Session.role():''; }catch(e){}
  if(/cash|كاشير/i.test(role)){ const p=points.find(x=>/كاشير/.test(x.point_name)); if(p) return p.cashier_id; }
  const pv=points.find(x=>/نقط/.test(x.point_name)); return pv?pv.cashier_id:(points[0]&&points[0].cashier_id);
}
// كل نقطة = تبويب (كاشير / نقطة البيع)؛ الظهور من صلاحيات التبويبات (شاشة الصلاحيات)
function pointTabKey(p){ return /كاشير/.test(p.point_name) ? 'cashier' : 'pos'; }
async function visiblePoints(points){
  const out=[];
  for(const p of points){
    let ok=true;
    try{ if(typeof Session!=='undefined' && Session.tabAllowed) ok = await Session.tabAllowed('current_shift', pointTabKey(p)); }catch(e){ ok=true; }
    if(ok) out.push(p);
  }
  return out;
}
async function init(){
  await loadBranches();
  let bid='', bname='', seesAll=false;
  try{ bid=(typeof Session!=='undefined'&&Session.branchId)?Session.branchId():''; }catch(e){}
  try{ bname=(typeof Session!=='undefined'&&Session.branch)?Session.branch():''; }catch(e){}
  try{ seesAll=(typeof Session!=='undefined'&&Session.seesAllBranches)?await Session.seesAllBranches():false; }catch(e){}
  const mine = BRANCHES.find(b=>b.id&&b.id===bid) || BRANCHES.find(b=>norm(b.name)===norm(bname));
  if(mine) BRANCH=mine.sync_key; else if(BRANCHES.length) BRANCH=BRANCHES[0].sync_key;
  const sel=document.getElementById('brSel');
  if(seesAll || !mine){
    sel.style.display=''; sel.innerHTML=BRANCHES.map(b=>`<option value="${b.sync_key}" ${b.sync_key===BRANCH?'selected':''}>${esc(b.name)}</option>`).join('');
    sel.onchange=()=>{ BRANCH=sel.value; loadPoints(); };
  }
  document.getElementById('refreshBtn').onclick=refreshCurrent;
  if(!BRANCH){ document.getElementById('content').innerHTML='<div class="state">تعذّر تحميل الفروع.</div>'; return; }
  await loadPoints();
  setInterval(()=>{ if(VIEW==='shift' && CUR) loadShift(); }, 60000);
}
function refreshCurrent(){
  if(VIEW==='log') loadShiftLog();
  else if(VIEW==='detail' && SLsc!=null) openShiftDetail(SLsc, SLcashier);
  else if(CUR) loadShift();
}
async function loadPoints(){
  document.getElementById('content').innerHTML='<div class="state">جارِ التحميل…</div>';
  POINTS = (await rpc('get_shift_points',{p_branch:BRANCH})) || [];
  const tabs=document.getElementById('tabs');
  if(!POINTS.length){ tabs.innerHTML=''; document.getElementById('content').innerHTML='<div class="state">لا توجد نقاط بيع لهذا الفرع.</div>'; return; }
  const VP = await visiblePoints(POINTS);
  let showLog=false;
  try{ if(typeof Session!=='undefined' && Session.tabAllowed) showLog = await Session.tabAllowed('current_shift','shiftlog'); }catch(e){ showLog=false; }
  if(!VP.length && !showLog){ tabs.innerHTML=''; document.getElementById('content').innerHTML='<div class="state">لا توجد نقطة مسموحة لدورك في هذا الفرع.</div>'; return; }
  CUR = VP.length ? roleDefaultPoint(VP) : null;
  let html = VP.map(p=>`<button class="tab" data-c="${p.cashier_id}" data-tk="${pointTabKey(p)}">${esc(p.point_name)}</button>`).join('');
  if(showLog) html += `<button class="tab" data-mode="log"><i class="fas fa-clock-rotate-left"></i> سجل الشيفتات</button>`;
  tabs.innerHTML = html;
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
    if(b.dataset.mode==='log'){ showShiftLog(); }
    else { CUR=+b.dataset.c; chFilter=null; typeFilter=null; userFilter=null; loadShift(); }
  });
  if(VP.length){ const fb=tabs.querySelector('.tab[data-c]'); if(fb) fb.classList.add('active'); loadShift(); }
  else { const lb=tabs.querySelector('.tab[data-mode="log"]'); if(lb) lb.classList.add('active'); showShiftLog(); }
}
async function loadShift(){
  VIEW='shift';
  SHIFT = await rpc('get_current_shift',{p_branch:BRANCH, p_cashier:CUR});
  if(!SHIFT){ document.getElementById('content').innerHTML='<div class="state">تعذّر التحميل.</div>'; return; }
  TXN = (SHIFT.transactions||[]).map(t=>({...t}));  // نسخة قابلة للتعديل
  render();
}
function kpis(){
  const cash=TXN.filter(t=>t.kind==='كاش').reduce((a,t)=>a+ +t.amount,0);
  const visa=TXN.filter(t=>t.kind==='فيزا').reduce((a,t)=>a+ (t.paid!=null? +t.paid : +t.amount),0);
  const sarf=TXN.filter(t=>t.kind==='صرف').reduce((a,t)=>a+ +t.amount,0);
  const tran=TXN.filter(t=>t.kind==='توريد').reduce((a,t)=>a+ +t.amount,0);
  const op=Number(SHIFT.opening)||0;
  return { cash, visa, sarf, tran, net: op+cash+tran-sarf, op };
}
function render(){
  const k=kpis();
  const startTxt = SHIFT.shift_start ? new Date(SHIFT.shift_start).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
  const users=(SHIFT.users||[]).map(esc).join('، ')||'—';
  const byCh={}; TXN.filter(t=>t.kind==='فيزا').forEach(t=>{const c=t.channel||'—'; byCh[c]=byCh[c]||{t:0,n:0}; byCh[c].t+=(t.paid!=null?+t.paid:+t.amount); byCh[c].n++;});
  const chips=Object.entries(byCh).sort((a,b)=>b[1].t-a[1].t).map(([c,v])=>`<span class="vch ${chFilter===c?'on':''}" data-ch="${esc(c)}">${esc(c)} <b>${fmt(v.t)}</b> (${v.n})</span>`).join('')||'<span class="vch">—</span>';
  document.getElementById('content').innerHTML = `
    <div class="meta">
      <div class="it"><span class="k">النقطة</span><b>${esc(SHIFT.point)}</b></div>
      <div class="it"><span class="k">بداية الشيفت</span><b>${startTxt}</b></div>
      <div class="it"><span class="k">عدد المعاملات</span><b>${TXN.length}</b></div>
      <div class="users" title="${users}">👤 ${users}</div>
    </div>
    <div class="sumcard">
      <div class="sumtbl"><table>
        <thead><tr>
          <th>الرصيد الإفتتاحى</th><th>+ كاش</th><th>+ توريد</th><th>− صرف</th>
          <th class="net">صافي الكاش المطلوب تسليمه</th><th class="visa">إجمالي الفيزا (للبنك)</th>
        </tr></thead>
        <tbody><tr>
          <td class="plus">${fmt(k.op)}</td>
          <td class="plus">${fmt(k.cash)}</td>
          <td class="plus">${fmt(k.tran)}</td>
          <td class="minus">${fmt(k.sarf)}</td>
          <td class="net ${k.net<0?'neg':'pos'}" id="k-net">${fmt(k.net)}</td>
          <td class="visa" id="k-visa">${fmt(k.visa)}</td>
        </tr></tbody>
      </table></div>
      <div class="chips" id="vchs"><span class="lbl">الفيزا بالقنوات (للمطابقة مع البنك):</span> ${chips}</div>
    </div>
    <div class="note">✏️ لو معاملة اتحفظت كاش وهي فيزا: غيّر «الحساب» في صفّها → بتتحوّل فيزا والصافي يتعدّل (تصحيح للعرض، مش بيتحفظ في eplus).</div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="🔎 بحث بالطرف / الملاحظة / المستخدم…">
      <span class="flabel">النوع:</span>
      ${['كاش','فيزا','صرف','توريد'].map(t=>`<button class="chip tp ${typeFilter===t?'active':''}" data-t="${t}">${t}</button>`).join('')}
      <span class="flabel">المستخدم:</span>
      <select id="userSel" class="usel"><option value="">الكل</option>${[...new Set(TXN.map(t=>t.user_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar')).map(u=>`<option value="${esc(u)}" ${userFilter===u?'selected':''}>${esc(u)}</option>`).join('')}</select>
      <span class="shown" id="shown"></span>
    </div>
    <div class="tablecard"><table><thead><tr>
      <th>الوقت</th><th>النوع</th><th>قيمة المدفوع</th><th>القيمة</th><th class="r">من</th><th class="r">الى</th><th class="r">المستخدم</th><th>الجهاز</th><th>الحساب</th><th class="r">ملاحظات</th>
    </tr></thead><tbody id="tb"></tbody></table></div>`;
  document.querySelectorAll('.vch[data-ch]').forEach(c=>c.onclick=()=>{ chFilter=(chFilter===c.dataset.ch?null:c.dataset.ch); render(); });
  document.querySelectorAll('.chip.tp').forEach(c=>c.onclick=()=>{ typeFilter=(typeFilter===c.dataset.t?null:c.dataset.t); drawRows(); document.querySelectorAll('.chip.tp').forEach(x=>x.classList.toggle('active',x.dataset.t===typeFilter)); });
  document.getElementById('q').oninput=drawRows;
  const us=document.getElementById('userSel'); if(us) us.onchange=()=>{ userFilter=us.value||null; drawRows(); };
  drawRows();
}
function drawRows(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const rows=TXN.filter((t,i)=>{ t._i=i;
    return (!typeFilter||t.kind===typeFilter) && (!chFilter||t.channel===chFilter) && (!userFilter||t.user_name===userFilter) &&
      (!q||((t.from||'')+' '+(t.to||'')+' '+(t.party||'')+' '+(t.visa_no||'')+' '+(t.notes||'')+' '+(t.user_name||'')).toLowerCase().includes(q)); });
  const sum=rows.reduce((a,t)=>a+(t.kind==='صرف'?-1:1)*(+t.amount),0);
  document.getElementById('shown').textContent='المعروض: '+rows.length+' · مجموع: '+fmt(sum)+' ج';
  document.getElementById('tb').innerHTML = rows.map(t=>{
    const cls=t.kind==='صرف'?'out':(t.kind==='فيزا'?'visa':(t.kind==='توريد'?'in':'cash')); const iv=(t.kind==='فيزا');
    const editable=(t.kind==='كاش'||t.kind==='فيزا');
    const acct = editable
      ? `<select class="e eacct" data-i="${t._i}"><option value="" ${!iv?'selected':''}>— كاش</option>${CHANNELS.map(c=>`<option ${t.channel===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`
      : esc(t.channel||'—');
    const paidCell = iv ? `<input class="e epaid" data-i="${t._i}" type="number" value="${t.paid!=null?t.paid:t.amount}" style="width:82px">` : '';
    return `<tr><td>${esc(t.time)}</td><td><span class="pill ${cls}">${esc(t.kind)}</span></td>`+
      `<td>${paidCell}</td>`+
      `<td class="num ${t.kind==='صرف'?'neg':'pos'}">${t.kind==='صرف'?'−':''}${fmt(t.amount)}</td>`+
      `<td class="r">${esc(t.from||'—')}</td><td class="r">${esc(t.to||'—')}</td>`+
      `<td class="r">${esc(t.user_name||'—')}</td><td class="dev">${esc(t.computer||'—')}</td>`+
      `<td class="${iv?'visa':''}">${acct}</td><td class="notes">${esc(t.notes||'')}</td></tr>`;
  }).join('') || '<tr><td colspan="10" class="state">لا توجد حركات مطابقة.</td></tr>';
  document.querySelectorAll('.eacct').forEach(s=>s.onchange=()=>{
    const t=TXN[+s.dataset.i]; const v=s.value;
    if(v){ t.kind='فيزا'; t.channel=v; if(t.paid==null) t.paid=+t.amount; } else { t.kind='كاش'; t.channel=''; }
    render();
  });
  document.querySelectorAll('.epaid').forEach(inp=>inp.onchange=()=>{
    const t=TXN[+inp.dataset.i]; const v=parseFloat(inp.value); t.paid=isFinite(v)?v:+t.amount;
    render();
  });
}
// ═══════════ سجل الشيفتات ═══════════
let SL=[], slPage=1; const SL_PER=30;
function dmy(s){ if(!s) return '—'; try{ return new Date(s).toLocaleDateString('ar-EG',{timeZone:'Africa/Cairo',day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return s; } }
function hm(s){ if(!s) return '—'; try{ return new Date(s).toLocaleTimeString('ar-EG',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:true}); }catch(e){ return s; } }
function showShiftLog(){
  VIEW='log';
  const pointOpts='<option value="">كل النقاط</option>'+POINTS.map(p=>`<option value="${p.cashier_id}">${esc(p.point_name)}</option>`).join('');
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const toS=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const d7=new Date(Date.now()-7*864e5); const fromS=`${d7.getFullYear()}-${p(d7.getMonth()+1)}-${p(d7.getDate())}`;
  document.getElementById('content').innerHTML=`
    <div class="toolbar">
      <span class="flabel">النقطة</span><select id="slPt" onchange="slPage=1;loadShiftLog()">${pointOpts}</select>
      <span class="flabel">من</span><input type="date" id="slFrom" value="${fromS}" onchange="slPage=1;loadShiftLog()">
      <span class="flabel">إلى</span><input type="date" id="slTo" value="${toS}" onchange="slPage=1;loadShiftLog()">
      <span class="shown" id="slShown"></span>
    </div>
    <div class="tablecard"><table><thead><tr>
      <th>التاريخ</th><th>النقطة</th><th>الفترة</th><th>الرصيد الإفتتاحى</th><th>القيمة (نظام)</th><th>الفعلي المعدود</th><th>الفرق</th><th>التحويل</th><th></th>
    </tr></thead><tbody id="slBody"><tr><td colspan="9" class="state">جارِ التحميل…</td></tr></tbody></table></div>
    <div class="pager" id="slPager"></div>`;
  slPage=1; loadShiftLog();
}
async function loadShiftLog(){
  VIEW='log';
  const pt=document.getElementById('slPt').value||null;
  const from=document.getElementById('slFrom').value||null, to=document.getElementById('slTo').value||null;
  document.getElementById('slBody').innerHTML='<tr><td colspan="9" class="state">جارِ التحميل…</td></tr>';
  const res=await rpc('get_shift_log',{p_branch:BRANCH, p_cashier: pt?+pt:null, p_from:from, p_to:to, p_limit:SL_PER, p_offset:(slPage-1)*SL_PER});
  SL=(res&&res.rows)||[]; renderShiftLog((res&&res.total_count)||0);
}
function renderShiftLog(total){
  const sh=document.getElementById('slShown'); if(sh) sh.textContent='عدد الشيفتات: '+fmt(total);
  const tb=document.getElementById('slBody');
  tb.innerHTML = SL.length ? SL.map(x=>{
    const dc=Number(x.diff)>=0?'pos':'neg';
    return `<tr class="logrow" data-sc="${x.sc_id}" data-c="${x.cashier_id}">
      <td>${dmy(x.closed_at)}</td><td>${esc(x.point_name||'—')}</td>
      <td style="font-size:12px">${hm(x.shift_start)} ← ${hm(x.closed_at)}</td>
      <td class="num">${fmt(x.opening)}</td><td class="num">${fmt(x.system_cash)}</td><td class="num">${fmt(x.actual_cash)}</td>
      <td class="num ${dc}" style="font-weight:800">${Number(x.diff)>0?'+':''}${fmt(x.diff)}</td>
      <td class="num">${fmt(x.transfer)}</td><td><button class="lnk">مراجعة ›</button></td></tr>`;
  }).join('') : '<tr><td colspan="9" class="state">لا توجد شيفتات في المدى المختار.</td></tr>';
  tb.querySelectorAll('.logrow').forEach(r=>r.onclick=()=>openShiftDetail(+r.dataset.sc, +r.dataset.c));
  renderPager('slPager', Math.max(1,Math.ceil(total/SL_PER)), slPage, 'slGo');
}
function slGo(n){ slPage=n; loadShiftLog(); window.scrollTo(0,0); }
function renderPager(elId, pages, cur, goFn){
  const p=document.getElementById(elId); if(!p) return;
  if(pages<=1){ p.innerHTML=''; return; }
  let h=`<button ${cur<=1?'disabled':''} onclick="${goFn}(1)">«</button><button ${cur<=1?'disabled':''} onclick="${goFn}(${cur-1})">‹</button>`;
  const from=Math.max(1,cur-2), to=Math.min(pages,cur+2);
  for(let i=from;i<=to;i++) h+=`<button class="${i===cur?'on':''}" onclick="${goFn}(${i})">${i}</button>`;
  h+=`<button ${cur>=pages?'disabled':''} onclick="${goFn}(${cur+1})">›</button><button ${cur>=pages?'disabled':''} onclick="${goFn}(${pages})">»</button><span class="pinfo">صفحة ${cur} من ${pages}</span>`;
  p.innerHTML=h;
}
async function openShiftDetail(sc_id, cashier_id){
  VIEW='detail'; SLsc=sc_id; SLcashier=cashier_id;
  document.getElementById('content').innerHTML='<div class="state">جارِ تحميل الشيفت…</div>';
  const d=await rpc('get_shift_detail',{p_branch:BRANCH, p_cashier:cashier_id, p_sc_id:sc_id});
  if(!d || d.error){ document.getElementById('content').innerHTML='<div class="state">'+esc((d&&d.error)||'تعذّر التحميل')+'</div>'; return; }
  renderShiftDetail(d);
}
function renderShiftDetail(d){
  const users=(d.users||[]).join('، ');
  const diffCls=Number(d.diff)>=0?'g':'r';
  const chips=(d.visa_by_channel||[]).map(c=>`<span class="pill visa" style="margin:2px">${esc(c.channel)} ${fmt(c.total)} (${c.cnt})</span>`).join('')||'—';
  const txns=(d.transactions||[]);
  const rows= txns.length ? txns.map(t=>{
    const cls=t.kind==='صرف'?'out':(t.kind==='فيزا'?'visa':(t.kind==='توريد'?'in':'cash'));
    return `<tr><td>${esc(t.time)}</td><td><span class="pill ${cls}">${esc(t.kind)}</span></td>`+
      `<td class="num">${t.kind==='فيزا'?fmt(t.paid!=null?t.paid:t.amount):''}</td>`+
      `<td class="num ${t.kind==='صرف'?'neg':'pos'}">${t.kind==='صرف'?'−':''}${fmt(t.amount)}</td>`+
      `<td class="r">${esc(t.from||'—')}</td><td class="r">${esc(t.to||'—')}</td>`+
      `<td class="r">${esc(t.user_name||'—')}</td><td class="dev">${esc(t.computer||'—')}</td>`+
      `<td>${esc(t.channel||'—')}</td><td class="notes">${esc(t.notes||'')}</td></tr>`;
  }).join('') : '<tr><td colspan="10" class="state">لا توجد حركات.</td></tr>';
  document.getElementById('content').innerHTML=`
    <div style="margin-bottom:10px"><button class="lnk" onclick="showShiftLog()">‹ رجوع للسجل</button></div>
    <div class="meta">
      <div class="it"><span class="k">النقطة</span><b>${esc(d.point)}</b></div>
      <div class="it"><span class="k">الفترة</span><b>${dmy(d.shift_start)} · ${hm(d.shift_start)} ← ${hm(d.closed_at)}</b></div>
      <div class="it"><span class="k">عدد المعاملات</span><b>${fmt(d.count)}</b></div>
      <div class="users" title="${esc(users)}">👤 ${esc(users||'—')}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">الرصيد الإفتتاحى</div><div class="val">${fmt(d.opening)} <small>ج</small></div></div>
      <div class="kpi"><div class="lbl">القيمة (كاش النظام)</div><div class="val">${fmt(d.system_cash)} <small>ج</small></div></div>
      <div class="kpi"><div class="lbl">الفعلي المعدود</div><div class="val">${fmt(d.actual_cash)} <small>ج</small></div></div>
      <div class="kpi ${diffCls}"><div class="lbl">الفرق (فعلي − نظام)</div><div class="val">${Number(d.diff)>0?'+':''}${fmt(d.diff)} <small>ج</small></div>
        <div class="formula">محوّل للخزنة: ${fmt(d.transfer)} ج</div></div>
      <div class="kpi v"><div class="lbl">إجمالي الفيزا</div><div class="val">${fmt(d.visa_in)} <small>ج</small></div><div class="formula">${chips}</div></div>
    </div>
    <div class="meta" style="font-size:12px">
      <div class="it"><span class="k">كاش الحركات</span><b>${fmt(d.cash_in)}</b></div>
      <div class="it"><span class="k">صرف</span><b class="neg">−${fmt(d.sarf)}</b></div>
      <div class="it"><span class="k">توريد</span><b>${fmt(d.transfer_in)}</b></div>
      <div class="it" style="color:var(--muted)">الأرقام فوق من تقفيل eplus؛ قائمة الحركات للمراجعة</div>
    </div>
    <div class="tablecard"><table><thead><tr>
      <th>الوقت</th><th>النوع</th><th>قيمة المدفوع</th><th>القيمة</th><th class="r">من</th><th class="r">الى</th><th class="r">المستخدم</th><th>الجهاز</th><th>الحساب</th><th class="r">ملاحظات</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
