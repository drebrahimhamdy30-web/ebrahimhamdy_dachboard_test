<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الشيفت الحالي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  :root{--teal:#0d9488;--teal-d:#0f766e;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--green:#059669;--red:#dc2626;}
  *{box-sizing:border-box} body{font-family:'Cairo',sans-serif;margin:0;background:var(--bg);color:var(--ink);padding:16px}
  .wrap{max-width:1340px;margin:0 auto}
  header.rpt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--teal);padding-bottom:10px;margin-bottom:12px}
  header.rpt h1{margin:0;font-size:20px;font-weight:800}
  header.rpt .ctl{display:flex;gap:8px;align-items:center}
  select,input,button{font-family:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  button{cursor:pointer} button:hover{border-color:var(--teal)}
  .tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .tab{font-size:14px;font-weight:700;padding:8px 20px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
  .tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* هيدر مدمج صغير */
  .meta{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;margin-bottom:10px;font-size:13px}
  .meta .it{display:flex;gap:6px;align-items:baseline} .meta .k{color:var(--muted);font-weight:600;font-size:12px} .meta b{font-weight:800}
  .meta .users{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px;cursor:help}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;position:relative;overflow:hidden;flex:1;min-width:230px}
  .kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--teal)}
  .kpi.g::before{background:var(--green)}.kpi.r::before{background:var(--red)}.kpi.v::before{background:#8b5cf6}
  .kpi .lbl{color:var(--muted);font-size:12px;font-weight:700;margin-bottom:3px}
  .kpi .val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums} .kpi .val small{font-size:13px;color:var(--muted)}
  .kpi.r .val{color:var(--red)} .kpi.g .val{color:var(--green)} .kpi.v .val{color:#7c3aed}
  .kpi .formula{margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:700} .kpi .formula span{font-weight:400;font-size:10.5px;margin:0 2px}
  .vchs{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .vch{font-size:11.5px;background:#f3e8ff;color:#6b21a8;border-radius:7px;padding:2px 9px;font-weight:600;cursor:pointer} .vch b{font-weight:800} .vch.on{background:#6b21a8;color:#fff}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:10px}
  .toolbar input[type=search]{flex:1;min-width:160px}
  .flabel{font-size:11.5px;color:var(--muted);font-weight:700}
  .chip{font-size:12px;font-weight:600;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  .usel{font-size:12px;font-weight:600;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;font-family:inherit;max-width:180px}
  .usel:focus{outline:none;border-color:var(--teal)}
  .shown{margin-inline-start:auto;font-size:12.5px;font-weight:700;color:var(--teal-d);background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:6px 12px}
  .note{font-size:11.5px;color:var(--teal-d);background:#ccfbf1;border:1px solid #99f6e4;border-radius:7px;padding:5px 11px;margin-bottom:10px}
  /* ── مراجعة الفيزا ── */
  .rvbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
         border-inline-start:4px solid #8b5cf6;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13px}
  .rvbar .ttl{font-weight:800}
  .rvbar .cnt{font-weight:800;color:#6b21a8;font-variant-numeric:tabular-nums}
  .rvbar .prog{flex:1;min-width:120px;height:8px;background:#ede9fe;border-radius:99px;overflow:hidden}
  .rvbar .prog i{display:block;height:100%;background:#7c3aed;border-radius:99px;transition:width .25s}
  .rvbar .rest{color:var(--muted);font-weight:700}
  .rvbar .done{color:var(--green);font-weight:800}
  .rvbar .vtot{margin-inline-start:auto;font-weight:700;color:#6b21a8;background:#f5f3ff;
               border:1px solid #ddd6fe;border-radius:8px;padding:5px 12px}
  .rvbar .vtot b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  th.rv,td.rv{width:124px}
  .btn-rv{font-family:inherit;font-size:12px;font-weight:700;padding:5px 14px;border:1px solid #c4b5fd;
          border-radius:8px;background:#f5f3ff;color:#6b21a8;cursor:pointer;white-space:nowrap}
  .btn-rv:hover{background:#7c3aed;color:#fff;border-color:#7c3aed}
  .btn-rv[disabled]{opacity:.5;cursor:default}
  .rv-ok{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--green);white-space:nowrap}
  .rv-ok .who{color:var(--muted);font-weight:600;font-size:10.5px}
  .btn-unlock{font-family:inherit;font-size:10.5px;font-weight:700;padding:2px 8px;border:1px solid var(--line);
              border-radius:6px;background:#fff;color:var(--muted);cursor:pointer;margin-inline-start:6px}
  .btn-unlock:hover{border-color:var(--red);color:var(--red)}
  tr.locked{background:#f0fdf4 !important}
  tr.locked td{color:#065f46}
  tr.locked .e{border-color:transparent;background:transparent;color:#065f46;font-weight:700;appearance:none;-webkit-appearance:none}
  .dash{color:var(--line)}
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f8fafc;color:#475569;font-weight:700;font-size:12px;position:sticky;top:0}
  td.r,th.r{text-align:right} td.notes{text-align:right;white-space:normal;color:var(--muted);max-width:220px} td.dev{color:var(--muted);font-size:11.5px} td.visa{background:#faf5ff}
  tbody tr:nth-child(even){background:#fafbfc} tbody tr:hover{background:#f0fdfa}
  .num{font-variant-numeric:tabular-nums;font-weight:700} .pos{color:var(--green)}.neg{color:var(--red)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.cash{background:#e0f2fe;color:#075985}.pill.visa{background:#f3e8ff;color:#6b21a8}.pill.out{background:#fee2e2;color:#991b1b}.pill.in{background:#dcfce7;color:#166534}
  select.e{font-family:inherit;font-size:11.5px;padding:3px 5px;border:1px solid #cbd5e1;border-radius:6px;max-width:120px}
  .state{padding:34px;text-align:center;color:var(--muted);font-weight:600}
  .pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap}
  .pager button{min-width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px}
  .pager button.on{background:var(--teal);color:#fff;border-color:var(--teal)} .pager button:disabled{opacity:.4;cursor:default}
  .pager .pinfo{font-size:12px;color:var(--muted);margin-inline-start:8px}
  .logrow{cursor:pointer} .logrow:hover{background:#f0fdfa}
  .lnk{background:none;border:0;color:var(--teal-d);font-weight:800;cursor:pointer;font-family:inherit;font-size:13px}
  .sumcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
  .sumtbl{overflow-x:auto}
  .sumtbl table{width:100%;border-collapse:collapse}
  .sumtbl th{background:#f8fafc;color:#475569;font-weight:700;padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
  .sumtbl td{padding:12px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
  .sumtbl th:not(:first-child),.sumtbl td:not(:first-child){border-inline-start:1px solid var(--line)}
  .sumtbl td.plus{color:#1e40af} .sumtbl td.minus{color:var(--red)}
  .sumtbl th.net,.sumtbl td.net{background:#ecfdf5} .sumtbl td.net{font-size:19px} .sumtbl td.net.pos{color:var(--teal-d)} .sumtbl td.net.neg{color:var(--red)}
  .sumtbl th.visa,.sumtbl td.visa{background:#f5f3ff;color:#7c3aed}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--line);align-items:center}
  .chips .lbl{font-size:12px;color:var(--muted);font-weight:700}
  /* الصف طلع برّه كارت الملخّص عشان يبان للكل كفلتر — محتاج إطاره بنفسه */
  .card-chips{background:var(--card);border:1px solid var(--line);border-top:1px solid var(--line);
              border-radius:10px;margin-bottom:10px}
  .epaid{font-weight:800;color:#7c3aed} .epaid.auto{color:var(--red);font-weight:600;opacity:.8}
  @media(max-width:760px){body{padding:10px}.kpi{min-width:100%}}
/* تبويب مراجعة البطاقات: نفس الجدول، بس التاريخ تحت الوقت لأنه بيعدّي أيام */
.dsub{font-size:.62rem;color:var(--text-muted,#64748b);direction:ltr}
.crbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.crbar select,.crbar input[type=date]{padding:.35rem .5rem;border:1px solid var(--border,#cbd5e1);border-radius:8px;font-family:inherit;font-size:.78rem;background:var(--surface,#fff);color:inherit}
.crpager{display:flex;gap:5px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
.crpager button{min-width:30px;height:30px;border:1px solid var(--border,#cbd5e1);background:var(--surface,#fff);border-radius:7px;cursor:pointer;font-weight:700;font-family:inherit}
.crpager button.on{background:#0f766e;color:#fff;border-color:#0f766e}
.crpager button:disabled{opacity:.4;cursor:default}
</style>

<body>
<div class="wrap">
  <header class="rpt">
    <h1>تفاصيل الشيفت الحالي</h1>
    <div class="ctl"><select id="brSel" style="display:none"></select><button id="refreshBtn">↻ تحديث</button></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="state">جارِ التحميل…</div></div>
</div>
<script>
const norm = s => String(s||'').replace(/\s+/g,'').replace(/^ال/,'').replace(/[ىي]/g,'ي');
let BRANCHES = [];  // {id,name,sync_key} من جدول الفروع
async function loadBranches(){
  try{ const r=await fetch(SB_URL_API+"/rest/v1/branches?select=id,name,sync_key&sync_key=not.is.null&order=name",{headers:{apikey:SB_ANON_API,Authorization:'Bearer '+SB_ANON_API}});
    BRANCHES = r.ok ? (await r.json()) : []; }catch(e){ BRANCHES=[]; }
}
const CHANNELS = ['instapay','paymob 1','paymob 7','orange cash','fawry313','fawry 6008','vodafon cash'];
const fmt = n => (n<0?'−':'') + Math.abs(Math.round(Number(n)||0)).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ⚠️ بتوكن المستخدم مش بمفتاح anon: الدوال دي بترجّع إجماليات الشيفت،
   والحارس على السيرفر بيقرا دور المستخدم من التوكن — بمفتاح anon الدور
   بيبقى فاضي فالحارس مابيشتغلش، وأي حد معاه المفتاح كان يقدر يناديها. */
async function rpc(fn, body){
  try{ const r=await fetch(SB_URL_API+'/rest/v1/rpc/'+fn,{ method:'POST',
    headers:await sbH({'Content-Type':'application/json'}), body:JSON.stringify(body||{}) });
    if(!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
let BRANCH='', POINTS=[], CUR=null, SHIFT=null, TXN=[], chFilter=null, typeFilter=null, userFilter=null;
let VIEW='shift', SLsc=null, SLcashier=null;  // VIEW: shift | log | detail

/* صلاحية «الإجماليات ونسخ الحركات» (migrate_151) — بند في شاشة
   الصلاحيات، مش هاردكود بالدور. ممنوعة افتراضيًا لغير الأدمن:
   الموظف يشوف حركاته من غير مجاميع، وما ينسخهاش لإكسل فيجمّعها.
   ⚠️ الإخفاء هنا للواجهة؛ الأرقام نفسها مابتوصلش المتصفح أصلًا لأن
   get_current_shift بيشيلها من الرد. */
let CAN_TOTALS = true;
let IS_ADMIN = false;        // فكّ قفل المراجعة للأدمن فقط
let pendOnly = false;        // فلتر «غير المراجَع فقط»

/* منع النسخ: الهدف إن الموظف ما ينقلش الحركات لإكسل ويجمّعها.
   ⚠️ ده احتكاك مش جدار — الأرقام ظاهرة على الشاشة فتقدر تتكتب بالإيد
   أو تتصوّر. اللي بيتقفل هنا هو الطريق السهل (تحديد → نسخ → لصق). */
function lockCopy(){
  const st=document.createElement('style');
  st.textContent='.tablecard,.tablecard *{user-select:none;-webkit-user-select:none;-ms-user-select:none}';
  document.head.appendChild(st);
  document.addEventListener('copy', e=>{
    if(e.target && e.target.closest && e.target.closest('input,select,textarea')) return;  // الكتابة في الفلاتر تفضل طبيعية
    e.preventDefault();
  });
  document.addEventListener('contextmenu', e=>{ if(e.target.closest('.tablecard')) e.preventDefault(); });
  document.addEventListener('dragstart',  e=>{ if(e.target.closest('.tablecard')) e.preventDefault(); });
}

function roleDefaultPoint(points){
  let role=''; try{ role=(typeof Session!=='undefined'&&Session.role)?Session.role():''; }catch(e){}
  if(/cash|كاشير/i.test(role)){ const p=points.find(x=>/كاشير/.test(x.point_name)); if(p) return p.cashier_id; }
  const pv=points.find(x=>/نقط/.test(x.point_name)); return pv?pv.cashier_id:(points[0]&&points[0].cashier_id);
}
// كل نقطة = تبويب (كاشير / نقطة البيع)؛ الظهور من صلاحيات التبويبات (شاشة الصلاحيات)
function pointTabKey(p){ return /كاشير/.test(p.point_name) ? 'cashier' : 'pos'; }
async function visiblePoints(points){
  const out=[];
  for(const p of points){
    let ok=true;
    try{ if(typeof Session!=='undefined' && Session.tabAllowed) ok = await Session.tabAllowed('current_shift', pointTabKey(p)); }catch(e){ ok=true; }
    if(ok) out.push(p);
  }
  return out;
}
async function init(){
  try{ if(typeof Session!=='undefined' && Session.tabAllowed)
         CAN_TOTALS = await Session.tabAllowed('current_shift','totals'); }catch(e){ CAN_TOTALS = true; }
  try{ IS_ADMIN = (typeof Session!=='undefined' && Session.isAdmin) ? Session.isAdmin() : false; }catch(e){ IS_ADMIN = false; }
  if(!CAN_TOTALS) lockCopy();
  await loadBranches();
  let bid='', bname='', seesAll=false;
  try{ bid=(typeof Session!=='undefined'&&Session.branchId)?Session.branchId():''; }catch(e){}
  try{ bname=(typeof Session!=='undefined'&&Session.branch)?Session.branch():''; }catch(e){}
  try{ seesAll=(typeof Session!=='undefined'&&Session.seesAllBranches)?await Session.seesAllBranches():false; }catch(e){}
  const mine = BRANCHES.find(b=>b.id&&b.id===bid) || BRANCHES.find(b=>norm(b.name)===norm(bname));
  if(mine) BRANCH=mine.sync_key; else if(BRANCHES.length) BRANCH=BRANCHES[0].sync_key;
  const sel=document.getElementById('brSel');
  if(seesAll || !mine){
    sel.style.display=''; sel.innerHTML=BRANCHES.map(b=>`<option value="${b.sync_key}" ${b.sync_key===BRANCH?'selected':''}>${esc(b.name)}</option>`).join('');
    sel.onchange=()=>{ BRANCH=sel.value; loadPoints(); };
  }
  document.getElementById('refreshBtn').onclick=refreshCurrent;
  if(!BRANCH){ document.getElementById('content').innerHTML='<div class="state">تعذّر تحميل الفروع.</div>'; return; }
  await loadPoints();
  setInterval(()=>{ if(VIEW==='shift' && CUR) loadShift(); }, 60000);
}
/* ════════════════════════════════════════════════════════════
   مراجعة تحصيل بطاقات الائتمان
   ------------------------------------------------------------
   نفس جدول الشيفت بالحرف (نفس الأعمدة ونفس drawRows ونفس زر «تم»
   ونفس القفل) — الفرق إن المصدر مش شيفت واحد: get_card_txns
   بترجّع حركات الفيزا والمحافظ عبر الشيفتات في مدى تاريخ، بنفس
   شكل الصفوف بالظبط عشان الجدول يرسمها من غير أي تعديل.
   الصف المُراجَع بيفضل مكانه (بيتقفل بس) زي الشيفت. */
let CR = { from:'', to:'', branch:'', pending:false, page:1, size:50, total:0 };
function crToday(){ const c=new Date(new Date().toLocaleString('en-US',{timeZone:'Africa/Cairo'}));
  const p=n=>String(n).padStart(2,'0'); return `${c.getFullYear()}-${p(c.getMonth()+1)}-${p(c.getDate())}`; }

function showCardReview(){
  VIEW='cards';
  if(!CR.from){ CR.from=crToday(); CR.to=crToday(); CR.branch=BRANCH||''; }
  loadCardTxns();
}

async function loadCardTxns(){
  document.getElementById('content').innerHTML='<div class="state">جارِ التحميل…</div>';
  const d = await rpc('get_card_txns', { p_branch: CR.branch||null, p_from: CR.from, p_to: CR.to,
                                          p_only_pending: CR.pending, p_limit: CR.size,
                                          p_offset: (CR.page-1)*CR.size });
  if(!d){ document.getElementById('content').innerHTML='<div class="state">تعذّر التحميل — تأكد من صلاحيتك.</div>'; return; }
  CR.total = +d.total || 0;
  TXN = (d.rows||[]).map(t=>{
    const x={...t};
    /* نفس منطق الشيفت: المُراجَع بيسترجع قيمته المؤكَّدة من المراجعة */
    if(x.rv){ if(x.rv.channel) x.channel=x.rv.channel; if(x.rv.paid!=null){ x.paid=+x.rv.paid; x.manual=true; } }
    return x; });
  renderCardReview(d);
}

function renderCardReview(d){
  const pages = Math.max(1, Math.ceil(CR.total / CR.size));
  if(CR.page > pages) CR.page = pages;
  const brOpts = BRANCHES.map(b=>`<option value="${esc(b.sync_key)}" ${CR.branch===b.sync_key?'selected':''}>${esc(b.name)}</option>`).join('');
  const kpis = CAN_TOTALS ? `<div class="kpis">
      <div class="kpi"><div class="v">${fmt(d.total)}</div><div class="l">عدد الحركات</div></div>
      <div class="kpi"><div class="v">${fmt(d.total_paid)}</div><div class="l">إجمالي قيمة المدفوع</div></div>
      <div class="kpi"><div class="v" style="color:#15803d">${fmt(d.reviewed_paid)}</div><div class="l">مُراجَع (${fmt(d.reviewed)})</div></div>
      <div class="kpi"><div class="v" style="color:#b45309">${fmt(d.pending_paid)}</div><div class="l">لم يُراجَع (${fmt(d.pending)})</div></div>
    </div>` : '';
  const chans = (d.channels||[]).filter(c=>c&&c!=='—').sort((a,b)=>String(a).localeCompare(String(b),'ar'));
  const users  = (d.users||[]).sort((a,b)=>String(a).localeCompare(String(b),'ar'));
  document.getElementById('content').innerHTML = `
    <div class="crbar">
      <select id="crBr"><option value="">كل الفروع</option>${brOpts}</select>
      <input type="date" id="crFrom" value="${CR.from}"> <span style="font-size:.78rem">←</span>
      <input type="date" id="crTo" value="${CR.to}">
      <select id="crPend"><option value="" ${!CR.pending?'selected':''}>الكل</option><option value="1" ${CR.pending?'selected':''}>غير المراجَع فقط</option></select>
    </div>
    ${kpis}
    <div class="filters">

    </tr></thead><tbody id="tb"></tbody></table></div>
    <div class="crpager" id="crPager"></div>`;

  const go = () => { CR.page=1; loadCardTxns(); };

  const mk=(lbl,p,dis,on)=>`<button ${dis?'disabled':''} class="${on?'on':''}" data-p="${p}">${lbl}</button>`;
  let h=mk('«',1,CR.page===1)+mk('‹',CR.page-1,CR.page===1);
  for(let p=1;p<=pages;p++){ if(p===1||p===pages||Math.abs(p-CR.page)<=2) h+=mk(p,p,false,p===CR.page);
    else if(Math.abs(p-CR.page)===3) h+='<span style="margin:0 6px;color:var(--text-muted)">…</span>'; }
  h+=mk('›',CR.page+1,CR.page===pages)+mk('»',pages,CR.page===pages);
  h+=`<span style="margin:0 8px;color:var(--text-muted);font-size:.76rem">صفحة ${CR.page} من ${pages} · ${fmt(CR.total)} حركة</span>`;
  pg.innerHTML=h;
  pg.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{ CR.page=+b.dataset.p; loadCardTxns();

async function loadShift(){
  VIEW='shift';
  SHIFT = await rpc('get_current_shift',{p_branch:BRANCH, p_cashier:CUR});
  if(!SHIFT){ document.getElementById('content').innerHTML='<div class="state">تعذّر التحميل.</div>'; return; }
  /* الحركة المُراجَعة بتسترجع قيمتها المؤكَّدة من المراجعة مش من eplus:
     التصحيح اللي الموظف عمله قبل ما يضغط «تم» اتحفظ عندنا، وde eplus
     لسه شايف الأصل. من غير ده القفل يرجّع الرقم القديم بعد أول تحديث. */
  TXN = (SHIFT.transactions||[]).map(t=>{
    const x = {...t};
    if(x.rv){
      if(x.rv.channel){ x.kind = 'فيزا'; x.channel = x.rv.channel; }
      if(x.rv.paid != null){
        x.paid = +x.rv.paid;
        if(Math.abs(x.paid - (+x.amount||0)) > 0.005) x.manual = true;
      }
    }
    return x;
  });
  render();
}
// معاملة فيزا «مكتوبة يدويًا» (قيمة مدفوع مميّزة) مقابل أوتوماتيك (أخدت القيمة)
function isManual(t){ return (t.manual===true) || (t.manual==null && Number(t.visa_no)>1); }
/* ⚠️ قراءة رقم كتبه المستخدم بالعربي.
   input[type=number] بيرجّع "" لأي إدخال المتصفح مش فاهمه — الأرقام
   الهندية (٢٥) أو الفاصلة العربية (٢٥٫٥) أو الفاصلة العادية (25,5) —
   فالقيمة كانت بترجع لأصلها **من غير أي رسالة**، والمستخدم يفتكر إن
   الشاشة رافضة التعديل. الخانة بقت نصّية وإحنا بنطبّع الرقم بنفسنا. */
const AR_DIGITS = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
                    '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' };
function toNum(s){
  const v = String(s==null?'':s)
    .replace(/[٠-٩۰-۹]/g, d => AR_DIGITS[d])
    .replace(/[٫،,]/g, '.')
    .replace(/[^\d.]/g, '')
    .trim();
  return v === '' ? NaN : parseFloat(v);
}
function paidOf(t){ return (t.paid!=null)? +t.paid : +t.amount; }
function kpis(){
  const cash=TXN.filter(t=>t.kind==='كاش').reduce((a,t)=>a+ +t.amount,0);
  let visa=0; { const vs=new Set(); TXN.filter(t=>t.kind==='فيزا').forEach(t=>{ const val=paidOf(t); if(isManual(t)){ const k='m:'+val; if(!vs.has(k)){ vs.add(k); visa+=val; } } else visa+=val; }); }
  const sarf=TXN.filter(t=>t.kind==='صرف').reduce((a,t)=>a+ +t.amount,0);
  const tran=TXN.filter(t=>t.kind==='توريد').reduce((a,t)=>a+ +t.amount,0);
  const op=Number(SHIFT.opening)||0;
  return { cash, visa, sarf, tran, net: op+cash+tran-sarf, op };
}
/* ── مراجعة الفيزا ───────────────────────────────────────────────
   موظف الشيفت بيأكّد إن المعاملة وصلت فعلًا (المحفظة استلمت أو السحب
   على الماكينة تم). الضغط على «تم» بيحفظ القيمة والقناة عندنا ويقفل
   السطر. ⚠️ قبل كده كان تعديل «الحساب»/«قيمة المدفوع» للعرض بس
   وبيضيع مع أول تحديث — القفل من غير حفظ مالوش معنى. */
const isReviewable = t => t.kind === 'فيزا' && t.fh_id != null;
/* ⚠️ الإجمالي ده **مجموع عمود «قيمة المدفوع»** زي ما هو معروض (طلب
   المالك) — مش زي «إجمالي الفيزا» في جدول الملخّص اللي بيوحّد
   المعاملات اليدوية المتكررة بنفس القيمة. فالرقمان ممكن يختلفوا. */
const visaPaidTotal = () => TXN.filter(t=>t.kind==='فيزا').reduce((a,t)=>a+paidOf(t),0);

function reviewBar(){
  const v = TXN.filter(isReviewable);
  const ok = v.filter(t=>t.rv).length;
  const pct = v.length ? (ok/v.length*100) : 100;
  return `<div class="rvbar">
    <span class="ttl">✅ مراجعة الفيزا</span>
    <span class="cnt">${ok} من ${v.length}</span>
    <span class="prog"><i style="width:${pct.toFixed(0)}%"></i></span>
    <span class="rest">${v.length && ok===v.length ? '<b class="done">اكتملت المراجعة ✓</b>'
      : (v.length ? 'باقي ' + (v.length-ok) + ' معاملة' : 'لا توجد معاملات فيزا')}</span>
    <span class="vtot">إجمالي قيمة المدفوع (فيزا) <b>${fmt(visaPaidTotal())}</b> ج</span>
    ${v.length ? `<button class="chip ${pendOnly?'active':''}" id="pendBtn">غير المراجَع فقط</button>` : ''}
  </div>`;
}

/* ⚠️ rpc() العادية بترجّع null عند الفشل فرسالة السيرفر بتضيع — والمراجعة
   رسايلها مهمة («تمت مراجعتها بالفعل»، «غير مصرّح»). الكتابة ليها نداء
   بيقرا جسم الخطأ. */
async function rpcWrite(fn, body){
  let r, out = null;
  try{
    r = await fetch(SB_URL_API+'/rest/v1/rpc/'+fn, { method:'POST',
          headers: await sbH({'Content-Type':'application/json'}), body: JSON.stringify(body||{}) });
    try{ out = await r.json(); }catch(e){ out = null; }
  }catch(e){ return { success:false, error:'تعذّر الاتصال بالخادم' }; }
  if(r.ok && out && out.success === true) return out;
  return { success:false, error: (out && (out.message || out.hint || out.error)) || ('فشل العملية ('+r.status+')') };
}

async function reviewTxn(i){
  const t = TXN[i]; if(!t || t.rv) return;
  const btn = document.querySelector('.btn-rv[data-i="'+i+'"]');
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  const r = await rpcWrite('review_shift_txn', { p_branch:(t.branch||BRANCH), p_fh_id:t.fh_id,
                                                 p_paid: paidOf(t), p_channel: t.channel || null });
  if(r.success !== true){
    alert(r.error);
    if(btn){ btn.disabled = false; btn.textContent = 'تم ✓'; }
    return;
  }
  t.rv = { by:r.reviewed_by, at:r.reviewed_at, paid:paidOf(t), channel:t.channel||null };
  /* في تبويب البطاقات الصف بيفضل مكانه ويتقفل — من غير إعادة تحميل
     عشان الموظف ما يفقدش مكانه في القايمة وهو بيراجع ورا بعض. */
  if(VIEW==='cards') drawRows(); else render();
}
async function unreviewTxn(i){
  const t = TXN[i]; if(!t || !t.rv) return;
  if(!confirm('فكّ قفل المراجعة لهذه الحركة؟')) return;
  const r = await rpcWrite('unreview_shift_txn', { p_branch:(t.branch||BRANCH), p_fh_id:t.fh_id });
  if(r.success !== true){ alert(r.error); return; }
  delete t.rv; if(VIEW==='cards') drawRows(); else render();
}

function drawRows(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const rows=TXN.filter((t,i)=>{ t._i=i;
    if(pendOnly && !(isReviewable(t) && !t.rv)) return false;
    return (!typeFilter||t.kind===typeFilter) && (!chFilter||t.channel===chFilter) && (!userFilter||t.user_name===userFilter) &&
      (!q||((t.from||'')+' '+(t.to||'')+' '+(t.party||'')+' '+(t.visa_no||'')+' '+(t.notes||'')+' '+(t.user_name||'')).toLowerCase().includes(q)); });
  /* ⚠️ «مجموع المعروض» ده إجمالي كمان — وأسهل واحد كمان لأنه بيتجمّع
     حسب الفلتر. لازم يختفي مع باقي الإجماليات، مش العدد. */
  const sum=rows.reduce((a,t)=>a+(t.kind==='صرف'?-1:1)*(+t.amount),0);
  document.getElementById('shown').textContent =
    'المعروض: '+rows.length + (CAN_TOTALS ? ' · مجموع: '+fmt(sum)+' ج' : '');
  document.getElementById('tb').innerHTML = rows.map(t=>{
    const cls=t.kind==='صرف'?'out':(t.kind==='فيزا'?'visa':(t.kind==='توريد'?'in':'cash')); const iv=(t.kind==='فيزا');
    const lock=!!t.rv;
    const editable=(t.kind==='كاش'||t.kind==='فيزا');
    const acct = editable
      ? `<select class="e eacct" data-i="${t._i}" ${lock?'disabled':''}><option value="" ${!iv?'selected':''}>— كاش</option>${CHANNELS.map(c=>`<option ${t.channel===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`
      : esc(t.channel||'—');
    const paidCell = iv ? `<input class="e epaid${isManual(t)?'':' auto'}" data-i="${t._i}" type="text" inputmode="decimal" value="${paidOf(t)}" style="width:82px" ${lock?'disabled':''}>` : '';
    /* الكاش والصرف والتوريد مالهمش مراجعة — الفيزا بس هي اللي ممكن
       تكون اتسجّلت والفلوس ما وصلتش. */
    const rvCell = !isReviewable(t) ? '<span class="dash">—</span>'
      : lock ? `<span class="rv-ok">✓ تمت<span class="who">${esc(t.rv.by||'')}${t.rv.at?' · '+esc(t.rv.at):''}</span></span>`
               + (IS_ADMIN ? `<button class="btn-unlock" onclick="unreviewTxn(${t._i})">فتح</button>` : '')
      : `<button class="btn-rv" data-i="${t._i}" onclick="reviewTxn(${t._i})">تم ✓</button>`;
    return `<tr class="${lock?'locked':''}"><td class="rv">${rvCell}</td><td>${esc(t.time)}${t.date?`<div class="dsub">${esc(t.date)}</div>`:''}</td><td><span class="pill ${cls}">${esc(t.kind)}</span></td>`+
      `<td>${paidCell}</td>`+
      `<td class="num ${t.kind==='صرف'?'neg':'pos'}">${t.kind==='صرف'?'−':''}${fmt(t.amount)}</td>`+
      `<td class="r">${esc(t.from||'—')}</td><td class="r">${esc(t.to||'—')}</td>`+
      `<td class="r">${esc(t.user_name||'—')}</td><td class="dev">${esc(t.computer||'—')}</td>`+
      `<td class="${iv?'visa':''}">${acct}</td><td class="notes">${esc(t.notes||'')}</td></tr>`;
  }).join('') || '<tr><td colspan="11" class="state">لا توجد حركات مطابقة.</td></tr>';
  document.querySelectorAll('.eacct').forEach(s=>s.onchange=()=>{
    const t=TXN[+s.dataset.i]; const v=s.value;
    if(v){ t.kind='فيزا'; t.channel=v; if(t.paid==null) t.paid=+t.amount; if(t.manual==null) t.manual=false; } else { t.kind='كاش'; t.channel=''; }
    render();
  });
  document.querySelectorAll('.epaid').forEach(inp=>inp.onchange=()=>{
    const t=TXN[+inp.dataset.i]; const v=toNum(inp.value);
    /* ⚠️ كان الشرط `v>1`، فأي قيمة جنيه أو أقل كانت بترجع لقيمة النظام
       بصمت — سحبة بـ١ ج أو ٠.٥ ج مستحيل تتكتب. الصفر والأقل من جنيه
       قيم مشروعة؛ اللي بيرجّع للأصل هو الخانة الفاضية بس. */
    if(isFinite(v) && v>=0){
      t.paid = v;
      t.manual = Math.abs(v - (+t.amount||0)) > 0.005;   // مساوية لقيمة النظام = مش يدوية
    } else {
      t.paid = +t.amount; t.manual = false;              // فاضية = رجوع للأصل
    }
    render();
  });
}
// ═══════════ سجل الشيفتات ═══════════
let SL=[], slPage=1; const SL_PER=30;
let SLSUM={diff:0,up:0,down:0};
function dmy(s){ if(!s) return '—'; try{ return new Date(s).toLocaleDateString('ar-EG',{timeZone:'Africa/Cairo',day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return s; } }
function hm(s){ if(!s) return '—'; try{ return new Date(s).toLocaleTimeString('ar-EG',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:true}); }catch(e){ return s; } }
function showShiftLog(){
  VIEW='log';
  const pointOpts='<option value="">كل النقاط</option>'+POINTS.map(p=>`<option value="${p.cashier_id}">${esc(p.point_name)}</option>`).join('');
  /* المدى الافتراضي = الشهر الحالي (من أول الشهر لليوم) — بتوقيت
     القاهرة مش توقيت الجهاز. */
  const cairo = new Date(new Date().toLocaleString('en-US',{timeZone:'Africa/Cairo'}));
  const p=n=>String(n).padStart(2,'0');
  const toS=`${cairo.getFullYear()}-${p(cairo.getMonth()+1)}-${p(cairo.getDate())}`;
  const fromS=`${cairo.getFullYear()}-${p(cairo.getMonth()+1)}-01`;
  document.getElementById('content').innerHTML=`
    <div class="toolbar">
      <span class="flabel">النقطة</span><select id="slPt" onchange="slPage=1;loadShiftLog()">${pointOpts}</select>
      <span class="flabel">من</span><input type="date" id="slFrom" value="${fromS}" onchange="slPage=1;loadShiftLog()">
      <span class="flabel">إلى</span><input type="date" id="slTo" value="${toS}" onchange="slPage=1;loadShiftLog()">
      <span class="shown" id="slShown"></span>
      <span class="shown" id="slNet" style="background:transparent"></span>
    </div>
    <div class="tablecard"><table><thead><tr>
      <th>التاريخ</th><th>النقطة</th><th>الفترة</th><th>الرصيد الإفتتاحى</th><th>القيمة (نظام)</th><th>ق.الفترة</th><th>ق.الفترة الفعلية</th><th>زيادة/عجز</th><th>التحويل</th><th></th>
    </tr></thead><tbody id="slBody"><tr><td colspan="10" class="state">جارِ التحميل…</td></tr></tbody></table></div>
    <div class="pager" id="slPager"></div>`;
  slPage=1; loadShiftLog();
}
async function loadShiftLog(){
  VIEW='log';
  const pt=document.getElementById('slPt').value||null;
  const from=document.getElementById('slFrom').value||null, to=document.getElementById('slTo').value||null;
  document.getElementById('slBody').innerHTML='<tr><td colspan="10" class="state">جارِ التحميل…</td></tr>';
  const res=await rpc('get_shift_log',{p_branch:BRANCH, p_cashier: pt?+pt:null, p_from:from, p_to:to, p_limit:SL_PER, p_offset:(slPage-1)*SL_PER});
  SL=(res&&res.rows)||[];
  /* ⚠️ الصافي من السيرفر على **كل** الفترة المفلترة — مش جمع الصفحة
     المعروضة (٣٠ صف) اللي كان هيدّي رقم ناقص بلا ما حد ياخد باله. */
  SLSUM = { diff:Number((res&&res.total_diff)||0),
            up:Number((res&&res.total_up)||0),
            down:Number((res&&res.total_down)||0) };
  renderShiftLog((res&&res.total_count)||0);
}
function renderShiftLog(total){
  const sh=document.getElementById('slShown'); if(sh) sh.textContent='عدد الشيفتات: '+fmt(total);
  const nt=document.getElementById('slNet');
  if(nt){
    const net=SLSUM.diff, cls=net>0?'pos':(net<0?'neg':'');
    nt.innerHTML = total
      ? `صافي الفترة: <b class="${cls}">${net>0?'+':''}${fmt(net)} ج</b>`
        + ` <span style="color:var(--muted);font-weight:600">(زيادة ${fmt(SLSUM.up)} · عجز ${fmt(Math.abs(SLSUM.down))})</span>`
      : '';
  }
  const tb=document.getElementById('slBody');
  tb.innerHTML = SL.length ? SL.map(x=>{
    const dc=Number(x.diff)>=0?'pos':'neg';
    return `<tr class="logrow" data-sc="${x.sc_id}" data-c="${x.cashier_id}">
      <td>${dmy(x.closed_at)}</td><td>${esc(x.point_name||'—')}</td>
      <td style="font-size:12px">${hm(x.shift_start)} ← ${hm(x.closed_at)}</td>
      <td class="num">${fmt(x.opening)}</td><td class="num">${fmt(x.system_cash)}</td>
      <td class="num">${fmt(x.period)}</td><td class="num">${fmt(x.actual_cash)}</td>
      <td class="num ${dc}" style="font-weight:800">${Number(x.diff)>0?'+':''}${fmt(x.diff)}</td>
      <td class="num">${fmt(x.transfer)}</td><td><button class="lnk">مراجعة ›</button></td></tr>`;
  }).join('') : '<tr><td colspan="10" class="state">لا توجد شيفتات في المدى المختار.</td></tr>';
  tb.querySelectorAll('.logrow').forEach(r=>r.onclick=()=>openShiftDetail(+r.dataset.sc, +r.dataset.c));
  renderPager('slPager', Math.max(1,Math.ceil(total/SL_PER)), slPage, 'slGo');
}
function slGo(n){ slPage=n; loadShiftLog(); window.scrollTo(0,0); }
function renderPager(elId, pages, cur, goFn){
  const p=document.getElementById(elId); if(!p) return;
  if(pages<=1){ p.innerHTML=''; return; }
  let h=`<button ${cur<=1?'disabled':''} onclick="${goFn}(1)">«</button><button ${cur<=1?'disabled':''} onclick="${goFn}(${cur-1})">‹</button>`;
  const from=Math.max(1,cur-2), to=Math.min(pages,cur+2);
  for(let i=from;i<=to;i++) h+=`<button class="${i===cur?'on':''}" onclick="${goFn}(${i})">${i}</button>`;
  h+=`<button ${cur>=pages?'disabled':''} onclick="${goFn}(${cur+1})">›</button><button ${cur>=pages?'disabled':''} onclick="${goFn}(${pages})">»</button><span class="pinfo">صفحة ${cur} من ${pages}</span>`;
  p.innerHTML=h;
}
async function openShiftDetail(sc_id, cashier_id){
  VIEW='detail'; SLsc=sc_id; SLcashier=cashier_id;
  document.getElementById('content').innerHTML='<div class="state">جارِ تحميل الشيفت…</div>';
  const d=await rpc('get_shift_detail',{p_branch:BRANCH, p_cashier:cashier_id, p_sc_id:sc_id});
  if(!d || d.error){ document.getElementById('content').innerHTML='<div class="state">'+esc((d&&d.error)||'تعذّر التحميل')+'</div>'; return; }
  renderShiftDetail(d);
}
function renderShiftDetail(d){
  const users=(d.users||[]).join('، ');
  /* ⚠️ «زيادة/عجز» بتتحسب هنا مش من الدالة: `d.diff` لسه بالمعادلة
     القديمة (الفعلية − القيمة) اللي ماكانتش بتطابق eplus. المعادلة
     الصح = (القيمة − الإفتتاحى) − الفعلية، وكل عناصرها في الرد أصلًا.
     (get_shift_log اتصلّحت في القاعدة — migrate_159.) */
  const _period = Number(d.system_cash||0) - Number(d.opening||0);
  const _gap    = Math.round(_period - Number(d.actual_cash||0));
  const diffCls = _gap>=0?'g':'r';
  const chips=(d.visa_by_channel||[]).map(c=>`<span class="pill visa" style="margin:2px">${esc(c.channel)} ${fmt(c.total)} (${c.cnt})</span>`).join('')||'—';
  /* نفس فلاتر الشيفت الحالي جوّه المراجعة (طلب المالك): بحث + نوع +
     مستخدم، عشان مراجعة شيفت مقفول تبقى بنفس أدوات الشيفت المفتوح. */
  DT = (d.transactions||[]).map(t=>({...t}));
  dtType=null; dtUser=null; dtSearch='';
  const dtUsers=[...new Set(DT.map(t=>t.user_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  document.getElementById('content').innerHTML=`
    <div style="margin-bottom:10px"><button class="lnk" onclick="showShiftLog()">‹ رجوع للسجل</button></div>
    <div class="meta">
      <div class="it"><span class="k">النقطة</span><b>${esc(d.point)}</b></div>
      <div class="it"><span class="k">الفترة</span><b>${dmy(d.shift_start)} · ${hm(d.shift_start)} ← ${hm(d.closed_at)}</b></div>
      <div class="it"><span class="k">عدد المعاملات</span><b>${fmt(d.count)}</b></div>
      <div class="users" title="${esc(users)}">👤 ${esc(users||'—')}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">الرصيد الإفتتاحى</div><div class="val">${fmt(d.opening)} <small>ج</small></div></div>
      <div class="kpi"><div class="lbl">القيمة (كاش النظام)</div><div class="val">${fmt(d.system_cash)} <small>ج</small></div></div>
      <div class="kpi"><div class="lbl">ق.الفترة</div><div class="val">${fmt(_period)} <small>ج</small></div>
        <div class="formula">القيمة − الإفتتاحى</div></div>
      <div class="kpi"><div class="lbl">ق.الفترة الفعلية</div><div class="val">${fmt(d.actual_cash)} <small>ج</small></div></div>
      <div class="kpi ${diffCls}"><div class="lbl">زيادة/عجز</div><div class="val">${_gap>0?'+':''}${fmt(_gap)} <small>ج</small></div>
        <div class="formula">ق.الفترة − الفعلية · محوّل للخزنة: ${fmt(d.transfer)} ج</div></div>
      <div class="kpi v"><div class="lbl">إجمالي الفيزا</div><div class="val">${fmt(d.visa_in)} <small>ج</small></div><div class="formula">${chips}</div></div>
    </div>
    <div class="meta" style="font-size:12px">
      <div class="it"><span class="k">كاش الحركات</span><b>${fmt(d.cash_in)}</b></div>
      <div class="it"><span class="k">صرف</span><b class="neg">−${fmt(d.sarf)}</b></div>
      <div class="it"><span class="k">توريد</span><b>${fmt(d.transfer_in)}</b></div>
      <div class="it" style="color:var(--muted)">الأرقام فوق من تقفيل eplus؛ قائمة الحركات للمراجعة</div>
    </div>
    <div class="toolbar">
      <input type="search" id="dq" placeholder="🔎 بحث بالطرف / الملاحظة / المستخدم…" oninput="onDetailSearch()">
      <span class="flabel">النوع:</span>
      ${['كاش','فيزا','صرف','توريد'].map(t=>`<button class="chip dtp" data-t="${t}">${t}</button>`).join('')}
      <span class="flabel">المستخدم:</span>
      <select id="dtUserSel" class="usel"><option value="">الكل</option>${dtUsers.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join('')}</select>
      <span class="shown" id="dtShown"></span>
    </div>
    <div class="tablecard"><table><thead><tr>
      <th>الوقت</th><th>النوع</th><th>قيمة المدفوع</th><th>القيمة</th><th class="r">من</th><th class="r">الى</th><th class="r">المستخدم</th><th>الجهاز</th><th>الحساب</th><th class="r">ملاحظات</th>
    </tr></thead><tbody id="dtb"></tbody></table></div>`;

  document.querySelectorAll('.chip.dtp').forEach(c=>c.onclick=()=>{
    dtType=(dtType===c.dataset.t?null:c.dataset.t);
    document.querySelectorAll('.chip.dtp').forEach(x=>x.classList.toggle('active',x.dataset.t===dtType));
    drawDetailRows();
  });
  const dus=document.getElementById('dtUserSel');
  if(dus) dus.onchange=()=>{ dtUser=dus.value||null; drawDetailRows(); };
  drawDetailRows();
}

/* ── فلاتر مراجعة الشيفت المقفول ─────────────────────────────── */
let DT=[], dtType=null, dtUser=null, dtSearch='', dtTimer=null;
function onDetailSearch(){
  clearTimeout(dtTimer);
  dtTimer=setTimeout(()=>{ const e=document.getElementById('dq'); dtSearch=e?e.value:''; drawDetailRows(); }, 280);
}
function drawDetailRows(){
  const tb=document.getElementById('dtb'); if(!tb) return;
  const q=(dtSearch||'').trim().toLowerCase();
  const rows=DT.filter(t=>
    (!dtType||t.kind===dtType) && (!dtUser||t.user_name===dtUser) &&
    (!q||((t.from||'')+' '+(t.to||'')+' '+(t.party||'')+' '+(t.visa_no||'')+' '+(t.notes||'')+' '+(t.user_name||'')).toLowerCase().includes(q)));
  const sum=rows.reduce((a,t)=>a+(t.kind==='صرف'?-1:1)*(+t.amount||0),0);
  const sh=document.getElementById('dtShown');
  if(sh) sh.textContent='المعروض: '+rows.length + (CAN_TOTALS ? ' · مجموع: '+fmt(sum)+' ج' : '');
  tb.innerHTML = rows.length ? rows.map(t=>{
    const cls=t.kind==='صرف'?'out':(t.kind==='فيزا'?'visa':(t.kind==='توريد'?'in':'cash'));
    return `<tr><td>${esc(t.time)}</td><td><span class="pill ${cls}">${esc(t.kind)}</span></td>`+
      `<td class="num" style="${t.kind==='فيزا'&&!isManual(t)?'color:var(--red)':''}">${t.kind==='فيزا'?fmt(paidOf(t)):''}</td>`+
      `<td class="num ${t.kind==='صرف'?'neg':'pos'}">${t.kind==='صرف'?'−':''}${fmt(t.amount)}</td>`+
      `<td class="r">${esc(t.from||'—')}</td><td class="r">${esc(t.to||'—')}</td>`+
      `<td class="r">${esc(t.user_name||'—')}</td><td class="dev">${esc(t.computer||'—')}</td>`+
      `<td>${esc(t.channel||'—')}</td><td class="notes">${esc(t.notes||'')}</td></tr>`;
  }).join('') : '<tr><td colspan="10" class="state">لا توجد حركات مطابقة.</td></tr>';
}
window.addEventListener('DOMContentLoaded', init);
</script>
