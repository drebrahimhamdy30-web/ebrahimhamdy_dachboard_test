<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الشيفت الحالي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  :root{--teal:#0d9488;--teal-d:#0f766e;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--green:#059669;--red:#dc2626;}
  *{box-sizing:border-box} body{font-family:'Cairo',sans-serif;margin:0;background:var(--bg);color:var(--ink);padding:18px}
  .wrap{max-width:1320px;margin:0 auto}
  header.rpt{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--teal);padding-bottom:12px;margin-bottom:14px}
  header.rpt h1{margin:0;font-size:22px;font-weight:800} header.rpt .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,input,button{font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  button{cursor:pointer} button:hover{border-color:var(--teal)}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{font-size:15px;font-weight:700;padding:9px 22px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
  .tab:hover{border-color:var(--teal)} .tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  .ptbar{display:flex;gap:22px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 18px;margin-bottom:12px}
  .ptbar>div{display:flex;flex-direction:column;gap:3px} .ptbar .users{margin-inline-start:auto;max-width:420px}
  .ptbar .k{font-size:12px;color:var(--muted);font-weight:700} .ptbar b{font-size:15px;font-weight:800}
  .kpis{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--teal)}
  .kpi.g::before{background:var(--green)}.kpi.r::before{background:var(--red)}.kpi.v::before{background:#8b5cf6}
  .kpi .lbl{color:var(--muted);font-size:13px;font-weight:700;margin-bottom:6px}
  .kpi .val{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums} .kpi .val small{font-size:14px;color:var(--muted)}
  .kpi.big .val{font-size:34px} .kpi.r .val{color:var(--red)} .kpi.g .val{color:var(--green)} .kpi.v .val{color:#7c3aed}
  .kpi .formula{margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:700} .kpi .formula span{font-weight:400;font-size:11px;margin:0 2px}
  .vchs{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .vch{font-size:12px;background:#f3e8ff;color:#6b21a8;border-radius:8px;padding:3px 10px;font-weight:600;cursor:pointer} .vch b{font-weight:800} .vch i{font-style:normal;font-size:11px;color:#9333ea}
  .vch.on{background:#6b21a8;color:#fff}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:12px}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .shown{margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--teal-d);background:#f0fdfa;border:1px solid #99f6e4;border-radius:9px;padding:8px 14px}
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f8fafc;color:#475569;font-weight:700;font-size:12px;position:sticky;top:0}
  td.r,th.r{text-align:right} td.notes{text-align:right;white-space:normal;color:var(--muted);max-width:220px} td.dev{color:var(--muted);font-size:12px} td.visa{background:#faf5ff}
  tbody tr:nth-child(even){background:#fafbfc} tbody tr:hover{background:#f0fdfa}
  .num{font-variant-numeric:tabular-nums;font-weight:700} .pos{color:var(--green)}.neg{color:var(--red)}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
  .pill.cash{background:#e0f2fe;color:#075985}.pill.visa{background:#f3e8ff;color:#6b21a8}.pill.out{background:#fee2e2;color:#991b1b}
  .state{padding:40px;text-align:center;color:var(--muted);font-weight:600}
  @media(max-width:760px){.kpis{grid-template-columns:1fr}body{padding:12px}}
</style>
<script src="config.js?v=20261011"></script>
<script src="session.js?v=20261011"></script>
<script src="branches.js?v=20261011"></script>
<script src="pages.js?v=20261011"></script>
<script src="brand.js?v=20261011"></script>
<script src="api.js?v=20261011"></script>
</head>
<body>
<div class="wrap">
  <header class="rpt">
    <div><h1>تفاصيل الشيفت الحالي</h1><div class="sub" id="sub">كل الحركات من آخر تقفيل · لحظي</div></div>
    <div class="ctl">
      <select id="brSel" style="display:none"></select>
      <button id="refreshBtn">↻ تحديث</button>
    </div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="state">جارِ التحميل…</div></div>
</div>

<script>
const BR = { mamora:'المعمورة', san:'سان ستيفانو', bishr:'سيدي بشر', seyouf:'سيوف' };
const BR_REV = Object.fromEntries(Object.entries(BR).map(([k,v])=>[v,k]));
const CHANNELS_ALL = ['instapay','paymob 1','paymob 7','orange cash','fawry313','fawry 6008','vodafon cash'];
const fmt = n => (n<0?'−':'') + Math.abs(Math.round(Number(n)||0)).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function rpc(fn, body){
  try{ const r=await fetch(SB_URL_API+'/rest/v1/rpc/'+fn,{ method:'POST',
    headers:{'Content-Type':'application/json', apikey:SB_ANON_API, Authorization:'Bearer '+SB_ANON_API}, body:JSON.stringify(body||{}) });
    if(!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
let BRANCH='mamora', POINTS=[], CUR_POINT=null, SHIFT=null, chFilter=null;

function roleDefaultPoint(points){
  // الكاشير يشوف الكاشير، غير كده نقطة البيع
  let role=''; try{ role=(typeof Session!=='undefined'&&Session.role)?Session.role():''; }catch(e){}
  if(/cash|كاشير/i.test(role)){ const p=points.find(x=>/كاشير/.test(x.point_name)); if(p) return p.cashier_id; }
  const pv=points.find(x=>/نقطة/.test(x.point_name)); return pv?pv.cashier_id:(points[0]&&points[0].cashier_id);
}

async function init(){
  // فرع المستخدم + لو بيشوف كل الفروع يبان المحدّد
  let bname='', seesAll=false;
  try{ bname=(typeof Session!=='undefined'&&Session.branch)?Session.branch():''; }catch(e){}
  try{ seesAll=(typeof Session!=='undefined'&&Session.seesAllBranches)?await Session.seesAllBranches():false; }catch(e){}
  if(BR_REV[bname]) BRANCH=BR_REV[bname];
  const sel=document.getElementById('brSel');
  if(seesAll || !BR_REV[bname]){
    sel.style.display=''; sel.innerHTML=Object.entries(BR).map(([k,v])=>`<option value="${k}" ${k===BRANCH?'selected':''}>${v}</option>`).join('');
    sel.onchange=()=>{ BRANCH=sel.value; loadPoints(); };
  }
  document.getElementById('refreshBtn').onclick=()=>loadShift(true);
  await loadPoints();
  setInterval(()=>{ if(CUR_POINT) loadShift(true); }, 60000);
}
async function loadPoints(){
  document.getElementById('content').innerHTML='<div class="state">جارِ التحميل…</div>';
  POINTS = (await rpc('get_shift_points',{p_branch:BRANCH})) || [];
  const tabs=document.getElementById('tabs');
  if(!POINTS.length){ tabs.innerHTML=''; document.getElementById('content').innerHTML='<div class="state">لا توجد نقاط بيع/شيفتات لهذا الفرع بعد.</div>'; return; }
  CUR_POINT = roleDefaultPoint(POINTS);
  tabs.innerHTML = POINTS.map(p=>`<button class="tab ${p.cashier_id===CUR_POINT?'active':''}" data-c="${p.cashier_id}">${esc(p.point_name)}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ CUR_POINT=+b.dataset.c; chFilter=null; tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b)); loadShift(); });
  loadShift();
}
async function loadShift(silent){
  if(!silent) document.getElementById('content').innerHTML='<div class="state">جارِ التحميل…</div>';
  SHIFT = await rpc('get_current_shift',{p_branch:BRANCH, p_cashier:CUR_POINT});
  render();
}
function render(){
  const s=SHIFT; if(!s){ document.getElementById('content').innerHTML='<div class="state">تعذّر التحميل.</div>'; return; }
  const txns=(s.transactions||[]).filter(t=> !chFilter || t.channel===chFilter);
  const shownSum = txns.reduce((a,t)=>a+(t.is_sarf?-1:1)*(Number(t.amount)||0),0);
  const startTxt = s.shift_start ? new Date(s.shift_start).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
  const chips=(s.visa_by_channel||[]).map(c=>`<span class="vch ${chFilter===c.channel?'on':''}" data-ch="${esc(c.channel)}">${esc(c.channel)} <b>${fmt(c.total)}</b> <i>(${c.cnt})</i></span>`).join('')||'<span class="vch">—</span>';
  const rows=txns.map(t=>{
    const cls=t.is_sarf?'out':(t.kind==='فيزا'?'visa':'cash'); const iv=t.kind==='فيزا';
    return `<tr><td>${esc(t.time)}</td><td><span class="pill ${cls}">${esc(t.kind)}</span></td>`+
      `<td class="${iv?'visa':''}">${esc(t.channel||'—')}</td><td class="r">${esc(t.party||'—')}</td><td class="r">${esc(t.user_name||'—')}</td>`+
      `<td class="num ${t.is_sarf?'neg':'pos'}">${t.is_sarf?'−':''}${fmt(t.amount)}</td><td class="dev">${esc(t.computer||'—')}</td><td class="notes">${esc(t.notes||'')}</td></tr>`;
  }).join('') || '<tr><td colspan="8" class="state">لا توجد حركات في الشيفت الحالي.</td></tr>';
  const netCls=(Number(s.net_cash)||0)<0?'r':'g';
  document.getElementById('content').innerHTML = `
    <div class="ptbar">
      <div><span class="k">النقطة</span><b>${esc(s.point)}</b></div>
      <div><span class="k">بداية الشيفت</span><b>${startTxt}</b></div>
      <div><span class="k">بداية الفترة (الدرج)</span><b>${fmt(s.opening)} ج</b></div>
      <div><span class="k">عدد المعاملات</span><b>${s.count||0}</b></div>
      <div class="users"><span class="k">المستخدمون</span><b>${(s.users||[]).map(esc).join('، ')||'—'}</b></div>
    </div>
    <div class="kpis">
      <div class="kpi big ${netCls}"><div class="lbl">صافي الكاش المطلوب تسليمه</div><div class="val">${fmt(s.net_cash)} <small>ج</small></div>
        <div class="formula">${fmt(s.opening)} <span>بداية</span> + ${fmt(s.cash_in)} <span>كاش</span> − ${fmt(s.sarf)} <span>صرف</span></div></div>
      <div class="kpi v"><div class="lbl">إجمالي الفيزا (للمطابقة مع البنك)</div><div class="val">${fmt(s.visa_in)} <small>ج</small></div>
        <div class="vchs" id="vchs">${chips}</div></div>
    </div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="🔎 بحث بالطرف / الملاحظة / المستخدم…">
      <span class="shown" id="shown">المعروض: ${txns.length} · مجموع: ${fmt(shownSum)} ج</span>
    </div>
    <div class="tablecard"><table><thead><tr>
      <th>الوقت</th><th>النوع</th><th>الحساب</th><th class="r">الطرف</th><th class="r">المستخدم</th><th>القيمة</th><th>الجهاز</th><th class="r">ملاحظات</th>
    </tr></thead><tbody id="tb">${rows}</tbody></table></div>`;
  document.querySelectorAll('.vch[data-ch]').forEach(c=>c.onclick=()=>{ chFilter = (chFilter===c.dataset.ch?null:c.dataset.ch); render(); });
  const q=document.getElementById('q'); if(q) q.oninput=()=>filterRows();
}
function filterRows(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const txns=(SHIFT.transactions||[]).filter(t=> (!chFilter||t.channel===chFilter) && (!q||((t.party||'')+' '+(t.notes||'')+' '+(t.user_name||'')).toLowerCase().includes(q)));
  const sum=txns.reduce((a,t)=>a+(t.is_sarf?-1:1)*(Number(t.amount)||0),0);
  document.getElementById('shown').textContent='المعروض: '+txns.length+' · مجموع: '+fmt(sum)+' ج';
  document.getElementById('tb').innerHTML = txns.map(t=>{
    const cls=t.is_sarf?'out':(t.kind==='فيزا'?'visa':'cash'); const iv=t.kind==='فيزا';
    return `<tr><td>${esc(t.time)}</td><td><span class="pill ${cls}">${esc(t.kind)}</span></td>`+
      `<td class="${iv?'visa':''}">${esc(t.channel||'—')}</td><td class="r">${esc(t.party||'—')}</td><td class="r">${esc(t.user_name||'—')}</td>`+
      `<td class="num ${t.is_sarf?'neg':'pos'}">${t.is_sarf?'−':''}${fmt(t.amount)}</td><td class="dev">${esc(t.computer||'—')}</td><td class="notes">${esc(t.notes||'')}</td></tr>`;
  }).join('') || '<tr><td colspan="8" class="state">لا توجد حركات مطابقة.</td></tr>';
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
