<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إدارة المخزون - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .top-panel { margin-bottom:18px; }
    .filter-panel { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px; }
    .panel-title { font-size:0.85rem;font-weight:700;color:var(--text-secondary);margin-bottom:12px;display:flex;align-items:center;gap:6px; }

    /* صفوف الفلتر */
    .filter-row { display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px; }
    .filter-row:last-child { margin-bottom:0; }
    .filter-label { font-size:0.72rem;font-weight:700;color:var(--text-secondary);margin-bottom:4px;display:block; }
    .mini-field { display:flex;flex-direction:column; }
    .mini-field input { width:90px;text-align:center;padding:7px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:0.8rem;outline:none; }
    .mini-field input:focus { border-color:var(--accent); }

    /* التابات */
    .tabs-bar { display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap; }
    .tab-btn { padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface-3);color:var(--text-secondary);font-size:0.85rem;cursor:pointer;transition:all 0.2s;font-family:var(--font); }
    .tab-btn.active { background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700; }

    /* بانل تحديث الفروع */
    .branch-updates { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px; }
    .branch-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 12px;font-size:0.76rem;display:flex;align-items:center;gap:10px; }
    .branch-card .b-name { font-weight:700;color:var(--text-secondary); }
    .branch-card .b-time { color:var(--text-muted);font-size:0.7rem; }
    .branch-card .b-time.stale { color:var(--danger);font-weight:700; }
    .btn-refresh-branch { padding:3px 9px;font-size:0.7rem;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent-dark);cursor:pointer;white-space:nowrap; }
    .btn-refresh-branch:hover { background:var(--accent);color:#fff; }

    /* جداول النتائج */
    .res-wrap { overflow-x:auto; }
    .res-table { width:100%;border-collapse:collapse;min-width:720px; }
    .res-table th { background:var(--primary);color:#fff;padding:9px 8px;font-size:0.72rem;font-weight:700;text-align:center;white-space:nowrap; }
    .res-table td { padding:7px 8px;font-size:0.78rem;border-bottom:1px solid var(--surface-3);text-align:center;vertical-align:middle; }
    .res-table tr:hover td { background:var(--surface-2); }
    .res-table .name-cell { text-align:right; }
    .price-high { color:var(--success);font-weight:700; }
    .price-low { color:var(--danger);font-weight:700; }
    .surplus-val { color:var(--success);font-weight:700; }
    /* خلية الفرع المنظمة: 3 أعمدة (رصيد/معدل/فائض) كل واحد فوقه بيانه */
    .branch-cell { display:flex;justify-content:space-around;gap:4px;min-width:150px; }
    .bc-col { display:flex;flex-direction:column;align-items:center;gap:2px;flex:1; }
    .bc-lbl { font-size:0.6rem;color:var(--text-muted);font-weight:600; }
    .bc-num { font-size:0.85rem;font-weight:700; }
    /* أزرار نوع الأصناف (الكل/أدوية/تجميل) */
    .type-toggle { display:flex;gap:6px; }
    .type-btn { flex:1;padding:8px 6px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface-3);color:var(--text-secondary);font-family:var(--font);font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.15s; }
    .type-btn:hover { border-color:var(--accent); }
    .type-btn.active { background:var(--primary);color:#fff;border-color:var(--primary); }
    .zero-stock { color:var(--text-muted); }
    .badge-med { display:inline-block;background:#dbeafe;color:#1e40af;border-radius:20px;padding:1px 7px;font-size:0.62rem;font-weight:700; }
    .badge-cos { display:inline-block;background:#fce7f3;color:#9d174d;border-radius:20px;padding:1px 7px;font-size:0.62rem;font-weight:700; }

    .summary-bar { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px; }
    .summary-item { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 14px;font-size:0.8rem; }
    .summary-item b { color:var(--accent-dark);font-size:0.95rem; }
    .loading-overlay { text-align:center;padding:60px;color:var(--text-muted); }

    .pagination { display:flex;gap:6px;align-items:center;justify-content:center;margin-top:16px; }
    .page-btn { padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-3);color:var(--text-secondary);cursor:pointer;font-size:0.8rem;font-family:var(--font); }
    .page-btn:hover { background:var(--primary);color:#fff;border-color:var(--primary); }
    .page-btn:disabled { opacity:0.4;cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">

    <div class="top-panel">
      <div class="filter-panel">
        <div class="panel-title"><i class="fas fa-filter" style="color:var(--accent);"></i> بحث وفلتر</div>

        <!-- صف: بحث + نوع الأصناف -->
        <div class="filter-row">
          <div style="flex:1;min-width:200px;">
            <span class="filter-label">بحث</span>
            <div class="field-icon-wrap">
              <i class="fas fa-search field-icon"></i>
              <input type="text" id="search-input" class="form-input" placeholder="اسم أو كود..." oninput="onFilterChange()" style="padding-right:34px;">
            </div>
          </div>
          <div id="type-wrap">
            <span class="filter-label">نوع الأصناف</span>
            <div class="type-toggle" id="type-toggle">
              <button class="type-btn active" data-type="all" onclick="setItemType('all', this)">🧫 الكل</button>
              <button class="type-btn"        data-type="med" onclick="setItemType('med', this)">💊 أدوية</button>
              <button class="type-btn"        data-type="cos" onclick="setItemType('cos', this)">💄 تجميل</button>
            </div>
          </div>
        </div>

        <!-- صف: إعدادات الفائض/الاحتياج + الفرع المستهدف -->
        <div class="filter-row" id="need-config-wrap">
          <div class="mini-field">
            <span class="filter-label">أقل رصيد</span>
            <input type="number" id="min-stock" value="1" min="0" step="1" oninput="onFilterChange()">
          </div>
          <div class="mini-field">
            <span class="filter-label">فترة الفائض (يوم)</span>
            <input type="number" id="surplus-days" value="60" min="1" step="1" oninput="onFilterChange()">
          </div>
          <div class="mini-field">
            <span class="filter-label">فترة الاحتياج (يوم)</span>
            <input type="number" id="need-days" value="30" min="1" step="1" oninput="onFilterChange()">
          </div>
          <div class="mini-field">
            <span class="filter-label">يظهر الفائض ≥</span>
            <input type="number" id="min-surplus" value="2" min="1" step="1" oninput="onFilterChange()">
          </div>
          <div id="branch-select-wrap" style="flex:1;min-width:160px;">
            <span class="filter-label">الفرع المستهدف</span>
            <select id="target-branch" class="form-select" onchange="onFilterChange()">
              <option value="mamora">المعمورة</option>
              <option value="san">سان ستيفانو</option>
              <option value="bishr">سيدى بشر</option>
            </select>
          </div>
        </div>

        <!-- صف: الأزرار + بطاقات الفروع (في تاب الأسعار) -->
        <div class="filter-row" style="align-items:center;">
          <button class="btn btn-primary" style="padding:8px 22px;font-size:0.85rem;" onclick="calculate()">
            <i class="fas fa-calculator"></i> احسب
          </button>
          <button class="btn" id="excel-btn" style="background:#16a34a;color:#fff;padding:8px 16px;font-size:0.85rem;" onclick="exportExcel()">
            <i class="fas fa-file-excel"></i> Excel
          </button>
          <div id="branch-updates-inline" style="display:none;flex:1;gap:8px;flex-wrap:wrap;justify-content:flex-start;"></div>
        </div>
      </div>
    </div>

    <!-- بانل آخر تحديث للفروع -->
    <div class="branch-updates" id="branch-updates"></div>
    <span id="branch-updates-anchor"></span>

    <!-- التابات -->
    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="prices" onclick="switchTab('prices', this)">💲 فرق الأسعار بين الفروع</button>
      <button class="tab-btn" data-tab="transfer" onclick="switchTab('transfer', this)">🔄 تحويل بين الفروع</button>
      <button class="tab-btn" data-tab="missing" onclick="switchTab('missing', this)">📭 ناقص من فرع</button>
    </div>

    <!-- النتائج -->
    <div class="card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-boxes-stacked"></i> <span id="result-title">اختلاف الأسعار بين الفروع</span></div>
        <div id="result-count" style="font-size:0.8rem;color:var(--text-muted);"></div>
      </div>
      <div id="result-container"><div class="loading-overlay">اضغط "احسب" للبدء</div></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script>
    const INV_URL = 'https://agent.ebrahimhamdy.com/webhook/inventory';

    // webhook تشغيل سحب الرصيد — يقرأ ?branch= في n8n عبر Switch node.
    // غيّر الاسم 'refresh_stock' لو سمّيته باسم آخر في n8n.
    const REFRESH_WEBHOOK = 'https://agent.ebrahimhamdy.com/webhook/refresh_stock';
    const REFRESH_URLS = {
      mamora: REFRESH_WEBHOOK,
      san:    REFRESH_WEBHOOK,
      bishr:  REFRESH_WEBHOOK
    };

    const BRANCHES = {
      mamora: 'المعمورة',
      san:    'سان ستيفانو',
      bishr:  'سيدى بشر'
    };
    const STALE_HOURS = 12; // لو آخر تحديث أقدم من كده يتعلّم بالأحمر

    var stockMamora=[], stockSan=[], stockBishr=[], salesData=[];
    var dataLoaded=false;
    var allResults=[], filteredResults=[];
    var currentTab='prices';
    var currentPage=1;
    const PAGE_SIZE=30;
    var branchUpdates={mamora:null, san:null, bishr:null};

    // ===== حفظ/استرجاع الإعدادات =====
    const LS_KEY='invmgmt_settings';
    function saveSettings(){
      var s={
        itemType: itemType,
        search: document.getElementById('search-input').value,
        minStock: document.getElementById('min-stock').value,
        surplusDays: document.getElementById('surplus-days').value,
        needDays: document.getElementById('need-days').value,
        minSurplus: document.getElementById('min-surplus').value,
        targetBranch: document.getElementById('target-branch').value,
        tab: currentTab,
        page: currentPage
      };
      localStorage.setItem(LS_KEY, JSON.stringify(s));
    }
    function loadSettings(){
      var raw=localStorage.getItem(LS_KEY);
      if(!raw) return;
      try {
        var s=JSON.parse(raw);
        if(s.itemType){
          itemType=s.itemType;
          document.querySelectorAll('.type-btn').forEach(function(b){
            b.classList.toggle('active', b.dataset.type===itemType);
          });
        }
        if(s.search!=null) document.getElementById('search-input').value=s.search;
        if(s.minStock!=null)    document.getElementById('min-stock').value=s.minStock;
        if(s.surplusDays!=null) document.getElementById('surplus-days').value=s.surplusDays;
        if(s.needDays!=null)    document.getElementById('need-days').value=s.needDays;
        if(s.minSurplus!=null)  document.getElementById('min-surplus').value=s.minSurplus;
        if(s.targetBranch) document.getElementById('target-branch').value=s.targetBranch;
        if(s.tab) currentTab=s.tab;
        if(s.page) currentPage=s.page;
        // تحديث الواجهة حسب التاب المحفوظ
        document.querySelectorAll('.tab-btn').forEach(function(b){
          b.classList.toggle('active', b.dataset.tab===currentTab);
        });
        updateTabUI();
      } catch(e){ console.log('loadSettings error', e); }
    }

    var hasCalculated=false; // هل ضغط المستخدم "احسب" مرة على الأقل؟
    var itemType='all';      // all | med | cos

    function onFilterChange(){
      currentPage=1;
      saveSettings();
      if(hasCalculated) applyAndRender(); // لا نعرض/نعيد ترتيب قبل أول حساب
    }
    function setItemType(t, btn){
      itemType=t;
      currentPage=1;
      document.querySelectorAll('.type-btn').forEach(function(b){b.classList.remove('active');});
      if(btn) btn.classList.add('active');
      saveSettings();
      if(hasCalculated) calculate(); // إعادة الحساب فقط لو سبق وحسبنا
    }

    // ===== تشغيل =====
    checkAuth().then(function(user){
      if(user){
        loadSettings();
        updateTabUI();
        loadBranchUpdatesOnly(); // خفيف: آخر تحديث للفروع فقط
        document.getElementById('result-container').innerHTML='<div class="loading-overlay">اضغط "احسب" لعرض النتائج</div>';
      }
    });

    // عند فتح الصفحة: نحمّل آخر تحديث للفروع فقط (خفيف) — بدون جداول المخزون ولا حساب
    async function loadBranchUpdatesOnly(){
      // محاولة استخدام type خفيف يرجّع آخر تحديث لكل فرع
      try {
        var res = await fetch(INV_URL+'?type=branch_updates');
        var raw = await res.json();
        var rows = Array.isArray(raw) ? raw : (raw.data||[]);
        if(rows && rows.length){
          rows.forEach(function(row){
            var b = String(row.branch||'').trim();
            var u = row.updatedAt||row.updated_at||row.updated||null;
            var t = u ? new Date(u).getTime() : null;
            if(b && branchUpdates.hasOwnProperty(b)) branchUpdates[b]= (t && !isNaN(t)) ? t : null;
          });
          renderBranchUpdates();
          return; // نجح التحميل الخفيف
        }
      } catch(e){ /* غير متاح — ننتقل للبديل */ }

      // بديل: لو الـ type الخفيف غير موجود، نجيب الجداول الكاملة لمعرفة آخر تحديث فقط
      // (يحدث مرة واحدة عند الفتح، ونحتفظ بالبيانات لاستخدامها وقت "احسب" بدون إعادة جلب)
      await loadStockData(true);
    }

    // تحميل جداول المخزون الكبيرة + المبيعات (يُستدعى عند "احسب" أو كبديل)
    var stockLoaded=false;
    async function loadStockData(silent){
      if(stockLoaded) return true; // محمّلة بالفعل، لا نكرر
      if(!silent) document.getElementById('result-container').innerHTML='<div class="loading-overlay">⏳ جاري تحميل البيانات...</div>';
      try {
        var r = await Promise.all([
          fetch(INV_URL+'?type=stock_mamora_all').then(function(x){return x.json();}),
          fetch(INV_URL+'?type=stock_san_all').then(function(x){return x.json();}),
          fetch(INV_URL+'?type=stock_bishr_all').then(function(x){return x.json();}),
          fetch(INV_URL+'?type=sales_monthly').then(function(x){return x.json();})
        ]);
        stockMamora=Array.isArray(r[0])?r[0]:(r[0].data||[]);
        stockSan   =Array.isArray(r[1])?r[1]:(r[1].data||[]);
        stockBishr =Array.isArray(r[2])?r[2]:(r[2].data||[]);
        salesData  =Array.isArray(r[3])?r[3]:(r[3].data||[]);
        dataLoaded=true;
        stockLoaded=true;
        computeBranchUpdates();
        renderBranchUpdates();
        return true;
      } catch(e){
        if(!silent) document.getElementById('result-container').innerHTML='<div class="loading-overlay" style="color:var(--danger);">❌ فشل التحميل</div>';
        return false;
      }
    }

    // ===== آخر تحديث للفروع =====
    function latestUpdate(arr){
      var max=null;
      arr.forEach(function(it){
        var u=it.updated_at||it.updatedAt||it.updated||null;
        if(!u) return;
        var t=new Date(u).getTime();
        if(!isNaN(t) && (max===null || t>max)) max=t;
      });
      return max;
    }
    function computeBranchUpdates(){
      branchUpdates.mamora=latestUpdate(stockMamora);
      branchUpdates.san   =latestUpdate(stockSan);
      branchUpdates.bishr =latestUpdate(stockBishr);
    }
    function timeAgo(ts){
      if(!ts) return 'غير معروف';
      var diff=Date.now()-ts;
      var mins=Math.floor(diff/60000);
      if(mins<1) return 'الآن';
      if(mins<60) return 'منذ '+mins+' دقيقة';
      var hrs=Math.floor(mins/60);
      if(hrs<24) return 'منذ '+hrs+' ساعة';
      var days=Math.floor(hrs/24);
      return 'منذ '+days+' يوم';
    }
    function renderBranchUpdates(){
      var wrap=document.getElementById('branch-updates');
      var html='';
      Object.keys(BRANCHES).forEach(function(key){
        var ts=branchUpdates[key];
        var stale = !ts || (Date.now()-ts > STALE_HOURS*3600000);
        html+='<div class="branch-card">'+
          '<span class="b-name">'+BRANCHES[key]+'</span>'+
          '<span class="b-time '+(stale?'stale':'')+'">'+(stale?'⚠️ ':'🟢 ')+timeAgo(ts)+'</span>'+
          '<button class="btn-refresh-branch" onclick="refreshBranch(\''+key+'\')"><i class="fas fa-sync-alt"></i> تحديث</button>'+
        '</div>';
      });
      wrap.innerHTML=html;
    }
    async function refreshBranch(key){
      var url=REFRESH_URLS[key];
      if(!url){
        alert('رابط تشغيل سحب رصيد '+BRANCHES[key]+' غير مضبوط بعد.');
        return;
      }
      if(!confirm('سيتم تشغيل سحب رصيد '+BRANCHES[key]+' من جديد.\nقد يستغرق دقائق. متابعة؟')) return;
      try {
        await fetch(url + (url.indexOf('?')>-1 ? '&' : '?') + 'branch=' + encodeURIComponent(key));
        alert('✅ تم إرسال أمر تحديث '+BRANCHES[key]+'.\nأعد تحميل الصفحة بعد دقائق لرؤية الأرصدة الجديدة.');
      } catch(e){ alert('❌ فشل إرسال أمر التحديث'); }
    }

    function r1(n){ return Math.round(n*10)/10; }

    // ===== بناء خريطة موحّدة للأصناف =====
    // كل صنف: code, name, company, unit, isMedicine, و لكل فرع: {stock, price, avg, active, target}
    function buildItemsMap(){
      var map={};

      function addStock(arr, branch){
        arr.forEach(function(item){
          var code=String(item.itm_code||'').trim();
          if(!code) return;
          if(!map[code]){
            map[code]={
              code:code,
              name:item.itm_name_ar||'',
              company:item.Company_Name_Ar||'',
              unit:item.u_name_big||'',
              isMedicine: String(item.itm_ismedicine||'0').trim()!=='0',
              mamora:{stock:0,price:0,has:false,avg:0,active:0,target:0},
              san:   {stock:0,price:0,has:false,avg:0,active:0,target:0},
              bishr: {stock:0,price:0,has:false,avg:0,active:0,target:0}
            };
          }
          // لو الاسم فاضي خده من أي فرع
          if(!map[code].name && item.itm_name_ar) map[code].name=item.itm_name_ar;
          if(!map[code].company && item.Company_Name_Ar) map[code].company=item.Company_Name_Ar;
          map[code][branch].stock = parseFloat(item.sto_qty_big)||0;
          map[code][branch].price = parseFloat(item.itm_sell_price_big)||0;
          map[code][branch].has   = true; // الصنف مسجّل في جدول الفرع ده
        });
      }
      addStock(stockMamora,'mamora');
      addStock(stockSan,'san');
      addStock(stockBishr,'bishr');

      // معدلات الاستهلاك من sales_monthly
      var salesMap={};
      salesData.forEach(function(row){
        var code=String(row.itm_code||'').trim();
        if(!salesMap[code]) salesMap[code]={mamora:{},san:{},bishr:{}};
        var m=String(row.month||'').trim();
        salesMap[code].mamora[m]=(salesMap[code].mamora[m]||0)+(parseFloat(row.mamora)||0);
        salesMap[code].san[m]   =(salesMap[code].san[m]   ||0)+(parseFloat(row.san)   ||0);
        salesMap[code].bishr[m] =(salesMap[code].bishr[m] ||0)+(parseFloat(row.bishr) ||0);
      });
      function branchCalc(bs){
        var active=Object.keys(bs).filter(function(m){return bs[m]>0;});
        var total=active.reduce(function(sum,m){return sum+bs[m];},0);
        var avg=active.length>0?total/active.length:0;
        return {avg:avg, active:active.length};
      }
      Object.keys(map).forEach(function(code){
        var sale=salesMap[code]||{mamora:{},san:{},bishr:{}};
        ['mamora','san','bishr'].forEach(function(br){
          var c=branchCalc(sale[br]||{});
          map[code][br].avg=c.avg;           // المعدل الشهري للفرع
          map[code][br].active=c.active;
          map[code][br].daily=c.avg/30;      // الاستهلاك اليومي للفرع
        });
      });

      return map;
    }

    // كمية تغطية فترة معينة بالأيام لفرع = الاستهلاك اليومي × عدد الأيام
    function coverQty(branchObj, days){
      return (branchObj.daily||0) * days;
    }

    // فائض الفرع = الرصيد − تغطية فترة الفائض، بشرط الرصيد > أقل رصيد
    // يُقرَّب للأقل (floor) ولا يظهر إلا إذا بلغ الحد الأدنى المحدد
    function branchSurplus(branchObj){
      var minStock    = parseFloat(document.getElementById('min-stock').value)||0;
      var surplusDays = parseFloat(document.getElementById('surplus-days').value)||0;
      var minSurplus  = parseFloat(document.getElementById('min-surplus').value)||1;
      if(branchObj.stock <= minStock) return 0;          // رصيد ضعيف — لا فائض
      var surplus = Math.floor(branchObj.stock - coverQty(branchObj, surplusDays)); // تقريب للأقل
      if(surplus < minSurplus) return 0;                 // أقل من الحد الأدنى — تجاهل
      return surplus;
    }

    // الفرع محتاج = رصيده أقل من تغطية فترة الاحتياج
    function branchNeeds(branchObj){
      var needDays = parseFloat(document.getElementById('need-days').value)||0;
      return branchObj.stock < coverQty(branchObj, needDays);
    }

    // ===== الحساب الرئيسي =====
    async function calculate(){
      // أول ضغطة "احسب": نحمّل جداول المخزون الكبيرة (مرة واحدة)
      if(!stockLoaded){
        document.getElementById('result-container').innerHTML='<div class="loading-overlay">⏳ جاري تحميل البيانات...</div>';
        var ok = await loadStockData(false);
        if(!ok) return;
      }
      saveSettings();
      var map=buildItemsMap();
      var items=Object.keys(map).map(function(c){return map[c];})
        .filter(function(it){
          if(itemType==='med') return it.isMedicine;   // أدوية فقط
          if(itemType==='cos') return !it.isMedicine;   // تجميل فقط
          return true;                                  // الكل
        });

      allResults=items;
      hasCalculated=true;
      applyAndRender();
    }

    function applyAndRender(){
      var search=document.getElementById('search-input').value.trim().toLowerCase();
      var base=allResults.filter(function(it){
        if(search && !it.name.toLowerCase().includes(search) && !it.code.includes(search)) return false;
        return true;
      });

      var rows=[];
      if(currentTab==='prices'){
        // أصناف سعرها مختلف بين الفروع + رصيد>0 في فرع واحد على الأقل
        base.forEach(function(it){
          var prices=[];
          ['mamora','san','bishr'].forEach(function(br){
            if(it[br].has && it[br].price>0) prices.push(it[br].price);
          });
          var anyStock = it.mamora.stock>0 || it.san.stock>0 || it.bishr.stock>0;
          if(!anyStock) return;
          var uniq=[...new Set(prices)];
          if(uniq.length>1) rows.push(it);
        });
      } else if(currentTab==='transfer'){
        // الفرع المستهدف محتاج + فرع تاني عنده فائض
        var target=document.getElementById('target-branch').value;
        var others=['mamora','san','bishr'].filter(function(b){return b!==target;});
        base.forEach(function(it){
          if(!branchNeeds(it[target])) return;            // المستهدف لازم يكون محتاج
          var hasSurplus=others.some(function(b){
            return branchSurplus(it[b]) > 0;              // فرع تاني عنده فائض فعلي
          });
          if(hasSurplus) rows.push(it);
        });
      } else if(currentTab==='missing'){
        // موجود في فروع تانية وغير مسجّل/رصيد صفر في الفرع المستهدف
        var target2=document.getElementById('target-branch').value;
        var others2=['mamora','san','bishr'].filter(function(b){return b!==target2;});
        base.forEach(function(it){
          var inTarget = it[target2].has && it[target2].stock>0;
          if(inTarget) return; // موجود فعلاً، تجاهل
          var inOthers = others2.some(function(b){ return it[b].has && it[b].stock>0; });
          if(inOthers) rows.push(it);
        });
      }

      filteredResults=rows;
      renderResults();
    }

    // ===== العرض =====
    function medBadge(it){
      return it.isMedicine ? '<span class="badge-med">دواء</span>' : '<span class="badge-cos">تجميل</span>';
    }
    function priceCell(b, isHigh, isLow){
      if(!b.has) return '<td class="zero-stock">—</td>';
      var cls = isHigh?'price-high':(isLow?'price-low':'');
      return '<td class="'+cls+'">'+b.price+'<div style="font-size:0.65rem;color:var(--text-muted);">رصيد: '+b.stock+'</div></td>';
    }
    function branchInfoCell(b){
      if(!b.has) return '<td class="zero-stock">غير مسجّل</td>';
      var surplus = branchSurplus(b);
      var needs   = branchNeeds(b);

      // قيمة العمود الثالث: فائض (أخضر) أو الرقم المحتاج (أحمر) أو شرطة
      var thirdLabel, thirdVal, thirdColor;
      if(surplus > 0){
        thirdLabel='فائض'; thirdVal='+'+surplus; thirdColor='var(--success)';
      } else if(needs){
        var needDays = parseFloat(document.getElementById('need-days').value)||0;
        var needQty  = Math.ceil(coverQty(b, needDays) - b.stock); // الكمية الناقصة للوصول لتغطية الفترة
        if(needQty < 1) needQty = 1;
        thirdLabel='محتاج'; thirdVal=needQty; thirdColor='var(--danger)';
      } else {
        thirdLabel='الحالة'; thirdVal='—'; thirdColor='var(--text-muted)';
      }

      return '<td>'+
        '<div class="branch-cell">'+
          '<div class="bc-col"><span class="bc-lbl">رصيد</span><span class="bc-num">'+b.stock+'</span></div>'+
          '<div class="bc-col"><span class="bc-lbl">معدل</span><span class="bc-num">'+r1(b.avg)+'</span></div>'+
          '<div class="bc-col"><span class="bc-lbl">'+thirdLabel+'</span><span class="bc-num" style="color:'+thirdColor+';font-weight:700;">'+thirdVal+'</span></div>'+
        '</div>'+
      '</td>';
    }

    function renderResults(){
      var container=document.getElementById('result-container');
      var total=filteredResults.length;
      var totalPages=Math.max(1, Math.ceil(total/PAGE_SIZE));
      if(currentPage>totalPages) currentPage=totalPages;
      var start=(currentPage-1)*PAGE_SIZE;
      var pageItems=filteredResults.slice(start, start+PAGE_SIZE);

      document.getElementById('result-count').textContent= total+' صنف';

      if(!total){ container.innerHTML='<div class="loading-overlay">لا توجد نتائج</div>'; return; }

      var html='<div class="summary-bar"><div class="summary-item">النتائج: <b>'+total+'</b></div>'+
        '<div class="summary-item">صفحة: <b>'+currentPage+' / '+totalPages+'</b></div></div>';
      html+='<div class="res-wrap"><table class="res-table"><thead>';

      if(currentTab==='prices'){
        html+='<tr><th class="name-cell" style="text-align:right;">الصنف</th>'+
          '<th>المعمورة</th><th>سان ستيفانو</th><th>سيدى بشر</th><th>الفرق</th></tr></thead><tbody>';
        pageItems.forEach(function(it){
          var ps=[];
          ['mamora','san','bishr'].forEach(function(br){ if(it[br].has&&it[br].price>0) ps.push(it[br].price); });
          var maxP=Math.max.apply(null,ps), minP=Math.min.apply(null,ps);
          html+='<tr><td class="name-cell"><div style="font-weight:600;">'+it.name+' '+medBadge(it)+'</div>'+
            '<div style="font-size:0.65rem;color:var(--text-muted);">'+it.code+' · '+it.company+'</div></td>'+
            priceCell(it.mamora, it.mamora.price===maxP, it.mamora.price===minP)+
            priceCell(it.san,    it.san.price===maxP,    it.san.price===minP)+
            priceCell(it.bishr,  it.bishr.price===maxP,  it.bishr.price===minP)+
            '<td style="font-weight:700;color:var(--accent-dark);">'+r1(maxP-minP)+'</td></tr>';
        });
      } else if(currentTab==='transfer'){
        var target=document.getElementById('target-branch').value;
        html+='<tr><th class="name-cell" style="text-align:right;">الصنف</th>'+
          '<th>'+BRANCHES.mamora+'</th><th>'+BRANCHES.san+'</th><th>'+BRANCHES.bishr+'</th>'+
          '<th>المستهدف</th></tr></thead><tbody>';
        pageItems.forEach(function(it){
          html+='<tr><td class="name-cell"><div style="font-weight:600;">'+it.name+' '+medBadge(it)+'</div>'+
            '<div style="font-size:0.65rem;color:var(--text-muted);">'+it.code+' · '+it.company+'</div></td>'+
            branchInfoCell(it.mamora)+branchInfoCell(it.san)+branchInfoCell(it.bishr)+
            '<td style="font-weight:700;">'+BRANCHES[target]+'</td></tr>';
        });
      } else { // missing
        var target2=document.getElementById('target-branch').value;
        html+='<tr><th class="name-cell" style="text-align:right;">الصنف</th>'+
          '<th>'+BRANCHES.mamora+'</th><th>'+BRANCHES.san+'</th><th>'+BRANCHES.bishr+'</th>'+
          '<th>ناقص من</th></tr></thead><tbody>';
        pageItems.forEach(function(it){
          html+='<tr><td class="name-cell"><div style="font-weight:600;">'+it.name+' '+medBadge(it)+'</div>'+
            '<div style="font-size:0.65rem;color:var(--text-muted);">'+it.code+' · '+it.company+'</div></td>'+
            branchInfoCell(it.mamora)+branchInfoCell(it.san)+branchInfoCell(it.bishr)+
            '<td style="font-weight:700;color:var(--danger);">'+BRANCHES[target2]+'</td></tr>';
        });
      }

      html+='</tbody></table></div>';

      // pagination
      html+='<div class="pagination">'+
        '<button class="page-btn" onclick="changePage(-1)" '+(currentPage<=1?'disabled':'')+'><i class="fas fa-chevron-right"></i> السابق</button>'+
        '<span style="font-size:0.8rem;color:var(--text-secondary);">'+currentPage+' / '+totalPages+'</span>'+
        '<button class="page-btn" onclick="changePage(1)" '+(currentPage>=totalPages?'disabled':'')+'>التالي <i class="fas fa-chevron-left"></i></button>'+
      '</div>';

      container.innerHTML=html;
    }

    function changePage(dir){
      var totalPages=Math.ceil(filteredResults.length/PAGE_SIZE);
      currentPage=Math.min(Math.max(1,currentPage+dir), totalPages);
      saveSettings();
      renderResults();
    }

    // ===== التابات =====
    function switchTab(tab, btn){
      currentTab=tab;
      currentPage=1;
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      updateTabUI();
      saveSettings();
      if(hasCalculated) applyAndRender();
    }
    function updateTabUI(){
      var titles={prices:'فرق الأسعار بين الفروع', transfer:'التحويل بين الفروع', missing:'أصناف ناقصة من فرع'};
      document.getElementById('result-title').textContent=titles[currentTab]||'';

      var isPrices = (currentTab==='prices');

      // اختيار الفرع المستهدف يخص التحويل والنقص فقط
      var bsw = document.getElementById('branch-select-wrap');
      if(bsw) bsw.style.display = isPrices ? 'none' : 'block';

      // صف إعدادات الفائض/الاحتياج لا يخص الأسعار
      var needWrap = document.getElementById('need-config-wrap');
      if(needWrap) needWrap.style.display = isPrices ? 'none' : 'flex';

      // زر Excel غير مهم في تاب الأسعار
      var excelBtn = document.getElementById('excel-btn');
      if(excelBtn) excelBtn.style.display = isPrices ? 'none' : 'inline-flex';

      // في تاب الأسعار: ضع بطاقات تحديث الفروع بجوار الأزرار (نفس الصف)
      var bu = document.getElementById('branch-updates');
      var inlineHolder = document.getElementById('branch-updates-inline');
      if(isPrices){
        if(inlineHolder && bu && bu.parentElement!==inlineHolder) inlineHolder.appendChild(bu);
        if(inlineHolder) inlineHolder.style.display='flex';
        if(bu) bu.style.marginBottom='0';
      } else {
        if(bu && bu.parentElement===inlineHolder){
          var anchor=document.getElementById('branch-updates-anchor');
          if(anchor) anchor.parentNode.insertBefore(bu, anchor);
        }
        if(inlineHolder) inlineHolder.style.display='none';
        if(bu) bu.style.marginBottom='16px';
      }
    }

    // ===== Export Excel =====
    function exportExcel(){
      if(!filteredResults.length){ alert('احسب الأول'); return; }
      var wsData=[];
      if(currentTab==='prices'){
        wsData.push(['الكود','الصنف','الشركة','نوع','سعر المعمورة','سعر سان','سعر بشر','الفرق']);
        filteredResults.forEach(function(it){
          var ps=[];
          ['mamora','san','bishr'].forEach(function(br){ if(it[br].has&&it[br].price>0) ps.push(it[br].price); });
          var diff=r1(Math.max.apply(null,ps)-Math.min.apply(null,ps));
          wsData.push([it.code,it.name,it.company,it.isMedicine?'دواء':'تجميل',
            it.mamora.has?it.mamora.price:'', it.san.has?it.san.price:'', it.bishr.has?it.bishr.price:'', diff]);
        });
      } else {
        var label = currentTab==='transfer'?'تحويل':'ناقص';
        var target=document.getElementById('target-branch').value;
        wsData.push(['الكود','الصنف','الشركة','نوع',
          'رصيد المعمورة','فائض المعمورة','رصيد سان','فائض سان','رصيد بشر','فائض بشر','المستهدف ('+label+')']);
        filteredResults.forEach(function(it){
          wsData.push([it.code,it.name,it.company,it.isMedicine?'دواء':'تجميل',
            it.mamora.stock,r1(branchSurplus(it.mamora)), it.san.stock,r1(branchSurplus(it.san)),
            it.bishr.stock,r1(branchSurplus(it.bishr)), BRANCHES[target]]);
        });
      }
      var wb=XLSX.utils.book_new();
      var ws=XLSX.utils.aoa_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, 'النتائج');
      XLSX.writeFile(wb, 'inventory_mgmt_'+currentTab+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
    }
  </script>
