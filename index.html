<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Phalix</title>
  <link rel="stylesheet" href="tokens.css?v=20260906">
  <script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض.
     ⚠️ من غيره الصفحة مابتقولش هي فاتحة ولا داكنة، فقاعدة
     prefers-color-scheme في tokens.css بتتبع **إعداد الجهاز** بدل
     إعداد التطبيق — وده اللي كان بيخلّي ويب الطيار وكروت شاشة
     التوزيع تطلع داكنة عند ناس جهازهم على الوضع الليلي.
     الافتراضي فاتح: الوضع الليلي باختيار صريح من الزر بس. */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;900&family=Orbitron:wght@700;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(13,148,136,0.15) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(99,102,241,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 10%, rgba(34,197,94,0.07) 0%, transparent 40%);
    }

    /* خطوط ديكورية خلفية */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(13,148,136,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(13,148,136,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .login-wrap {
      position: relative;
      width: 100%;
      max-width: 400px;
      z-index: 1;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    /* أيقونة Phalix */
    .login-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow:
        0 8px 32px rgba(13,148,136,0.4),
        0 0 0 1px rgba(13,148,136,0.2);
      position: relative;
    }
    .login-icon::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 27px;
      background: linear-gradient(135deg, rgba(13,148,136,0.3), rgba(99,102,241,0.3));
      z-index: -1;
      filter: blur(8px);
    }
    .login-icon span {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .login-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #f8fafc;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #38bdf8, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-sub {
      font-size: 0.82rem;
      color: #475569;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.6),
        0 0 0 1px rgba(13,148,136,0.05) inset;
      backdrop-filter: blur(12px);
    }

    .field { margin-bottom: 20px; }
    .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .field-wrap { position: relative; }
    .field-wrap i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #475569;
      font-size: 0.85rem;
      pointer-events: none;
      transition: color 0.2s;
    }
    .field input {
      width: 100%;
      padding: 13px 42px 13px 14px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 12px;
      color: #f1f5f9;
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .field input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(13,148,136,0.1);
    }
    .field input:focus + i,
    .field-wrap:focus-within i { color: #38bdf8; }
    .field input::placeholder { color: #334155; }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #334155, transparent);
      margin: 4px 0 20px;
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(13,148,136,0.3);
    }
    .btn-login:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(13,148,136,0.4);
    }
    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-top: 16px;
      display: none;
      text-align: center;
    }
    .error-msg.show { display: block; }

    /* badge أسفل الكارد */
    .powered-by {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: #1e293b;
      letter-spacing: 1px;
    }
    .powered-by span {
      color: #334155;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
    }
  </style>
</head>
<body>
  <div class="login-wrap">

    <div class="login-header">
      <div class="login-icon">
        <span>Px</span>
      </div>
      <div class="login-title">PHALIX</div>
      <div class="login-sub">نظام إدارة الفروع الداخلي</div>
    </div>

    <div class="login-card">
      <div class="field">
        <label><i class="fas fa-user"></i> اسم المستخدم</label>
        <div class="field-wrap">
          <input type="text" id="username"
            placeholder="أدخل اسم المستخدم"
            autocomplete="username">
          <i class="fas fa-user"></i>
        </div>
      </div>

      <div class="field">
        <label><i class="fas fa-lock"></i> كلمة المرور</label>
        <div class="field-wrap">
          <input type="password" id="password"
            placeholder="••••••••"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter') handleLogin()">
          <i class="fas fa-lock"></i>
        </div>
      </div>

      <div class="divider"></div>

      <button class="btn-login" id="loginBtn" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> دخول
      </button>

      <div class="error-msg" id="error-msg"></div>
    </div>

    <div class="powered-by">
      POWERED BY <span>PHALIX</span>
    </div>

  </div>
 <script src="config.js?v=20260904c"></script>
 <script src="session.js?v=20260905"></script>
 <script src="branches.js?v=20260904d"></script>
 <script src="pages.js?v=20260904d"></script>
 <script src="brand.js?v=20260904c"></script>
 <script src="api.js?v=20260904c"></script>
  <script>
    async function handleLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const btn  = document.getElementById('loginBtn');

      document.getElementById('error-msg').classList.remove('show');
      if (!user || !pass) { showErr("برجاء إدخال بيانات الدخول"); return; }

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

      const result = await login(user, pass);

      if (result && (result.success || result.status === "success")) {
        // كتابة الجلسة كلها من session.js — الرجوع لاسم المستخدم لو الفرع
        // فاضي بيتبعت صريح هنا للحفاظ على سلوك الشاشة القديم.
        Session.save({ ...result, branch: result.branch || result.user });

        // شاشة التوزيع بتحتاج userBranchId (uuid) — نفس الاستعلام كان مكتوب
        // في صفحتَي الدخول، دلوقتي في Session.resolveBranchId().
        await Session.resolveBranchId();

        btn.innerHTML = '<i class="fas fa-check"></i> تم الدخول...';

        window.location.replace("delivery/app.html");
      } else {
        showErr(result?.message || "بيانات الدخول غير صحيحة");
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
      }
    }

    function showErr(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('show');
    }
  </script>
</body>
</html>
