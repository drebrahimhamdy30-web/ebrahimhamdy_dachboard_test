<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>معاملات باي موب - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .pm-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
    .pm-header-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .tabs-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    .tab-btn { padding:7px 16px; border-radius:20px; border:1px solid var(--border); background:var(--surface-3); color:var(--text-secondary); font-size:0.82rem; cursor:pointer; transition:all 0.2s; font-family:var(--font); }
    .tab-btn.active { background:var(--accent); color:var(--primary); border-color:var(--accent); font-weight:700; }
    .search-wrap { position:relative; min-width:200px; flex:1; max-width:280px; }
    .search-wrap i { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem; pointer-events:none; }
    .search-wrap input { padding-right:34px; }
    .badge-paid    { background:#dcfce7; color:#15803d; }
    .badge-unpaid  { background:#fef9c3; color:#a16207; }
    .badge-linked  { background:#dbeafe; color:#1d4ed8; }
    .badge-nolink  { background:#fee2e2; color:#b91c1c; }
    .ref-badge { display:inline-block; background:#ede9fe; color:#6d28d9; border-radius:20px; padding:1px 8px; font-size:0.65rem; font-weight:700; }
    .day-paid-badge { font-size:0.72rem; padding:2px 10px; border-radius:20px; font-weight:700; }
    .pm-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:99999; align-items:center; justify-content:center; }
    .pm-modal { background:#1e293b; border:2px solid #334155; border-radius:16px; padding:22px; width:92%; max-width:460px; direction:rtl; font-family:var(--font); box-shadow:0 20px 60px rgba(0,0,0,0.6); }
    .pm-modal h3 { color:#f1f5f9; font-size:1rem; margin:0 0 16px; display:flex; align-items:center; gap:8px; }
    .pm-field { margin-bottom:12px; }
    .pm-field label { display:block; font-size:0.78rem; font-weight:700; color:#94a3b8; margin-bottom:5px; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">

      <div class="pm-header">
        <div class="page-title" style="margin:0;">
          <i class="fas fa-mobile-screen-button"></i> معاملات باي موب
          <span class="highlight" id="display-branch">...</span>
        </div>
        <div class="pm-header-right">
          <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="form-input" placeholder="بحث بالقيمة أو رقم الفاتورة..." oninput="applyFilter()">
          </div>
          <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> إضافة يدوي</button>
          <button class="btn btn-primary" onclick="loadAll()"><i class="fas fa-sync-alt"></i></button>
        </div>
      </div>

      <div class="tabs-bar" id="status-tabs-row">
        <button class="tab-btn active" onclick="switchTab('nolink', this)">🔴 غير مطابَقة</button>
        <button class="tab-btn" onclick="switchTab('linked', this)">🔗 مطابَقة</button>
        <button class="tab-btn" onclick="switchTab('all', this)">📋 الكل</button>
      </div>

      <div class="filter-bar" style="margin-bottom:12px;align-items:center;flex-wrap:wrap;gap:8px;">
        <span class="filter-label"><i class="fas fa-calendar"></i> اليوم:</span>
        <input type="date" id="dayFilter" class="form-input" style="width:160px;" onchange="applyFilter()">
        <button class="btn" style="background:var(--surface-3);color:var(--text-secondary);font-size:0.78rem;" onclick="clearFilters()">
          <i class="fas fa-times"></i> مسح
        </button>
        <div id="grand-total-badge" style="margin-right:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          <span style="font-size:0.78rem;font-weight:700;color:var(--text-secondary);">الرصيد الحالي:</span>
          <div id="grand-total-val" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
        </div>
      </div>

      <div id="transactions-section">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>تاريخ المعاملة</th>
                <th>القيمة</th>
                <th>الماكينة</th>
                <th id="th-store" style="display:none;">الفرع</th>
                <th>رقم الفاتورة</th>
                <th>المطابقة</th>
                <th>التحويل</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr class="loading-row"><td colspan="7">⏳ جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;padding:10px 0;font-size:0.88rem;font-weight:700;" id="total-bar"></div>
      </div>

    </div>
  </div>

  <!-- Modal -->
  <div class="pm-modal-overlay" id="add-modal-overlay">
    <div class="pm-modal">
      <h3><i class="fas fa-plus"></i> إضافة معاملة باي موب يدوي</h3>
      <div class="pm-field">
        <label>القيمة</label>
        <input type="number" id="add-amount" class="form-input" step="0.01" min="0">
      </div>
      <div class="pm-field">
        <label>الماكينة</label>
        <select id="add-machine" class="form-select"></select>
      </div>
      <div class="pm-field">
        <label>رقم الفاتورة (اختياري)</label>
        <input type="text" id="add-bill" class="form-input" inputmode="numeric">
      </div>
      <div class="pm-field">
        <label>تاريخ ووقت المعاملة</label>
        <input type="datetime-local" id="add-time" class="form-input">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button class="btn" style="background:#334155;color:#94a3b8;border:none;" onclick="closeAddModal()">إلغاء</button>
        <button class="btn btn-primary" id="add-save-btn" onclick="saveManual()"><i class="fas fa-save"></i> حفظ</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="nav.js" defer></script>
  <script>
    const BRANCH_MAP = {
      'المعمورة':    'الصيدلية',
      'سان ستيفانو': 'ابراهيم حمدي 2',
      'سيدى بشر':   'ابراهيم حمدي 3',
    };

    let activeUser      = null;
    let userBranch      = '';
    let userRole        = '';
    let isAdmin         = false;
    let allData         = [];
    let machineObjs     = [];
    let branchTerminals = [];
    let terminalInfo    = {};
    let currentTab      = 'nolink';

    checkAuth().then(async user => {
      activeUser = user;
      if (user) {
        userBranch = (localStorage.getItem('userBranch') || '').trim();
        userRole   = (localStorage.getItem('userRole')   || '').trim();
        isAdmin    = (userRole === 'admin');
        document.getElementById('display-branch').textContent = isAdmin ? 'كل الفروع' : userBranch;
        await loadMachines();
        await loadAll();
      }
    });

    function machineNameOf(terminalId) {
      const info = terminalInfo[String(terminalId || '').trim()];
      return info ? info.machine : String(terminalId || '').trim();
    }
    function storeOf(terminalId) {
      const info = terminalInfo[String(terminalId || '').trim()];
      return info ? info.store : '---';
    }

    async function loadMachines() {
      try {
        const resp = await fetchMachines();
        let list = (Array.isArray(resp) ? resp : [])
          .filter(m => { const t = String(m.terminal_id || '').trim(); return t && t !== 'null'; });
        if (!isAdmin) {
          const mapped = BRANCH_MAP[userBranch] || userBranch;
          list = list.filter(m => String(m.store_name || '').trim() === mapped);
        }
        machineObjs     = list;
        branchTerminals = list.map(m => String(m.terminal_id || '').trim());
        terminalInfo    = {};
        list.forEach(m => {
          terminalInfo[String(m.terminal_id || '').trim()] = {
            machine: m.machine_name || '',
            store:   m.store_name   || ''
          };
        });
      } catch(e) { machineObjs = []; branchTerminals = []; terminalInfo = {}; }

      const sel = document.getElementById('add-machine');
      sel.innerHTML = '';
      machineObjs.forEach(m => {
        const o = document.createElement('option');
        o.value = String(m.terminal_id || '').trim();
        o.textContent = (m.machine_name || o.value) + (isAdmin ? ` (${m.store_name||''})` : '');
        sel.appendChild(o);
      });
    }

    async function loadAll() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="6">⏳ جاري جلب البيانات...</td></tr>';
      try {
        const resp = await fetchPaymob();
        allData = (Array.isArray(resp) ? resp : []).filter(p =>
          branchTerminals.includes(String(p.terminal_id || '').trim())
        );
        applyFilter();
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:30px;">❌ فشل الاتصال</td></tr>';
      }
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('#status-tabs-row .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter();
    }

    function isLinked(p) { const b = String(p.bill_no || '').trim(); return b && b !== 'null'; }
    function isPaid(p)   { return p.paid === true || p.paid === 'true'; }

    function toEgyptDate(t) {
      if (!t) return null;
      const ms = new Date(t).getTime();
      if (isNaN(ms)) return null;
      return new Date(ms + 3 * 60 * 60 * 1000);
    }

    function dayKey(p) {
      const d = toEgyptDate(p.transaction_time);
      if (!d) return '';
      const y  = d.getUTCFullYear();
      const mo = String(d.getUTCMonth()+1).padStart(2,'0');
      const dd = String(d.getUTCDate()).padStart(2,'0');
      return `${y}-${mo}-${dd}`;
    }

    function fmtDate(t) {
      const d = toEgyptDate(t);
      if (!d) return '---';
      return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()}`;
    }

    function fmtTime(t) {
      const d = toEgyptDate(t);
      if (!d) return '';
      const h    = d.getUTCHours();
      const m    = d.getUTCMinutes();
      const ampm = h >= 12 ? 'م' : 'ص';
      const h12  = h % 12 || 12;
      return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
    }

    function fmtDayTitle(k) {
      const [y, mo, d] = k.split('-').map(Number);
      const days   = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
      const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
      const dow = new Date(y, mo-1, d).getDay();
      return `${days[dow]}، ${d} ${months[mo-1]} ${y}`;
    }

    function getFiltered() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const dayF   = document.getElementById('dayFilter').value;
      return allData.filter(p => {
        const linked = isLinked(p);
        if (currentTab === 'nolink' && linked)  return false;
        if (currentTab === 'linked' && !linked) return false;
        // فلتر التاريخ بعد تحويله لتوقيت مصر
        if (dayF && dayKey(p) !== dayF) return false;
        if (search) {
          const hit = String(parseFloat(p.amount)||'').includes(search) ||
                      String(p.bill_no  || '').toLowerCase().includes(search) ||
                      String(p.order_id || '').toLowerCase().includes(search);
          if (!hit) return false;
        }
        return true;
      });
    }

    function applyFilter() { renderTable(getFiltered()); }

    // ===== حساب الضريبة — fees دايماً =====
    function calcTax(p) {
      const amt  = parseFloat(p.amount) || 0;
      const fees = parseFloat(p.fees)   || 0;
      // الضريبة = fees دايماً (مش amount - NET_AMMOUNT)
      // لأن NET_AMMOUNT في n8n بيخصم fees + VAT بينما البنك بيخصم fees فقط
      const tax      = fees;
      const netFinal = amt - fees;
      return { amt, tax, netFinal };
    }

    function renderTable(items) {
      const tbody    = document.getElementById('table-body');
      document.getElementById('th-store').style.display = isAdmin ? '' : 'none';
      const colCount = isAdmin ? 7 : 6;

      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد معاملات</td></tr>`;
        document.getElementById('total-bar').innerHTML = '';
        const grandVal = document.getElementById('grand-total-val');
        if (grandVal) grandVal.textContent = '0.00';
        return;
      }

      items.sort((a,b) => new Date(b.transaction_time||0) - new Date(a.transaction_time||0));

      // إحصائيات اليوم من كل allData
      const dayStats = {};
      allData.forEach(p => {
        const k = dayKey(p); if (!k) return;
        if (!dayStats[k]) dayStats[k] = { total:0, count:0, paidCount:0 };
        dayStats[k].total += parseFloat(p.amount) || 0;
        dayStats[k].count++;
        if (isPaid(p)) dayStats[k].paidCount++;
      });

      // تجميع المعاملات في groups
      const dayOrder  = [];
      const dayGroups = {};
      items.forEach(p => {
        const k = dayKey(p);
        if (!dayGroups[k]) { dayGroups[k] = []; dayOrder.push(k); }
        dayGroups[k].push(p);
      });

      let grand = 0;
      let html  = '';

      dayOrder.forEach(k => {
        const dayItems = dayGroups[k];
        const ds       = dayStats[k] || { total:0, count:0, paidCount:0 };
        const dateStr  = fmtDayTitle(k);
        const allPaid  = ds.paidCount === ds.count && ds.count > 0;
        const somePaid = ds.paidCount > 0 && ds.paidCount < ds.count;

        const paidBadge = allPaid
          ? '<span class="day-paid-badge badge-paid">✅ تم التحويل</span>'
          : somePaid
            ? `<span class="day-paid-badge badge-unpaid">⏳ جزئي (${ds.paidCount}/${ds.count})</span>`
            : '<span class="day-paid-badge badge-unpaid">⏳ لم يُحوَّل</span>';

        const markBtn = (isAdmin && !allPaid)
          ? `<button class="btn btn-success btn-sm" onclick="markDayPaid('${k}', this)" style="margin-right:8px;"><i class="fas fa-check-double"></i> تم التحويل</button>`
          : '';

        // إحصائيات اليوم مقسمة على الفروع — من كل معاملات اليوم
        const allDayItems = allData.filter(p => dayKey(p) === k);
        const storeStats  = {};
        allDayItems.forEach(p => {
          const store = storeOf(p.terminal_id) || '---';
          if (!storeStats[store]) storeStats[store] = { total:0, net:0, tax:0 };
          const { amt, tax, netFinal } = calcTax(p);
          storeStats[store].total += amt;
          storeStats[store].tax   += tax;
          storeStats[store].net   += netFinal;
        });

        const dayTotal   = Object.values(storeStats).reduce((s,x) => s+x.total, 0);
        const dayTax     = Object.values(storeStats).reduce((s,x) => s+x.tax,   0);
        const dayNet     = Object.values(storeStats).reduce((s,x) => s+x.net,   0);
        const dayTaxPct  = dayTotal > 0 ? ((dayTax / dayTotal) * 100).toFixed(2) : '0.00';

        const storeDetails = Object.entries(storeStats).map(([store, v]) => {
          const taxPct = v.total > 0 ? ((v.tax / v.total) * 100).toFixed(2) : '0.00';
          return `<span style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:0.72rem;">
            <b style="color:var(--text-primary);">${store}</b>:
            <span style="color:var(--warning);">${v.total.toFixed(2)}</span>
            <span style="color:var(--text-muted);font-size:0.65rem;"> | ضريبة: ${v.tax.toFixed(2)} (${taxPct}%) | صافي: ${v.net.toFixed(2)}</span>
          </span>`;
        }).join('');

        html += `<tr style="background:var(--surface-3);">
          <td colspan="${colCount}" style="padding:10px 14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <span style="font-weight:800;font-size:0.9rem;color:var(--text-primary);">
                <i class="fas fa-calendar-day" style="color:var(--accent);margin-left:5px;"></i> ${dateStr}
              </span>
              <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                ${storeDetails}
                <span style="background:var(--primary);color:#fff;border-radius:8px;padding:3px 10px;font-size:0.75rem;font-weight:800;">
                  الكل: ${dayTotal.toFixed(2)}
                  <span style="opacity:0.8;font-size:0.65rem;"> | ضريبة: ${dayTax.toFixed(2)} (${dayTaxPct}%) | صافي: ${dayNet.toFixed(2)}</span>
                </span>
                ${paidBadge} ${markBtn}
              </span>
            </div>
          </td>
        </tr>`;

        dayItems.forEach(p => {
          const amt    = parseFloat(p.amount) || 0;
          grand       += amt;
          const dStr   = fmtDate(p.transaction_time);
          const tStr   = fmtTime(p.transaction_time);
          const linked = isLinked(p);
          const paid   = isPaid(p);
          const mName  = machineNameOf(p.terminal_id);
          const storeCell = isAdmin ? `<td style="font-size:0.8rem;">${storeOf(p.terminal_id)}</td>` : '';

          html += `<tr>
            <td style="font-size:0.78rem;white-space:nowrap;">${dStr}<br><span style="color:var(--text-muted);font-size:0.7rem;">${tStr}</span></td>
            <td><b style="color:var(--warning);">${amt.toFixed(2)}</b></td>
            <td><span class="badge badge-blue" style="font-size:0.72rem;">${mName}</span></td>
            ${storeCell}
            <td style="text-align:center;">${linked ? `<span class="ref-badge">#${p.bill_no}</span>` : '<span style="color:var(--text-muted);">---</span>'}</td>
            <td>${linked ? '<span class="badge badge-linked">🔗 مطابَقة</span>' : '<span class="badge badge-nolink">🔴 غير مطابَقة</span>'}</td>
            <td>${paid  ? '<span class="badge badge-paid">✅ محوَّل</span>'  : '<span class="badge badge-unpaid">⏳ معلّق</span>'}</td>
          </tr>`;
        });
      });

      tbody.innerHTML = html;

      // الرصيد الحالي = إجمالي غير المحوَّل لكل ماكينة (مطابَقة + غير مطابَقة)
      const machineUnpaid = {};
      allData.filter(p => !isPaid(p)).forEach(p => {
        const m = machineNameOf(p.terminal_id) || '---';
        machineUnpaid[m] = (machineUnpaid[m] || 0) + (parseFloat(p.amount) || 0);
      });
      const grandVal = document.getElementById('grand-total-val');
      if (grandVal) {
        grandVal.innerHTML = Object.entries(machineUnpaid).map(([m, v]) =>
          `<span style="background:var(--surface-3);border:1.5px solid var(--border);border-radius:20px;padding:3px 10px;font-size:0.78rem;font-weight:700;">
            <span style="color:var(--text-secondary);">${m}:</span>
            <span style="color:var(--accent-dark);">${v.toFixed(2)}</span>
          </span>`
        ).join('');
      }
      const unpaidTotal = Object.values(machineUnpaid).reduce((s,v) => s+v, 0);
      document.getElementById('total-bar').innerHTML =
        `<span>الإجمالي: <b style="color:var(--accent-dark);">${grand.toFixed(2)}</b> جنيه</span>` +
        `<span style="color:var(--warning);">المعلّق: <b>${unpaidTotal.toFixed(2)}</b> جنيه</span>` +
        `<span style="color:var(--text-muted);">عدد المعاملات: <b>${items.length}</b></span>`;
    }

    async function markDayPaid(dayStr, btn) {
      if (!confirm(`تأكيد: تم تحويل إجمالي يوم ${dayStr}؟`)) return;
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      const ok = await paymobMarkPaidForDay(dayStr);
      if (ok) {
        allData.forEach(p => { if (dayKey(p) === dayStr) p.paid = true; });
        applyFilter();
      } else {
        alert('❌ فشل التحويل');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-double"></i> تم التحويل';
      }
    }

    function openAddModal() {
      if (!machineObjs.length) { alert('لا توجد ماكينات باي موب لهذا الفرع'); return; }
      document.getElementById('add-amount').value = '';
      document.getElementById('add-bill').value   = '';
      const now = new Date();
      const pad = n => String(n).padStart(2,'0');
      document.getElementById('add-time').value =
        `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById('add-modal-overlay').style.display = 'flex';
    }
    function closeAddModal() { document.getElementById('add-modal-overlay').style.display = 'none'; }
    document.getElementById('add-modal-overlay').addEventListener('click', function(e){ if (e.target===this) closeAddModal(); });

    async function saveManual() {
      const amount   = document.getElementById('add-amount').value.trim();
      const terminal = document.getElementById('add-machine').value;
      const bill     = document.getElementById('add-bill').value.trim();
      const timeLoc  = document.getElementById('add-time').value;
      if (!amount || parseFloat(amount) <= 0) { alert('أدخل قيمة صحيحة'); return; }
      if (!terminal) { alert('اختر الماكينة'); return; }
      if (!timeLoc)  { alert('اختر التاريخ والوقت'); return; }
      const btn = document.getElementById('add-save-btn');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
      const ok = await paymobInsert({ amount, terminal_id: terminal, bill_no: bill || '', transaction_time: timeLoc + ':00' });
      if (ok) { closeAddModal(); await loadAll(); }
      else alert('❌ فشل الحفظ');
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('dayFilter').value   = '';
      applyFilter();
    }
  </script>
</body>
</html>
