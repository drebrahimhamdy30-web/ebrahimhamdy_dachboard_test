<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>استيراد جدول الماكينات - Phalix</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root{
    --font:'Tajawal',system-ui,sans-serif;
    --surface:#fff;--surface-2:#1e293b;--surface-3:#f1f5f9;
    --border:#e2e8f0;--text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
    --accent:#3b82f6;--accent-dark:#1d4ed8;--success:#16a34a;--danger:#dc2626;--warning:#d97706;
    --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  }
  body{font-family:var(--font);background:#f8fafc;margin:0;color:var(--text-primary);}
  .container{max-width:1500px;margin:0 auto;padding:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.05);}
  .page-title{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 0 10px;}
  .page-title i{color:var(--accent);}
  .btn{border:none;border-radius:var(--radius-sm);padding:7px 14px;font-family:var(--font);font-weight:700;font-size:0.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:var(--surface-3);color:var(--text-secondary);} .btn-ghost:hover{background:#e2e8f0;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:10px;font-size:0.85rem;font-weight:700;display:none;z-index:9999;}

  .paste-zone{border:2px dashed #93c5fd;border-radius:var(--radius-md);background:#eff6ff;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:text;padding:10px;text-align:center;color:#1d4ed8;font-weight:700;outline:none;font-size:0.82rem;}
  .paste-zone .hint{font-size:0.72rem;color:#3b82f6;font-weight:600;}

  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .toolbar .stat{background:var(--surface-3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:0.75rem;font-weight:700;color:var(--text-secondary);}
  .toolbar .stat b{color:var(--text-primary);}

  .split-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start;}
  @media (max-width:900px){.split-grid{grid-template-columns:1fr;}}
  .pane{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;max-height:78vh;}
  .pane-head{padding:10px 14px;background:var(--surface-3);border-bottom:2px solid #16a34a;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pane-head .ttl{font-weight:800;font-size:0.86rem;display:flex;align-items:center;gap:6px;}
  .pane-head .cnt{font-size:0.7rem;color:var(--text-muted);font-weight:600;margin-inline-start:auto;}
  .pane-filters{padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:#fafbfc;}
  .pane-filters select{font-family:var(--font);font-size:0.76rem;border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:#fff;color:var(--text-secondary);}
  .pane-filters label{font-size:0.74rem;color:var(--text-muted);display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap;}
  .pane-body{overflow-y:auto;flex:1;}

  .row-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .12s;position:relative;}
  .row-item:hover{background:#f8fafc;}
  .row-item.linked{opacity:.55;background:#f8fafc;}
  .row-item.sel{background:#dcfce7;}
  .pick-dot{width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .row-item.sel .pick-dot{background:#16a34a;border-color:#16a34a;color:#fff;}
  .row-item:not(.sel):hover .pick-dot{border-color:#16a34a;}
  .row-body{flex:1;min-width:0;}
  .row-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .row-amt{font-weight:800;font-size:0.88rem;color:var(--text-primary);font-variant-numeric:tabular-nums;}
  .row-meta{font-size:0.7rem;color:var(--text-muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .mchip{background:#fae8ff;color:#a21caf;padding:1px 8px;border-radius:20px;font-size:0.66rem;font-weight:700;}
  .lchip{background:#dbeafe;color:#1d4ed8;padding:1px 7px;border-radius:20px;font-size:0.62rem;font-weight:700;}
  .dchip-in{background:#dcfce7;color:#15803d;padding:1px 8px;border-radius:20px;font-size:0.66rem;font-weight:700;}
  .dchip-out{background:#fee2e2;color:#b91c1c;padding:1px 8px;border-radius:20px;font-size:0.66rem;font-weight:700;}
  .empty-hint{text-align:center;color:var(--text-muted);padding:30px 10px;font-size:0.85rem;}

  #confirm-bar{position:sticky;top:0;z-index:50;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:10px 16px;margin-bottom:12px;display:none;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 6px 20px rgba(15,23,42,.25);}
  #confirm-bar.show{display:flex;}
  #confirm-bar b{color:#fff;}
  #confirm-bar .cb-tag{font-weight:800;color:#4ade80;display:flex;align-items:center;gap:6px;}
  #confirm-bar .cb-stat{font-size:0.8rem;color:#cbd5e1;}
  #confirm-bar .cb-actions{margin-inline-start:auto;display:flex;gap:8px;}
  #confirm-bar button{border:none;border-radius:8px;padding:7px 14px;font-family:var(--font);font-weight:700;font-size:0.8rem;cursor:pointer;}
  #confirm-bar .cb-cancel{background:#334155;color:#cbd5e1;} #confirm-bar .cb-cancel:hover{background:#475569;}
  #confirm-bar .cb-confirm{background:#16a34a;color:#fff;} #confirm-bar .cb-confirm:hover{background:#15803d;}

  .c2w-table{width:100%;border-collapse:collapse;font-size:0.8rem;}
  .c2w-table th,.c2w-table td{padding:6px 8px;border-bottom:1px solid var(--surface-3);text-align:start;white-space:nowrap;}
  .c2w-table th{font-size:0.7rem;color:var(--text-muted);font-weight:700;background:var(--surface-3);}
  .c2w-table td.num,.c2w-table th.num{width:90px;text-align:center;}
  .branch-group-head{background:#eff6ff;color:#1d4ed8;font-weight:800;font-size:0.8rem;padding:6px 12px;border-radius:8px;margin:10px 0 4px;}

  /* جدول الاستيراد الكامل + تجميع زي الإكسيل */
  .sum-bar{background:#0f172a;color:#4ade80;font-size:0.78rem;font-weight:800;padding:5px 12px;border-radius:8px;margin-inline-start:auto;white-space:nowrap;}
  .imp-full-table{width:100%;border-collapse:collapse;font-size:0.78rem;}
  .imp-full-table thead th{background:var(--surface-3);padding:6px 8px;border-bottom:2px solid #16a34a;text-align:start;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none;}
  .imp-full-table thead th:hover{background:#e2f8e9;}
  .imp-full-table thead th.pick-col{cursor:default;width:30px;}
  .imp-full-table thead th.col-sel{background:#bbf7d0;}
  .imp-full-table tbody td{padding:5px 8px;border-bottom:1px solid #f1f5f9;white-space:nowrap;cursor:cell;user-select:none;}
  .imp-full-table tbody tr.linked{opacity:.5;}
  .imp-full-table tbody tr.row-sel{background:#dcfce7;}
  .imp-full-table th.col-card,.imp-full-table td.col-card{background:#eef2ff;color:#4338ca;}
  .imp-full-table th.col-amount,.imp-full-table td.col-amount{background:#fef3c7;color:#92400e;font-weight:800;}
  .imp-full-table th.col-bank,.imp-full-table td.col-bank{background:#f0fdf4;color:#15803d;cursor:pointer;}
  .imp-full-table td.col-bank:hover::after{content:'✎';margin-right:4px;opacity:.5;font-size:0.65rem;}
  .imp-full-table tbody td.cell-sel{background:#bbf7d0;outline:1.5px solid #16a34a;outline-offset:-1px;}
  .imp-full-table tbody td.pick-cell{cursor:pointer;text-align:center;}
  .imp-full-table tbody tr:hover td{background:#fafbfc;}
  .imp-full-table tbody tr:hover td.cell-sel{background:#bbf7d0;}
</style>
</head>

<div class="nav-bar"></div>
<div class="container">

  <div class="card" style="margin-bottom:14px;">
    <div class="page-title"><i class="fas fa-file-import"></i> استيراد ومراجعة جدول الماكينات</div>
    <div id="paste-zone" class="paste-zone" contenteditable="true" tabindex="0">
      <i class="fas fa-paste"></i> اضغط هنا والصق الجدول (Ctrl+V)
      <div class="hint">منسوخ مباشرة من السيستم — هيتفكك تلقائياً لصفوف وأعمدة</div>

    <div class="toolbar">

        <select id="right-link-filter" style="font-family:var(--font);font-size:0.76rem;border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:#fff;color:var(--text-secondary);">
          <option value="open">غير المغلق</option>
          <option value="all">الكل</option>

    <div class="pane">

        <input id="left-amt-search" type="number" step="0.01" placeholder="ابحث بالقيمة..." style="width:130px;padding:4px 8px;font-size:0.76rem;border:1px solid var(--border);border-radius:8px;font-family:var(--font);background:#fff;color:var(--text-primary);">
        <span class="cnt" id="left-cnt">—</span>
      </div>
      <div class="pane-filters">
        <select id="left-machine-filter"><option value="">كل الماكينات</option></select>
        <select id="left-link-filter" style="font-family:var(--font);font-size:0.76rem;border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:#fff;color:var(--text-secondary);">
          <option value="open">غير المغلق</option>
          <option value="all">الكل</option>
          <option value="closed">المغلق فقط</option>
        </select>

  </div>

  <div class="card" id="c2w-card" style="margin-top:16px;">
    <div class="page-title"><i class="fas fa-file-circle-plus" style="color:#0369a1"></i> فواتير كاش محوّلة لمحفظة (كل الفروع)</div>
    <div id="c2w-area"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="nav.js"></script>
<script>
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:NaN;};
function fmtNum(n){return isNaN(n)?'—':(+n).toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2});}
let toastT=null;
function toast(msg,type){
  const t=$('#toast');t.textContent=msg;
  t.style.background= type==='err'?'#dc2626':(type==='ok'?'#16a34a':'#0f172a');
  t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';},2600);
}

const BRANCH_ALIAS={'الصيدلية':'المعمورة','ابراهيم حمدي 2':'سان ستيفانو','ابراهيم حمدي 3':'سيدى بشر'};
function normBranchKey(s){
  return String(s||'').trim().replace(/\u0649/g,'\u064a').replace(/\u0629/g,'\u0647').replace(/[\u0623\u0625\u0622]/g,'\u0627').replace(/\s+/g,' ');
}
const USER_ROLE_MI=(localStorage.getItem('userRole')||'').trim();
const IS_ACCOUNTANT_MI=USER_ROLE_MI==='accountant'||USER_ROLE_MI==='admin'||USER_ROLE_MI==='manager';
const BRANCHES_MI=['المعمورة','سان ستيفانو','سيدى بشر'];
const USER_BRANCH_RAW=(localStorage.getItem('userBranch')||'').trim();
const USER_BRANCH_DEFAULT=BRANCH_ALIAS[USER_BRANCH_RAW]||USER_BRANCH_RAW;
let USER_BRANCH=USER_BRANCH_DEFAULT;
// لو محاسب/أدمن: ابدأ بأول فرع لو مفيش فرع محدد
if(IS_ACCOUNTANT_MI&&!USER_BRANCH)USER_BRANCH=BRANCHES_MI[0];

// بناء selector الفرع لو محاسب/أدمن
(function(){
  const lbl=$('#branch-label');
  if(!lbl)return;
  if(IS_ACCOUNTANT_MI){
    const sel=document.createElement('select');
    sel.style.cssText='font-family:var(--font);font-size:0.8rem;border:1px solid var(--border);border-radius:8px;padding:4px 10px;background:#fff;color:var(--text-primary);cursor:pointer;';
    BRANCHES_MI.forEach(b=>{
      const o=document.createElement('option');
      o.value=b; o.textContent=b;
      if(b===USER_BRANCH)o.selected=true;
      sel.appendChild(o);
    });
    sel.addEventListener('change',e=>{
      USER_BRANCH=e.target.value;
      loadWallet();
    });
    lbl.parentNode.replaceChild(sel,lbl);
  }else{
    lbl.textContent=USER_BRANCH||'غير محدد';
  }
})();

const POSMGMT_URL='https://agent.ebrahimhamdy.com/webhook/posmanagement';
const POSUPDATE_URL='https://agent.ebrahimhamdy.com/webhook/posupdate';
async function posUpdate(payload){
  const r=await fetch(POSUPDATE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const t=await r.text();let d=t&&t.trim()?JSON.parse(t):{};if(Array.isArray(d))d=d[0]||{};return d;
}

// ترتيب الأعمدة حسب الشاشة الجديدة (اللصق من اليسار لليمين):
// تاريخ | فاتورة بيع | ن.رسوم تحصيل | القيمة | الإسم | البنك | ت.صلاحية | الرقم | العميل | تحصيل
const EXPECTED_COLS=['تاريخ','فاتورة بيع','ن.رسوم تحصيل','القيمة','الإسم','البنك','ت.صلاحية','الرقم','العميل','تحصيل'];
let ROWS=[],WALLET=[],LINKS=[],CASH2WALLET=[];
let C2W_BILL_NOS=new Set();
let SEL_R=new Set(),SEL_L=new Set();

/* ====== حفظ مؤقت للجدول المستورد في المتصفح — يمنع ضياعه لو حصل Refresh بالغلط ====== */
const LS_ROWS='machineImport.rows.v1';
function saveRowsLocal(){
  try{ localStorage.setItem(LS_ROWS, JSON.stringify(ROWS.map(r=>({id:r.id,byCol:r.byCol,names:r.names,sigKey:r.sigKey})))); }
  catch(e){}
}
function loadRowsLocal(){
  try{
    const raw=localStorage.getItem(LS_ROWS);
    if(!raw)return;
    const arr=JSON.parse(raw);
    if(Array.isArray(arr)&&arr.length) ROWS=arr;
  }catch(e){}
}

function parsePastedText(text){
  const lines=text.split(/\r\n|\n|\r/).map(l=>l.trim()).filter(l=>l.length);
  return lines.map(l=>l.split('\t').map(c=>c.trim()));
}
function detectColumnCount(rows){
  if(!rows.length)return 0;
  const counts={};rows.forEach(r=>{counts[r.length]=(counts[r.length]||0)+1;});
  return +Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function rowSignature(row){return row.names.map(n=>String(row.byCol[n]??'').trim()).join('|');}

const EXPECTED_SET=new Set(EXPECTED_COLS);

function isHeaderRow(cells){
  return cells.filter(c=>EXPECTED_SET.has(String(c).trim())).length>=3;
}

function buildRowsFromParsed(parsed){
  if(!parsed.length)return[];
  let names=null,dataRows=parsed;

  for(let i=0;i<Math.min(3,parsed.length);i++){
    const fwd=parsed[i].map(c=>String(c).trim());
    const rev=[...fwd].reverse();
    const fwdMatch=fwd.filter(c=>EXPECTED_SET.has(c)).length;
    const revMatch=rev.filter(c=>EXPECTED_SET.has(c)).length;
    if(fwdMatch>=3||revMatch>=3){
      // اختار الاتجاه اللي "العميل" فيه أول (اليمين) أو الأكثر تطابقاً
      const fwdFirst=fwd.indexOf('العميل');
      const revFirst=rev.indexOf('العميل');
      if(fwdFirst>=0||revFirst>=0){
        names=(fwdFirst===0||(revFirst>0&&fwdFirst<0))?fwd:rev;
      }else{
        names=fwdMatch>=revMatch?fwd:rev;
      }
      dataRows=parsed.slice(i+1);
      break;
    }
  }

  if(names){
    return dataRows
      .filter(cells=>cells.some(v=>String(v).trim()!==''))
      .map((cells,idx)=>{
        const byCol={};names.forEach((name,i)=>byCol[name]=String(cells[i]??'').trim());
        const row={id:'imp-'+idx+'-'+Date.now()+'-'+Math.floor(Math.random()*9999),byCol,names};
        row.sigKey=hashStr(rowSignature(row));return row;
      });
  }

  // مفيش رأس — اعكس الخلايا (RTL) واستخدم الأعمدة المتوقعة
  const ncol=detectColumnCount(parsed);
  const usable=parsed.filter(r=>r.length===ncol);
  const isExpected=ncol===EXPECTED_COLS.length;
  const colNames=isExpected?EXPECTED_COLS:Array.from({length:ncol},(_,i)=>'عمود '+(i+1));
  return usable.map((cells,idx)=>{
    const byCol={};colNames.forEach((name,i)=>byCol[name]=cells[i]??'');
    const row={id:'imp-'+idx+'-'+Date.now()+'-'+Math.floor(Math.random()*9999),byCol,names:colNames};
    row.sigKey=hashStr(rowSignature(row));return row;
  });
}

const zone=$('#paste-zone');
zone.addEventListener('paste',e=>{
  e.preventDefault();
  const text=e.clipboardData.getData('text/plain');
  if(!text||!text.trim()){toast('مفيش نص في الكليب بورد','err');return;}
  const parsed=parsePastedText(text);
  if(!parsed.length){toast('متقدرش أقرا الجدول الملصوق','err');return;}
  ROWS=buildRowsFromParsed(parsed);
  SEL_R=new Set();
  saveRowsLocal();
  zone.innerHTML='<i class="fas fa-check-circle" style="color:#16a34a;"></i> تم — '+ROWS.length+' صف. تقدر تلصق جدول جديد فوق ده لو حبيت.';
  applyLinksToData();
  buildMachineFilters();
  renderAll();
  toast('تم استيراد '+ROWS.length+' صف','ok');
});
$('#btn-clear').onclick=()=>{
  ROWS=[];SEL_R=new Set();
  localStorage.removeItem(LS_ROWS);
  zone.innerHTML='<i class="fas fa-paste"></i> اضغط هنا والصق الجدول (Ctrl+V)<div class="hint">منسوخ مباشرة من السيستم — هيتفكك تلقائياً لصفوف وأعمدة</div>';
  renderAll();
};
$('#btn-refresh-wallet').onclick=loadWallet;

function normWallet(r){
  const store=(r.branch||'').trim();
  let srcLabel='محفظة',src='other';
  const to=String(r.to||'').toLowerCase();
  const sourceFld=String(r.source||'').toLowerCase();
  if(String(r.type||'').toUpperCase()==='SALE'||to.includes('paymob')||sourceFld==='paymob'){src='paymob';srcLabel='Paymob';}
  else if(to.includes('orange')){src='orange';srcLabel='أورنج كاش';}
  else if(to.includes('vodafone')){src='vodafone';srcLabel='فودافون كاش';}
  else if(to.includes('instapay')||sourceFld==='instapay'){src='instapay';srcLabel='إنستاباي';}
  else if(to.includes('fawry')||to.includes('فورى')||to.includes('فوري')){src='fawry';srcLabel='فوري';}
  const typeRaw=String(r.type||'').trim();
  let dir=null,dirLabel='';
  if(typeRaw==='استلام'){dir='in';dirLabel='استلام';}
  else if(typeRaw==='إرسال'||typeRaw==='ارسال'){dir='out';dirLabel='إرسال';}
  return{
    id:'wal-'+(r.id??Math.random()),raw:r,
    amount:num(r.ammount??r.amount),store,storeKey:normBranchKey(store),
    to:r.to||'',terminal:r.terminal_id||'',src,srcLabel,dir,dirLabel,
    date:r.transaction_time||r.createdAt,bill_no:String(r.bill_no??'').trim(),
    closed:(r.closed===true||r.closed==='true')
  };
}
async function loadWallet(){
  try{
    const res=await fetch(POSMGMT_URL);
    const data=await res.json();
    const o=Array.isArray(data)?data[0]:data;
    const all=(Array.isArray(o.wallet)?o.wallet:[]).map(normWallet);
    const bk=normBranchKey(USER_BRANCH);
    WALLET=bk?all.filter(w=>w.storeKey===bk):all;
    LINKS=Array.isArray(o.links)?o.links:[];
    CASH2WALLET=(Array.isArray(o.cash_to_wallet)?o.cash_to_wallet:[]).map(r=>({
      id:r.id,bill_no:r.bill_no,branch:r.branch,
      invoice_amount:num(r.invoice_amount),transaction_value:num(r.transaction_value),
      customer_name:r.customer_name,created_at:r.created_at,
      disbursed:(r.disbursed===true||r.disbursed==='true'),disbursed_at:r.disbursed_at
    }));
    C2W_BILL_NOS=new Set(CASH2WALLET.map(r=>String(r.bill_no||'').trim()).filter(Boolean));
    applyLinksToData();
    buildMachineFilters();
    renderAll();
    renderC2W();
  }catch(e){ toast('فشل تحميل البيانات','err'); }
}
loadRowsLocal();
if(ROWS.length){
  zone.innerHTML='<i class="fas fa-check-circle" style="color:#16a34a;"></i> تم استرجاع '+ROWS.length+' صف محفوظ من قبل. تقدر تلصق جدول جديد فوق ده لو حبيت.';
}
loadWallet();

function applyLinksToData(){
  const activeLinks=LINKS.filter(l=>!(l.closed===true||l.closed==='true'));
  const bySig={},byWallet={};
  activeLinks.forEach(l=>{
    if(l.row_sig){(bySig[l.row_sig]=bySig[l.row_sig]||[]).push(l);}
    if(l.wallet_id!=null){(byWallet[String(l.wallet_id)]=byWallet[String(l.wallet_id)]||[]).push(l);}
  });
  ROWS.forEach(r=>{ r.links=bySig[r.sigKey]||[]; });
  WALLET.forEach(w=>{
    const rawId=String((w.raw&&w.raw.id!=null)?w.raw.id:w.id);
    w.links=byWallet[rawId]||[];
  });
}

function buildMachineFilters(){
  const rSel=$('#right-machine-filter'), lSel=$('#left-machine-filter');
  const rVal=rSel.value, lVal=lSel.value;
  const rMachines=[...new Set(ROWS.map(r=>r.byCol['البنك']).filter(Boolean))].sort();
  const lMachines=[...new Set(WALLET.map(w=>w.to||w.srcLabel).filter(Boolean))].sort();
  rSel.innerHTML='<option value="">كل الماكينات</option>'+rMachines.map(m=>'<option value="'+m+'">'+m+'</option>').join('');
  lSel.innerHTML='<option value="">كل الماكينات</option>'+lMachines.map(m=>'<option value="'+m+'">'+m+'</option>').join('');
  if(rMachines.includes(rVal))rSel.value=rVal;
  if(lMachines.includes(lVal))lSel.value=lVal;
}
$('#right-machine-filter').addEventListener('change',renderRight);
$('#left-machine-filter').addEventListener('change',renderLeft);
$('#right-link-filter').addEventListener('change',renderRight);
$('#left-link-filter').addEventListener('change',renderLeft);
$('#left-amt-search').addEventListener('input',renderLeft);

function renderAll(){ renderRight(); renderLeft(); renderConfirmBar(); }

/* ====== تجميع زي الإكسيل: تحديد خلايا/أعمدة وجمعها ====== */
let SUM_SEL=new Set();      // مفاتيح "rowIndex|colName" المحدّدة
let SUM_LAST=null;          // آخر خلية ضغطنا عليها (لدعم التحديد بالسحب/Shift)
let CUR_RIGHT_ROWS=[];      // الصفوف المعروضة حالياً بعد الفلترة (لحساب نطاق Shift)

function cellKey(rowIdx,col){ return rowIdx+'|'+col; }

function selectColumn(col){
  // لو العمود ده محدّد بالكامل أصلاً، نشيله. غير كده نحدّده بالكامل (بدل أي تحديد سابق)
  const allKeys=CUR_RIGHT_ROWS.map((r,i)=>cellKey(i,col));
  const fullySelected=allKeys.length && allKeys.every(k=>SUM_SEL.has(k));
  SUM_SEL=new Set();
  if(!fullySelected) allKeys.forEach(k=>SUM_SEL.add(k));
  SUM_LAST=null;
  renderRightBody();
}

function clickCell(rowIdx,col,ev){
  const key=cellKey(rowIdx,col);
  if(ev.shiftKey && SUM_LAST && SUM_LAST.col===col){
    // تحديد نطاق من آخر خلية لحد دلوقتي (في نفس العمود)، زي شِفت في الإكسيل
    const a=Math.min(SUM_LAST.rowIdx,rowIdx), b=Math.max(SUM_LAST.rowIdx,rowIdx);
    SUM_SEL=new Set();
    for(let i=a;i<=b;i++) SUM_SEL.add(cellKey(i,col));
  }else if(ev.ctrlKey||ev.metaKey){
    // إضافة/إزالة خلية واحدة من التحديد الحالي
    if(SUM_SEL.has(key)) SUM_SEL.delete(key); else SUM_SEL.add(key);
    SUM_LAST={rowIdx,col};
  }else{
    // ضغطة عادية: تحديد خلية واحدة بس
    SUM_SEL=new Set([key]);
    SUM_LAST={rowIdx,col};
  }
  renderRightBody();
}

function computeSum(){
  let sum=0,count=0;
  SUM_SEL.forEach(key=>{
    const [rowIdxStr,col]=key.split('|');
    const r=CUR_RIGHT_ROWS[+rowIdxStr]; if(!r)return;
    const v=num(r.byCol[col]);
    if(!isNaN(v)){ sum+=v; count++; }
  });
  const bar=$('#sum-bar');
  if(!SUM_SEL.size){ bar.style.display='none'; return; }
  bar.style.display='inline-block';
  bar.textContent='Σ المجموع: '+fmtNum(sum)+' ('+count+' من '+SUM_SEL.size+' خلية)';
}

function renderRight(){
  const mf=$('#right-machine-filter').value;
  const lf=$('#right-link-filter').value; // 'open','closed','all'
  CUR_RIGHT_ROWS=ROWS.filter(r=>{
    if(mf && r.byCol['البنك']!==mf) return false;
    const linked=!!(r.links&&r.links.length);
    if(lf==='open') return !linked;
    if(lf==='closed') return linked;
    return true;
  });
  $('#right-cnt').textContent=CUR_RIGHT_ROWS.length+' صف';
  $('#row-count').textContent=ROWS.length;
  SUM_SEL=new Set(); SUM_LAST=null;
  renderRightBody();
}

function colClass(n){
  if(n==='الرقم')return 'col-card';
  if(n==='القيمة')return 'col-amount';
  if(n==='البنك')return 'col-bank';
  return '';
}

function editBankCell(rowId,currentVal,tdEl){
  // بناء قائمة البنوك الموجودة في الجدول حالياً
  const bankOptions=[...new Set(ROWS.map(r=>r.byCol['البنك']).filter(Boolean))].sort();
  const dlId='bank-dl-'+Date.now();
  const dl=document.createElement('datalist');
  dl.id=dlId;
  bankOptions.forEach(b=>{const o=document.createElement('option');o.value=b;dl.appendChild(o);});
  document.body.appendChild(dl);

  const inp=document.createElement('input');
  inp.value=currentVal;
  inp.setAttribute('list',dlId);
  inp.style.cssText='width:110px;font-size:0.75rem;border:1px solid #6366f1;border-radius:4px;padding:2px 4px;font-family:var(--font);';
  tdEl.innerHTML=''; tdEl.appendChild(inp); inp.focus(); inp.select();

  const save=()=>{
    const newVal=inp.value.trim()||currentVal;
    const r=ROWS.find(x=>x.id===rowId); if(r) r.byCol['البنك']=newVal;
    dl.remove();
    saveRowsLocal(); buildMachineFilters(); renderAll();
  };
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){inp.value=currentVal;dl.remove();inp.blur();} });
}
function renderRightBody(){
  const body=$('#right-body');
  const rows=CUR_RIGHT_ROWS;
  computeSum();
  if(!rows.length){ body.innerHTML='<div class="empty-hint">لا توجد صفوف مطابقة. الصق جدول أو غيّر الفلتر.</div>'; return; }
  const names=rows[0].names;
  const thead='<tr><th class="pick-col"></th>'+names.map(n=>{
    const allKeys=rows.map((r,i)=>cellKey(i,n));
    const fullySel=allKeys.length && allKeys.every(k=>SUM_SEL.has(k));
    return '<th class="'+colClass(n)+' '+(fullySel?'col-sel':'')+'" onclick="selectColumn(\''+n+'\')" title="اضغط لتحديد/تجميع العمود كله">'+n+'</th>';
  }).join('')+'</tr>';
  const tbody=rows.map((r,idx)=>{
    const linked=r.links&&r.links.length;
    const sel=SEL_R.has(r.id);
    const billNo=String(r.byCol['فاتورة بيع']||'').trim();
    const flagged=billNo && C2W_BILL_NOS.has(billNo);
    const cells=names.map(n=>{
      const v=r.byCol[n];
      const csel=SUM_SEL.has(cellKey(idx,n));
      if(n==='البنك'){
        return '<td class="'+colClass(n)+' '+(csel?'cell-sel':'')+'" ondblclick="editBankCell(\''+r.id+'\',\''+String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\',this)" title="دوبل كليك للتعديل">'+(v||'')+'</td>';
      }
      return '<td class="'+colClass(n)+' '+(csel?'cell-sel':'')+'" onclick="clickCell('+idx+',\''+n+'\',event)">'+(v||'')+'</td>';
    }).join('');
    return '<tr class="'+(linked?'linked':'')+' '+(sel?'row-sel':'')+'" data-id="'+r.id+'"'+(flagged?' style="background:#fee2e2;" title="فاتورة بيع موجودة في فواتير مختلفة عن قيم التحويل أو إيصال الفيزا — ايصال الدفع بتاعها مختلف"':'')+'>'+
      '<td class="pick-cell" onclick="event.stopPropagation();toggleSel(\'R\',\''+r.id+'\')"><div class="pick-dot" style="margin:0 auto;">'+(sel?'<i class="fas fa-check" style="font-size:0.55rem"></i>':'')+'</div></td>'+
      cells+'</tr>';
  }).join('');
  body.innerHTML='<table class="imp-full-table"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>';
}
function renderLeft(){
  const body=$('#left-body');
  const mf=$('#left-machine-filter').value;
  const lf=$('#left-link-filter').value; // 'open','closed','all'
  const searchAmt=parseFloat($('#left-amt-search').value);
  let rows=WALLET.filter(w=>{
    if(mf && w.to!==mf && w.srcLabel!==mf) return false;
    if(lf==='open') return !w.closed;
    if(lf==='closed') return w.closed;
    return true;
  });
  if(!isNaN(searchAmt)){
    // رتّب بالأقرب للقيمة المبحوث عنها، ولو تساوى الفرق رتّب بالأحدث
    rows.sort((a,b)=>{
      const da=Math.abs((a.amount||0)-searchAmt), db=Math.abs((b.amount||0)-searchAmt);
      if(Math.abs(da-db)>0.001) return da-db;
      return new Date(b.date||0)-new Date(a.date||0);
    });
  }else{
    rows.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  }
  $('#left-cnt').textContent=rows.length+' معاملة';
  if(!rows.length){ body.innerHTML='<div class="empty-hint">لا توجد معاملات مطابقة.</div>'; return; }
  body.innerHTML=rows.map((w,idx)=>{
    const sel=SEL_L.has(w.id);
    const dirChip=w.dir?('<span class="dchip-'+w.dir+'"><i class="fas fa-arrow-'+(w.dir==='in'?'down':'up')+'"></i> '+w.dirLabel+'</span>'):'';
    const isClosest=!isNaN(searchAmt)&&idx===0;
    return '<div class="row-item '+(w.closed?'linked':'')+' '+(sel?'sel':'')+'" data-id="'+w.id+'" onclick="toggleSel(\'L\',\''+w.id+'\')"'+(isClosest?' style="border-right:3px solid #f59e0b;"':'')+'>'+
      '<div class="pick-dot">'+(sel?'<i class="fas fa-check" style="font-size:0.6rem"></i>':'')+'</div>'+
      '<div class="row-body">'+
        '<div class="row-top"><span class="row-amt">'+fmtNum(w.amount)+' ج</span>'+dirChip+(isClosest?'<span style="background:#fef3c7;color:#92400e;padding:1px 7px;border-radius:20px;font-size:0.66rem;font-weight:700;">الأقرب</span>':'')+
        '<span class="mchip">'+(w.to||w.srcLabel)+'</span>'+(w.terminal?'<span class="lchip">'+w.terminal+'</span>':'')+(w.closed?'<span class="lchip">تم ✓</span>':'')+'</div>'+
        '<div class="row-meta"><span>'+w.srcLabel+'</span><span>'+new Date(w.date||0).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})+'</span></div>'+
      '</div></div>';
  }).join('');
}

function toggleSel(side,id){
  const set=side==='R'?SEL_R:SEL_L;
  if(set.has(id))set.delete(id);else set.add(id);
  if(side==='R')renderRightBody();else renderLeft();
  renderConfirmBar();
}

function renderConfirmBar(){
  const bar=$('#confirm-bar');
  if(!SEL_R.size && !SEL_L.size){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const rSum=[...SEL_R].reduce((s,id)=>{const r=ROWS.find(x=>x.id===id);return s+(r?num(r.byCol['القيمة'])||0:0);},0);
  const lSum=[...SEL_L].reduce((s,id)=>{const w=WALLET.find(x=>x.id===id);return s+(w?w.amount||0:0);},0);
  $('#cb-right').textContent=SEL_R.size; $('#cb-right-sum').textContent=fmtNum(rSum);
  $('#cb-left').textContent=SEL_L.size; $('#cb-left-sum').textContent=fmtNum(lSum);
}
$('#cb-cancel').onclick=()=>{ SEL_R=new Set(); SEL_L=new Set(); renderAll(); };
$('#cb-confirm').onclick=confirmLinking;

async function confirmLinking(){
  if(!SEL_R.size && !SEL_L.size){ toast('اختَر صفوف أو معاملات أولاً','err'); return; }
  const btn=$('#cb-confirm'); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  const rightRows=[...SEL_R].map(id=>ROWS.find(r=>r.id===id)).filter(Boolean);
  const leftWals=[...SEL_L].map(id=>WALLET.find(w=>w.id===id)).filter(Boolean);
  const now=new Date().toISOString();
  try{
    // يمين: كل صف لوحده — لو مش متسجّل في links يتسجّل، لو متسجّل يتمسح (تراجع)
    for(const r of rightRows){
      if(r.links && r.links.length){
        for(const l of r.links){ if(l.id!=null) await posUpdate({table:'links',action:'delete',id:l.id}); }
      }else{
        await posUpdate({table:'links',action:'insert',data:{
          wallet_id:'', row_sig:r.sigKey, branch:USER_BRANCH,
          amount:String(num(r.byCol['القيمة'])||''), customer_name:r.byCol['العميل']||'',
          card_number:r.byCol['الرقم']||'', sale_invoice_no:r.byCol['فاتورة بيع']||'',
          row_date:r.byCol['تاريخ']||'', machine:r.byCol['البنك']||'', created_at:now
        }});
      }
    }
    // شمال: كل معاملة لوحدها — تبديل closed على الجدول الصح حسب نوع المعاملة
    for(const w of leftWals){
      const rawWalId=(w.raw&&w.raw.id!=null)?w.raw.id:w.id;
      const isInstapay=w.src==='instapay'||String(rawWalId).startsWith('bm');
      if(isInstapay){
        await posUpdate({_route:'instapay',id:rawWalId,data:{closed:!w.closed}});
      }else{
        await posUpdate({table:'wallet',action:'update',id:rawWalId,data:{closed:!w.closed}});
      }
    }
    toast('تم التحديث','ok');
  }catch(e){
    toast('تأخّر الرد — بنحدّث الشاشة للتأكد من الحالة الفعلية','err');
  }
  SEL_R=new Set(); SEL_L=new Set();
  await loadWallet();
  btn.disabled=false; btn.innerHTML='<i class="fas fa-check"></i> تأكيد التحديث';
}

async function disburseC2W(id){
  if(!confirm('تأكيد صرف المبلغ من نقطة البيع؟'))return;
  try{ await posUpdate({table:'cash_to_wallet',action:'update',id,data:{disbursed:true,disbursed_at:new Date().toISOString()}}); toast('تم الصرف','ok'); }
  catch(e){ toast('تأخّر الرد — بنحدّث الشاشة','err'); }
  await loadWallet();
}
async function deleteC2W(id){
  if(!confirm('حذف هذا السطر نهائياً؟'))return;
  try{ await posUpdate({table:'cash_to_wallet',action:'delete',id}); toast('تم الحذف','ok'); }
  catch(e){ toast('تأخّر الرد — بنحدّث الشاشة','err'); }
  await loadWallet();
}
function renderC2W(){
  const area=$('#c2w-area');
  const bk=normBranchKey(USER_BRANCH);
  const active=CASH2WALLET.filter(r=>!r.disbursed && (!bk || normBranchKey(r.branch||'')===bk));
  if(!active.length){ area.innerHTML='<div class="empty-hint">لا توجد فواتير محوّلة معلّقة حالياً.</div>'; return; }

  // بناء خريطة رقم الفاتورة → البنك من الجدول المستورد
  const billToBank={};
  ROWS.forEach(r=>{
    const bill=String(r.byCol['فاتورة بيع']||'').trim();
    const bank=String(r.byCol['البنك']||'').trim();
    if(bill&&bank) billToBank[bill]=bank;
  });

  // إضافة البنك لكل سطر + حساب الفرق
  const enriched=active.map(r=>({
    ...r,
    bank: billToBank[String(r.bill_no||'').trim()]||'غير محدد',
    diff: (r.transaction_value||0)-(r.invoice_amount||0)
  }));

  // تجميع بالفرع أولاً ثم بالبنك
  const byBranch={};
  enriched.forEach(r=>{ const b=r.branch||'—'; (byBranch[b]=byBranch[b]||[]).push(r); });

  area.innerHTML=Object.keys(byBranch).sort().map(branch=>{
    const rows=byBranch[branch];

    // تجميع الفروق بالبنك
    const bankSums={};
    rows.forEach(r=>{ (bankSums[r.bank]=bankSums[r.bank]||{count:0,diff:0}).count++; bankSums[r.bank].diff+=r.diff; });
    const bankSummary=Object.entries(bankSums).map(([bank,s])=>{
      const col=s.diff>0?'#15803d':s.diff<0?'#b91c1c':'#64748b';
      return '<span style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:3px 10px;font-size:0.72rem;font-weight:700;display:inline-flex;align-items:center;gap:5px;">'+
        '<span style="color:#475569;">'+bank+'</span>'+
        '<span style="color:'+col+';">'+(s.diff>0?'+':'')+fmtNum(s.diff)+' ج</span>'+
        '<span style="color:#94a3b8;">('+s.count+')</span></span>';
    }).join(' ');

    const sum=rows.reduce((s,r)=>s+(r.transaction_value||0),0);
    return '<div class="branch-group-head">'+branch+' — '+fmtNum(sum)+' ج ('+rows.length+')</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px;padding:0 4px;">'+bankSummary+'</div>'+
      '<table class="c2w-table"><thead><tr><th>الفاتورة</th><th>العميل</th><th>البنك</th><th class="num">قيمة الفاتورة</th><th class="num">قيمة المعاملة</th><th class="num">الفرق</th><th></th></tr></thead><tbody>'+
      rows.map(r=>{
        const col=r.diff>0?'#15803d':r.diff<0?'#b91c1c':'#64748b';
        return '<tr><td>'+r.bill_no+'</td><td>'+(r.customer_name||'—')+'</td>'+
          '<td style="font-size:0.72rem;color:#6d28d9;font-weight:700;">'+(r.bank||'—')+'</td>'+
          '<td class="num mono">'+fmtNum(r.invoice_amount)+'</td>'+
          '<td class="num mono">'+fmtNum(r.transaction_value)+'</td>'+
          '<td class="num mono" style="color:'+col+';font-weight:800;">'+(r.diff>0?'+':'')+fmtNum(r.diff)+'</td>'+
          '<td><button class="btn btn-ghost" style="padding:4px 9px;font-size:0.7rem;color:#dc2626" onclick="deleteC2W('+r.id+')"><i class="fas fa-trash"></i></button></td></tr>';
      }).join('')+
      '</tbody></table>';
  }).join('');
}

renderAll();
