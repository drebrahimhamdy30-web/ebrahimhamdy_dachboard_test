<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>استيراد جدول الماكينات - Phalix</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root{
    --font: 'Tajawal',system-ui,sans-serif;
    --surface:#fff; --surface-2:#1e293b; --surface-3:#f1f5f9;
    --border:#e2e8f0; --text-primary:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
    --accent:#3b82f6; --accent-dark:#1d4ed8; --success:#16a34a; --danger:#dc2626; --warning:#d97706;
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  }
  body{font-family:var(--font);background:#f8fafc;margin:0;color:var(--text-primary);}
  .container{max-width:1300px;margin:0 auto;padding:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.05);}
  .page-title{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 0 14px;}
  .page-title i{color:var(--accent);}

  .paste-zone{
    border:2px dashed #93c5fd;border-radius:var(--radius-md);background:#eff6ff;
    min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;cursor:text;padding:20px;text-align:center;color:#1d4ed8;font-weight:700;
    outline:none;transition:.15s;
  }
  .paste-zone:focus,.paste-zone.drag{background:#dbeafe;border-color:#3b82f6;}
  .paste-zone .hint{font-size:0.82rem;color:#3b82f6;font-weight:600;}
  .paste-zone .big-icon{font-size:1.8rem;}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0;}
  .toolbar .stat{background:var(--surface-3);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:0.8rem;font-weight:700;color:var(--text-secondary);}
  .toolbar .stat b{color:var(--text-primary);}
  .btn{border:none;border-radius:var(--radius-sm);padding:8px 16px;font-family:var(--font);font-weight:700;font-size:0.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:var(--surface-3);color:var(--text-secondary);}
  .btn-ghost:hover{background:#e2e8f0;}
  .btn-danger{background:#fee2e2;color:#b91c1c;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  table.imp-table{width:100%;border-collapse:collapse;font-size:0.82rem;margin-top:8px;}
  table.imp-table th{background:var(--surface-3);padding:8px 10px;text-align:start;font-weight:800;border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;}
  table.imp-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
  table.imp-table tr:hover td{background:#fafbfc;}
  .table-wrap{max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-md);}
  .col-amount{font-weight:800;color:var(--accent-dark);font-variant-numeric:tabular-nums;}
  .col-machine{display:inline-flex;align-items:center;gap:5px;background:#fae8ff;color:#a21caf;padding:2px 9px;border-radius:20px;font-size:0.72rem;font-weight:700;}
  .col-yes{color:var(--success);font-weight:700;}
  .col-no{color:var(--danger);font-weight:700;}
  .empty-hint{text-align:center;color:var(--text-muted);padding:40px;font-size:0.9rem;}
</style>
</head>
<body>
<div class="nav-bar"></div>
<div class="container">
  <div class="card">
    <div class="page-title"><i class="fas fa-file-import"></i> استيراد جدول الماكينات (لصق)</div>

    <div id="paste-zone" class="paste-zone" contenteditable="true" tabindex="0">
      <i class="fas fa-paste big-icon"></i>
      <div>اضغط هنا والصق الجدول (Ctrl+V)</div>
      <div class="hint">منسوخ مباشرة من السيستم — هيتفكك تلقائياً لصفوف وأعمدة</div>
    </div>

    <div class="toolbar">
      <span class="stat">عدد الصفوف: <b id="row-count">0</b></span>
      <span class="stat">إجمالي القيمة: <b id="row-sum">0.00</b> ج</span>
      <span class="stat">الفرع: <b id="branch-label">...</b></span>
      <span class="stat" style="background:#dcfce7;color:#15803d;">مرتبط: <b id="row-matched">0</b></span>
      <button class="btn btn-ghost" id="btn-clear"><i class="fas fa-trash"></i> مسح والبدء من جديد</button>
    </div>

    <div id="table-area">
      <div class="empty-hint">لسه مفيش بيانات ملصوقة. الصق الجدول في الخانة فوق.</div>
    </div>
  </div>

  <div class="card" id="leftover-card" style="margin-top:16px;display:none;">
    <div class="page-title"><i class="fas fa-wallet" style="color:#a21caf;"></i> معاملات المحافظ/الفيزا المتبقية (بلا ربط) <span id="leftover-count" style="font-size:0.8rem;color:var(--text-muted);font-weight:600;"></span></div>
    <div id="leftover-area"></div>
  </div>
</div>

<!-- Modal اختيار المعاملة -->
<div id="pick-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:18px;width:94%;max-width:560px;max-height:84vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-weight:800;font-size:0.95rem;"><i class="fas fa-link" style="color:var(--accent);"></i> اختار المعاملة المقابلة</div>
      <button onclick="closePicker()" style="background:none;border:none;font-size:1.1rem;color:var(--text-muted);cursor:pointer;">✕</button>
    </div>
    <div id="pick-info" style="font-size:0.82rem;color:var(--text-secondary);background:var(--surface-3);border-radius:10px;padding:8px 12px;margin-bottom:10px;"></div>
    <div id="pick-list"></div>
  </div>
</div>

<div class="toast" id="toast" style="position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:10px;font-size:0.85rem;font-weight:700;display:none;z-index:9999;"></div>

<script src="nav.js"></script>
<script>
const $=s=>document.querySelector(s);

/* ====== توست بسيط ====== */
let toastT=null;
function toast(msg,type){
  const t=$('#toast');
  t.textContent=msg;
  t.style.background= type==='err' ? '#dc2626' : (type==='ok' ? '#16a34a' : '#0f172a');
  t.style.display='block';
  clearTimeout(toastT);
  toastT=setTimeout(()=>{t.style.display='none';},2500);
}

/* ====== الأعمدة المتوقعة من جدول الماكينات (حسب الصورة) ======
   الترتيب من اليمين لليسار في السيستم الأصلي، لكن النسخ بيجي LTR
   بالترتيب: العميل، الرقم، ت.صلاحية، البنك، الإسم، القيمة، ن.رسوم تحصيل، فاتورة بيع، تاريخ، تحصيل */
const EXPECTED_COLS = ['العميل','الرقم','ت.صلاحية','البنك','الإسم','القيمة','ن.رسوم تحصيل','فاتورة بيع','تاريخ','تحصيل'];

let ROWS=[];   // كل صف: {raw:[...], byCol:{...}}

/* ====== تفكيك النص الملصوق لصفوف وأعمدة ====== */
function parsePastedText(text){
  // الصفوف بسطر جديد، الأعمدة بـ Tab (نسخ من جدول/Excel/شاشة بيانات)
  const lines=text.split(/\r\n|\n|\r/).map(l=>l.trim()).filter(l=>l.length);
  const rows=lines.map(l=>l.split('\t').map(c=>c.trim()));
  return rows;
}

function numFromCell(s){
  const n=parseFloat(String(s||'').replace(/,/g,'').trim());
  return isFinite(n)?n:NaN;
}

function detectColumnCount(rows){
  if(!rows.length)return 0;
  // نفترض كل الصفوف بنفس عدد الأعمدة، أو ناخد الأكثر تكراراً
  const counts={};
  rows.forEach(r=>{counts[r.length]=(counts[r.length]||0)+1;});
  return +Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}

function buildRowsFromParsed(parsed){
  const ncol=detectColumnCount(parsed);
  const usable=parsed.filter(r=>r.length===ncol);
  // لو عدد الأعمدة يطابق الأعمدة المتوقعة، نسمّيها بالاسم. غير كده أعمدة عامة col1..colN
  const isExpected = ncol===EXPECTED_COLS.length;
  const names = isExpected ? EXPECTED_COLS : Array.from({length:ncol},(_,i)=>'عمود '+(i+1));
  // مهم: النص المنسوخ من الجدول بيجي بترتيب عكسي للترتيب البصري (RTL)،
  // يعني أول قيمة في الكليبورد بتخص آخر عمود ظاهر بصرياً (تحصيل)، مش أول عمود (العميل).
  // فبنعكس القيم وقت التوزيع، وبنسيب أسماء الأعمدة في وضعها الصح للعرض.
  return usable.map((cells,idx)=>{
    const ordered = isExpected ? [...cells].reverse() : cells;
    const byCol={};
    names.forEach((name,i)=>byCol[name]=ordered[i]??'');
    return { id:'imp-'+idx+'-'+Date.now(), raw:cells, byCol, names };
  });
}

/* ====== الفرع الحالي (نفس منطق صفحة التسوية) ====== */
const BRANCH_ALIAS = { 'الصيدلية':'المعمورة', 'ابراهيم حمدي 2':'سان ستيفانو', 'ابراهيم حمدي 3':'سيدى بشر' };
function normBranchKey(s){
  return String(s||'').trim()
    .replace(/\u0649/g,'\u064a').replace(/\u0629/g,'\u0647')
    .replace(/[\u0623\u0625\u0622]/g,'\u0627').replace(/\s+/g,' ');
}
const USER_BRANCH_RAW=(localStorage.getItem('userBranch')||'').trim();
const USER_BRANCH = BRANCH_ALIAS[USER_BRANCH_RAW] || USER_BRANCH_RAW;
$('#branch-label').textContent = USER_BRANCH || 'غير محدد';

/* ====== تحميل معاملات المحافظ/الفيزا (wallet) لنفس الفرع ====== */
const POSMGMT_URL='https://agent.ebrahimhamdy.com/webhook/posmanagement';
let WALLET=[];          // كل معاملات الفرع
let USED_WALLET=new Set(); // المعاملات اللي اترَبطت بصف من الجدول المستورد

function num(v){const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:NaN;}

function normWallet(r){
  const store=(r.branch||'').trim();
  let srcLabel='محفظة', src='other';
  const to=String(r.to||'').toLowerCase();
  if(String(r.type||'').toUpperCase()==='SALE'||to.includes('paymob')){src='paymob';srcLabel='Paymob';}
  else if(to.includes('orange')){src='orange';srcLabel='أورنج كاش';}
  else if(to.includes('vodafone')){src='vodafone';srcLabel='فودافون كاش';}
  else if(to.includes('instapay')){src='instapay';srcLabel='إنستاباي';}
  else if(to.includes('fawry')||to.includes('فورى')||to.includes('فوري')){src='fawry';srcLabel='فوري';}
  return {
    id:'wal-'+(r.id??Math.random()), raw:r,
    amount:num(r.ammount??r.amount), store, storeKey:normBranchKey(store),
    to:r.to||'', terminal:r.terminal_id||'', src, srcLabel,
    date:r.transaction_time||r.createdAt, bill_no:String(r.bill_no??'').trim()
  };
}

async function loadWallet(){
  try{
    const res=await fetch(POSMGMT_URL);
    const data=await res.json();
    const o=Array.isArray(data)?data[0]:data;
    const all=(Array.isArray(o.wallet)?o.wallet:[]).map(normWallet);
    const bk=normBranchKey(USER_BRANCH);
    WALLET = bk ? all.filter(w=>w.storeKey===bk) : all;
    LINKS = Array.isArray(o.links)?o.links:[];
    buildLinksIndex();
    if(ROWS.length){ applyExistingLinks(); renderTable(); }
    renderLeftover();
  }catch(e){ toast('فشل تحميل معاملات المحافظ/الفيزا','err'); }
}
loadWallet();

/* ====== كتابة في n8n (نفس آلية صفحة التسوية) ====== */
const POSUPDATE_URL='https://agent.ebrahimhamdy.com/webhook/posupdate';
async function posUpdate(payload){
  const r=await fetch(POSUPDATE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const t=await r.text();
  let d=t&&t.trim()?JSON.parse(t):{};
  if(Array.isArray(d))d=d[0]||{};
  return d;
}

/* ====== توقيع الصف الكامل (كل الأعمدة مع بعض) — عشان نتأكد إنه نفس الصف بالضبط لو لصقناه تاني ====== */
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; }
  return (h>>>0).toString(36);
}
function rowSignature(row){
  return row.names.map(n=>String(row.byCol[n]??'').trim()).join('|');
}

/* ====== خريطة الربط السابق (sig → سطر links) لتفادي تكرار نفس الصف ====== */
let LINKS=[];
let LINKS_BY_SIG={};
function buildLinksIndex(){
  LINKS_BY_SIG={};
  LINKS.filter(l=>!(l.closed===true||l.closed==='true')&&String(l.bill_no||'').startsWith('IMP-')).forEach(l=>{
    LINKS_BY_SIG[l.bill_no]=l;
  });
}

/* لو الصفوف المستوردة دلوقتي اتربط جزء منها قبل كده (نفس التوقيع بالظبط)، نطبّق الربط تلقائياً */
function applyExistingLinks(){
  ROWS.forEach(row=>{
    const sigKey='IMP-'+hashStr(rowSignature(row));
    row.sigKey=sigKey;
    const link=LINKS_BY_SIG[sigKey];
    if(!link)return;
    const w=WALLET.find(x=>String((x.raw&&x.raw.id!=null)?x.raw.id:x.id)===String(link.wallet_id));
    if(w){
      row.matchedWalletId=w.id;
      row.linkId=link.id;
      USED_WALLET.add(w.id);
    }
  });
}
let PICK_FOR=null;
function fmtDate(d){ if(!d)return ''; const t=new Date(d); return isNaN(t)?String(d):t.toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}); }

function bankMatchesWallet(bankText,w){
  const digits=(String(bankText||'').match(/\d+/g)||[]).join('');
  if(!digits)return false;
  return String(w.terminal||'').includes(digits) || String(w.to||'').includes(digits);
}

function openPicker(rowId){
  const row=ROWS.find(r=>r.id===rowId);
  if(!row)return;
  PICK_FOR=row;
  const amount=num(row.byCol['القيمة']);
  const dateStr=row.byCol['تاريخ'];
  const rowDate=dateStr?new Date(dateStr):null;
  const bankText=row.byCol['البنك'];

  const candidates=WALLET.filter(w=>!USED_WALLET.has(w.id)||w.id===row.matchedWalletId);
  candidates.forEach(w=>{
    w._amtDiff = isNaN(amount)||isNaN(w.amount) ? 999999 : Math.abs(amount-w.amount);
    w._dateDiff = (rowDate && w.date) ? Math.abs(new Date(w.date)-rowDate) : 999999999999;
    w._bankMatch = bankMatchesWallet(bankText,w) ? 0 : 1;
  });
  candidates.sort((a,b)=> a._bankMatch-b._bankMatch || a._amtDiff-b._amtDiff || a._dateDiff-b._dateDiff);

  $('#pick-info').innerHTML = `الصف: <b>${row.byCol['العميل']||'—'}</b> · القيمة <b style="color:var(--accent-dark);">${fmtNum(amount)} ج</b> · البنك <b>${bankText||'—'}</b>`;
  const list=$('#pick-list');
  if(!candidates.length){
    list.innerHTML='<div class="empty-hint">مفيش معاملات متاحة في هذا الفرع</div>';
  }else{
    list.innerHTML=candidates.slice(0,40).map(w=>{
      const diffTxt = w._amtDiff===0 ? '<span style="color:#15803d;font-weight:800;">مطابق تماماً</span>' : ('فرق '+fmtNum(w._amtDiff)+' ج');
      const bankTag = w._bankMatch===0 ? '<span style="background:#dcfce7;color:#15803d;border-radius:20px;padding:1px 8px;font-size:0.66rem;font-weight:700;margin-inline-start:6px;">نفس الماكينة</span>' : '';
      const isCurrent = w.id===row.matchedWalletId;
      return `<div onclick="pickWallet('${w.id}')" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid ${isCurrent?'#16a34a':'#e2e8f0'};${isCurrent?'background:#f0fdf4;':''}border-radius:10px;margin-bottom:6px;cursor:pointer;">
        <div style="font-size:0.8rem;color:var(--text-secondary);">
          <b style="color:var(--text-primary);">${w.srcLabel}</b> ${bankTag}<br>
          <span style="font-size:0.72rem;">${fmtDate(w.date)} ${w.terminal?(' · ترمنال '+w.terminal):''}</span><br>
          <span style="font-size:0.72rem;color:var(--text-muted);">${diffTxt}</span>
        </div>
        <div style="font-weight:800;color:var(--accent-dark);white-space:nowrap;">${fmtNum(w.amount)} ج</div>
      </div>`;
    }).join('');
  }
  $('#pick-overlay').style.display='flex';
}
function closePicker(){ $('#pick-overlay').style.display='none'; PICK_FOR=null; }

async function pickWallet(walId){
  if(!PICK_FOR)return;
  const row=PICK_FOR;
  const w=WALLET.find(x=>x.id===walId);
  if(!w)return;
  closePicker();

  // لو الصف كان مرتبط بمعاملة قبل كده، نفك القديمة الأول
  if(row.matchedWalletId && row.matchedWalletId!==walId) await unlinkRowBackend(row);

  row.matchedWalletId=walId;
  USED_WALLET.add(walId);
  renderTable();
  renderLeftover();

  // تسجيل الربط في جدول links — بتوقيع الصف الكامل عشان نمنع تكراره لو لُصق تاني
  try{
    const rawWalId=(w.raw&&w.raw.id!=null)?w.raw.id:w.id;
    const sigKey=row.sigKey||('IMP-'+hashStr(rowSignature(row)));
    row.sigKey=sigKey;
    const res=await posUpdate({table:'links',action:'insert',data:{
      wallet_id:String(rawWalId), bill_no:sigKey, branch:USER_BRANCH,
      amount:String(w.amount||''), created_at:new Date().toISOString(), closed:false
    }});
    const newId = res?.result?.id ?? res?.result?.[0]?.id;
    if(newId!=null){ row.linkId=newId; LINKS.push({id:newId,wallet_id:String(rawWalId),bill_no:sigKey,branch:USER_BRANCH,amount:String(w.amount||''),closed:false}); buildLinksIndex(); }
  }catch(e){ toast('تم الربط محلياً، لكن فشل تسجيله في القاعدة','err'); }
}

async function unlinkRowBackend(row){
  if(!row.linkId)return;
  try{
    await posUpdate({table:'links',action:'update',id:row.linkId,data:{
      wallet_id:'', bill_no:'', branch:'', amount:'0', created_at:'', closed:true
    }});
  }catch(e){}
  row.linkId=null;
}

async function unlinkRow(rowId){
  const row=ROWS.find(r=>r.id===rowId);
  if(!row||!row.matchedWalletId)return;
  USED_WALLET.delete(row.matchedWalletId);
  row.matchedWalletId=null;
  await unlinkRowBackend(row);
  renderTable();
  renderLeftover();
}

/* ====== عرض المعاملات المتبقية بلا ربط ====== */
function renderLeftover(){
  const card=$('#leftover-card'), area=$('#leftover-area'), cnt=$('#leftover-count');
  const left=WALLET.filter(w=>!USED_WALLET.has(w.id));
  if(!WALLET.length){ card.style.display='none'; return; }
  card.style.display='block';
  cnt.textContent='('+left.length+' من '+WALLET.length+')';
  if(!left.length){ area.innerHTML='<div class="empty-hint" style="padding:16px;">كل المعاملات اترَبطت ✓</div>'; return; }
  area.innerHTML='<div class="table-wrap" style="max-height:40vh;"><table class="imp-table"><thead><tr><th>المصدر</th><th>الماكينة/ترمنال</th><th>القيمة</th><th>الوقت</th></tr></thead><tbody>'+
    left.map(w=>`<tr><td>${w.srcLabel}</td><td>${w.to||'—'}${w.terminal?(' · '+w.terminal):''}</td><td class="col-amount">${fmtNum(w.amount)}</td><td>${fmtDate(w.date)}</td></tr>`).join('')+
    '</tbody></table></div>';
}

/* ====== استقبال اللصق ====== */
const zone=$('#paste-zone');
zone.addEventListener('paste',e=>{
  e.preventDefault();
  const text=e.clipboardData.getData('text/plain');
  if(!text||!text.trim()){ toast('مفيش نص في الكليب بورد','err'); return; }
  const parsed=parsePastedText(text);
  if(!parsed.length){ toast('متقدرش أقرا الجدول الملصوق','err'); return; }
  ROWS=buildRowsFromParsed(parsed);
  applyExistingLinks();
  zone.innerHTML='<i class="fas fa-check-circle" style="color:#16a34a;font-size:1.6rem;"></i><div>تم — '+ROWS.length+' صف. تقدر تلصق جدول جديد فوق ده لو حبيت.</div>';
  renderTable();
  const dup=ROWS.filter(r=>r.matchedWalletId).length;
  toast('تم استيراد '+ROWS.length+' صف'+(dup?(' — '+dup+' منهم متربط من قبل'):''),'ok');
});

$('#btn-clear').onclick=()=>{
  ROWS=[];
  zone.innerHTML='<i class="fas fa-paste big-icon"></i><div>اضغط هنا والصق الجدول (Ctrl+V)</div><div class="hint">منسوخ مباشرة من السيستم — هيتفكك تلقائياً لصفوف وأعمدة</div>';
  renderTable();
};

/* ====== عرض الجدول ====== */
function fmtNum(n){ return isNaN(n)?'—':n.toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function renderTable(){
  const area=$('#table-area');
  $('#row-count').textContent=ROWS.length;
  const sum=ROWS.reduce((s,r)=>{const v=numFromCell(r.byCol['القيمة']);return s+(isNaN(v)?0:v);},0);
  $('#row-sum').textContent=fmtNum(sum);
  $('#row-matched').textContent=ROWS.filter(r=>r.matchedWalletId).length;

  if(!ROWS.length){
    area.innerHTML='<div class="empty-hint">لسه مفيش بيانات ملصوقة. الصق الجدول في الخانة فوق.</div>';
    return;
  }

  const names=ROWS[0].names;
  const thead='<tr>'+names.map(n=>'<th>'+n+'</th>').join('')+'<th>المعاملة المقابلة</th></tr>';
  const tbody=ROWS.map(r=>{
    const cells=names.map(n=>{
      const v=r.byCol[n];
      if(n==='القيمة')return '<td class="col-amount">'+fmtNum(numFromCell(v))+'</td>';
      if(n==='البنك')return '<td><span class="col-machine"><i class="fas fa-credit-card"></i> '+v+'</span></td>';
      if(n==='تحصيل')return '<td class="'+(v==='نعم'?'col-yes':'col-no')+'">'+v+'</td>';
      return '<td>'+v+'</td>';
    }).join('');
    const w=r.matchedWalletId?WALLET.find(x=>x.id===r.matchedWalletId):null;
    const matchCell = w
      ? `<td><div style="display:flex;align-items:center;gap:6px;">
           <span style="background:${r.linkId?'#dcfce7':'#dbeafe'};color:${r.linkId?'#15803d':'#1d4ed8'};border-radius:20px;padding:3px 10px;font-size:0.72rem;font-weight:700;white-space:nowrap;"><i class="fas fa-check"></i> ${fmtNum(w.amount)} ج · ${w.srcLabel}${r.linkId?'':' (محلي)'}</span>
           <button class="btn btn-ghost" style="padding:4px 7px;" onclick="event.stopPropagation();unlinkRow('${r.id}')" title="فك الربط"><i class="fas fa-link-slash"></i></button>
         </div></td>`
      : `<td><button class="btn btn-primary" style="padding:5px 12px;font-size:0.76rem;" onclick="openPicker('${r.id}')"><i class="fas fa-link"></i> اختار المعاملة</button></td>`;
    return '<tr data-id="'+r.id+'">'+cells+matchCell+'</tr>';
  }).join('');

  area.innerHTML='<div class="table-wrap"><table class="imp-table"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
}

renderTable();
</script>
</body>
</html>
