<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة أرصدة الموردين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root{
    --primary:#1a56db;--primary-dark:#1344b0;--primary-light:#e8f0fe;
    --up:#15803d;--up-bg:#dcfce7;--down:#b91c1c;--down-bg:#fee2e2;
    --new:#1d4ed8;--new-bg:#e0e7ff;
    --text:#111827;--muted:#6b7280;--border:#e5e7eb;--bg:#f1f5f9;--white:#fff;--surface:#f8fafc;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;
    font-variant-numeric:tabular-nums;padding-bottom:40px}
  .wrap{max-width:100%;margin:0;padding:1rem 1.1rem}

  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:.9rem}
  .page-head h1{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:.5rem}
  .page-head .sub{font-size:.78rem;color:var(--muted);margin-top:.15rem}
  .ro-badge{background:#fef9c3;color:#854d0e;border:1px solid #fde68a;border-radius:20px;
    padding:.25rem .7rem;font-size:.72rem;font-weight:700;white-space:nowrap}

  .tabs{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1.5px solid var(--border);margin-bottom:1rem}
  .tab{background:none;border:none;font-family:inherit;color:var(--muted);padding:.6rem .9rem;font-size:.85rem;
    font-weight:700;cursor:pointer;border-radius:8px 8px 0 0;position:relative;display:inline-flex;align-items:center;gap:.4rem}
  .tab:hover{background:var(--gray-light,#f3f4f6);color:var(--text)}
  .tab.active{color:var(--primary);background:var(--primary-light)}
  .tab.active::after{content:'';position:absolute;inset-inline:0;bottom:-1.5px;height:2.5px;background:var(--primary);border-radius:2px}
  .tab .dot{min-width:19px;padding:0 5px;background:var(--red,#dc2626);color:#fff;border-radius:10px;font-size:.68rem;font-weight:800;line-height:18px;text-align:center}

  .card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1rem}
  .card h2{font-size:.92rem;font-weight:800;margin-bottom:.2rem;display:flex;align-items:center;gap:.4rem}
  .card .hint{font-size:.76rem;color:var(--muted);margin-bottom:.7rem}

  .meta{display:flex;gap:1.2rem;flex-wrap:wrap;padding:.7rem .9rem;background:var(--primary-light);
    border:1px solid #c7d7fb;border-radius:10px;margin-bottom:1rem}
  .meta div{font-size:.82rem}
  .meta b{display:block;font-size:.68rem;color:var(--primary-dark);font-weight:800;letter-spacing:.02em;margin-bottom:.1rem}

  textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--border);border-radius:10px;padding:.7rem;
    font-family:'Consolas','Courier New',monospace;font-size:.78rem;background:#fdfdfd;color:var(--text);direction:ltr;text-align:left}
  textarea:focus,input:focus{outline:2px solid var(--primary);outline-offset:1px}
  textarea:disabled,input:disabled{background:#f3f4f6;cursor:not-allowed;opacity:.75}

  .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
  .grow{flex:1 1 180px}
  .row select{border:1px solid var(--border);border-radius:9px;padding:.5rem .7rem;font-family:inherit;font-size:.85rem;background:#fff;color:var(--text);min-width:130px;cursor:pointer}
  #movsup{flex:1 1 220px}
  button.btn{border:1px solid var(--primary);background:var(--primary);color:#fff;padding:.55rem .95rem;border-radius:9px;
    font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;transition:.15s}
  button.btn:hover:not(:disabled){background:var(--primary-dark)}
  button.btn.ghost{background:#fff;color:var(--text);border-color:var(--border);font-weight:600}
  button.btn.ghost:hover:not(:disabled){background:var(--surface)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  input[type=text],input[type=number]{border:1px solid var(--border);border-radius:9px;padding:.5rem .7rem;font-family:inherit;font-size:.85rem;background:#fff;color:var(--text)}
  label.field{display:flex;flex-direction:column;gap:.3rem;font-size:.76rem;color:var(--muted);font-weight:600}

  .chips{display:flex;gap:.6rem;flex-wrap:wrap;margin:.9rem 0 .3rem}
  .chip{border:1px solid var(--border);border-radius:10px;padding:.6rem .85rem;background:#fff;min-width:96px}
  .chip b{display:block;font-size:1.35rem;font-weight:800;line-height:1.2}
  .chip span{font-size:.72rem;color:var(--muted)}
  .chip.c-up b{color:var(--up)} .chip.c-down b{color:var(--down)} .chip.c-new b{color:var(--new)}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-top:.6rem;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:520px}
  thead th{background:var(--surface);text-align:right;padding:.55rem .6rem;font-size:.72rem;font-weight:800;color:#475569;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:.55rem .6rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  tbody tr:hover{background:var(--surface)}
  td.num{white-space:nowrap;text-align:left;direction:ltr}
  td.code{font-weight:800;color:var(--primary);white-space:nowrap}
  .delta{font-weight:800;padding:.1rem .5rem;border-radius:20px;display:inline-block;direction:ltr}
  .delta.up{color:var(--up);background:var(--up-bg)} .delta.down{color:var(--down);background:var(--down-bg)}
  .tag{font-size:.68rem;padding:.1rem .5rem;border-radius:5px;background:var(--new-bg);color:var(--new);font-weight:800}
  .tag.gone{background:#f1f5f9;color:#64748b}
  .mini{background:none;border:1px solid var(--border);border-radius:6px;padding:.2rem .55rem;font-size:.7rem;cursor:pointer;color:var(--muted);font-family:inherit}
  .mini:hover:not(:disabled){border-color:var(--down);color:var(--down)}
  .mini:disabled{opacity:.5;cursor:not-allowed}

  .sec-title{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:1.1rem;padding-bottom:.35rem;border-bottom:2px solid var(--text);flex-wrap:wrap}
  .sec-title h3{font-size:.85rem;font-weight:800}
  .empty{padding:1.6rem;text-align:center;color:var(--muted);font-size:.82rem;background:var(--surface);border-radius:10px;border:1px dashed var(--border)}
  .warn{background:#fffbeb;border:1px solid #fde68a;color:#854d0e;padding:.6rem .85rem;border-radius:9px;font-size:.8rem;margin-top:.7rem}
  .lock{max-width:460px;margin:4rem auto;text-align:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:2.2rem 1.4rem}
  .lock .ic{font-size:2.4rem;color:var(--muted);margin-bottom:.6rem}
  .lock h2{font-size:1rem;font-weight:800;margin-bottom:.4rem}
  .lock p{font-size:.84rem;color:var(--muted)}

  .toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;
    padding:.65rem 1.2rem;border-radius:10px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.bad{background:var(--down)}
  @media(max-width:600px){ .wrap{padding:.8rem} .meta{gap:.8rem} }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="empty" style="margin-top:3rem"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="config.js?v=20260903"></script>
  <script src="session.js?v=20260903"></script>
  <script src="branches.js?v=20260904"></script>
  <script src="pages.js?v=20260905"></script>
  <script src="brand.js?v=20260904"></script>
  <script src="api.js?v=tt20260830"></script>
  <script src="supplier_balances_parser.js?v=supbal1"></script>
  <script>
  (function () {
    const { parse, compare } = window.SupBalParser;

    // ===== هوية المستخدم (من التخزين المحلي — بيانات غير موثّقة، للتتبع فقط) =====
    const ROLE = (Session.role() || '').trim();
    const MY_BRANCH = (Session.branch()).trim();
    const WHO = (Session.fullName() || Session.username() || '—').trim();
    const isAdminView = ROLE === 'admin' || ROLE === 'accountant' || ROLE === 'reviewer';   // زي باقي الأبلكيشن: بيشوفوا كل الفروع

    // ===== حالة الصلاحية — مصدر واحد =====
    let canView = false, canEdit = false;

    // wrapper وحيد بيستخدمه كل زرار كتابة في الشاشة (import/undo/exclusions/settings)
    function act(fn) {
      if (!canEdit) { toast('التعديل مقفول — محتاج صلاحية «تعديل» على الشاشة دي', true); return; }
      return fn();
    }
    // سمات زرار كتابة: يتعطّل مع رسالة واضحة لو مفيش صلاحية تعديل
    const wattr = () => canEdit ? '' : 'disabled title="محتاج صلاحية تعديل على الشاشة دي"';

    // ===== حالة الشاشة =====
    let state = { branches: [], exclusions: [], threshold: 0.01, cache: {} };
    let active = null;        // اسم الفرع أو 'ex' أو 'set'
    let draft = {};           // نص اللصق قبل التحليل (لكل فرع)
    let filter = {};          // بحث داخل النتائج (لكل فرع)

    // ===== أدوات عرض =====
    const fmt = n => (n === null || n === undefined || isNaN(n)) ? '—'
      : Number(n).toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
    const fmtSigned = n => (n > 0 ? '+' : '') + fmt(n);
    const when = t => t ? new Date(t).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let toastT;
    function toast(msg, bad) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
      clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2600);
    }

    const exSet = () => new Set(state.exclusions.map(x => String(x.supplier_code)));

    // ===== تحميل أولي =====
    async function init() {
      // 1) الصلاحية — Session.can() بتقرأ نفس RPC وبتكاشها
      const c = await Session.can('supplier_balances');
      canView = c.view; canEdit = c.edit;

      // 2) route guard: من غير view — نوقف هنا
      if (!canView) { renderLock(); return; }

      // 3) الفروع (من جدول branches) + سكوب الدور
      let branches = await sbBranches();
      branches = branches.filter(b => b && b !== 'كل الفروع');
      if (!isAdminView) branches = branches.filter(b => b === MY_BRANCH);
      state.branches = branches;

      // 4) الاستثناءات + الإعدادات المشتركة
      state.exclusions = await sbSupBalExclusions();
      const s = await sbSupBalSettings();
      state.threshold = Number(s.threshold) || 0.01;

      active = state.branches[0] || 'ex';
      render();
      if (state.branches.length) await loadBranch(active);
      render();
    }

    async function loadBranch(branch) {
      if (!state.branches.includes(branch)) return;
      const snaps = await sbSupBalSnapshots(branch, 2);
      const run = await sbSupBalLatestRun(branch);
      state.cache[branch] = {
        snapshot: snaps[0] || null,      // المرجع الحالي = الأحدث
        prev: snaps[1] || null,          // اللي قبله = هدف التراجع
        run
      };
    }

    // ===== الإجراءات (كلها بتعدّي على act) =====
    async function analyze(branch) {
      const text = draft[branch] || '';
      const p = parse(text);
      if (p.error) { toast(p.error, true); return; }

      const c = state.cache[branch] || {};
      const cur = c.snapshot ? c.snapshot.rows : null;
      const res = compare(cur, p.rows, { exclusions: state.exclusions.map(x => ({ code: x.supplier_code })), threshold: state.threshold });
      res.skipped = p.skipped;

      // append-only: كل لصق بيتحفظ كمرجع جديد (صف جديد)، والقديم يفضل موجود للتراجع
      const snap = await sbSupBalInsertSnapshot({
        branch, rows: p.rows, rows_count: p.count, taken_by: WHO, kind: 'import'
      });
      if (!snap) { toast('تعذّر حفظ الكشف. جرّب تاني.', true); return; }
      await sbSupBalInsertRun({
        branch, run_by: WHO,
        changed_count: res.changed.length, added_count: res.added.length, removed_count: res.removed.length,
        result: res, snapshot_id: snap.id
      });

      draft[branch] = '';
      await loadBranch(branch);
      toast(`تمت المقارنة واتحفظ الكشف مرجعًا (${p.count} مورد)`);
      render();
    }

    async function undo(branch) {
      const c = state.cache[branch] || {};
      if (!c.prev) { toast('مفيش مرجع سابق نرجعله', true); return; }
      // append-only: نضيف صف تراجع ينسخ السناب شوت الأقدم (مش تعديل/حذف)
      const snap = await sbSupBalInsertSnapshot({
        branch, rows: c.prev.rows, rows_count: c.prev.rows_count, taken_by: WHO,
        kind: 'undo', restored_from: c.prev.id
      });
      if (!snap) { toast('تعذّر التراجع. جرّب تاني.', true); return; }
      await loadBranch(branch);
      // نمسح عرض آخر نتيجة لأن المرجع اتغيّر
      if (state.cache[branch]) state.cache[branch].run = null;
      toast('رجعنا للمرجع السابق (اتسجّل كصف جديد)');
      render();
    }

    async function addExclusion(code, note) {
      code = String(code || '').trim();
      if (!code) { toast('اكتب كود المورد الأول', true); return; }
      if (exSet().has(code)) { toast('الكود ده مستثنى بالفعل', true); return; }
      let name = note || '';
      if (!name) {
        for (const b of state.branches) {
          const snap = state.cache[b] && state.cache[b].snapshot;
          if (snap && snap.rows && snap.rows[code]) { name = snap.rows[code].a || snap.rows[code].e || ''; break; }
        }
      }
      const okDone = await sbSupBalAddExclusion({ supplier_code: code, note: name, created_by: WHO });
      if (!okDone) { toast('تعذّر إضافة الاستثناء', true); return; }
      state.exclusions = await sbSupBalExclusions();
      toast('اتضاف للاستثناءات'); render();
    }

    async function removeExclusion(code) {
      const okDone = await sbSupBalRemoveExclusion(code);
      if (!okDone) { toast('تعذّر الحذف', true); return; }
      state.exclusions = await sbSupBalExclusions();
      toast('اتشال من الاستثناءات'); render();
    }

    async function saveThreshold(v) {
      const th = Math.max(0, Number(v) || 0);
      const okDone = await sbSupBalSaveSettings({ threshold: th, updated_by: WHO });
      if (!okDone) { toast('تعذّر حفظ الإعداد', true); return; }
      state.threshold = th; toast('اتحفظ');
    }

    function csv(branch) {
      const c = state.cache[branch]; if (!c || !c.run) return;
      const r = c.run.result || {}; const ex = exSet();
      const keep = a => (a || []).filter(x => !ex.has(String(x.code)));
      const rows = [['النوع', 'الكود', 'الاسم', 'الرصيد السابق', 'الرصيد الحالي', 'الفرق']];
      keep(r.changed).forEach(x => rows.push(['تغيّر', x.code, x.name, fmt(x.before), fmt(x.now), fmt(x.diff)]));
      keep(r.added).forEach(x => rows.push(['جديد', x.code, x.name, '', fmt(x.now), '']));
      keep(r.removed).forEach(x => rows.push(['اختفى', x.code, x.name, fmt(x.before), '', '']));
      const body = '﻿' + rows.map(r2 => r2.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv' }));
      a.download = `فروقات-${branch}-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    // ===== العرض =====
    function renderLock() {
      document.getElementById('app').innerHTML =
        `<div class="lock"><div class="ic"><i class="fas fa-lock"></i></div>
          <h2>غير مصرّح</h2>
          <p>الشاشة دي متاحة بس لمن لديه صلاحية «متابعة أرصدة الموردين».<br>كلّم الأدمن لو محتاج تدخلها.</p></div>`;
    }

    function render() {
      if (!canView) return;
      const app = document.getElementById('app');
      // تبويبات
      let tabs = state.branches.map(b => {
        const c = state.cache[b]; const r = c && c.run && c.run.result;
        const ex = exSet();
        const n = r ? (r.changed || []).filter(x => !ex.has(String(x.code))).length + (r.added || []).filter(x => !ex.has(String(x.code))).length : 0;
        return `<button class="tab ${active === b ? 'active' : ''}" data-tab="${esc(b)}">${esc(b)}${n ? `<span class="dot">${n}</span>` : ''}</button>`;
      }).join('');
      tabs += `<button class="tab ${active === 'mov' ? 'active' : ''}" data-tab="mov"><i class="fas fa-right-left"></i> مصروفات الموردين</button>`;
      tabs += `<button class="tab ${active === 'ex' ? 'active' : ''}" data-tab="ex">الاستثناءات<span class="dot">${state.exclusions.length}</span></button>`;
      tabs += `<button class="tab ${active === 'set' ? 'active' : ''}" data-tab="set">الإعدادات</button>`;

      const body = active === 'mov' ? viewMovements() : active === 'ex' ? viewExclusions() : active === 'set' ? viewSettings()
        : state.branches.length ? viewBranch(active)
        : '<div class="empty">مفيش فرع متاح لدورك.</div>';

      app.innerHTML = `
        <div class="page-head">
          <div>
            <h1><i class="fas fa-scale-balanced" style="color:var(--primary)"></i> متابعة أرصدة الموردين</h1>
            <div class="sub">الصق كشف الفرع، وتظهر لك الموردين اللي رصيدهم اتغيّر عن آخر لصق محفوظ.</div>
          </div>
          ${!canEdit ? '<div class="ro-badge"><i class="fas fa-eye"></i> عرض فقط — التعديل مقفول لدورك</div>' : ''}
        </div>
        <div class="tabs">${tabs}</div>
        <div id="view">${body}</div>`;
      bind();
    }

    function viewBranch(branch) {
      const c = state.cache[branch] || {};
      const snap = c.snapshot; const run = c.run;
      const cnt = snap && snap.rows ? Object.keys(snap.rows).length : 0;

      const head = `
        <div class="meta">
          <div><b>آخر لصق محفوظ</b>${when(snap && snap.taken_at)}</div>
          <div><b>اللي عمله</b>${esc(snap && snap.taken_by || '—')}</div>
          <div><b>عدد الموردين في المرجع</b>${cnt || '—'}</div>
          <div><b>آخر مقارنة</b>${when(run && run.run_at)}</div>
          <div><b>الموردين المستثنون</b>${state.exclusions.length}</div>
        </div>`;

      const paste = `
        <div class="card">
          <h2><i class="fas fa-paste"></i> لصق كشف ${esc(branch)}</h2>
          <p class="hint">انسخ الجدول من الشاشة عندك (بالعناوين أو من غيرها) والصقه هنا — المهم تفضل الأعمدة مفصولة زي ما هي.</p>
          <textarea id="ta" placeholder="الصق هنا…" ${canEdit ? '' : 'disabled'}>${esc(draft[branch] || '')}</textarea>
          <div class="row">
            <button class="btn" id="go" ${wattr()}><i class="fas fa-code-compare"></i> قارن واحفظ كمرجع</button>
            <button class="btn ghost" id="clr" ${wattr()}>مسح الصندوق</button>
            ${c.prev ? `<button class="btn ghost" id="undo" ${wattr()}><i class="fas fa-rotate-left"></i> تراجع عن آخر حفظ</button>` : ''}
          </div>
          ${!canEdit ? '<div class="warn">دورك «عرض فقط»: تقدر تتفرّج على النتائج بس مش هتقدر تلصق أو تحفظ أو تعدّل.</div>' : ''}
          ${!snap ? '<div class="warn">ده أول لصق للفرع ده — مفيش مرجع نقارن بيه. هيتسجّل كنقطة بداية، والمقارنة تبدأ من اللصق اللي بعده.</div>' : ''}
        </div>`;

      if (!run || !run.result) return head + paste +
        '<div class="card"><div class="empty">لسه مفيش مقارنة للفرع ده. الصق الكشف واضغط «قارن واحفظ كمرجع».</div></div>';

      const r = run.result; const ex = exSet();
      const q = (filter[branch] || '').trim().toLowerCase();
      const match = x => !ex.has(String(x.code)) && (!q || String(x.code).includes(q) || String(x.name || '').toLowerCase().includes(q) || String(x.en || '').toLowerCase().includes(q));
      const ch = (r.changed || []).filter(match), ad = (r.added || []).filter(match), rm = (r.removed || []).filter(match);
      const chAll = (r.changed || []).filter(x => !ex.has(String(x.code)));
      const up = chAll.filter(x => x.diff > 0).length, dn = chAll.length - up;

      let out = head + paste + `<div class="card">
        <h2><i class="fas fa-list-check"></i> نتيجة المقارنة — ${esc(branch)}</h2>
        <p class="hint">${r.baseline ? 'مقارنة بآخر كشف محفوظ للفرع.' : 'أول كشف: كل الموردين اتسجّلوا كنقطة بداية.'}${r.skipped ? ` (${r.skipped} سطر اتخطيناه لأنه مش صف بيانات)` : ''}</p>
        <div class="chips">
          <div class="chip"><b>${chAll.length}</b><span>رصيده اتغيّر</span></div>
          <div class="chip c-up"><b>${up}</b><span>زاد</span></div>
          <div class="chip c-down"><b>${dn}</b><span>نقص</span></div>
          <div class="chip c-new"><b>${(r.added || []).filter(x => !ex.has(String(x.code))).length}</b><span>مورد جديد</span></div>
          <div class="chip"><b>${r.total || 0}</b><span>إجمالي الكشف</span></div>
        </div>
        <div class="row">
          <input type="text" id="q" class="grow" placeholder="ابحث بالكود أو الاسم…" value="${esc(filter[branch] || '')}">
          <button class="btn ghost" id="csv"><i class="fas fa-file-csv"></i> تنزيل CSV</button>
        </div>
        <div class="sec-title"><h3>أرصدة اتغيّرت (${ch.length})</h3></div>
        ${ch.length ? tableHtml(ch, 'ch') : '<div class="empty">مفيش رصيد اتغيّر عن آخر لصق.</div>'}
        ${(r.added || []).filter(x => !ex.has(String(x.code))).length ? `<div class="sec-title"><h3>موردين ظهروا لأول مرة (${ad.length})</h3></div>` + tableHtml(ad, 'ad') : ''}
        ${(r.removed || []).filter(x => !ex.has(String(x.code))).length ? `<div class="sec-title"><h3>موردين مش موجودين في الكشف الجديد (${rm.length})</h3></div>` + tableHtml(rm, 'rm') : ''}
      </div>`;
      return out;
    }

    function tableHtml(rows, kind) {
      const head = kind === 'ch'
        ? '<th>الكود</th><th>المورد</th><th>الرصيد السابق</th><th>الرصيد الحالي</th><th>الفرق</th><th></th>'
        : kind === 'ad'
          ? '<th>الكود</th><th>المورد</th><th>الرصيد الحالي</th><th>الحالة</th><th></th>'
          : '<th>الكود</th><th>المورد</th><th>آخر رصيد معروف</th><th>الحالة</th><th></th>';
      const body = rows.map(x => {
        const nm = `${esc(x.name || '—')}${x.en && x.en !== x.name ? `<div style="font-size:.7rem;color:var(--muted);direction:ltr;text-align:right">${esc(x.en)}</div>` : ''}`;
        const btn = `<button class="mini" data-ex="${esc(x.code)}" ${wattr()}>استثناء</button>`;
        if (kind === 'ch') return `<tr><td class="code">${esc(x.code)}</td><td>${nm}</td><td class="num">${fmt(x.before)}</td><td class="num">${fmt(x.now)}</td>
          <td class="num"><span class="delta ${x.diff > 0 ? 'up' : 'down'}">${fmtSigned(x.diff)}</span></td><td>${btn}</td></tr>`;
        if (kind === 'ad') return `<tr><td class="code">${esc(x.code)}</td><td>${nm}</td><td class="num">${fmt(x.now)}</td><td><span class="tag">جديد</span></td><td>${btn}</td></tr>`;
        return `<tr><td class="code">${esc(x.code)}</td><td>${nm}</td><td class="num">${fmt(x.before)}</td><td><span class="tag gone">اختفى</span></td><td>${btn}</td></tr>`;
      }).join('');
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function viewExclusions() {
      const ex = state.exclusions;
      return `
        <div class="card">
          <h2><i class="fas fa-user-slash"></i> الموردين المستثنون</h2>
          <p class="hint">الأكواد هنا مش هتظهر في نتائج المقارنة في أي فرع (قائمة عامة).</p>
          <div class="row">
            <label class="field">كود المورد<input type="text" id="exc" placeholder="مثال: 260" style="width:130px" ${canEdit ? '' : 'disabled'}></label>
            <label class="field grow">ملاحظة (اختياري)<input type="text" id="exn" placeholder="اسم المورد أو سبب الاستثناء" ${canEdit ? '' : 'disabled'}></label>
            <button class="btn" id="exadd" style="align-self:flex-end" ${wattr()}>إضافة للاستثناءات</button>
          </div>
          ${!canEdit ? '<div class="warn">دورك «عرض فقط»: تقدر تشوف القائمة بس مش هتقدر تضيف أو تحذف.</div>' : ''}
        </div>
        <div class="card">
          <h2>القائمة (${ex.length})</h2>
          ${ex.length ? `<div class="table-wrap"><table><thead><tr><th>الكود</th><th>الملاحظة</th><th>اتضاف بواسطة</th><th></th></tr></thead><tbody>
            ${ex.map(x => `<tr><td class="code">${esc(x.supplier_code)}</td><td>${esc(x.note || '—')}</td><td style="color:var(--muted);font-size:.76rem">${esc(x.created_by || '—')}</td>
              <td><button class="mini" data-rm="${esc(x.supplier_code)}" ${wattr()}>حذف</button></td></tr>`).join('')}
          </tbody></table></div>` : '<div class="empty">مفيش استثناءات. ضيف كود من فوق، أو من زرار «استثناء» جنب أي مورد في النتائج.</div>'}
        </div>`;
    }

    function viewSettings() {
      return `
        <div class="card">
          <h2><i class="fas fa-sliders"></i> إعدادات المقارنة</h2>
          <div class="row">
            <label class="field">تجاهل الفروق الأصغر من
              <input type="number" id="th" step="0.001" min="0" value="${state.threshold}" style="width:140px" ${canEdit ? '' : 'disabled'}>
            </label>
          </div>
          <p class="hint" style="margin-top:.6rem">الفروق الصغيرة (زي 0.001) بتيجي من تقريب الكسور، فالافتراضي بيتجاهلها. الإعداد ده مشترك بين كل المستخدمين.</p>
          ${!canEdit ? '<div class="warn">دورك «عرض فقط»: تقدر تشوف الإعداد بس مش هتقدر تعدّله.</div>' : ''}
        </div>
        <div class="card">
          <h2>حالة البيانات</h2>
          <p class="hint">أسماء الفروع بتيجي من جدول الفروع في النظام (مش ثابتة هنا).</p>
          <div class="table-wrap"><table><thead><tr><th>الفرع</th><th>آخر لصق</th><th>عدد الموردين في المرجع</th></tr></thead><tbody>
            ${state.branches.map(b => { const c = state.cache[b] || {}; const s = c.snapshot;
              return `<tr><td>${esc(b)}</td><td>${when(s && s.taken_at)}</td><td class="num">${s ? (s.rows_count || Object.keys(s.rows || {}).length) : 0}</td></tr>`; }).join('')
              || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">مفيش فرع متاح</td></tr>'}
          </tbody></table></div>
        </div>`;
    }

    // ===== ربط الأحداث =====
    // ===== تاب مصروفات الموردين (وارد/منصرف من eplus) =====
    async function loadMovements() {
      try {
        const r = await fetch(SB_URL_API + '/rest/v1/v_supplier_movements?select=*&order=doc_date.desc&limit=2000',
          { headers: { apikey: SB_ANON_API, Authorization: 'Bearer ' + SB_ANON_API } });
        state.movements = await r.json();
        if (!Array.isArray(state.movements)) state.movements = [];
      } catch (e) { state.movements = []; }
    }
    function viewMovements() {
      const rows = state.movements || [];
      const q = (state.movFilter || '').trim().toLowerCase();
      const bf = state.movBranch || '';
      const unrev = state.movUnrev !== false;   // الافتراضي: غير المراجَعة فقط
      const hasNote = !!state.movHasNote;
      const sf = state.movSupplier || '';
      const fr = rows.filter(x =>
        (!bf || Branches.same(x.branch, bf)) &&
        (!sf || String(x.supplier_code || '') === sf) &&
        (hasNote ? (x.review_note && String(x.review_note).trim()) : (!unrev || !x.reviewed)) &&
        (!q || String(x.supplier_code || '').includes(q) || String(x.supplier_name || '').toLowerCase().includes(q)));
      const money = n => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
      const brs = [...new Set(rows.map(x => x.branch).filter(Boolean))];
      const supMap = {}; rows.forEach(x => { if (x.supplier_code) supMap[x.supplier_code] = x.supplier_name || x.supplier_code; });
      const sups = Object.entries(supMap).sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'ar'));
      const dt = s => s ? new Date(s).toLocaleString('ar-EG', { timeZone: 'Africa/Cairo', dateStyle: 'short', timeStyle: 'short' }) : '—';
      let out = `<div class="card">
        <h2><i class="fas fa-right-left"></i> مصروفات الموردين — الوارد والمنصرف</h2>
        <p class="hint">كل الحركات اللي طرفها مورد (النوع «مورد» في eplus)، من المصروفات والتوريدات. علّم «تم» بعد المراجعة.</p>
        <div class="row">
          <select id="movbr"><option value="">كل الفروع</option>${brs.map(b => `<option value="${esc(b)}" ${bf === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>
          <select id="movsup"><option value="">كل الموردين</option>${sups.map(([code, name]) => `<option value="${esc(code)}" ${sf === code ? 'selected' : ''}>${esc(name)} (${esc(code)})</option>`).join('')}</select>
          <input type="text" id="movq" class="grow" placeholder="بحث سريع…" value="${esc(state.movFilter || '')}">
          <label style="display:flex;align-items:center;gap:5px;font-size:.8rem;white-space:nowrap"><input type="checkbox" id="movunrev" ${unrev ? 'checked' : ''}> غير المراجَعة فقط</label>
          <label style="display:flex;align-items:center;gap:5px;font-size:.8rem;white-space:nowrap"><input type="checkbox" id="movhasnote" ${hasNote ? 'checked' : ''}> عليها ملاحظات</label>
        </div>`;
      if (!fr.length) { out += '<div class="empty">مفيش حركات موردين في البيانات الحالية.</div></div>'; return out; }
      out += `<div class="table-wrap"><table><thead><tr>
          <th>التاريخ</th><th>الفرع</th><th>المورد</th><th>الكود</th><th>النوع</th><th>القيمة</th><th>المصدر</th><th>ملاحظات</th><th>مراجعة</th>
        </tr></thead><tbody>
        ${fr.map(x => `<tr>
          <td style="white-space:nowrap">${dt(x.doc_date)}</td>
          <td>${esc(x.branch || '')}</td>
          <td>${esc(x.supplier_name || '—')}</td>
          <td>${esc(x.supplier_code || '')}</td>
          <td style="font-weight:800;color:${x.direction === 'منصرف' ? 'var(--red,#dc2626)' : 'var(--green,#16a34a)'}">${esc(x.direction)}</td>
          <td style="font-weight:700">${money(x.value)}</td>
          <td>${esc(x.source || '')}</td>
          <td style="color:var(--muted)">${esc(x.doc_notes || '')}</td>
          <td style="min-width:230px">
            <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
              <input class="movnote" data-src="${esc(x.source)}" data-doc="${esc(x.doc_code)}" data-br="${esc(x.branch)}" ${x.reviewed ? 'data-mov-note' : ''} placeholder="ملاحظة المراجع" value="${esc(x.review_note || '')}" style="flex:1 1 120px;min-width:110px;border:1px solid var(--border);border-radius:8px;padding:.35rem .5rem;font-family:inherit;font-size:.78rem;background:#fff;color:var(--text)">
              ${x.reviewed
                ? `<span style="color:var(--green,#16a34a);font-weight:700;white-space:nowrap;font-size:.75rem">✓ ${esc(x.reviewed_by || '')}</span> <button data-mov-unmark data-src="${esc(x.source)}" data-doc="${esc(x.doc_code)}" data-br="${esc(x.branch)}" title="تراجع" style="border:none;background:none;color:var(--muted);cursor:pointer;font-weight:800">✕</button>`
                : `<button class="btn ghost" data-mov-mark data-src="${esc(x.source)}" data-doc="${esc(x.doc_code)}" data-br="${esc(x.branch)}" style="padding:.3rem .7rem;font-size:.75rem;white-space:nowrap">تم ✓</button>`}
            </div>
          </td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
      return out;
    }
    async function markMov(src, doc, br, note) {
      try {
        await fetch(SB_URL_API + '/rest/v1/supplier_movement_reviews', {
          method: 'POST',
          headers: { apikey: SB_ANON_API, Authorization: 'Bearer ' + SB_ANON_API, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
          body: JSON.stringify({ source: src, doc_code: doc, branch: br, reviewed_by: WHO, reviewed_at: new Date().toISOString(), review_note: note || null })
        });
        await loadMovements(); render();
      } catch (e) { toast('فشل حفظ المراجعة', true); }
    }
    async function updateMovNote(src, doc, br, note) {
      try {
        await fetch(SB_URL_API + '/rest/v1/supplier_movement_reviews?source=eq.' + encodeURIComponent(src) + '&doc_code=eq.' + encodeURIComponent(doc) + '&branch=eq.' + encodeURIComponent(br), {
          method: 'PATCH',
          headers: { apikey: SB_ANON_API, Authorization: 'Bearer ' + SB_ANON_API, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({ review_note: note || null })
        });
        await loadMovements(); render();
      } catch (e) { toast('فشل حفظ الملاحظة', true); }
    }
    async function unmarkMov(src, doc, br) {
      try {
        await fetch(SB_URL_API + '/rest/v1/supplier_movement_reviews?source=eq.' + encodeURIComponent(src) + '&doc_code=eq.' + encodeURIComponent(doc) + '&branch=eq.' + encodeURIComponent(br),
          { method: 'DELETE', headers: { apikey: SB_ANON_API, Authorization: 'Bearer ' + SB_ANON_API } });
        await loadMovements(); render();
      } catch (e) { toast('فشل التراجع', true); }
    }

    function bind() {
      document.querySelectorAll('[data-tab]').forEach(el => el.onclick = async () => {
        active = el.dataset.tab;
        if (state.branches.includes(active) && !state.cache[active]) { await loadBranch(active); }
        if (active === 'mov' && !state.movements) { await loadMovements(); }
        render();
      });
      const movbr = document.getElementById('movbr');
      if (movbr) movbr.onchange = e => { state.movBranch = e.target.value; render(); };
      const movsup = document.getElementById('movsup');
      if (movsup) movsup.onchange = e => { state.movSupplier = e.target.value; render(); };
      const movq = document.getElementById('movq');
      if (movq) movq.oninput = e => { state.movFilter = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('movq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } };
      const movunrev = document.getElementById('movunrev');
      if (movunrev) movunrev.onchange = e => { state.movUnrev = e.target.checked; render(); };
      const movhasnote = document.getElementById('movhasnote');
      if (movhasnote) movhasnote.onchange = e => { state.movHasNote = e.target.checked; render(); };
      document.querySelectorAll('[data-mov-mark]').forEach(el => el.onclick = () => {
        const cell = el.closest('td'); const ni = cell && cell.querySelector('.movnote');
        markMov(el.dataset.src, el.dataset.doc, el.dataset.br, ni ? ni.value : '');
      });
      document.querySelectorAll('[data-mov-unmark]').forEach(el => el.onclick = () => unmarkMov(el.dataset.src, el.dataset.doc, el.dataset.br));
      document.querySelectorAll('[data-mov-note]').forEach(el => el.onchange = () => updateMovNote(el.dataset.src, el.dataset.doc, el.dataset.br, el.value));

      const branch = active;
      const ta = document.getElementById('ta');
      if (ta) ta.oninput = e => draft[branch] = e.target.value;

      const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
      // كل أزرار الكتابة بتعدّي على act (المصدر الوحيد للتحقق)
      on('go', () => act(() => analyze(branch)));
      on('clr', () => act(() => { draft[branch] = ''; render(); }));
      on('undo', () => act(() => undo(branch)));
      on('exadd', () => act(() => {
        const c = document.getElementById('exc').value, n = document.getElementById('exn').value;
        addExclusion(c, n);
      }));
      on('csv', () => csv(branch));   // تصدير = قراءة، مش محتاج صلاحية تعديل

      const q = document.getElementById('q');
      if (q) q.oninput = e => {
        filter[branch] = e.target.value;
        const pos = e.target.selectionStart; render();
        const nq = document.getElementById('q'); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); }
      };

      document.querySelectorAll('[data-ex]').forEach(el => el.onclick = () => act(() => addExclusion(el.dataset.ex)));
      document.querySelectorAll('[data-rm]').forEach(el => el.onclick = () => act(() => removeExclusion(el.dataset.rm)));

      const th = document.getElementById('th');
      if (th) th.onchange = e => act(() => saveThreshold(e.target.value));
    }

    init();
  })();
  </script>
</body>
</html>
