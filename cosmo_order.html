<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>طلبيات الكوزمو - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Layout */
    .top-panel {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      margin-bottom: 20px;
      align-items: start;
    }
    @media(max-width:900px){ .top-panel { grid-template-columns: 1fr; } }

    /* Settings panel (left) */
    .settings-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px;
    }
    .settings-title {
      font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);
      margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }
    .rules-table { width: 100%; border-collapse: collapse; }
    .rules-table th {
      background: var(--surface-3); padding: 6px 8px;
      font-size: 0.72rem; font-weight: 700; color: var(--text-secondary);
      text-align: center; border-bottom: 2px solid var(--border);
    }
    .rules-table td { padding: 5px 6px; border-bottom: 1px solid var(--surface-3); text-align: center; }
    .rules-table input {
      width: 60px; text-align: center; padding: 4px 6px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 0.78rem; outline: none;
    }
    .rules-table input:focus { border-color: var(--accent); }
    .btn-add-rule {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; background: var(--surface-3);
      border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 0.75rem; font-weight: 600;
      color: var(--text-secondary); cursor: pointer; margin-top: 8px;
    }
    .btn-add-rule:hover { border-color: var(--accent); color: var(--accent-dark); }
    .btn-del-rule { background: none; border: none; color: var(--danger); cursor: pointer; padding: 2px 5px; font-size: 0.8rem; }

    /* Filter panel (right) */
    .filter-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .filter-panel label { font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 3px; display: block; }

    /* Multi-select companies */
    .company-list {
      max-height: 140px; overflow-y: auto;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 6px 8px; background: var(--surface);
    }
    .company-list label {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; font-weight: 400; color: var(--text-primary);
      padding: 3px 0; cursor: pointer; margin-bottom: 0;
    }
    .company-list input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); }

    /* Order Table */
    .order-wrap { overflow-x: auto; }
    .order-table { width: 100%; border-collapse: collapse; min-width: 860px; }
    .order-table th {
      background: var(--primary); color: #fff;
      padding: 9px 8px; font-size: 0.7rem; font-weight: 700;
      text-align: center; white-space: nowrap;
    }
    .order-table td {
      padding: 7px 8px; font-size: 0.77rem;
      border-bottom: 1px solid var(--surface-3);
      text-align: center; vertical-align: middle;
    }
    .order-table tr:hover td { background: var(--surface-2); }
    .order-table tr.ignored-row td { opacity: 0.4; }
    .order-table tr.ordered-row { background: #f0fdf4; }
    .order-table tr.ordered-row td { background: transparent; }

    .multiply-badge {
      display: inline-block; background: #fef9c3; color: #a16207;
      border-radius: 20px; padding: 1px 6px; font-size: 0.65rem; font-weight: 700;
    }
    .order-qty-cell { font-weight: 900; font-size: 0.95rem; color: var(--danger); }
    .branch-need-pos { color: var(--success); font-weight: 700; }
    .branch-need-neg { color: var(--text-muted); }
    .ignored-badge { display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:20px;padding:1px 7px;font-size:0.65rem;font-weight:700; }
    .ordered-badge { display:inline-block;background:#dcfce7;color:#15803d;border-radius:20px;padding:1px 7px;font-size:0.65rem;font-weight:700; }

    .summary-bar { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px; }
    .summary-item {
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius-md);padding:8px 14px;font-size:0.8rem;
    }
    .summary-item b { color:var(--accent-dark);font-size:0.95rem; }
    .loading-overlay { text-align:center;padding:60px;color:var(--text-muted); }

    .cb-ordered { width:15px;height:15px;cursor:pointer;accent-color:var(--success); }
    .cb-ignore  { width:15px;height:15px;cursor:pointer;accent-color:var(--danger); }

    .actions-bar { display:flex;gap:8px;flex-wrap:wrap;margin-top:12px; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">

    <div class="top-panel">
      <!-- يمين: بحث وفلاتر -->
      <div class="filter-panel">
        <div class="settings-title"><i class="fas fa-filter" style="color:var(--accent);"></i> بحث وفلتر</div>

        <div>
          <label>بحث</label>
          <div class="field-icon-wrap">
            <i class="fas fa-search field-icon"></i>
            <input type="text" id="search-input" class="form-input" placeholder="اسم أو كود..." oninput="applyFilters()" style="padding-right:34px;">
          </div>
        </div>

        <div>
          <label>الشركات <span id="company-count" style="color:var(--accent-dark);font-weight:700;"></span></label>
          <div class="company-list" id="company-list">
            <label><input type="checkbox" id="company-all" checked onchange="toggleAllCompanies(this)"> الكل</label>
          </div>
        </div>

        <div>
          <label>الفرع</label>
          <select id="branch-filter" class="form-select" onchange="applyFilters()">
            <option value="">كل الفروع</option>
            <option value="mamora">المعمورة فقط</option>
            <option value="san">سان ستيفانو فقط</option>
            <option value="bishr">سيدى بشر فقط</option>
          </select>
        </div>

        <div>
          <label>الحالة</label>
          <select id="status-filter" class="form-select" onchange="applyFilters()">
            <option value="all">الكل</option>
            <option value="pending">لم يُطلب</option>
            <option value="ordered">تم الطلب</option>
          </select>
        </div>

        <div class="actions-bar">
          <button class="btn btn-primary" style="flex:1;" onclick="calculate()">
            <i class="fas fa-calculator"></i> احسب
          </button>
          <button class="btn" style="background:var(--surface-3);color:var(--text-secondary);" onclick="exportCSV()">
            <i class="fas fa-file-csv"></i> CSV
          </button>
          <button class="btn" style="background:#fef9c3;color:#a16207;" onclick="clearIgnored()">
            <i class="fas fa-undo"></i> استعادة
          </button>
        </div>
      </div>

      <!-- شمال: إعدادات القواعد -->
      <div class="settings-panel">
        <div class="settings-title"><i class="fas fa-sliders-h" style="color:var(--accent);"></i> قواعد الطلب</div>
        <table class="rules-table">
          <thead>
            <tr>
              <th>معدل >=</th>
              <th>شهور >=</th>
              <th>معامل ×</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rules-body">
            <tr>
              <td><input type="number" value="1"    min="0" step="0.5"  class="rule-avg"></td>
              <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
              <td><input type="number" value="1.25" min="1" step="0.05" class="rule-multiply"></td>
              <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
            </tr>
            <tr>
              <td><input type="number" value="5"    min="0" step="0.5"  class="rule-avg"></td>
              <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
              <td><input type="number" value="1.5"  min="1" step="0.05" class="rule-multiply"></td>
              <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
            </tr>
            <tr>
              <td><input type="number" value="10"   min="0" step="0.5"  class="rule-avg"></td>
              <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
              <td><input type="number" value="2.0"  min="1" step="0.05" class="rule-multiply"></td>
              <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button class="btn-add-rule" onclick="addRule()"><i class="fas fa-plus"></i> قاعدة</button>
      </div>
    </div>

    <!-- النتائج -->
    <div class="card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-shopping-basket"></i> قائمة الطلبيات</div>
        <div id="result-count" style="font-size:0.8rem;color:var(--text-muted);"></div>
      </div>
      <div id="result-container">
        <div class="loading-overlay">اضغط "احسب" للبدء</div>
      </div>
    </div>

  </div>

  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script>
    const INV_URL = 'https://agent.ebrahimhamdy.com/webhook/inventory';
    var stockMamora=[], stockSan=[], stockBishr=[], salesData=[];
    var dataLoaded = false;
    var allResults = [];
    var itemStates = JSON.parse(localStorage.getItem('cosmo_states') || '{}');
    function saveStates(){ localStorage.setItem('cosmo_states', JSON.stringify(itemStates)); }

    checkAuth().then(function(user){ if(user) loadAllData(); });

    async function loadAllData() {
      document.getElementById('result-container').innerHTML =
        '<div class="loading-overlay">⏳ جاري تحميل البيانات...</div>';
      try {
        var r = await Promise.all([
          fetch(INV_URL+'?type=stock_mamora').then(function(x){return x.json();}),
          fetch(INV_URL+'?type=stock_san').then(function(x){return x.json();}),
          fetch(INV_URL+'?type=stock_bishr').then(function(x){return x.json();}),
          fetch(INV_URL+'?type=sales_monthly').then(function(x){return x.json();})
        ]);
        stockMamora = Array.isArray(r[0]) ? r[0] : (r[0].data||[]);
        stockSan    = Array.isArray(r[1]) ? r[1] : (r[1].data||[]);
        stockBishr  = Array.isArray(r[2]) ? r[2] : (r[2].data||[]);
        salesData   = Array.isArray(r[3]) ? r[3] : (r[3].data||[]);
        dataLoaded  = true;
        document.getElementById('result-container').innerHTML =
          '<div class="loading-overlay">✅ جاهز — اضغط "احسب"</div>';
      } catch(e) {
        document.getElementById('result-container').innerHTML =
          '<div class="loading-overlay" style="color:var(--danger);">❌ فشل التحميل</div>';
      }
    }

    function getRules() {
      var rules = [];
      document.querySelectorAll('#rules-body tr').forEach(function(row){
        rules.push({
          avg:      parseFloat(row.querySelector('.rule-avg').value)||0,
          months:   parseFloat(row.querySelector('.rule-months').value)||1,
          multiply: parseFloat(row.querySelector('.rule-multiply').value)||1
        });
      });
      rules.sort(function(a,b){ return b.avg-a.avg||b.months-a.months; });
      return rules;
    }

    function getMultiply(avg, active, rules) {
      for(var i=0;i<rules.length;i++){
        if(avg>=rules[i].avg && active>=rules[i].months) return rules[i].multiply;
      }
      return 1;
    }

    function round1(n){ return Math.round(n*10)/10; }

    function calculate() {
      if(!dataLoaded){ alert('البيانات لسه بتتحمل'); return; }
      var rules = getRules();

      var stockMap = {};
      function addStock(arr, branch){
        arr.forEach(function(item){
          var code = String(item.itm_code||'').trim();
          if(!stockMap[code]) stockMap[code]={
            name:item.itm_name_ar||'', company:item.Company_Name_Ar||'',
            unit:item.u_name_big||'',  price:parseFloat(item.itm_sell_price_big)||0,
            mamora:0, san:0, bishr:0
          };
          stockMap[code][branch] = parseFloat(item.sto_qty_big)||0;
        });
      }
      addStock(stockMamora,'mamora');
      addStock(stockSan,'san');
      addStock(stockBishr,'bishr');

      var salesMap = {};
      salesData.forEach(function(row){
        var code = String(row.itm_code||'').trim();
        if(!salesMap[code]) salesMap[code]={mamora:{},san:{},bishr:{}};
        var m = String(row.month||'').trim();
        salesMap[code].mamora[m]=(salesMap[code].mamora[m]||0)+(parseFloat(row.mamora)||0);
        salesMap[code].san[m]   =(salesMap[code].san[m]   ||0)+(parseFloat(row.san)   ||0);
        salesMap[code].bishr[m] =(salesMap[code].bishr[m] ||0)+(parseFloat(row.bishr) ||0);
      });

      var list = [];
      Object.keys(stockMap).forEach(function(code){
        var s    = stockMap[code];
        var sale = salesMap[code]||{mamora:{},san:{},bishr:{}};

        function bc(bs){
          var active = Object.keys(bs).filter(function(m){return bs[m]>0;});
          var total  = active.reduce(function(sum,m){return sum+bs[m];},0);
          var avg    = active.length>0 ? total/active.length : 0;
          return {avg:avg, activeMonths:active.length, total:total};
        }

        var m=bc(sale.mamora), n=bc(sale.san), b=bc(sale.bishr);
        var mulM=getMultiply(m.avg,m.activeMonths,rules);
        var mulN=getMultiply(n.avg,n.activeMonths,rules);
        var mulB=getMultiply(b.avg,b.activeMonths,rules);

        var targetM=m.avg*mulM, targetN=n.avg*mulN, targetB=b.avg*mulB;
        var needM=Math.ceil(Math.max(0,targetM-s.mamora));
        var needN=Math.ceil(Math.max(0,targetN-s.san));
        var needB=Math.ceil(Math.max(0,targetB-s.bishr));

        var totalTarget=targetM+targetN+targetB;
        var totalStock=s.mamora+s.san+s.bishr;
        var orderQty=Math.ceil(totalTarget-totalStock);

        if(orderQty<=0||totalTarget===0) return;

        list.push({
          code, name:s.name, company:s.company, unit:s.unit, price:s.price,
          mamora:{stock:s.mamora, avg:round1(m.avg), active:m.activeMonths, mul:mulM, target:targetM, need:needM},
          san:   {stock:s.san,    avg:round1(n.avg), active:n.activeMonths, mul:mulN, target:targetN, need:needN},
          bishr: {stock:s.bishr,  avg:round1(b.avg), active:b.activeMonths, mul:mulB, target:targetB, need:needB},
          totalStock, totalTarget, orderQty
        });
      });

      list.sort(function(a,b){return b.orderQty-a.orderQty;});
      allResults = list;

      // بناء قائمة الشركات
      var companies = [...new Set(list.map(function(i){return i.company;}).filter(Boolean))].sort();
      var cl = document.getElementById('company-list');
      cl.innerHTML = '<label><input type="checkbox" id="company-all" checked onchange="toggleAllCompanies(this)"> الكل</label>';
      companies.forEach(function(c){
        var lbl = document.createElement('label');
        lbl.innerHTML = '<input type="checkbox" class="company-cb" value="' + c + '" checked onchange="onCompanyChange()"> ' + c;
        cl.appendChild(lbl);
      });
      updateCompanyCount();
      applyFilters();
    }

    function toggleAllCompanies(cb) {
      document.querySelectorAll('.company-cb').forEach(function(c){ c.checked = cb.checked; });
      applyFilters();
    }

    function onCompanyChange() {
      var all = document.querySelectorAll('.company-cb');
      var checked = document.querySelectorAll('.company-cb:checked');
      var allCb = document.getElementById('company-all');
      if(allCb) allCb.checked = all.length === checked.length;
      updateCompanyCount();
      applyFilters();
    }

    function updateCompanyCount() {
      var all     = document.querySelectorAll('.company-cb').length;
      var checked = document.querySelectorAll('.company-cb:checked').length;
      var el = document.getElementById('company-count');
      if(el) el.textContent = checked < all ? '(' + checked + '/' + all + ')' : '';
    }

    function getSelectedCompanies() {
      var cbs = document.querySelectorAll('.company-cb:checked');
      var sel = [];
      cbs.forEach(function(cb){ sel.push(cb.value); });
      return sel;
    }

    function applyFilters() {
      var search    = document.getElementById('search-input').value.trim().toLowerCase();
      var branch    = document.getElementById('branch-filter').value;
      var statusF   = document.getElementById('status-filter').value;
      var companies = getSelectedCompanies();

      var filtered = allResults.filter(function(item){
        var state = itemStates[item.code]||{};
        if(search && !item.name.toLowerCase().includes(search) && !item.code.includes(search)) return false;
        if(companies.length && !companies.includes(item.company)) return false;
        if(branch){
          if(branch==='mamora' && item.mamora.need<=0) return false;
          if(branch==='san'    && item.san.need<=0)    return false;
          if(branch==='bishr'  && item.bishr.need<=0)  return false;
        }
        if(statusF==='pending' && state.ordered)  return false;
        if(statusF==='ordered' && !state.ordered) return false;
        return true;
      });

      renderResults(filtered);
    }

    function renderResults(list) {
      var container = document.getElementById('result-container');
      var pending   = list.filter(function(i){return !(itemStates[i.code]||{}).ordered&&!(itemStates[i.code]||{}).ignored;}).length;
      var ordered   = list.filter(function(i){return (itemStates[i.code]||{}).ordered;}).length;
      var ignored   = list.filter(function(i){return (itemStates[i.code]||{}).ignored;}).length;

      document.getElementById('result-count').textContent =
        list.length + ' صنف — لم يُطلب: ' + pending + ' · تم: ' + ordered + ' · متجاهل: ' + ignored;

      if(!list.length){
        container.innerHTML='<div class="loading-overlay">لا توجد نتائج</div>';
        return;
      }

      var activeList = allResults.filter(function(i){return !(itemStates[i.code]||{}).ignored;});
      var totalQty   = activeList.reduce(function(s,i){return s+i.orderQty;},0);
      var totalVal   = activeList.reduce(function(s,i){return s+i.orderQty*i.price;},0);

      var html = `
        <div class="summary-bar">
          <div class="summary-item">أصناف: <b>${activeList.length}</b></div>
          <div class="summary-item">إجمالي الكميات: <b>${totalQty}</b></div>
          <div class="summary-item">القيمة التقديرية: <b>${Math.round(totalVal).toLocaleString('ar-EG')} ج</b></div>
          <div class="summary-item" style="background:#dcfce7;">تم الطلب: <b style="color:#15803d;">${ordered}</b></div>
        </div>
        <div class="order-wrap">
          <table class="order-table">
            <thead>
              <tr>
                <th style="width:32px;">✅</th>
                <th style="width:32px;">🚫</th>
                <th style="text-align:right;">الصنف</th>
                <th>الكمية المطلوبة</th>
                <th>إجمالي الهدف</th>
                <th>إجمالي الرصيد</th>
                <th>المعمورة<br><small style="font-weight:400;opacity:0.8;">احتياج·رصيد·معدل·×</small></th>
                <th>سان ستيفانو<br><small style="font-weight:400;opacity:0.8;">احتياج·رصيد·معدل·×</small></th>
                <th>سيدى بشر<br><small style="font-weight:400;opacity:0.8;">احتياج·رصيد·معدل·×</small></th>
              </tr>
            </thead>
            <tbody>
      `;

      list.forEach(function(item){
        var state    = itemStates[item.code]||{};
        var rowClass = state.ignored ? 'ignored-row' : state.ordered ? 'ordered-row' : '';

        function bc(b){
          var nc = b.need>0 ? 'branch-need-pos' : 'branch-need-neg';
          return '<td>' +
            '<div class="' + nc + '">' + (b.need>0 ? '+'+b.need : '—') + '</div>' +
            '<div style="font-size:0.68rem;color:var(--text-muted);margin-top:1px;">' +
              b.stock + ' / ' + b.avg +
              (b.active>0 ? ' ('+b.active+'ش)' : '') +
              ' <span class="multiply-badge">×'+b.mul+'</span>' +
            '</div>' +
          '</td>';
        }

        html += '<tr class="' + rowClass + '">' +
          '<td><input type="checkbox" class="cb-ordered" ' + (state.ordered?'checked':'') +
            ' onchange="toggleOrdered(\''+item.code+'\',this.checked)"></td>' +
          '<td><input type="checkbox" class="cb-ignore" '  + (state.ignored?'checked':'') +
            ' onchange="toggleIgnored(\''+item.code+'\',this.checked)"></td>' +
          '<td style="text-align:right;">' +
            '<div style="font-weight:600;font-size:0.82rem;">' + item.name +
              (state.ignored ? ' <span class="ignored-badge">متجاهل</span>' : '') +
              (state.ordered ? ' <span class="ordered-badge">تم الطلب</span>' : '') +
            '</div>' +
            '<div style="font-size:0.67rem;color:var(--text-muted);">' + item.code + ' · ' + item.unit + ' · ' + item.company + '</div>' +
          '</td>' +
          '<td class="order-qty-cell">' + (state.ignored?'—':item.orderQty) + '</td>' +
          '<td style="color:var(--accent-dark);font-weight:700;">' + Math.round(item.totalTarget) + '</td>' +
          '<td style="font-weight:600;">' + Math.round(item.totalStock) + '</td>' +
          bc(item.mamora) + bc(item.san) + bc(item.bishr) +
        '</tr>';
      });

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    function toggleOrdered(code, val){
      if(!itemStates[code]) itemStates[code]={};
      itemStates[code].ordered = val;
      saveStates(); applyFilters();
    }

    function toggleIgnored(code, val){
      if(!itemStates[code]) itemStates[code]={};
      itemStates[code].ignored = val;
      if(val) itemStates[code].ordered = false;
      saveStates(); applyFilters();
    }

    function clearIgnored(){
      if(!confirm('هتستعيد كل الأصناف المتجاهلة؟')) return;
      Object.keys(itemStates).forEach(function(code){
        if(itemStates[code]) itemStates[code].ignored = false;
      });
      saveStates(); applyFilters();
    }

    function addRule(){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><input type="number" value="1" min="0" step="0.5" class="rule-avg"></td>' +
        '<td><input type="number" value="2" min="1" step="1" class="rule-months"></td>' +
        '<td><input type="number" value="1.2" min="1" step="0.05" class="rule-multiply"></td>' +
        '<td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>';
      document.getElementById('rules-body').appendChild(tr);
    }

    function delRule(btn){
      if(document.querySelectorAll('#rules-body tr').length<=1){alert('لازم قاعدة واحدة');return;}
      btn.closest('tr').remove();
    }

    function exportCSV(){
      var list = allResults.filter(function(i){return !(itemStates[i.code]||{}).ignored;});
      if(!list.length){alert('احسب الطلبيات الأول');return;}
      var rows=[['كود','الصنف','الشركة','الوحدة',
        'احتياج المعمورة','رصيد المعمورة','معدل المعمورة',
        'احتياج سان','رصيد سان','معدل سان',
        'احتياج بشر','رصيد بشر','معدل بشر',
        'إجمالي الرصيد','إجمالي الهدف','الكمية المطلوبة','تم الطلب']];
      list.forEach(function(i){
        var st=itemStates[i.code]||{};
        rows.push([i.code,i.name,i.company,i.unit,
          i.mamora.need,i.mamora.stock,i.mamora.avg,
          i.san.need,   i.san.stock,   i.san.avg,
          i.bishr.need, i.bishr.stock, i.bishr.avg,
          Math.round(i.totalStock),Math.round(i.totalTarget),i.orderQty,
          st.ordered?'نعم':'لا']);
      });
      var csv='\uFEFF'+rows.map(function(r){return r.join(',');}).join('\n');
      var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url; a.download='cosmo_order_'+new Date().toISOString().slice(0,10)+'.csv';
      a.click(); URL.revokeObjectURL(url);
    }
  </script>
</body>
