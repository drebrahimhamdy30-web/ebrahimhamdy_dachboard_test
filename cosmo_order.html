<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>طلبيات الكوزمو - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .settings-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 20px;
    }
    .settings-title {
      font-size: 0.88rem; font-weight: 700; color: var(--text-secondary);
      margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
    }
    .rules-table { width: 100%; border-collapse: collapse; }
    .rules-table th {
      background: var(--surface-3); padding: 8px 12px;
      font-size: 0.75rem; font-weight: 700; color: var(--text-secondary);
      text-align: center; border-bottom: 2px solid var(--border);
    }
    .rules-table td { padding: 7px 10px; border-bottom: 1px solid var(--surface-3); text-align: center; }
    .rules-table input {
      width: 70px; text-align: center; padding: 5px 8px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 0.82rem; outline: none;
    }
    .rules-table input:focus { border-color: var(--accent); }
    .btn-add-rule {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; background: var(--surface-3);
      border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 0.78rem; font-weight: 600;
      color: var(--text-secondary); cursor: pointer; margin-top: 8px;
    }
    .btn-add-rule:hover { border-color: var(--accent); color: var(--accent-dark); }
    .btn-del-rule { background: none; border: none; color: var(--danger); cursor: pointer; padding: 3px 6px; font-size: 0.85rem; }

    /* Filters */
    .filter-row {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      margin-bottom: 16px; padding: 12px 16px;
      background: var(--surface-3); border-radius: var(--radius-md);
    }
    .filter-row input, .filter-row select {
      flex: 1; min-width: 150px;
    }

    /* Order Table */
    .order-table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    .order-table th {
      background: var(--primary); color: #fff;
      padding: 10px 8px; font-size: 0.72rem; font-weight: 700;
      text-align: center; white-space: nowrap;
    }
    .order-table th:nth-child(1) { text-align: right; }
    .order-table td {
      padding: 8px 8px; font-size: 0.78rem;
      border-bottom: 1px solid var(--surface-3);
      text-align: center; vertical-align: middle;
    }
    .order-table td:nth-child(1) { text-align: right; }
    .order-table tr:hover td { background: var(--surface-2); }
    .order-table tr.ignored-row td { opacity: 0.4; text-decoration: line-through; }
    .order-table tr.ordered-row td { background: #f0fdf4 !important; }

    .multiply-badge {
      display: inline-block; background: #fef9c3; color: #a16207;
      border-radius: 20px; padding: 1px 7px; font-size: 0.68rem; font-weight: 700;
    }
    .order-qty-cell { font-weight: 900; font-size: 1rem; color: var(--danger); }
    .branch-need { color: var(--success); font-weight: 700; font-size: 0.82rem; }
    .stock-val { font-size: 0.78rem; color: var(--text-secondary); }

    .summary-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .summary-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 10px 16px; font-size: 0.82rem;
    }
    .summary-item b { color: var(--accent-dark); font-size: 1rem; }
    .loading-overlay { text-align: center; padding: 60px; color: var(--text-muted); }

    /* Checkbox styles */
    .cb-ordered, .cb-ignore {
      width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent);
    }
    .cb-ignore { accent-color: var(--danger); }

    .ignored-badge {
      display: inline-block; background: #fee2e2; color: #b91c1c;
      border-radius: 20px; padding: 1px 8px; font-size: 0.68rem; font-weight: 700;
    }
    .ordered-badge {
      display: inline-block; background: #dcfce7; color: #15803d;
      border-radius: 20px; padding: 1px 8px; font-size: 0.68rem; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">

    <!-- إعدادات -->
    <div class="settings-card">
      <div class="settings-title"><i class="fas fa-sliders-h" style="color:var(--accent);"></i> إعدادات الطلب</div>
      <table class="rules-table">
        <thead>
          <tr>
            <th>معدل الاستهلاك >=</th>
            <th>الشهور الاكتيف >=</th>
            <th>معامل التوفير (×)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rules-body">
          <tr>
            <td><input type="number" value="1"    min="0" step="0.5"  class="rule-avg"></td>
            <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
            <td><input type="number" value="1.25" min="1" step="0.05" class="rule-multiply"></td>
            <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
          </tr>
          <tr>
            <td><input type="number" value="5"    min="0" step="0.5"  class="rule-avg"></td>
            <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
            <td><input type="number" value="1.5"  min="1" step="0.05" class="rule-multiply"></td>
            <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
          </tr>
          <tr>
            <td><input type="number" value="10"   min="0" step="0.5"  class="rule-avg"></td>
            <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
            <td><input type="number" value="2.0"  min="1" step="0.05" class="rule-multiply"></td>
            <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
          </tr>
        </tbody>
      </table>
      <button class="btn-add-rule" onclick="addRule()"><i class="fas fa-plus"></i> إضافة قاعدة</button>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="calculate()"><i class="fas fa-calculator"></i> احسب الطلبيات</button>
        <button class="btn" style="background:var(--surface-3);color:var(--text-secondary);" onclick="exportCSV()"><i class="fas fa-file-csv"></i> تصدير CSV</button>
        <button class="btn" style="background:#fef9c3;color:#a16207;" onclick="clearIgnored()"><i class="fas fa-undo"></i> استعادة المتجاهلة</button>
      </div>
    </div>

    <!-- النتائج -->
    <div class="card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-shopping-basket"></i> قائمة الطلبيات</div>
        <div id="result-count" style="font-size:0.82rem;color:var(--text-muted);"></div>
      </div>

      <!-- فلاتر -->
      <div class="filter-row" id="filter-row" style="display:none;">
        <div class="field-icon-wrap" style="flex:2;min-width:200px;">
          <i class="fas fa-search field-icon"></i>
          <input type="text" id="search-input" class="form-input" placeholder="بحث بالاسم أو الكود..." oninput="applyFilters()" style="padding-right:34px;">
        </div>
        <select id="company-filter" class="form-select" style="flex:1;" onchange="applyFilters()">
          <option value="">كل الشركات</option>
        </select>
        <select id="branch-filter" class="form-select" style="flex:1;" onchange="applyFilters()">
          <option value="">كل الفروع (لديهم احتياج)</option>
          <option value="mamora">المعمورة فقط</option>
          <option value="san">سان ستيفانو فقط</option>
          <option value="bishr">سيدى بشر فقط</option>
        </select>
        <select id="status-filter" class="form-select" style="flex:1;" onchange="applyFilters()">
          <option value="all">الكل</option>
          <option value="pending">لم يُطلب</option>
          <option value="ordered">تم الطلب</option>
        </select>
      </div>

      <div id="result-container">
        <div class="loading-overlay">اضغط "احسب الطلبيات" للبدء</div>
      </div>
    </div>

  </div>

  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script>
    const INV_URL = 'https://agent.ebrahimhamdy.com/webhook/inventory';

    var stockMamora = [], stockSan = [], stockBishr = [], salesData = [];
    var dataLoaded  = false;
    var allResults  = [];

    // حالة الأصناف — محفوظة في localStorage
    var itemStates = JSON.parse(localStorage.getItem('cosmo_states') || '{}');
    // { code: { ordered: bool, ignored: bool } }

    function saveStates() { localStorage.setItem('cosmo_states', JSON.stringify(itemStates)); }

    checkAuth().then(function(user) { if (user) loadAllData(); });

    async function loadAllData() {
      document.getElementById('result-container').innerHTML =
        '<div class="loading-overlay">⏳ جاري تحميل البيانات...</div>';
      try {
        var r = await Promise.all([
          fetch(INV_URL + '?type=stock_mamora').then(function(x){ return x.json(); }),
          fetch(INV_URL + '?type=stock_san').then(function(x){ return x.json(); }),
          fetch(INV_URL + '?type=stock_bishr').then(function(x){ return x.json(); }),
          fetch(INV_URL + '?type=sales_monthly').then(function(x){ return x.json(); })
        ]);
        stockMamora = Array.isArray(r[0]) ? r[0] : (r[0].data || []);
        stockSan    = Array.isArray(r[1]) ? r[1] : (r[1].data || []);
        stockBishr  = Array.isArray(r[2]) ? r[2] : (r[2].data || []);
        salesData   = Array.isArray(r[3]) ? r[3] : (r[3].data || []);
        dataLoaded  = true;
        document.getElementById('result-container').innerHTML =
          '<div class="loading-overlay">✅ البيانات جاهزة — اضغط "احسب الطلبيات"</div>';
      } catch(e) {
        document.getElementById('result-container').innerHTML =
          '<div class="loading-overlay" style="color:var(--danger);">❌ فشل تحميل البيانات</div>';
      }
    }

    function getRules() {
      var rules = [];
      document.querySelectorAll('#rules-body tr').forEach(function(row) {
        rules.push({
          avg:      parseFloat(row.querySelector('.rule-avg').value)      || 0,
          months:   parseFloat(row.querySelector('.rule-months').value)   || 1,
          multiply: parseFloat(row.querySelector('.rule-multiply').value) || 1
        });
      });
      rules.sort(function(a,b){ return b.avg - a.avg || b.months - a.months; });
      return rules;
    }

    function getMultiply(avg, active, rules) {
      for (var i = 0; i < rules.length; i++) {
        if (avg >= rules[i].avg && active >= rules[i].months) return rules[i].multiply;
      }
      return 1;
    }

    function calculate() {
      if (!dataLoaded) { alert('البيانات لسه بتتحمل'); return; }
      var rules = getRules();

      var stockMap = {};
      function addStock(arr, branch) {
        arr.forEach(function(item) {
          var code = String(item.itm_code || '').trim();
          if (!stockMap[code]) stockMap[code] = {
            name: item.itm_name_ar || '', company: item.Company_Name_Ar || '',
            unit: item.u_name_big || '', price: parseFloat(item.itm_sell_price_big) || 0,
            mamora: 0, san: 0, bishr: 0
          };
          stockMap[code][branch] = parseFloat(item.sto_qty_big) || 0;
        });
      }
      addStock(stockMamora, 'mamora');
      addStock(stockSan,    'san');
      addStock(stockBishr,  'bishr');

      var salesMap = {};
      salesData.forEach(function(row) {
        var code = String(row.itm_code || '').trim();
        if (!salesMap[code]) salesMap[code] = { mamora:{}, san:{}, bishr:{} };
        var m = String(row.month || '').trim();
        salesMap[code].mamora[m] = (salesMap[code].mamora[m]||0) + (parseFloat(row.mamora)||0);
        salesMap[code].san[m]    = (salesMap[code].san[m]   ||0) + (parseFloat(row.san)   ||0);
        salesMap[code].bishr[m]  = (salesMap[code].bishr[m] ||0) + (parseFloat(row.bishr) ||0);
      });

      var list = [];
      Object.keys(stockMap).forEach(function(code) {
        var s    = stockMap[code];
        var sale = salesMap[code] || {mamora:{},san:{},bishr:{}};

        function bc(branchSales) {
          var active = Object.keys(branchSales).filter(function(m){ return branchSales[m]>0; });
          var total  = active.reduce(function(sum,m){ return sum+branchSales[m]; }, 0);
          var avg    = active.length > 0 ? total/active.length : 0;
          return { avg:avg, activeMonths:active.length, total:total };
        }

        var m = bc(sale.mamora), n = bc(sale.san), b = bc(sale.bishr);
        var mulM = getMultiply(m.avg, m.activeMonths, rules);
        var mulN = getMultiply(n.avg, n.activeMonths, rules);
        var mulB = getMultiply(b.avg, b.activeMonths, rules);

        var targetM = m.avg * mulM;
        var targetN = n.avg * mulN;
        var targetB = b.avg * mulB;

        var needM = Math.ceil(Math.max(0, targetM - s.mamora));
        var needN = Math.ceil(Math.max(0, targetN - s.san));
        var needB = Math.ceil(Math.max(0, targetB - s.bishr));

        var totalTarget = targetM + targetN + targetB;
        var totalStock  = s.mamora + s.san + s.bishr;
        var orderQty    = Math.ceil(totalTarget - totalStock);

        if (orderQty <= 0 || totalTarget === 0) return;

        list.push({
          code, name:s.name, company:s.company, unit:s.unit, price:s.price,
          mamora:  { stock:s.mamora, avg:m.avg, active:m.activeMonths, mul:mulM, target:targetM, need:needM },
          san:     { stock:s.san,    avg:n.avg, active:n.activeMonths, mul:mulN, target:targetN, need:needN },
          bishr:   { stock:s.bishr,  avg:b.avg, active:b.activeMonths, mul:mulB, target:targetB, need:needB },
          totalStock, totalTarget, orderQty
        });
      });

      list.sort(function(a,b){ return b.orderQty - a.orderQty; });
      allResults = list;

      // بناء فلتر الشركات
      var companies = [...new Set(list.map(function(i){ return i.company; }).filter(Boolean))].sort();
      var sel = document.getElementById('company-filter');
      sel.innerHTML = '<option value="">كل الشركات</option>';
      companies.forEach(function(c) {
        var o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });

      document.getElementById('filter-row').style.display = 'flex';
      applyFilters();
    }

    function applyFilters() {
      var search    = document.getElementById('search-input').value.trim().toLowerCase();
      var company   = document.getElementById('company-filter').value;
      var branch    = document.getElementById('branch-filter').value;
      var statusF   = document.getElementById('status-filter').value;

      var filtered = allResults.filter(function(item) {
        var state   = itemStates[item.code] || {};
        if (state.ignored) return true; // المتجاهلة دايماً تظهر (متميزة)

        if (search && !item.name.toLowerCase().includes(search) && !item.code.includes(search)) return false;
        if (company && item.company !== company) return false;
        if (branch) {
          if (branch === 'mamora'  && item.mamora.need <= 0)  return false;
          if (branch === 'san'     && item.san.need    <= 0)  return false;
          if (branch === 'bishr'   && item.bishr.need  <= 0)  return false;
        }
        if (statusF === 'pending' && state.ordered)  return false;
        if (statusF === 'ordered' && !state.ordered) return false;
        return true;
      });

      renderResults(filtered);
    }

    function fmt(n) { return Math.round(n*100)/100; }

    function renderResults(list) {
      var container = document.getElementById('result-container');
      var pending   = list.filter(function(i){ return !(itemStates[i.code]||{}).ordered && !(itemStates[i.code]||{}).ignored; });
      var ordered   = list.filter(function(i){ return (itemStates[i.code]||{}).ordered; });
      var ignored   = list.filter(function(i){ return (itemStates[i.code]||{}).ignored; });

      document.getElementById('result-count').textContent =
        list.length + ' صنف — ' + pending.length + ' لم يُطلب · ' + ordered.length + ' تم الطلب · ' + ignored.length + ' متجاهل';

      if (!list.length) {
        container.innerHTML = '<div class="loading-overlay">✅ لا توجد نتائج</div>';
        return;
      }

      var totalQty = allResults.filter(function(i){ return !(itemStates[i.code]||{}).ignored; })
                               .reduce(function(s,i){ return s+i.orderQty; }, 0);
      var totalVal = allResults.filter(function(i){ return !(itemStates[i.code]||{}).ignored; })
                               .reduce(function(s,i){ return s+i.orderQty*i.price; }, 0);

      var html = `
        <div class="summary-bar">
          <div class="summary-item">أصناف محتاجة: <b>${allResults.filter(i=>!(itemStates[i.code]||{}).ignored).length}</b></div>
          <div class="summary-item">إجمالي الكميات: <b>${totalQty}</b></div>
          <div class="summary-item">القيمة التقديرية: <b>${Math.round(totalVal).toLocaleString('ar-EG')} ج</b></div>
          <div class="summary-item" style="background:#dcfce7;">تم الطلب: <b style="color:#15803d;">${ordered.length} صنف</b></div>
        </div>
        <div style="overflow-x:auto;">
          <table class="order-table">
            <thead>
              <tr>
                <th>الصنف</th>
                <th>الشركة</th>
                <th>المعمورة<br><small style="font-weight:400;opacity:0.8;">احتياج / رصيد / متوسط / ×</small></th>
                <th>سان ستيفانو<br><small style="font-weight:400;opacity:0.8;">احتياج / رصيد / متوسط / ×</small></th>
                <th>سيدى بشر<br><small style="font-weight:400;opacity:0.8;">احتياج / رصيد / متوسط / ×</small></th>
                <th>إجمالي الرصيد</th>
                <th>إجمالي الهدف</th>
                <th>الكمية المطلوبة</th>
                <th>تم الطلب ✅</th>
                <th>تجاهل 🚫</th>
              </tr>
            </thead>
            <tbody>
      `;

      list.forEach(function(item) {
        var state   = itemStates[item.code] || {};
        var rowClass = state.ignored ? 'ignored-row' : state.ordered ? 'ordered-row' : '';

        function branchCell(b) {
          var needColor = b.need > 0 ? 'var(--success)' : 'var(--text-muted)';
          return '<td>' +
            '<div class="branch-need" style="color:' + needColor + ';">' + (b.need > 0 ? '+' + b.need : '—') + '</div>' +
            '<div class="stock-val">' + fmt(b.stock) + ' / ' + fmt(b.avg) +
              (b.active > 0 ? ' <small>(' + b.active + 'ش)</small>' : '') +
            ' <span class="multiply-badge">×' + b.mul + '</span></div>' +
          '</td>';
        }

        html += '<tr class="' + rowClass + '" id="row-' + item.code + '">' +
          '<td>' +
            '<div style="font-weight:600;font-size:0.82rem;">' + item.name +
              (state.ignored ? ' <span class="ignored-badge">متجاهل</span>' : '') +
              (state.ordered ? ' <span class="ordered-badge">تم الطلب</span>' : '') +
            '</div>' +
            '<div style="font-size:0.68rem;color:var(--text-muted);">' + item.code + ' · ' + item.unit + '</div>' +
          '</td>' +
          '<td style="font-size:0.75rem;">' + item.company + '</td>' +
          branchCell(item.mamora) +
          branchCell(item.san) +
          branchCell(item.bishr) +
          '<td style="font-weight:700;">' + fmt(item.totalStock) + '</td>' +
          '<td style="color:var(--accent-dark);font-weight:700;">' + fmt(item.totalTarget) + '</td>' +
          '<td class="order-qty-cell">' + (state.ignored ? '—' : item.orderQty) + '</td>' +
          '<td><input type="checkbox" class="cb-ordered" ' + (state.ordered ? 'checked' : '') +
            ' onchange="toggleOrdered(\'' + item.code + '\', this.checked)"></td>' +
          '<td><input type="checkbox" class="cb-ignore" ' + (state.ignored ? 'checked' : '') +
            ' onchange="toggleIgnored(\'' + item.code + '\', this.checked)"></td>' +
        '</tr>';
      });

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    function toggleOrdered(code, val) {
      if (!itemStates[code]) itemStates[code] = {};
      itemStates[code].ordered = val;
      saveStates();
      applyFilters();
    }

    function toggleIgnored(code, val) {
      if (!itemStates[code]) itemStates[code] = {};
      itemStates[code].ignored = val;
      if (val) itemStates[code].ordered = false;
      saveStates();
      applyFilters();
    }

    function clearIgnored() {
      if (!confirm('هتستعيد كل الأصناف المتجاهلة؟')) return;
      Object.keys(itemStates).forEach(function(code) {
        if (itemStates[code]) itemStates[code].ignored = false;
      });
      saveStates();
      applyFilters();
    }

    function addRule() {
      var tbody = document.getElementById('rules-body');
      var tr    = document.createElement('tr');
      tr.innerHTML =
        '<td><input type="number" value="1" min="0" step="0.5" class="rule-avg"></td>' +
        '<td><input type="number" value="2" min="1" step="1" class="rule-months"></td>' +
        '<td><input type="number" value="1.2" min="1" step="0.05" class="rule-multiply"></td>' +
        '<td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>';
      tbody.appendChild(tr);
    }

    function delRule(btn) {
      if (document.querySelectorAll('#rules-body tr').length <= 1) { alert('لازم قاعدة واحدة على الأقل'); return; }
      btn.closest('tr').remove();
    }

    function exportCSV() {
      var list = allResults.filter(function(i){ return !(itemStates[i.code]||{}).ignored; });
      if (!list.length) { alert('احسب الطلبيات الأول'); return; }
      var rows = [['كود','الصنف','الشركة','الوحدة',
        'احتياج المعمورة','رصيد المعمورة','متوسط المعمورة',
        'احتياج سان','رصيد سان','متوسط سان',
        'احتياج سيدى بشر','رصيد سيدى بشر','متوسط سيدى بشر',
        'إجمالي الرصيد','إجمالي الهدف','الكمية المطلوبة','تم الطلب']];
      list.forEach(function(i) {
        var state = itemStates[i.code] || {};
        rows.push([
          i.code, i.name, i.company, i.unit,
          i.mamora.need, fmt(i.mamora.stock), fmt(i.mamora.avg),
          i.san.need,    fmt(i.san.stock),    fmt(i.san.avg),
          i.bishr.need,  fmt(i.bishr.stock),  fmt(i.bishr.avg),
          i.totalStock, fmt(i.totalTarget), i.orderQty,
          state.ordered ? 'نعم' : 'لا'
        ]);
      });
      var csv  = '\uFEFF' + rows.map(function(r){ return r.join(','); }).join('\n');
      var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href   = url; a.download = 'cosmo_order_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click(); URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
