<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>طلبيات الكوزمو والدوا - Phalix</title>
  <link rel="stylesheet" href="tokens.css?v=20260906">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .top-panel { display:grid; grid-template-columns:1fr 300px; gap:16px; margin-bottom:20px; align-items:start; }
    @media(max-width:860px){ .top-panel{grid-template-columns:1fr;} }
    .settings-panel,.filter-panel { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px; }
    .panel-title { font-size:0.85rem;font-weight:700;color:var(--text-secondary);margin-bottom:12px;display:flex;align-items:center;gap:6px; }
    .rules-table { width:100%;border-collapse:collapse; }
    .rules-table th { background:var(--surface-3);padding:6px 8px;font-size:0.72rem;font-weight:700;color:var(--text-secondary);text-align:center;border-bottom:2px solid var(--border); }
    .rules-table td { padding:5px 6px;border-bottom:1px solid var(--surface-3);text-align:center; }
    .rules-table input { width:58px;text-align:center;padding:4px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:0.78rem;outline:none; }
    .rules-table input:focus { border-color:var(--accent); }
    .btn-del-rule { background:none;border:none;color:var(--danger);cursor:pointer;padding:2px 5px;font-size:0.8rem; }
    .btn-add-rule { display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:5px 10px;background:var(--surface-3);border:1.5px dashed var(--border);border-radius:var(--radius-sm);font-family:var(--font);font-size:0.75rem;font-weight:600;color:var(--text-secondary);cursor:pointer; }
    .btn-add-rule:hover { border-color:var(--accent);color:var(--accent-dark); }
    .filter-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px; }
    .filter-full { grid-column:1/-1; }
    .filter-label { font-size:0.72rem;font-weight:700;color:var(--text-secondary);margin-bottom:3px;display:block; }
    .company-dropdown-wrap { position:relative; }
    .company-trigger { display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;font-family:var(--font);background:var(--surface);user-select:none; }
    .actions-row { display:flex;gap:8px;margin-top:10px;flex-wrap:wrap; }
    .order-wrap { overflow:auto; max-height:calc(100vh - 150px); }
    .order-table { width:100%;border-collapse:collapse;min-width:860px; }
    .order-table th { background:var(--primary);color:#fff;padding:9px 8px;font-size:0.7rem;font-weight:700;text-align:center;white-space:nowrap; position:sticky;top:0;z-index:5; }
    /* شريط تقسيم الصفحات */
    .cosmo-pager { display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--surface-3); }
    .cosmo-pg-info { font-size:0.72rem;color:var(--text-muted);font-weight:600; }
    .cosmo-pg-nav { display:flex;align-items:center;gap:4px;flex-wrap:wrap; }
    .cosmo-pg { min-width:30px;height:30px;padding:0 8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-secondary);border-radius:8px;font-family:inherit;font-size:0.78rem;font-weight:700;cursor:pointer;transition:0.15s; }
    .cosmo-pg:hover:not(:disabled){ border-color:var(--primary);color:var(--primary); }
    .cosmo-pg.act { background:var(--primary);color:#fff;border-color:var(--primary); }
    .cosmo-pg:disabled { opacity:0.4;cursor:default; }
    .cosmo-pg-dots { padding:0 2px;color:var(--text-muted);font-weight:700; }
    .order-table td { padding:7px 8px;font-size:0.77rem;border-bottom:1px solid var(--surface-3);text-align:center;vertical-align:middle; }
    .order-table tr:hover td { background:var(--surface-2); }
    .order-table tr.ignored-row td { opacity:0.4; }
    .order-table tr.ordered-row td { background:#f0fdf4; }
    .multiply-badge { display:inline-block;background:#fef9c3;color:#a16207;border-radius:20px;padding:1px 6px;font-size:0.65rem;font-weight:700; }
    .need-pos { color:var(--success);font-weight:700; }
    .need-neg { color:var(--text-muted); }
    .ignored-badge { display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:20px;padding:1px 7px;font-size:0.65rem;font-weight:700; }
    .ordered-badge { display:inline-block;background:#dcfce7;color:#15803d;border-radius:20px;padding:1px 7px;font-size:0.65rem;font-weight:700; }
    .summary-bar { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px; }
    .summary-item { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 14px;font-size:0.8rem; }
    .summary-item b { color:var(--accent-dark);font-size:0.95rem; }
    .loading-overlay { text-align:center;padding:60px;color:var(--text-muted); }
    .cb-ordered { width:15px;height:15px;cursor:pointer;accent-color:var(--success); }
    .cb-ignore  { width:15px;height:15px;cursor:pointer;accent-color:var(--danger); }
    .qty-input {
      width:82px;text-align:center;padding:5px 6px;
      border:1.5px solid var(--border);border-radius:var(--radius-sm);
      font-family:var(--font);font-size:0.85rem;font-weight:700;
      color:var(--danger);outline:none;background:var(--surface);
      transition:border-color 0.15s;
    }
    .qty-input:focus { border-color:var(--accent); }
    .qty-input:disabled { background:var(--surface-3);color:var(--text-muted);cursor:not-allowed; }
    .qty-edited { border-color:var(--accent)!important;background:#eff6ff!important; }
    .branch-stock { color:#7f1d1d;font-weight:800;font-size:0.78rem; }
    /* صف البحث + الشركات في سطر واحد */
    .search-company-row { display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-bottom:10px;align-items:stretch; }
    @media(max-width:600px){ .search-company-row{grid-template-columns:1fr;} }
    .search-company-row .field-icon-wrap { display:flex;align-items:center; }
    .search-company-row .field-icon-wrap .form-input { height:36px;box-sizing:border-box; }
    /* بحث مرن للشركات */
    .company-search-box { position:relative;display:flex; }
    .company-chips { flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:36px;padding:0 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:text;box-sizing:border-box; }
    .company-chips:focus-within { border-color:var(--accent); }
    .company-chip { display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);color:var(--text-secondary);border-radius:20px;padding:1px 4px 1px 8px;font-size:0.7rem;font-weight:700; }
    .company-chip i { cursor:pointer;color:var(--danger);font-size:0.7rem;padding:1px 3px; }
    .company-chips input { flex:1;min-width:70px;border:none;outline:none;font-family:var(--font);font-size:0.78rem;background:transparent;padding:3px 0; }
    .company-suggest { display:none;position:absolute;top:calc(100% + 3px);right:0;left:0;z-index:999;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);max-height:210px;overflow-y:auto;box-shadow:var(--shadow-md); }
    .company-suggest.open { display:block; }
    .company-suggest .opt { display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:0.78rem;cursor:pointer;border-bottom:1px solid var(--surface-3); }
    .company-suggest .opt:last-child { border-bottom:none; }
    .company-suggest .opt:hover,.company-suggest .opt.active { background:var(--surface-2); }
    .company-suggest .opt.picked { color:var(--accent-dark);font-weight:700; }
    .company-suggest .opt input { width:14px;height:14px;accent-color:var(--accent); }
    .company-suggest .ctrl { padding:6px 10px;font-size:0.72rem;font-weight:700;color:var(--accent-dark);cursor:pointer;border-bottom:2px solid var(--border);background:var(--surface-2); }
    /* توجل النوع كوزمو/دوا */
    .type-toggle { display:inline-flex;border:1.5px solid var(--border);border-radius:var(--radius-md);overflow:hidden; }
    .type-toggle button { border:none;padding:6px 16px;font-family:var(--font);font-size:0.82rem;font-weight:700;cursor:pointer;background:var(--surface);color:var(--text-secondary);transition:0.15s; }
    .type-toggle button.active { background:var(--accent,#3b82f6);color:#fff; }
    /* سويتش معامل الورقيات */
    .paper-switch-wrap { display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border); }
    .paper-switch-wrap label { font-size:0.75rem;font-weight:700;color:var(--text-secondary);cursor:pointer; }
    .switch { position:relative;display:inline-block;width:42px;height:22px; }
    .switch input { opacity:0;width:0;height:0; }
    .switch .slider { position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:22px;transition:0.2s; }
    .switch .slider:before { content:"";position:absolute;height:16px;width:16px;right:3px;bottom:3px;background:var(--surface);border-radius:50%;transition:0.2s; }
    .switch input:checked + .slider { background:var(--accent,#3b82f6); }
    .switch input:checked + .slider:before { transform:translateX(-20px); }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">

    <div class="top-panel">
      <!-- يمين: فلاتر -->
      <div class="filter-panel">
        <div class="panel-title" style="justify-content:space-between;">
          <span><i class="fas fa-filter" style="color:var(--accent);"></i> بحث وفلتر</span>
          <div class="type-toggle">
            <button id="type-cosmo" class="active" onclick="setType('cosmo')">🧴 كوزمو</button>
            <button id="type-medicine" onclick="setType('medicine')">💊 دوا</button>
          </div>
        </div>

        <!-- بحث + شركات في سطر واحد -->
        <div class="search-company-row">
          <div class="field-icon-wrap">
            <i class="fas fa-search field-icon"></i>
            <input type="text" id="search-input" class="form-input" placeholder="اسم أو كود..." oninput="applyFilters()" style="padding-right:34px;">
          </div>
          <div class="company-search-box" id="company-box">
            <div class="company-chips" id="company-chips" onclick="focusCompanyInput()">
              <input type="text" id="company-input" placeholder="كل الشركات..." autocomplete="off"
                     oninput="onCompanySearchInput()" onfocus="openCompanySuggest()" onkeydown="companyKeyDown(event)">
            </div>
            <div class="company-suggest" id="company-suggest"></div>
          </div>
        </div>

        <!-- اختيار الفرع -->
        <div style="margin-top:10px;">
          <span class="filter-label">الفرع المطلوب له</span>
          <div class="type-toggle branch-toggle" style="display:flex;width:100%;">
            <button id="branch-all" class="active" onclick="setBranch('all')" style="flex:1;">🏬 كل الفروع</button>
            <button id="branch-mamora" onclick="setBranch('mamora')" style="flex:1;">المعمورة</button>
            <button id="branch-san" onclick="setBranch('san')" style="flex:1;">سان ستيفانو</button>
            <button id="branch-bishr" onclick="setBranch('bishr')" style="flex:1;">سيدى بشر</button>
          </div>
        </div>

        <div class="filter-grid">
          <div>
            <span class="filter-label">الحالة</span>
            <select id="status-filter" class="form-select" onchange="applyFilters()">
              <option value="all">الكل</option>
              <option value="pending">لم يُطلب</option>
              <option value="ordered">تم الطلب</option>
            </select>
          </div>
          <div style="display:flex;align-items:flex-end;">
            <button class="btn" style="background:#fee2e2;color:#b91c1c;width:100%;font-size:0.78rem;" onclick="clearOrdered()">
              <i class="fas fa-trash-alt"></i> مسح الطلبيات
            </button>
          </div>
        </div>
        <div class="actions-row">
          <button class="btn btn-primary" style="flex:2;" onclick="calculate()">
            <i class="fas fa-calculator"></i> احسب
          </button>
          <button class="btn" style="background:#16a34a;color:#fff;flex:1;" onclick="exportExcel()">
            <i class="fas fa-file-excel"></i> Excel
          </button>
          <button id="btn-toggle-ignored" class="btn" style="background:var(--surface-3);color:var(--text-secondary);flex:1;font-size:0.78rem;" onclick="toggleShowIgnored()">
            <i class="fas fa-eye"></i> <span id="toggle-ignored-label">إظهار المتجاهَل</span>
          </button>
        </div>
      </div>

      <!-- شمال: قواعد -->
      <div class="settings-panel">
        <div class="panel-title"><i class="fas fa-sliders-h" style="color:var(--accent);"></i> قواعد الطلب</div>
        <table class="rules-table">
          <thead><tr><th>معدل >=</th><th>شهور >=</th><th>× معامل</th><th></th></tr></thead>
          <tbody id="rules-body">
            <tr>
              <td><input type="number" value="1"    min="0" step="0.5"  class="rule-avg"></td>
              <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
              <td><input type="number" value="1.25" min="0" step="0.05" class="rule-multiply"></td>
              <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
            </tr>
            <tr>
              <td><input type="number" value="5"    min="0" step="0.5"  class="rule-avg"></td>
              <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
              <td><input type="number" value="1.5"  min="0" step="0.05" class="rule-multiply"></td>
              <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
            </tr>
            <tr>
              <td><input type="number" value="10"   min="0" step="0.5"  class="rule-avg"></td>
              <td><input type="number" value="2"    min="1" step="1"    class="rule-months"></td>
              <td><input type="number" value="2.0"  min="0" step="0.05" class="rule-multiply"></td>
              <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button class="btn-add-rule" onclick="addRule()"><i class="fas fa-plus"></i> قاعدة</button>

        <div class="paper-switch-wrap">
          <label class="switch">
            <input type="checkbox" id="paper-switch" onchange="togglePaperMode(this.checked)">
            <span class="slider"></span>
          </label>
          <label for="paper-switch">📄 معامل الورقيات (0.75)</label>
        </div>
      </div>
    </div>

    <!-- النتائج -->
    <div class="card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-shopping-basket"></i> <span id="list-title">قائمة طلبيات الكوزمو</span></div>
        <div id="result-count" style="font-size:0.8rem;color:var(--text-muted);"></div>
      </div>
      <div id="result-container"><div class="loading-overlay">اضغط "احسب" للبدء</div></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="config.js?v=20260904c"></script>
  <script src="session.js?v=20260904c"></script>
  <script src="branches.js?v=20260904d"></script>
  <script src="pages.js?v=20260904d"></script>
  <script src="brand.js?v=20260904c"></script>
  <script src="api.js?v=20260904c"></script>
  <script>
    const INV_URL = 'https://agent.ebrahimhamdy.com/webhook/inventory';
    var stockSummary=[], salesData=[];
    var dataLoaded=false, allResults=[], filteredResults=[];
    var itemStates = {};
    var currentType = 'cosmo';          // 'cosmo' = itm_ismedicine 0 | 'medicine' = 1
    var selectedBranch = 'all';         // 'all' | 'mamora' | 'san' | 'bishr'
    var allCompanies = [];              // كل الشركات المتاحة للنوع الحالي
    var selectedCompanies = [];         // المختارة ([] = الكل)
    var companyActiveIdx = -1;          // للتنقل بالكيبورد في الاقتراحات
    var showIgnored = false;            // إظهار المتجاهَل (افتراضي مخفي)
    var customQty  = JSON.parse(localStorage.getItem('cosmo_qty')||'{}');
    var origQty    = {}; // الكميات المحسوبة الأصلية
    var cosmoPage  = 1;                 // الصفحة الحالية في تقسيم النتائج
    var _cosmoSig  = '';                // بصمة الفلاتر — نرجع لأول صفحة لما تتغيّر
    const COSMO_PAGE_SIZE = 50;         // عدد الأصناف في الصفحة

    function saveQty(){ localStorage.setItem('cosmo_qty', JSON.stringify(customQty)); }

    // الكمية الفعلية: تحترم الصفر الصريح (مش بترجع للأصلية لو القيمة 0)
    // الكمية المحسوبة لحظياً من الهدف والرصيد — نفس المنطق الأساسي
    function computedQty(item){
      var q = Math.ceil(item.totalTarget - item.totalStock);
      return q > 0 ? q : 0;
    }

    function qtyOf(item){
      var c = item.code;
      // لو المستخدم عدّلها يدوياً استخدم قيمته، غير كده احسبها لحظياً
      return (customQty.hasOwnProperty(c)) ? customQty[c] : computedQty(item);
    }

    // القيمة الرقمية فقط (للمجاميع) — النص زي "كرتونة" بيرجع 0
    function qtyNum(item){
      var v = qtyOf(item);
      var n = parseFloat(v);
      return isNaN(n) ? 0 : n;
    }

    // هل القيمة نص وليست رقم؟
    function qtyIsText(v){
      return String(v).trim() !== '' && isNaN(parseFloat(v));
    }

    function updateQty(code, val){
      var v = String(val).trim();
      // لو رقم: نظّفه. لو نص: سيبه زي ما هو
      if(!isNaN(parseFloat(v)) && isFinite(v)){
        var n = parseFloat(v);
        if(n < 0) n = 0;
        v = n;
      }
      customQty[code] = v;
      saveQty();
      // لون مختلف لو اتعدلت
      var input = document.getElementById('qty-'+code);
      if(input){
        if(String(v) !== String(origQty[code])) input.classList.add('qty-edited');
        else input.classList.remove('qty-edited');
      }
    }

    function setType(type){
      if(currentType === type) return;
      currentType = type;
      document.getElementById('type-cosmo').classList.toggle('active', type==='cosmo');
      document.getElementById('type-medicine').classList.toggle('active', type==='medicine');
      document.getElementById('list-title').textContent =
        type==='cosmo' ? 'قائمة طلبيات الكوزمو' : 'قائمة طلبيات الدوا';
      // إعادة ضبط فلتر الشركات وإعادة الحساب
      selectedCompanies = [];
      document.getElementById('company-input').value = '';
      allResults = []; filteredResults = [];
      document.getElementById('result-container').innerHTML =
        '<div class="loading-overlay">اضغط "احسب" للبدء</div>';
      document.getElementById('result-count').textContent = '';
      if(dataLoaded) calculate();
    }

    function setBranch(b){
      if(selectedBranch === b) return;
      selectedBranch = b;
      ['all','mamora','san','bishr'].forEach(function(x){
        document.getElementById('branch-'+x).classList.toggle('active', x===b);
      });
      // إعادة الحساب لأن الكمية/الهدف/المعدل تتغير حسب الفرع
      if(dataLoaded) calculate();
    }
    function qtyKeyNav(e, input){
      if(e.key !== 'Enter' && e.key !== 'Tab') return;
      e.preventDefault();

      // كل خانات الكمية المرئية (غير المعطّلة) بالترتيب الظاهر
      var inputs = Array.prototype.slice.call(
        document.querySelectorAll('.qty-input:not(:disabled)')
      );
      var idx = inputs.indexOf(input);
      if(idx === -1) return;

      // Shift+Tab يرجع لفوق — غير كده ينزل تحت
      var dir  = (e.key === 'Tab' && e.shiftKey) ? -1 : 1;
      var next = inputs[idx + dir];
      if(next){
        next.focus();
        next.select();
      }
    }

    // ===== States من Supabase مباشرة (بدل n8n) =====
    async function loadStates(){
      try {
        var r    = await fetch(SB_URL_API+'/rest/v1/cosmo_states?select=item_code,state', {
          headers: await sbH()
        });
        var rows = await r.json();
        if(!Array.isArray(rows)) rows = [];
        itemStates = {};
        rows.forEach(function(row){
          var code = String(row.item_code||'').trim();
          if(!itemStates[code]) itemStates[code]={};
          if(row.state==='ordered') itemStates[code].ordered=true;
          if(row.state==='ignored') itemStates[code].ignored=true;
        });
      } catch(e){ console.log('loadStates error',e); }
    }

    async function saveState(code, state){
      try {
        await fetch(SB_URL_API+'/rest/v1/cosmo_states?on_conflict=item_code', {
          method:'POST',
          headers: await sbH({ 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates, return=minimal' }),
          body: JSON.stringify([{ item_code:String(code), state:state }])
        });
      } catch(e){ console.log('saveState error',e); }
    }

    async function clearOrdered(){
      if(!confirm('هتمسح كل الطلبيات وترجع الكميات للمحسوبة؟')) return;
      try {
        // حذف كل ordered من Supabase مباشرة
        await fetch(SB_URL_API+'/rest/v1/cosmo_states?state=eq.ordered', {
          method:'DELETE',
          headers: await sbH()
        });
        // مسح الـ state محلياً + رجوع الكميات
Object.keys(itemStates).forEach(function(c){
  if(itemStates[c] && itemStates[c].ordered){
    delete itemStates[c].ordered;
  }
});
customQty = {};
saveQty();
        applyFilters();

    function companyKeyDown(e){
      var matches = getCompanyMatches();
      if(e.key === 'ArrowDown'){
        e.preventDefault();
        companyActiveIdx = Math.min(companyActiveIdx+1, matches.length-1);
        renderCompanySuggest();
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        companyActiveIdx = Math.max(companyActiveIdx-1, 0);
        renderCompanySuggest();
      } else if(e.key === 'Enter'){
        e.preventDefault();
        var pick = companyActiveIdx>=0 ? matches[companyActiveIdx] : matches[0];
        if(pick) toggleCompanyPick(pick);
      } else if(e.key === 'Backspace'){
        var inp = document.getElementById('company-input');
        if(inp.value === '' && selectedCompanies.length){
          selectedCompanies.pop();
          renderCompanyChips();
          renderCompanySuggest();
          applyFilters();
        }
      } else if(e.key === 'Escape'){
        closeCompanySuggest();
      }
    }

    // ===== Rules =====
    function getRules(){
      var rules=[];
      document.querySelectorAll('#rules-body tr').forEach(function(row){
        rules.push({
          avg:parseFloat(row.querySelector('.rule-avg').value)||0,
          months:parseFloat(row.querySelector('.rule-months').value)||1,
          multiply:parseFloat(row.querySelector('.rule-multiply').value)||1
        });
      });
      rules.sort(function(a,b){return b.avg-a.avg||b.months-a.months;});
      return rules;
    }
    function getMultiply(avg,active,rules){
      for(var i=0;i<rules.length;i++){
        if(avg>=rules[i].avg&&active>=rules[i].months) return rules[i].multiply;
      }
      return 1;
    }
    function r1(n){ return Math.round(n*10)/10; }

    // أقل إجمالي رصيد مطلوب بعد الطلب (علبة لكل فرع)
    var MIN_TOTAL = 3;

    // ===== Calculate =====
    function calculate(){
      if(!dataLoaded){alert('البيانات لسه بتتحمل');return;}
      var rules=getRules();
      var stockMap={};
      var wantMed = currentType === 'medicine' ? 1 : 0;
      // stockSummary: صف واحد لكل صنف من الـRPC {c,n,co,u,med,m:{h,q,p},s:{...},b:{...}}
      stockSummary.forEach(function(item){
        // فلترة النوع: كوزمو (0) أو دوا (1)
        var isMed = parseInt(item.med);
        if(isNaN(isMed)) isMed = 0;
        if(isMed !== wantMed) return;
        var code=String(item.c||'').trim();
        if(!code) return;
        var m=item.m||{},s=item.s||{},b=item.b||{};
        // السعر التمثيلي: أول فرع مسجّل فيه الصنف (المعمورة ← سان ← بشر)
        var price = m.h ? m.p : (s.h ? s.p : (b.h ? b.p : 0));
        stockMap[code]={
          name:item.n||'',company:item.co||'',
          unit:item.u||'',price:parseFloat(price)||0,
          mamora:parseFloat(m.q)||0,san:parseFloat(s.q)||0,bishr:parseFloat(b.q)||0
        };
      });

      // salesData بقت ملخّص جاهز من الـRPC: {itm_code, mamora_total, mamora_active, ...}
      var salesMap={};
      salesData.forEach(function(row){
        var code=String(row.itm_code||'').trim();
        if(!code) return;
        salesMap[code]={
          mamora:{ total:parseFloat(row.mamora_total)||0, active:parseInt(row.mamora_active)||0 },
          san:   { total:parseFloat(row.san_total)||0,    active:parseInt(row.san_active)||0 },
          bishr: { total:parseFloat(row.bishr_total)||0,  active:parseInt(row.bishr_active)||0 }
        };
      });

      var list=[];
      Object.keys(stockMap).forEach(function(code){
        var s=stockMap[code];
        var sale=salesMap[code]||{mamora:{},san:{},bishr:{}};
        function bc(bs){
          var active=(bs&&bs.active)||0, total=(bs&&bs.total)||0;
          var avg=active>0?total/active:0;
          return{avg:avg,activeMonths:active};
        }
        var m=bc(sale.mamora),n=bc(sale.san),b=bc(sale.bishr);
        var mulM=getMultiply(m.avg,m.activeMonths,rules);
        var mulN=getMultiply(n.avg,n.activeMonths,rules);
        var mulB=getMultiply(b.avg,b.activeMonths,rules);
        var tM=m.avg*mulM,tN=n.avg*mulN,tB=b.avg*mulB;
        var nM=Math.ceil(Math.max(0,tM-s.mamora));
        var nN=Math.ceil(Math.max(0,tN-s.san));
        var nB=Math.ceil(Math.max(0,tB-s.bishr));

        // الإجماليات حسب الفرع المختار (أو كل الفروع)
        var totalTarget, totalStock, totalAvg;
        if(selectedBranch==='mamora'){ totalTarget=tM; totalStock=s.mamora; totalAvg=m.avg; }
        else if(selectedBranch==='san'){ totalTarget=tN; totalStock=s.san; totalAvg=n.avg; }
        else if(selectedBranch==='bishr'){ totalTarget=tB; totalStock=s.bishr; totalAvg=b.avg; }
        else { totalTarget=tM+tN+tB; totalStock=s.mamora+s.san+s.bishr; totalAvg=m.avg+n.avg+b.avg; }

        var orderQty=Math.ceil(totalTarget-totalStock);
        if(orderQty<=0||totalTarget===0) return;

        origQty[code] = orderQty; // حفظ الكمية الأصلية المحسوبة

        list.push({
          code,name:s.name,company:s.company,unit:s.unit,price:s.price,
          mamora:{stock:s.mamora,avg:r1(m.avg),active:m.activeMonths,mul:mulM,need:nM},
          san:   {stock:s.san,   avg:r1(n.avg),active:n.activeMonths,mul:mulN,need:nN},
          bishr: {stock:s.bishr, avg:r1(b.avg),active:b.activeMonths,mul:mulB,need:nB},
          totalStock,totalTarget,orderQty,
          totalAvg:r1(totalAvg)
        });
      });

      list.sort(function(a,b){return b.orderQty-a.orderQty;});
      allResults=list;

      // بناء قائمة الشركات للبحث المرن
      allCompanies = [...new Set(list.map(function(i){return i.company;}).filter(Boolean))].sort();
      // شيل أي شركة مختارة لم تعد موجودة في النوع الحالي
      selectedCompanies = selectedCompanies.filter(function(c){return allCompanies.includes(c);});
      renderCompanyChips();

      applyFilters();
    }

    // ===== Filters =====
    function applyFilters(){
      var search   =document.getElementById('search-input').value.trim().toLowerCase();
      var statusF  =document.getElementById('status-filter').value;
      var companies=getSelectedCompanies();

      filteredResults=allResults.filter(function(item){
        var state=itemStates[item.code]||{};
        if(!showIgnored && state.ignored) return false;
        if(search&&!item.name.toLowerCase().includes(search)&&!item.code.includes(search)) return false;
        if(companies.length&&!companies.includes(item.company)) return false;
        if(statusF==='pending'&&state.ordered) return false;
        if(statusF==='ordered'&&!state.ordered) return false;
        return true;
      });
      renderResults(filteredResults);
    }

          <div class="summary-item" style="background:#fee2e2;">متجاهل: <b style="color:#b91c1c;">${ignored}</b></div>
        </div>
        <div class="order-wrap">
          <table class="order-table">
            <thead>
              <tr>
                <th style="width:30px;">✅</th>
                <th style="width:30px;">🚫</th>
                <th style="text-align:right;">الصنف</th>
                <th>الكمية المطلوبة</th>
                <th>${brLbl} المعدل الشهري</th>
                <th>${brLbl} الهدف</th>
                <th>${brLbl} الرصيد</th>
                <th>المعمورة<br><small style="font-weight:400;opacity:0.8;">احتياج·رصيد·معدل·×</small></th>
                <th>سان ستيفانو<br><small style="font-weight:400;opacity:0.8;">احتياج·رصيد·معدل·×</small></th>
                <th>سيدى بشر<br><small style="font-weight:400;opacity:0.8;">احتياج·رصيد·معدل·×</small></th>
              </tr>
            </thead>
            <tbody>
      `;

      var _total=list.length;
      var _totalPages=Math.max(1,Math.ceil(_total/COSMO_PAGE_SIZE));
      if(cosmoPage>_totalPages)cosmoPage=_totalPages;
      if(cosmoPage<1)cosmoPage=1;

    // ===== تقسيم الصفحات =====
    function cosmoPagerHtml(page,totalPages,total,startIdx,shown){
      function btn(p,lbl,dis,act){
        return '<button class="cosmo-pg'+(act?' act':'')+'" '+
          (dis?'disabled':'onclick="cosmoGoPage('+p+')"')+'>'+lbl+'</button>';
      }
      var nums='', win=2;
      var from=Math.max(1,page-win), to=Math.min(totalPages,page+win);
      if(from>1){ nums+=btn(1,'1',false,page===1); if(from>2) nums+='<span class="cosmo-pg-dots">…</span>'; }
      for(var p=from;p<=to;p++) nums+=btn(p,String(p),false,p===page);
      if(to<totalPages){ if(to<totalPages-1) nums+='<span class="cosmo-pg-dots">…</span>'; nums+=btn(totalPages,String(totalPages),false,page===totalPages); }
      return '<div class="cosmo-pager">'+
        '<div class="cosmo-pg-info">عرض '+(startIdx+1)+'–'+(startIdx+shown)+' من '+total+'</div>'+
        '<div class="cosmo-pg-nav">'+
          btn(1,'«',page===1,false)+btn(page-1,'‹',page===1,false)+nums+
          btn(page+1,'›',page===totalPages,false)+btn(totalPages,'»',page===totalPages,false)+
        '</div>'+
        '<div class="cosmo-pg-info">صفحة '+page+' من '+totalPages+'</div>'+
      '</div>';
    }
    function cosmoGoPage(p){
      cosmoPage=p;
      renderResults(filteredResults);
      // scroll لأعلى قائمة النتائج
      var w=document.querySelector('.order-wrap'); if(w) w.scrollTop=0;
      var c=document.getElementById('result-container'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'});
    }

    // ===== State toggles =====

      if(!itemStates[code]) itemStates[code]={};
      itemStates[code].ordered=val;
      await saveState(code, val?'ordered':'none');
      applyFilters();

    async function toggleIgnored(code,val){
      if(!itemStates[code]) itemStates[code]={};
      itemStates[code].ignored=val;
      if(val) itemStates[code].ordered=false;
      await saveState(code, val?'ignored':'none');

    // ===== Export Excel - عمودين =====
    function exportExcel(){
      // استبعاد المتجاهل + استبعاد أي صنف كميته صفر (بعد التعديل)
      var list = filteredResults.filter(function(i){
        if((itemStates[i.code]||{}).ignored) return false;
        var v = qtyOf(i);
        if(qtyIsText(v)) return true;   // نص زي "كرتونة" يتصدّر عادي
        return qtyNum(i) > 0;
      });
      if(!list.length){ alert('لا توجد أصناف بكمية أكبر من صفر'); return; }

      var half  = Math.ceil(list.length / 2);
      var left  = list.slice(0, half);
      var right = list.slice(half);

      var wsData = [
        ['الصنف', 'الكمية المطلوبة', '', 'الصنف', 'الكمية المطلوبة']
      ];

      for(var i = 0; i < left.length; i++){
        var l    = left[i];
        var r    = right[i];
        var lQty = qtyOf(l);
        var rName= r ? r.name : '';
        var rQty = r ? qtyOf(r) : '';
        wsData.push([l.name, lQty, '', rName, rQty === '' ? '' : rQty]);
      }

      var wb = XLSX.utils.book_new();
      var ws = XLSX.utils.aoa_to_sheet(wsData);

      // عرض الأعمدة
      ws['!cols'] = [
        {wch:42}, {wch:14}, {wch:3}, {wch:42}, {wch:14}
      ];

      // تجميد الصف الأول
      ws['!freeze'] = {xSplit:0, ySplit:1};

      XLSX.utils.book_append_sheet(wb, ws, 'الطلبية');
      var brTag = selectedBranch==='all' ? '' : '_'+selectedBranch;
      var fname = (currentType==='medicine'?'medicine':'cosmo') + brTag + '_order_';
      XLSX.writeFile(wb, fname + new Date().toISOString().slice(0,10) + '.xlsx');
    }
  </script>
</body>
</html>
