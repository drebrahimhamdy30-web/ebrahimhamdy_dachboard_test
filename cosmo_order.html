<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>طلبيات الكوزمو - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .settings-title {
      font-size: 0.88rem; font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .rules-table { width: 100%; border-collapse: collapse; }
    .rules-table th {
      background: var(--surface-3);
      padding: 8px 12px;
      font-size: 0.75rem; font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      border-bottom: 2px solid var(--border);
    }
    .rules-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--surface-3);
      text-align: center;
    }
    .rules-table input {
      width: 70px; text-align: center;
      padding: 5px 8px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.82rem;
      outline: none;
    }
    .rules-table input:focus { border-color: var(--accent); }
    .btn-add-rule {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px;
      background: var(--surface-3);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.78rem; font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer; margin-top: 8px;
    }
    .btn-add-rule:hover { border-color: var(--accent); color: var(--accent-dark); }
    .btn-del-rule {
      background: none; border: none;
      color: var(--danger); cursor: pointer;
      padding: 3px 6px; font-size: 0.85rem;
    }

    /* Order Table */
    .order-table { width: 100%; border-collapse: collapse; min-width: 900px; }
    .order-table th {
      background: var(--primary); color: #fff;
      padding: 10px 10px; font-size: 0.72rem;
      font-weight: 700; text-align: center;
      white-space: nowrap;
    }
    .order-table th:first-child { text-align: right; }
    .order-table td {
      padding: 8px 10px; font-size: 0.78rem;
      border-bottom: 1px solid var(--surface-3);
      text-align: center; vertical-align: middle;
    }
    .order-table td:first-child { text-align: right; }
    .order-table tr:hover td { background: var(--surface-2); }

    .branch-mini {
      display: inline-block;
      background: var(--surface-3);
      border-radius: var(--radius-sm);
      padding: 2px 6px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }
    .order-qty-cell {
      font-weight: 900;
      font-size: 1rem;
      color: var(--danger);
    }
    .multiply-badge {
      display: inline-block;
      background: #fef9c3;
      color: #a16207;
      border-radius: 20px;
      padding: 1px 7px;
      font-size: 0.68rem;
      font-weight: 700;
    }
    .stock-ok { color: var(--success); font-weight: 700; }
    .stock-low { color: var(--danger); font-weight: 700; }

    .summary-bar {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .summary-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-size: 0.82rem;
    }
    .summary-item b { color: var(--accent-dark); font-size: 1rem; }

    .loading-overlay { text-align: center; padding: 60px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">

    <!-- إعدادات القواعد -->
    <div class="settings-card">
      <div class="settings-title">
        <i class="fas fa-sliders-h" style="color:var(--accent);"></i>
        إعدادات الطلب
      </div>
      <table class="rules-table">
        <thead>
          <tr>
            <th>معدل الاستهلاك الشهري >=</th>
            <th>الشهور الاكتيف >=</th>
            <th>معامل التوفير (×)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rules-body">
          <tr>
            <td><input type="number" value="1"  min="0" step="0.5" class="rule-avg"></td>
            <td><input type="number" value="2"  min="1" step="1"   class="rule-months"></td>
            <td><input type="number" value="1.25" min="1" step="0.05" class="rule-multiply"></td>
            <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
          </tr>
          <tr>
            <td><input type="number" value="5"  min="0" step="0.5" class="rule-avg"></td>
            <td><input type="number" value="2"  min="1" step="1"   class="rule-months"></td>
            <td><input type="number" value="1.5"  min="1" step="0.05" class="rule-multiply"></td>
            <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
          </tr>
          <tr>
            <td><input type="number" value="10" min="0" step="0.5" class="rule-avg"></td>
            <td><input type="number" value="2"  min="1" step="1"   class="rule-months"></td>
            <td><input type="number" value="2.0"  min="1" step="0.05" class="rule-multiply"></td>
            <td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>
          </tr>
        </tbody>
      </table>
      <button class="btn-add-rule" onclick="addRule()">
        <i class="fas fa-plus"></i> إضافة قاعدة
      </button>

      <div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="calculate()">
          <i class="fas fa-calculator"></i> احسب الطلبيات
        </button>
        <button class="btn" style="background:var(--surface-3);color:var(--text-secondary);" onclick="exportCSV()">
          <i class="fas fa-file-csv"></i> تصدير CSV
        </button>
      </div>
    </div>

    <!-- النتائج -->
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-shopping-basket"></i> قائمة الطلبيات
        </div>
        <div id="result-count" style="font-size:0.82rem;color:var(--text-muted);"></div>
      </div>
      <div id="result-container">
        <div class="loading-overlay">اضغط "احسب الطلبيات" للبدء</div>
      </div>
    </div>

  </div>

  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script>
    const INV_URL = 'https://agent.ebrahimhamdy.com/webhook/inventory';

    var stockMamora = [];
    var stockSan    = [];
    var stockBishr  = [];
    var salesData   = [];
    var dataLoaded  = false;

    checkAuth().then(function(user) {
      if (user) loadAllData();
    });

    async function loadAllData() {
      document.getElementById('result-container').innerHTML =
        '<div class="loading-overlay">⏳ جاري تحميل البيانات...</div>';
      try {
        var results = await Promise.all([
          fetch(INV_URL + '?type=stock_mamora').then(function(r){ return r.json(); }),
          fetch(INV_URL + '?type=stock_san').then(function(r){ return r.json(); }),
          fetch(INV_URL + '?type=stock_bishr').then(function(r){ return r.json(); }),
          fetch(INV_URL + '?type=sales_monthly').then(function(r){ return r.json(); })
        ]);

        stockMamora = Array.isArray(results[0]) ? results[0] : (results[0].data || []);
        stockSan    = Array.isArray(results[1]) ? results[1] : (results[1].data || []);
        stockBishr  = Array.isArray(results[2]) ? results[2] : (results[2].data || []);
        salesData   = Array.isArray(results[3]) ? results[3] : (results[3].data || []);
        dataLoaded  = true;

        document.getElementById('result-container').innerHTML =
          '<div class="loading-overlay">✅ البيانات جاهزة — اضغط "احسب الطلبيات"</div>';
      } catch(e) {
        document.getElementById('result-container').innerHTML =
          '<div class="loading-overlay" style="color:var(--danger);">❌ فشل تحميل البيانات</div>';
      }
    }

    function getRules() {
      var rules = [];
      document.querySelectorAll('#rules-body tr').forEach(function(row) {
        var avg      = parseFloat(row.querySelector('.rule-avg').value)      || 0;
        var months   = parseFloat(row.querySelector('.rule-months').value)   || 1;
        var multiply = parseFloat(row.querySelector('.rule-multiply').value) || 1;
        rules.push({ avg: avg, months: months, multiply: multiply });
      });
      // ترتيب تنازلي عشان يطبق الأعلى أولاً
      rules.sort(function(a, b) { return b.avg - a.avg || b.months - a.months; });
      return rules;
    }

    function getMultiply(monthlyAvg, activeMonths, rules) {
      for (var i = 0; i < rules.length; i++) {
        if (monthlyAvg >= rules[i].avg && activeMonths >= rules[i].months) {
          return rules[i].multiply;
        }
      }
      return 1;
    }

    function calculate() {
      if (!dataLoaded) { alert('البيانات لسه بتتحمل'); return; }

      var rules = getRules();

      // بناء map للمخزون
      var stockMap = {};
      function addStock(arr, branch) {
        arr.forEach(function(item) {
          var code = String(item.itm_code || '').trim();
          if (!stockMap[code]) stockMap[code] = {
            name: item.itm_name_ar || '',
            company: item.Company_Name_Ar || '',
            unit: item.u_name_big || '',
            price: parseFloat(item.itm_sell_price_big) || 0,
            mamora: 0, san: 0, bishr: 0
          };
          stockMap[code][branch] = parseFloat(item.sto_qty_big) || 0;
        });
      }
      addStock(stockMamora, 'mamora');
      addStock(stockSan,    'san');
      addStock(stockBishr,  'bishr');

      // بناء map للمبيعات — كل كود → { mamora: {month: qty}, san: {...}, bishr: {...} }
      var salesMap = {};
      salesData.forEach(function(row) {
        var code = String(row.itm_code || '').trim();
        if (!salesMap[code]) salesMap[code] = { mamora: {}, san: {}, bishr: {} };
        var m = String(row.month || '').trim();
        salesMap[code].mamora[m] = (salesMap[code].mamora[m] || 0) + (parseFloat(row.mamora) || 0);
        salesMap[code].san[m]    = (salesMap[code].san[m]    || 0) + (parseFloat(row.san)    || 0);
        salesMap[code].bishr[m]  = (salesMap[code].bishr[m]  || 0) + (parseFloat(row.bishr)  || 0);
      });

      // حساب لكل صنف
      var orderList = [];

      Object.keys(stockMap).forEach(function(code) {
        var s    = stockMap[code];
        var sale = salesMap[code] || { mamora: {}, san: {}, bishr: {} };

        function branchCalc(branchSales) {
          var months  = Object.keys(branchSales);
          var active  = months.filter(function(m) { return branchSales[m] > 0; });
          var total   = active.reduce(function(sum, m) { return sum + branchSales[m]; }, 0);
          var avg     = active.length > 0 ? total / active.length : 0;
          return { avg: avg, activeMonths: active.length, total: total };
        }

        var m = branchCalc(sale.mamora);
        var n = branchCalc(sale.san);
        var b = branchCalc(sale.bishr);

        var mulM = getMultiply(m.avg, m.activeMonths, rules);
        var mulN = getMultiply(n.avg, n.activeMonths, rules);
        var mulB = getMultiply(b.avg, b.activeMonths, rules);

        var targetM = m.avg * mulM;
        var targetN = n.avg * mulN;
        var targetB = b.avg * mulB;

        var totalTarget = targetM + targetN + targetB;
        var totalStock  = s.mamora + s.san + s.bishr;
        var orderQty    = Math.ceil(totalTarget - totalStock);

        if (orderQty <= 0) return;
        if (totalTarget === 0) return;

        orderList.push({
          code:     code,
          name:     s.name,
          company:  s.company,
          unit:     s.unit,
          price:    s.price,
          mamora:   { stock: s.mamora, avg: m.avg, active: m.activeMonths, mul: mulM, target: targetM },
          san:      { stock: s.san,    avg: n.avg, active: n.activeMonths, mul: mulN, target: targetN },
          bishr:    { stock: s.bishr,  avg: b.avg, active: b.activeMonths, mul: mulB, target: targetB },
          totalStock:  totalStock,
          totalTarget: totalTarget,
          orderQty:    orderQty
        });
      });

      // ترتيب تنازلي حسب الكمية المطلوبة
      orderList.sort(function(a, b) { return b.orderQty - a.orderQty; });

      window._orderList = orderList;
      renderResults(orderList);
    }

    function fmt(n) { return Math.round(n * 100) / 100; }

    function renderResults(list) {
      var container = document.getElementById('result-container');
      document.getElementById('result-count').textContent = list.length + ' صنف';

      if (!list.length) {
        container.innerHTML = '<div class="loading-overlay">✅ المخزون كافي — لا توجد طلبيات</div>';
        return;
      }

      var totalOrderQty   = list.reduce(function(s, i) { return s + i.orderQty; }, 0);
      var totalOrderValue = list.reduce(function(s, i) { return s + i.orderQty * i.price; }, 0);

      var html = `
        <div class="summary-bar">
          <div class="summary-item">أصناف محتاجة: <b>${list.length}</b></div>
          <div class="summary-item">إجمالي الكميات: <b>${totalOrderQty}</b></div>
          <div class="summary-item">القيمة التقديرية: <b>${Math.round(totalOrderValue).toLocaleString('ar-EG')} ج</b></div>
        </div>
        <div style="overflow-x:auto;">
          <table class="order-table">
            <thead>
              <tr>
                <th>الصنف</th>
                <th>الشركة</th>
                <th colspan="3">المعمورة<br><small style="font-weight:400;">رصيد / متوسط / ×</small></th>
                <th colspan="3">سان ستيفانو<br><small style="font-weight:400;">رصيد / متوسط / ×</small></th>
                <th colspan="3">سيدى بشر<br><small style="font-weight:400;">رصيد / متوسط / ×</small></th>
                <th>إجمالي الرصيد</th>
                <th>إجمالي الهدف</th>
                <th>الكمية المطلوبة</th>
              </tr>
            </thead>
            <tbody>
      `;

      list.forEach(function(item) {
        function branchCells(b) {
          return '<td>' + fmt(b.stock) + '</td>' +
                 '<td style="color:var(--text-secondary);">' + fmt(b.avg) +
                   (b.active > 0 ? ' <small>(' + b.active + 'ش)</small>' : '') + '</td>' +
                 '<td><span class="multiply-badge">×' + b.mul + '</span></td>';
        }
        html += '<tr>' +
          '<td><div style="font-weight:600;font-size:0.82rem;">' + item.name + '</div>' +
            '<div style="font-size:0.68rem;color:var(--text-muted);">' + item.code + ' · ' + item.unit + '</div></td>' +
          '<td style="font-size:0.75rem;">' + item.company + '</td>' +
          branchCells(item.mamora) +
          branchCells(item.san) +
          branchCells(item.bishr) +
          '<td class="' + (item.totalStock < 5 ? 'stock-low' : 'stock-ok') + '">' + fmt(item.totalStock) + '</td>' +
          '<td style="color:var(--accent-dark);font-weight:700;">' + fmt(item.totalTarget) + '</td>' +
          '<td class="order-qty-cell">' + item.orderQty + '</td>' +
        '</tr>';
      });

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    function addRule() {
      var tbody = document.getElementById('rules-body');
      var tr    = document.createElement('tr');
      tr.innerHTML =
        '<td><input type="number" value="1" min="0" step="0.5" class="rule-avg"></td>' +
        '<td><input type="number" value="2" min="1" step="1" class="rule-months"></td>' +
        '<td><input type="number" value="1.2" min="1" step="0.05" class="rule-multiply"></td>' +
        '<td><button class="btn-del-rule" onclick="delRule(this)"><i class="fas fa-times"></i></button></td>';
      tbody.appendChild(tr);
    }

    function delRule(btn) {
      var rows = document.querySelectorAll('#rules-body tr');
      if (rows.length <= 1) { alert('لازم يكون في قاعدة واحدة على الأقل'); return; }
      btn.closest('tr').remove();
    }

    function exportCSV() {
      var list = window._orderList;
      if (!list || !list.length) { alert('احسب الطلبيات الأول'); return; }

      var rows = [['كود الصنف','اسم الصنف','الشركة','الوحدة',
        'رصيد المعمورة','متوسط المعمورة','شهور المعمورة',
        'رصيد سان','متوسط سان','شهور سان',
        'رصيد سيدى بشر','متوسط سيدى بشر','شهور سيدى بشر',
        'إجمالي الرصيد','إجمالي الهدف','الكمية المطلوبة']];

      list.forEach(function(i) {
        rows.push([
          i.code, i.name, i.company, i.unit,
          i.mamora.stock, fmt(i.mamora.avg), i.mamora.active,
          i.san.stock,    fmt(i.san.avg),    i.san.active,
          i.bishr.stock,  fmt(i.bishr.avg),  i.bishr.active,
          i.totalStock, fmt(i.totalTarget), i.orderQty
        ]);
      });

      var csv  = '\uFEFF' + rows.map(function(r) { return r.join(','); }).join('\n');
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href   = url;
      a.download = 'cosmo_order_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
