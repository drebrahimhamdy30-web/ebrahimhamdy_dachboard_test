<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إضافة طلب - Phalix</title>
  <link rel="stylesheet" href="tokens.css?v=20260906">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .form-card { max-width: 900px; margin: 0 auto; }   /* فورم متوسّط مش مترامي على العرض الكامل */
    .type-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 20px;
    }
    @media(max-width:480px){ .type-grid { grid-template-columns: repeat(2, 1fr); } }
    .type-btn {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 6px; padding: 14px 8px;
      border: 2px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface-2); cursor: pointer; transition: all 0.2s;
      font-family: var(--font); font-size: 0.82rem; font-weight: 600;
      color: var(--text-secondary); line-height: 1.3; text-align: center;
    }
    .type-btn i { font-size: 1.2rem; }
    .type-btn.active { border-color: var(--accent); background: #e0f2fe; color: var(--accent-dark); }
    .type-btn:hover { border-color: var(--accent); }
    .form-section { display: none; }
    .form-section.visible { display: block; }
    .field-group { margin-bottom: 16px; }
    .field-group label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .field-icon-wrap { position: relative; }
    .field-icon-wrap i.field-icon { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; pointer-events: none; }
    .field-icon-wrap input, .field-icon-wrap select { padding-right: 34px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-code-name { display: grid; grid-template-columns: 180px 1fr; gap: 12px; }
    @media(max-width:600px){ .grid-2 { grid-template-columns: 1fr; } .grid-code-name { grid-template-columns: 1fr; } }
    .btn-submit-full {
      width: 100%; padding: 15px; background: var(--success); color: #fff;
      border: none; border-radius: var(--radius-md); font-family: var(--font);
      font-size: 1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s; margin-top: 8px;
    }
    .btn-submit-full:hover:not(:disabled) { background: #16a34a; transform: translateY(-1px); }
    .btn-submit-full:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; }
    .items-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 0.85rem; }
    .items-table th { background: var(--surface-3); padding: 8px; font-size: 0.78rem; color: var(--text-secondary); border-bottom: 2px solid var(--border); text-align: center; }
    .items-table td { padding: 7px 5px; border-bottom: 1px solid var(--surface-3); vertical-align: middle; }
    .btn-add-row {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
      background: var(--surface-3); border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm); font-family: var(--font); font-size: 0.82rem;
      font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
      width: 100%; justify-content: center; margin-bottom: 16px;
    }
    .btn-add-row:hover { border-color: var(--accent); color: var(--accent-dark); background: #e0f2fe; }
    .btn-remove-row { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px 8px; font-size: 1rem; }
    .alert-block {
      background: #fee2e2; border: 1.5px solid #fca5a5; border-radius: var(--radius-md);
      padding: 14px 16px; margin-bottom: 16px; display: none; align-items: flex-start; gap: 10px;
    }
    .alert-block.show { display: flex; }
    .alert-block i { color: var(--danger); font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
    .alert-block p { color: #991b1b; font-weight: 600; font-size: 0.9rem; margin: 0; line-height: 1.5; }
    .success-toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #166534; color: #dcfce7; padding: 12px 24px; border-radius: 30px;
      font-weight: 700; font-size: 0.9rem; opacity: 0; transition: all 0.3s;
      z-index: 9999; white-space: nowrap;
    }
    .success-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .readonly-field { background: var(--surface-3); color: var(--text-secondary); border-color: var(--border); cursor: not-allowed; }
    .date-display { padding: 10px 12px; background: var(--surface-3); border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
    .required-star { color: var(--danger); margin-right: 2px; }
    .order-type-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
    .order-type-radio { display: none; }
    .order-type-label {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; border: 2px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface-2); cursor: pointer; font-family: var(--font);
      font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);
      transition: all 0.2s; flex: 1; text-align: center;
    }
    .order-type-radio:checked + .order-type-label { border-color: var(--accent); background: #e0f2fe; color: var(--accent-dark); }
    .order-type-label:hover { border-color: var(--accent); }
    .order-type-error .order-type-label { border-color: var(--danger) !important; }
    .available-branch-box { background: #f0fdf4; border: 1.5px solid #86efac; border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 16px; }
    .lookup-loading { color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; display: none; }
    .lookup-loading.show { display: block; }
    .lookup-found { font-size: 0.75rem; margin-top: 4px; color: var(--success); display: none; }
    .lookup-found.show { display: block; }

    /* كارت تأكيد البيانات "زي ما اتخزنت فعلياً" في الجدول بعد الإرسال */
    .stored-confirm-card {
      background: #f0fdf4; border: 1.5px solid #86efac; border-radius: var(--radius-md);
      padding: 14px 16px; margin-top: 14px;
    }
    .stored-confirm-head {
      font-size: 0.85rem; font-weight: 700; color: #166534; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .stored-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px dashed #bbf7d0; font-size: 0.82rem;
    }
    .stored-row:last-child { border-bottom: none; }
    .stored-row span { color: var(--text-muted); }
    .stored-row b { color: var(--text-primary); font-weight: 700; }
    .stored-row.stored-empty { background: #fef2f2; border-radius: 6px; padding-right: 6px; }
    .stored-row.stored-empty b { color: #dc2626; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card form-card">
      <div class="page-header">
        <div class="page-title"><i class="fas fa-plus-circle"></i> طلب جديد</div>
      </div>

      <div class="type-grid">
        <button class="type-btn active" onclick="setType('شراء', this)">
          <i class="fas fa-shopping-cart" style="color:#f59e0b;"></i> طلب شراء
        </button>
        <button class="type-btn" onclick="setType('تحويل', this)">
          <i class="fas fa-exchange-alt" style="color:#38bdf8;"></i> تحويل
        </button>
        <button class="type-btn" onclick="setType('جرد', this)">
          <i class="fas fa-clipboard-list" style="color:#22c55e;"></i> جرد
        </button>
        <button class="type-btn" onclick="setType('إشعار', this)">
          <i class="fas fa-bell" style="color:#a855f7;"></i> إشعار
        </button>
        <button class="type-btn" onclick="setType('تعاقد', this)">
          <i class="fas fa-file-contract" style="color:#0ea5e9;"></i> لنا فاتورة تعاقد
        </button>
        <button class="type-btn" onclick="setType('عدم_وصول', this)">
          <i class="fas fa-truck" style="color:#ef4444;"></i> لم يصل من الشركات
        </button>
      </div>

      <!-- ===== قسم: شراء / تحويل / جرد / إشعار ===== -->
      <div class="form-section visible" id="section-original">

        <div class="grid-2" id="branch-ordertype-row">
          <div class="field-group" id="branch-div">
            <label id="branch-label">توجيه إلى فرع</label>
            <div class="field-icon-wrap">
              <i class="fas fa-store field-icon"></i>
              <select data-branches id="branch" class="form-select">
                <option value="" disabled selected>اختر الفرع...</option>
              </select>
            </div>
          </div>

          <div class="field-group" id="order-type-div" style="display:none;">
            <label>نوع الطلب <span class="required-star">*</span></label>
            <div class="order-type-wrap" id="order-type-wrap">
              <input type="radio" name="order_type" id="ot-dawaa" class="order-type-radio" value="دواء">
              <label for="ot-dawaa" class="order-type-label">💊 دواء</label>
              <input type="radio" name="order_type" id="ot-cosmo" class="order-type-radio" value="كوزمو">
              <label for="ot-cosmo" class="order-type-label">💄 كوزمو</label>
              <input type="radio" name="order_type" id="ot-tarkibat" class="order-type-radio" value="تركيبات">
              <label for="ot-tarkibat" class="order-type-label">⚗️ تركيبات</label>
            </div>
          </div>
        </div>

        <!-- كود + اسم الصنف (عربي وإنجليزي) -->
        <div id="item-section">
          <div class="grid-code-name">
            <div class="field-group">
              <label>كود الصنف</label>
              <div class="field-icon-wrap">
                <i class="fas fa-barcode field-icon"></i>
                <input type="text" id="item_code" class="form-input"
                  oninput="clearItemName();"
                  onblur="lookupItem()">
              </div>
              <div class="lookup-loading" id="item-loading">⏳ جاري البحث...</div>
              <div class="lookup-found"  id="item-found">✅ تم العثور على الصنف</div>
            </div>
            <div class="field-group" id="item-name-div">
              <label>اسم الصنف (عربي)</label>
              <div class="field-icon-wrap">
                <i class="fas fa-capsules field-icon"></i>
                <input type="text" id="item_name" class="form-input">
              </div>
            </div>
          </div>
          <div class="field-group" id="item-name-en-div">
            <label>اسم الصنف بالإنجليزي</label>
            <div class="field-icon-wrap">
              <i class="fas fa-language field-icon"></i>
              <input type="text" id="item_name_en" class="form-input">
            </div>
          </div>
        </div>

        <!-- بيانات العميل والكمية -->
        <div id="extra-section">
          <div class="grid-code-name">
            <div class="field-group">
              <label>كود العميل</label>
              <div class="field-icon-wrap">
                <i class="fas fa-phone-alt field-icon"></i>
                <input type="text" id="customer_code" class="form-input"
                  inputmode="numeric"
                  oninput="this.value = this.value.replace(/[^0-9]/g, ''); if (this.value.length > 5) this.value = this.value.slice(0, 5); clearCustomerName();"
                  onchange="const v = parseInt(this.value); if (this.value && v > 40000) { alert('كود العميل يجب أن يكون بين 1 و 40000'); this.value = ''; }"
                  onblur="lookupCustomer()">
              </div>
              <div class="lookup-loading" id="customer-loading">⏳ جاري البحث...</div>
              <div class="lookup-found"  id="customer-found">✅ تم العثور على العميل</div>
            </div>
            <div class="field-group">
              <label>اسم العميل</label>
              <div class="field-icon-wrap">
                <i class="fas fa-user field-icon"></i>
                <input type="text" id="customer_name" class="form-input">
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="field-group" style="max-width:200px;">
              <label>الكمية المطلوبة</label>
              <div class="field-icon-wrap">
                <i class="fas fa-sort-numeric-up field-icon"></i>
                <input type="number" id="qty" class="form-input" value="1" min="1">
              </div>
            </div>
            <div class="field-group" id="order-note-div">
              <label>ملاحظات</label>
              <div class="field-icon-wrap">
                <i class="fas fa-sticky-note field-icon"></i>
                <input type="text" id="order-note" class="form-input" placeholder="أي ملاحظات إضافية...">
              </div>
            </div>
          </div>

          <div class="available-branch-box" id="available-branch-div" style="display:none;">
            <label style="display:block;font-size:0.82rem;font-weight:700;color:#166534;margin-bottom:8px;">
              <i class="fas fa-store" style="margin-left:5px;"></i> متوفر بفرع؟
              <span style="font-size:0.73rem;color:var(--text-muted);font-weight:400;"> — اختياري</span>
            </label>
            <div class="field-icon-wrap">
              <i class="fas fa-exchange-alt field-icon" style="color:#16a34a;"></i>
              <select data-branches id="available-branch" class="form-select" style="border-color:#86efac;">
                <option value="">لا — أطلبه من المورد (شراء)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- ملاحظات الجرد -->
        <div id="jarrd-note-div" style="display:none;">
          <div class="field-group">
            <label>ملاحظات الجرد</label>
            <div class="field-icon-wrap">
              <i class="fas fa-sticky-note field-icon"></i>
              <input type="text" id="jarrd-note" class="form-input" placeholder="أي ملاحظات للجرد...">
            </div>
          </div>
        </div>

        <!-- قسم الإشعار -->
        <div class="form-section" id="note-section">
          <div class="grid-2" style="margin-bottom:4px;">
            <div class="field-group">
              <label>موجه إلى <span class="required-star">*</span></label>
              <div class="field-icon-wrap">
                <i class="fas fa-sitemap field-icon"></i>
                <select id="note-target-type" class="form-select" onchange="handleTargetType()">
                  <option value="">اختر نوع التوجيه</option>
                  <option value="قسم">قسم</option>
                  <option value="فرد">فرد</option>
                </select>
              </div>
            </div>
            <div class="field-group" id="dept-div" style="display:none;">
              <label>اختر القسم <span class="required-star">*</span></label>
              <div class="field-icon-wrap">
                <i class="fas fa-users field-icon"></i>
                <select id="note-dept" class="form-select">
                  <option value="مبيعات">مبيعات</option>
                  <option value="مشتريات">مشتريات</option>
                  <option value="حسابات">حسابات</option>
                  <option value="مدخل بيانات">مدخل بيانات</option>
                  <option value="ادارة الفرع">ادارة الفرع</option>
                </select>
              </div>
            </div>
            <div class="field-group" id="person-div" style="display:none;">
              <label>اسم الفرد <span class="required-star">*</span></label>
              <div class="field-icon-wrap">
                <i class="fas fa-user field-icon"></i>
                <input type="text" id="note-person" class="form-input" placeholder="أدخل اسم الشخص">
              </div>
            </div>
          </div>
          <div class="field-group">
            <label>نص الإشعار / التفاصيل</label>
            <textarea id="note_text" class="form-input" rows="4"
              placeholder="اكتب التفاصيل هنا..." style="resize:vertical;"></textarea>
          </div>
        </div>

        <button class="btn-submit-full" id="submitBtn" onclick="submitOrder()">
          <i class="fas fa-paper-plane"></i> إرسال الطلب
        </button>

        <div class="stored-confirm-card" id="storedConfirmCard" style="display:none;">
          <div class="stored-confirm-head">
            <i class="fas fa-database"></i> تم ارسال الطلب بنجاح برجاء التاكد من البيانات المرسله
          </div>
          <div id="storedConfirmBody"></div>
        </div>
      </div>

      <!-- ===== قسم: فاتورة تعاقد ===== -->
      <div class="form-section" id="section-contract">
        <div class="alert-block" id="block-alert">
          <i class="fas fa-ban"></i>
          <p>هذا العميل غير مسموح له في الوقت الحالي<br>يرجى الرجوع لمدير الفرع</p>
        </div>
        <div class="grid-2">
          <div class="field-group">
            <label><i class="fas fa-store" style="margin-left:5px;"></i> الفرع</label>
            <input type="text" id="contract-branch" class="form-input readonly-field" readonly>
          </div>
          <div class="field-group">
            <label><i class="fas fa-calendar-alt" style="margin-left:5px;"></i> التاريخ</label>
            <div class="date-display" id="contract-date"></div>
          </div>
        </div>
        <div class="field-group">
          <label><i class="fas fa-id-card" style="margin-left:5px;"></i> رقم قيد العميل</label>
          <div class="field-icon-wrap">
            <i class="fas fa-hashtag field-icon"></i>
            <input type="text" id="contract-cust-code" class="form-input" placeholder="أدخل رقم القيد">
          </div>
        </div>
        <div class="grid-code-name">
          <div class="field-group">
            <label><i class="fas fa-user-tag" style="margin-left:5px;"></i> كود العميل</label>
            <div class="field-icon-wrap">
              <i class="fas fa-user-tag field-icon"></i>
              <input type="text" id="contract-customer-code" class="form-input" inputmode="numeric"
                oninput="this.value=this.value.replace(/[^0-9]/g,''); if(this.value.length>5)this.value=this.value.slice(0,5); clearContractCustomerName();"
                onchange="const v=parseInt(this.value); if(this.value && v>40000){ alert('كود العميل يجب أن يكون بين 1 و 40000'); this.value=''; }"
                onblur="lookupContractCustomer()" placeholder="كود العميل (للاسم)">
            </div>
            <div class="lookup-loading" id="contract-customer-loading">⏳ جاري البحث...</div>
            <div class="lookup-found"  id="contract-customer-found">✅ تم العثور على العميل</div>
          </div>
          <div class="field-group">
            <label><i class="fas fa-user" style="margin-left:5px;"></i> اسم العميل</label>
            <div class="field-icon-wrap">
              <i class="fas fa-user field-icon"></i>
              <input type="text" id="contract-customer-name" class="form-input" placeholder="يتعبّى من الكود أو اكتبه">
            </div>
          </div>
        </div>
        <div class="field-group">
          <label><i class="fas fa-money-bill-wave" style="margin-left:5px;"></i> إجمالي قيمة الفاتورة</label>
          <div class="field-icon-wrap">
            <i class="fas fa-pound-sign field-icon"></i>
            <input type="number" id="contract-amount" class="form-input" placeholder="0.00" min="0" step="0.01">
          </div>
        </div>
        <div class="field-group">
          <label><i class="fas fa-sticky-note" style="margin-left:5px;"></i> ملاحظات</label>
          <textarea id="contract-notes" class="form-input" rows="3"
            placeholder="أي ملاحظات إضافية..." style="resize:vertical;"></textarea>
        </div>
        <button class="btn-submit-full" id="contractBtn" onclick="submitContract()">
          <i class="fas fa-file-contract"></i> حفظ فاتورة التعاقد
        </button>
      </div>

      <!-- ===== قسم: لم يصل من الشركات ===== -->
      <div class="form-section" id="section-missing">
        <div class="grid-2" style="margin-bottom:4px;">
          <div class="field-group">
            <label><i class="fas fa-store" style="margin-left:5px;"></i> الفرع</label>
            <input type="text" id="missing-branch" class="form-input readonly-field" readonly>
          </div>
          <div class="field-group">
            <label><i class="fas fa-calendar-alt" style="margin-left:5px;"></i> التاريخ</label>
            <div class="date-display" id="missing-date"></div>
          </div>
        </div>
        <div class="grid-2">
          <div class="field-group">
            <label><i class="fas fa-file-invoice" style="margin-left:5px;"></i> رقم فاتورة المورد <span class="required-star">*</span></label>
            <div class="field-icon-wrap">
              <i class="fas fa-hashtag field-icon"></i>
              <input type="text" id="missing-invoice" class="form-input" placeholder="أدخل رقم الفاتورة">
            </div>
          </div>
          <div class="field-group">
            <label><i class="fas fa-building" style="margin-left:5px;"></i> كود المورد <span class="required-star">*</span></label>
            <div class="field-icon-wrap">
              <i class="fas fa-hashtag field-icon"></i>
              <input type="number" id="missing-supplier" class="form-input" placeholder="أدخل كود المورد" min="0">
            </div>
          </div>
        </div>
        <hr class="divider">
        <p style="font-size:0.85rem;font-weight:700;color:var(--text-secondary);margin-bottom:12px;">
          <i class="fas fa-boxes"></i> الأصناف الناقصة
        </p>
        <div class="table-wrap" style="margin-bottom:0;">
          <table class="items-table">
            <thead>
              <tr>
                <th style="width:50%;">اسم الصنف</th>
                <th style="width:30%;">العدد</th>
                <th style="width:20%;"></th>
              </tr>
            </thead>
            <tbody id="items-body"></tbody>
          </table>
        </div>
        <button class="btn-add-row" onclick="addItemRow()">
          <i class="fas fa-plus-circle"></i> إضافة صنف
        </button>
        <button class="btn-submit-full" id="missingBtn" onclick="submitMissing()">
          <i class="fas fa-truck"></i> إرسال بلاغ عدم الوصول
        </button>
      </div>

    </div>
  </div>

  <div class="success-toast" id="toast">✅ تم الإرسال بنجاح!</div>

  <script src="config.js?v=20260904c"></script>
  <script src="session.js?v=20260904c"></script>
  <script src="branches.js?v=20260904d"></script>
  <script src="pages.js?v=20260904d"></script>
  <script src="brand.js?v=20260904c"></script>
  <script src="api.js?v=20260904c"></script>
  <script>
    let activeUser  = null;
    let userBranch  = '';
    let currentType = 'شراء';
    let rowCount    = 0;

    // ===== إلغاء اسم الصنف (عربي + إنجليزي) وفك قفلهم عند تعديل الكود =====
    function clearItemName() {
      const nameEl    = document.getElementById('item_name');
      const nameEnEl  = document.getElementById('item_name_en');
      const foundEl   = document.getElementById('item-found');
      if (nameEl.readOnly) {        // اتجاب تلقائياً → نمسحه ونفك القفل
        nameEl.value    = '';
        nameEl.readOnly = false;
        nameEl.classList.remove('readonly-field');
      }
      if (nameEnEl.readOnly) {
        nameEnEl.value    = '';
        nameEnEl.readOnly = false;
        nameEnEl.classList.remove('readonly-field');
      }
      foundEl.classList.remove('show');
    }

    // ===== إلغاء اسم العميل وفك قفله عند تعديل الكود =====
    function clearCustomerName() {
      const nameEl  = document.getElementById('customer_name');
      const foundEl = document.getElementById('customer-found');
      if (nameEl.readOnly) {
        nameEl.value    = '';
        nameEl.readOnly = false;
        nameEl.classList.remove('readonly-field');
      }
      foundEl.classList.remove('show');
    }

    // ===== Lookup: كود الصنف (يجيب الاسم عربي وإنجليزي مع بعض) =====
    async function lookupItem() {
      const code      = document.getElementById('item_code').value.trim();
      if (!code) return;
      const nameEl    = document.getElementById('item_name');
      const nameEnEl  = document.getElementById('item_name_en');
      const loadEl    = document.getElementById('item-loading');
      const foundEl   = document.getElementById('item-found');
      if (nameEl.value.trim()) return;
      loadEl.classList.add('show');
      foundEl.classList.remove('show');
      try {
        const item = await sbItemLookup(code);
        const nameAr = item?.itm_name_ar || '';
        const nameEn = item?.itm_name_en || '';
        if (nameAr) {
          nameEl.value    = nameAr;
          nameEl.readOnly = true;
          nameEl.classList.add('readonly-field');
          foundEl.classList.add('show');
        }
        if (nameEn) {
          nameEnEl.value    = nameEn;
          nameEnEl.readOnly = true;
          nameEnEl.classList.add('readonly-field');
        }
      } catch(e) { console.log('item lookup failed:', e); }
      finally { loadEl.classList.remove('show'); }
    }

    // ===== Lookup: كود العميل =====
    async function lookupCustomer() {
      const code    = document.getElementById('customer_code').value.trim();
      if (!code) return;
      const nameEl  = document.getElementById('customer_name');
      const loadEl  = document.getElementById('customer-loading');
      const foundEl = document.getElementById('customer-found');
      if (nameEl.value.trim()) return;
      loadEl.classList.add('show');
      foundEl.classList.remove('show');
      try {
        const resp = await fetch(FETCH_URL + '?type=customer_lookup&code=' + encodeURIComponent(code));
        const raw  = await resp.json();
        const item = Array.isArray(raw) ? raw[0] : raw;
        const name = item?.cust_name || item?.data?.[0]?.cust_name || '';
        if (name) {
          nameEl.value    = name;
          nameEl.readOnly = true;
          nameEl.classList.add('readonly-field');
          foundEl.classList.add('show');
        }
      } catch(e) { console.log('customer lookup failed:', e); }
      finally { loadEl.classList.remove('show'); }
    }

    // نفس البحث لكن لحقول قسم فاتورة التعاقد
    function clearContractCustomerName() {
      const nameEl = document.getElementById('contract-customer-name');
      if (nameEl) { nameEl.value = ''; nameEl.readOnly = false; nameEl.classList.remove('readonly-field'); }
      const f = document.getElementById('contract-customer-found'); if (f) f.classList.remove('show');
    }
    async function lookupContractCustomer() {
      const code = document.getElementById('contract-customer-code').value.trim();
      if (!code) return;
      const nameEl  = document.getElementById('contract-customer-name');
      const loadEl  = document.getElementById('contract-customer-loading');
      const foundEl = document.getElementById('contract-customer-found');
      if (nameEl.value.trim()) return;
      loadEl.classList.add('show'); foundEl.classList.remove('show');
      try {
        const resp = await fetch(FETCH_URL + '?type=customer_lookup&code=' + encodeURIComponent(code));
        const raw  = await resp.json();
        const item = Array.isArray(raw) ? raw[0] : raw;
        const name = item?.cust_name || item?.data?.[0]?.cust_name || '';
        if (name) {
          nameEl.value = name; nameEl.readOnly = true;
          nameEl.classList.add('readonly-field'); foundEl.classList.add('show');
        }
      } catch(e) { console.log('contract customer lookup failed:', e); }
      finally { loadEl.classList.remove('show'); }
    }

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (Session.branch() || 'المعمورة').trim();
        initDates();
        addItemRow();
        handleTypeInit();
      }
    });

    function initDates() {
      const now     = new Date();
      const opts    = { year: 'numeric', month: 'long', day: 'numeric' };
      const dateStr = now.toLocaleDateString('ar-EG', opts);
      document.getElementById('contract-date').textContent = dateStr;
      document.getElementById('missing-date').textContent  = dateStr;
      document.getElementById('contract-branch').value     = userBranch;
      document.getElementById('missing-branch').value      = userBranch;
    }

    function setType(type, btn) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      hideStoredConfirm();
      handleTypeInit();
    }

    // ===== تأكيد البيانات "زي ما اتخزنت فعلاً" في الجدول (بعد إرسال طلب شراء/تحويل) =====
    const STORED_CONFIRM_FIELDS = [
      { key: 'type',       label: 'نوع الطلب' },
      { key: 'branch',     label: 'الفرع (المخزَّن)' },
      { key: 'item_code',  label: 'كود الصنف' },
      { key: 'item_name',  label: 'اسم الصنف' },
      { key: 'qty',        label: 'الكمية' },
      { key: 'cust_code',  label: 'كود العميل' },
      { key: 'cust_name',  label: 'اسم العميل' },
      { key: 'order_type', label: 'نوع الطلب (شراء)' },
      { key: 'state',      label: 'الحالة' },
      { key: 'note',       label: 'ملاحظات' }
    ];

    function escapeStoredHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showStoredConfirm(row) {
      const card = document.getElementById('storedConfirmCard');
      const body = document.getElementById('storedConfirmBody');
      if (!row) {
        body.innerHTML = `<div class="stored-row stored-empty"><span>تنبيه</span><b>الطلب اتبعت، بس الرد من السيرفر مكنش فيه بيانات نقدر نعرضها — اتأكد يدويًا من الجدول</b></div>`;
        card.style.display = 'block';
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      body.innerHTML = STORED_CONFIRM_FIELDS.map(f => {
        const val   = row[f.key];
        const empty = (val === null || val === undefined || val === '');
        return `<div class="stored-row${empty ? ' stored-empty' : ''}">
          <span>${f.label}</span><b>${empty ? '⚠️ فاضي في الجدول' : escapeStoredHtml(val)}</b>
        </div>`;
      }).join('');
      card.style.display = 'block';
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function hideStoredConfirm() {
      document.getElementById('storedConfirmCard').style.display = 'none';
    }

    function handleTargetType() {
      const type = document.getElementById('note-target-type').value;
      document.getElementById('dept-div').style.display   = (type === 'قسم') ? '' : 'none';
      document.getElementById('person-div').style.display = (type === 'فرد') ? '' : 'none';
    }

    function handleTypeInit() {
      document.getElementById('section-original').classList.remove('visible');
      document.getElementById('section-contract').classList.remove('visible');
      document.getElementById('section-missing').classList.remove('visible');
      document.getElementById('block-alert').classList.remove('show');

      Array.from(document.getElementById('branch').options).forEach(opt => { opt.hidden = false; });
      document.getElementById('branch').value = '';

      if (currentType === 'تعاقد') {
        document.getElementById('section-contract').classList.add('visible');
        return;
      }
      if (currentType === 'عدم_وصول') {
        document.getElementById('section-missing').classList.add('visible');
        return;
      }

      document.getElementById('section-original').classList.add('visible');

      const branchEl           = document.getElementById('branch');
      const branchDiv          = document.getElementById('branch-div');
      const branchLabel        = document.getElementById('branch-label');
      const itemSection        = document.getElementById('item-section');
      const itemNameDiv        = document.getElementById('item-name-div');
      const itemNameEnDiv      = document.getElementById('item-name-en-div');
      const extraSection       = document.getElementById('extra-section');
      const noteSection        = document.getElementById('note-section');
      const orderTypeDiv       = document.getElementById('order-type-div');
      const availableBranchDiv = document.getElementById('available-branch-div');
      const jarrdNoteDiv       = document.getElementById('jarrd-note-div');

      // reset
      itemSection.style.display        = '';
      itemNameDiv.style.display        = '';
      itemNameEnDiv.style.display      = '';
      extraSection.style.display       = '';
      jarrdNoteDiv.style.display       = 'none';
      noteSection.classList.remove('visible');
      branchEl.disabled                = false;
      branchLabel.textContent          = 'توجيه إلى فرع';
      orderTypeDiv.style.display       = 'none';
      availableBranchDiv.style.display = 'none';
      document.querySelectorAll('.order-type-radio').forEach(r => r.checked = false);
      document.getElementById('order-type-wrap').classList.remove('order-type-error');
      document.getElementById('available-branch').value = '';

      if (currentType === 'شراء') {
        branchEl.value    = userBranch;
        branchEl.disabled = true;
        branchLabel.textContent          = 'فرع الطلب (ثابت)';
        orderTypeDiv.style.display       = '';
        availableBranchDiv.style.display = '';
        Array.from(document.getElementById('available-branch').options).forEach(opt => {
          opt.hidden = (opt.value === userBranch);
        });

      } else if (currentType === 'جرد') {
        // فرع افتراضي = فرع المستخدم
        branchEl.value    = userBranch;
        branchEl.disabled = false;
        // إخفاء بيانات العميل والكمية — إظهار اسم الصنف (عربي + إنجليزي) + ملاحظات الجرد
        extraSection.style.display = 'none';
        jarrdNoteDiv.style.display = '';
        document.getElementById('jarrd-note').value = '';

      } else if (currentType === 'إشعار') {
        itemSection.style.display  = 'none';
        extraSection.style.display = 'none';
        branchLabel.textContent    = 'إرسال إلى فرع';
        // فرع افتراضي = فرع المستخدم
        branchEl.value = userBranch;
        noteSection.classList.add('visible');
        // افتراضي: قسم مبيعات
        document.getElementById('note-target-type').value   = 'قسم';
        document.getElementById('dept-div').style.display   = '';
        document.getElementById('person-div').style.display = 'none';
        document.getElementById('note-dept').value          = 'مبيعات';

      } else if (currentType === 'تحويل') {
        branchLabel.textContent = 'طلب تحويل من فرع';
        branchEl.value = '';
        Array.from(branchEl.options).forEach(opt => { opt.hidden = (opt.value === userBranch); });
      }
    }

    function getOrderType() {
      const selected = document.querySelector('.order-type-radio:checked');
      return selected ? selected.value : '';
    }

    async function submitOrder() {
      const btn        = document.getElementById('submitBtn');
      const itemCode   = document.getElementById('item_code').value.trim();
      const itemName   = document.getElementById('item_name').value.trim();
      const itemNameEn = document.getElementById('item_name_en').value.trim();

      if (currentType === 'إشعار') {
        const targetType = document.getElementById('note-target-type').value;
        if (!targetType) { alert('برجاء اختيار نوع التوجيه'); return; }
        if (targetType === 'فرد' && !document.getElementById('note-person').value.trim()) {
          alert('برجاء إدخال اسم الفرد'); return;
        }
      } else if (currentType === 'شراء' || currentType === 'تحويل') {
        // لازم اسم صنف صريح — الكود لوحده مش كفاية (يمنع ظهور "صنف غير مسمى")
        if (!itemName) {
          alert('برجاء إدخال اسم الصنف — لو الكود مش بيطلّع اسم تلقائيًا، اكتب الاسم بنفسك');
          document.getElementById('item_name').focus();
          return;
        }
      } else {
        if (!itemCode && !itemName) { alert('برجاء إدخال كود أو اسم الصنف'); return; }
      }

      if (currentType === 'تحويل' && !document.getElementById('branch').value) {
        alert('برجاء اختيار فرع التحويل'); return;
      }

      let orderType = '';
      if (currentType === 'شراء') {
        orderType = getOrderType();
        if (!orderType) {
          document.getElementById('order-type-wrap').classList.add('order-type-error');
          alert('برجاء اختيار نوع الطلب'); return;
        }
        document.getElementById('order-type-wrap').classList.remove('order-type-error');
      }

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

      const targetType  = document.getElementById('note-target-type')?.value || '';
      const assignedTo  = targetType === 'قسم'
        ? document.getElementById('note-dept').value
        : document.getElementById('note-person').value.trim();
      const availableBranch = document.getElementById('available-branch').value;
      const actualType      = (currentType === 'شراء' && availableBranch) ? 'تحويل' : currentType;

      // ملاحظة — الجرد يأخد من حقله الخاص
      let noteVal = '';
      if (currentType === 'جرد') {
        noteVal = document.getElementById('jarrd-note').value.trim();
      } else if (currentType === 'إشعار') {
        noteVal = document.getElementById('note_text').value.trim();
      } else {
        noteVal = document.getElementById('order-note').value.trim();
      }

      const payload = {
        action:        'insert_order',
        type:          actualType,
        user:          activeUser,
        branch:        userBranch,
        target_branch: availableBranch || document.getElementById('branch').value,
        item_code:     itemCode  || null,
        item:          itemName  || null,
        item_name_ar:  itemName  || null,
        item_name_en:  itemNameEn || null,
        customer_code: document.getElementById('customer_code')?.value.trim() || null,
        customer_name: document.getElementById('customer_name')?.value.trim() || null,
        qty:           document.getElementById('qty')?.value || 1,
        note:          noteVal   || null,
        order_type:    orderType || null,
        target_type:   targetType || null,
        assigned_to:   assignedTo || null,
        state:         'pending',
        createdAt:     new Date().toISOString()
      };

      try {
        const isJardType = (currentType === 'جرد');
        if (isJardType) {
          const success = await updateInventoryAudit(payload);
          if (success) { showToast(); hideStoredConfirm(); resetOriginalForm(); }
          else alert('فشل الإرسال ❌');
        } else if (actualType === 'شراء' || actualType === 'تحويل') {
          // طلب شراء/تحويل: بيتكتب مباشرة في جدول task على Supabase (بدل n8n)
          // ونعرض البيانات "زي ما اتخزنت فعلاً" من الرد عشان نمسك أي حقل بيضيع
          const result = await sbTaskInsert(payload);
          if (result.ok) {
            showToast();
            showStoredConfirm(result.data);
            resetOriginalForm();
          } else {
            alert('فشل الإرسال ❌');
          }
        } else if (actualType === 'إشعار') {
          // الإشعارات: بتتكتب مباشرة في جدول task على Supabase (بدل n8n)
          const result = await sbTaskInsert(payload);
          if (result.ok) { showToast(); hideStoredConfirm(); resetOriginalForm(); }
          else alert('فشل الإرسال ❌');
        } else {
          const success = await updateData(payload);
          if (success) { showToast(); hideStoredConfirm(); resetOriginalForm(); }
          else alert('فشل الإرسال ❌');
        }
      } catch(e) { alert('خطأ في الاتصال'); }
      finally {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الطلب';
      }
    }

    async function submitContract() {
      const btn      = document.getElementById('contractBtn');
      const custCode = document.getElementById('contract-cust-code').value.trim();
      const amount   = document.getElementById('contract-amount').value.trim();
      if (!custCode) { alert('برجاء إدخال رقم قيد العميل'); return; }
      if (!amount)   { alert('برجاء إدخال إجمالي قيمة الفاتورة'); return; }

      document.getElementById('block-alert').classList.remove('show');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

      const payload = {
        type:         'تعاقد', branch: userBranch,
        cust_code:    custCode, total_amount: amount,
        notes:        document.getElementById('contract-notes').value.trim(),
        createdAt:    new Date().toISOString()
      };

      try {
        // فاتورة التعاقد: بتتكتب مباشرة في جدول contracts على Supabase (بدل n8n)
        const res = await sbContractInsert({
          branch:        userBranch,
          cust_code:     custCode,
          customer_code: document.getElementById('contract-customer-code').value.trim(),
          customer_name: document.getElementById('contract-customer-name').value.trim(),
          total_amount:  amount,
          notes:         document.getElementById('contract-notes').value.trim()
        });
        if (res.blocked) {
          document.getElementById('block-alert').classList.add('show');
          document.getElementById('block-alert').scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (res.ok) {
          showToast();
          document.getElementById('contract-cust-code').value = '';
          document.getElementById('contract-amount').value    = '';
          document.getElementById('contract-notes').value     = '';
          document.getElementById('contract-customer-code').value = '';
          clearContractCustomerName();
        } else { alert('فشل الحفظ ❌'); }
      } catch(e) { alert('خطأ في الاتصال'); }
      finally {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-file-contract"></i> حفظ فاتورة التعاقد';
      }
    }

    function addItemRow() {
      rowCount++;
      const tbody = document.getElementById('items-body');
      const tr    = document.createElement('tr');
      tr.id       = `item-row-${rowCount}`;
      tr.innerHTML = `
        <td><input type="text" class="table-input item-name-input" placeholder="اسم الصنف"></td>
        <td><input type="number" class="table-input item-qty-input" placeholder="العدد" min="1" value="1"></td>
        <td><button class="btn-remove-row" onclick="removeRow(${rowCount})" title="حذف">
          <i class="fas fa-times-circle"></i></button></td>`;
      tbody.appendChild(tr);
    }

    function removeRow(id) {
      if (document.getElementById('items-body').children.length <= 1) {
        alert('يجب أن يكون هناك صنف واحد على الأقل'); return;
      }
      const row = document.getElementById(`item-row-${id}`);
      if (row) row.remove();
    }

    async function submitMissing() {
      const btn          = document.getElementById('missingBtn');
      const invoiceNo    = document.getElementById('missing-invoice').value.trim();
      const supplierCode = document.getElementById('missing-supplier').value.trim();
      if (!invoiceNo)    { alert('برجاء إدخال رقم فاتورة المورد'); return; }
      if (!supplierCode) { alert('برجاء إدخال كود المورد'); return; }

      const rows = document.querySelectorAll('#items-body tr');
      const items = []; let valid = true;
      rows.forEach(row => {
        const name = row.querySelector('.item-name-input').value.trim();
        const qty  = row.querySelector('.item-qty-input').value.trim();
        if (!name) { valid = false; return; }
        items.push({ item_name: name, qty: qty || '1' });
      });
      if (!valid || items.length === 0) { alert('برجاء إدخال اسم الصنف لكل سطر'); return; }

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
      try {
        const results = await Promise.all(items.map(item => sbMissingInsert({
          branch:        userBranch,
          invoice_no:    invoiceNo,
          supplier_code: supplierCode,
          item_name:     item.item_name,
          qty:           item.qty
        })));
        if (results.every(r => r === true)) {
          showToast();
          document.getElementById('missing-invoice').value  = '';
          document.getElementById('missing-supplier').value = '';
          document.getElementById('items-body').innerHTML   = '';
          rowCount = 0; addItemRow();
        } else { alert('فشل إرسال بعض الأصناف ❌'); }
      } catch(e) { alert('خطأ في الاتصال'); }
      finally {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-truck"></i> إرسال بلاغ عدم الوصول';
      }
    }

    function showToast() {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function resetOriginalForm() {
      // إعادة تعيين كود الصنف واسمه (عربي + إنجليزي)
      const itemCodeEl  = document.getElementById('item_code');
      const itemNameEl  = document.getElementById('item_name');
      const itemNameEnEl = document.getElementById('item_name_en');
      itemCodeEl.value     = '';
      itemNameEl.value     = '';
      itemNameEl.readOnly  = false;
      itemNameEl.classList.remove('readonly-field');
      itemNameEnEl.value    = '';
      itemNameEnEl.readOnly = false;
      itemNameEnEl.classList.remove('readonly-field');
      document.getElementById('item-found').classList.remove('show');

      // إعادة تعيين كود العميل واسمه
      const custCodeEl = document.getElementById('customer_code');
      const custNameEl = document.getElementById('customer_name');
      custCodeEl.value    = '';
      custNameEl.value    = '';
      custNameEl.readOnly = false;
      custNameEl.classList.remove('readonly-field');
      document.getElementById('customer-found').classList.remove('show');

      document.getElementById('qty').value          = '1';
      document.getElementById('order-note').value   = '';
      document.getElementById('jarrd-note').value   = '';
      document.getElementById('available-branch').value = '';
      document.querySelectorAll('.order-type-radio').forEach(r => r.checked = false);
      document.getElementById('order-type-wrap').classList.remove('order-type-error');
      document.getElementById('note_text').value          = '';
