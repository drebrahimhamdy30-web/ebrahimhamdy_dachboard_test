<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>تقييم الخدمة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<!--
  ════════════════════════════════════════════════════════
  صفحة تقييم العميل — عامة بطبيعتها
  ════════════════════════════════════════════════════════
  ⚠️ **ممنوع يتحط أي مفتاح أو config.js هنا.** الصفحة دي بيفتحها العملاء
     من بره المؤسسة، فأي مفتاح فيها = مفتاح مسرَّب. الوصول الوحيد عبر
     Edge Function واحدة (order_rating) بتوكن في الرابط، وهي اللي عندها
     صلاحيات القاعدة جوّه السيرفر. نفس نمط supplier.html.

  العميل بيشوف: اسم المؤسسة وشعارها، الفرع، رقم الفاتورة، يوم التوصيل.
  **مش بيشوف** اسمه ولا رقمه ولا المبلغ ولا اسم الصيدلي أو المندوب —
  قرار المالك: التقييم على التجربة مش على الشخص.

  التقييم مرة واحدة لكل رابط؛ الرابط صالح أيام محدودة من الإرسال.
  ════════════════════════════════════════════════════════
-->
<style>
  /* هوية صفحة العميل: برتقالي × فضّي (قرار المالك) — ثابتة ومش بتتاخد من org_settings
     عشان ألوان لوحة التحكم (teal) مش هي ألوان الهوية اللي العميل عارفها */
  :root{
    --bg:#d9dcdf; --bg2:#eceef0; --card:#fff; --txt:#1f2937; --muted:#6b7280;
    --line:#cfd4d9; --brand:#f97316; --brand-d:#c2410c; --ok:#15803d; --err:#b91c1c; --star:#f59e0b; --star-off:#d1d5db;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);min-height:100vh;color:var(--txt);font-family:Cairo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-d) 100%);color:#fff;padding:22px 16px 18px;text-align:center}
  .logo{width:56px;height:56px;border-radius:14px;background:#fff;object-fit:contain;padding:6px;margin:0 auto 8px;display:block}
  .logo.txt{display:flex;align-items:center;justify-content:center;color:var(--brand-d);font-weight:800;font-size:22px}
  h1{margin:0;font-size:1.05rem;font-weight:800}
  .sub{font-size:.8rem;opacity:.92;margin-top:4px}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .q .ttl{font-weight:800;font-size:.98rem;margin-bottom:2px}
  .q .who{font-size:.78rem;color:var(--muted);margin-bottom:10px}
  .rate{display:flex;gap:6px;justify-content:center;direction:ltr}
  .rate button{font-size:36px;line-height:1;background:none;border:0;cursor:pointer;color:var(--star-off);padding:2px 3px;transition:transform .1s;font-family:inherit}
  .rate button.on{color:var(--star)} .rate button:active{transform:scale(1.2)}
  .lbl{text-align:center;font-size:.78rem;color:var(--muted);min-height:16px;margin-top:4px;font-weight:700}
  textarea{width:100%;font-family:inherit;font-size:.9rem;border:1.5px solid var(--line);border-radius:10px;padding:10px;resize:none;height:84px;background:var(--card);color:var(--txt);outline:none}
  textarea:focus{border-color:var(--brand)}
  .send{width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:14px;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;margin-top:4px}
  .send:disabled{opacity:.45;cursor:default}
  .foot{padding:14px;text-align:center;font-size:.72rem;color:var(--muted)}
  .msg{padding:40px 16px;text-align:center;font-weight:700}
  .msg.err{color:var(--err)}
  .done{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 20px;text-align:center;margin-top:8px}
  .done .big{font-size:3rem;line-height:1}
  .done h2{margin:10px 0 6px;font-size:1.1rem}
  .done p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.8}
  .fmsg{font-size:.8rem;font-weight:700;margin-top:8px;text-align:center;min-height:18px}
  .fmsg.err{color:var(--err)}
  /* مسار رقم الفاتورة */
  .lk p{margin:0 0 12px;font-size:.9rem;line-height:1.8;color:var(--txt)}
  .lk input{width:100%;font-family:inherit;font-size:1.25rem;font-weight:800;letter-spacing:1px;text-align:center;direction:ltr;
            border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--txt);outline:none}
  .lk input:focus{border-color:var(--brand)}
  .alt{width:100%;background:var(--card);color:var(--brand-d);border:1.5px solid var(--brand);border-radius:12px;padding:12px;
       font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;margin-top:10px}
  .alt:disabled{opacity:.5}
  .or{text-align:center;color:var(--muted);font-size:.78rem;font-weight:700;margin:10px 0 0}
  .hint{font-size:.76rem;color:var(--muted);text-align:center;margin-top:8px;line-height:1.7}
</style>
</head>
<body>

<header>
  <img class="logo" id="logo" alt="" style="display:none">
  <div class="logo txt" id="logoTxt">★</div>
  <h1 id="h-title">تقييم الخدمة</h1>
  <div class="sub" id="h-sub">جارٍ التحميل…</div>
</header>

<div class="wrap">
  <div id="body"><div class="msg">جارٍ التحميل…</div></div>
</div>

<div class="foot">لا يُعرض اسمك أو رقمك للصيدلي أو مندوب التوصيل · <span id="f-org"></span></div>

<script>
/* عنوان الدالة — مش سر: نفس عنوان المشروع الظاهر في أي صفحة عامة.
   المفتاح هو اللي سر، وهو **مش هنا**. */
var FN = 'https://supabase.ebrahimhamdy.com/functions/v1/order_rating';

var TOKEN = new URLSearchParams(location.search).get('t') || '';
/* رابط ثابت لكل فرع: ?b=<حرف الفرع> — العميل يدخل رقم الفاتورة أو يصوّر الباركود */
var LETTER = (new URLSearchParams(location.search).get('b') || '').trim().toLowerCase();
var LBL = ['', 'سيئ', 'مقبول', 'جيد', 'جيد جدًا', 'ممتاز'];
var PICK = { e: 0, d: 0, s: 0 };
var LBL_S = ['', 'بطيء جدًا', 'بطيء', 'مقبول', 'سريع', 'سريع جدًا'];
var SENDING = false;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function el(id){ return document.getElementById(id); }

function applyOrg(o){
  if (!o) return;
  if (o.name) { el('h-title').textContent = o.name; el('f-org').textContent = o.name; document.title = 'تقييم الخدمة — ' + o.name; }
  if (o.logo) {
    /* logo_url في org_settings نسبي لمجلد delivery/ (الشل بيتحمّل من هناك)،
       والصفحة دي في الجذر — فبنكمّل المسار لو مش مطلق. */
    var src = /^(https?:)?\/\//.test(o.logo) || o.logo.charAt(0) === '/' ? o.logo : 'delivery/' + o.logo;
    var img = el('logo');
    img.onload = function(){ img.style.display = ''; el('logoTxt').style.display = 'none'; };
    img.src = src;
  }
}

function fmtDay(iso){
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long', timeZone:'Africa/Cairo' }); }
  catch (e) { return ''; }
}

function renderForm(d){
  el('h-sub').textContent = [d.branch ? 'فرع ' + d.branch : '', d.bill_no ? 'فاتورة ' + d.bill_no : '', fmtDay(d.delivered_at)].filter(Boolean).join(' · ');
  el('body').innerHTML =
    '<div class="q"><div class="ttl">💊 كيف كان تعامل الصيدلي معك؟</div><div class="who">الذي استقبل طلبك</div>' +
      stars('e') + '<div class="lbl" id="lbl-e"></div></div>' +
    '<div class="q"><div class="ttl">🛵 كيف كان تعامل مندوب التوصيل؟</div><div class="who">الذي أوصل الطلب إليك</div>' +
      stars('d') + '<div class="lbl" id="lbl-d"></div></div>' +
    '<div class="q"><div class="ttl">⚡ ما رأيك في سرعة التوصيل؟</div><div class="who">من وقت الطلب حتى وصوله إليك</div>' +
      stars('s') + '<div class="lbl" id="lbl-s"></div></div>' +
    '<div class="q"><div class="ttl">💬 ملاحظة إضافية <span style="color:var(--muted);font-weight:600;font-size:.78rem">(اختياري)</span></div>' +
      '<textarea id="cmt" maxlength="600" placeholder="ما الذي أعجبك أو تود تحسينه؟"></textarea></div>' +
    '<button class="send" id="send" disabled onclick="submitRating()">إرسال التقييم ✅</button>' +
    '<div class="fmsg" id="fmsg"></div>';
}
function stars(k){
  var h = '<div class="rate" data-k="' + k + '">';
  for (var i = 1; i <= 5; i++) h += '<button type="button" aria-label="' + i + '" onclick="pick(\'' + k + '\',' + i + ',this)">★</button>';
  return h + '</div>';
}
function pick(k, n, btn){
  PICK[k] = n;
  var g = btn.parentElement;
  [].forEach.call(g.children, function(x, i){ x.classList.toggle('on', i < n); });
  el('lbl-' + k).textContent = (k === 's' ? LBL_S : LBL)[n];
  el('send').disabled = !(PICK.e && PICK.d && PICK.s);
}

function renderState(state, d){
  el('h-sub').textContent = [d.branch ? 'فرع ' + d.branch : '', d.bill_no ? 'فاتورة ' + d.bill_no : ''].filter(Boolean).join(' · ');
  if (state === 'rated') {
    el('body').innerHTML = '<div class="done"><div class="big">🙏</div><h2>شكرًا لك</h2><p>وصلنا تقييمك وسيساعدنا على تحسين الخدمة.<br>تم إغلاق هذا الرابط.</p></div>';
  } else {
    el('body').innerHTML = '<div class="done"><div class="big">⌛</div><h2>انتهت صلاحية الرابط</h2><p>رابط التقييم صالح لأيام محدودة من إرساله.<br>شكرًا لتعاملك معنا.</p></div>';
  }
}

/* ═══ مسار رقم الفاتورة ═══════════════════════════════════════════ */
var BRANCH = '';
function renderLookup(){
  el('body').innerHTML =
    '<div class="q lk">' +
      '<div class="ttl">👋 أهلًا بيك، سعداء بتقييمك لخدمتنا</div>' +
      '<p>⭐ التقييم يخص آخر طلب وصل حضرتك، وده بيساعدنا في تطوير الخدمة بشكل مستمر.<br>🧾 اكتب <b>رقم الفاتورة</b> أو قم بتصوير الريسيت لآخر فاتورة.</p>' +
      '<input id="bill" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="رقم الفاتورة" autocomplete="off">' +
      '<button class="send" id="go" onclick="submitLookup()" style="margin-top:10px">متابعة</button>' +
      '<div class="or">أو</div>' +
      '<button class="alt" id="scanBtn" onclick="document.getElementById(\'photo\').click()">📷 تصوير الإيصال</button>' +
      '<input type="file" id="photo" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this)">' +
      '<div class="hint">وجّه الكاميرا على الباركود أسفل الإيصال وسيُقرأ الرقم تلقائيًا.</div>' +
      '<div class="fmsg" id="lmsg"></div>' +
    '</div>';
  el('bill').addEventListener('keydown', function(e){ if (e.key === 'Enter') submitLookup(); });
  el('bill').addEventListener('input', function(){ this.value = this.value.replace(/[^0-9]/g, ''); });
}
function lmsg(t, isErr){ var m = el('lmsg'); if (!m) return; m.className = 'fmsg' + (isErr ? ' err' : ''); m.textContent = t || ''; }

async function submitLookup(){
  var bill = (el('bill').value || '').replace(/[^0-9]/g, '');
  if (bill.length < 3) { lmsg('أدخل رقم الفاتورة كما هو مطبوع على الإيصال.', true); return; }
  var b = el('go'); b.disabled = true; b.textContent = 'جارٍ البحث…'; lmsg('');
  try {
    var r = await fetch(FN + '?b=' + encodeURIComponent(LETTER), { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ bill: bill }) });
    var d = await r.json();
    if (r.ok && d.state === 'open' && d.token) { TOKEN = d.token; await load(); return; }
    if (r.ok && d.state === 'rated') { renderState('rated', { branch: d.branch || BRANCH, bill_no: d.bill_no }); return; }
    lmsg(d.error || 'تعذّر العثور على الفاتورة.', true);
  } catch (e) { lmsg('تعذّر الاتصال. تأكد من الإنترنت وأعد المحاولة.', true); }
  b.disabled = false; b.textContent = 'متابعة';
}

/* قراءة الباركود من صورة الإيصال — المكتبة بتتحمّل عند أول استعمال بس */
var ZX_READY = null;
function loadZXing(){
  if (ZX_READY) return ZX_READY;
  ZX_READY = new Promise(function(resolve, reject){
    if (window.ZXing) return resolve();
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = function(){ resolve(); }; s.onerror = function(){ ZX_READY = null; reject(new Error('lib')); };
    document.head.appendChild(s);
  });
  return ZX_READY;
}
async function onPhoto(inp){
  var f = inp.files && inp.files[0]; if (!f) return;
  var btn = el('scanBtn'); btn.disabled = true; btn.textContent = 'جارٍ قراءة الباركود…'; lmsg('');
  try {
    await loadZXing();
    var img = await new Promise(function(res, rej){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = URL.createObjectURL(f); });
    var txt = decodeBarcode(img);
    var m = txt && txt.match(/(\d{4,12})(?!.*\d)/);
    if (m) { el('bill').value = m[1]; lmsg('تمت قراءة رقم الفاتورة: ' + m[1]); submitLookup(); }
    else lmsg('لم نتمكن من قراءة الباركود. حاول تصويره أقرب وبإضاءة أوضح، أو اكتب رقم الفاتورة.', true);
  } catch (e) { lmsg('تعذّر تشغيل القارئ. اكتب رقم الفاتورة.', true); }
  btn.disabled = false; btn.textContent = '📷 تصوير الإيصال'; inp.value = '';
}
/* تجريب الصورة كاملة ثم بتكبير ودورانات — صور الموبايل بتيجي مايلة ومضغوطة */
function decodeBarcode(img){
  var hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  var reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
  var w0 = img.naturalWidth, h0 = img.naturalHeight;
  var maxSide = 1600, base = Math.min(1, maxSide / Math.max(w0, h0));
  var scales = [base, base * 2], rots = [0, 90, 270, 180];
  for (var si = 0; si < scales.length; si++) for (var ri = 0; ri < rots.length; ri++) {
    var sc = scales[si], rot = rots[ri];
    var w = Math.round(w0 * sc), h = Math.round(h0 * sc);
    var c = document.createElement('canvas'); c.width = rot % 180 ? h : w; c.height = rot % 180 ? w : h;
    var x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h);
    var src = new ZXing.HTMLCanvasElementLuminanceSource(c);
    var bins = [new ZXing.HybridBinarizer(src), new ZXing.GlobalHistogramBinarizer(src)];
    for (var bi = 0; bi < bins.length; bi++) {
      try { return reader.decode(new ZXing.BinaryBitmap(bins[bi]), hints).getText(); } catch (e) {}
    }
  }
  return null;
}

async function loadBranch(){
  try {
    var r = await fetch(FN + '?b=' + encodeURIComponent(LETTER));
    var d = await r.json();
    if (!r.ok) { el('h-sub').textContent = ''; el('body').innerHTML = '<div class="msg err">' + esc(d.error || 'رابط غير صالح') + '</div>'; return; }
    applyOrg(d.org); BRANCH = d.branch || '';
    el('h-sub').textContent = BRANCH ? 'فرع ' + BRANCH : '';
    renderLookup();
  } catch (e) {
    el('h-sub').textContent = '';
    el('body').innerHTML = '<div class="msg err">تعذّر الاتصال. تأكد من الإنترنت وأعد المحاولة.</div>';
  }
}

async function load(){
  if (!TOKEN && /^[a-z]$/.test(LETTER)) return loadBranch();
  if (!/^[0-9a-f]{32}$/.test(TOKEN)) { el('h-sub').textContent = ''; el('body').innerHTML = '<div class="msg err">رابط غير صالح.</div>'; return; }
  try {
    var r = await fetch(FN + '?t=' + encodeURIComponent(TOKEN));
    var d = await r.json();
    if (!r.ok) { el('h-sub').textContent = ''; el('body').innerHTML = '<div class="msg err">' + esc(d.error || 'تعذّر فتح الرابط') + '</div>'; return; }
    applyOrg(d.org);
    if (d.state === 'open') renderForm(d); else renderState(d.state, d);
  } catch (e) {
    el('h-sub').textContent = '';
    el('body').innerHTML = '<div class="msg err">تعذّر الاتصال. تأكد من الإنترنت وأعد المحاولة.</div>';
  }
}

async function submitRating(){
  if (SENDING || !(PICK.e && PICK.d && PICK.s)) return;
  SENDING = true;
  var b = el('send'); b.disabled = true; b.textContent = 'جارٍ الإرسال…';
  var m = el('fmsg'); m.className = 'fmsg'; m.textContent = '';
  try {
    var r = await fetch(FN + '?t=' + encodeURIComponent(TOKEN), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ e: PICK.e, d: PICK.d, s: PICK.s, c: (el('cmt').value || '').trim() })
    });
    var d = await r.json();
    if (r.ok && d.ok) { renderState('rated', {}); return; }
    if (r.status === 409) { renderState('rated', {}); return; }
    if (r.status === 403) { renderState('expired', {}); return; }
    m.className = 'fmsg err'; m.textContent = d.error || 'تعذّر الإرسال، حاول مرة أخرى.';
  } catch (e) {
    m.className = 'fmsg err'; m.textContent = 'تعذّر الاتصال. تأكد من الإنترنت وأعد المحاولة.';
  }
  SENDING = false; b.disabled = false; b.textContent = 'إرسال التقييم ✅';
}

load();
</script>
</body>
</html>
