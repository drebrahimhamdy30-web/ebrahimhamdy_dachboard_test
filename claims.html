<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>المطالبات - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .tabs-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .tab-btn {
      padding:8px 20px; border-radius:20px; border:1px solid var(--border);
      background:var(--surface-3); color:var(--text-secondary);
      font-size:0.88rem; cursor:pointer; transition:all 0.2s; font-family:var(--font);
    }
    .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
    .section-title {
      font-size:0.9rem; font-weight:700; color:var(--text-primary);
      margin:16px 0 8px; padding:8px 12px;
      background:var(--surface-3); border-radius:8px;
      display:flex; align-items:center; gap:8px;
    }
    .claim-card {
      background:var(--surface-2); border:1.5px solid var(--border);
      border-radius:var(--radius-md); padding:16px; margin-bottom:12px;
    }
    .claim-card.collected { opacity:0.6; border-color:var(--success); }
    .editable-cell {
      cursor:pointer;
      padding:4px 6px;
      border-radius:4px;
      transition:background 0.15s;
      min-width:60px;
      display:inline-block;
    }
    .editable-cell:hover { background:var(--surface-3); }
    .cell-input {
      background:var(--surface-3);
      border:1.5px solid var(--accent);
      border-radius:4px;
      color:var(--text-primary);
      font-family:var(--font);
      font-size:0.82rem;
      padding:3px 6px;
      width:100%;
      outline:none;
    }
    .cell-select {
      background:var(--surface-3);
      border:1.5px solid var(--accent);
      border-radius:4px;
      color:var(--text-primary);
      font-family:var(--font);
      font-size:0.82rem;
      padding:3px 4px;
      outline:none;
    }
    /* ===== فلتر التاريخ ===== */
    .filter-bar {
      display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;
      background:var(--surface-2); border:1.5px solid var(--border);
      border-radius:var(--radius-md); padding:12px; margin-bottom:12px;
    }
    .filter-group { display:flex; flex-direction:column; gap:4px; }
    .filter-group label {
      font-size:0.75rem; color:var(--text-secondary); font-weight:700;
    }
    .date-input {
      background:var(--surface-3); border:1.5px solid var(--border);
      border-radius:6px; color:var(--text-primary);
      font-family:var(--font); font-size:0.82rem; padding:6px 8px; outline:none;
    }
    .date-input:focus { border-color:var(--accent); }
    .row-check { width:16px; height:16px; cursor:pointer; accent-color:var(--accent); }
    tr.unchecked-row { opacity:0.45; }
  </style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-file-invoice-dollar"></i> المطالبات
        </div>
        <button class="btn btn-primary" onclick="loadAll()">
          <i class="fas fa-sync-alt"></i> تحديث
        </button>
      </div>

      <div class="tabs-bar">
        <button class="tab-btn active" onclick="switchTab('pending', this)">📋 جاهزة للمطالبة</button>
        <button class="tab-btn" onclick="switchTab('claims', this)">📁 المطالبات المرسلة</button>
      </div>

<!-- تبويب ١: جاهزة للمطالبة -->
      <div id="tab-pending">
        <div class="filter-bar">
          <div class="filter-group">
            <label>🔍 بحث (اسم العميل / رقم القيد)</label>
            <input type="text" id="claim-search" class="date-input" placeholder="اسم العميل أو رقم القيد أو رقم الفاتورة..."
                   oninput="onSearchChange()" style="min-width:230px;">
          </div>
          <div class="filter-group">
            <label>من تاريخ</label>
            <input type="date" id="date-from" class="date-input" onchange="onDateFilterChange()">
          </div>
          <div class="filter-group">
            <label>إلى تاريخ</label>
            <input type="date" id="date-to" class="date-input" onchange="onDateFilterChange()">
          </div>
          <button class="btn btn-sm" onclick="clearDateFilter()"
            style="background:var(--surface-3);color:var(--text-secondary);border:1.5px solid var(--border);">
            <i class="fas fa-times"></i> مسح الفلتر
          </button>
          <div style="margin-right:auto;font-size:0.82rem;font-weight:700;color:var(--text-secondary);">
            <span id="selection-info"></span>
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;">
          <button class="btn btn-primary" onclick="previewPDF()" id="preview-pdf-btn">
            <i class="fas fa-file-pdf"></i> معاينة PDF
          </button>
          <button class="btn btn-success" onclick="createClaim()" id="create-claim-btn">
            <i class="fas fa-paper-plane"></i> إنشاء مطالبة
          </button>
        </div>

        <div class="section-title">👷 عاملين</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:34px;"><input type="checkbox" class="row-check" id="check-all-workers" onclick="toggleAll('عاملين', this)"></th>
                <th>م</th>
                <th>رقم القيد</th>
                <th>اسم العميل</th>
                <th>ملاحظات</th>
                <th>طريقة الدفع</th>
                <th>المبلغ المطالب</th>
              </tr>
            </thead>
            <tbody id="workers-body">
              <tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">⏳ جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="workers-total" style="text-align:left;font-weight:700;color:var(--warning);padding:8px 0 16px;font-size:0.9rem;"></div>

        <div class="section-title">👴 معاشات</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:34px;"><input type="checkbox" class="row-check" id="check-all-retirees" onclick="toggleAll('معاشات', this)"></th>
                <th>م</th>
                <th>رقم القيد</th>
                <th>اسم العميل</th>
                <th>ملاحظات</th>
                <th>طريقة الدفع</th>
                <th>المبلغ المطالب</th>
              </tr>
            </thead>
            <tbody id="retirees-body">
              <tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">⏳ جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="retirees-total" style="text-align:left;font-weight:700;color:var(--warning);padding:8px 0;font-size:0.9rem;"></div>
      </div>

      <!-- تبويب ٢: المطالبات المرسلة -->
      <div id="tab-claims" style="display:none;">
        <div id="claims-container">
          <p style="text-align:center;padding:40px;color:var(--text-muted);">⏳ جاري التحميل...</p>
        </div>
      </div>
    </div>
  </div>

<script src="config.js?v=20260903"></script>
<script src="api.js?v=tt20260830"></script>
  <script>
    let activeUser   = null;
    let userBranch   = '';
    let allContracts = [];
    let allClaims    = [];
    let currentTab   = 'pending';
    let excludedIds  = new Set();   // الفواتير اللي شيلت علامة الاختيار عنها

    // ===== مصدر الفواتير: contract_invoices في Supabase (بدل n8n القديم اللي بيرجّع نسخة ناقصة) =====
    const SB_URL_CI = PHALIX_CONFIG.supabaseUrl;
    const SB_KEY_CI = PHALIX_CONFIG.supabaseAnonKey;
    const CI_URL = SB_URL_CI + '/rest/v1/contract_invoices';
    const CI_H   = { apikey: SB_KEY_CI, Authorization: 'Bearer ' + SB_KEY_CI, 'Content-Type': 'application/json' };
    const CI_HW  = { ...CI_H, Prefer: 'return=minimal' };
    function ciReviewer(){ return (activeUser && (activeUser.full_name || activeUser.username)) || localStorage.getItem('fullName') || 'مراجع'; }

    // قراءة كل فواتير التعاقد من Supabase (مقسّمة صفحات — سقف 1000/طلب)
    async function ciLoadInvoices(){
      let all = [], from = 0; const PAGE = 1000;
      while (true) {
        const r = await fetch(CI_URL + `?select=*&order=bill_date.desc.nullslast&limit=${PAGE}&offset=${from}`, { headers: CI_H });
        if (!r.ok) break;
        const chunk = await r.json();
        if (!Array.isArray(chunk)) break;
        all = all.concat(chunk);
        if (chunk.length < PAGE) break;
        from += PAGE;
      }
      return all;
    }

    // كتابة claim_id/المراجعة على contract_invoices مباشرة — بديل updateData بتاع n8n (نفس الاستدعاءات)
    async function updateData(p){
      try{
        const stamp = new Date().toISOString(), by = ciReviewer();
        const patch = { reviewed_at: stamp, reviewed_by: by };
        ['bill_state','bill_type','payment_type','serial_no','cust_name_ar','claim_id','claim_date','merged_into']
          .forEach(k => { if (k in p) patch[k] = (p[k] === '' ? null : p[k]); });
        const r = await fetch(CI_URL + '?id=eq.' + encodeURIComponent(p.id), { method:'PATCH', headers:CI_HW, body:JSON.stringify(patch) });
        return r.ok;
      }catch(e){ console.error('updateData(CI) error', e); return false; }
    }

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (localStorage.getItem('userBranch') || '').trim();
        loadAll();
      }
    });

    async function loadAll() {
      try {
        const [cResp, clResp] = await Promise.all([
          ciLoadInvoices(),
          fetchFromN8N('claims').catch(() => [])
        ]);
        allContracts = Array.isArray(cResp)  ? cResp  : (cResp.data  || []);
        allClaims    = Array.isArray(clResp) ? clResp : (clResp.data || []);
        freezeOrder();   // ثبّت ترتيب العرض (بالتسلسل) مرة واحدة عشان أي تعديل ما يحرّكش الصفوف
        renderCurrentTab();
      } catch(e) {
        console.error(e);
      }
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-pending').style.display = tab === 'pending' ? '' : 'none';
      document.getElementById('tab-claims').style.display  = tab === 'claims'  ? '' : 'none';
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (currentTab === 'pending') renderPending();
      else renderClaims();
    }

    function extractQaid(name) {
      if (!name) return { name: '', qaid: '' };
      const match = name.match(/(\d+)/);
      if (match) {
        const qaid    = match[1];
        const cleaned = name.replace(qaid, '').replace(/[\*\/\-\_]+/g, ' ').trim();
        return { name: cleaned, qaid };
      }
      return { name: name.trim(), qaid: '' };
    }

    function calcAmount(total, paymentType) {
      const t = parseFloat(total) || 0;
      if (!paymentType || paymentType === '3/4') return t * 0.75;
      if (paymentType === 'مساهمة كاملة')        return t;
      if (paymentType === 'مساهمة 50%')           return t * 0.5;
      return t * 0.75;
    }

    // ===== الفلترة =====

    // كل الفواتير اللي حالتها فاتورة ومش متضافة لمطالبة
    function getUnclaimed() {
      return allContracts.filter(item => {
        const state      = String(item.bill_state || '').trim();
        const claimId    = item.claim_id;
        const hasNoClaim = !claimId || claimId === 'null' || claimId === '' || claimId === '0';
        return state === 'فاتورة' && hasNoClaim;
      });
    }

    // تطبيق فلتر التاريخ على bill_date
    function applyDateFilter(list) {
      const fromVal = document.getElementById('date-from')?.value;
      const toVal   = document.getElementById('date-to')?.value;
      if (!fromVal && !toVal) return list;

      const from = fromVal ? new Date(fromVal + 'T00:00:00') : null;
      const to   = toVal   ? new Date(toVal   + 'T23:59:59') : null;

      return list.filter(item => {
        if (!item.bill_date) return false;
        const d = new Date(item.bill_date);
        if (isNaN(d)) return false;
        if (from && d < from) return false;
        if (to   && d > to)   return false;
        return true;
      });
    }

    // تطبيع عربي بسيط عشان البحث بالاسم يبقى متسامح (أ/إ/آ→ا، ى→ي، ة→ه، شيل التطويل والمسافات الزيادة)
    function normAr(s){
      return String(s || '').toLowerCase()
        .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
        .replace(/ـ/g, '').replace(/\s+/g, ' ').trim();
    }

    // فلتر البحث: اسم العميل أو رقم القيد أو رقم الفاتورة
    function applySearchFilter(list){
      const raw = (document.getElementById('claim-search')?.value || '').trim();
      if (!raw) return list;
      const q  = normAr(raw);
      const qd = raw.toLowerCase();
      return list.filter(item => {
        const name     = normAr(item.cust_name_ar || '');
        const { qaid } = extractQaid(item.cust_name_ar || '');
        const billNo   = String(item.bill_no || '').toLowerCase();
        return name.includes(q) || String(qaid || '').includes(qd) || billNo.includes(qd);
      });
    }

    // ترتيب ثابت يتحسب مرة واحدة عند التحميل (بالتسلسل serial_no) — بحيث أي تعديل بعد كده
    // مايحرّكش ترتيب الفواتير. الفاتورة تفضل في مكانها لحد ما تعمل refresh للصفحة.
    let orderKey = new Map();
    function freezeOrder() {
      const sorted = [...allContracts].sort((a, b) =>
        (parseInt(a.serial_no) || 9999) - (parseInt(b.serial_no) || 9999));
      orderKey = new Map();
      sorted.forEach((it, i) => orderKey.set(String(it.id), i));
    }

    // الفواتير الظاهرة حاليًا (بعد فلتر التاريخ + البحث) — مرتّبة بالترتيب المُثبّت
    function getVisible() {
      const list = applySearchFilter(applyDateFilter(getUnclaimed()));
      list.sort((a, b) => {
        const ao = orderKey.has(String(a.id)) ? orderKey.get(String(a.id)) : 9e9;
        const bo = orderKey.has(String(b.id)) ? orderKey.get(String(b.id)) : 9e9;
        return ao - bo;
      });
      return list;
    }

    // الفواتير المختارة فعليًا = الظاهرة ناقص المستبعدة
    function getSelected() {
      return getVisible().filter(i => !excludedIds.has(String(i.id)));
    }

    function onDateFilterChange() {
      excludedIds.clear();   // الفلتر اتغير، نرجّع كل الاختيارات
      renderPending();
    }

    // بحث فوري مع debounce بسيط (عشان مانعملش render على كل حرف)
    let _searchTimer = null;
    function onSearchChange() {
      clearTimeout(_searchTimer);
      _searchTimer = setTimeout(function(){ renderPending(); }, 280);
    }

    function clearDateFilter() {
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value   = '';
      const s = document.getElementById('claim-search'); if (s) s.value = '';
      excludedIds.clear();
      renderPending();
    }

    function toggleRow(id, cb) {
      const key = String(id);
      if (cb.checked) excludedIds.delete(key);
      else            excludedIds.add(key);
      const row = document.getElementById(`claim-row-${id}`);
      if (row) row.classList.toggle('unchecked-row', !cb.checked);
      renderPending();
    }

    function toggleAll(billType, cb) {
      const group = getVisible().filter(i => String(i.bill_type || '').trim() === billType);
      group.forEach(i => {
        if (cb.checked) excludedIds.delete(String(i.id));
        else            excludedIds.add(String(i.id));
      });
      renderPending();
    }

    function renderPending() {
      const visible  = getVisible();
      const workers  = visible.filter(i => String(i.bill_type || '').trim() === 'عاملين');
      const retirees = visible.filter(i => String(i.bill_type || '').trim() === 'معاشات');

      renderGroup('workers-body',  workers,  'workers-total');
      renderGroup('retirees-body', retirees, 'retirees-total');

      // ضبط حالة checkbox الرئيسي لكل مجموعة
      syncHeaderCheck('check-all-workers',  workers);
      syncHeaderCheck('check-all-retirees', retirees);

      // ملخص الاختيار
      const selected = getSelected();
      const info     = document.getElementById('selection-info');
      if (info) {
        info.textContent = `المختار: ${selected.length} من ${visible.length} فاتورة`;
      }
    }

    function syncHeaderCheck(elId, group) {
      const el = document.getElementById(elId);
      if (!el) return;
      const selectedCount = group.filter(i => !excludedIds.has(String(i.id))).length;
      el.checked       = group.length > 0 && selectedCount === group.length;
      el.indeterminate = selectedCount > 0 && selectedCount < group.length;
    }

    function renderGroup(tbodyId, items, totalId) {
      const tbody   = document.getElementById(tbodyId);
      const totalEl = document.getElementById(totalId);

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">لا توجد فواتير</td></tr>`;
        totalEl.textContent = '';
        return;
      }

      // الترقيم بيتم على المختار فقط، ويبدأ من 1 لكل مجموعة
      let grandTotal = 0;
      let serialNum  = 0;

      tbody.innerHTML = items.map(item => {
        const { name, qaid } = extractQaid(item.cust_name_ar || '');
        const amount   = calcAmount(item.total_bill, item.payment_type);
        const payType  = (item.payment_type && item.payment_type !== 'null') ? item.payment_type : '3/4';
        const isChecked = !excludedIds.has(String(item.id));

        let serialCell = '—';
        if (isChecked) {
          serialNum  += 1;
          grandTotal += amount;
          serialCell  = serialNum;
        }

        return `
          <tr id="claim-row-${item.id}" class="${isChecked ? '' : 'unchecked-row'}">
            <td style="text-align:center;">
              <input type="checkbox" class="row-check" ${isChecked ? 'checked' : ''}
                onclick="toggleRow('${item.id}', this)">
            </td>
            <td style="text-align:center;font-weight:700;">${serialCell}</td>
            <td style="text-align:center;font-weight:700;color:var(--accent-dark);">
              <span class="editable-cell" onclick="editQaid('${item.id}', this, '${qaid}')">${qaid || '---'}</span>
            </td>
            <td style="font-weight:600;">
              <span class="editable-cell" onclick="editName('${item.id}', this, '${(item.cust_name_ar || '').replace(/'/g, "&#39;")}')">${name || item.cust_name_ar || '---'}</span>
            </td>
            <td>
              <span class="editable-cell" onclick="editNotes('${item.id}', this, '')">—</span>
            </td>
            <td style="font-size:0.78rem;">
              <span class="editable-cell" onclick="editPayment('${item.id}', this, '${payType}')">${payType}</span>
            </td>
            <td><b style="color:var(--warning);">${amount.toFixed(2)}</b></td>
          </tr>`;
      }).join('');

      const net = grandTotal * 0.85;
      totalEl.innerHTML = `الإجمالي: <span style="color:var(--warning);">${grandTotal.toFixed(2)}</span> جنيه &nbsp;—&nbsp; الصافي (بعد خصم 15%): <span style="color:var(--success);">${net.toFixed(2)}</span> جنيه`;
    }

    // ===== Inline Edit Functions =====

    function editQaid(id, el, current) {
      const item = allContracts.find(x => String(x.id) === String(id));
      if (!item) return;
      const { name } = extractQaid(item.cust_name_ar || '');

      const input = document.createElement('input');
      input.type      = 'text';
      input.value     = current === '---' ? '' : current;
      input.className = 'cell-input';
      input.style.width = '80px';
      el.replaceWith(input);
      input.focus();
      input.select();

      const save = async () => {
        const newQaid   = input.value.trim();
        const newName   = newQaid ? `${name} ${newQaid}` : name;
        const span = document.createElement('span');
        span.className   = 'editable-cell';
        span.textContent = newQaid || '---';
        span.style.color = 'var(--accent-dark)';
        span.style.fontWeight = '700';
        span.onclick = () => editQaid(id, span, newQaid);
        input.replaceWith(span);
        if (newQaid !== (current === '---' ? '' : current)) {
          await updateData({
            type: "contract_update", id,
            bill_no: item.bill_no || null, bill_date: item.bill_date || null,
            cust_code: item.cust_code || null, cust_name_ar: newName,
            total_bill: item.total_bill || null, employee_name: item.employee_name || null,
            bill_state: item.bill_state || null, bill_type: item.bill_type || null,
            payment_type: item.payment_type || null, branch: item.branch || null,
            serial_no: item.serial_no || null
          });
          item.cust_name_ar = newName;
        }
      };
      input.addEventListener('blur', save);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = current; input.blur(); } });
    }

    function editName(id, el, current) {
      const item = allContracts.find(x => String(x.id) === String(id));
      if (!item) return;
      const { qaid } = extractQaid(item.cust_name_ar || '');
      const { name } = extractQaid(item.cust_name_ar || '');

      const input = document.createElement('input');
      input.type      = 'text';
      input.value     = name;
      input.className = 'cell-input';
      input.style.width = '160px';
      el.replaceWith(input);
      input.focus();
      input.select();

      const save = async () => {
        const newName    = input.value.trim();
        const fullName   = qaid ? `${newName} ${qaid}` : newName;
        const span = document.createElement('span');
        span.className   = 'editable-cell';
        span.textContent = newName || name;
        span.style.fontWeight = '600';
        span.onclick = () => editName(id, span, fullName);
        input.replaceWith(span);
        if (newName && newName !== name) {
          await updateData({
            type: "contract_update", id,
            bill_no: item.bill_no || null, bill_date: item.bill_date || null,
            cust_code: item.cust_code || null, cust_name_ar: fullName,
            total_bill: item.total_bill || null, employee_name: item.employee_name || null,
            bill_state: item.bill_state || null, bill_type: item.bill_type || null,
            payment_type: item.payment_type || null, branch: item.branch || null,
            serial_no: item.serial_no || null
          });
          item.cust_name_ar = fullName;
        }
      };
      input.addEventListener('blur', save);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = name; input.blur(); } });
    }

    function editNotes(id, el, current) {
      const item = allContracts.find(x => String(x.id) === String(id));
      if (!item) return;

      const input = document.createElement('input');
      input.type      = 'text';
      input.value     = current || '';
      input.className = 'cell-input';
      input.style.width = '140px';
      el.replaceWith(input);
      input.focus();

      const save = async () => {
        const newVal = input.value.trim();
        const span   = document.createElement('span');
        span.className   = 'editable-cell';
        span.textContent = newVal || '—';
        span.style.fontSize  = '0.82rem';
        span.style.color     = 'var(--text-secondary)';
        span.onclick = () => editNotes(id, span, newVal);
        input.replaceWith(span);
        if (newVal !== current) {
          await updateData({
            type: "contract_update", id,
            bill_no: item.bill_no || null, bill_date: item.bill_date || null,
            cust_code: item.cust_code || null, cust_name_ar: item.cust_name_ar || null,
            total_bill: item.total_bill || null, employee_name: newVal || null,
            bill_state: item.bill_state || null, bill_type: item.bill_type || null,
            payment_type: item.payment_type || null, branch: item.branch || null,
            serial_no: item.serial_no || null
          });
          item.employee_name = newVal;
        }
      };
      input.addEventListener('blur', save);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = current; input.blur(); } });
    }

    function editPayment(id, el, current) {
      const item = allContracts.find(x => String(x.id) === String(id));
      if (!item) return;

      const select = document.createElement('select');
      select.className = 'cell-select';
      ['3/4', 'مساهمة كاملة', 'مساهمة 50%'].forEach(opt => {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        if (opt === current) o.selected = true;
        select.appendChild(o);
      });
      el.replaceWith(select);
      select.focus();

      const save = async () => {
        const newVal = select.value;
        const span   = document.createElement('span');
        span.className   = 'editable-cell';
        span.textContent = newVal;
        span.style.fontSize = '0.78rem';
        span.onclick = () => editPayment(id, span, newVal);
        select.replaceWith(span);
        if (newVal !== current) {
          await updateData({
            type: "contract_update", id,
            bill_no: item.bill_no || null, bill_date: item.bill_date || null,
            cust_code: item.cust_code || null, cust_name_ar: item.cust_name_ar || null,
            total_bill: item.total_bill || null, employee_name: item.employee_name || null,
            bill_state: item.bill_state || null, bill_type: item.bill_type || null,
            payment_type: newVal, branch: item.branch || null,
            serial_no: item.serial_no || null
          });
          item.payment_type = newVal;
          renderPending();
        }
      };
      select.addEventListener('blur', save);
      select.addEventListener('change', save);
    }

    // ===== معاينة PDF =====
    function previewPDF() {
      const selected = getSelected();
      if (selected.length === 0) { alert('لا توجد فواتير مختارة'); return; }
      generatePDF(selected, new Date().toISOString());
    }

    // ===== إنشاء مطالبة =====
    async function createClaim() {
      const selected = getSelected();

      if (selected.length === 0) { alert('لا توجد فواتير مختارة للمطالبة'); return; }

      const w = selected.filter(i => String(i.bill_type || '').trim() === 'عاملين').length;
      const r = selected.filter(i => String(i.bill_type || '').trim() === 'معاشات').length;
      if (!confirm(`هل تريد إنشاء مطالبة بـ ${selected.length} فاتورة؟\nعاملين: ${w} — معاشات: ${r}`)) return;

      // نفتح نافذة الطباعة فورًا قبل أي await عشان المتصفح ميمنعهاش
      const printWin = window.open('', '_blank');
      if (printWin) {
        printWin.document.write('<html dir="rtl"><body style="font-family:Arial;text-align:center;padding:40px;font-size:16px;">⏳ جاري تجهيز المطالبة...</body></html>');
      }

      const btn = document.getElementById('create-claim-btn');
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإنشاء...';

      let claimSaved = false;

      try {
        const claimResp = await fetch("https://agent.ebrahimhamdy.com/webhook/taskmanagement", {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            type:       "claim_new",
            claim_date: new Date().toISOString(),
            status:     "pending",
            created_by: activeUser
          })
        });

        const claimData = await claimResp.json();
        const claimArr  = Array.isArray(claimData) ? claimData : [claimData];
        const claimId   = claimArr[0]?.id;

        if (!claimId) { if (printWin) printWin.close(); alert('❌ فشل إنشاء المطالبة'); return; }

        const claimDate = new Date().toISOString();
        await Promise.all(selected.map(item =>
          updateData({
            type:          "contract_update",
            id:            item.id,
            bill_no:       item.bill_no       || null,
            bill_date:     item.bill_date     || null,
            cust_code:     item.cust_code     || null,
            cust_name_ar:  item.cust_name_ar  || null,
            total_bill:    item.total_bill    || null,
            employee_name: item.employee_name || null,
            bill_state:    item.bill_state    || null,
            bill_type:     item.bill_type     || null,
            payment_type:  item.payment_type  || null,
            branch:        item.branch        || null,
            serial_no:     item.serial_no     || null,
            claim_id:      String(claimId),
            claim_date:    claimDate
          })
        ));

        claimSaved = true;

        // الطباعة في try منفصل: لو فشلت، البيانات تفضل محفوظة والتحديث يتم برضه
        try {
          generatePDF(selected, claimDate, printWin);
        } catch (pdfErr) {
          console.error('PDF error:', pdfErr);
          if (printWin) { try { printWin.close(); } catch(_) {} }
          alert('⚠️ تم إنشاء المطالبة بنجاح، لكن حدث خطأ أثناء الطباعة.\nيمكنك طباعتها من تبويب "المطالبات المرسلة".');
        }

        excludedIds.clear();

      } catch(e) {
        if (!claimSaved && printWin) { try { printWin.close(); } catch(_) {} }
        alert('❌ خطأ في الاتصال');
        console.error(e);
      } finally {
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> إنشاء مطالبة';
        // التحديث دايمًا يتنفذ حتى لو حصل خطأ في الطباعة
        try { await loadAll(); } catch(_) {}
      }
    }

    // ===== PDF =====
    function generatePDF(items, claimDate, winRef) {
      const dateStr = new Date(claimDate).toLocaleDateString('ar-EG', {
        year:'numeric', month:'long', day:'numeric'
      });

      items = items.slice().sort((a, b) => {
        const aSerial = parseInt(a.serial_no) || 9999;
        const bSerial = parseInt(b.serial_no) || 9999;
        return aSerial - bSerial;
      });

      const workers  = items.filter(i => (i.bill_type || '').trim() === 'عاملين');
      const retirees = items.filter(i => (i.bill_type || '').trim() === 'معاشات');

      function buildTable(list) {
        if (list.length === 0) return { html: '<p style="color:#000;">لا توجد فواتير</p>', total: 0, net: 0, count: 0 };
        let total = 0;
        let rows  = list.map((item, i) => {
          const { name, qaid } = extractQaid(item.cust_name_ar || '');
          const amount          = calcAmount(item.total_bill, item.payment_type);
          total                += amount;
          const notes = '';
          const serialNum       = i + 1;
          return `
            <tr>
              <td style="text-align:center;">${serialNum}</td>
              <td style="text-align:center;font-weight:bold;">${qaid || '---'}</td>
              <td>${name || item.cust_name_ar || '---'}</td>
              <td style="font-size:11px;color:#000;">${notes}</td>
              <td style="text-align:center;font-size:11px;">${item.payment_type || '3/4'}</td>
              <td style="text-align:center;font-weight:bold;">${amount.toFixed(2)}</td>
            </tr>`;
        }).join('');
        const net = total * 0.85;
        rows += `
          <tr style="font-weight:bold;">
            <td colspan="5" style="text-align:left;padding:8px;">الإجمالي</td>
            <td style="text-align:center;color:#000;">${total.toFixed(2)}</td>
          </tr>
          <tr style="font-weight:bold;">
            <td colspan="5" style="text-align:left;padding:8px;">الصافي (بعد خصم 15% نظير التعاقد)</td>
            <td style="text-align:center;color:#000;">${net.toFixed(2)}</td>
          </tr>`;
        const html = `
          <table border="1" cellpadding="6" cellspacing="0"
            style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px;color:#000;">
            <thead style="background:#fff;color:#000;border-bottom:2px solid #000;">
              <tr>
                <th width="5%">م</th>
                <th width="12%">رقم القيد</th>
                <th width="30%">اسم العميل</th>
                <th width="25%">ملاحظات</th>
                <th width="13%">طريقة الدفع</th>
                <th width="15%">المبلغ المطالب</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
        return { html, total, net, count: list.length };
      }

      const workersTbl  = buildTable(workers);
      const retireesTbl = buildTable(retirees);

      const totalAll = workersTbl.total + retireesTbl.total;
      const netAll   = workersTbl.net   + retireesTbl.net;

      const html = `
        <!DOCTYPE html>
        <html dir="rtl" lang="ar">
        <head>
          <meta charset="UTF-8">
          <title>مطالبة صيدلية د ابراهيم حمدي</title>
          <style>
            * { box-sizing:border-box; }
            body { font-family:'Arial',sans-serif; margin:20px; direction:rtl; color:#000; }
            h1 { color:#000; font-size:18px; margin-bottom:4px; }
            h2 { color:#000; font-size:14px; margin:16px 0 6px; border-bottom:2px solid #000; padding-bottom:4px; }
            .header { border:2px solid #000; padding:12px; border-radius:8px; margin-bottom:16px; }
            .meta { font-size:12px; color:#000; margin-top:4px; }
            .summary { font-size:12px; color:#000; margin-top:8px; line-height:1.9; }
            .summary table { width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; }
            .summary td { border:1px solid #000; padding:5px 8px; }
            .summary td:first-child { font-weight:bold; width:55%; }
            .grand-total { background:#fff; color:#000; border:2px solid #000; padding:10px 16px; border-radius:8px; margin-top:16px; font-size:14px; font-weight:bold; }
            .grand-total div { margin:4px 0; }
            .page-break { page-break-before: always; break-before: page; }
            @media print { body { margin:10px; } }
          </style>
        </head>
        <body>
          <div class="header">
            <h1>مطالبة صيدلية د/ ابراهيم حمدي</h1>
            <div class="meta">بتاريخ: ${dateStr} — أعدها: ${activeUser}</div>
            <div class="summary">
              <table>
                <tr><td>عدد فواتير العاملين</td><td>${workersTbl.count}</td></tr>
                <tr><td>عدد فواتير المعاشات</td><td>${retireesTbl.count}</td></tr>
                <tr><td>إجمالي المطالبة (عاملين)</td><td>${workersTbl.total.toFixed(2)} جنيه</td></tr>
                <tr><td>إجمالي المطالبة (معاشات)</td><td>${retireesTbl.total.toFixed(2)} جنيه</td></tr>
                <tr><td>صافي المطالبة (عاملين)</td><td>${workersTbl.net.toFixed(2)} جنيه</td></tr>
                <tr><td>صافي المطالبة (معاشات)</td><td>${retireesTbl.net.toFixed(2)} جنيه</td></tr>
              </table>
            </div>
          </div>
          <h2>👷 عاملين</h2>
          ${workersTbl.html}
          <h2 class="page-break">👴 معاشات</h2>
          ${retireesTbl.html}
          <div class="grand-total">
            <div>إجمالي المطالبة (عاملين + معاشات): ${totalAll.toFixed(2)} جنيه</div>
            <div>صافي المطالبة (عاملين + معاشات): ${netAll.toFixed(2)} جنيه</div>
          </div>
        </body>
        </html>`;

      const win = winRef || window.open('', '_blank');
      if (!win) {
        alert('⚠️ المتصفح منع فتح نافذة الطباعة.\nبرجاء السماح بالنوافذ المنبثقة (Popups) لهذا الموقع، ثم اطبع المطالبة من تبويب "المطالبات المرسلة".');
        return;
      }
      win.document.open();
      win.document.write(html);
      win.document.close();
      win.focus();
      win.print();
    }

    // ===== المطالبات المرسلة =====
    function renderClaims() {
      const container = document.getElementById('claims-container');
      if (allClaims.length === 0) {
        container.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد مطالبات</p>';
        return;
      }

      allClaims.sort((a, b) => new Date(b.claim_date || 0) - new Date(a.claim_date || 0));

      container.innerHTML = allClaims.map(claim => {
        const dateStr      = claim.claim_date
          ? new Date(claim.claim_date).toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'})
          : '---';
        const collected    = (claim.status === 'collected');
        const relatedBills = allContracts.filter(i => {
          const cid = i.claim_id;
          return cid && cid !== 'null' && cid !== '' && cid !== '0' &&
            String(cid).trim() === String(claim.id).trim();
        });
        const totalAmount  = relatedBills.reduce((s, i) => s + calcAmount(i.total_bill, i.payment_type), 0);
        const netAmount    = totalAmount * 0.85;

        return `
          <div class="claim-card ${collected ? 'collected' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div>
                <div style="font-weight:700;font-size:0.95rem;">
                  📋 مطالبة رقم ${claim.id}
                  ${collected
                    ? '<span style="background:#dcfce7;color:#15803d;padding:2px 10px;border-radius:20px;font-size:0.72rem;margin-right:8px;">✅ تم التحصيل</span>'
                    : '<span style="background:#fef9c3;color:#854d0e;padding:2px 10px;border-radius:20px;font-size:0.72rem;margin-right:8px;">⏳ لم يُحصَّل</span>'}
                </div>
                <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">
                  ${dateStr} — ${claim.created_by || ''}
                  — إجمالي <b style="color:var(--warning);">${totalAmount.toFixed(2)}</b>
                  — صافي <b style="color:var(--success);">${netAmount.toFixed(2)}</b>
                  — <span style="color:var(--text-secondary);">${relatedBills.length} فاتورة</span>
                </div>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="btn btn-sm btn-primary" onclick="printClaim('${claim.id}')">
                  <i class="fas fa-print"></i> PDF
                </button>
                ${!collected ? `
                  <button class="btn btn-sm btn-success" onclick="collectClaim('${claim.id}', this)">
                    <i class="fas fa-check-circle"></i> تم التحصيل
                  </button>` : ''}
              </div>
            </div>
          </div>`;
      }).join('');
    }

    async function collectClaim(id, btn) {
      if (!confirm('هل تم تحصيل هذه المطالبة؟')) return;
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const success = await updateData({
        type:   "claim_collected",
        id,
        status: "collected"
      });

      if (success) {
        await loadAll();
      } else {
        alert('❌ فشل التحديث');
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> تم التحصيل';
      }
    }

    function printClaim(claimId) {
      const relatedBills = allContracts.filter(i => {
        const cid = i.claim_id;
        return cid && cid !== 'null' && cid !== '' && cid !== '0' &&
          String(cid).trim() === String(claimId).trim();
      });
      const claim     = allClaims.find(c => String(c.id) === String(claimId));
      const claimDate = claim?.claim_date || new Date().toISOString();
      generatePDF(relatedBills, claimDate);
    }
  </script>
</body>
</html>
