<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>توحيد أصناف المخزون - Phalix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root{ --primary:#0d9488; --primary-dark:#0f766e; }
    .container{ max-width:1000px; }
    .sd-note{ background:#f0fdfa;border:1.5px solid #99f6e4;border-radius:10px;padding:11px 14px;font-size:.82rem;color:#0f766e;line-height:1.7;margin-bottom:14px }
    .sd-tabs{ display:flex;gap:6px;border-bottom:2px solid var(--surface-3);margin-bottom:14px;flex-wrap:wrap }
    .sd-tab{ border:none;background:none;padding:9px 16px;font-family:inherit;font-size:.85rem;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px }
    .sd-tab.active{ color:var(--primary-dark);border-bottom-color:var(--primary) }
    .sd-tab .cnt{ background:var(--surface-3);border-radius:10px;padding:0 7px;font-size:.7rem;margin-inline-start:5px }
    .sd-bar{ display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px }
    .sd-bar input{ flex:1 1 220px;border:1px solid var(--border);border-radius:9px;padding:.5rem .7rem;font-family:inherit;font-size:.85rem }
    .sd-count{ font-size:.78rem;color:var(--text-muted);font-weight:600 }
    .grp{ border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--surface) }
    .grp>summary{ list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap }
    .grp>summary::-webkit-details-marker{ display:none }
    .grp>summary::before{ content:'\25c2';color:var(--primary);font-weight:900;transition:.15s }
    .grp[open]>summary::before{ transform:rotate(-90deg) }
    .grp-base{ font-weight:800;font-size:.92rem;flex:1;min-width:160px }
    .grp-sz{ font-size:.7rem;font-weight:700;color:var(--primary-dark);background:var(--primary-light,#ccfbf1);border-radius:999px;padding:2px 9px }
    .grp-meta{ font-size:.74rem;color:var(--text-muted);white-space:nowrap }
    .grp-diff{ font-size:.75rem;font-weight:800;color:#b91c1c;white-space:nowrap }
    .grp-colors{ font-size:.72rem;color:var(--text-secondary);width:100%;margin-top:2px }
    .grp-body{ border-top:1px solid var(--surface-3);overflow-x:auto }
    table{ width:100%;border-collapse:collapse;font-size:.8rem;min-width:480px }
    th{ background:var(--surface-2);padding:7px 10px;font-size:.72rem;color:var(--text-secondary);text-align:right;white-space:nowrap }
    td{ padding:7px 10px;border-top:1px solid var(--surface-3) }
    .pmax{ color:#b91c1c;font-weight:800 } .pmin{ color:#15803d;font-weight:800 }
    .empty{ text-align:center;color:var(--text-muted);padding:30px }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="page-header"><div class="page-title"><i class="fas fa-object-group"></i> توحيد أصناف المخزون — المعمورة (مستحضرات)</div></div>

      <div class="sd-note">
        تقرير بيجمّع المستحضرات (غير الأدوية) اللي ليها <b>نفس الأساس والحجم بس بألوان مختلفة</b> — يعني كروت ممكن تتوحّد.
        <b>راجع كل مجموعة:</b> اللي اللون مش مهم فيها (صابون/شامبو عادي) وحّدها كارت واحد؛ اللي العميل بيطلبها باللون (صبغة/ديتول/مكياج) سيبها.
      </div>

      <div class="sd-tabs">
        <button class="sd-tab active" data-t="items">توحيد الأصناف <span class="cnt" id="c-items">…</span></button>
        <button class="sd-tab" data-t="price">توحيد الأسعار <span class="cnt" id="c-price">…</span></button>
      </div>

      <div class="sd-bar">
        <input type="text" id="q" placeholder="🔍 بحث باسم الصنف…">
        <span class="sd-count" id="cnt"></span>
      </div>

      <div id="list"><div class="empty"><i class="fas fa-spinner fa-spin"></i> جارٍ التحميل…</div></div>
    </div>
  </div>

  <script src="api.js?v=tt20260828"></script>
  <script>
    let GROUPS = [], TAB = 'items', Q = '';
    function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(n){ return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0}); }

    async function load(){
      try{
        const r = await fetch(SB_URL_API + '/rest/v1/rpc/get_stock_variant_groups', {
          method:'POST', headers:{ apikey:SB_ANON_API, Authorization:'Bearer '+SB_ANON_API, 'Content-Type':'application/json' }, body:'{}' });
        GROUPS = await r.json(); if(!Array.isArray(GROUPS)) GROUPS = [];
      }catch(e){ GROUPS = []; }
      document.getElementById('c-items').textContent = GROUPS.length;
      document.getElementById('c-price').textContent = GROUPS.filter(g=>Number(g.price_diff)>0).length;
      render();
    }

    function render(){
      const list = document.getElementById('list');
      let rows = TAB==='price' ? GROUPS.filter(g=>Number(g.price_diff)>0) : GROUPS;
      if(Q) rows = rows.filter(g=>String(g.base||'').includes(Q));
      document.getElementById('cnt').textContent = rows.length + ' مجموعة';
      if(!rows.length){ list.innerHTML='<div class="empty">مفيش نتائج.</div>'; return; }
      list.innerHTML = rows.map(g=>{
        const items = (g.items||[]);
        const diff = Number(g.price_diff)||0;
        const rowsHtml = items.map(it=>{
          const p = Number(it.price)||0;
          const cls = (TAB==='price' && diff>0) ? (p===Number(g.price_max)?'pmax':(p===Number(g.price_min)?'pmin':'')) : '';
          return `<tr>
            <td>${esc(it.name||'')}</td>
            <td>${esc(it.color||'—')}</td>
            <td class="${cls}">${money(p)}</td>
            <td>${money(it.qty)}</td>
            <td><code>${esc(it.code||'')}</code></td>
          </tr>`;
        }).join('');
        return `<details class="grp">
          <summary>
            <span class="grp-base">${esc(g.base||'')}</span>
            ${g.size?`<span class="grp-sz">${esc(g.size)}</span>`:''}
            <span class="grp-meta">${g.variants} صنف · ${g.colors} ألوان</span>
            ${diff>0?`<span class="grp-diff">فرق سعر ${money(diff)} ج (${money(g.price_min)}–${money(g.price_max)})</span>`:''}
            <span class="grp-colors">الألوان: ${esc((items.map(i=>i.color).filter((v,i,a)=>v&&a.indexOf(v)===i)).join('، '))}</span>
          </summary>
          <div class="grp-body"><table><thead><tr>
            <th>الصنف</th><th>اللون</th><th>السعر</th><th>الرصيد</th><th>الكود</th>
          </tr></thead><tbody>${rowsHtml}</tbody></table></div>
        </details>`;
      }).join('');
    }

    document.querySelectorAll('.sd-tab').forEach(el=> el.onclick = ()=>{
      document.querySelectorAll('.sd-tab').forEach(x=>x.classList.remove('active'));
      el.classList.add('active'); TAB = el.dataset.t; render();
    });
    document.getElementById('q').addEventListener('input', e=>{ Q = e.target.value.trim(); render(); });
    load();
  </script>
</body>
</html>
