<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إدارة التحويلات - Phalix</title>
  <link rel="stylesheet" href="tokens.css?v=20260906">
  <script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض.
     ⚠️ من غيره الصفحة مابتقولش هي فاتحة ولا داكنة، فقاعدة
     prefers-color-scheme في tokens.css بتتبع **إعداد الجهاز** بدل
     إعداد التطبيق — وده اللي كان بيخلّي ويب الطيار وكروت شاشة
     التوزيع تطلع داكنة عند ناس جهازهم على الوضع الليلي.
     الافتراضي فاتح: الوضع الليلي باختيار صريح من الزر بس. */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <div class="page-title">
          <i class="fas fa-exchange-alt"></i> تحويلات الفروع
          <span class="highlight" id="branch-tag"></span>
        </div>
        <button class="btn btn-primary" onclick="loadTransfers()">
          <i class="fas fa-sync-alt"></i> تحديث
        </button>
      </div>

      <div class="filter-bar">
        <div>
          <label class="filter-label" style="display:block;margin-bottom:4px;">نوع العملية</label>
          <select id="direction-filter" class="form-select" style="width:auto;" onchange="applyFilters()">
            <option value="inbound" selected>واردة 📥</option>
            <option value="outbound">مرسلة 📤</option>
            <option value="all">الكل</option>
          </select>
        </div>
        <div>
          <label class="filter-label" style="display:block;margin-bottom:4px;">الحالة</label>
          <select id="status-filter" class="form-select" style="width:auto;" onchange="applyFilters()">
            <option value="pending" selected>انتظار ⏳</option>
            <option value="transferred">تم ✅</option>
            <option value="unavailable">غير متوفر ❌</option>
            <option value="all">الكل</option>
          </select>
        </div>
        <div>
          <label class="filter-label" style="display:block;margin-bottom:4px;">الفرع</label>
          <select id="branch-select-filter" class="form-select" style="width:auto;" onchange="applyFilters()">
            <option value="all">كل الفروع</option>
          </select>
        </div>
        <div>
          <label class="filter-label" style="display:block;margin-bottom:4px;">بحث في الجدول</label>
          <div style="display:flex;align-items:center;gap:6px;">
            <div style="position:relative;display:flex;align-items:center;">
              <i class="fas fa-search" style="position:absolute;right:9px;font-size:13px;color:var(--text-muted);pointer-events:none;"></i>
              <input type="text" id="search-input" placeholder="اسم صنف، كود، عميل..."
                oninput="applyFilters()"
                style="padding:6px 30px 6px 10px;width:190px;font-size:13px;border-radius:8px;
                       border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);">
            </div>
            <select id="search-col" onchange="applyFilters()"
              class="form-select" style="font-size:13px;width:120px;">
              <option value="all">كل الأعمدة</option>
              <option value="item_name">اسم الصنف</option>
              <option value="item_code">كود الصنف</option>
              <option value="cust_name">العميل</option>
              <option value="user">تحويل الى</option>
            </select>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th id="route-th">تحويل الى</th>
              <th>اسم الصنف</th>
              <th>كود الصنف</th>
              <th>العميل</th>
              <th>الكمية</th>
              <th>ملاحظة</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr class="loading-row"><td colspan="9">⏳ جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal التعديل -->
  <div id="edit-modal" style="
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,0.75);
    z-index:99999;
    align-items:center;
    justify-content:center;
  ">
    <div style="
      background:#1e293b;
      border:2px solid #334155;
      border-radius:16px;
      padding:24px;
      width:90%;
      max-width:480px;
      direction:rtl;
      font-family:var(--font);
      box-shadow:0 20px 60px rgba(0,0,0,0.6);
    ">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <span style="font-size:1rem;font-weight:700;color:#f1f5f9;">
          <i class="fas fa-edit"></i> تعديل طلب التحويل
        </span>
        <button onclick="closeEditModal()"
          style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.2rem;">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <input type="hidden" id="edit-id">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">كود الصنف</label>
          <input type="text" id="edit-item-code" class="form-input"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">اسم الصنف</label>
          <input type="text" id="edit-item-name" class="form-input">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">كود العميل</label>
          <input type="text" id="edit-cust-code" class="form-input"
            inputmode="numeric"
            oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length>5) this.value=this.value.slice(0,5);"
            onchange="const v=parseInt(this.value); if(this.value && v>40000){alert('كود العميل يجب أن يكون بين 1 و 40000');this.value='';}">
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">اسم العميل</label>
          <input type="text" id="edit-cust-name" class="form-input">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">الكمية</label>
          <input type="number" id="edit-qty" class="form-input" min="1">
        </div>
        <div>
          <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">الفرع المطلوب منه</label>
          <select data-branches id="edit-branch" class="form-select">
          </select>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:0.78rem;font-weight:700;color:#94a3b8;margin-bottom:5px;">ملاحظة</label>
        <input type="text" id="edit-note" class="form-input">
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeEditModal()" class="btn"
          style="background:#334155;color:#94a3b8;border:none;">
          إلغاء
        </button>
        <button onclick="saveEdit()" class="btn btn-primary" id="edit-save-btn">
          <i class="fas fa-save"></i> حفظ التعديلات
        </button>
      </div>
    </div>
  </div>

<script src="config.js?v=20260904c"></script>
<script src="session.js?v=20260905"></script>
<script src="branches.js?v=20260904d"></script>
<script src="pages.js?v=20260904d"></script>
<script src="brand.js?v=20260904c"></script>
<script src="api.js?v=20260904c"></script>
  <script>
    let rawData        = [];
    let activeUser     = null;
    let userBranchName = '';

    // الفروع الثابتة في النظام
    const ALL_BRANCHES = Branches.names();
    // خريطة (اسم مستخدم/موبايل → فرع) عشان نحوّل قيمة user لاسم الفرع بدل ما تظهر رقم موبايل
    let userBranchMap = {};
    // أسماء مستخدمين قديمة مش موجودة في الحسابات الحالية (fallback يدوي)
    const LEGACY_USER_BRANCH = {
      mangersan: 'سان ستيفانو', mangermamora: 'المعمورة',
      inventorymamora: 'المعمورة', inventorysbishr: 'سيدى بشر'
    };
    function branchOf(u){
      if (!u) return u;
      return userBranchMap[u] || LEGACY_USER_BRANCH[u] || u;
    }
    async function loadUserBranchMap(){
      try {
        const res = await fetch(SB_URL_API + '/rest/v1/rpc/get_user_branch_map', {
          method:'POST',
          headers: await sbH({ 'Content-Type':'application/json' }),
          body:'{}'
        });
        const d = await res.json();
        userBranchMap = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
      } catch(e){ userBranchMap = {}; }
    }

    // خريطة (اسم مستخدم/موبايل → اسم الشخص) عشان نعرض مين عمل الإجراء
    let userNameMap = {};
    function nameOf(u){ if (!u) return u; return userNameMap[u] || u; }
    async function loadUserNameMap(){
      try {
        const res = await fetch(SB_URL_API + '/rest/v1/rpc/get_user_name_map', {
          method:'POST',
          headers: await sbH({ 'Content-Type':'application/json' }),
          body:'{}'
        });
        const d = await res.json();
        userNameMap = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
      } catch(e){ userNameMap = {}; }
    }

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranchName = (Session.branch() || "المعمورة").trim();
        document.getElementById('branch-tag').textContent = userBranchName;
        loadTransfers();
      }
    });

    async function loadTransfers() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="loading-row"><td colspan="9">⏳ جاري جلب البيانات...</td></tr>';
      try {
        await Promise.all([loadUserBranchMap(), loadUserNameMap()]);
        const response = await sbTaskList({ type: 'تحويل' });
        let items = (response && response[0]?.data)
          ? response[0].data
          : (response.data || response || []);

        if (items.length > 0) {
          rawData = items.filter(item => item.type === "تحويل");
          populateBranchFilter(rawData);
          applyFilters();
        } else {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد بيانات متاحة</td></tr>';
        }
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--danger);padding:30px;">❌ خطأ في الاتصال</td></tr>';
      }
    }

    function populateBranchFilter(data) {
      const branchSelect = document.getElementById('branch-select-filter');
      // فلتر ثابت بأسماء الفروع (غير فرع المستخدم) — مايظهرش أرقام موبايل أبدًا
      branchSelect.innerHTML = '<option value="all">كل الفروع</option>';
      ALL_BRANCHES.filter(br => br !== userBranchName).forEach(br => {
        const opt = document.createElement('option');
        opt.value       = br;
        opt.textContent = br;
        branchSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      const dv        = document.getElementById('direction-filter').value;
      const sv        = document.getElementById('status-filter').value;
      const bv        = document.getElementById('branch-select-filter').value;
      const searchVal = document.getElementById('search-input').value.trim().toLowerCase();
      const searchCol = document.getElementById('search-col').value;

      // عنوان العمود يتغيّر حسب اتجاه العملية بدل تكرار السطر في كل صف
      const routeTh = document.getElementById('route-th');
      if (routeTh) routeTh.textContent = dv === 'inbound' ? 'طلب من' : (dv === 'outbound' ? 'طلب الى' : 'المسار');

      const filtered = rawData.filter(item => {
        const userBr      = branchOf(item.user);   // فرع الطالب (بدل اسم المستخدم/الموبايل)
        const isTarget    = Branches.same(item.branch, userBranchName);
        const isSource    = (userBr === userBranchName);
        const dirMatch    = (dv === 'all') || (dv === 'inbound' && isTarget) || (dv === 'outbound' && isSource);
        const statMatch   = (sv === 'all') || ((item.state || 'pending') === sv);
        const branchMatch = (bv === 'all') || Branches.same(userBr, bv) || Branches.same(item.branch, bv);

        let searchMatch = true;
        if (searchVal) {
          if (searchCol === 'all') {
            searchMatch = ['item_name','item','item_code','cust_name','user','branch','note']
              .some(k => (item[k] || '').toLowerCase().includes(searchVal));
          } else {
            searchMatch = (item[searchCol] || '').toLowerCase().includes(searchVal);
          }
        }

        return dirMatch && statMatch && branchMatch && searchMatch;
      });

      renderTable(filtered);
    }

    function renderTable(items) {
      const tbody = document.getElementById('table-body');
      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد تحويلات مطابقة</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      items.forEach(item => {
        const canReply     = Branches.same(item.branch, userBranchName);
        // وارد = طلب جالي من موظف (أعرض اسمه)؛ صادر = طلب أنا باعته لفرع (أعرض الفرع)
        const routeWho   = canReply ? nameOf(item.user) : item.branch;
        const currentState = item.state || 'pending';
        // شريط لوني للحالة: أخضر=تم، أحمر=غير متوفر، أصفر=انتظار
        const stColor = currentState==='transferred' ? '#16a34a' : (currentState==='unavailable' ? '#dc2626' : '#f59e0b');
        const dateObj      = item.createdAt ? new Date(item.createdAt) : null;
        const dateStr      = dateObj ? `${dateObj.getDate()}/${dateObj.getMonth()+1}` : '-';
        const timeStr      = dateObj ? dateObj.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) : '';

        const tr = document.createElement('tr');
        tr.id    = `row-${item.id}`;
        tr.innerHTML = `
          <td style="font-size:0.75rem;line-height:1.4;box-shadow:inset -6px 0 0 0 ${stColor};">
            ${dateStr}<br>
            <span style="color:var(--text-muted);font-size:0.7rem;">${timeStr}</span>
          </td>
<td>
  <div style="font-size:0.82rem;font-weight:600;">${routeWho}</div>
</td>
          <td style="text-align:right;font-weight:700;font-size:0.85rem;">
            ${item.item_name || item.item || '-'}
            ${(item.note && item.note !== 'null') ? `
              <div style="font-size:0.72rem;color:var(--accent-dark);font-weight:400;margin-top:3px;">
                <i class="fas fa-sticky-note"></i> ${item.note}
              </div>` : ''}
          </td>
          <td>
            <code style="font-size:0.82rem;color:var(--text-secondary);">
              ${item.item_code || '---'}
            </code>
          </td>
          <td style="font-size:0.82rem;">${item.cust_name || '---'}</td>
          <td><b style="color:var(--warning);">${item.qty || '1'}</b></td>
          <td>
            <input type="text" id="note-${item.id}" class="table-input"
              value="${item.company || ''}"
              ${!canReply ? 'disabled' : ''}
              onchange="autoSave('${item.id}')">
          </td>
          <td>
            <select id="stat-${item.id}" class="table-select"
              ${!canReply ? 'disabled' : ''}
              onchange="autoSave('${item.id}', this)">
              <option value="pending"     ${currentState==='pending'     ? 'selected' : ''}>⏳ انتظار</option>
              <option value="transferred" ${currentState==='transferred' ? 'selected' : ''}>✅ تم</option>
              <option value="unavailable" ${currentState==='unavailable' ? 'selected' : ''}>❌ غير متوفر</option>
            </select>
          </td>
          <td id="action-${item.id}">
            ${canReply
              ? `<i class="fas fa-check-circle" style="color:var(--text-muted);font-size:1.1rem;" title="يتم الحفظ تلقائياً"></i>`
              : `<div style="display:flex;gap:6px;align-items:center;">
                   <i class="fas fa-clock" style="color:var(--text-muted);"></i>
                   <button class="btn btn-sm btn-icon"
                     onclick="openEditModal('${item.id}')"
                     style="background:var(--accent);color:#fff;padding:5px 8px;"
                     title="تعديل الطلب">
                     <i class="fas fa-edit"></i>
                   </button>
                 </div>`
            }
          </td>`;
        tbody.appendChild(tr);
      });
    }

    async function autoSave(id, triggerEl) {
      const statusEl = document.getElementById(`stat-${id}`);
      const noteEl   = document.getElementById(`note-${id}`);
      const actionEl = document.getElementById(`action-${id}`);
      if (!statusEl) return;

      actionEl.innerHTML = '<i class="fas fa-spinner fa-spin" style="color:var(--text-muted);"></i>';

      const success = await sbTaskUpdate(id, {
        state:   statusEl.value,
        company: noteEl ? noteEl.value : ''
      });

      if (success) {
        actionEl.innerHTML = '<i class="fas fa-check-circle" style="color:var(--success);font-size:1.1rem;"></i>';
        setTimeout(() => {
          if (actionEl) actionEl.innerHTML = '<i class="fas fa-check-circle" style="color:var(--text-muted);font-size:1.1rem;" title="يتم الحفظ تلقائياً"></i>';
        }, 2000);
        const item = rawData.find(x => x.id == id);
        if (item) { item.state = statusEl.value; item.company = noteEl ? noteEl.value : ''; }
        // لو التحويل اتحسم (تم / غير متوفر) → رجّع الصنف يظهر في طلبيات الفرع الطالب (يشيل علامة الإخفاء)
        if (item && (statusEl.value === 'transferred' || statusEl.value === 'unavailable')) {
          const destBranch = branchOf(item.user), code = item.item_code;
          if (destBranch && code) {
            try { await fetch(SB_URL_API + '/rest/v1/order_transfer_pending?branch=eq.' + encodeURIComponent(destBranch) + '&itm_code=eq.' + encodeURIComponent(code),
              { method:'DELETE', headers: await sbH({ 'Prefer':'return=minimal' }) }); } catch(e) {}
          }
        }
      } else {
        actionEl.innerHTML = '<i class="fas fa-exclamation-circle" style="color:var(--danger);font-size:1.1rem;" title="فشل الحفظ"></i>';
        if (triggerEl) alert("فشل الحفظ، يرجى المحاولة مجدداً");
      }
    }

    function openEditModal(id) {
      const item = rawData.find(x => x.id == id);
      if (!item) return;

      document.getElementById('edit-id').value        = id;
      document.getElementById('edit-item-code').value = item.item_code || '';
      document.getElementById('edit-item-name').value = item.item_name || item.item || '';
      document.getElementById('edit-cust-code').value = item.cust_code || '';
      document.getElementById('edit-cust-name').value = item.cust_name || '';
      document.getElementById('edit-qty').value        = item.qty      || 1;
      document.getElementById('edit-note').value       = item.company  || '';

      Array.from(document.getElementById('edit-branch').options).forEach(opt => {
        opt.hidden = (opt.value === userBranchName);
      });
      document.getElementById('edit-branch').value = item.branch || '';

      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    async function saveEdit() {
      const btn = document.getElementById('edit-save-btn');
      const id  = document.getElementById('edit-id').value;

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      const success = await sbTaskUpdate(id, {
        item_code: document.getElementById('edit-item-code').value.trim() || null,
        item_name: document.getElementById('edit-item-name').value.trim() || null,
        cust_code: document.getElementById('edit-cust-code').value.trim() || null,
        cust_name: document.getElementById('edit-cust-name').value.trim() || null,
        qty:       String(document.getElementById('edit-qty').value       || 1),
        company:   document.getElementById('edit-note').value.trim()      || null,
        branch:    document.getElementById('edit-branch').value,
      });

      if (success) {
        const item = rawData.find(x => x.id == id);
        if (item) {
          item.item_code = document.getElementById('edit-item-code').value.trim();
          item.item_name = document.getElementById('edit-item-name').value.trim();
          item.cust_code = document.getElementById('edit-cust-code').value.trim();
          item.cust_name = document.getElementById('edit-cust-name').value.trim();
          item.qty       = document.getElementById('edit-qty').value;
          item.company   = document.getElementById('edit-note').value.trim();
          item.branch    = document.getElementById('edit-branch').value;
        }
        closeEditModal();
        applyFilters();
      } else {
        alert("❌ فشل الحفظ");
      }

      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
    }

    document.getElementById('edit-modal').addEventListener('click', function(e) {
      if (e.target === this) closeEditModal();
    });
  </script>
</body>
</html>
