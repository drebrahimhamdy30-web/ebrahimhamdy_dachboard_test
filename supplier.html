<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبية - Phalix</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:'Tajawal',sans-serif; background:#f8fafc; color:#1e293b; direction:rtl; }
    .header{
      background:#1e293b; color:#fff; padding:16px 24px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .header h1{ font-size:1.1rem; font-weight:900; }
    .header p{ font-size:0.78rem; color:#94a3b8; margin-top:2px; }
    .container{ max-width:900px; margin:24px auto; padding:0 16px; }
    .stats-bar{
      display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;
    }
    .stat{ background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:10px 16px; font-size:0.82rem; }
    .stat b{ color:#0ea5e9; font-size:1rem; }
    .table-wrap{ overflow-x:auto; }
    table{ width:100%; border-collapse:collapse; min-width:500px; }
    thead th{
      background:#0f172a; color:#fff; padding:10px 12px;
      font-size:0.75rem; font-weight:700; text-align:right; white-space:nowrap;
    }
    thead th:last-child{ text-align:center; }
    tbody td{
      padding:10px 12px; font-size:0.82rem;
      border-bottom:1px solid #f1f5f9; vertical-align:middle;
    }
    tbody tr:hover td{ background:#f8fafc; }
    tbody tr.available td{ background:#f0fdf4; }
    tbody tr.unavailable td{ background:#fef2f2; opacity:0.7; }
    .item-name{ font-weight:600; font-size:0.85rem; }
    .item-code{ font-size:0.7rem; color:#94a3b8; margin-top:1px; }
    .qty-cell{ font-weight:900; font-size:1rem; color:#ef4444; text-align:center; }
    .btn-avail{
      padding:7px 16px; border:none; border-radius:8px;
      font-family:'Tajawal',sans-serif; font-size:0.8rem; font-weight:700;
      cursor:pointer; transition:all 0.2s; white-space:nowrap;
    }
    .btn-avail.yes{ background:#dcfce7; color:#15803d; }
    .btn-avail.yes:hover{ background:#bbf7d0; }
    .btn-avail.no{ background:#fee2e2; color:#b91c1c; }
    .btn-avail.no:hover{ background:#fecaca; }
    .btn-avail.selected-yes{ background:#15803d; color:#fff; }
    .btn-avail.selected-no{  background:#b91c1c; color:#fff; }
    .action-cell{ text-align:center; }
    .btn-send{
      display:block; width:100%; padding:14px;
      background:#0ea5e9; color:#fff; border:none; border-radius:12px;
      font-family:'Tajawal',sans-serif; font-size:1rem; font-weight:700;
      cursor:pointer; margin-top:20px; transition:background 0.2s;
    }
    .btn-send:hover{ background:#0284c7; }
    .btn-send:disabled{ background:#94a3b8; cursor:not-allowed; }
    .done-msg{
      text-align:center; padding:40px;
      background:#f0fdf4; border-radius:12px; color:#15803d;
      font-size:1.1rem; font-weight:700; margin-top:20px;
    }
    .error-msg{ text-align:center; padding:40px; color:#ef4444; font-size:1rem; }
    .progress{ font-size:0.8rem; color:#64748b; margin-top:8px; text-align:center; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🧴 طلبية Phalix</h1>
      <p id="header-count">جاري التحميل...</p>
    </div>
    <div style="font-size:0.75rem;color:#64748b;">حدد المتوفر وابعت</div>
  </div>

  <div class="container">
    <div id="content"><div class="error-msg">⏳ جاري تحميل البيانات...</div></div>
  </div>

  <script>
    const INV_URL = 'https://agent.ebrahimhamdy.com/webhook/inventory';
    var items = [];
    var choices = {}; // code → 'yes' | 'no'

    // قراءة البيانات من الـ URL
    try {
      var params = new URLSearchParams(window.location.search);
      var b64    = params.get('data');
      if(!b64) throw new Error('no data');
      var json   = decodeURIComponent(escape(atob(b64)));
      items      = JSON.parse(json);
    } catch(e) {
      document.getElementById('content').innerHTML =
        '<div class="error-msg">❌ رابط غير صحيح</div>';
    }

    if(items.length) renderItems();

    function renderItems(){
      document.getElementById('header-count').textContent = items.length + ' صنف في الطلبية';
      var html = `
        <div class="stats-bar">
          <div class="stat">الأصناف: <b>${items.length}</b></div>
          <div class="stat" id="stat-yes">متوفر: <b>0</b></div>
          <div class="stat" id="stat-no">غير متوفر: <b>0</b></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>الصنف</th>
                <th>الوحدة</th>
                <th style="text-align:center;">الكمية المطلوبة</th>
                <th style="text-align:center;">التوفر</th>
              </tr>
            </thead>
            <tbody id="items-body">
      `;
      items.forEach(function(item, i){
        html += '<tr id="row-'+item.code+'">' +
          '<td style="color:#94a3b8;font-size:0.78rem;">'+(i+1)+'</td>' +
          '<td><div class="item-name">'+item.name+'</div><div class="item-code">'+item.code+'</div></td>' +
          '<td style="font-size:0.78rem;color:#64748b;">'+item.unit+'</td>' +
          '<td class="qty-cell">'+item.qty+'</td>' +
          '<td class="action-cell">'+
            '<div style="display:flex;gap:6px;justify-content:center;">'+
              '<button class="btn-avail yes" onclick="setChoice(\''+item.code+'\',\'yes\')">✅ متوفر</button>'+
              '<button class="btn-avail no"  onclick="setChoice(\''+item.code+'\',\'no\')">❌ غير متوفر</button>'+
            '</div>'+
          '</td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
      html += '<button class="btn-send" id="send-btn" onclick="sendChoices()">إرسال الردود</button>';
      html += '<p class="progress" id="progress-txt"></p>';
      document.getElementById('content').innerHTML = html;
    }

    function setChoice(code, val){
      choices[code] = val;
      var row = document.getElementById('row-'+code);
      if(row){
        row.className = val==='yes' ? 'available' : 'unavailable';
        var btns = row.querySelectorAll('.btn-avail');
        btns[0].className = 'btn-avail yes' + (val==='yes'?' selected-yes':'');
        btns[1].className = 'btn-avail no'  + (val==='no' ?' selected-no' :'');
      }
      updateStats();
    }

    function updateStats(){
      var yes = Object.values(choices).filter(function(v){return v==='yes';}).length;
      var no  = Object.values(choices).filter(function(v){return v==='no'; }).length;
      var sy  = document.getElementById('stat-yes');
      var sn  = document.getElementById('stat-no');
      if(sy) sy.innerHTML = 'متوفر: <b style="color:#15803d;">'+yes+'</b>';
      if(sn) sn.innerHTML = 'غير متوفر: <b style="color:#b91c1c;">'+no+'</b>';
    }

    async function sendChoices(){
      var answered = Object.keys(choices);
      if(!answered.length){ alert('اختر متوفر أو غير متوفر للأصناف الأول'); return; }

      var btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.textContent = '⏳ جاري الإرسال...';

      var available = answered.filter(function(c){ return choices[c]==='yes'; });
      var progress  = document.getElementById('progress-txt');

      try {
        // بعت الـ available items لـ n8n عشان يتعلم عليهم ordered
        var total = available.length;
        var done  = 0;
        for(var i=0; i<available.length; i++){
          var code = available[i];
          await fetch(INV_URL+'?type=cosmo_update&item_code='+encodeURIComponent(code)+'&state=ordered');
          done++;
          if(progress) progress.textContent = 'تم إرسال '+done+' من '+total+'...';
        }
        document.getElementById('content').innerHTML = `
          <div class="done-msg">
            ✅ تم الإرسال بنجاح!<br>
            <span style="font-size:0.9rem;font-weight:400;color:#166534;margin-top:8px;display:block;">
              ${available.length} صنف متوفر تم تسجيله
            </span>
          </div>
        `;
      } catch(e) {
        btn.disabled = false;
        btn.textContent = 'إرسال الردود';
        alert('❌ فشل الإرسال — حاول تاني');
      }
    }
  </script>
</body>
</html>
