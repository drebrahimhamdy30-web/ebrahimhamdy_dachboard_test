<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>قائمة الطلب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<!--
  ═══════════════════════════════════════════════════════════════════
  صفحة المورّد — عامة بطبيعتها
  ═══════════════════════════════════════════════════════════════════
  ⚠️ **ممنوع يتحط أي مفتاح أو config.js هنا.** الصفحة دي بيفتحها ناس
     من بره المؤسسة، فأي مفتاح فيها = مفتاح مسرَّب. الوصول الوحيد عبر
     Edge Function واحدة (supplier_order) بتوكن في الرابط، وهي اللي
     عندها صلاحيات القاعدة جوّه السيرفر.

  لو احتاجت الصفحة أي بيانات زيادة، الإضافة تتم **في الدالة** مش
  بإضافة نداء للقاعدة من هنا.

  ── تبويب لكل فرع ─────────────────────────────────────────────────
  الطلبية سطر لكل (فرع، كود)، والتحديد لكل سطر لوحده — عشان المورّد
  يقدر يقول «متاح لفرع ومش متاح للتاني» لما كميته محدودة. ولو الرابط
  لفرع واحد، شريط التبويبات بيختفي خالص فالشكل زي الأول بالظبط.
  ═══════════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --txt:#111827; --muted:#6b7280;
    --line:#e5e7eb; --brand:#0d9488; --brand-d:#0f766e; --ok:#15803d; --err:#b91c1c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --muted:#94a3b8;
           --line:#334155; --brand:#14b8a6; --brand-d:#0d9488; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Cairo,system-ui,sans-serif;
       padding:0 0 96px;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px}
  header{background:var(--brand);color:#fff;padding:16px 14px;position:sticky;top:0;z-index:9}
  header .w{max-width:720px;margin:0 auto}
  h1{margin:0;font-size:1.05rem;font-weight:800}
  .sub{font-size:.8rem;opacity:.92;margin-top:3px}
  .bar{position:sticky;top:64px;z-index:8;background:var(--bg);padding:10px 0 6px}
  .srch{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;
        font-family:inherit;font-size:.92rem;background:var(--card);color:var(--txt);outline:none}
  .srch:focus{border-color:var(--brand)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;
        scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--txt);
       border-radius:11px;padding:8px 13px;font-family:inherit;font-size:.82rem;font-weight:800;
       cursor:pointer;white-space:nowrap}
  .tab.act{border-color:var(--brand);background:var(--brand);color:#fff}
  .tab .n{font-size:.72rem;font-weight:700;opacity:.85;margin-inline-start:5px}
  .tab.done{border-color:var(--ok)}
  .tab.act.done{background:var(--ok);border-color:var(--ok)}
  .tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .tbtn{border:1.5px solid var(--line);background:var(--card);color:var(--txt);border-radius:9px;
        padding:6px 12px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
  .tbtn:active{transform:scale(.97)}
  .count{margin-inline-start:auto;font-size:.82rem;font-weight:800;color:var(--muted)}
  ul{list-style:none;margin:0;padding:0}
  li{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
     display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer}
  li.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card))}
  li input{width:22px;height:22px;accent-color:var(--brand);flex:0 0 auto;pointer-events:none}
  .inf{min-width:0;flex:1 1 auto}
  .nm{font-weight:700;font-size:.9rem;line-height:1.45}
  .mt{font-size:.74rem;color:var(--muted);margin-top:2px}
  .mt b{color:var(--txt)}
  .pr{font-size:.74rem;color:var(--muted);margin-top:1px}
  .pr b{color:var(--brand-d)}
  .qty{margin-inline-start:auto;font-weight:800;color:var(--brand-d);white-space:nowrap;font-size:.92rem;
       flex:0 0 auto;align-self:flex-start;padding-top:2px}
  .foot{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
        padding:11px 14px;box-shadow:0 -3px 14px rgba(0,0,0,.08)}
  .foot .w{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .send{flex:1;background:var(--brand);color:#fff;border:0;border-radius:11px;padding:13px;
        font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer}
  .send:disabled{opacity:.5;cursor:default}
  .msg{padding:26px 14px;text-align:center;font-weight:700}
  .msg.err{color:var(--err)}
  .done{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 18px;
        text-align:center;margin-top:20px}
  .done .big{font-size:2.6rem}
  .note{width:100%;margin-top:8px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;
        font-family:inherit;font-size:.85rem;background:var(--card);color:var(--txt);outline:none;resize:vertical}
  .rev{background:var(--card);border:1.5px solid var(--brand);border-radius:12px;padding:12px 13px;margin-top:12px}
  .rev-h{font-weight:800;font-size:.88rem;color:var(--brand-d);margin-bottom:8px}
  .rev-r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:.85rem;font-weight:700;
         border-top:1px solid var(--line)}
  .rev-r:first-of-type{border-top:0}
  .rev-r.zero b{color:var(--err)}
  .rev-n{font-size:.76rem;color:var(--muted);margin-top:8px;font-weight:700}
  .hint{background:var(--card);border:1px dashed var(--brand);border-radius:11px;padding:9px 12px;
        font-size:.8rem;font-weight:700;color:var(--brand-d);margin-bottom:8px}
</style>
</head>
<body>

<header><div class="w">
  <h1 id="h-title">قائمة الطلب</h1>
  <div class="sub" id="h-sub">جارٍ التحميل…</div>
</div></header>

<div class="wrap">
  <div id="body"><div class="msg">جارٍ التحميل…</div></div>
</div>

<div class="foot" id="foot" style="display:none"><div class="w">
  <button class="send" id="next" onclick="nextTab()" style="display:none">الفرع التالي ›</button>
  <button class="send" id="send" onclick="submitReply()">إرسال المتاح</button>
  <span id="fmsg" style="font-size:.8rem;font-weight:700"></span>
</div></div>

<script>
/* عنوان الدالة — مش سر: نفس عنوان المشروع الظاهر في أي صفحة عامة.
   المفتاح هو اللي سر، وهو **مش هنا** — الدالة بتشتغل بصلاحياتها جوّه
   السيرفر. */
var FN = 'https://rxtjoqulmgkkcohmgzgi.supabase.co/functions/v1/supplier_order';

var TOKEN = new URLSearchParams(location.search).get('t') || '';
var ITEMS = [], BRANCHES = [], TAB = '', MARK = new Set(), SENT = false, NOTE = '';

/* مفتاح السطر — نفس الفاصل المستخدم في الدالة على السيرفر */
function K(b, c){ return String(b) + '\u0001' + String(c); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

function fail(m){
  document.getElementById('body').innerHTML = '<div class="msg err">'+esc(m)+'</div>';
  document.getElementById('h-sub').textContent = '';
  document.getElementById('foot').style.display = 'none';
}

async function load(){
  if(!TOKEN){ fail('الرابط ناقص.'); return; }
  try{
    var r = await fetch(FN+'?t='+encodeURIComponent(TOKEN));
    var j = await r.json();
    if(!r.ok){ fail(j.error || 'تعذّر فتح الرابط.'); return; }

    ITEMS = Array.isArray(j.items) ? j.items : [];
    SENT  = !!j.submitted;
    (j.marked||[]).forEach(function(o){
      if(o && typeof o === 'object' && o.c) MARK.add(K(o.b, o.c));
    });

    /* ترتيب الفروع زي ما جاي من الطلبية — مش أبجدي، عشان يطابق
       الترتيب اللي المشتريات شافته */
    BRANCHES = [];
    ITEMS.forEach(function(x){ if(BRANCHES.indexOf(x.branch) === -1) BRANCHES.push(x.branch); });
    TAB = BRANCHES[0] || '';

    document.getElementById('h-title').textContent = j.store || 'قائمة الطلب';
    document.getElementById('h-sub').textContent = ITEMS.length + ' صنف'
      + (BRANCHES.length > 1 ? ' · ' + BRANCHES.length + ' فروع' : '');

    if(SENT){ showDone(MARK.size); return; }
    render();
    document.getElementById('foot').style.display = '';
  }catch(e){ fail('تعذّر الاتصال. تحقق من الإنترنت وحاول مرة أخرى.'); }
}

function tabItems(){ return ITEMS.filter(function(x){ return x.branch === TAB; }); }

/* كود فارما متخزّن 18 خانة بأصفار بادئة (000000000000002457) وبورتالهم
   بيقبل المقصوص — نفس اللي شاشة الطلبيات بتنسخه بالظبط. وابن سينا 6
   خانات بلا أصفار فمابيتأثرش. الكامل بيفضل في الـtitle. */
function shortCode(c){ return String(c||'').replace(/^0+/, '') || String(c||''); }

/* البحث بيلاقي بالاسم وبكودنا **وبكود المورّد نفسه** — هو بيدوّر
   بكوده هو مش بكودنا */
function hit(x, q){
  if(!q) return true;
  return String(x.name||'').toLowerCase().indexOf(q) > -1
      || String(x.code||'').indexOf(q) > -1
      || String(x.scode||'').toLowerCase().indexOf(q) > -1
      || shortCode(x.scode).toLowerCase().indexOf(q) > -1;
}
function markedIn(b){
  var n = 0;
  ITEMS.forEach(function(x){ if(x.branch === b && MARK.has(K(x.branch, x.code))) n++; });
  return n;
}

function render(){
  var q = (document.getElementById('q') ? document.getElementById('q').value : '').trim().toLowerCase();
  var mine = tabItems();
  var list = mine.filter(function(x){ return hit(x, q); });

  /* تبويب واحد = مفيش شريط تبويبات */
  var tabs = BRANCHES.length < 2 ? '' :
    '<div class="tabs">' + BRANCHES.map(function(b){
      var tot = ITEMS.filter(function(x){ return x.branch === b; }).length;
      var mk  = markedIn(b);
      return '<button class="tab'+(b===TAB?' act':'')+(mk?' done':'')+'" onclick="goTab(\''+esc(b).replace(/'/g,"\\'")+'\')">'
        + esc(b) + '<span class="n">'+mk+'/'+tot+'</span></button>';
    }).join('') + '</div>';

  var hint = BRANCHES.length > 1
    ? '<div class="hint">الطلب مقسوم على ' + BRANCHES.length + ' فروع. علّم المتاح في كل فرع،'
      + ' وزر الإرسال في <b>آخر فرع</b> وبيبعت الطلبية كلها مرة واحدة.</div>'
    : '';

  var html =
    '<div class="bar">' + tabs + hint
    + '<input class="srch" id="q" placeholder="ابحث باسم الصنف أو الكود…" oninput="render()" value="'+esc(q)+'">'
    + '<div class="tools">'
    +   '<button class="tbtn" onclick="markAll(true)">تحديد الكل</button>'
    +   '<button class="tbtn" onclick="markAll(false)">مسح التحديد</button>'
    +   '<span class="count" id="cnt"></span>'
    + '</div></div><ul>';

  html += list.map(function(x){
    var on = MARK.has(K(x.branch, x.code));
    /* كود المورّد بس — كودنا إحنا مالوش معنى عنده فمابيتعرضش.
       والكود ده موجود عند فارما وابن سينا بس، فالسطر كله بيختفي
       لباقي المخازن بدل ما نسيب خانة فاضية. */
    var meta = x.scode
      ? '<div class="mt">كودك: <b title="'+esc(x.scode)+'">'+esc(shortCode(x.scode))+'</b></div>'
      : '';
    var pr = '';
    if(x.price != null){
      pr = '<div class="pr">سعر البيع '+esc(x.price)
         + (x.disc != null ? ' · خصم <b>'+esc(x.disc)+'%</b>' : '') + '</div>';
    }
    return '<li class="'+(on?'on':'')+'" onclick="toggle(\''+esc(x.code).replace(/'/g,"\\'")+'\')">'
      + '<input type="checkbox" '+(on?'checked':'')+'>'
      + '<div class="inf"><div class="nm">'+esc(x.name)+'</div>'+meta+pr+'</div>'
      + '<span class="qty">'+esc(x.qty)+'</span></li>';
  }).join('');

  html += '</ul>';
  if(!list.length) html += '<div class="msg">'+(q ? 'لا توجد نتائج للبحث.' : 'لا توجد أصناف لهذا الفرع.')+'</div>';

  /* في آخر تبويب بنعرض مراجعة لكل الفروع قبل الإرسال — عشان المخزن
     يفهم إن الزر بيبعت الطلبية كلها مش الفرع اللي هو واقف فيه */
  if(BRANCHES.length > 1 && isLastTab()){
    html += '<div class="rev"><div class="rev-h">مراجعة قبل الإرسال — الطلبية كلها</div>'
      + BRANCHES.map(function(b){
          var tot = ITEMS.filter(function(x){ return x.branch === b; }).length;
          var mk  = markedIn(b);
          return '<div class="rev-r'+(mk?'':' zero')+'"><span>'+esc(b)+'</span>'
            + '<b>'+mk+' من '+tot+'</b></div>';
        }).join('')
      + '<div class="rev-n">الإرسال مرة واحدة للطلبية كلها — راجع كل فرع قبله.</div></div>';
  }

  html += '<textarea class="note" id="note" rows="2" placeholder="ملاحظة للصيدلية (اختياري)">'+esc(NOTE)+'</textarea>';

  document.getElementById('body').innerHTML = html;
  if(q) { var el=document.getElementById('q'); el.focus(); el.setSelectionRange(q.length,q.length); }
  /* شريط التبويبات بيتزحلق أفقيًا، فالتبويب النشط ممكن يبقى نصّه بره */
  var at = document.querySelector('.tab.act');
  if(at && at.scrollIntoView) at.scrollIntoView({ block:'nearest', inline:'center' });
  updCount();
}

/* الملاحظة بتعيش عبر التبويبات — حقل واحد للطلبية كلها */
function keepNote(){
  var el = document.getElementById('note');
  if(el) NOTE = el.value;
}

function goTab(b){ keepNote(); TAB = b; render(); window.scrollTo(0,0); }

/* زر الإرسال بيظهر في **آخر تبويب بس** — منعًا للخبطة: المورّد كان
   ممكن يضغط إرسال وهو في أول فرع فيتبعت كل حاجة ناقصة ويتقفل الرابط.
   في التبويبات اللي قبله بيلاقي «الفرع التالي ›» بدل الإرسال. */
function isLastTab(){ return BRANCHES.indexOf(TAB) === BRANCHES.length - 1; }

function nextTab(){
  var i = BRANCHES.indexOf(TAB);
  if(i > -1 && i < BRANCHES.length - 1) goTab(BRANCHES[i + 1]);
}

function updCount(){
  var mine = tabItems();
  var multi = BRANCHES.length > 1;
  var el = document.getElementById('cnt');
  if(el) el.textContent = multi
    ? ('متاح ' + markedIn(TAB) + ' من ' + mine.length + ' في ' + TAB)
    : ('متاح ' + MARK.size + ' من ' + ITEMS.length);

  var s = document.getElementById('send'), nx = document.getElementById('next');
  var last = isLastTab();
  if(nx) nx.style.display = (multi && !last) ? '' : 'none';
  if(nx && multi && !last) nx.textContent = 'الفرع التالي: ' + BRANCHES[BRANCHES.indexOf(TAB) + 1] + ' ›';
  if(s){
    s.style.display = (multi && !last) ? 'none' : '';
    s.textContent = !MARK.size ? 'إرسال — لا يوجد متاح'
      : (multi ? ('إرسال كل الفروع ('+MARK.size+')') : ('إرسال المتاح ('+MARK.size+')'));
  }
}

function toggle(code){
  keepNote();
  var k = K(TAB, code);
  if(MARK.has(k)) MARK.delete(k); else MARK.add(k);
  render();
}

function markAll(on){
  keepNote();
  var q = (document.getElementById('q')||{value:''}).value.trim().toLowerCase();
  tabItems().forEach(function(x){
    if(!hit(x, q)) return;
    var k = K(x.branch, x.code);
    if(on) MARK.add(k); else MARK.delete(k);
  });
  render();
}

async function submitReply(){
  keepNote();
  var btn = document.getElementById('send'), fm = document.getElementById('fmsg');
  if(!MARK.size && !confirm('لم تحدد أي صنف. هل تريد الإرسال كـ«لا يوجد متاح»؟')) return;

  /* تنبيه لو فرع كامل ماتعلّم فيه حاجة — غالبًا نسي التبويب.
     والإرسال مرة واحدة ومابيتكررش، فالتأكيد هنا آخر فرصة. */
  if(MARK.size && BRANCHES.length > 1){
    var empty = BRANCHES.filter(function(b){ return markedIn(b) === 0; });
    if(empty.length && !confirm('لم تحدد أي صنف في: ' + empty.join(' · ')
        + '\n\nالإرسال للطلبية كلها ومرة واحدة فقط. هل تريد الإرسال؟')) return;
  }

  btn.disabled = true; fm.textContent = 'جارٍ الإرسال…';
  try{
    var lines = [...MARK].map(function(k){
      var p = k.split('\u0001');
      return { b: p[0], c: p[1] };
    });
    var r = await fetch(FN+'?t='+encodeURIComponent(TOKEN), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ lines: lines, note: NOTE })
    });
    var j = await r.json();
    if(!r.ok){ fm.textContent = j.error || 'تعذّر الإرسال'; btn.disabled = false; return; }
    showDone(j.saved);
  }catch(e){ fm.textContent = 'تعذّر الاتصال'; btn.disabled = false; }
}

function showDone(n){
  document.getElementById('foot').style.display = 'none';
  var per = BRANCHES.length > 1
    ? '<div style="color:var(--muted);margin-top:8px;font-size:.82rem">'
      + BRANCHES.map(function(b){ return esc(b)+': '+markedIn(b); }).join(' · ') + '</div>'
    : '';
  document.getElementById('body').innerHTML =
    '<div class="done"><div class="big">✅</div>'
    + '<div style="font-weight:800;margin-top:10px;font-size:1.05rem">تم استلام ردك</div>'
    + '<div style="color:var(--muted);margin-top:6px">عدد الأصناف المتاحة: <b>'+n+'</b></div>'
    + per
    + '<div style="color:var(--muted);margin-top:14px;font-size:.84rem">يمكنك إغلاق الصفحة. شكرًا لك.</div></div>';
  document.getElementById('h-sub').textContent = 'تم الإرسال';
}

load();
</script>
</body>
</html>
