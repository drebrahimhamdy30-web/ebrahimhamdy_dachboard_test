<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إغلاق الشيفت — Phalix</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f0f4f8;--surface:#fff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--light:#f8fafc;
  --accent:#0369a1;--accent-l:#dbeafe;
  --success:#15803d;--danger:#b91c1c;--warn:#92400e;
  --pos-c:#1d4ed8;--pos-bg:#eff6ff;
  --wal-c:#7e22ce;--wal-bg:#faf5ff;
  --font:'Tajawal',system-ui,sans-serif;
  --radius:12px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:var(--surface);border-bottom:2px solid #0369a1;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.header h1{font-size:1rem;font-weight:900;display:flex;align-items:center;gap:8px;color:var(--accent);}
.header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.container{max-width:1600px;margin:0 auto;padding:20px;}

.shift-bar{background:linear-gradient(135deg,#0369a1,#0284c7);color:#fff;border-radius:var(--radius);padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.sb-item{display:flex;flex-direction:column;gap:3px;}
.sb-label{font-size:0.72rem;opacity:.85;display:flex;align-items:center;gap:5px;}
.sb-val{font-size:1rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.sb-sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25);}
@media(max-width:760px){.sb-sep{display:none;}}

/* 3 columns: transfers | main | guide  (RTL: transfers=left, guide=right) */
.layout{display:grid;grid-template-columns:320px 1fr 300px;gap:16px;align-items:start;direction:rtl;}
.col-guide{grid-column:3;} .col-main{grid-column:2;} .col-transfers{grid-column:1;}
@media(max-width:1400px){
  .layout{grid-template-columns:320px 1fr;}
  .col-guide{grid-column:1 / -1;grid-row:2;}
  .col-main{grid-column:2;grid-row:1;}
  .col-transfers{grid-column:1;grid-row:1;}
}
@media(max-width:1000px){
  .layout{grid-template-columns:1fr;}
  .col-main{grid-column:1;grid-row:1;}
  .col-transfers{grid-column:1;grid-row:2;}
  .col-guide{grid-column:1;grid-row:3;}
}
.col-transfers,.col-guide{position:sticky;top:16px;}
@media(max-width:1000px){.col-transfers,.col-guide{position:static;}}

/* Guide card */
.guide-card{background:var(--surface);border:1.5px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);padding:14px;}
.guide-thanks{background:linear-gradient(135deg,#0369a1,#0284c7);color:#fff;border-radius:9px;padding:10px;text-align:center;font-weight:900;font-size:0.88rem;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:7px;}
.guide-img-wrap{position:relative;line-height:0;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff;}
.guide-img{width:100%;display:block;}
.guide-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.guide-note{margin-top:12px;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:9px;padding:10px 12px;}
.gn-title{font-weight:900;font-size:0.85rem;color:#b91c1c;display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.gn-body{font-size:0.79rem;color:var(--text);line-height:1.8;}
.guide-warn{margin-top:9px;background:#fef9c3;border:1px solid #fde68a;border-radius:9px;padding:9px 11px;font-size:0.76rem;color:var(--warn);font-weight:700;line-height:1.7;display:flex;gap:7px;align-items:flex-start;}

.btn{border:none;border-radius:8px;padding:9px 18px;font-family:var(--font);font-weight:800;font-size:0.83rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.btn:hover{filter:brightness(.93);} .btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-success{background:#15803d;color:#fff;}
.btn-confirm{background:#7e22ce;color:#fff;}
.btn-ghost{background:var(--light);color:var(--muted);border:1px solid var(--border);}
select,input{font-family:var(--font);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:0.85rem;outline:none;background:#fff;color:var(--text);width:100%;}
select:focus,input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.1);}
.header-controls input{width:auto;}
.section-title{font-size:0.8rem;font-weight:800;color:var(--muted);letter-spacing:.05em;margin:0 0 10px;display:flex;align-items:center;gap:6px;}
.section-title:not(:first-child){margin-top:20px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

.methods-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:820px){.methods-grid{grid-template-columns:1fr;}}
.method-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;}
.method-card.pos-card{border-top:3px solid var(--pos-c);}
.method-card.wallet-card{border-top:3px solid var(--wal-c);}
.method-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.method-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;}
.icon-pos{background:var(--pos-bg);color:var(--pos-c);}
.icon-wal{background:var(--wal-bg);color:var(--wal-c);}
.method-name{font-weight:800;font-size:0.9rem;}
.method-type-label{font-size:0.7rem;color:var(--muted);}
.input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.input-group label{font-size:0.75rem;font-weight:700;color:var(--muted);}
.net-display{background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;padding:8px 12px;font-size:1.05rem;font-weight:900;color:#15803d;text-align:center;}
.net-display.negative{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;}
.net-display.idle{background:var(--light);border-color:var(--border);color:var(--muted);font-size:0.85rem;font-weight:700;}

.sidebar-title{font-size:0.85rem;font-weight:900;color:var(--wal-c);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.sidebar-note{font-size:0.68rem;color:var(--warn);background:#fef9c3;border:1px solid #fde68a;border-radius:7px;padding:7px 9px;line-height:1.6;margin-bottom:12px;display:flex;gap:6px;}
.tr-form{display:flex;flex-direction:column;gap:8px;}
.tr-list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-left:4px;}
.tr-list::-webkit-scrollbar{width:6px;}
.tr-list::-webkit-scrollbar-thumb{background:#d8b4fe;border-radius:4px;}
.tr-list::-webkit-scrollbar-track{background:var(--light);border-radius:4px;}
.tr-row{background:var(--wal-bg);border:1px solid #e9d5ff;border-radius:8px;padding:8px 10px;font-size:0.78rem;}
.tr-row.old{background:var(--light);border-color:var(--border);}
.tr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tr-sub{color:var(--muted);font-size:0.68rem;margin-top:3px;line-height:1.6;}
.grp-label{font-size:0.7rem;font-weight:800;color:var(--muted);margin:10px 0 6px;display:flex;align-items:center;gap:5px;}
.grp-label:first-child{margin-top:0;}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:900;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow-y:auto;}
.modal-head{background:linear-gradient(135deg,#15803d,#16a34a);color:#fff;padding:16px 20px;}
.modal-head h3{font-size:1rem;font-weight:900;display:flex;align-items:center;gap:8px;}
.modal-body{padding:18px 20px;}
.period-box{background:var(--accent-l);border:1px solid #bfdbfe;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:0.82rem;}
.period-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;}
.period-row b{font-variant-numeric:tabular-nums;color:var(--accent);}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--light);font-size:0.88rem;}
.mrow b{font-variant-numeric:tabular-nums;font-weight:900;}
.mrow.total{border-bottom:none;border-top:2px solid var(--border);margin-top:6px;padding-top:14px;font-size:1.05rem;}
.mrow.total b{font-size:1.5rem;color:var(--success);}
.modal-foot{display:flex;gap:10px;padding:14px 20px 20px;}
.modal-foot .btn{flex:1;justify-content:center;padding:11px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:10px;font-weight:700;font-size:0.85rem;color:#fff;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:0.9rem;}
</style>
</head>
<body>

<div class="header">
  <h1><i class="fas fa-cash-register"></i> إغلاق الشيفت</h1>
  <div class="header-controls">
    <span id="branch-display" style="font-weight:800;color:var(--accent);font-size:0.95rem;padding:6px 14px;background:var(--accent-l);border-radius:8px;"></span>
    <input id="cashier-name" placeholder="اسم الكاشير" style="width:150px;">
    <input id="shift-date" type="date" style="width:145px;">
    <input id="notes-inp" placeholder="ملاحظات..." style="width:160px;">
  </div>
</div>

<div class="container">
  <div id="shift-bar"></div>
  <div class="layout">
    <div class="col-main">

    <aside class="col-transfers" id="transfers-area"></aside>
    <aside class="col-guide">

<script>
const SB_URL='https://rxtjoqulmgkkcohmgzgi.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4dGpvcXVsbWdra2NvaG1nemdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDQ2OTUsImV4cCI6MjA5NDI4MDY5NX0.QVoJPtlRlRIz9tdhmdTZxHtKxrwAxJq0Je4QHkFKxj0';
const H_BASE={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
const H={...H_BASE,'Prefer':'return=representation'};

let METHODS=[], VALUES={}, TRANSFERS=[], SAVING=false;
let SHIFT_START=null;
const REASON_LABEL={supplier:'تحويل لمورد', customer_refund:'مرتجع لعميل'};

async function api(path,opts={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:H,...opts});
  if(!r.ok){throw new Error(await r.text());}
  return r.status===204?null:r.json();
}

let toastT;
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=type==='ok'?'#15803d':'#dc2626';
  t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',3000);
}

function fmt(n){return(+n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dt(s){return s?new Date(s).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'—';}
function timeFull(d){return d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
function dateShort(d){return d.toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});}
function durationTxt(from,to){
  let s=Math.max(0,Math.floor((to-from)/1000));
  const h=Math.floor(s/3600); s%=3600;
  const m=Math.floor(s/60); const sec=s%60;
  return `${h} س ${m} د ${sec} ث`;
}

const BRANCH_ALIAS={'الصيدلية':'المعمورة','ابراهيم حمدي 2':'سان ستيفانو','ابراهيم حمدي 3':'سيدى بشر'};
const USER_BRANCH_RAW=(localStorage.getItem('userBranch')||'').trim();
const USER_BRANCH=BRANCH_ALIAS[USER_BRANCH_RAW]||USER_BRANCH_RAW;
function getBranch(){ return USER_BRANCH||'المعمورة'; }

async function init(){
  document.getElementById('branch-display').textContent=getBranch();
  await loadMethods();
  setInterval(renderShiftBar,1000);
}

async function loadShiftStart(){
  const branch=getBranch();
  try{
    const last=await api(`pos_shifts?branch=eq.${encodeURIComponent(branch)}&order=id.desc&limit=1`);
    SHIFT_START=(last&&last[0]&&last[0].closed_at)?new Date(last[0].closed_at):null;
  }catch(e){ SHIFT_START=null; }
}

function renderShiftBar(){
  const bar=document.getElementById('shift-bar');
  const now=new Date();
  if(!SHIFT_START){
    bar.innerHTML=`<div class="shift-bar" style="background:linear-gradient(135deg,#92400e,#b45309);">
      <div class="sb-item">
        <div class="sb-label"><i class="fas fa-circle-info"></i> بداية الشيفت</div>
        <div class="sb-val">لا يوجد إغلاق سابق لهذا الفرع</div>
      </div>
      <div class="sb-sep"></div>
      <div class="sb-item">
        <div class="sb-label"><i class="fas fa-clock"></i> الوقت الآن</div>
        <div class="sb-val">${timeFull(now)}</div>
      </div>
    </div>`;
    return;
  }
  bar.innerHTML=`<div class="shift-bar">
    <div class="sb-item">
      <div class="sb-label"><i class="fas fa-store"></i> الفرع</div>
      <div class="sb-val">${esc(getBranch())}</div>
    </div>
    <div class="sb-sep"></div>
    <div class="sb-item">
      <div class="sb-label"><i class="fas fa-play"></i> بداية الشيفت الحالي (نهاية الإغلاق السابق)</div>
      <div class="sb-val">${dateShort(SHIFT_START)} — ${timeFull(SHIFT_START)}</div>
    </div>
    <div class="sb-sep"></div>
    <div class="sb-item">
      <div class="sb-label"><i class="fas fa-clock"></i> الوقت الآن</div>
      <div class="sb-val">${timeFull(now)}</div>
    </div>
    <div class="sb-sep"></div>
    <div class="sb-item">
      <div class="sb-label"><i class="fas fa-hourglass-half"></i> مدة الشيفت</div>
      <div class="sb-val">${durationTxt(SHIFT_START,now)}</div>
    </div>
  </div>`;
}

async function loadMethods(){
  const branch=getBranch();
  METHODS=await api(`pos_methods?branch=eq.${encodeURIComponent(branch)}&is_active=eq.true&order=sort_order`);
  VALUES={};
  METHODS.forEach(m=>{
    VALUES[m.id]= m.method_type==='machine' ? {closing:''} : {opening:'',closing:''};
  });
  try{
    const lastLines=await api(`pos_shift_lines?method_type=eq.wallet&order=id.desc&limit=200`);
    const seen=new Set();
    lastLines.forEach(l=>{
      const m=METHODS.find(x=>x.method_key===l.method_key);
      if(m&&!seen.has(l.method_key)&&l.closing_balance!=null){
        VALUES[m.id]={opening:String(l.closing_balance),closing:''};
        seen.add(l.method_key);
      }
    });
  }catch(e){}
  await Promise.all([loadTransfers(), loadShiftStart()]);
  renderShiftBar();
  render();
}

async function loadTransfers(){
  const branch=getBranch();
  try{
    TRANSFERS=await api(`pos_wallet_transfers?branch=eq.${encodeURIComponent(branch)}&is_disbursed=eq.false&order=created_at.desc`);
  }catch(e){ TRANSFERS=[]; }
}

function currentTransfers(){ return TRANSFERS.filter(t=>t.shift_id==null); }
function pastTransfers(){ return TRANSFERS.filter(t=>t.shift_id!=null); }
function transfersOf(mKey){ return currentTransfers().filter(t=>t.method_key===mKey).reduce((s,t)=>s+(+t.amount||0),0); }
function totalCurrentTransfers(){ return currentTransfers().reduce((s,t)=>s+(+t.amount||0),0); }
function totalPendingAll(){ return TRANSFERS.reduce((s,t)=>s+(+t.amount||0),0); }

async function addTransfer(){
  if(SAVING)return;
  const mId=+document.getElementById('tr-method').value;
  const amount=parseFloat(document.getElementById('tr-amount').value);
  const reason=document.getElementById('tr-reason').value;
  const emp=document.getElementById('tr-employee').value.trim();
  const note=document.getElementById('tr-note').value.trim();
  if(!mId){toast('اختر المحفظة','err');return;}
  if(!amount||amount<=0){toast('اكتب قيمة صحيحة','err');return;}
  if(!emp){toast('اكتب اسم الموظف','err');return;}
  const m=METHODS.find(x=>x.id===mId);
  if(!m){toast('محفظة غير معروفة','err');return;}
  SAVING=true;
  try{
    await api('pos_wallet_transfers',{method:'POST',body:JSON.stringify({
      shift_id:null, branch:getBranch(),
      method_key:m.method_key, display_name:m.display_name,
      employee_name:emp, amount, reason,
      note:note||null, is_disbursed:false
    })});
    await loadTransfers();
    render();
    toast('تم تسجيل التحويل ✓');
  }catch(e){ toast('فشل حفظ التحويل','err'); }
  finally{ SAVING=false; }
}

function hasClosing(m){
  const v=VALUES[m.id]||{};
  return v.closing!==''&&v.closing!=null;
}
function getNet(m){
  const v=VALUES[m.id]||{};
  if(m.method_type==='machine') return parseFloat(v.closing)||0;
  return (parseFloat(v.closing)||0)-(parseFloat(v.opening)||0)+transfersOf(m.method_key);
}
function calcTotals(){
  let totalPos=0,totalWal=0;
  METHODS.forEach(m=>{
    const net=getNet(m);
    if(m.method_type==='machine') totalPos+=net; else totalWal+=net;
  });
  return{totalPos,totalWal,grand:totalPos+totalWal};
}
function missingWallets(){
  return METHODS.filter(m=>m.method_type==='wallet'&&!hasClosing(m));
}

function netHtml(m){
  if(!hasClosing(m)){
    return `<div class="net-display idle" id="net-${m.id}">
      <i class="fas fa-keyboard"></i> اكتب رصيد النهاية لحساب الصافي
    </div>`;
  }
  const net=getNet(m), tr=transfersOf(m.method_key);
  const sub=m.method_type==='wallet'
    ? ` <span style="font-size:0.7rem;opacity:.7;">${tr>0?`(صافي + ${fmt(tr)} تحويلات)`:'(صافي الفترة)'}</span>` : '';
  return `<div class="net-display${net<0?' negative':''}" id="net-${m.id}">${net>=0?'+':''}${fmt(net)} ج${sub}</div>`;
}

function render(){
  if(!METHODS.length){
    document.getElementById('methods-area').innerHTML='<div class="empty">لا توجد طرق دفع نشطة لهذا الفرع</div>';
    document.getElementById('transfers-area').innerHTML='';
    return;
  }
  const pos=METHODS.filter(m=>m.method_type==='machine');
  const wal=METHODS.filter(m=>m.method_type==='wallet');
  let html='';

  if(pos.length){
    html+=`<div class="section-title"><i class="fas fa-credit-card" style="color:#1d4ed8"></i> ماكينات POS</div><div class="methods-grid">`;
    pos.forEach(m=>{
      const v=VALUES[m.id]||{closing:''};
      html+=`<div class="method-card pos-card">
        <div class="method-head">
          <div class="method-icon icon-pos"><i class="fas fa-cash-register"></i></div>
          <div><div class="method-name">${esc(m.display_name)}</div><div class="method-type-label">قيمة إغلاق الشيفت من الورقة</div></div>
        </div>
        <div class="input-group">
          <label>قيمة إغلاق الشيفت (ج)</label>
          <input type="number" step="0.01" min="0" placeholder="0.00" value="${v.closing}"
            oninput="VALUES[${m.id}].closing=this.value;refreshNet(${m.id})">
        </div>
        ${netHtml(m)}
      </div>`;
    });
    html+='</div>';
  }

  if(wal.length){
    html+=`<div class="section-title"><i class="fas fa-wallet" style="color:#7e22ce"></i> المحافظ الإلكترونية</div><div class="methods-grid">`;
    wal.forEach(m=>{
      const v=VALUES[m.id]||{opening:'',closing:''};
      html+=`<div class="method-card wallet-card">
        <div class="method-head">
          <div class="method-icon icon-wal"><i class="fas fa-mobile-alt"></i></div>
          <div><div class="method-name">${esc(m.display_name)}</div><div class="method-type-label">رصيد البداية والنهاية من الموبايل</div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <div class="input-group">
            <label>رصيد البداية (ج) ${v.opening?'<span style="font-size:0.65rem;color:#15803d;font-weight:700;">✓ تلقائي</span>':''}</label>
            <input type="number" step="0.01" min="0" placeholder="اكتب رصيد البداية" value="${v.opening}"
              ${v.opening?'readonly style="background:#f0fdf4;color:#15803d;border-color:#86efac;font-weight:800;"':''}
              oninput="if(!this.readOnly){VALUES[${m.id}].opening=this.value;refreshNet(${m.id});}">
          </div>
          <div class="input-group">
            <label>رصيد النهاية (ج)</label>
            <input type="number" step="0.01" min="0" placeholder="0.00" value="${v.closing}"
              oninput="VALUES[${m.id}].closing=this.value;refreshNet(${m.id})">
          </div>
        </div>
        ${netHtml(m)}
      </div>`;
    });
    html+='</div>';
  }

  document.getElementById('methods-area').innerHTML=html;
  renderTransfers(wal);
  renderActions();
}

function refreshNet(mId){
  const m=METHODS.find(x=>x.id===mId); if(!m)return;
  const el=document.getElementById('net-'+mId); if(!el)return;
  el.outerHTML=netHtml(m);
}

function trRow(t,isOld){
  return `<div class="tr-row${isOld?' old':''}">
    <div class="tr-top">
      <b>${esc(t.display_name)}</b>
      <b style="color:${isOld?'var(--muted)':'var(--wal-c)'};font-variant-numeric:tabular-nums;">${fmt(t.amount)} ج</b>
    </div>
    <div class="tr-sub">
      ${REASON_LABEL[t.reason]||esc(t.reason)}${t.note?` · ${esc(t.note)}`:''}<br>
      <i class="fas fa-user" style="width:12px;"></i> ${esc(t.employee_name||'—')}
      · <i class="fas fa-clock" style="width:12px;"></i> ${dt(t.created_at)}
      ${isOld?'<br><span style="color:#92400e;font-weight:700;">محسوب في شيفت سابق · معلّق للتوريد</span>':''}
    </div>
  </div>`;
}

function renderTransfers(wal){
  const box=document.getElementById('transfers-area');
  if(!wal||!wal.length){box.innerHTML='';return;}
  const cur=currentTransfers(), old=pastTransfers();
  box.innerHTML=`
    <div class="method-card wallet-card">
      <div class="sidebar-title"><i class="fas fa-right-left"></i> تحويلات المحافظ</div>
      <div class="sidebar-note">
        <i class="fas fa-triangle-exclamation" style="margin-top:2px;"></i>
        <span><b>خاص بمدير الفرع أو المسئول عن التحويلات فقط.</b><br>لا تُسجَّل أي تحويلات بدون إذن المسئول.</span>
      </div>
      <div class="tr-form">
        <div class="input-group" style="margin:0;">
          <label>المحفظة</label>
          <select id="tr-method">
            <option value="">— اختر —</option>
            ${wal.map(m=>`<option value="${m.id}">${esc(m.display_name)}</option>`).join('')}
          </select>
        </div>
        <div class="input-group" style="margin:0;">
          <label>القيمة (ج)</label>
          <input type="number" step="0.01" min="0" id="tr-amount" placeholder="0.00" onkeydown="if(event.key==='Enter')addTransfer()">
        </div>
        <div class="input-group" style="margin:0;">
          <label>السبب</label>
          <select id="tr-reason">
            <option value="supplier">تحويل لمورد</option>
            <option value="customer_refund">مرتجع لعميل</option>
          </select>
        </div>
        <div class="input-group" style="margin:0;">
          <label>اسم الموظف <span style="color:#b91c1c;">*</span></label>
          <input id="tr-employee" placeholder="من قام بالتحويل" onkeydown="if(event.key==='Enter')addTransfer()">
        </div>
        <div class="input-group" style="margin:0;">
          <label>ملاحظات (اسم المورد / العميل)</label>
          <input id="tr-note" placeholder="اكتب الاسم..." onkeydown="if(event.key==='Enter')addTransfer()">
        </div>
        <button class="btn btn-confirm" style="justify-content:center;" onclick="addTransfer()"><i class="fas fa-plus"></i> إضافة تحويل</button>
      </div>
      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px;">
        <div class="tr-list">
          ${cur.length?`<div class="grp-label"><i class="fas fa-circle" style="font-size:0.5rem;color:var(--wal-c);"></i> الشيفت الحالي (تُضاف للصافي)</div>${cur.map(t=>trRow(t,false)).join('')}`:''}
          ${old.length?`<div class="grp-label"><i class="fas fa-circle" style="font-size:0.5rem;color:var(--muted);"></i> معلّق من شيفتات سابقة</div>${old.map(t=>trRow(t,true)).join('')}`:''}
          ${(!cur.length&&!old.length)?'<div style="font-size:0.75rem;color:var(--muted);text-align:center;padding:14px 0;">لا توجد تحويلات معلّقة.</div>':''}
        </div>
        ${TRANSFERS.length?`
        <div style="margin-top:10px;padding-top:9px;border-top:1px dashed #e9d5ff;display:flex;flex-direction:column;gap:5px;font-size:0.78rem;">
          <div style="display:flex;justify-content:space-between;font-weight:800;color:var(--wal-c);">
            <span>الشيفت الحالي</span><span style="font-variant-numeric:tabular-nums;">${fmt(totalCurrentTransfers())} ج</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-weight:900;color:var(--warn);">
            <span>إجمالي المعلّق (للتوريد)</span><span style="font-variant-numeric:tabular-nums;">${fmt(totalPendingAll())} ج</span>
          </div>
        </div>`:''}
        <div style="margin-top:10px;font-size:0.68rem;color:var(--muted);text-align:center;line-height:1.6;">
          <i class="fas fa-lock"></i> لا يمكن حذف التحويل — التوريد من صفحة المحاسب.
        </div>
      </div>
    </div>`;
}

function renderActions(){
  document.getElementById('actions-area').innerHTML=`
    <div style="margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">
      <div style="font-size:0.8rem;color:var(--muted);display:flex;align-items:center;gap:8px;">
        <i class="fas fa-eye-slash"></i>
        الإجمالي يظهر في شاشة المراجعة عند الضغط على «إغلاق الشيفت».
      </div>
      <button class="btn btn-success" id="close-btn" onclick="openModal()" style="padding:11px 22px;">
        <i class="fas fa-lock"></i> إغلاق الشيفت
      </button>
    </div>`;
}

function openModal(){
  const cashier=document.getElementById('cashier-name').value.trim();
  if(!cashier){toast('اكتب اسم الكاشير','err');return;}
  const miss=missingWallets();
  if(miss.length){
    toast('اكتب رصيد النهاية لـ: '+miss.map(m=>m.display_name).join('، '),'err');
    return;
  }
  const{totalPos,totalWal,grand}=calcTotals();
  const now=new Date();
  const trTotal=totalCurrentTransfers();

  document.getElementById('modal-body').innerHTML=`
    <div class="period-box">
      <div class="period-row"><span>الفرع</span><b>${esc(getBranch())}</b></div>
      <div class="period-row"><span>الكاشير</span><b>${esc(cashier)}</b></div>
      <div class="period-row" style="border-top:1px dashed #bfdbfe;margin-top:5px;padding-top:7px;">
        <span><i class="fas fa-play"></i> من</span>
        <b>${SHIFT_START?`${dateShort(SHIFT_START)} — ${timeFull(SHIFT_START)}`:'— (أول شيفت)'}</b>
      </div>
      <div class="period-row"><span><i class="fas fa-flag-checkered"></i> إلى</span><b>${dateShort(now)} — ${timeFull(now)}</b></div>
      ${SHIFT_START?`<div class="period-row"><span><i class="fas fa-hourglass-half"></i> المدة</span><b>${durationTxt(SHIFT_START,now)}</b></div>`:''}
    </div>
    <div style="font-size:0.78rem;font-weight:800;color:var(--muted);margin-bottom:6px;">
      إجمالي معاملات الفيزا والمحافظ لهذا الشيفت
    </div>
    <div class="mrow">
      <span><i class="fas fa-credit-card" style="color:var(--pos-c);"></i> إجمالي ماكينات POS</span>
      <b style="color:var(--pos-c);">${fmt(totalPos)} ج</b>
    </div>
    <div class="mrow">
      <span><i class="fas fa-wallet" style="color:var(--wal-c);"></i> إجمالي المحافظ</span>
      <b style="color:var(--wal-c);">${fmt(totalWal)} ج</b>
    </div>
    ${trTotal>0?`<div class="mrow" style="font-size:0.8rem;color:var(--warn);">
      <span style="padding-right:20px;"><i class="fas fa-right-left"></i> منها تحويلات مُضافة</span>
      <b style="color:var(--warn);font-size:0.9rem;">${fmt(trTotal)} ج</b>
    </div>`:''}
    <div class="mrow total">
      <span><b style="font-weight:900;">الإجمالي الكلي</b></span>
      <b>${fmt(grand)} ج</b>
    </div>
    <div style="margin-top:14px;background:#fef9c3;border:1px solid #fde68a;border-radius:9px;padding:10px 12px;font-size:0.8rem;color:var(--warn);font-weight:700;text-align:center;">
      <i class="fas fa-circle-question"></i> هل تريد إغلاق الشيفت بهذه القيم؟
    </div>`;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });

async function doCloseShift(){
  if(SAVING)return;
  const branch=getBranch();
  const cashier=document.getElementById('cashier-name').value.trim();
  const shiftDate=document.getElementById('shift-date').value||new Date().toISOString().slice(0,10);
  const{totalPos,totalWal,grand}=calcTotals();
  const trTotal=totalCurrentTransfers();
  const btn=document.getElementById('modal-ok');
  SAVING=true; btn.disabled=true;
  try{
    const shifts=await api('pos_shifts',{method:'POST',body:JSON.stringify({
      branch, employee_name:cashier, shift_date:shiftDate,
      total_wallets:totalWal, total_machines:totalPos, grand_total:grand,
      total_transfers:trTotal,
      notes:document.getElementById('notes-inp').value||null,
      is_settled:false
    })});
    const shift=shifts[0];
    const lines=METHODS.map(m=>{
      const v=VALUES[m.id]||{};
      const opening=parseFloat(v.opening)||0;
      const closing=parseFloat(v.closing)||0;
      return{
        shift_id:shift.id,
        method_type:m.method_type,
        method_key:m.method_key,
        display_name:m.display_name,
        opening_balance:m.method_type==='wallet'?opening:null,
        closing_balance:closing,
        actual_amount:getNet(m)
      };
    });
    await api('pos_shift_lines',{method:'POST',body:JSON.stringify(lines)});
    await fetch(SB_URL+`/rest/v1/pos_wallet_transfers?branch=eq.${encodeURIComponent(branch)}&shift_id=is.null&is_disbursed=eq.false`,{
      method:'PATCH',
      headers:{...H_BASE,'Prefer':'return=minimal'},
      body:JSON.stringify({shift_id:shift.id})
    });
    closeModal();
    toast('تم إغلاق الشيفت بنجاح ✓');
    METHODS.forEach(m=>{
      const v=VALUES[m.id]||{};
      VALUES[m.id]= m.method_type==='wallet' ? {opening:v.closing||'', closing:''} : {closing:''};
    });
    document.getElementById('cashier-name').value='';
    document.getElementById('notes-inp').value='';
    await Promise.all([loadTransfers(), loadShiftStart()]);
    renderShiftBar();
    render();
  }catch(e){
    toast('خطأ في الحفظ: '+e.message,'err');
  }finally{
    SAVING=false; btn.disabled=false;
  }
}

document.getElementById('shift-date').value=new Date().toISOString().slice(0,10);
init();
</script>
</body>
</html>
