  <script>/* phalix-theme-stamp — يختم الثيم قبل الرسم عشان مفيش وميض.
     ⚠️ من غيره الصفحة مابتقولش هي فاتحة ولا داكنة، فقاعدة
     prefers-color-scheme في tokens.css بتتبع **إعداد الجهاز** بدل
     إعداد التطبيق — وده اللي كان بيخلّي ويب الطيار وكروت شاشة
     التوزيع تطلع داكنة عند ناس جهازهم على الوضع الليلي.
     الافتراضي فاتح: الوضع الليلي باختيار صريح من الزر بس. */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 4px 0;
    }
    .offer-card {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      position: relative;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }
    .offer-card:hover { border-color: var(--accent); }
    .offer-card.expired {
      opacity: 0.6;
      border-color: var(--danger);
    }
    .offer-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 10px;
      width: fit-content;
    }
    .offer-type-company { background:#dbeafe; color:#1d4ed8; }
    .offer-type-item    { background:#dcfce7; color:#15803d; }
    .offer-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .offer-details {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 10px;
      white-space: pre-wrap;
      flex: 1;
      /* التفاصيل الطويلة كانت بتطوّل الكارت وتخلّي كروت الصف كلها تتمطّط
         معاه. بنقصّها على 4 سطور والنص الكامل في نافذة «التفاصيل». */
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    /* ===== نافذة تفاصيل العرض ===== */
    .od-row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #334155; font-size: 0.82rem; }
    .od-row:last-of-type { border-bottom: none; }
    .od-label { color: #94a3b8; font-weight: 700; min-width: 92px; flex-shrink: 0; }
    .od-val { color: #e2e8f0; font-weight: 600; }
    .od-details-box {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px;
      padding: 12px 14px; margin-top: 6px; color: #e2e8f0;
      font-size: 0.86rem; line-height: 1.9; white-space: pre-wrap;
      word-break: break-word; max-height: 320px; overflow-y: auto;
    }
    .od-details-box a { color: #38bdf8; text-decoration: underline; }
    .offer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .offer-actions { display: flex; gap: 6px; }
    .expired-badge {
      background: #fee2e2;
      color: #991b1b;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .active-badge {
      background: #dcfce7;
      color: #15803d;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 480px;
      direction: rtl;
      font-family: var(--font);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 5px;
    }
    .modal-field { margin-bottom: 14px; }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .type-toggle-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #94a3b8;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .type-toggle-btn.active {
      border-color: #38bdf8;
      background: #0c4a6e;
      color: #7dd3fc;
    }
  </style>
</head>

  <script>
    let activeUser = null;
    let userBranch = '';
    let allOffers  = [];

    checkAuth().then(user => {
      activeUser = user;
      if (user) {
        userBranch = (Session.branch()).trim();
        loadOffers();
      }
    });

    async function loadOffers() {
      const container = document.getElementById('offers-container');
      container.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">⏳ جاري جلب البيانات...</p>';
      try {
        const response = await sbOffersList();
        allOffers = Array.isArray(response) ? response : [];
        applyFilter();
      } catch(e) {
        container.innerHTML = '<p style="text-align:center;color:var(--danger);padding:40px;">❌ فشل الاتصال</p>';
      }
    }

    /* اسم العرض وتفاصيله بيكتبهم المستخدمون وكانوا بيتحطّوا في innerHTML
       زي ما هم — أي علامة < في النص كانت تتفسّر HTML. بنهرّبهم دلوقتي. */
    function offEsc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    // الروابط جوّه التفاصيل تبقى قابلة للضغط — بنهرّب النص **الأول** بعدين
    // نحوّل الروابط، عشان الهروب ما يبوّظش الوسم اللي عملناه
    function offLinkify(s) {
      return offEsc(s).replace(/(https?:\/\/[^\s<]+)/g,
        m => '<a href="' + m + '" target="_blank" rel="noopener noreferrer">' + m + '</a>');
    }

    function isExpired(offer) {
      if (!offer.expires_at || offer.expires_at === 'null' || offer.expires_at === '') return false;
      return new Date(offer.expires_at) < new Date();
    }

    function applyFilter() {
      const typeVal   = document.getElementById('filterType').value;
      const statusVal = document.getElementById('filterStatus').value;
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = allOffers.filter(o => {
        const expired     = isExpired(o);
        const typeMatch   = (typeVal === 'all' || o.type === typeVal);
        const statusMatch = (
          statusVal === 'all' ||
          (statusVal === 'active'  && !expired) ||
          (statusVal === 'expired' &&  expired)
        );
        const searchMatch = !searchVal || [
          o.name, o.detailes, o.details
        ].some(val => String(val || '').toLowerCase().includes(searchVal));

        return typeMatch && statusMatch && searchMatch;
      });

      renderOffers(filtered);
    }

    function renderOffers(items) {
      const container = document.getElementById('offers-container');
      if (items.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:60px;color:var(--text-muted);">
            <i class="fas fa-tags" style="font-size:2.5rem;display:block;margin-bottom:12px;opacity:0.3;"></i>
            لا توجد عروض
          </div>`;
        return;
      }

      items.sort((a, b) => (isExpired(a) ? 1 : 0) - (isExpired(b) ? 1 : 0));

      container.innerHTML = `<div class="offers-grid">${items.map(offer => {
        const expired   = isExpired(offer);
        const typeClass = offer.type === 'شركة' ? 'offer-type-company' : 'offer-type-item';
        const typeIcon  = offer.type === 'شركة' ? '🏭' : '💊';
        const details   = offer.detailes || offer.details || '';

        let expiryText = '';
        if (offer.expires_at && offer.expires_at !== 'null' && offer.expires_at !== '') {
          const d = new Date(offer.expires_at);
          expiryText = d.toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
        }

        return `
          <div class="offer-card ${expired ? 'expired' : ''}">
            <div class="offer-type-badge ${typeClass}">
              ${typeIcon} ${offEsc(offer.type)}
            </div>
            <div class="offer-name">${offEsc(offer.name) || '---'}</div>
            <div class="offer-details">${offEsc(details)}</div>
            <div class="offer-footer">
              <div>
                ${expired
                  ? `<span class="expired-badge">❌ منتهي — ${expiryText}</span>`
                  : expiryText
                    ? `<span style="font-size:0.75rem;color:var(--text-muted);">
                         <i class="fas fa-clock"></i> ينتهي ${expiryText}
                       </span>`
                    : `<span class="active-badge">✅ سارٍ بدون تاريخ</span>`
                }
              </div>
              <div class="offer-actions">
                <button class="btn btn-sm btn-icon"
                  onclick="openDetails('${offer.id}')"
                  style="background:var(--surface-3);color:var(--text-primary);padding:5px 8px;"
                  title="عرض التفاصيل كاملة">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="btn btn-sm btn-icon"
                  onclick="openEditModal('${offer.id}')"
                  style="background:var(--accent);color:#fff;padding:5px 8px;"
                  title="تعديل">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-icon"
                  onclick="deleteOffer('${offer.id}', this)"
                  style="background:var(--danger);color:#fff;padding:5px 8px;"
                  title="حذف">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>`;
      }).join('')}</div>`;
    }

    function setOfferType(type) {
      document.getElementById('modal-type').value = type;
      document.getElementById('modal-name-label').textContent =
        type === 'شركة' ? 'اسم الشركة' : 'اسم الصنف';
      document.getElementById('btn-company').classList.toggle('active', type === 'شركة');
      document.getElementById('btn-item').classList.toggle('active',    type === 'صنف');
    }

    /* ===== نافذة التفاصيل =====
       الكارت بيعرض 4 سطور بس من التفاصيل، وفيه بيانات مش ظاهرة فيه خالص
       (الفرع، تاريخ الإضافة، آخر تعديل) — كلها هنا. */
    let odCurrentId = null;
    function openDetails(id) {
      const o = allOffers.find(x => String(x.id) === String(id));
      if (!o) return;
      odCurrentId = id;
      const details = o.detailes || o.details || '';
      const expired = isExpired(o);
      const fmt = t => {
        if (!t || t === 'null') return null;
        const d = new Date(t);
        return isNaN(d) ? null : d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
      };
      const fmtDT = t => {
        if (!t || t === 'null') return '—';
        const d = new Date(t);
        if (isNaN(d)) return '—';
        // توقيت القاهرة صراحةً مش توقيت الجهاز
        return d.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Africa/Cairo' })
          + ' ' + d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Africa/Cairo' });
      };
      const exp = fmt(o.expires_at);
      const status = expired
        ? '<span style="color:#f87171;font-weight:800">❌ منتهي' + (exp ? ' — ' + exp : '') + '</span>'
        : (exp ? '<span style="color:#4ade80;font-weight:800">✅ سارٍ حتى ' + offEsc(exp) + '</span>'
               : '<span style="color:#4ade80;font-weight:800">✅ سارٍ بدون تاريخ انتهاء</span>');
      const row = (lbl, val) => '<div class="od-row"><span class="od-label">' + lbl + '</span><span class="od-val">' + val + '</span></div>';

      document.getElementById('od-body').innerHTML =
          row('النوع', (o.type === 'شركة' ? '🏭 ' : '💊 ') + offEsc(o.type || '—'))
        + row('الاسم', offEsc(o.name) || '—')
        + (o.branch ? row('الفرع', offEsc(o.branch)) : '')
        + row('الحالة', status)
        + row('أُضيف', fmtDT(o.created_at))
        + (o.updated_at && o.updated_at !== o.created_at ? row('آخر تعديل', fmtDT(o.updated_at)) : '')
        + '<div style="margin-top:14px"><span class="od-label">التفاصيل</span>'
        + '<div class="od-details-box">' + (details.trim() ? offLinkify(details) : '<span style="color:#64748b">مفيش تفاصيل مكتوبة</span>') + '</div></div>';

      document.getElementById('details-modal').style.display = 'flex';
    }
    function closeDetails() {
      document.getElementById('details-modal').style.display = 'none';
      odCurrentId = null;
    }
    function editFromDetails() {
      const id = odCurrentId;
      closeDetails();
      if (id != null) openEditModal(id);
    }

    function openAddModal() {
      document.getElementById('modal-id').value      = '';
      document.getElementById('modal-name').value    = '';
      document.getElementById('modal-details').value = '';
      document.getElementById('modal-expires').value = '';
      document.getElementById('modal-title-text').innerHTML =
        '<i class="fas fa-tag"></i> عرض جديد';
      document.getElementById('modal-save-btn').innerHTML =
        '<i class="fas fa-save"></i> حفظ';
      setOfferType('شركة');
      document.getElementById('offer-modal').style.display = 'flex';
    }

    function openEditModal(id) {
      const offer = allOffers.find(o => o.id == id);
      if (!offer) return;

      document.getElementById('modal-id').value      = id;
      document.getElementById('modal-name').value    = offer.name    || '';
      document.getElementById('modal-details').value = offer.detailes || offer.details || '';
      document.getElementById('modal-title-text').innerHTML =
        '<i class="fas fa-edit"></i> تعديل العرض';
      document.getElementById('modal-save-btn').innerHTML =
        '<i class="fas fa-save"></i> حفظ التعديلات';

      if (offer.expires_at && offer.expires_at !== 'null' && offer.expires_at !== '') {
        document.getElementById('modal-expires').value = offer.expires_at.split('T')[0];
      } else {
        document.getElementById('modal-expires').value = '';
      }

      setOfferType(offer.type || 'شركة');
      document.getElementById('offer-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('offer-modal').style.display = 'none';
    }

    async function saveOffer() {
      const btn     = document.getElementById('modal-save-btn');
      const id      = document.getElementById('modal-id').value;
      const name    = document.getElementById('modal-name').value.trim();
      const details = document.getElementById('modal-details').value.trim();
      const expires = document.getElementById('modal-expires').value;
      const type    = document.getElementById('modal-type').value;

      if (!name)    { alert("برجاء إدخال الاسم");         return; }
      if (!details) { alert("برجاء إدخال تفاصيل العرض"); return; }

      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      const success = id
        ? await sbOfferUpdate(id, { name, type, details, expires_at: expires || null })
        : await sbOfferInsert({ name, type, details, expires_at: expires || null, branch: userBranch });

      if (success) {
        closeModal();
        loadOffers();
      } else {
        alert("❌ فشل الحفظ");
      }

      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
    }

    async function deleteOffer(id, btn) {
      if (!confirm("هل أنت متأكد من حذف هذا العرض؟")) return;
      btn.disabled  = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      const success = await sbOfferDelete(id);

      if (success) {
        allOffers = allOffers.filter(o => o.id != id);
        applyFilter();
      } else {
        alert("❌ فشل الحذف");
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-trash"></i>';
      }
    }

    document.getElementById('offer-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
