<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مطابقة خزنة visa - Phalix</title>
<link rel="stylesheet" href="tokens.css?v=20260906">
<script>/* ختم الثيم قبل الرسم — من غيره الصفحة بتتبع إعداد الجهاز مش التطبيق */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=20261011b">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  .container{ max-width:none !important; }
  .vz{ --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --teal:#0d9488;
       --bad:#dc2626; --warn:#b45309; --ok:#16a34a; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .vz{
       --c1:#3987e5; --c2:#d95926; --c3:#199e70; --teal:#2dd4bf;
       --bad:#f87171; --warn:#f59e0b; --ok:#4ade80; } }
  :root[data-theme="dark"] .vz{ --c1:#3987e5; --c2:#d95926; --c3:#199e70; --teal:#2dd4bf;
       --bad:#f87171; --warn:#f59e0b; --ok:#4ade80; }

  .hdr{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .hdr .tools{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .chip{ font-size:.71rem; font-weight:700; color:var(--text-secondary); background:var(--surface-3);
         border-radius:999px; padding:5px 12px; white-space:nowrap; }
  .chip.warn{ color:var(--warn); background:rgba(180,83,9,.1); }

  /* ── كروت الفروع: الفرق وبس ───────────────────────────────────
     الكارت كان فيه كمان visa والمصادر — وهما نفسهما الشريطين تحت.
     تكرار الرقم في مكانين بيزحم من غير ما يضيف. */
  .brs{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  @media(max-width:860px){ .brs{ grid-template-columns:1fr 1fr; } }
  .br{ background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg);
       padding:11px 14px; cursor:pointer; transition:border-color .15s;
       display:flex; align-items:center; gap:10px; }
  .br:hover{ border-color:var(--teal); }
  .br.on{ border-color:var(--teal); box-shadow:0 0 0 2.5px rgba(13,148,136,.16); }
  .br .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .br .nm{ font-size:.84rem; font-weight:800; }
  .br .gap{ margin-right:auto; font-size:1.25rem; font-weight:900; line-height:1;
            font-variant-numeric:tabular-nums; direction:ltr; }
  .br .na{ margin-right:auto; color:var(--text-muted); font-size:.74rem; font-weight:800; }

  .grid2{ display:grid; grid-template-columns:1.1fr 1fr; gap:14px; margin-top:16px; align-items:start; }
  @media(max-width:1150px){ .grid2{ grid-template-columns:1fr; } }
  .grid2 > *, .eqrow > *{ min-width:0; }

  .pnl{ border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px 16px; min-width:0; }
  .pnl > h4{ font-size:.82rem; font-weight:800; margin:0 0 13px; padding-bottom:10px;
             border-bottom:1px solid var(--surface-3); display:flex; align-items:center; gap:8px; }
  .lnk{ margin-right:auto; background:none; border:none; cursor:pointer; padding:0;
        font-family:inherit; font-size:.74rem; font-weight:700; color:var(--teal); }
  .lnk:hover{ text-decoration:underline; }

  /* ── شريطا المقارنة ───────────────────────────────────────────── */
  .eqrow{ display:grid; grid-template-columns:96px 1fr 108px; gap:11px; align-items:center; margin-bottom:10px; }
  .eqlbl{ font-size:.78rem; font-weight:800; }
  .eqbar{ height:28px; border-radius:7px; background:var(--surface-3); overflow:hidden; display:flex; }
  .eqseg{ height:100%; }
  .eqseg + .eqseg{ box-shadow:-2px 0 0 var(--surface); }
  /* الجزء المخطّط = الفرق. من غيره الشريط الأقصر بيسيب فراغ رمادي
     مجهول، والقارئ مايعرفش إنه هو نفسه الرقم اللي تحته. */
  .eqseg.hatch{ background-image:repeating-linear-gradient(45deg,
                 rgba(220,38,38,.26) 0 5px, rgba(220,38,38,.07) 5px 10px); }
  .eqval{ font-size:.88rem; font-weight:900; font-variant-numeric:tabular-nums; direction:ltr; text-align:left; }
  @media(max-width:620px){
    .eqrow{ grid-template-columns:1fr auto; gap:7px 10px; }
    .eqlbl{ grid-column:1; grid-row:1; }
    .eqval{ grid-column:2; grid-row:1; }
    .eqbar{ grid-column:1/-1; grid-row:2; height:26px; }
  }

  .gapline{ margin-top:14px; padding:11px 14px; border-radius:var(--radius-md);
            display:flex; align-items:center; gap:13px; flex-wrap:wrap; }
  .gapline.bad{ background:rgba(220,38,38,.07); border:1.5px solid rgba(220,38,38,.3); }
  .gapline.ok{ background:rgba(22,163,74,.08); border:1.5px solid rgba(22,163,74,.3); }
  .gapline .v{ font-size:1.5rem; font-weight:900; font-variant-numeric:tabular-nums; direction:ltr; }
  .gapline .t{ font-size:.76rem; font-weight:700; color:var(--text-secondary); line-height:1.7; flex:1; min-width:190px; }

  /* ── المصادر: جدول واحد بدل تلات لوحات ─────────────────────────
     التلات لوحات كانت بتكرّر الترويسة والإطار والمجموع ٣ مرات لنفس
     المعلومة. سطر عنوان لكل مصدر وتحته تفصيله = نفس البيانات أهدى. */
  .src{ width:100%; min-width:0; border-collapse:collapse; }
  .src td{ padding:4px 2px; font-size:.75rem; color:var(--text-secondary); }
  .src td.n{ text-align:left; direction:ltr; font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
  .src tr.g td{ padding:11px 2px 7px; font-size:.81rem; font-weight:800; color:var(--text-primary); }
  .src tr.g.sep td{ border-top:1px solid var(--surface-3); }
  .src tr.g td.n{ font-weight:900; font-size:.85rem; }
  .src tr.d td:first-child{ padding-right:19px; }
  .src .mut{ color:var(--text-muted); font-weight:700; }
  .dot2{ width:9px; height:9px; border-radius:3px; display:inline-block; margin-left:7px; }

  .empty{ border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:22px 16px;
          text-align:center; color:var(--text-muted); font-size:.78rem; font-weight:700; line-height:1.8; }
  .empty.flat{ border:none; padding:20px 10px; }
  .msg{ font-size:.77rem; font-weight:700; }
  .msg.wait{ color:var(--teal); } .msg.err{ color:var(--bad); }

  .spark{ display:flex; align-items:flex-end; gap:4px; height:76px; }
  .spark .b{ flex:1; background:var(--teal); border-radius:3px 3px 0 0; min-height:3px; }
  .spark .b.up{ background:var(--bad); }
  .sparkx{ display:flex; gap:4px; margin-top:6px; font-size:.63rem; color:var(--text-muted); font-weight:700; }
  .sparkx span{ flex:1; text-align:center; overflow:hidden; white-space:nowrap; }
  .note{ margin-top:10px; font-size:.75rem; font-weight:700; line-height:1.7; }

  /* ── تبويبان: الوضع الحالي / الفرق عند كل تقفيلة ── */
  .tabs2{ display:flex; gap:6px; margin:14px 0 2px; border-bottom:1.5px solid var(--border); }
  .tab2{ font-size:.84rem; font-weight:800; padding:10px 20px; border:none; background:none;
         cursor:pointer; font-family:inherit; color:var(--text-muted);
         border-bottom:2.5px solid transparent; margin-bottom:-1.5px; }
  .tab2.on{ color:var(--teal); border-bottom-color:var(--teal); }

  .shbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:14px 0; }
  .shbar select{ font-family:inherit; font-size:.78rem; padding:6px 11px; border:1.5px solid var(--border);
                 border-radius:8px; background:var(--surface); color:var(--text-primary); }
  .shbar label{ font-size:.75rem; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer; }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-bottom:16px; }
  @media(max-width:760px){ .stats{ grid-template-columns:1fr; } }
  .st{ border:1.5px solid var(--border); border-radius:11px; padding:13px 16px; }
  .st .k{ font-size:.7rem; color:var(--text-muted); font-weight:700; }
  .st .v{ font-size:1.5rem; font-weight:900; margin-top:5px; font-variant-numeric:tabular-nums; direction:ltr; }
  .st .s{ font-size:.68rem; color:var(--text-muted); font-weight:700; margin-top:3px; }

  .shwrap{ border:1.5px solid var(--border); border-radius:11px; overflow:auto; max-height:560px; }
  table.sx{ width:100%; min-width:0; border-collapse:separate; border-spacing:0; }
  table.sx th{ position:sticky; top:0; z-index:1; background:var(--surface-3); padding:9px 11px;
               font-size:.69rem; font-weight:800; color:var(--text-secondary); text-align:right; white-space:nowrap; }
  table.sx th.n, table.sx td.n{ text-align:left; direction:ltr; font-variant-numeric:tabular-nums; }
  table.sx td{ padding:8px 11px; border-top:1px solid var(--surface-3); font-size:.78rem; white-space:nowrap; }
  table.sx tr:first-child td{ border-top:none; }
  .t-dim{ color:var(--text-muted); font-weight:600; }
  .dpill{ display:inline-block; min-width:74px; text-align:center; border-radius:7px; padding:3px 9px;
          font-size:.76rem; font-weight:900; font-variant-numeric:tabular-nums; direction:ltr; }
  .dpill.up{ background:rgba(220,38,38,.1); color:var(--bad); }
  .dpill.dn{ background:rgba(22,163,74,.1); color:var(--ok); }
  .dpill.z{ color:var(--text-muted); font-weight:700; background:none; }
  tr.moved{ background:rgba(220,38,38,.035); }
  tr.moved td:first-child{ box-shadow:inset 3px 0 0 var(--bad); }
</style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container vz" style="padding:16px">
    <div class="card" style="padding:16px">
      <div class="hdr">
        <div>
          <div class="page-title"><i class="fas fa-scale-balanced"></i> مطابقة خزنة visa</div>
          <div style="font-size:.74rem;color:var(--text-muted);font-weight:600;margin-top:4px">
            رصيد visa = المحافظ + غير المحصّل من الماكينات + انستاباي غير المرحّل</div>
        </div>
        <div class="tools">
          <span class="msg" id="msg"></span>
          <span class="chip" id="stamp"></span>
          <button class="btn btn-primary" id="btnRefresh" onclick="refreshNow()">
            <i class="fas fa-rotate"></i> راجع الآن</button>
        </div>
      </div>

      <div class="tabs2">
        <button class="tab2 on" id="tab-now"   onclick="switchTab('now')">الوضع الحالي</button>
        <button class="tab2"    id="tab-shift" onclick="switchTab('shift')">الفرق عند كل تقفيلة</button>
      </div>

      <div class="brs" id="brs"><div class="empty" style="grid-column:1/-1">جارٍ التحميل…</div></div>
      <div id="detail"></div>
      <div id="shiftview" style="display:none"></div>
    </div>
  </div>

  <script src="config.js?v=20260904c"></script>
  <script src="session.js?v=20261030"></script>
  <script src="branches.js?v=20260904d"></script>
  <script src="pages.js?v=20260904d"></script>
  <script src="brand.js?v=20261017n"></script>
  <script src="api.js?v=20260926dl"></script>
  <script>
    const REST = SB_URL_API + '/rest/v1/';
    /* الترويسة بتتبني لكل نداء بتوكن المستخدم — التوكن عمره ساعة، فقراءته
       مرة واحدة وقت التحميل بترجّع 401 بعدين. */
    const H = extra => sbH(Object.assign({ 'Content-Type':'application/json' }, extra || {}));

    let DATA = [], CUR = 0, POLL = null, TREND = false;
    const f0 = n => Math.round(Number(n)||0).toLocaleString('en-US');
    const f2 = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    /* كل عرض للوقت بتوقيت القاهرة صراحةً — مش بتوقيت جهاز المستخدم */
    const dt = s => { try{ return new Date(s).toLocaleString('ar-EG',
        { timeZone:'Africa/Cairo', dateStyle:'short', timeStyle:'short' }); }catch(e){ return ''; } };
    const dd = s => { try{ return new Date(s).toLocaleDateString('en-GB',
        { timeZone:'Africa/Cairo', day:'2-digit', month:'2-digit' }); }catch(e){ return ''; } };
    /* «منذ كام يوم» أنفع من تاريخ مجرّد: المقصود قِدَم الحركة مش يومها */
    const ago = s => { try{
        const d = Math.floor((Date.now() - new Date(s).getTime()) / 86400000);
        return d <= 0 ? 'اليوم' : d === 1 ? 'أمس' : 'منذ ' + d + ' يومًا';
      }catch(e){ return ''; } };

    async function rpc(name, body){
      let r, out = null;
      try{
        r = await fetch(REST + 'rpc/' + name, { method:'POST', headers: await H(), body: JSON.stringify(body||{}) });
        try{ out = await r.json(); }catch(e){ out = null; }
      }catch(e){ return { success:false, error:'تعذّر الاتصال بالخادم' }; }
      if(r.ok && out && out.success !== false) return out;
      return { success:false, error: (out && out.error) || sbFailMsg('فشل العملية', r.status) };
    }

    function setMsg(t, cls){ const el=document.getElementById('msg'); el.className='msg '+(cls||''); el.innerHTML=t||''; }

    async function load(){
      const d = await rpc('get_visa_recon', {});
      if(d.success === false){
        document.getElementById('brs').innerHTML =
          '<div class="empty" style="grid-column:1/-1;color:var(--bad)">'+esc(d.error)+'</div>';
        document.getElementById('detail').innerHTML = '';
        return;
      }
      DATA = d.branches || [];
      if(CUR >= DATA.length) CUR = 0;
      renderCards();
      if(TAB === 'shift') loadShiftHistory(); else renderDetail();
      const st = DATA.map(b=>b.synced_at).filter(Boolean).sort().pop();
      const el = document.getElementById('stamp');
      el.className = 'chip' + (st ? '' : ' warn');
      el.innerHTML = st ? 'آخر سحب: ' + esc(dt(st)) : '⚠️ لم تُسحب أرصدة الخزائن بعد';
    }

    function renderCards(){
      document.getElementById('brs').innerHTML = DATA.length ? DATA.map((b,i)=>{
        const ok  = b.gap != null && Math.abs(Number(b.gap)) < 1;
        const col = b.gap == null ? 'var(--text-muted)' : ok ? 'var(--ok)' : 'var(--bad)';
        return `
        <div class="br ${i===CUR?'on':''}" data-i="${i}" onclick="pick(${i})">
          <span class="dot" style="background:${col}"></span>
          <span class="nm">${esc(b.branch)}</span>
          ${b.gap == null ? `<span class="na">رصيد visa غير متاح</span>`
            : `<span class="gap" style="color:${col}">${ok ? 'مطابق' : f0(b.gap)}</span>`}
        </div>`; }).join('') : '<div class="empty" style="grid-column:1/-1">لا توجد فروع</div>';
    }
    window.pick = i => { CUR = i; TREND = false; renderCards();
      if(TAB === 'shift') loadShiftHistory(); else renderDetail(); };

    /* ── تبويب «الفرق عند كل تقفيلة» ──────────────────────────────
       التقفيلة هي اللحظة الوحيدة اللي الجانبين بيتقاسوا فيها مع بعض:
       الموظف بيكتب أرصدة المحافظ ساعتها بنفسه. فأي تحرّك في الفرق
       بين تقفيلتين = حصل في الشيفت ده بالتحديد. */
    let TAB = 'now', SHROWS = [], SHDAYS = 14, SHONLY = false;

    window.switchTab = t => {
      TAB = t;
      document.getElementById('tab-now').classList.toggle('on', t === 'now');
      document.getElementById('tab-shift').classList.toggle('on', t === 'shift');
      document.getElementById('detail').style.display    = t === 'now'   ? '' : 'none';
      document.getElementById('shiftview').style.display = t === 'shift' ? '' : 'none';
      if(t === 'shift') loadShiftHistory(); else renderDetail();
    };

    async function loadShiftHistory(){
      const b = DATA[CUR]; if(!b) return;
      const el = document.getElementById('shiftview');
      el.innerHTML = '<div class="empty flat">جارٍ الحساب…</div>';
      const d = await rpc('get_visa_shift_history', { p_branch: b.code || b.branch, p_days: SHDAYS });
      if(d.success === false){ el.innerHTML = '<div class="empty" style="color:var(--bad)">'+esc(d.error)+'</div>'; return; }
      SHROWS = d.rows || [];
      renderShift();
    }

    function renderShift(){
      const b = DATA[CUR] || {};
      const el = document.getElementById('shiftview');
      const bar = `<div class="shbar">
        <select id="shdays" onchange="SHDAYS=+this.value; loadShiftHistory()">
          ${[7,14,30].map(n=>`<option value="${n}" ${SHDAYS===n?'selected':''}>آخر ${n} يوم</option>`).join('')}
        </select>
        <label><input type="checkbox" ${SHONLY?'checked':''} onchange="SHONLY=this.checked; renderShift()"
               style="width:15px;height:15px"> اللي حرّك الفرق بس</label>
      </div>`;

      if(!SHROWS.length){
        el.innerHTML = bar + `<div class="empty">لا توجد تقفيلات لفرع ${esc(b.branch||'')} في هذه الفترة.
          <br><span style="font-size:.72rem">التبويب ده بيعتمد على إغلاق الورديات — الفرع اللي لسه مش على نظام التقفيلات مايظهرش فيه.</span></div>`;
        return;
      }

      const moved = SHROWS.filter(r => Number(r.delta) !== 0 && r.delta != null);
      const first = SHROWS[SHROWS.length-1], last = SHROWS[0];
      const net   = Number(last.gap) - Number(first.gap);
      const rows  = SHONLY ? moved : SHROWS;

      el.innerHTML = bar + `
        <div class="stats">
          <div class="st"><div class="k">تقفيلات في الفترة</div><div class="v">${SHROWS.length}</div>
            <div class="s">${esc(first.closed_at.slice(5,16))} ← ${esc(last.closed_at.slice(5,16))}</div></div>
          <div class="st"><div class="k">حرّكت الفرق</div>
            <div class="v" style="color:${moved.length?'var(--bad)':'var(--ok)'}">${moved.length}</div>
            <div class="s">${SHROWS.length-moved.length} تقفيلة الفرق فيها ثابت</div></div>
          <div class="st"><div class="k">صافي تحرّك الفرق</div>
            <div class="v" style="color:${Math.abs(net)<1?'var(--ok)':'var(--bad)'}">${net>0?'+':''}${f2(net)}</div>
            <div class="s">من ${f0(first.gap)} إلى ${f0(last.gap)}</div></div>
        </div>
        <div class="shwrap"><table class="sx">
          <thead><tr>
            <th>التقفيلة</th><th>الموظف</th>
            <th class="n">خزنة visa</th><th class="n">المحافظ</th><th class="n">باي موب</th>
            <th class="n">انستاباي</th><th class="n">مجموع المصادر</th><th class="n">الفرق</th><th class="n">التغيّر</th>
          </tr></thead>
          <tbody>${rows.map(r=>{
            const dv = r.delta == null ? null : Number(r.delta);
            const mv = dv !== null && dv !== 0;
            const pill = dv === null ? '<span class="dpill z">—</span>'
                       : dv === 0    ? '<span class="dpill z">ثابت</span>'
                       : `<span class="dpill ${dv>0?'up':'dn'}">${dv>0?'+':''}${f2(dv)}</span>`;
            return `<tr class="${mv?'moved':''}">
              <td>${esc(r.closed_at.slice(5,16))}</td>
              <td class="${mv?'':'t-dim'}">${esc(r.employee||'—')}</td>
              <td class="n t-dim">${f2(r.visa)}</td>
              <td class="n t-dim">${f2(r.wallets)}</td>
              <td class="n t-dim">${f2(r.paymob)}</td>
              <td class="n t-dim">${f2(r.insta)}</td>
              <td class="n t-dim">${f2(r.src_total)}</td>
              <td class="n" style="font-weight:800">${f2(r.gap)}</td>
              <td class="n">${pill}</td></tr>`;
          }).join('')}</tbody>
        </table></div>
        <div class="note" style="color:var(--text-muted)">
          كل صف محسوب في <b>لحظة التقفيلة نفسها</b>: رصيد الخزنة وقتها + أرقام المحافظ اللي الموظف كتبها
          + غير المحصّل من الماكينات + انستاباي غير المرحّل ساعتها.</div>`;
    }

    /* ⚠️ فرق بين «مفيش حاجة معلّقة ✓» و«مفيش بيانات أصلًا». السيوف لسه
       مالوش ورديات ولا ماكينات، فعلامة ✓ هناك طمأنة كاذبة. */
    const noData = b => (Number(b.src_total)||0) === 0
      && !(b.wallet_lines||[]).length && !(b.insta_lines||[]).length && !Number(b.paymob_n);

    /* ── لوحة المقارنة ─────────────────────────────────────────────
       الشريطان على نفس المقياس، والناقص في الأقصر بيتعلّم بتخطيط =
       الفرق. كده الرسم بيشرح المعادلة من غير مفتاح ألوان تحته. */
    function cmpPanel(b){
      const visa = Number(b.visa)||0, src = Number(b.src_total)||0;
      if(b.visa == null){
        return `<div class="empty"><i class="fas fa-plug-circle-xmark" style="font-size:1.4rem;display:block;margin-bottom:9px"></i>
          لم يُقرأ رصيد خزنة visa لهذا الفرع بعد.<br>
          مجموع المصادر من بياناتنا: <b style="color:var(--text-primary)">${f2(b.src_total)}</b></div>`;
      }
      const max  = Math.max(visa, src) || 1;
      const seg  = (v, bg) => { const p = (Number(v)||0)/max*100;
        return p <= 0 ? '' : `<div class="eqseg" style="width:${p.toFixed(2)}%;background:${bg}"></div>`; };
      const hseg = v => { const p = (Number(v)||0)/max*100;
        return p <= 0 ? '' : `<div class="eqseg hatch" style="width:${p.toFixed(2)}%"></div>`; };
      const ok = Math.abs(Number(b.gap)) < 1;
      return `
        <div class="eqrow"><div class="eqlbl">خزنة visa</div>
          <div class="eqbar">${seg(visa,'var(--teal)')}${src>visa?hseg(src-visa):''}</div>
          <div class="eqval">${f2(visa)}</div></div>
        <div class="eqrow"><div class="eqlbl">مجموع المصادر</div>
          <div class="eqbar">${seg(b.wallets,'var(--c1)')}${seg(b.paymob,'var(--c2)')}${seg(b.insta,'var(--c3)')}${visa>src?hseg(visa-src):''}</div>
          <div class="eqval">${f2(src)}</div></div>
        <div class="gapline ${ok?'ok':'bad'}">
          <div class="v" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'مطابق ✓':f2(b.gap)}</div>
          <div class="t">${ok ? '' : noData(b)
            ? 'لا توجد بيانات مصادر لهذا الفرع بعد، فالفرق يساوي رصيد visa كاملًا — وهذا لا يعني عجزًا.'
            : (Number(b.gap)>0 ? 'رصيد visa أكبر من مجموع المصادر. ' : 'مجموع المصادر أكبر من رصيد visa. ') +
              'المهم هو <b>تحرُّك</b> الرقم بين مراجعة وأخرى، لا قيمته.'}</div>
        </div>`;
    }

    /* ── المصادر: سطر لكل مصدر وتحته تفصيله ───────────────────── */
    function srcTable(b){
      if(noData(b)) return '<div class="empty flat">لا توجد بيانات مصادر لهذا الفرع.</div>';
      const g = (c,label,val,sep) => `<tr class="g ${sep?'sep':''}">
        <td><span class="dot2" style="background:${c}"></span>${label}</td>
        <td class="n" style="color:${c}">${f2(val)}</td></tr>`;
      const d = (label,val) => `<tr class="d"><td>${label}</td><td class="n">${val}</td></tr>`;
      let h = '<table class="src"><tbody>';

      h += g('var(--c1)','المحافظ وفوري', b.wallets, false);
      h += (b.wallet_lines||[]).length
        ? b.wallet_lines.map(w=>d(esc(w.name), f2(w.balance))).join('')
        : d('<span class="mut">لا توجد محافظ مسجَّلة</span>','');

      h += g('var(--c2)','باي موب — غير المحصّل', b.paymob, true);
      h += Number(b.paymob_n)
        ? d('<span class="mut">' + f0(b.paymob_n) + ' حركة · أقدمها '
            + (b.paymob_oldest ? esc(dd(b.paymob_oldest)) + ' · ' + esc(ago(b.paymob_oldest)) : '—')
            + '</span>','')
        : d('<span class="mut">لا توجد حركات غير محصّلة</span>','');

      h += g('var(--c3)','انستاباي غير المرحّل', b.insta, true);
      h += (b.insta_lines||[]).length
        ? b.insta_lines.map(x=>d(esc(x.emp||'—') + ' <span class="mut">· ' + esc(dd(x.at)) + '</span>', f2(x.amount))).join('')
        : d('<span class="mut">كل الورديات مُرحَّلة</span>','');

      return h + '</tbody></table>';
    }

    function renderDetail(){
      const b = DATA[CUR]; if(!b){ document.getElementById('detail').innerHTML=''; return; }
      document.getElementById('detail').innerHTML = `
        <div class="grid2">
          <div class="pnl">
            <h4><i class="fas fa-equals" style="color:var(--teal)"></i> ${esc(b.branch)}
              <button class="lnk" onclick="toggleTrend()">${TREND?'إخفاء الاتجاه':'اتجاه الفرق'}</button></h4>
            ${cmpPanel(b)}
            ${TREND ? '<div id="trend" style="margin-top:14px"><div class="empty flat">جارٍ التحميل…</div></div>' : ''}
          </div>
          <div class="pnl">
            <h4><i class="fas fa-layer-group" style="color:var(--text-secondary)"></i> المصادر
              <span class="lnk" style="color:var(--text-muted);cursor:default">${f2(b.src_total)}</span></h4>
            ${srcTable(b)}
          </div>
        </div>`;
      if(TREND) loadTrend(b.branch);
    }
    /* الاتجاه مش معروض افتراضيًا: أول مراجعتين مالهمش رسم أصلًا،
       وبعدين هو سؤال تاني غير «الوضع دلوقتي إيه». */
    window.toggleTrend = () => { TREND = !TREND; renderDetail(); };

    async function loadTrend(branch){
      const el = document.getElementById('trend'); if(!el) return;
      let rows = [];
      try{
        const r = await fetch(REST + 'visa_recon_snapshots?select=taken_at,gap'
          + '&branch=eq.' + encodeURIComponent(branch)
          + '&order=taken_at.desc&limit=30', { headers: await H() });   // data-ok: آخر 30 مراجعة لفرع واحد
        rows = (await r.json()) || [];
      }catch(e){ rows = []; }
      if(rows.length < 2){
        el.innerHTML = `<div class="empty flat">يبدأ الرسم بعد مراجعتين. كل ضغطة على «راجع الآن» تُسجَّل كنقطة،
          والمهم هو <b style="color:var(--text-primary)">تحرُّك</b> الفرق لا وجوده.</div>`;
        return;
      }
      rows = rows.reverse();
      const mx = Math.max(...rows.map(r=>Math.abs(Number(r.gap)||0)), 1);
      const delta = (Number(rows[rows.length-1].gap)||0) - (Number(rows[0].gap)||0);
      /* تواريخ الـ30 عمود بتتداخل وتبقى سطر مهوّش — الأول والأخير بس */
      const lbl = i => (i===0 || i===rows.length-1) ? esc(dd(rows[i].taken_at)) : '';
      el.innerHTML = `
        <div class="spark">${rows.map((r,i)=>{
          const v = Math.abs(Number(r.gap)||0);
          const grew = i>0 && v > Math.abs(Number(rows[i-1].gap)||0) + 0.5;
          return `<div class="b ${grew?'up':''}" style="height:${Math.max(3,(v/mx*100)).toFixed(1)}%"
                    title="${esc(dt(r.taken_at))} — ${f2(r.gap)}"></div>`;
        }).join('')}</div>
        <div class="sparkx">${rows.map((r,i)=>`<span>${lbl(i)}</span>`).join('')}</div>
        <div class="note" style="color:${Math.abs(delta)<1?'var(--ok)':'var(--bad)'}">
          ${Math.abs(delta)<1 ? 'الفرق ثابت منذ أول مراجعة ✓ — غالبًا رصيد افتتاحي، لا حركة جارية.'
            : 'تحرَّك الفرق بمقدار ' + f2(delta) + ' منذ أول مراجعة معروضة — يحتاج تفسيرًا.'}
        </div>`;
    }

    /* ── السحب اللحظي ──
       الشاشة ما تقدرش تكلّم eplus (عناوين محلية)، فبتسجّل طلب والمحرّك
       اللي جوّه الشبكة ينفّذه في نبضته الجاية. */
    async function refreshNow(){
      const btn = document.getElementById('btnRefresh');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ السحب…';
      setMsg('تم إرسال الطلب — في انتظار محرّك المزامنة…', 'wait');

      const r = await rpc('request_visa_refresh', {});
      if(r.success === false){ setMsg(esc(r.error), 'err'); doneBtn(); return; }
      waitFor(r.request_id);
    }

    function doneBtn(){
      const btn = document.getElementById('btnRefresh');
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-rotate"></i> راجع الآن';
    }

    function waitFor(id){
      clearInterval(POLL);
      POLL = setInterval(async () => {
        const s = await rpc('get_visa_refresh_status', { p_id: id });
        if(s.success === false) return;
        const w = Number(s.waited_seconds) || 0;
        if(s.status === 'done'){
          clearInterval(POLL);
          await rpc('save_visa_recon_snapshot', {});   // كل مراجعة = نقطة في الاتجاه
          await load();
          setMsg('تم السحب والمراجعة ✓', '');
          doneBtn();
          setTimeout(()=>setMsg(''), 4000);
          return;
        }
        if(s.status === 'error'){
          clearInterval(POLL);
          setMsg('فشل السحب — ' + esc(s.message || 'خطأ غير معروف'), 'err');
          doneBtn();
          return;
        }
        /* ⚠️ انتظار صامت أسوأ من رسالة: لو المحرّك واقف الطلب هيفضل
           pending للأبد من غير ما حد يعرف. */
        if(w > 300){
          clearInterval(POLL);
          setMsg('الطلب ما زال معلّقًا بعد ' + Math.round(w/60) + ' دقائق — محرّك المزامنة لا يستجيب.', 'err');
          doneBtn();
          return;
        }
        setMsg('في انتظار محرّك المزامنة… (' + w + ' ثانية)', 'wait');
      }, 5000);
    }

    checkAuth().then(user => { if(!user) return; load(); });
  </script>
</body>
</html>
