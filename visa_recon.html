<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="tokens.css?v=20260906">
<script>/* ختم الثيم قبل الرسم — من غيره الصفحة بتتبع إعداد الجهاز مش التطبيق */
  try{var _t=localStorage.getItem("phalix_theme")||(localStorage.getItem("phalix_dark")==="1"?"dark":"light");document.documentElement.setAttribute("data-theme",_t==="dark"?"dark":"light");}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=20261011b">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  .container{ max-width:none !important; }
  .vz{ --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --teal:#0d9488;
       --bad:#dc2626; --warn:#b45309; --ok:#16a34a; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .vz{
       --c1:#3987e5; --c2:#d95926; --c3:#199e70; --teal:#2dd4bf;
       --bad:#f87171; --warn:#f59e0b; --ok:#4ade80; } }
  :root[data-theme="dark"] .vz{ --c1:#3987e5; --c2:#d95926; --c3:#199e70; --teal:#2dd4bf;
       --bad:#f87171; --warn:#f59e0b; --ok:#4ade80; }

  /* ── الترويسة ─────────────────────────────────────────────────── */
  .hdr{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .hdr .tools{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .chip{ font-size:.71rem; font-weight:700; color:var(--text-secondary); background:var(--surface-3);
         border-radius:999px; padding:5px 12px; white-space:nowrap; }
  .chip.warn{ color:var(--warn); background:rgba(180,83,9,.1); }

  /* ── كروت الفروع ──────────────────────────────────────────────── */
  .brs{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  @media(max-width:900px){ .brs{ grid-template-columns:1fr 1fr; } }
  .br{ background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg);
       padding:13px 15px; cursor:pointer; transition:border-color .15s; }
  .br:hover{ border-color:var(--teal); }
  .br.on{ border-color:var(--teal); box-shadow:0 0 0 2.5px rgba(13,148,136,.16); }
  .br .nm{ font-size:.86rem; font-weight:800; margin-bottom:9px; display:flex; align-items:center; gap:7px; }
  .br .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .br .gap{ font-size:1.4rem; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; direction:ltr; text-align:right; }
  .br .cap{ font-size:.68rem; color:var(--text-muted); font-weight:700; margin-top:5px; }
  .br .pair{ display:flex; gap:10px; font-size:.68rem; color:var(--text-muted);
             font-weight:700; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
  .br .pair b{ color:var(--text-secondary); font-variant-numeric:tabular-nums; direction:ltr; }
  .na{ color:var(--text-muted); font-size:.9rem; font-weight:800; }

  /* ── الشبكة: صف الرسوم ثم صف المصادر ───────────────────────────
     الشاشة كانت عمود واحد على عرض الصفحة كلها، فجدول من عمودين
     بيتمدّ على ١٩٠٠ بكسل وبينه فراغ مهول. الرسمين جنب بعض والمصادر
     التلاتة جنب بعض = نفس المعلومة في نص الارتفاع وبلا فراغ ميت. */
  .grid2{ display:grid; grid-template-columns:1.35fr 1fr; gap:14px; margin-top:16px; align-items:start; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px; align-items:start; }
  @media(max-width:1250px){ .grid2,.grid3{ grid-template-columns:1fr; } }

  /* عنصر الـgrid افتراضيًا min-width:auto، فأي محتوى عريض بيوسّع اللوحة
     ويطلّع الصفحة كلها عرض أفقي بدل ما يتقلّص جوّاها. */
  .grid2 > *, .grid3 > *, .eqrow > *{ min-width:0; }
  .pnl{ border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px 16px; min-width:0; }
  .pnl > h4{ font-size:.82rem; font-weight:800; margin:0 0 12px; padding-bottom:10px;
             border-bottom:1px solid var(--surface-3); display:flex; align-items:center; gap:7px; }
  .pnl > h4 .sum{ margin-right:auto; font-size:.84rem; font-weight:900;
                  font-variant-numeric:tabular-nums; direction:ltr; }

  /* ── شريط المقارنة ────────────────────────────────────────────── */
  .eqrow{ display:grid; grid-template-columns:104px 1fr 112px; gap:11px; align-items:center; margin-bottom:9px; }
  .eqlbl{ font-size:.79rem; font-weight:800; }
  .eqbar{ height:30px; border-radius:7px; background:var(--surface-3); overflow:hidden; display:flex; }
  .eqseg{ height:100%; }
  .eqseg + .eqseg{ box-shadow:-2px 0 0 var(--surface); }
  /* الجزء المخطّط = الفرق. من غيره الشريط الأقصر بيسيب فراغ رمادي
     مجهول، والقارئ مايعرفش إنه هو نفسه الرقم اللي تحت. */
  .eqseg.hatch{ background-image:repeating-linear-gradient(45deg,
                 rgba(220,38,38,.26) 0 5px, rgba(220,38,38,.07) 5px 10px); }
  .eqval{ font-size:.9rem; font-weight:900; font-variant-numeric:tabular-nums; direction:ltr; text-align:left; }
  /* على الموبايل التلات أعمدة بتخنق الشريط والرقم بيتقص — الاسم
     والرقم سطر والشريط تحتهم. */
  @media(max-width:620px){
    .eqrow{ grid-template-columns:1fr auto; gap:7px 10px; }
    .eqlbl{ grid-column:1; grid-row:1; }
    .eqval{ grid-column:2; grid-row:1; }
    .eqbar{ grid-column:1/-1; grid-row:2; height:26px; }
  }

  .lgnd{ display:flex; gap:7px 16px; flex-wrap:wrap; margin-top:12px; }
  .lgi{ display:flex; align-items:center; gap:7px; font-size:.75rem; font-weight:700; }
  .lgi i{ width:12px; height:12px; border-radius:3px; display:inline-block; flex:none; }
  .lgi i.hatch{ background-image:repeating-linear-gradient(45deg,
                 rgba(220,38,38,.3) 0 3px, rgba(220,38,38,.08) 3px 6px); }
  .lgi b{ font-variant-numeric:tabular-nums; direction:ltr; }

  .gapbox{ margin-top:14px; padding:12px 15px; border-radius:var(--radius-md); display:flex;
           align-items:center; gap:14px; flex-wrap:wrap; }
  .gapbox.bad{ background:rgba(220,38,38,.07); border:1.5px solid rgba(220,38,38,.3); }
  .gapbox.ok{ background:rgba(22,163,74,.08); border:1.5px solid rgba(22,163,74,.3); }
  .gapbox .v{ font-size:1.6rem; font-weight:900; font-variant-numeric:tabular-nums; direction:ltr; }
  .gapbox .t{ font-size:.77rem; font-weight:700; color:var(--text-secondary); line-height:1.75; flex:1; min-width:210px; }

  /* ── جداول المصادر ────────────────────────────────────────────── */
  /* ⚠️ style.css فيه table{min-width:500px} عامة — من غير الإلغاء ده
     الجدول بيدفع الصفحة كلها لعرض أفقي على الموبايل. */
  .dtbl{ width:100%; min-width:0; border-collapse:collapse; }
  .dtbl th{ background:var(--surface-3); padding:7px 10px; font-size:.69rem; text-align:right;
            font-weight:800; color:var(--text-secondary); }
  .dtbl td{ padding:7px 10px; border-bottom:1px solid var(--surface-3); font-size:.78rem; }
  .dtbl tr:last-child td{ border-bottom:none; }
  .dtbl .n{ text-align:left; direction:ltr; font-variant-numeric:tabular-nums; font-weight:700; }
  .dtbl .sub2{ display:block; font-size:.67rem; color:var(--text-muted); font-weight:700; margin-top:2px; }

  .big{ font-size:1.75rem; font-weight:900; font-variant-numeric:tabular-nums; direction:ltr;
        text-align:right; line-height:1; }
  .bigcap{ font-size:.73rem; color:var(--text-muted); font-weight:700; margin-top:6px; }
  .meta{ display:flex; gap:10px; flex-wrap:wrap; margin-top:13px; padding-top:11px; border-top:1px solid var(--surface-3); }
  .meta div{ flex:1; min-width:96px; }
  .meta .k{ font-size:.68rem; color:var(--text-muted); font-weight:700; }
  .meta .v{ font-size:.88rem; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums; }

  .empty{ border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:22px 16px;
          text-align:center; color:var(--text-muted); font-size:.78rem; font-weight:700; line-height:1.8; }
  .empty.flat{ border:none; padding:26px 10px; }
  .msg{ font-size:.77rem; font-weight:700; }
  .msg.wait{ color:var(--teal); } .msg.err{ color:var(--bad); }

  .spark{ display:flex; align-items:flex-end; gap:4px; height:92px; }
  .spark .b{ flex:1; background:var(--teal); border-radius:3px 3px 0 0; min-height:3px; }
  .spark .b.up{ background:var(--bad); }
  .sparkx{ display:flex; gap:4px; margin-top:6px; font-size:.63rem; color:var(--text-muted); font-weight:700; }
  .sparkx span{ flex:1; text-align:center; overflow:hidden; white-space:nowrap; }
  .note{ margin-top:11px; font-size:.76rem; font-weight:700; line-height:1.75; }
</style>
</head>
<body>
  <div class="nav-bar"></div>
  <div class="container vz" style="padding:16px">
    <div class="card" style="padding:16px">
      <div class="hdr">
        <div>
          <div class="page-title"><i class="fas fa-scale-balanced"></i> مطابقة خزنة visa</div>
          <div style="font-size:.75rem;color:var(--text-muted);font-weight:600;margin-top:4px">
            رصيد visa في eplus يجب أن يساوي: أرصدة المحافظ + غير المحصّل من الماكينات + انستاباي غير المرحّل</div>
        </div>
        <div class="tools">
          <span class="msg" id="msg"></span>
          <span class="chip" id="stamp"></span>
          <button class="btn btn-primary" id="btnRefresh" onclick="refreshNow()">
            <i class="fas fa-rotate"></i> راجع الآن</button>
        </div>
      </div>

      <div class="brs" id="brs"><div class="empty" style="grid-column:1/-1">جارٍ التحميل…</div></div>
      <div id="detail"></div>
    </div>
  </div>

  <script src="config.js?v=20260904c"></script>
  <script src="session.js?v=20261011p"></script>
  <script src="branches.js?v=20260904d"></script>
  <script src="pages.js?v=20260904d"></script>
  <script src="brand.js?v=20261017n"></script>
  <script src="api.js?v=20260926dl"></script>
  <script>
    const REST = SB_URL_API + '/rest/v1/';
    /* الترويسة بتتبني لكل نداء بتوكن المستخدم — التوكن عمره ساعة، فقراءته
       مرة واحدة وقت التحميل بترجّع 401 بعدين. */
    const H = extra => sbH(Object.assign({ 'Content-Type':'application/json' }, extra || {}));

    let DATA = [], CUR = 0, POLL = null;
    const f0 = n => Math.round(Number(n)||0).toLocaleString('en-US');
    const f2 = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    /* كل عرض للوقت بتوقيت القاهرة صراحةً — مش بتوقيت جهاز المستخدم */
    const dt = s => { try{ return new Date(s).toLocaleString('ar-EG',
        { timeZone:'Africa/Cairo', dateStyle:'short', timeStyle:'short' }); }catch(e){ return ''; } };
    const dd = s => { try{ return new Date(s).toLocaleDateString('en-GB',
        { timeZone:'Africa/Cairo', day:'2-digit', month:'2-digit' }); }catch(e){ return ''; } };
    /* «منذ كام يوم» أنفع من تاريخ مجرّد: المقصود قِدَم الحركة مش يومها */
    const ago = s => { try{
        const d = Math.floor((Date.now() - new Date(s).getTime()) / 86400000);
        return d <= 0 ? 'اليوم' : d === 1 ? 'أمس' : 'منذ ' + d + ' يومًا';
      }catch(e){ return ''; } };

    async function rpc(name, body){
      let r, out = null;
      try{
        r = await fetch(REST + 'rpc/' + name, { method:'POST', headers: await H(), body: JSON.stringify(body||{}) });
        try{ out = await r.json(); }catch(e){ out = null; }
      }catch(e){ return { success:false, error:'تعذّر الاتصال بالخادم' }; }
      if(r.ok && out && out.success !== false) return out;
      return { success:false, error: (out && out.error) || sbFailMsg('فشل العملية', r.status) };
    }

    function setMsg(t, cls){ const el=document.getElementById('msg'); el.className='msg '+(cls||''); el.innerHTML=t||''; }

    async function load(){
      const d = await rpc('get_visa_recon', {});
      if(d.success === false){
        document.getElementById('brs').innerHTML =
          '<div class="empty" style="grid-column:1/-1;color:var(--bad)">'+esc(d.error)+'</div>';
        document.getElementById('detail').innerHTML = '';
        return;
      }
      DATA = d.branches || [];
      if(CUR >= DATA.length) CUR = 0;
      renderCards(); renderDetail();
      const st = DATA.map(b=>b.synced_at).filter(Boolean).sort().pop();
      const el = document.getElementById('stamp');
      el.className = 'chip' + (st ? '' : ' warn');
      el.innerHTML = st ? 'آخر سحب: ' + esc(dt(st)) : '⚠️ لم تُسحب أرصدة الخزائن بعد';
    }

    function renderCards(){
      document.getElementById('brs').innerHTML = DATA.length ? DATA.map((b,i)=>{
        const ok  = b.gap != null && Math.abs(Number(b.gap)) < 1;
        const col = b.gap == null ? 'var(--text-muted)' : ok ? 'var(--ok)' : 'var(--bad)';
        return `
        <div class="br ${i===CUR?'on':''}" data-i="${i}" onclick="pick(${i})">
          <div class="nm"><span class="dot" style="background:${col}"></span>${esc(b.branch)}</div>
          ${b.gap == null
            ? `<div class="na">— رصيد visa غير متاح</div>`
            : `<div class="gap" style="color:${col}">${f0(b.gap)}</div>
               <div class="cap">${ok ? 'مطابق' : 'الفرق'}</div>`}
          <div class="pair">
            <span>visa <b>${b.visa==null?'—':f0(b.visa)}</b></span>
            <span style="margin-right:auto">المصادر <b>${f0(b.src_total)}</b></span>
          </div>
        </div>`; }).join('') : '<div class="empty" style="grid-column:1/-1">لا توجد فروع</div>';
    }
    window.pick = i => { CUR = i; renderCards(); renderDetail(); };

    /* ── لوحة المقارنة ─────────────────────────────────────────────
       الشريطان على نفس المقياس، والناقص في الأقصر بيتعلّم بتخطيط =
       الفرق. كده الرسم بيشرح المعادلة من غير ما حد يقرا الأرقام. */
    function cmpPanel(b){
      const visa = Number(b.visa)||0, src = Number(b.src_total)||0;
      const head = `<h4><i class="fas fa-equals" style="color:var(--teal)"></i> ${esc(b.branch)} — المقارنة</h4>`;

      if(b.visa == null){
        return head + `<div class="empty"><i class="fas fa-plug-circle-xmark" style="font-size:1.4rem;display:block;margin-bottom:9px"></i>
          لم يُقرأ رصيد خزنة visa لهذا الفرع بعد.<br>
          مجموع المصادر من بياناتنا: <b style="color:var(--text-primary)">${f2(b.src_total)}</b></div>`;
      }

      const max  = Math.max(visa, src) || 1;
      const seg  = (v, bg) => { const p = (Number(v)||0)/max*100;
        return p <= 0 ? '' : `<div class="eqseg" style="width:${p.toFixed(2)}%;background:${bg}"></div>`; };
      const hseg = v => { const p = (Number(v)||0)/max*100;
        return p <= 0 ? '' : `<div class="eqseg hatch" style="width:${p.toFixed(2)}%"></div>`; };
      const diff = Math.abs(visa - src);
      const ok   = Math.abs(Number(b.gap)) < 1;

      return head + `
        <div class="eqrow"><div class="eqlbl">خزنة visa</div>
          <div class="eqbar">${seg(visa,'var(--teal)')}${src>visa?hseg(src-visa):''}</div>
          <div class="eqval">${f2(visa)}</div></div>
        <div class="eqrow"><div class="eqlbl">مجموع المصادر</div>
          <div class="eqbar">${seg(b.wallets,'var(--c1)')}${seg(b.paymob,'var(--c2)')}${seg(b.insta,'var(--c3)')}${visa>src?hseg(visa-src):''}</div>
          <div class="eqval">${f2(src)}</div></div>
        <div class="lgnd">
          <span class="lgi"><i style="background:var(--c1)"></i> المحافظ وفوري <b>${f0(b.wallets)}</b></span>
          <span class="lgi"><i style="background:var(--c2)"></i> باي موب <b>${f0(b.paymob)}</b></span>
          <span class="lgi"><i style="background:var(--c3)"></i> انستاباي <b>${f0(b.insta)}</b></span>
          ${ok ? '' : `<span class="lgi"><i class="hatch"></i> الفرق <b>${f0(diff)}</b></span>`}
        </div>
        <div class="gapbox ${ok?'ok':'bad'}">
          <div class="v" style="color:${ok?'var(--ok)':'var(--bad)'}">${f2(b.gap)}</div>
          <div class="t">${ok ? 'مطابق ✓' : noData(b)
            ? 'لا توجد بيانات مصادر لهذا الفرع بعد (لا محافظ ولا ماكينات ولا ورديات)، فالفرق يساوي رصيد visa كاملًا — وهذا لا يعني عجزًا.'
            : (Number(b.gap)>0 ? 'رصيد visa أكبر من مجموع المصادر.' : 'مجموع المصادر أكبر من رصيد visa.') +
              '<br>المهم هو <b>تحرُّك</b> هذا الرقم بين مراجعة وأخرى، لا قيمته في حد ذاتها.'}</div>
        </div>`;
    }

    /* ⚠️ فرق بين «مفيش حاجة معلّقة ✓» و«مفيش بيانات أصلًا». السيوف لسه
       مالوش ورديات ولا ماكينات، فعلامة ✓ هناك طمأنة كاذبة. */
    const noData = b => (Number(b.src_total)||0) === 0
      && !(b.wallet_lines||[]).length && !(b.insta_lines||[]).length && !Number(b.paymob_n);

    function walletPanel(b){
      const rows = b.wallet_lines || [];
      const head = `<h4><i class="fas fa-wallet" style="color:var(--c1)"></i> المحافظ وفوري
        <span class="sum" style="color:var(--c1)">${f2(b.wallets)}</span></h4>`;
      if(!rows.length) return `<div class="pnl">${head}<div class="empty flat">لا توجد محافظ مسجَّلة لهذا الفرع.</div></div>`;
      return `<div class="pnl">${head}
        <table class="dtbl"><thead><tr><th>المحفظة</th><th class="n">آخر رصيد في التقفيلة</th></tr></thead><tbody>
        ${rows.map(w=>`<tr><td>${esc(w.name)}</td><td class="n">${f2(w.balance)}</td></tr>`).join('')}
        </tbody></table></div>`;
    }

    function paymobPanel(b){
      const head = `<h4><i class="fas fa-credit-card" style="color:var(--c2)"></i> باي موب
        <span class="sum" style="color:var(--c2)">${f2(b.paymob)}</span></h4>`;
      if(!Number(b.paymob) && !Number(b.paymob_n))
        return `<div class="pnl">${head}<div class="empty flat">${noData(b)
          ? 'لا توجد بيانات ماكينات لهذا الفرع.' : 'لا توجد حركات غير محصّلة ✓'}</div></div>`;
      return `<div class="pnl">${head}
        <div class="big" style="color:var(--c2)">${f2(b.paymob)}</div>
        <div class="bigcap">غير المحصّل — لم يصل من البنك بعد</div>
        <div class="meta">
          <div><div class="k">عدد الحركات</div><div class="v">${f0(b.paymob_n)}</div></div>
          <div><div class="k">أقدم حركة</div><div class="v">${b.paymob_oldest
            ? esc(dd(b.paymob_oldest)) + ' <span style="font-size:.68rem;color:var(--text-muted);font-weight:700">· ' + esc(ago(b.paymob_oldest)) + '</span>'
            : '—'}</div></div>
        </div></div>`;
    }

    function instaPanel(b){
      const rows = b.insta_lines || [];
      const head = `<h4><i class="fas fa-bolt" style="color:var(--c3)"></i> انستاباي غير المرحّل
        <span class="sum" style="color:var(--c3)">${f2(b.insta)}</span></h4>`;
      if(!rows.length) return `<div class="pnl">${head}<div class="empty flat">${noData(b)
        ? 'لا توجد ورديات مسجَّلة لهذا الفرع.' : 'كل الورديات مُرحَّلة ✓'}</div></div>`;
      return `<div class="pnl">${head}
        <table class="dtbl"><thead><tr><th>الوردية</th><th class="n">الباقي</th></tr></thead><tbody>
        ${rows.map(x=>`<tr><td>${esc(x.emp||'—')}<span class="sub2">${esc(dd(x.at))} · ${esc(ago(x.at))}</span></td>
          <td class="n">${f2(x.amount)}</td></tr>`).join('')}
        </tbody></table></div>`;
    }

    function renderDetail(){
      const b = DATA[CUR]; if(!b){ document.getElementById('detail').innerHTML=''; return; }
      document.getElementById('detail').innerHTML = `
        <div class="grid2">
          <div class="pnl">${cmpPanel(b)}</div>
          <div class="pnl">
            <h4><i class="fas fa-chart-column" style="color:var(--teal)"></i> اتجاه الفرق</h4>
            <div id="trend"><div class="empty flat">جارٍ التحميل…</div></div>
          </div>
        </div>
        <div class="grid3">${walletPanel(b)}${paymobPanel(b)}${instaPanel(b)}</div>`;
      loadTrend(b.branch);
    }

    async function loadTrend(branch){
      const el = document.getElementById('trend'); if(!el) return;
      let rows = [];
      try{
        const r = await fetch(REST + 'visa_recon_snapshots?select=taken_at,gap'
          + '&branch=eq.' + encodeURIComponent(branch)
          + '&order=taken_at.desc&limit=30', { headers: await H() });   // data-ok: آخر 30 مراجعة لفرع واحد
        rows = (await r.json()) || [];
      }catch(e){ rows = []; }
      if(rows.length < 2){
        el.innerHTML = `<div class="empty flat"><i class="fas fa-hourglass-start" style="font-size:1.3rem;display:block;margin-bottom:9px"></i>
          يبدأ الرسم بعد مراجعتين. كل ضغطة على «راجع الآن» تُسجَّل كنقطة،
          والمهم هو <b style="color:var(--text-primary)">تحرُّك</b> الفرق لا وجوده.</div>`;
        return;
      }
      rows = rows.reverse();
      const vals = rows.map(r=>Math.abs(Number(r.gap)||0));
      const mx = Math.max(...vals, 1);
      const first = Number(rows[0].gap)||0, last = Number(rows[rows.length-1].gap)||0;
      const delta = last - first;
      /* تواريخ الـ30 عمود بتتداخل وتبقى سطر مهوّش — الأول والأخير بس */
      const lbl = i => (i===0 || i===rows.length-1) ? esc(dd(rows[i].taken_at)) : '';
      el.innerHTML = `
        <div class="spark">${rows.map((r,i)=>{
          const v = Math.abs(Number(r.gap)||0);
          const grew = i>0 && v > Math.abs(Number(rows[i-1].gap)||0) + 0.5;
          return `<div class="b ${grew?'up':''}" style="height:${Math.max(3,(v/mx*100)).toFixed(1)}%"
                    title="${esc(dt(r.taken_at))} — ${f2(r.gap)}"></div>`;
        }).join('')}</div>
        <div class="sparkx">${rows.map((r,i)=>`<span>${lbl(i)}</span>`).join('')}</div>
        <div class="note" style="color:${Math.abs(delta)<1?'var(--ok)':'var(--bad)'}">
          ${Math.abs(delta)<1 ? 'الفرق ثابت منذ أول مراجعة ✓ — غالبًا رصيد افتتاحي، لا حركة جارية.'
            : 'تحرَّك الفرق بمقدار ' + f2(delta) + ' منذ أول مراجعة معروضة — يحتاج تفسيرًا.'}
        </div>`;
    }

    /* ── السحب اللحظي ──
       الشاشة ما تقدرش تكلّم eplus (عناوين محلية)، فبتسجّل طلب والمحرّك
       اللي جوّه الشبكة ينفّذه في نبضته الجاية. */
    async function refreshNow(){
      const btn = document.getElementById('btnRefresh');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ السحب…';
      setMsg('تم إرسال الطلب — في انتظار محرّك المزامنة…', 'wait');

      const r = await rpc('request_visa_refresh', {});
      if(r.success === false){
        setMsg(esc(r.error), 'err');
        doneBtn();
        return;
      }
      waitFor(r.request_id);
    }

    function doneBtn(){
      const btn = document.getElementById('btnRefresh');
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-rotate"></i> راجع الآن';
    }

    function waitFor(id){
      clearInterval(POLL);
      POLL = setInterval(async () => {
        const s = await rpc('get_visa_refresh_status', { p_id: id });
        if(s.success === false) return;
        const w = Number(s.waited_seconds) || 0;
        if(s.status === 'done'){
          clearInterval(POLL);
          await rpc('save_visa_recon_snapshot', {});   // كل مراجعة = نقطة في الاتجاه
          await load();
          setMsg('تم السحب والمراجعة ✓', '');
          doneBtn();
          setTimeout(()=>setMsg(''), 4000);
          return;
        }
        if(s.status === 'error'){
          clearInterval(POLL);
          setMsg('فشل السحب — ' + esc(s.message || 'خطأ غير معروف'), 'err');
          doneBtn();
          return;
        }
        /* ⚠️ انتظار صامت أسوأ من رسالة: لو المحرّك واقف الطلب هيفضل
           pending للأبد من غير ما حد يعرف. */
        if(w > 300){
          clearInterval(POLL);
          setMsg('الطلب ما زال معلّقًا بعد ' + Math.round(w/60) + ' دقائق — محرّك المزامنة لا يستجيب.', 'err');
          doneBtn();
          return;
        }
        setMsg('في انتظار محرّك المزامنة… (' + w + ' ثانية)', 'wait');
      }, 5000);
    }

    checkAuth().then(user => { if(!user) return; load(); });
  </script>
</body>
</html>
