<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة: أكثر الأصناف طلبًا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
  --border:#e2e8f0; --text:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
  --primary:#0d9488; --danger:#dc2626; --warning:#ea580c;
}
body{font-family:Cairo,sans-serif;background:var(--bg);margin:0;padding:22px;color:var(--text)}
.wrap{max-width:780px;margin:0 auto}
.hint{font-size:.78rem;color:var(--text-muted);font-weight:600;margin:0 0 14px;line-height:1.9}
.hint b{color:var(--text-secondary)}

/* نفس ستايل كارت «تصنيف العميل» الموجود في الشاشة */
.rate-card{margin-top:18px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.rate-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;
  background:rgba(0,0,0,.03);border-bottom:1px solid var(--border);
  font-size:.85rem;font-weight:700;color:var(--text-secondary)}
.rate-head .rate-note{font-weight:400;font-size:.72rem;color:var(--text-muted)}
.rate-body{padding:14px}

/* ===== الكارت الجديد ===== */
.ti-tools{display:flex;gap:6px;align-items:center;margin-inline-start:auto}
.ti-tools select{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--surface);
  font-family:Cairo;font-size:.72rem;font-weight:700;color:var(--text-secondary);padding:0 6px;outline:none}

.ti-table{width:100%;border-collapse:collapse;font-size:.8rem}
.ti-table th{font-size:.68rem;color:var(--text-muted);font-weight:700;text-align:right;
  padding:0 8px 7px;border-bottom:1px solid var(--border);white-space:nowrap}
.ti-table td{padding:8px;border-bottom:1px solid var(--surface-3);vertical-align:middle}
.ti-table tr:last-child td{border-bottom:0}
.ti-table tr:hover td{background:var(--surface-2)}

.ti-rank{width:22px;height:22px;border-radius:50%;background:var(--surface-3);color:var(--text-secondary);
  font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.ti-rank.top{background:var(--primary);color:#fff}
.ti-nm{font-weight:700;line-height:1.4}
.ti-code{font-size:.68rem;color:var(--text-muted);font-family:monospace}

/* شريط التكرار — يقرا بالعين من غير ما تقارن أرقام */
.ti-bar{display:flex;align-items:center;gap:7px;min-width:120px}
.ti-bar .bar{flex:1;height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.ti-bar .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.ti-bar b{font-size:.82rem;min-width:16px;text-align:left}

.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--text-muted);font-size:.74rem;white-space:nowrap}
.ti-ago{font-size:.7rem;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.ago-new{background:#ecfdf5;color:#047857}
.ago-mid{background:#f1f5f9;color:#475569}
.ago-old{background:#fff7ed;color:#c2410c}
.ti-ret{font-size:.68rem;font-weight:700;color:var(--warning);white-space:nowrap}

.ti-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);
  font-size:.72rem;color:var(--text-muted);font-weight:600}
.ti-foot b{color:var(--text-secondary)}
.ti-empty{color:var(--text-muted);font-size:.8rem;padding:10px 2px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <p class="hint">
    معاينة على بيانات حقيقية — العميل <b>اللواء طارق حجازي (6096)</b>، 109 فواتير و130 صنف.<br>
    الكارت ده هيقع <b>تحت كارت «تصنيف العميل»</b> في شاشة العملاء، بنفس الستايل بالظبط.
  </p>

  <!-- ====== الكارت ====== -->
  <div class="rate-card">
    <div class="rate-head">
      <span>🧾 أكثر الأصناف طلبًا</span>
      <span class="rate-note">مرتّبة بعدد الفواتير اللي اتطلب فيها الصنف · المرتجع مخصوم</span>
      <span class="ti-tools">
        <select><option>كل الفترة</option><option>آخر 3 شهور</option><option>آخر 6 شهور</option></select>
      </span>
    </div>
    <div class="rate-body">
      <table class="ti-table">
        <thead>
          <tr>
            <th style="width:26px"></th>
            <th>الصنف</th>
            <th style="width:135px">عدد المرات</th>
            <th class="num" style="width:52px">الكمية</th>
            <th class="num" style="width:74px">القيمة</th>
            <th style="width:96px">آخر مرة</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
      <div class="ti-foot" id="foot"></div>
    </div>
  </div>

</div>

<script>
/* البيانات دي ناتج الاستعلام الحقيقي على العميل 6096 */
const ROWS = [
  { code:'srb',   nm:'سرنجة ادويه 5 مل',          times:17, qty:23, value:115,  last:'2026-10-12', days:23, ret:1 },
  { code:'9795',  nm:'اوتريفين بيبى سالين15م س ج', times:12, qty:15, value:300,  last:'2026-11-01', days:3,  ret:1 },
  { code:'5676',  nm:'ايراستابكس 20مجم 30قرص',     times:8,  qty:8,  value:200,  last:'2026-11-02', days:2,  ret:0 },
  { code:'59289', nm:'ايزيس كاموميل 20كيس',        times:6,  qty:6,  value:240,  last:'2026-10-27', days:8,  ret:0 },
  { code:'srb10', nm:'سرنجة ادويه 10 مل',          times:6,  qty:8,  value:64,   last:'2026-11-01', days:3,  ret:0 },
  { code:'dw',    nm:'ماء مذيب مقطر 60 مل',        times:6,  qty:10, value:20,   last:'2026-10-08', days:27, ret:0 },
  { code:'74526', nm:'اميوتونكس 60مل شراب',        times:5,  qty:5,  value:1000, last:'2026-10-24', days:11, ret:0 },
  { code:'68801', nm:'هيربانا 30 كبسولة',          times:5,  qty:6,  value:720,  last:'2026-10-28', days:7,  ret:0 },
  { code:'61420', nm:'زيروفازيت 20/10مجم 30 قرص',  times:5,  qty:5,  value:490,  last:'2026-09-25', days:40, ret:0 },
  { code:'71605', nm:'دوليبران 1000 مجم 20 قرص',   times:5,  qty:5,  value:210,  last:'2026-10-04', days:31, ret:0 }
];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0  = v => (+v||0).toLocaleString('en-US');

/* شريحة «آخر مرة»: اللون بيقول قريب ولا بعيد من غير ما تحسب */
function ago(d){
  const k = d <= 14 ? 'ago-new' : d <= 60 ? 'ago-mid' : 'ago-old';
  const t = d === 0 ? 'النهاردة' : d === 1 ? 'إمبارح' : 'من ' + n0(d) + ' يوم';
  return '<span class="ti-ago '+k+'">'+t+'</span>';
}

const max = Math.max.apply(null, ROWS.map(r => r.times)) || 1;
document.getElementById('tb').innerHTML = ROWS.map((r,i) =>
  '<tr>'
  + '<td><div class="ti-rank'+(i===0?' top':'')+'">'+(i+1)+'</div></td>'
  + '<td><div class="ti-nm">'+esc(r.nm)+'</div><div class="ti-code">'+esc(r.code)+'</div></td>'
  + '<td><div class="ti-bar"><div class="bar"><i style="width:'+Math.round(100*r.times/max)+'%"></i></div>'
      + '<b class="num">'+n0(r.times)+'</b></div>'
      + (r.ret ? '<div class="ti-ret">رجّع '+n0(r.ret)+'</div>' : '') + '</td>'
  + '<td class="num mut">'+n0(r.qty)+'</td>'
  + '<td class="num">'+n0(r.value)+' <span class="mut">ج</span></td>'
  + '<td>'+ago(r.days)+'</td>'
  + '</tr>').join('');

document.getElementById('foot').innerHTML =
  'إجمالي الأصناف المختلفة: <b>130</b>'
  + ' · الفواتير: <b>109</b>'
  + ' · قيمة أكثر 10 أصناف: <b>' + n0(ROWS.reduce((s,r)=>s+r.value,0)) + ' ج</b>';
</script>
</body>
</html>
